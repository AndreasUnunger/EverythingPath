name: Exceptional Aid
system:
  description:
    value: >-
      <p><em>You're always ready to lend your partner a
      hand.</em></p><p><strong>Prerequisites</strong>: Bonded
      Mind.</p><p><strong>Benefits</strong>: When you successfully use the Aid
      Another action to assist an ally's skill check, and the ally also has this
      feat, the bonus is +4 instead of +2.</p><p><strong>Pathfinder Society<br
      /></strong>A PC cannot benefit from the feat Bonded Mind or any teamwork
      feats that use it as a prerequisite unless he permanently possesses the
      feat; this is an exception to how an inquisitor's solo tactics ability, a
      cavalier's tactician ability, and similar abilities function.</p>
  tags:
    - Teamwork
type: feat
