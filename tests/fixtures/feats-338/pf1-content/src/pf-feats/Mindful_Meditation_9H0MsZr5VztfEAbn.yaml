name: Mindful Meditation
system:
  description:
    value: >-
      <p><em>You clear your mind of stress and emotion by focusing on calming
      breathing exercises.</em></p><p><strong>Prerequisites</strong>: Wis 11,
      Meditation Master.</p><p><strong>Benefits</strong>: For 24 hours after you
      meditate, you gain a +1 bonus on Will saving throws against charm,
      compulsion, emotion, and fear effects, and increase the Bluff DC to feint
      you and the Intimidate DC to demoralize you by +5. These bonuses increase
      by 1 for every 5 Hit Dice you have to a maximum increase of +4 at 20 Hit
      Dice.</p>
  tags:
    - Meditation
type: feat
