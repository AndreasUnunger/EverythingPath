name: Aspiring Noble
system:
  description:
    value: >-
      <p><em>You strive to be seen as a legitimate
      noble.</em></p><p><strong>Prerequisites</strong>: Must be a member of an
      established family that is yet unrecognized as
      nobility.</p><p><strong>Benefits</strong>: You have learned to further
      your name among the people. Choose a settlement and either Diplomacy or
      Intimidate. While in your chosen settlement, you gain a +2 bonus on checks
      with the chosen skill when dealing with the commoners of that settlement.
      If you have 10 or more ranks in the chosen skill, the bonus increases to
      +4.</p><p><strong>Goal</strong>: Have your family recognized as nobility
      by either three established noble families or a ruling
      monarch.</p><p><strong>Completion Benefit</strong>: You gain a +2 bonus on
      checks with your chosen skill when dealing with the rest of the citizens
      of your chosen settlement. Your bonus to interact with commoners increases
      to +4, or it increases to +6 if you have 10 or more ranks in your chosen
      skill.</p>
  tags:
    - Story
type: feat
