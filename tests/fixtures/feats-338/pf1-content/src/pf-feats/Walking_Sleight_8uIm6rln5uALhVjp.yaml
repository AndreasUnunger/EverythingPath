name: Walking Sleight
system:
  description:
    value: >-
      <p><em>You've developed your skills at picking up items while on the
      move.</em></p><p><strong>Prerequisites</strong>: Deft Hands, Sleight of
      Hand 5 ranks.</p><p><strong>Benefits</strong>: You no longer take the -20
      penalty for attempting a Sleight of Hand check as a move action. You can
      attempt a Sleight of Hand check as a standard action in the middle of your
      move action.</p><p><strong>Normal</strong>: You can attempt a Sleight of
      Hand check as a move action only by taking a -20 penalty on the check.</p>
  tags:
    - General
type: feat
