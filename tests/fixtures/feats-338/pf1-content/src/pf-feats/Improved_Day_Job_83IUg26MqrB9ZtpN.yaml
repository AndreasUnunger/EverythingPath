name: Improved Day Job
system:
  description:
    value: >-
      <p><em>You learned the importance of an honest day's work while training
      as an initiate of the Pathfinder
      Society.</em></p><p><strong>Prerequisites</strong>: Ability to attempt Day
      Job checks (see the Guide to Pathfinder Society Organized
      Play).</p><p><strong>Benefits</strong>: You gain a +3 bonus on Day Job
      checks using one skill you choose when you take this feat. This bonus
      stacks with other feats that grant a bonus to the chosen skill, including
      Skill Focus.</p>
