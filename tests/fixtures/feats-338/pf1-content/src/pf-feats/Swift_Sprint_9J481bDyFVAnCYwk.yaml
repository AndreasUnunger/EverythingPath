name: Swift Sprint
system:
  description:
    value: >-
      <p><em>You balance your armor expertly, allowing you to run and sprint
      without impediment.</em></p><p><strong>Prerequisites</strong>: Str 13, Dex
      13, Swift Iron Style, Swift Refuge, proficiency with medium
      armor.</p><p><strong>Benefits</strong>: When you're charging, running, or
      taking no action in your turn other than movement, your armor does not
      reduce your movement.</p>
  tags:
    - Combat
type: feat
