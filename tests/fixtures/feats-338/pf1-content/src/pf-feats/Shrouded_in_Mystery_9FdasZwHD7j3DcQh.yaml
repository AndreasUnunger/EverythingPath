name: Shrouded in Mystery
system:
  description:
    value: >-
      <p><em>Common folk have many superstitious rumors about your kind--tall
      tales born out of ignorance and fear alike. Whether or not what they say
      about your race is true is irrelevant, as you use their beliefs to take
      advantage of them whenever you
      can.</em></p><p><strong>Prerequisites</strong>: Bluff 1 rank; Disguise 1
      rank; kitsune, nagaji, samsaran, tengu, or
      wayang.</p><p><strong>Benefits</strong>: You gain a +2 insight bonus on
      Will saves against mind-affecting spells and effects and a +3 insight
      bonus on Bluff checks. Both benefits apply only against humanoid creatures
      of races other than your own.</p>
  tags:
    - Racial
    - Tengu
