name: Amplified Rage
system:
  description:
    value: >-
      <p><em>When adjacent to other raging allies, your rages become even more
      powerful.</em></p><p><strong>Prerequisites</strong>: Half-orc or orc, rage
      class feature.</p><p><strong>Benefits</strong>: Whenever you are raging
      and adjacent to a raging ally who also has this feat or flanking the same
      opponent as a raging ally with this feat, your morale bonuses to Strength
      and Constitution increase by +4. This feat does not stack with itself (you
      only gain this bonus from one qualifying ally, regardless of how many are
      adjacent to you).</p>
  tags:
    - Teamwork
    - Racial
    - Half-Orc
    - Orc
type: feat
