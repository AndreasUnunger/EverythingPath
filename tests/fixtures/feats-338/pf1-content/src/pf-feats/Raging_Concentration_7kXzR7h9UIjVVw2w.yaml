name: Raging Concentration
system:
  description:
    value: >-
      <p><em>When you are in the heat of rage, not even pain can break your
      concentration.</em></p><p><strong>Prerequisites</strong>: Blood casting
      class feature.</p><p><strong>Benefits</strong>: While in a bloodrage, you
      gain a bonus on concentration checks equal to the morale bonus granted to
      your Constitution by the bloodrage.</p>
