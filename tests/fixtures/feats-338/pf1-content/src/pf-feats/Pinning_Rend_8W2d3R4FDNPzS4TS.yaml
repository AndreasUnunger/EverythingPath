name: Pinning Rend
system:
  description:
    value: >-
      <p><em>You tear flesh when you damage an opponent that you have
      pinned.</em></p><p><strong>Prerequisites</strong>: Dex 13, Greater
      Grapple, Improved Grapple, Improved Unarmed Strike, base attack bonus +9
      or monk level 9th.</p><p><strong>Benefits</strong>: While you have an
      opponent pinned, when you succeed at a grapple combat maneuver check to
      deal an opponent damage using an unarmed strike or a light or one-handed
      weapon, that opponent also takes bleed damage equal to your unarmed strike
      or weapon damage dice. Any creature that is immune to critical hits is
      immune to the effects of this feat.</p><h3>Combat Trick</h3><p>: When you
      deal bleed damage with this feat, you can spend up to 5 stamina points to
      increase the bleed damage by an amount equal to the number of stamina
      points you spent.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
