name: Feint Defender
system:
  description:
    value: >-
      <p><em>You use your shield to conceal your own body language and keep your
      attention focused.</em></p><p><strong>Prerequisites</strong>: Shield
      Focus, base attack bonus +6 or fighter level 4th, Sense Motive 1
      rank.</p><p><strong>Benefits</strong>: You add your shield's bonus to AC
      to the DC of feint attempts against you.</p><p><strong>Combat
      Trick</strong>: You can spend 5 stamina points to force a foe to attempt
      two Bluff checks when trying to feint against you in combat, and use the
      lower of the two results. (See page 18.)</p>
  tags:
    - Combat
    - Shield Mastery
type: feat
