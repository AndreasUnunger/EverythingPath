name: Shaitan Skin
system:
  description:
    value: >-
      <p><em>You can manipulate acid to shield yourself and disable your
      enemies.</em></p><p><strong>Prerequisites</strong>: Con 15, Wis 15,
      Elemental Fist, Improved Unarmed Strike, Shaitan Style, base attack bonus
      +11 or monk level 9th.</p><p><strong>Benefits</strong>: You gain one
      additional Elemental Fist (Advanced Player's Guide 158) attempt per day.
      While using the Shaitan Style feat, you gain acid resistance equal to your
      base attack bonus, or your monk level plus BAB gained from levels in
      classes other than monk, whichever is higher. While denied your Dexterity
      bonus to AC you are also denied this resistance. Creatures that take acid
      damage from your Elemental Fist attack must succeed at a Reflex save (DC
      10 + 1/2 your character level + your Wis modifier) or be staggered for 1
      round.</p><h3>Combat Trick</h3><p>: When you make an Elemental Fist
      attack, you can spend up to 5 stamina points to increase the DC of the
      saving throw to avoid being staggered by an amount equal to the number of
      stamina points you spent.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
