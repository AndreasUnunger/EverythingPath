name: Unraveling Blood
system:
  description:
    value: >-
      <p><em>Your toxic blood has the power to destroy both flesh and foul
      curses.</em></p><p><strong>Prerequisites</strong>: Dispelling Blood,
      Knowledge (arcana) 9 ranks, vishkanya.</p><p><strong>Benefits</strong>: As
      a swift action, you can alter the effects of your vishkanya venom to
      function as break enchantment when striking a creature, using your
      character level as your caster level. This dispelling effect affects
      creatures even if they are immune to poison
      effects.</p><p><strong>Normal</strong>: Vishkanya venom deals Dexterity
      damage.</p>
  tags:
    - Racial
    - Vishkanya
type: feat
