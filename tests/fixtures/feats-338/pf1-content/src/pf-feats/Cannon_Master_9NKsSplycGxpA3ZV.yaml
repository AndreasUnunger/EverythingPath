name: Cannon Master
system:
  description:
    value: >-
      <p><em>You have learned how to keep firearm siege engines ready for battle
      despite harrowing
      circumstances.</em></p><p><strong>Prerequisites</strong>: Siege Engineer,
      Knowledge (engineering) or Profession (siege engineer) 7 ranks,
      proficiency with at least one firearm siege
      engine.</p><p><strong>Benefits</strong>: You gain a +2 competence bonus on
      any Craft (siege engine) checks made to repair a firearm siege engine. In
      addition, if you are the crew leader for a firearm siege engine with the
      broken condition, that siege engine's misfire range is increased by only 2
      instead of by 4, and the broken siege engine must misfire twice before it
      explodes.</p>
  tags:
    - Combat
type: feat
