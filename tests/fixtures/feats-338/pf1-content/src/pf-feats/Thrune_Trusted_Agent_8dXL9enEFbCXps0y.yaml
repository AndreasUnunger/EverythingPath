name: Thrune Trusted Agent
system:
  description:
    value: >-
      <p><em>Your supernatural bond to other Thrune agents strengthens your
      resolve and allows you to bolster your
      allies.</em></p><p><strong>Prerequisites</strong>: Thrune Loyal Agent
      trait.</p><p><strong>Benefits</strong>: Whenever you are within 30 feet of
      an ally who also has this feat, you gain a +1 profane bonus on Reflex and
      Will saving throws. In addition, once per day as a swift action, you can
      forfeit the saving throw bonuses granted by this feat to increase the
      effectiveness of the aid another action. For a number of rounds equal to
      your Charisma modifier (minimum 1), when you use the aid another action to
      aid an ally who also has this feat, the bonus you grant to an ally's AC,
      attack roll, or skill check is increased to +4 instead of the usual +2.
      You don't benefit from the feat's saving throw bonuses for 24 hours,
      though you still qualify as having this feat for the purpose of other
      characters gaining the bonuses.</p>
  tags:
    - Teamwork
type: feat
