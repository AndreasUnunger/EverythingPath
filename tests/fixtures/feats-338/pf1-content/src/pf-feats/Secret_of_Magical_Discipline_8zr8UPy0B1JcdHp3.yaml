name: Secret of Magical Discipline
system:
  description:
    value: >-
      <p><em>Your study and devotion to magic allows you to access spells beyond
      your ken.</em></p><p><strong>Prerequisites</strong>: Secret class
      feature.</p><p><strong>Benefits</strong>: Once per day, you can cast any
      spell as if it were one of your prepared spells or spells known. This
      action expends either a spell slot or a prepared spell of the same spell
      level. Casting a spell this way always has a minimum casting time of 1
      full round.</p><p><strong>Special</strong>: You can gain this feat
      multiple times. Each time you take the feat, you can use this ability one
      additional time per day.</p>
  tags:
    - General
type: feat
