    value: >-
      <p><em>Though hordes stand against you, they rarely stand
      long.</em></p><p><strong>Prerequisites</strong>: Improved Bull Rush,
      worshiper of Rovagug.</p><p><strong>Benefits</strong>: When you bull rush
