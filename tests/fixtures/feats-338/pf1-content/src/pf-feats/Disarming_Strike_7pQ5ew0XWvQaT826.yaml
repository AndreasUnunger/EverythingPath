name: Disarming Strike
system:
  description:
    value: >-
      <p><em>Your critical hits can disarm your
      foes.</em></p><p><strong>Prerequisites</strong>: Int 13, Combat Expertise,
      Improved Disarm, base attack bonus +9.</p><p><strong>Benefits</strong>:
      Whenever you score a critical hit with a melee attack, you can disarm your
      opponent, in addition to the normal damage dealt by the attack. If your
      confirmation roll exceeds your opponent's CMD, you may disarm your
      opponent as if from the disarm combat maneuver. This does not provoke an
      attack of opportunity.</p><p><strong>Normal</strong>: You must perform a
      disarm combat maneuver to disarm an
      opponent.</p><p><strong>Special</strong>: You can only apply the effects
      of one of the following feats to a given critical hit</p><p><strong>Combat
      Trick</strong>: When you fail to confirm a critical hit with a melee
      attack, you can spend 2 stamina points to attempt to disarm the target
      anyway. When you do, reroll the confirmation roll and use it to determine
      if the disarm attempt exceeds the opponent's CMD. This reroll is used only
      for the disarm combat maneuver; it can't cause the critical to be
      confirmed. You still can't make the attempt if the target is immune to
      critical hits.</p>
  tags:
    - Combat
type: feat
