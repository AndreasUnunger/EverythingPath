name: We are the Wall
system:
  description:
    value: >-
      <p><em>You embody your family's legendary
      monster-hunters.</em></p><p><strong>Prerequisites</strong>: Be a member of
      House Darahan, or have the Champion of the People, Duty, or Raider
      background.</p><p><strong>Benefits</strong>: Three times per day as a move
      action, you can declare a single dragon, magical beast, or monstrous
      humanoid within 50 feet and in line of sight to be your mark. You gain a
      +1 bonus on attack rolls and on Bluff, Knowledge, Perception, Sense
      Motive, and Survival checks against your mark. These bonuses last for 1
      minute, until you designate a new mark, or until the mark is dead. After
      you have declared a creature as your mark, it can't be your mark again for
      another 24 hours.</p><p><strong>Goal</strong>: Protect a settlement you
      have lived in for at least a year from an invading force consisting of an
      appropriate number of dragons, magical beasts, or monstrous
      humanoids.</p><p><strong>Completion Benefit</strong>: The bonus provided
      by your mark becomes +1 for every 4 character levels you have, to a
      maximum of +5.</p>
  tags:
    - Story
type: feat
