name: Read the Room
system:
  description:
    value: >-
      <p><em>You can gain some insight into the mood of a crowd with just a
      look.</em></p><p><strong>Prerequisites</strong>: Drunken Sing-Along,
      Diplomacy 1 rank, Performance (sing) 1 rank, Sense Motive 1
      rank.</p><p><strong>Benefits</strong>: Before you use the Drunken
      Sing-Along feat, you can attempt a DC 20 Sense Motive check as a free
      action to pick the exact right song for that crowd. If you are successful,
      you gain a +4 circumstance bonus on your next Diplomacy check to gather
      information in that tavern.</p>
  tags:
    - General
type: feat
