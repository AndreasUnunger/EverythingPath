name: Rubble Skirmisher
system:
  description:
    value: >-
      <p><em>You use difficult terrain to your advantage when performing combat
      maneuvers.</em></p><p><strong>Prerequisites</strong>: Dex 13, Nimble
      Moves, base attack bonus +2.</p><p><strong>Benefits</strong>: When you are
      in a square that has naturally occurring difficult terrain (bushes,
      rubble, undergrowth, and so forth), you gain a +2 circumstance bonus on
      combat maneuver checks and to your CMD.</p>
  tags:
    - Combat
type: feat
