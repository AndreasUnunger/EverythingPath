name: Saving Shield
system:
  description:
    value: >-
      <p><em>You deflect attacks that could mean your ally's
      death.</em></p><p><strong>Prerequisites</strong>: Shield
      Proficiency.</p><p><strong>Benefits</strong>: Whenever an adjacent ally is
      the target of an attack, you can, as an immediate action, grant that
      adjacent ally a +2 shield bonus to AC. You must be wielding a light
      shield, heavy shield, or tower shield to use this feat.</p><h3>Combat
      Trick</h3><p>: When you use this feat, you can spend 2 stamina points to
      increase the shield bonus granted to your ally by an amount equal to the
      enhancement bonus of the shield you are using.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
