name: Undead Master
system:
  description:
    value: >-
      <p><em>You can marshal vast armies of the undead to serve
      you.</em></p><p><strong>Prerequisites</strong>: Spell focus (necromancy),
      the ability to cast animate dead or command
      undead.</p><p><strong>Benefits</strong>: When you cast animate dead or use
      the Command Undead feat, you are considered to be four levels higher when
      determining the number of Hit Dice you animate. When you cast command
      undead, your duration is doubled.</p>
