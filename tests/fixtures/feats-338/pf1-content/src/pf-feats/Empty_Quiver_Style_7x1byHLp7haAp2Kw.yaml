name: Empty Quiver Style
system:
  description:
    value: >-
      <p><em>You can fight in melee with your bow, crossbow, or
      firearm.</em></p><p><strong>Prerequisites</strong>: Weapon Focus with the
      chosen weapon.</p><p><strong>Benefits</strong>: While using this style,
      you can make melee attacks with the chosen weapon as if it were a heavy
      mace (or a light mace for melee attack made with a hand crossbow or
      one-handed firearm), though you don't automatically threaten the area
      around you as if you were wielding a melee weapon. You can switch between
      melee and ranged attacks with this weapon without penalty, even during the
      same round. In addition, you ignore the elf prerequisite for the Stabbing
      Shot feat. If you have the Stabbing Shot feat, you can use it with a
      crossbow or firearm, substituting a loaded bolt or firearm ammunition for
      an arrow.</p><p><strong>Special</strong>: In addition to the chosen
      weapon, a character with this feat and the weapon training (bows,
      crossbows, or firearms) class feature can use Empty Quiver Style with any
      bow, crossbow, or firearm, respectively.</p>
  tags:
    - Combat
    - Style
type: feat
