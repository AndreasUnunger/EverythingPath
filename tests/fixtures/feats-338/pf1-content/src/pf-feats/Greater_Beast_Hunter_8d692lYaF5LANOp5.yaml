name: Greater Beast Hunter
system:
  description:
    value: >-
      <p><em>You are an apex hunter.</em></p><p><strong>Prerequisites</strong>:
      Beast Hunter; Improved Beast Hunter; base attack bonus +6; Knowledge
      (nature) or Survival 6 ranks.</p><p><strong>Benefits</strong>: If you are
      surprised by an animal native to the terrain you have chosen for Beast
      Hunter, you can act normally in the surprise round, though you are still
      considered flat-footed until it is your turn to act. You also gain a +4
      bonus to confirm critical threats against animals native to the terrain
      you have chosen.</p><p><strong>Special</strong>: If you have selected
      Beast Hunter multiple times, you gain the benefits of this feat for all of
      the terrains you have chosen for those feats.</p>
  tags:
    - Combat
type: feat
