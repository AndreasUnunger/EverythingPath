name: Dirty Grapple
system:
  description:
    value: >-
      <p><em>You are skilled at pulling dirty tricks during a
      grapple.</em></p><p><strong>Prerequisites</strong>: Dex 13, Int 13, Combat
      Expertise, Improved Dirty Trick, Improved Grapple, Improved Unarmed
      Strike, base attack bonus +6.</p><p><strong>Benefits</strong>: You can
      attempt to perform a dirty trick and a grapple maneuver together against a
      single target as a full-round action when initiating or maintaining a
      grapple. You must attempt a single combat maneuver check for both
      maneuvers. If your CMB is different for the two types of maneuvers, use
      the lower of the two bonuses. If your target's CMD is different against
      the two types of maneuvers, use the higher CMD. If you succeed at the
      check, you successfully perform both combat maneuvers.</p>
  tags:
    - Combat
type: feat
