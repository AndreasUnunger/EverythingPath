name: Disengaging Feint
system:
  description:
    value: >-
      <p><em>You can feint to disengage from
      combat.</em></p><p><strong>Prerequisites</strong>: Int 13, Combat
      Expertise, Improved Feint.</p><p><strong>Benefits</strong>: As a standard
      action, use Bluff to feint against an opponent. Instead of denying that
      opponent his Dexterity bonus to AC, a successful feint allows you to move
      up to your speed without provoking an attack of opportunity from the
      opponent you feinted for leaving the square you start in.</p><h3>Combat
      Trick</h3><p>You can select this feat even if you don't meet the ability
      score prerequisite (Intelligence 13). You gain the benefits of this feat
      only as long as you have at least 1 stamina point in your stamina pool.
      You can spend 5 stamina points to attempt a Disengaging Feint as a move
      action instead of a standard action.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
