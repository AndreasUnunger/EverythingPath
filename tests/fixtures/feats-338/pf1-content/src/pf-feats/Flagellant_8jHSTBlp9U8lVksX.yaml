name: Flagellant
system:
  description:
    value: >-
      <p><em>You have learned to ignore the effects of pain through long years
      of exposure to it.</em></p><p><strong>Prerequisites</strong>: Endurance,
      character level 7th, worshiper of
      Zon-Kuthon.</p><p><strong>Benefits</strong>: You gain a +4 bonus on saving
      throws against pain effects. Also, you suffer no adverse effect when your
      nonlethal damage equals your current hit points, and you become staggered
      when your nonlethal damage exceeds your current hit points. You never fall
      unconscious due to nonlethal damage.</p><p><strong>Normal</strong>: When
      your nonlethal damage equals your current hit points, you become
      staggered. When your nonlethal damage exceeds your current hit points, you
      fall unconscious.</p>
  tags:
    - General
type: feat
