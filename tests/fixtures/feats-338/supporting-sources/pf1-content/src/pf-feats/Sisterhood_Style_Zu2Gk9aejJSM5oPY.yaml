name: Sisterhood Style
system:
  description:
    value: >-
      <p><em>The Gray Maidens are more than just soldiers--they drill
      relentlessly to fight as a team and to protect their bodies and minds. A
      Gray Maiden using the Sisterhood Style can easily coordinate tactics with
      other women.</em></p><p><strong>Prerequisites</strong>: Cha 13, Shield
      Focus, Weapon Focus (longsword), base attack bonus
      +2.</p><p><strong>Benefits</strong>: While using this style and wielding a
      longsword and a light or heavy shield, you gain a +1 bonus on Reflex and
      Will saving throws. In addition, when you enter the Sisterhood Style
      stance, you can choose a teamwork feat you have. As a swift action, you
      can grant that feat to an ally within 10 feet until the beginning of your
      next turn.</p>
  tags:
    - Combat
    - Style
type: feat
