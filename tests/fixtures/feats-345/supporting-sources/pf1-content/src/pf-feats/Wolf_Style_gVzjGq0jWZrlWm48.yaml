name: Wolf Style
system:
  description:
    value: >-
      <p><em>While in this style, you hamper foes that turn their backs on
      you.</em></p><p><strong>Prerequisites</strong>: Wis 13, Improved Unarmed
      Strike, Knowledge (nature) 3 ranks.</p><p><strong>Benefits</strong>: While
      using this style, whenever you deal at least 10 points of damage to a foe
      with an attack of opportunity, that foe's base speed decreases by 5 feet
      until the end of its next turn. For every 10 points of damage your attack
      deals beyond 10, the foe's base speed decreases by an additional 5 feet.
      If the penalty meets or exceeds the total base speed of the foe, you can
      attempt to trip the foe as a free action after the attack of opportunity
      is resolved.</p>
  tags:
    - Combat
    - Style
type: feat
