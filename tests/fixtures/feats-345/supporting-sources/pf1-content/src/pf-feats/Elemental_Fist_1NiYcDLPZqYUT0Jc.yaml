name: Elemental Fist
system:
  description:
    value: >-
      <p><em>You empower your strike with elemental
      energy</em></p><p><strong>Prerequisites</strong>: Con 13, Wis 13, Improved
      Unarmed Strike, base attack bonus +8.</p><p><strong>Benefits</strong>:
      When you use Elemental Strike pick one of the following energy types:
      acid, cold, electricity, or fire. On a successful hit, the attack deals
      damage normally plus 1d6 points of damage of the chosen type. You must
      declare that you are using this feat before you make your attack roll
      (thus a failed attack roll ruins the attempt). You may attempt an
      elemental fist attack once per day for every four levels you have attained
      (see Special), and no more than once per
      round.</p><p><strong>Special</strong>: A monk of the four winds receives
      Elemental Fist as a bonus feat at 1st level, even if he does not meet the
      prerequisites. A monk may attempt an Elemental Fist attack a number of
      times per day equal to his monk level, plus one more time per day for
      every four levels he has in classes other than monk.</p><p><strong>Combat
      Trick</strong>: You can spend 5 stamina points to declare the use of
      Elemental Fist after making a successful attack roll.</p>
  tags:
    - Combat
type: feat
