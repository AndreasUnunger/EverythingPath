name: Threnodic Spell
system:
  description:
    value: >-
      <p><em>You can convert mind-affecting magic to necromantic power capable
      of controlling undead.</em></p><p><strong>Prerequisites</strong>:
      Knowledge (religion) 6 ranks, Spell Focus
      (necromancy).</p><p><strong>Benefits</strong>: This feat only works on
      mind-affecting spells. A threnodic spell affects undead creatures (even
      mindless undead) as if they weren't immune to mind-affecting effects, but
      has no effect on living creatures. A threnodic spell uses up a spell slot
      two level higher than the spell's actual
      level.</p><p><strong>Normal</strong>: Undead are immune to mind-affecting
      effects.</p>
  tags:
    - Metamagic
type: feat
