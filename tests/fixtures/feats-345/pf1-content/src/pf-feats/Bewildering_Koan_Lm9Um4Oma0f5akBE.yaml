name: Bewildering Koan
system:
  description:
    value: >-
      <p><em>You can pose unanswerable questions that leave creatures
      momentarily dumbfounded as they dwell on their
      significance.</em></p><p><strong>Prerequisites</strong>: Bluff 1 rank, ki
      pool class feature, gnome.</p><p><strong>Benefits</strong>: As a swift
      action, spend 1 point from your ki pool and make a Bluff check by asking a
      creature one of the impossible questions you ponder when meditating. If
      the creature fails its check, you choose whether it loses its next action
      or you gain a +2 bonus on all damage rolls you make against that creature
      for 1 round.</p>
  tags:
    - Racial
    - Gnome
type: feat
