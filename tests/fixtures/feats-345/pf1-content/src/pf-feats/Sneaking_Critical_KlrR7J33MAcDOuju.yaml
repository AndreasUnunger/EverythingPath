name: Sneaking Critical
system:
  description:
    value: >-
      <p><em>Your critical hits are particularly
      deadly.</em></p><p><strong>Prerequisites</strong>: Critical Focus, base
      attack bonus +9, sneak attack class
      feature.</p><p><strong>Benefits</strong>: Whenever you confirm a critical
      hit on a sneak attack, you can roll an additional number of sneak attack
      dice equal to your weapon's critical
      modifier.</p><p><strong>Special</strong>: You can apply the effects of
      only one critical feat to a given critical hit unless you possess Critical
      Mastery.</p>
  tags:
    - Combat
    - Critical
type: feat
