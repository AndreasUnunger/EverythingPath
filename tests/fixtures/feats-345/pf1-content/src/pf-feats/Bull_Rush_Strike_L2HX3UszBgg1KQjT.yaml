name: Bull Rush Strike
system:
  description:
    value: >-
      <p><em>Your critical hits can push back your
      foes.</em></p><p><strong>Prerequisites</strong>: Str 13, Improved Bull
      Rush, Power Attack, base attack bonus +9.</p><p><strong>Benefits</strong>:
      Whenever you score a critical hit with a melee attack, you can push your
      opponent back, in addition to the normal damage dealt by the attack. If
      your confirmation roll exceeds your opponent's CMD, you may push your
      opponent back as if from the bull rush combat maneuver. You do not need to
      move with the target if successful. This does not provoke an attack of
      opportunity.</p><p><strong>Normal</strong>: You must perform a bull rush
      combat maneuver to bull rush an opponent.</p><p><strong>Special</strong>:
      You can only apply the effects of one of the following feats to a given
      critical hit</p><h3>Combat Trick</h3><p>When you fail to confirm a
      critical hit with a melee attack, you can spend 2 stamina points to
      attempt to bull rush the target anyway. If you do, reroll the confirmation
      roll to determine if the bull rush attempt exceeds the opponent's CMD.
      This reroll is only for the bull rush combat maneuver; it can't cause the
      critical hit to be confirmed. You still can't make the attempt if the
      target is immune to critical hits.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
