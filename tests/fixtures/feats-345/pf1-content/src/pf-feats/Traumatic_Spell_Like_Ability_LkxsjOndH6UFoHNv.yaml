name: Traumatic Spell-Like Ability
system:
  description:
    value: >-
      <p><em>Your spell-like ability causes affected targets to relive their
      torments in nightly terrors.</em></p><p><strong>Prerequisites</strong>:
      Spell-like ability at caster level 6th or
      higher.</p><p><strong>Benefits</strong>: Choose one of your spell-like
      abilities, subject to the restrictions described in this feat. You can use
      the chosen spell-like ability as a traumatic spell-like ability three
      times per day (or less, if the ability is normally usable only once or
      twice per day).</p><p>When you use a traumatic spell-like ability,
      affected targets must succeed at an additional Will saving throw the next
      time that they sleep (DC = the spell-like ability's DC) or be affected as
      per nightmare. Each time the target fails its save, it must save again the
      following night or be affected by another nightmare, though the save DC
      decreases by 2 each night after the first. This feat can be applied only
      to spelllike abilities with the emotion or fear descriptor. Targets that
      avoid the spell-like ability's effects avoid this feat's effect as
      well.</p><p>You can only select a spell-like ability duplicating a spell
      with a level less than or equal to 1/2 your caster level (round down) - 2.
      For a summary, see Table 3-1.</p><p><strong>Special</strong>: This feat
      can be taken multiple times. Each time it is taken, you can apply it to a
      different spell-like ability.</p><table><tbody><tr><td>Spell
      Level</td><td>Caster Level1</td><td>Caster
      Level2</td></tr><tr><td>0</td><td>2nd</td><td>4th</td></tr><tr><td>1st</td><td>4th</td><td>6th</td></tr><tr><td>2nd</td><td>6th</td><td>8th</td></tr><tr><td>3rd</td><td>8th</td><td>10th</td></tr><tr><td>4th</td><td>10th</td><td>12th</td></tr><tr><td>5th</td><td>12th</td><td>14th</td></tr><tr><td>6th</td><td>14th</td><td>16th</td></tr><tr><td>7th</td><td>16th</td><td>18th</td></tr><tr><td>8th</td><td>18th</td><td>20th</td></tr><tr><td>9th</td><td>20th</td><td>-</td></tr></tbody></table><p>1&nbsp;Bouncing,
      disruptive, intensified, lingering, or scarring ability.<br />2Fearsome,
      sickening, or traumatic ability.</p>
