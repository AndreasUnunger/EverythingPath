name: Emissary's Emboldening
system:
  description:
    value: >-
      <p><em>Your familiar lends you divine
      courage.</em></p><p><strong>Prerequisites</strong>: Must have a familiar
      with the emissary archetype (see page
      10).</p><p><strong>Benefits</strong>: As long as your familiar is adjacent
      to you, you gain a +1 morale bonus against fear effects. This bonus
      increases by 1 at 4th level and every 4 levels thereafter (to a maximum of
      +5 at 16th level). At 20th level, you become immune to fear effects as
      long as your familiar is adjacent to you.</p>
  tags:
    - Familiar
type: feat
