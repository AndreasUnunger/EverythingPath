name: Arcane Talent
system:
  description:
    value: >-
      <p><em>Magic is in your blood, and at your
      fingertips.</em></p><p><strong>Prerequisites</strong>: Cha 10; elf,
      half-elf, or gnome.</p><p><strong>Benefits</strong>: Choose a 0-level
      spell from the sorcerer/wizard spell list. You can cast this spell three
      times per day as a spell-like ability. The caster level is equal to your
      character level. The save DC is 10 + your Charisma modifier.</p>
