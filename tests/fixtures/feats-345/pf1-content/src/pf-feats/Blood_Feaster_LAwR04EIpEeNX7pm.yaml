name: Blood Feaster
system:
  description:
    value: >-
      <p><em>Consuming blood gives you superhuman
      strength.</em></p><p><strong>Prerequisites</strong>: Blood Drinker, base
      attack bonus +6, dhampir.</p><p><strong>Benefits</strong>: If you use your
      Blood Drinker feat to drain 4 or more points of Constitution from a living
      creature, you gain a +2 bonus on damage rolls and a +1 bonus on
      Strength-based skill checks. This bonus lasts for a number of rounds equal
      to 1/2 your Hit Dice.</p>
  tags:
