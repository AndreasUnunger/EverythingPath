name: Disorienting Maneuver
system:
  description:
    value: >-
      <p><em>Your erratic movements disorient your
      opponent.</em></p><p><strong>Prerequisites</strong>: Dodge, Acrobatics 5
      ranks.</p><p><strong>Benefits</strong>: If you successfully use Acrobatics
      to tumble through an opponent's space, you gain a +2 circumstance bonus on
      attack rolls against that opponent until the start of your next turn. If
      you choose to make a trip attempt against that opponent, you gain a +4
      circumstance bonus on your combat maneuver check. This bonus on trip also
      lasts until the start of your next turn.</p>
  tags:
    - General
type: feat
