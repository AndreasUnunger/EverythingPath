name: Divine Interference (Mythic)
system:
  description:
    value: >-
      <p><em>Your divine power thwarts enemies of your
      faith.</em></p><p><strong>Prerequisites</strong>: Divine
      Interference.</p><p><strong>Benefits</strong>: When you use Divine
      Interference, the penalty on your opponent's attack roll is equal to twice
      the level of the spell sacrificed. You can expend one use of mythic power
      when you sacrifice the spell to increase the penalty to triple the level
      of the spell sacrificed.</p>
