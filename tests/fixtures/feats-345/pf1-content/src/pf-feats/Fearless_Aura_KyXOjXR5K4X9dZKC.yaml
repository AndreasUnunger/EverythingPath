name: Fearless Aura
system:
  description:
    value: >-
      <p><em>Your aura of courage becomes more potent, as your steadfast resolve
      is also manifested by your
      allies.</em></p><p><strong>Prerequisites</strong>: Aura of courage class
      feature, caster level 8th.</p><p><strong>Benefits</strong>: Your aura of
      courage expands to a 20-foot-radius emanation. Allies within the aura are
      immune to fear effects.</p><p><strong>Normal</strong>: The aura of courage
      affects each ally within 10 feet, and grants a +4 morale bonus on saving
      throws against fear effects.</p>
  tags:
    - General
type: feat
