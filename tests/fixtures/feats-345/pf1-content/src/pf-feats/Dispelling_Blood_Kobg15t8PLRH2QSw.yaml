name: Dispelling Blood
system:
  description:
    value: >-
      <p><em>You can change your toxic blood to unravel magic
      itself.</em></p><p><strong>Prerequisites</strong>: Knowledge (arcana) 7
      ranks, vishkanya.</p><p><strong>Benefits</strong>: As a swift action, you
      can alter the effects of your venom to affect magic instead of flesh. Your
      venom functions as a targeted dispel magic effect when it strikes a
      creature, using your character level as your caster level. This dispelling
      effect affects creatures even if they are immune to poison
      effects.</p><p><strong>Normal</strong>: Vishkanya venom deals Dexterity
      damage.</p>
  tags:
    - Racial
    - Vishkanya
type: feat
