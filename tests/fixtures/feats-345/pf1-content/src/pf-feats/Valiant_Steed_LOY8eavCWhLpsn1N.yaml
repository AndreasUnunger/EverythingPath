name: Valiant Steed
system:
  description:
    value: >-
      <p><em>Your courage is unnaturally
      strong.</em></p><p><strong>Prerequisites</strong>: Animal or magical
      beast.</p><p><strong>Benefits</strong>: You gain a +4 morale bonus on
      saves against fear and emotion effects. If you can serve as a mount, your
      rider gains a +4 morale bonus on Handle Animal, Ride, and wild empathy
      checks to force you within range of a creature with the unnatural aura
      universal monster rule. In addition, the DC to push you with the Handle
      Animal skill does not increase if you are wounded or have taken any
      nonlethal damage or ability score damage.</p><p><strong>Normal</strong>:
      The DC to push an animal increases by 2 if the animal is wounded or has
      taken any nonlethal damage or ability score damage.</p>
  tags:
    - General
type: feat
