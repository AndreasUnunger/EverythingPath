name: Hydraulic Maneuver
system:
  description:
    value: >-
      <p><em>You can use your hydraulic push to disarm or
      trip.</em></p><p><strong>Prerequisites</strong>: Hydraulic push spell-like
      ability, undine.</p><p><strong>Benefits</strong>: You may use hydraulic
      push to attempt a bull rush, disarm, dirty trick (blind or dazzle, see ),
      or trip combat maneuver. Each time you use hydraulic push, you must decide
      which of the allowed combat maneuvers you want to perform. You may use
      this feat with your hydraulic push racial spell-like ability, your
      class-granted use of hydraulic push, or any hydraulic push spells you
      cast, but not with magic items or other external sources that use that
      spell.</p><p><strong>Normal</strong>: Hydraulic push can only be used to
      make a bull rush combat maneuver.</p>
  tags:
    - Racial
    - Undine
type: feat
