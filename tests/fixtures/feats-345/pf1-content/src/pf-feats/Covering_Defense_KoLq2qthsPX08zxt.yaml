name: Covering Defense
system:
  description:
    value: >-
      <p><em>You are skilled at protecting yourself and your allies with your
      shield.</em></p><p><strong>Prerequisites</strong>: Shield Focus, base
      attack bonus +6.</p><p><strong>Benefits</strong>: When you use the total
      defense action while using a light, heavy, or tower shield, you can
      provide a cover bonus to AC against all attacks to an adjacent ally your
      size or smaller. This cover bonus is equal to your shield's shield bonus
      and lasts until the beginning of your next turn. Your shield does not
      provide a cover bonus to Reflex saves.</p><p><strong>Combat
      Trick</strong>: When using the total defense action, you can spend 5
      stamina points. If you do, your shield also provides a cover bonus on your
      ally's Reflex saves.</p>
  tags:
    - Combat
type: feat
