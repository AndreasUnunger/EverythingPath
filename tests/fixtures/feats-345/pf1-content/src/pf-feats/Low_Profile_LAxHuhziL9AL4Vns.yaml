name: Low Profile
system:
  description:
    value: >-
      <p><em>Yours small stature helps you avoid ranged
      attacks.</em></p><p><strong>Prerequisites</strong>: Dex 13, Small size or
      smaller.</p><p><strong>Benefits</strong>: You gain a +1 dodge bonus to AC
      against ranged attacks. In addition, you do not provide soft cover to
      creatures when ranged attacks pass through your square.</p><h3>Combat
      Trick</h3><p>When targeted by a ranged attack, you can spend a number of
      stamina points up to your Dexterity bonus. For each stamina point you
      spend in this way, your dodge bonus to AC against that attack increases by
      1.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
