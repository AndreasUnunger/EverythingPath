img: systems/pf1/icons/spells/wind-grasp-air-2.jpg
name: Selfish Channel
system:
  description:
    value: >-
      <p><em>You can hoard channeled energy for
      yourself.</em></p><p><strong>Prerequisites</strong>: Channel energy class
      feature.</p><p><strong>Benefits</strong>: Whenever you channel positive
      energy to heal creatures, you regain half again as many hit points (+50%)
      as normal if you're the only creature healed by the channeled energy
      (either because there are no other living creatures within the area or
      because you exclude them with Selective Channeling or a similar
      effect).</p><p><strong>Special</strong>: If you are healed by negative
      energy, this feat applies when you channel negative energy and you're the
      only creature healed by the channeled energy.</p>
  tags:
    - Channeling
type: feat
