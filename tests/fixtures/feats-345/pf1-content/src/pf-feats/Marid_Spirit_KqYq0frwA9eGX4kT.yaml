name: Marid Spirit
system:
  description:
    value: >-
      <p><em>You can manipulate cold energy to protect yourself and freeze your
      foes.</em></p><p><strong>Prerequisites</strong>: Con 15, Wis 15, Elemental
      Fist, Marid Style, Improved Unarmed Strike, base attack bonus +11 or monk
      level 9th.</p><p><strong>Benefits</strong>: You gain one additional
      Elemental Fist (Advanced Player's Guide 158) attempt per day. While using
      Marid Style, you gain cold resistance equal to your base attack bonus, or
      monk level plus base attack bonus gained from levels in classes other than
      monk, whichever is higher. While denied your Dexterity bonus to AC you are
      also denied this resistance. Creatures that take cold damage from your
      Elemental Fist attack must succeed at a Fortitude save (DC 10 + 1/2 your
      character level + your Wis modifier) or become entangled in ice for 1d4
      rounds. The ice has hit points equal to three times your base attack bonus
      or monk level, whichever is higher, and a break DC of 15 + your base
      attack bonus or monk level, whichever is higher. Destroying or breaking
      the ice ends the entangled condition.</p><h3>Combat Trick</h3><p>When a
      creature takes cold damage from your Elemental Fist attack, you can spend
      up to 5 stamina points to increase the DC of the saving throw to avoid
      becoming entangled by an amount equal to the number of stamina points you
      spent.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
