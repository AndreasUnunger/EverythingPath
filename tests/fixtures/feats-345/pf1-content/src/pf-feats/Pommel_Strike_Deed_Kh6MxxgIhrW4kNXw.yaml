name: Pommel Strike Deed
system:
  description:
    value: >-
      <p><em>With a surprise swipe with your pommel, you can topple a
      foe.</em></p><p><strong>Prerequisites</strong>: Amateur Swashbuckler or
      panache class feature; base attack bonus
      +3.</p><p><strong>Benefits</strong>: You can spend 1 panache point to make
      a melee attack with the pommel of a light or one-handed piercing melee
      weapon as a standard action. You make this attack as if you were using the
      weapon normally (including any bonuses gained from the swashbuckler's
      finesse class feature, Weapon Finesse, or other similar feats and
      effects), but you deal 1d6 bludgeoning damage (or 1d4 if you are Small)
      instead of the weapon's normal damage. Regardless of your size, the
      critical threat range and critical multiplier of this attack are 20/ x2,
      and they are not affected by Improved Critical, the keen weapon special
      ability, or similar effects. If the attack hits, you can attempt a combat
      maneuver check to knock the target prone as a free action.</p>
  tags:
    - Panache
type: feat
