name: Greater Mercy
system:
  description:
    value: >-
      <p><em>Your mercy has incredible recuperative
      properties.</em></p><p><strong>Prerequisites</strong>: Cha 13, lay on
      hands class feature, mercy class feature.</p><p><strong>Benefits</strong>:
      When you use your lay on hands ability and the target of that ability does
      not have any conditions your mercies can remove, it instead heals an
      additional +1d6 points of damage.</p>
