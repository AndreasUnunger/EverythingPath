name: Drunken God's Blessings
system:
  description:
    value: >-
      <p><em>Cayden Cailean smiles upon you when you visit his most favored
      temples: taverns.</em></p><p><strong>Prerequisites</strong>: Worshiper of
      Cayden Cailean.</p><p><strong>Benefits</strong>: When you have had at
      least a number of drinks equal to your Constitution modifier (or get drunk
      or soused, if you are using the rules on pages 54-55) in a tavern, once
      within the following 24 hours, you can gain the benefits of remove
      paralysis as a free action. Alternatively, you can choose one of the
      following benefits depending on the type of bar you patronized. (The
      specific taverns detailed in this book are given in parentheses as
      examples.) At the GM's discretion, other types of taverns might grant
      other benefits.</p><hr /><p><strong>Gambling Den (Whispering
      Stone)</strong>: You can gain the benefits of detect thoughts for 1 minute
      as a free action.</p><p><strong>Illegal Tavern (Runoff)</strong>: You can
      gain the benefits of invisibility for 1 minute as a free
      action.</p><p><strong>Posh Tavern (Aeylinth Vineyard)</strong>: You can
      gain the benefits of eagle's splendor for 1 minute as a free
      action.</p><p><strong>Private Club (The Porthmos Club)</strong>: You can
      gain the benefits of undetectable alignment for 1 minute as a free
      action.</p><p><strong>Rowdy Bar (Formidably Maid)</strong>: You can gain
      the benefits of bear's endurance for 1 minute as a free
      action.</p><p><strong>Tavern of Intrigue (The Wicked Fork)</strong>: You
      can gain the benefits of fox's cunning for 1 minute as a free action.</p>
  tags:
    - General
type: feat
