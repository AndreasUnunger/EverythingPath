name: Weapon Finesse (Mythic)
system:
  description:
    value: >-
      <p><em>You're an expert with weapons that rely on your
      agility.</em></p><p><strong>Prerequisites</strong>: Weapon
      Finesse.</p><p><strong>Benefits</strong>: When using Weapon Finesse, you
      may also use your Dexterity modifier instead of your Strength modifier on
      your damage rolls. If you carry a shield, its armor check penalty doesn't
      apply to either the attack rolls or the damage rolls.</p>
