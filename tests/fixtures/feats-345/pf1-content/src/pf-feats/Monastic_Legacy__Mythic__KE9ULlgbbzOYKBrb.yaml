name: Monastic Legacy (Mythic)
system:
  description:
    value: >-
      <p><em>Every new experience carries you another step further along your
      path to enlightenment.</em></p><p><strong>Prerequisites</strong>: Monastic
      Legacy.</p><p><strong>Benefits</strong>: Add half the levels you have in
      classes other than monk to your monk level to determine your effective
      monk level for your AC bonus. As a free action, you can expend one use of
      mythic power to add half your tier to your effective monk level to
      determine your base unarmed strike damage and AC bonus until the start of
      your next turn.</p>
  tags:
    - Combat
    - Mythic
type: feat
