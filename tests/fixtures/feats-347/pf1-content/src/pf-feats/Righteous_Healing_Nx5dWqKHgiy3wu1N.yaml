  description:
    value: >-
      <p><em>Your healing spells are more potent when you have a judgment
      active.</em></p><p><strong>Prerequisites</strong>: Judgment class
      feature.</p><p><strong>Benefits</strong>: If you cast a cure spell while
      you have a judgment active, each target regains 1 extra hit point from the
      cure spell + 1 hit point per three inquisitor levels you possess.</p>
