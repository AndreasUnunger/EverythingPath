name: Blazing Channel
system:
  description:
    value: >-
      <p><em>Your holy power burns the undead like
      fire.</em></p><p><strong>Prerequisites</strong>: Turn Undead, channel
      positive energy class feature.</p><p><strong>Benefits</strong>: When you
      use your Turn Undead feat, undead failing their saving throw are engulfed
      in holy fire. This functions identically to catching on fire (Core
      Rulebook 444), but the damage dealt is divine (like the divine damage from
      flame strike) rather than fire. Water cannot extinguish this holy fire,
      but any negative energy effect that heals the creature of at least 5
      points of damage extinguishes the flames instantly.</p>
  tags:
    - Channeling
type: feat
