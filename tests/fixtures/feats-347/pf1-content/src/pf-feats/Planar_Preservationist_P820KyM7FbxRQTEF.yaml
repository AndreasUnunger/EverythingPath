name: Planar Preservationist
system:
  description:
    value: >-
      <p><em>You know how to preserve and reconstitute extraplanar monsters as
      well as normal animals.</em></p><p><strong>Prerequisites</strong>:
      Preservationist alchemist archetype.</p><p><strong>Benefit<br
      /></strong>For every summon nature&rsquo;s ally extract you know, you
      learn the equivalent summon monster spell as an extract. If you later
      learn other summon nature&rsquo;s ally extracts, you automatically learn
      the equivalent summon monster spell as an extract.</p>
