name: Spontaneous Metafocus (Mythic)
system:
  description:
    value: >-
      <p><em>You apply metamagic to your spells with greater ease than do other
      spontaneous casters.</em></p><p><strong>Prerequisites</strong>:
      Spontaneous Metafocus.</p><p><strong>Benefits</strong>: You can change
      which spell your Spontaneous Metafocus feat applies to each morning when
      you restore your expended spell slots. The spell it applies to can be of
      any level, but it must be a legal selection for the Spontaneous Metafocus
      feat.Special: You can gain this feat multiple times. The effects do not
      stack. Each time you take this feat, it applies to a different non-mythic
      Spontaneous Metafocus feat.</p>
  tags:
    - General
    - Mythic
type: feat
