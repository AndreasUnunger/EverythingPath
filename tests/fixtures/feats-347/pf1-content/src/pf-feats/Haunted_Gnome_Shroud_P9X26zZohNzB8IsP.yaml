name: Haunted Gnome Shroud
system:
  description:
    value: >-
      <p><em>Your disturbing glamer expands to make your exact location hard to
      pinpoint.</em></p><p><strong>Prerequisites</strong>: Cha 13, gnome magic
      racial trait, Haunted Gnome, Haunted Gnome Assault, Knowledge (arcana) 6
      ranks.</p><p><strong>Benefits</strong>: You gain another independent use
      of your gnome magic like that which Haunted Gnome Assault grants. Further,
      while you are under the effect of haunted fey aspect, you also have
      concealment (20% miss chance) against an opponent until that opponent
      deals you damage.</p><h3>Combat Trick</h3><p>When an opponent misses you
      due to the miss chance from Haunted Gnome Shroud, you can spend 5 stamina
      points to impose a -2 penalty on all that opponent's attack rolls against
      you until that opponent deals damage to you. This ability doesn't stack
      with itself.</p>
  tags:
    - Combat
    - Racial
    - Gnome
    - Combat Trick
type: feat
