name: Spellbreaker (Mythic)
system:
  description:
    value: >-
      <p><em>You're a spellcaster's worst
      nightmare.</em></p><p><strong>Prerequisites</strong>:
      Spellbreaker.</p><p><strong>Benefits</strong>: Any non-mythic creature you
      threaten provokes an attack of opportunity from you whenever it uses a
      spell or spell-like ability, even when casting defensively or casting a
      quickened spell.</p><p>If a non-mythic creature within 30 feet of you uses
      a spell or spell-like ability, you can expend one use of mythic power to
      make a ranged attack against that creature as an attack of opportunity
      (even if the creature wouldn't normally provoke attacks of opportunity).
      You must have a ranged weapon in hand or have a free hand and the
      nonmythic Quick Draw feat to use this ability. You can use this ability
      against a mythic creature by expending two uses of mythic power.</p>
  tags:
    - Combat
    - Mythic
type: feat
