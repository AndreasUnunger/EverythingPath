name: Free Spirit
system:
  description:
    value: >-
      <p><em>Your strong belief in the value of freedom protects you from mental
      and physical shackles.</em></p><p><strong>Prerequisites</strong>: Cha 13,
      any chaotic alignment.</p><p><strong>Benefits</strong>: You gain a +2
      morale bonus on saving throws made against mind-affecting effects and on
      all Escape Artist or grapple checks made to escape a grapple or to escape
      from bonds.</p>
