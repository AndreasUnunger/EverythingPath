name: Legionnaire's Inspiration
system:
  description:
    value: >-
      <p><em>You inspire your comrades to stand against impossible
      odds.</em></p><p><strong>Prerequisites</strong>: Affiliated with the
      Golden Legion.</p><p><strong>Benefits</strong>: As a standard action, you
      can select one creature you can see. All allies within 30 feet who are
      able to see and hear you gain a +1 morale bonus to their Armor Class
      against that creature for a number of rounds equal to your Charisma bonus
      (minimum 1 round). You can do this once per day, plus one additional time
      for every 3 character levels you have.</p>
  tags:
    - General
type: feat
