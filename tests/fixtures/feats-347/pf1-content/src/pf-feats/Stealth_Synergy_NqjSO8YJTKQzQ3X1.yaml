name: Stealth Synergy
system:
  description:
    value: >-
      <p><em>Working closely with an ally, you are able to move like twin
      shadows.</em></p><p><strong>Benefits</strong>: While you can see one or
      more allies who also have this feat, whenever you and your allies make a
      Stealth check, you all take the highest roll and add all your modifiers to
      Stealth.</p>
  tags:
    - Teamwork
type: feat
