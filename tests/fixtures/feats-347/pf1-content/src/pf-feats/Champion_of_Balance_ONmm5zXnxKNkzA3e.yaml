name: Champion of Balance
system:
  description:
    value: >-
      <p><em>You are dedicated to perfect balance in the
      multiverse.</em></p><p><strong>Prerequisites</strong>:10 Hit Dice, neutral
      alignment.</p><p><strong>Benefits</strong>: You gain a +2 bonus on weapon
      and spell damage rolls against good and evil creatures. You also gain a +2
      bonus on weapon and spell damage rolls against lawful and chaotic
      creatures. These bonuses stack with each other.</p><p><br
      /><strong>Residual</strong>: You gain no benefit from this feat if you are
      not of neutral alignment.</p>
  tags:
    - Alignment
type: feat
