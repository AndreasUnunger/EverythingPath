name: Fortunate Ruler
system:
  description:
    value: >-
      <p><em>Your good luck shines on your people, even in the most trying
      times.</em></p><p><strong>Prerequisites</strong>: Hold the Ruler
      leadership role for a kingdom.</p><p><strong>Benefits</strong>: During a
      kingdom's Event phase, once an event's type and danger level has been
      determined, you may choose to roll twice on the applicable kingdom or
      settlement table and choose either result. You must declare you are using
      this feat before the results of the initial roll are revealed.</p>
