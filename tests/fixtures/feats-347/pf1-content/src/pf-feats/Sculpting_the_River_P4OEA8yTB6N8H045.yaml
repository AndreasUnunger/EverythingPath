name: Sculpting the River
system:
  description:
    value: >-
      <p><em>Your deft strikes and canny positioning control the flow of
      combat.</em></p><p><strong>Prerequisites</strong>: Dodge, Improved Unarmed
      Strike, base attack bonus +6 or monk level
      6th.</p><p><strong>Benefits</strong>: When you deal damage with an unarmed
      attack to an opponent you have already damaged this round, you can impose
      a -1 penalty on that target's attacks against creatures other than you.
      The penalties stack and remain until the target misses an attack or the
      start of your next turn, whichever comes first.</p>
