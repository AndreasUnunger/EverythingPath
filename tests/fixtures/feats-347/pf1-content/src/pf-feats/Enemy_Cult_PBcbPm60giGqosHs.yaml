name: Enemy Cult
system:
  description:
    value: >-
      <p><em>You have crossed paths with a cult opposed to everything in which
      you believe.</em></p><p><strong>Prerequisites</strong>: You must have
      encountered a cult whose general alignment is opposite to yours on at
      least one axis or who threatened your beliefs or way of life, or you must
      have the Angelic Encounter, the False Witness, The Omen, or the Terrible
      Secret background (all of which are found in Ultimate
      Campaign).</p><p><strong>Benefits</strong>: Choose an appropriate detect
      chaos/evil/good/law spell that would aid you in opposing your chosen enemy
      cult. You can cast this spell twice per day as a spell-like ability with a
      caster level equal to your character level.</p><p><strong>Goal</strong>: 
      Thwart the enemy cult, whose leader must be a challenging foe. You must
      deal that cult leader a decisive defeat, and additionally eradicate the
      cult or drive the cult from the area.</p><p><strong>Completion
      Benefit</strong>: You gain a +2 resistance bonus on saving throws against
      evil creatures and a +2 deflection bonus to AC against evil creatures'
      attacks. These bonuses double against evil summoned creatures.</p>
  tags:
    - Story
type: feat
