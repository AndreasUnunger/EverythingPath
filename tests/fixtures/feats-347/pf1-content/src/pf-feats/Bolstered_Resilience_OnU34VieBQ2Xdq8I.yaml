name: Bolstered Resilience
system:
  description:
    value: >-
      <p><em>You can dramatically increase your damage reduction in exchange for
      its temporary loss.</em></p><p><strong>Prerequisites</strong>: Damage
      reduction.</p><p><strong>Benefits</strong>: As an immediate action, you
      can double your DR against a single attack, to a maximum of DR 20. The
      type of the DR remains unchanged. If the attack you are guarding against
      is not successful, the increased damage reduction persists until you are
      hit with an attack or until the start of your next turn, whichever happens
      first. At the start of your next turn, you become fatigued. You cannot use
      this feat while you are fatigued.</p>
  tags:
    - General
type: feat
