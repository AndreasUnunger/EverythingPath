name: Bushwhack
system:
  description:
    value: >-
      <p><em>You can subdue an unsuspecting foe
      quickly.</em></p><p><strong>Prerequisites</strong>: Dex 13, Improved
      Grapple, Improved Unarmed Strike.</p><p><strong>Benefits</strong>: When a
      flat-footed creature is unaware of your presence and you successfully
      grapple it, you can attempt a second grapple combat maneuver check to pin
      the creature as a free action. If you have the Chokehold feat (Pathfinder
      RPG Ultimate Combat 92), you can instead use this second combat maneuver
      check to initiate a chokehold.</p>
  tags:
    - Combat
type: feat
