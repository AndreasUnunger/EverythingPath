name: Death from Above (Mythic)
system:
  description:
    value: >-
      <p><em>When attacking from the air or higher ground, you bear down on your
      enemy to deadly effect.</em></p><p><strong>Prerequisites</strong>: Death
      from Above.</p><p><strong>Benefits</strong>: Whenever you charge an
      opponent from higher ground, or from above while flying, the critical
      multiplier of your weapon increases by 2 (to a maximum of x6). This
      doesn't stack with other abilities that increase a weapon's critical
      multiplier. If your charge attack hits, you can perform a trip combat
      maneuver against the attack's target as a free action without provoking
      attacks of opportunity.</p>
  tags:
    - Combat
    - Mythic
type: feat
