name: Crystalline Cloud
system:
  description:
    value: >-
      <p><em>You can release large amounts of crystalline dust to create a
      diversion or cover your allies.</em></p><p><strong>Prerequisites</strong>:
      Aphorite, character level 5th, crystalline dust racial
      trait.</p><p><strong>Benefits</strong>: When you use your crystalline dust
      supernatural racial trait, you can instead create a cloud of crystalline
      dust in a 10-foot radius centered on you. The cloud does not obscure
      sight, but allies within the cloud receive the benefit of your crystalline
      dust. The cloud can be maintained each round as a free action as long as
      you remain within the cloud's area. A moderate wind (11+ mph), such as
      from a gust of wind spell, disperses the cloud immediately. Each round
      that the crystalline cloud is active expends 2 rounds of your crystalline
      dust racial trait. If you have the Gilded Weapons feat, any creature with
      the chaotic subtype that enters the cloud must succeed at a Fortitude save
      (DC = 10 + half your character level + your Charisma modifier) or be
      sickened for 1 round.</p>
  tags:
    - Racial
    - Aphorite
type: feat
