name: Dryad's Attendant
system:
  description:
    value: >-
      <p><em>Dryads trust you to bear their power and their
      bond.</em></p><p><strong>Prerequisites</strong>: Cha 15, Dryad's
      Apprentice, character level 9th,
      gathlain.</p><p><strong>Benefits</strong>: You can cast meld into stone as
      a spell-like ability once per day with a caster level equal to your
      character level, except that you instead meld with wood. You can remain
      melded with the wood for up to 24 hours. If you meld with a dryad's bonded
      tree, the dryad can treat you as her bonded tree for a number of days
      equal to your Charisma modifier (minimum 1) after you leave it; the dryad
      retains her bond to her tree during this time as well.</p>
  tags:
    - Racial
    - Gathlain
type: feat
