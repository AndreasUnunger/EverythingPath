name: Quivering Palm Versatility
system:
  description:
    value: >-
      <p><em>You can alter the way you apply a quivering palm's vibrations to an
      opponent's body to cause extreme pain, put it in a coma, or destroy its
      memories.</em></p><p><strong>Prerequisites</strong>: Quivering palm class
      feature, base attack bonus +13.</p><p><strong>Benefits</strong>: After
      successfully using your quivering palm attack on a creature, you can
      produce one of the following effects instead of killing the creature, as
      long as you do so within a number of days equal to your monk
      level.</p><p>Coma</p><p>The subject falls unconscious and is helpless for
      a number of days equal to your monk level.</p><p>Memory Loss</p><p>The
      subject falls unconscious for 24 hours and awakens with huge gaps in its
      memory. The target's memories of the recent past (a number of consecutive
      days equal to your monk level) are completely obliterated, and can only be
      restored by a wish or miracle spell.</p><p>Pain</p><p>The subject takes
      1d6 points of nonlethal damage per monk level you possess.</p><p>You must
      choose the desired effect before the quivering palm's attack roll is made.
      Unless the target succeeds at its Fortitude save against your quivering
      palm attack, it succumbs to the desired effect when you will it (a free
      action). This feat is otherwise subject to all of the limits and
      conditions of quivering palm.</p>
  tags:
    - Combat
type: feat
