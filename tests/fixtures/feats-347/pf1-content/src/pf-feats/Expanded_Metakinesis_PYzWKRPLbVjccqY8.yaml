name: Expanded Metakinesis
system:
  description:
    value: >-
      <p><em>You can augment the destructive force of your kinetic blast in new
      ways.</em></p><p><strong>Prerequisites</strong>: Kinetic blast class
      feature, metakinesis class feature.</p><p><strong>Benefits</strong>:
      Select one of the following metamagic feats: Disrupting Spell, Ectoplasmic
      Spell, Furious Spell, Merciful Spell, or Piercing Spell. By accepting 1
      point of burn, you can alter your kinetic blast as if using the selected
      metamagic feat.</p><p><strong>Special</strong>: This feat can be chosen
      multiple times. Each time, you select a different metamagic feat.</p>
  tags:
    - General
type: feat
