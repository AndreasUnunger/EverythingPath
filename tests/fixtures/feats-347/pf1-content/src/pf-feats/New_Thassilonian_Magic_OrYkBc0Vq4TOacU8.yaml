name: New Thassilonian Magic
system:
  description:
    value: >-
      <p><em>You use Thassilonian magic in a nontraditional way that preserves
      the ancient traditions while lifting some of its
      restrictions.</em></p><p><strong>Prerequisites</strong>: Thassilonian
      specialization (Pathfinder Campaign Setting: Inner Sea Magic
      17).</p><p><strong>Benefits</strong>: You choose one of your two
      opposition schools. You also gain Thassilonian as a bonus language. If you
      already speak Thassilonian, you gain one of the following languages as a
      bonus language instead: Aklo, Azlanti, Giant, Shoanti, or
      Varisian.</p><p><strong>Normal</strong>: A Thassilonian specialist cannot
      customize his choice for opposition schools.</p>
