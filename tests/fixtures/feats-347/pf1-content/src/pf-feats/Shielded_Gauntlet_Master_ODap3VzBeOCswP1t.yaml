img: systems/pf1/icons/items/weapons/axe-gauntlet-dwarven-heavy.png
name: Shielded Gauntlet Master
system:
  description:
    value: >-
      <p><em>Your can effectively attack and defend with your
      gauntlet.</em></p><p><strong>Prerequisites</strong>: Shielded Gauntlet
      Attack, Shield Gauntlet Style, Weapon Focus (gauntlet or spiked gauntlet),
      proficiency with bucklers and light
      shields.</p><p><strong>Benefits</strong>: While using Shield Gauntlet
      Style, you no longer lose your shield bonus to AC when you attack with
      your gauntlet (or spiked gauntlet) or use it to hold a weapon. In
      addition, you add your gauntlet's enhancement bonus to the shield bonus to
      AC granted by this feat as if it were a shield enhancement bonus.</p>
  tags:
    - Combat
type: feat
