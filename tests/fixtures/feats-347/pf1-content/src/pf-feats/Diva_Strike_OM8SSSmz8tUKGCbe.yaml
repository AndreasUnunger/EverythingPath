name: Diva Strike
system:
  description:
    value: >-
      <p><em>Those distracted by your performance leave themselves open to
      vicious attacks.</em></p><p><strong>Prerequisites</strong>: Cha 15; Combat
      Expertise; Diva Style; Improved Feint; base attack bonus +7 or bard level
      7th.</p><p><strong>Benefits</strong>: While using Diva Style, the first
      time you hit with a melee weapon in a round, you deal an additional amount
      of damage equal to your Charisma modifier to a target that is denied its
      Dexterity bonus to AC. This damage is precision-based, and is not
      multiplied on a critical hit.</p>
  tags:
    - Combat
type: feat
