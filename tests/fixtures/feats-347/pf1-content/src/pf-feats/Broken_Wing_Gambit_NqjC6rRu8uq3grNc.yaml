name: Broken Wing Gambit
system:
  description:
    value: >-
      <p><em>You feign weakness, making yourself a tempting and distracting
      target.</em></p><p><strong>Prerequisites</strong>: Bluff 5
      ranks.</p><p><strong>Benefits</strong>: Whenever you make a melee attack
      and hit your opponent, you can use a free action to grant that opponent a
      +2 bonus on attack and damage rolls against you until the end of your next
      turn or until your opponent attacks you, whichever happens first. If that
      opponent attacks you with this bonus, it provokes attacks of opportunity
      from your allies who have this feat.</p><h3>Combat Trick</h3><p>When an
      opponent with the +2 bonus on attack rolls granted by this feat attacks
      you, you can spend 5 stamina points to have that attack provoke an attack
      of opportunity from you also.</p>
  tags:
    - Combat
    - Teamwork
    - Combat Trick
type: feat
