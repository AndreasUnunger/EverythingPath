name: Great Expectations
system:
  description:
    value: >-
      <p><em>Burdened with heavy responsibility at a young age, you must mature
      faster than most.</em></p><p><strong>Prerequisites</strong>: Rainkin
      half-orc, skilled alternate racial trait.</p><p><strong>Benefits</strong>:
      Choose Intelligence, Wisdom, or Charisma when you take this feat. This
      choice cannot be changed. As an immediate action a number of times per day
      equal to your modifier in the chosen attribute, you can gain a +2
      circumstance bonus on any skill check that uses the chosen attribute. You
      can use this ability after rolling, but must use it before the results of
      the rolls are declared.</p>
  tags:
    - Racial
    - Half-Orc
type: feat
