name: Repast of Heroes
system:
  description:
    value: >-
      <p><em>Your natural spells are significantly increased, enabling you to
      feed and heal others.</em></p><p><strong>Prerequisites</strong>: Con 15,
      character level 8th, ghoran, natural magic racial
      trait.</p><p><strong>Benefits</strong>: Once per week, you can cast
      heroes' feast as a spell-like ability with a caster level equal to your
      character level. If you do so, you lose access to the spells normally
      granted by the natural magic racial trait for the next 48 hours.</p>
  tags:
    - Racial
    - Ghoran
type: feat
