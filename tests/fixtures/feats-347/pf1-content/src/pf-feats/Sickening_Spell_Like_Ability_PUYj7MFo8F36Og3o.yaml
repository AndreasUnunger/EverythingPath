name: Sickening Spell-Like Ability
system:
  description:
    value: >-
      <p><em>Your spell-like ability sickens affected
      targets.</em></p><p><strong>Prerequisites</strong>: Spell-like ability at
      caster level 6th or higher.</p><p><strong>Benefits</strong>: Choose one of
      your spell-like abilities, subject to the restrictions described in this
      feat. You can use the chosen spell-like ability as a sickening spelllike
      ability three times per day (or less, if the ability is normally usable
      only once or twice per day).</p><p>When you use a sickening spelllike
      ability, a target that takes damage from the spell-like ability becomes
      sickened for a number of rounds equal to the spell-like ability's
      equivalent spell level. If the spell-like ability allows a saving throw, a
      successful save negates the sickening effect. If the spell does not allow
      a saving throw, the target can attempt a Fortitude save (against the DC
      that the spell-like ability would have if it allowed a saving throw) to
      negate the sickening effect. If the effect of the spell-like ability also
      causes targets to become sickened and targets fail their save, add the
      duration of the sickened condition caused by this effect to the duration
      of the sickened condition imposed by the spell-like
      ability.</p><p>Spell-like abilities that do not inflict damage do not
      benefit from this feat.</p><p>You can only select a spell-like ability
      duplicating a spell with a level less than or equal to 1/2 your caster
      level (round down) - 2. For a summary, see Table
      3-1.</p><p><strong>Special</strong>: This feat can be taken multiple
      times. Each time it is taken, you can apply it to a different spell-like
      ability.</p><table><tbody><tr><td>Spell Level</td><td>Caster
      Level1</td><td>Caster
      Level2</td></tr><tr><td>0</td><td>2nd</td><td>4th</td></tr><tr><td>1st</td><td>4th</td><td>6th</td></tr><tr><td>2nd</td><td>6th</td><td>8th</td></tr><tr><td>3rd</td><td>8th</td><td>10th</td></tr><tr><td>4th</td><td>10th</td><td>12th</td></tr><tr><td>5th</td><td>12th</td><td>14th</td></tr><tr><td>6th</td><td>14th</td><td>16th</td></tr><tr><td>7th</td><td>16th</td><td>18th</td></tr><tr><td>8th</td><td>18th</td><td>20th</td></tr><tr><td>9th</td><td>20th</td><td>-</td></tr></tbody></table><p>1&nbsp;Bouncing,
      disruptive, intensified, lingering, or scarring ability.<br />2Fearsome,
      sickening, or traumatic ability.</p>
  tags:
    - Monster
type: feat
