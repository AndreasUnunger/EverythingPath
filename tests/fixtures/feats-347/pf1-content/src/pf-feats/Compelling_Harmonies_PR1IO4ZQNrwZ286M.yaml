name: Compelling Harmonies
system:
  description:
    value: >-
      <p><em>Your harmonies reinforce and empower your allies'
      magic.</em></p><p><strong>Prerequisites</strong>: Basic Harmony, Perform
      (keyboard, percussion, sing, string, or wind) 10 ranks, bardic performance
      or raging song.</p><p><strong>Benefits</strong>: As a standard action, you
      may expend one round of bardic performance to boost the effectiveness of
      the bardic performance of an ally within 60 feet who also has this feat.
      Until the beginning of your next turn, if that ally uses a bardic
      performance that allows a saving throw, increase that saving throw DC by
      2.</p>
  tags:
    - Teamwork
type: feat
