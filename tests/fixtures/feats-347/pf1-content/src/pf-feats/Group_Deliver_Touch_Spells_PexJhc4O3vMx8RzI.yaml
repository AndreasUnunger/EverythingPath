name: Group Deliver Touch Spells
system:
  description:
    value: >-
      <p><em>You and your teammates can deliver touch spells through each
      other's familiars.</em></p><p><strong>Prerequisites</strong>: Group Shared
      Spells, must have a familiar with the share spells and deliver touch
      spells abilities.</p><p><strong>Benefits</strong>: You and any allies with
      this feat can cast spells through one another's familiars as though each
      ally had the share spells ability with each other familiar. This feat
      otherwise functions as the share spells ability.</p>
  tags:
    - Teamwork
type: feat
