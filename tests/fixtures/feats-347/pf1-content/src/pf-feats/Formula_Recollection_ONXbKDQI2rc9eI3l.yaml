name: Formula Recollection
system:
  description:
    value: >-
      <p><em>You are able to record and recall even the complex and intricate
      details of spellcasting.</em></p><p><strong>Prerequisites</strong>:
      Spellcraft 5 ranks, keen recollection class
      feature.</p><p><strong>Benefits</strong>: Once per day, you can record the
      formula for a spell that you saw being cast and identified with Spellcraft
      in the past 24 hours. This spell must be on the alchemist formula
      list.</p>
  tags:
    - General
type: feat
