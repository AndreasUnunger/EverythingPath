name: Asura Style
system:
  description:
    value: >-
      <p><em>Blasphemy comes quite naturally to you. When you interrupt your
      foes' divine spells, you use words, symbols, or gestures so abhorrent to
      their faith that they are repulsed by your
      deeds.</em></p><p><strong>Prerequisites</strong>: Wis 13, Improved Unarmed
      Strike, base attack bonus +5 or monk level
      5th.</p><p><strong>Benefits</strong>: When you use a monk weapon or
      unarmed strike to attack a creature that is casting a divine spell, the
      target is sickened for 1d4 rounds. A target can attempt a Fortitude save
      (DC = 10 + half your character level + your Wisdom modifier) to reduce the
      duration of the sickened effect to 1 round.</p>
  tags:
    - Combat
    - Style
type: feat
