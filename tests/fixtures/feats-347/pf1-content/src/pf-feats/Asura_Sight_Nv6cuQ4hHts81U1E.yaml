      <p><em>Taking inspiration from the many faces of asuras, you have learned
      to split your focus to avoid being caught off
      guard.</em></p><p><strong>Prerequisites</strong>: Asura Style, base attack
      bonus +9 or monk level 9th.</p><p><strong>Benefits</strong>: When using
