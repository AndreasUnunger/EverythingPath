    value: >-
      <p><em>This creature is particularly skilled at making attacks with its
      natural weapons.</em></p><p><strong>Prerequisites</strong>: Three or more
      natural attacks.</p><p><strong>Benefits</strong>: The creature's secondary
      attacks with natural weapons take only a -2
      penalty.</p><p><strong>Normal</strong>: Without this feat, the creature’s
      secondary attacks with natural weapons take a –5 penalty.</p>
