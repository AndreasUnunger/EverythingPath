      bonus;&nbsp;<strong>Weight</strong>&nbsp;-</p><h3>Description</h3><p>A&nbsp;<em>ghost
      touch&nbsp;</em>weapon deals damage normally against incorporeal
      creatures, regardless of its bonus. An incorporeal creature's 50%
      reduction in damage from corporeal sources does not apply to attacks made
      against it with&nbsp;<em>ghost touch&nbsp;</em>weapons. The weapon can be
      picked up and moved by an incorporeal creature at any time. A manifesting
      ghost can wield the weapon against corporeal foes. Essentially,
      a&nbsp;<em>ghost touch&nbsp;</em>weapon counts as both corporeal or
      incorporeal. This special ability can only be placed on melee weapons and
      ammunition.</p><h3>Construction</h3><p><strong>Requirements</strong>&nbsp;Craft
      Magic Arms and Armor,&nbsp;<em>plane
      shift</em>;&nbsp;<strong>Price</strong>&nbsp;-</p>
