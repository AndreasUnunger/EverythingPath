name: Shadow's Embrace
system:
  description:
    value: >-
      <p><em>Shadows rise and fall at your
      whim.</em></p><p><strong>Prerequisites</strong>: Shadow illusion class
      feature.</p><p><strong>Benefits</strong>: Your shadow illusion ability can
      encase you in shadows as the darkness spell, using your shadow dancer
      level as the caster level. As a standard action, you can raise or lower
      the illumination level of the effect, from darkness up to normal
      light.</p>
