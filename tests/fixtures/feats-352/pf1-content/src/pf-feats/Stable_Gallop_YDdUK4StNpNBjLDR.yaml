name: Stable Gallop
system:
  description:
    value: >-
      <p><em>You run with a smooth and steady
      gait.</em></p><p><strong>Prerequisites</strong>: Animal or magical
      beast.</p><p><strong>Benefits</strong>: Your AC penalty when charging is
      halved. The penalties on ranged attacks made by your rider are reduced by
      1 when you take a double move and by 2 when you run (minimum penalty of
      0). Your rider gains a +4 bonus on concentration checks caused by your
      motion.</p>
  tags:
    - General
type: feat
