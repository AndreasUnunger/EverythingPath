name: Moonlight Stalker Feint
system:
  description:
    value: >-
      <p><em>You strike through the shadows so quickly that your opponent can
      barely react to your attacks.</em></p><p><strong>Prerequisites</strong>:
      Int 13, Blind-Fight, Combat Expertise, Improved Feint, Moonlight Stalker,
      Bluff 6 ranks, darkvision or low-light vision racial
      trait.</p><p><strong>Benefits</strong>: Once per round, against an
      opponent from whom you have concealment, you can spend a swift action to
      make a Bluff check to feint.</p><p><strong>Normal</strong>: Feinting is a
      standard action.</p><h3>Combat Trick</h3><p>When you attempt a Bluff check
      to feint against an opponent from whom you have concealment, you can spend
      up to 5 stamina points to gain a bonus on the Bluff check equal to double
      the number of stamina points you spent.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
