name: Master Hammer Throw
system:
  description:
    value: >-
      <p><em>Your ability to knock down foes with thrown weapons is second to
      none.</em></p><p><strong>Prerequisites</strong>: Int 13, Combat Expertise,
      Hammer Throw, Improved Hammer Throw, Improved Trip, Point-Blank Shot,
      Precise Shot, base attack bonus +6,
      dwarf.</p><p><strong>Benefits</strong>: You can immediately attempt a trip
      combat maneuver against a target that you successfully hit and damage with
      a thrown bludgeoning weapon with any attack, even as part of a full-attack
      action.</p>
