name: Nightmare Fist
system:
  description:
    value: >-
      <p><em>You are even more deadly in magical
      darkness.</em></p><p><strong>Prerequisites</strong>: Improved Unarmed
      Strike, Intimidate 1 rank, ability to create magical
      darkness.</p><p><strong>Benefits</strong>: While fighting within an area
      of magical darkness, you gain a +2 bonus on damage rolls with unarmed
      strikes, or a +4 bonus against opponents that are shaken, frightened, or
      panicked. You also gain a +2 morale bonus on Acrobatics and Intimidate
      checks.</p><h3>Combat Trick</h3><p>When fighting in an area of magical
      darkness, you can spend up to 5 stamina points to increase the bonus
      granted by this feat on one damage roll by double the number of stamina
      points you spent.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
