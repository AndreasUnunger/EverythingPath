name: Open Up
system:
  description:
    value: >-
      <p><em>You pull an opponent's shield, opening your foe up to an
      unobstructed attack by an ally.</em></p><p><strong>Prerequisites</strong>:
      Int 13, Combat Expertise.</p><p><strong>Benefits</strong>: When you
      successfully use the aid another action to improve the next attack roll
      against an opponent by an ally who also has this feat, that attack also
      ignores any Armor Class bonus granted by the opponent's shield. This
      benefit affects only physical shields, not shield bonuses from spells or
      other sources.</p><p><strong>Special</strong>: If both you and your ally
      also have the Harrying Partners teamwork feat, all of your ally's attacks
      made before your next turn ignore the opponent's Armor Class bonus from a
      shield.</p>
  tags:
    - Combat
    - Teamwork
type: feat
