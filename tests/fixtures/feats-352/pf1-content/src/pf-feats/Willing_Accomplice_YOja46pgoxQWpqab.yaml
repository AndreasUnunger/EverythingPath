name: Willing Accomplice
system:
  description:
    value: >-
      <p><em>Your well-placed support can aid friends and allies in maintaining
      their most precious secrets.</em></p><p><strong>Prerequisites</strong>:
      Cha 13, Bluff 3 ranks, Sense Motive 1
      rank.</p><p><strong>Benefits</strong>: As a standard action, you can
      attempt a Bluff check to aid another's Disguise check. In addition, when
      attempting such a check to aid a vigilante ally in maintaining that ally's
      social identity, a successful check grants that ally a +5 bonus instead of
      the normal +2.</p>
  tags:
    - General
type: feat
