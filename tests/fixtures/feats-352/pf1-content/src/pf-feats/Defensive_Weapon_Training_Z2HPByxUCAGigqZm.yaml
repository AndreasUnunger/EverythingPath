name: Defensive Weapon Training
system:
  description:
    value: >-
      <p><em>You know how to defend yourself against a certain class of
      weaponry.</em></p><p><strong>Prerequisites</strong>: Int 13, base attack
      bonus +5.</p><p><strong>Benefits</strong>: Choose a weapon group from the
      fighter's weapon training class ability list (except natural weapons). You
      gain a +2 dodge bonus on AC when an opponent attacks you using a weapon
      from that group. If you also have the weapon training class feature in the
      selected group, your dodge bonus from this feat increases to
      +3.</p><p><strong>Special</strong>: You can select this feat more than
      once. Its effects do not stack. Each time you select this feat, it applies
      to a different weapon group.</p><h3>Combat Trick</h3><p>You can spend 5
      stamina points at the beginning of your turn to switch the weapon group of
      this feat to any other weapon group on the fighter's weapon training class
      ability list (except natural weapons). This benefit lasts for 3
      rounds.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
