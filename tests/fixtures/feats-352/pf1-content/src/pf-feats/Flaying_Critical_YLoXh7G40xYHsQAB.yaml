name: Flaying Critical
system:
  description:
    value: >-
      <p><em>Your critical hits weaken your opponents'
      defenses.</em></p><p><strong>Prerequisites</strong>: Critical Focus, base
      attack bonus +11.</p><p><strong>Benefits</strong>: Whenever you score a
      critical hit, your opponent takes a -1 penalty to its natural armor bonus
      for the duration of the encounter. This penalty is cumulative, but cannot
      reduce an opponent's natural armor bonus below 0.</p>
  tags:
    - Combat
    - Critical
type: feat
