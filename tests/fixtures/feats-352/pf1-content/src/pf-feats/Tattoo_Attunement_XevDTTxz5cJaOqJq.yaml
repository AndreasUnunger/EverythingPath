name: Tattoo Attunement
system:
  description:
    value: >-
      <p><em>You've learned to absorb summoned creatures into temporary spell
      tattoos.</em></p><p><strong>Prerequisites</strong>: Inscribe Magical
      Tattoo or Varisian Tattoo; Spellcraft 5
      ranks.</p><p><strong>Benefits</strong>: As a standard action, you can
      touch a single creature that you've summoned, instantly transforming it
      into a magical tattoo on your body. This tattoo takes up one magic item
      slot if the summoned creature is Medium or smaller, and one additional
      adjacent slot for each size category larger than Medium (see page 16 of
      Pathfinder Campaign Setting: Inner Sea Magic for rules on magical
      tattoos). You can have only one such tattoo at a time.</p><p>While in
      tattoo form, the summoned creature can't take actions and doesn't need to
      eat, sleep, or breathe; it retains the remaining duration of the summoning
      spell used to conjure it. The creature can stay in tattoo form for a
      number of hours equal to your caster level. If the creature is still in
      tattoo form at the end of that time, the tattoo disappears, the creature
      is sent back to the plane from which it was summoned, and the remaining
      duration of the summon is wasted. As a standard action that provokes
      attacks of opportunity, you can cause the creature to change from a tattoo
      back into creature form, and appear in a square adjacent to you. The
      remaining duration of the spell is then expended as normal. The creature
      is staggered for 1 round after emerging from tattoo form. This is a
      supernatural ability.</p>
  tags:
    - General
type: feat
