name: Efficient Focus Shift
system:
  description:
    value: >-
      <p><em>You are more adept than most at shifting mental focus between your
      implements.</em></p><p><strong>Prerequisites</strong>: Occultist level
      7th.</p><p><strong>Benefits</strong>: Twice per day when you shift mental
      focus from one implement to another, you can add the same number of points
      to the latter implement that you removed from the
      former.</p><p><strong>Normal</strong>: By removing points of mental focus
      from one implement, you can add the same amount - 1 to
      another.</p><p><strong>Special</strong>: You can take this feat multiple
      times. Its effects stack.</p>
  tags:
    - General
type: feat
