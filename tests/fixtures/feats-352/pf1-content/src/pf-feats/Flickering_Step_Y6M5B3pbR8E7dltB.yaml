name: Flickering Step
system:
  description:
    value: >-
      <p><em>You can appear and disappear in the blink of an
      eye.</em></p><p><strong>Prerequisites</strong>: Knowledge (planes) 9
      ranks.</p><p><strong>Benefits</strong>: You can use dimension door as a
      spell-like ability with a caster level equal to your ranks in Knowledge
      (planes). You can't teleport a distance greater than twice your base speed
      in this way, and you must have both line of sight and line of effect to
      your destination.</p><p>You can use this feat's benefit once per day, plus
      an additional time per day for every 5 ranks you have in Knowledge
      (planes).</p><p><strong>Special</strong>: A fighter with this feat treats
      Dimensional Agility and any feat that lists it as a prerequisite as though
      they were combat feats when selecting fighter bonus feats.</p>
  tags:
    - Conduit
type: feat
