name: Messenger of Fate
system:
  description:
    value: >-
      <p><em>The Lady of Graves has blessed you with the power of true
      prophecy.</em></p><p><strong>Prerequisites</strong>: Ability to cast
      augury, worshiper of Pharasma.</p><p><strong>Benefits</strong>: When
      casting divination spells, you do so at +1 caster level. If your
      divination spell has a base percentage chance of providing correct or
      useful information, your maximum chance of gleaning correct or useful
      information is 100%, instead of the standard 90%.</p>
