name: Grudge Fighter
system:
  description:
    value: >-
      <p><em>You feel great anger at anyone who dares to attack you, and this
      fury makes your own attacks that much
      stronger.</em></p><p><strong>Prerequisites</strong>:
      Orc.</p><p><strong>Benefits</strong>: You gain a +1 morale bonus on attack
      and damage rolls made against any creature that attacked you in the
      current combat.</p><h3>Combat Trick</h3><p>When you hit a creature that
      attacked you in the current combat, you can spend up to 2 stamina points
      to deal an amount of extra damage to it equal to double the number of
      stamina points you spent.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
