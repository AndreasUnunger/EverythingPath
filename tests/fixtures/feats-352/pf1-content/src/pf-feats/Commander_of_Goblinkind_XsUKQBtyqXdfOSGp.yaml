name: Commander of Goblinkind
system:
  description:
    value: >-
      <p><em>You employ ruthlessness and malice to command other races of
      goblinoids to do your bidding.</em></p><p><strong>Prerequisites</strong>:
      Cha 13, hobgoblin.</p><p><strong>Benefits</strong>: You receive a +5
      competence bonus on Knowledge (local) checks and Charisma-based skill
      checks regarding other goblinoids. If you have the Leadership feat, treat
      your leadership score as 2 higher when taking followers or a cohort with
      the goblinoid subtype.</p>
  tags:
    - Racial
    - Hobgoblin
type: feat
