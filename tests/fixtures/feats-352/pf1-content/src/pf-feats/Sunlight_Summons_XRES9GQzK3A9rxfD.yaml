name: Sunlight Summons
system:
  description:
    value: >-
      <p><em>Your summoned minions shine with the power of the
      sun.</em></p><p><strong>Prerequisites</strong>: Spell Focus (conjuration),
      able to cast summon nature's ally.</p><p><strong>Benefits</strong>:
      Creatures that you summon shed light as a light spell. They are immune to
      blinding or dazzling effects, and their natural weapons are treated as
      magical for overcoming damage reduction.</p>
  tags:
    - General
type: feat
