name: Crippling Critical
system:
  description:
    value: >-
      <p><em>You are able to maim a target and hinder its
      movement.</em></p><p><strong>Prerequisites</strong>: Critical Focus, base
      attack bonus +13.</p><p><strong>Benefits</strong>: Whenever you score a
      critical hit against an opponent, its speed is halved for 1 minute. A
      successful Fortitude save reduces this duration to 1d4 rounds. The DC of
      this save is equal to 10 + your base attack bonus. Against creatures with
      multiple types of movement, you must choose which movement type to affect.
      A flying creature hit by this attack must make a DC 10 Fly check to remain
      airborne, and has its maneuverability reduced by one
      step.</p><p><strong>Special</strong>: You can only apply the effects of
      one critical feat to a given critical hit unless you possess Critical
      Mastery.</p><h3>Combat Trick</h3><p>When you confirm a critical hit and
      attempt to cripple an opponent with this feat, you can spend up to 5
      stamina points to increase the DC of this feat's saving throw by an amount
      equal to the number of stamina points you spent.</p>
  tags:
    - Combat
    - Critical
    - Combat Trick
type: feat
