name: Cloak and Dagger Style
system:
  description:
    value: >-
      <p><em>Your attacks effortlessly inflict debilitating conditions on
      unaware opponents.</em></p><p><strong>Prerequisites</strong>: Int 13,
      Combat Expertise, Improved Dirty Trick, Vital Strike, Weapon Focus with
      the chosen weapon, base attack bonus +6.</p><p><strong>Benefits</strong>:
      Choose one light melee weapon. While using this style, whenever you use
      the attack action to attack an opponent during a surprise round with your
      chosen weapon, you can attempt a dirty trick combat maneuver check against
      that opponent as a free action. Additionally, if an adjacent target
      attempts to remove a condition that you inflicted upon it with the dirty
      trick combat maneuver, it provokes an attack of opportunity from
      you.</p><p><strong>Special</strong>: In addition to the chosen weapon, a
      character with the weapon training class feature can use Cloak and Dagger
      Style with any light melee weapon belonging to any fighter weapon group he
      has selected with weapon training. A character with the swashbuckler
      weapon training class feature can use Cloak and Dagger Style with light
      and one-handed piercing weapons.</p>
  tags:
    - Combat
    - Style
type: feat
