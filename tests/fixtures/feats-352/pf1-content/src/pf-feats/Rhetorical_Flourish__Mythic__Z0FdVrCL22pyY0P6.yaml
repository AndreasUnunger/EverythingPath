    value: >-
      <p><em>You're supremely skilled at using verbal misdirection
      and</em></p><p><strong>Prerequisites</strong>: Rhetorical
      Flourish.</p><p><strong>Benefits</strong>: When you successfully use
      Rhetorical Flourish against a non-mythic creature, the bonus on your
      Diplomacy check increases by your tier. If the target is a mythic
      creature, you instead increase the bonus by half your tier.</p><p>You can
      expend one use of mythic power to reroll a single failed Bluff check. You
      must take the new result even if it is lower.</p>
