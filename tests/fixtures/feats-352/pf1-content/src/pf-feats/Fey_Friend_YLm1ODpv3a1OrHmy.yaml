name: Fey Friend
system:
  description:
    value: >-
      <p><em>Your reverence for the Eldest helps make fey your
      allies.</em></p><p><strong>Prerequisites</strong>: Worshiper of one of the
      Eldest.</p><p><strong>Benefits</strong>: Fey regard you as akin to them,
      and the spells and other abilities of fey treat you as fey or your actual
      type, whichever is more advantageous to you. You gain a +2 bonus on Bluff,
      Diplomacy, and Sense Motive checks against fey.</p>
  tags:
    - General
type: feat
