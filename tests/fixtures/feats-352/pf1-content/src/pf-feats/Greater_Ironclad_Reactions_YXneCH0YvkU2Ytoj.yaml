name: Greater Ironclad Reactions
system:
  description:
    value: >-
      <p><em>You are able to quickly react to
      attacks.</em></p><p><strong>Prerequisites</strong>: Combat Reflexes,
      Ironclad Reactions, base attack bonus +11 or fighter level 8th, armor
      trainingclass feature, proficiency with medium
      armor.</p><p><strong>Benefits</strong>: You can use Ironclad Reactions
      more than once per round, but not more than once for each act you take
      that provokes an attack of opportunity. Each 5-foot step you take still
      counts as expending one use of an attack of opportunity.</p><h3>Combat
      Trick</h3><p>You can spend 5 stamina points to use this feat without it
      counting against your maximum number of attacks of opportunity for that
      round. (See page 16.)</p>
  tags:
    - Armor Mastery
    - Combat
    - Combat Trick
type: feat
