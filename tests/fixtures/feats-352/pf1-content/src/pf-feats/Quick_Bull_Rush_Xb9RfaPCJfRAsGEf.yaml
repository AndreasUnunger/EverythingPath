name: Quick Bull Rush
system:
  description:
    value: >-
      <p><em>You can barrel into your opponent and follow this with an
      attack.</em></p><p><strong>Prerequisites</strong>: Str 13, Improved Bull
      Rush, Power Attack, base attack bonus +6.</p><p><strong>Benefits</strong>:
      On your turn, you can perform a single bull rush combat maneuver in place
      of one of your melee attacks. You must choose the melee attack with the
      highest base attack bonus to make the bull
      rush.</p><p><strong>Normal</strong>: A bull rush combat maneuver is a
      standard action.</p><h3>Combat Trick</h3><p>: You can spend 2 stamina
      points to change an attack that does not have your highest base attack
      bonus into a bull rush combat maneuver. You can use this combat trick only
      once per round, but you can use it even if you already used your attack at
      the highest base attack bonus to bull rush.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
