name: Fury of the Tainted
system:
  description:
    value: >-
      <p><em>The unstoppable anger you feel toward do-gooders and selfproclaimed
      saints makes you a force to be reckoned
      with.</em></p><p><strong>Prerequisites</strong>: Cha 13, rage class
      feature, tiefling.</p><p><strong>Benefits</strong>: While raging, you gain
      a +4 competence bonus on saving throws made against spells and effects
      with the good descriptor.</p>
