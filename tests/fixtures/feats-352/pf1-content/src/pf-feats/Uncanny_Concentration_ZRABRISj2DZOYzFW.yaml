name: Uncanny Concentration
system:
  description:
    value: >-
      <p><em>You have learned to enter a deeper state when casting spells,
      allowing you to shrug off distractions, damage, weather effects, and even
      the effects of other spells.</em></p><p><strong>Prerequisites</strong>:
      Combat Casting.</p><p><strong>Benefits</strong>: You do not need to make
      concentration checks when affected by vigorous or violent motion or by
      violent weather. You gain a +2 bonus on all other concentration
      checks.</p>
  tags:
    - General
type: feat
