name: Purifying Channel
system:
  description:
    value: >-
      <p><em>Your healing energy also damages your
      enemies.</em></p><p><strong>Prerequisites</strong>: Cha 15, Selective
      Channeling, channel energy class feature.</p><p><strong>Benefits</strong>:
      When you channel positive energy to heal, one creature that you exclude
      from your channeling takes an amount of fire damage equal to the die
      result you roll for healing, and is dazzled for 1 round by the light of
      these flames. A successful saving throw against your channel energy halves
      the fire damage and negates the dazzled effect.</p>
  tags:
    - Channeling
type: feat
