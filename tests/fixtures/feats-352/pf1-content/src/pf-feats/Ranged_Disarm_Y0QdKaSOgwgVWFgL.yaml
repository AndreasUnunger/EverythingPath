img: systems/pf1/icons/misc/divert.png
name: Ranged Disarm
system:
  description:
    value: >-
      <p><em>A well-placed shot disarms your
      foe.</em></p><p><strong>Prerequisites</strong>: Dex 13, Deadly Aim, base
      attack bonus +1.</p><p><strong>Benefits</strong>: As a full-round action,
      you can attempt to perform a disarm combat maneuver with any ranged weapon
      at a -2 penalty. Add your Dexterity modifier to your CMB in place of your
      Strength modifier and apply range penalties to your combat maneuver check,
      doubling the penalties from range increments. If your target is more than
      30 feet away, you take an additional -2 penalty. If the disarm attempt is
      successful, the target also takes damage as if you had made a successful
      attack with that weapon. You cannot be disarmed by failing this disarm
      attempt.</p>
  tags:
    - Combat
    - Targeting
type: feat
