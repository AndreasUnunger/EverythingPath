name: Creative Armorsmith
system:
  description:
    value: >-
      <p><em>You can temporarily customize your own
      armor.</em></p><p><strong>Prerequisites</strong>: Craft (armor) 3 ranks,
      Knowledge (engineering) 3 ranks.</p><p><strong>Benefits</strong>: With an
      hour of work, you can temporarily add an armor modification of your choice
      to your armor, or temporarily remove an existing modification, at no cost.
      You must have access to masterwork artisan's tools designed for
      armorsmithing to perform this alteration. This alteration lasts for 8
      hours. Armor modifications you add this way only provide their benefits to
      you; any other wearer suffers the modification's drawbacks but does not
      gain its benefits.</p>
  tags:
    - Combat
type: feat
