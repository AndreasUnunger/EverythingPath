name: Atheist Abjurations
system:
  description:
    value: >-
      <p><em>Your critical attitude toward the divine allows you to determine
      the best ways to remove divine
      influence.</em></p><p><strong>Prerequisites</strong>: Divine
      Defiance.</p><p><strong>Benefits</strong>: You gain a +2 bonus to your
      caster level whenever you use an abjuration spell to dispel or counter a
      divine spell, or send an extraplanar outsider summoned or called by a
      divine caster back to its home plane.</p>
  tags:
    - General
type: feat
