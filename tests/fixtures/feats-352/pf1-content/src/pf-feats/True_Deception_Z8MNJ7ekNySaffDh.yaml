name: True Deception
system:
  description:
    value: >-
      <p><em>Time spent learning the mystic arts of disguise has given you
      insight into the anonymity of the
      everyday.</em></p><p><strong>Prerequisites</strong>: Cha 17, Disguise 17
      ranks, master disguise master ninja trick or master of disguise advanced
      rogue talent, ninja level 10th or rogue level
      10th.</p><p><strong>Benefits</strong>: When using the master disguise
      master ninja trick or master of disguise advanced rogue talent to take on
      the appearance of a specific individual, you can fool divination magic and
      effects designed to locate the subject of your disguise as per the
      vigilante's any guise social talent. In addition, you gain a +10 bonus on
      Bluff checks to act like that individual.</p>
  tags:
    - General
type: feat
