name: Rime Spell
system:
  description:
    value: >-
      <p><em>Creatures damaged by your spells with the cold descriptor become
      entangled.</em></p><p><strong>Benefits</strong>: The frost of your cold
      spell clings to the target, impeding it for a short time. A rime spell
      causes creatures that takes cold damage from the spell to become entangled
      for a number of rounds equal to the original level of the spell.</p><p>
      This feat only affects spells with the cold descriptor. A rime spell uses
      up a spell slot one level higher than the spell's actual level.</p>
  tags:
    - Metamagic
type: feat
