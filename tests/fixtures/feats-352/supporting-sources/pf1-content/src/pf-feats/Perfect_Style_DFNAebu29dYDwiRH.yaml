name: Perfect Style
system:
  description:
    value: >-
      <p><em>You have trained at one of the Houses of
      Perfection.</em></p><p><strong>Prerequisites</strong>: Wis 13; base attack
      bonus +5 or monk level 5th.</p><p><strong>Benefits</strong>: When you take
      this feat, choose one of the Houses of Perfection; once this decision has
      been made, it cannot be changed. While using this style, you gain a type
      of energy resistance based on the House of Perfection you have chosen.
      Students of the Monastery of Untwisting Iron gain acid resistance 5.
      Students of the Monastery of Unblinking Flame gain fire resistance 5.
      Students of the Monastery of Unfolding Wind gain electricity resistance 5.
      If you have energy resistance from a racial trait or class feature, the
      energy resistance gained from this style stacks.</p><p>Additionally, you
      gain a ki pool that you can use to activate abilities of your chosen House
      of Perfection style. Your pool contains 2 ki points, and this increases by
      1 point at 9th level and every 4 levels thereafter. If you have a ki pool
      from another source, you do not gain additional ki points from this
      feat.</p><p><strong>Normal</strong>: You can select Perfect Style multiple
      times. Each time you do so, you must select a different House of
      Perfection to belong to.</p><h3>Combat Trick</h3><p>: You can spend up to
      5 stamina points to increase the resistance granted to you by Perfect
      Style by 2 per stamina point spent.</p>
  tags:
    - Combat
    - Style
    - Combat Trick
type: feat
