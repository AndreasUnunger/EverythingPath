name: Rhetorical Flourish
system:
  description:
    value: >-
      <p><em>You rapidly change topics and employ confusing rhetoric to distract
      people from your true intent.</em></p><p><strong>Prerequisites</strong>:
      Cha 13, Persuasive.</p><p><strong>Benefits</strong>: When using the
      Diplomacy skill to make a request or change a creature's attitude, you can
      use verbal misdirection. To do so, make a Bluff check against that
      creature. If you succeed, you gain a +4 bonus on your next Diplomacy check
      against that creature if the check is made within the next minute. If you
      fail by 5 or more, you instead take a -2 penalty on your next Diplomacy
      check against that creature.</p><p>Alternatively, you can use this feat to
      retry a single failed Diplomacy check against a creature. You take a -4
      penalty on your Bluff check when using Rhetorical Flourish in this way. If
      you succeed, rather than gaining this feat's normal bonus, you can retry
      your last Diplomacy check against the creature if that check was made in
      the past minute.</p>
  tags:
    - General
type: feat
