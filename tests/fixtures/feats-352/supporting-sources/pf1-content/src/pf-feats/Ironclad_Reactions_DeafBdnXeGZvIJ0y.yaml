name: Ironclad Reactions
system:
  description:
    value: >-
      <p><em>You are able to quickly react to
      attacks.</em></p><p><strong>Prerequisites</strong>: Base attack bonus +6
      or fighter level 4th, armor training class feature, proficiency with
      medium armor.</p><p><strong>Benefits</strong>: Once per round when a foe
      successfully hits you with an attack of opportunity, you can expend a use
      of an attack of opportunity to take a 5-foot step. You can do this even if
      you have already taken a 5-foot step.</p><h3>Combat Trick</h3><p>You can
      spend 3 stamina points to use this feat even if an attack of opportunity
      against you misses. (See page 17.)</p>
  tags:
    - Armor Mastery
    - Combat
    - Combat Trick
type: feat
