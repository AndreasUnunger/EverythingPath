name: Blight Survivalist
system:
  description:
    value: >-
      <p><em>You have learned to survive in dangerous
      environments.</em></p><p><strong>Prerequisites</strong>: Skill Focus
      (Survival).</p><p><strong>Benefits</strong>: You gain a +3 bonus on saving
      throws against environmental hazards and weather
      effects.</p><p><strong>Special</strong>: If you have the favored terrain
      class feature and the blighted land being explored matches one of those
      terrains, you can choose to use your favored terrain bonus in place of the
      +3 bonus granted by this feat.</p>
  tags:
    - General
type: feat
