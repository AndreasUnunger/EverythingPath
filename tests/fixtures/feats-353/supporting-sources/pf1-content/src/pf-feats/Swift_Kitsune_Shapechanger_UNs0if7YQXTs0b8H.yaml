name: Swift Kitsune Shapechanger
system:
  description:
    value: >-
      <p><em>You can change shape more quickly than most
      kitsune.</em></p><p><strong>Prerequisites</strong>: Dex 13, base attack
      bonus +6, kitsune.</p><p><strong>Benefits</strong>: You can assume human
      or kitsune form as a swift action. If you have the Fox Shape feat, you can
      assume fox form as a swift action as well.</p><p><strong>Normal</strong>:
      A kitsune's change shape ability is a standard action.</p>
  tags:
    - Racial
    - Kitsune
type: feat
