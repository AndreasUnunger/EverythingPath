name: Signature Deed
system:
  description:
    value: >-
      <p><em>You are known for performing a particular deed, and can perform it
      with greater ease.</em></p><p><strong>Prerequisites</strong>: Grit class
      feature, gunslinger level 11th.</p><p><strong>Benefits</strong>: Pick a
      deed that you have access to and that you must spend grit to perform. Once
      per round, you can perform this deed for 1 fewer grit point (minimum 0).
      You can reduce the cost of a deed in this way only if you have at least 1
      grit point.</p>
  tags:
    - Grit
type: feat
