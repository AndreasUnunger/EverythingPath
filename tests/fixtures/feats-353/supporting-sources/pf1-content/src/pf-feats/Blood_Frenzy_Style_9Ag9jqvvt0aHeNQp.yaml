name: Blood Frenzy Style
system:
  description:
    value: >-
      <p><em>You have learned to turn your pain into power, whipping yourself
      into a blood frenzy whenever you take
      damage.</em></p><p><strong>Prerequisites</strong>: Str 13, Improved
      Unarmed Strike, base attack bonus +1, aquatic
      subtype.</p><p><strong>Benefits</strong>: While you are using Blood Frenzy
      Style, you gain a +2 bonus to your Strength and Constitution, and you take
      a -2 penalty to AC.</p><p><strong>Special</strong>: You can enter Blood
      Frenzy Style only as an immediate action when you take damage. You cannot
      enter this style as a swift action, as with other style feats.</p>
  tags:
    - Combat
    - Style
type: feat
