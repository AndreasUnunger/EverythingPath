name: Arctic Adaptation
system:
  description:
    value: >-
      <p><em>You are comfortable in the driving snow and glaring ice of frigid
      climes, and you can survive much longer in such harsh environments than
      those who are unaccustomed to the
      cold.</em></p><p><strong>Prerequisites</strong>: Favored terrain (cold)
      class feature.</p><p><strong>Benefits</strong>: You treat cold
      environments (Core Rulebook 442) as though they were one step less severe
      than they normally are. Additionally, you gain a +2 bonus on Perception
      checks against creatures that gain a racial bonus on Stealth checks in
      snowy conditions, and you gain a +4 bonus on saving throws and checks to
      avoid becoming blinded or dazzled by ice or snow glare.</p>
  tags:
    - General
type: feat
