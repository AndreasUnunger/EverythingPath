name: Stumbling Bash
system:
  description:
    value: >-
      <p><em>Your shield bash causes your enemies to
      falter.</em></p><p><strong>Prerequisites</strong>: Improved Shield Bash,
      Shield Focus, base attack bonus +6 or fighter level
      4th.</p><p><strong>Benefits</strong>: Creatures struck by your shield bash
      take a -2 penalty to their AC until the end of your next turn.</p>
