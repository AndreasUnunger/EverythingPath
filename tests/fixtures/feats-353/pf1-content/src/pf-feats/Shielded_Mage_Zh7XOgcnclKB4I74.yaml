name: Shielded Mage
system:
  description:
    value: >-
      <p><em>You have learned how to cast spells from behind the safety of a
      shield.</em></p><p><strong>Prerequisites</strong>: Shield Focus, base
      attack bonus +3 or fighter level 1st.</p><p><strong>Benefits</strong>: You
      reduce the arcane spell failure of any shield you use by 15% (to a minimum
      of 0%). Using a shield does not prevent you from completing somatic spell
      components with the hand wielding the shield.</p>
  tags:
    - Combat
    - Shield Mastery
type: feat
