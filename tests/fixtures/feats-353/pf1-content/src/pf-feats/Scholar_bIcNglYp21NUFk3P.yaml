name: Scholar
system:
  description:
    value: >-
      <p><em>You have graduated from one of the many colleges, universities, and
      specialized schools of higher learning scattered throughout the Inner Sea
      region.</em></p><p><strong>Benefits</strong>: Pick any two Knowledge
      skills. You gain a +2 bonus on checks with these two skills. If you have
      10 or more ranks in one of these Knowledge skills, the bonus increases to
      +4 for that skill.</p><p><strong>Special</strong>: This feat is
      unaffiliated; a creature need not be affiliated with the Magaambya to
      select this feat.</p>
