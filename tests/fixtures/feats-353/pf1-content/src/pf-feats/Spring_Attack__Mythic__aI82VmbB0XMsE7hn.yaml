name: Spring Attack (Mythic)
system:
  description:
    value: >-
      <p><em>You move across the battlefield in a blur of whirling
      blades.</em></p><p><strong>Prerequisites</strong>: Spring Attack, base
      attack bonus +6.</p><p><strong>Benefits</strong>: When you use Spring
      Attack, you don't need to move at least 10 feet before making the first
      attack. If you expend one use of mythic power when you start a Spring
      Attack, the movement you make during the Spring Attack doesn't provoke
      attacks of opportunity.</p>
