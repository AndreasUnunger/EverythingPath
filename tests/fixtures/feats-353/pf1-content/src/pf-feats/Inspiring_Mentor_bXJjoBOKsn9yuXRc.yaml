name: Inspiring Mentor
system:
  description:
    value: >-
      <p><em>Others listen to your words of encouragement and perform acts above
      and beyond as a result.</em></p><p><strong>Prerequisites</strong>: Cha 13,
      inspire competence bardic performance.</p><p><strong>Benefits</strong>:
      Inspire competence now affects all allies within 30 feet who can hear your
      performance, as long as they are attempting the skill you've
      selected.</p><p><strong>Normal</strong>: Inspire competence only affects
      one ally.</p>
