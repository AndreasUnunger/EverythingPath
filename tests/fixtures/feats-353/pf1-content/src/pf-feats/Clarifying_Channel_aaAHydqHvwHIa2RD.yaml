name: Clarifying Channel
system:
  description:
    value: >-
      <p><em>Your channeled energy heals the body and opens the mind to the
      possibility of true love.</em></p><p><strong>Prerequisites</strong>:
      Channel energy class feature, worshiper of
      Shelyn.</p><p><strong>Benefits</strong>: Once per day when you channel
      positive energy to heal living creatures, if any of the creatures you
      healed are currently affected by one or more charms or compulsions that
      allowed a saving throw, you grant each of those creatures an immediate
      save to prematurely end one of those effects. Creatures healed gain a
      sacred bonus on this save equal to your Charisma bonus (minimum +1).</p>
  tags:
    - Channeling
type: feat
