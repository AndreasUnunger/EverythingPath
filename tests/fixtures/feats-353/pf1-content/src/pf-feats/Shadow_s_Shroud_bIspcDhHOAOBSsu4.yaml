img: systems/pf1/icons/feats/stealthy.jpg
name: Shadow's Shroud
system:
  description:
    value: >-
      <p><em>You can camouflage yourself in shadows and
      gloom.</em></p><p><strong>Prerequisites</strong>: Knowledge (planes) 5
      ranks.</p><p><strong>Benefits</strong>: As a swift action, you can shroud
      yourself in shifting, camouflaging shadow. While shrouded in this fashion,
      you can attempt Stealth checks as though you had concealment, even in
      areas of normal or bright light. Creatures that can see normally in
      supernatural darkness can still see you normally.</p><p>You can use this
      feat's benefit for a number of rounds per day equal to your ranks in
      Knowledge (planes). These rounds need not be
      consecutive.</p><p><strong>Special</strong>: Unlike spells like shadow
      walk, which require you to be on a plane that is coterminous with the
      Shadow Plane, this feat functions even on planes that do not normally
      share a border with the Shadow Plane. Like all conduit feats, the effects
      are suppressed when planar travel is forbidden.</p>
  tags:
    - Conduit
type: feat
