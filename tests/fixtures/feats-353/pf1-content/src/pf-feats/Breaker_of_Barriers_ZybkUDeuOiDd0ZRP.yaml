name: Breaker of Barriers
system:
  description:
    value: >-
      <p><em>You see it as your sacred duty to destroy all
      obstacles.</em></p><p><strong>Prerequisites</strong>: Str 17, worshiper of
      Rovagug.</p><p><strong>Benefits</strong>: You gain a +2 bonus on Strength
      checks to break down doors, walls, dams, and other barriers and on combat
      maneuver checks to bull rush and overrun opponents. You ignore the first 5
      points of hardness when you deal damage to doors, walls, dams, and other
      barriers.</p>
  tags:
    - Combat
type: feat
