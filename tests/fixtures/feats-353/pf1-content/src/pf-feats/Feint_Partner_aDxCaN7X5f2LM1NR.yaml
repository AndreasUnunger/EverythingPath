name: Feint Partner
system:
  description:
    value: >-
      <p><em>A little diversion is all you need to slip through your foe's
      defenses.</em></p><p><strong>Prerequisites</strong>: Bluff 1
      rank.</p><p><strong>Benefits</strong>: Whenever an ally who also has this
      feat successfully feints an opponent, that opponent also loses his
      Dexterity bonus to AC against the next attack you make against him before
      the end of the feinting ally's next turn.</p><p><strong>Combat
      Trick</strong>: When feinting an opponent, you can spend 5 stamina points
      to have that opponent lose its Dexterity bonus to AC against the next
      attack made by any of your allies. If the next ally to attack that
      opponent also has this feat, that ally's attacks do not count as the next
      attack for the purpose of this combat trick, allowing another ally to gain
      this benefit.</p>
  tags:
    - Combat
    - Teamwork
type: feat
