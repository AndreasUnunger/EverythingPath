name: Incremental Elemental Assault
system:
  description:
    value: >-
      <p><em>You may activate and quench your elemental assault ability multiple
      times per day.</em></p><p><strong>Prerequisites</strong>:
      Suli.</p><p><strong>Benefits</strong>: You may use your elemental assault
      ability in 1-round increments, up to a maximum number of rounds per day
      equal to your character level. These rounds do not have to be consecutive.
      Activating the ability is a swift action; ending it is a free
      action.</p><p><strong>Normal</strong>: You can use elemental assault once
      per day. It lasts a number of rounds equal to your class level.</p>
  tags:
    - Racial
    - Suli
type: feat
