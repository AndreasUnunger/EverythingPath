img: systems/pf1/icons/misc/divert.png
name: Rebuffing Reduction
system:
  description:
    value: >-
      <p><em>Your damage reduction can turn the force of blows back on your
      enemies.</em></p><p><strong>Prerequisites</strong>: Str 13, damage
      reduction, Improved Bull Rush, Power Attack, base attack bonus
      +1.</p><p><strong>Benefits</strong>: Whenever an opponent that is adjacent
      to you fails to penetrate your DR with a melee attack, you can spend an
      immediate action to attempt a bull rush combat maneuver against that
      opponent. If you succeed, you cannot move with the
      opponent.</p><p><strong>Normal</strong>: A bull rush combat maneuver is a
      standard action.</p><h3>Combat Trick</h3><p>: When you succeed at a bull
      rush combat maneuver check with this feat, you can spend 2 stamina points
      to move up to 5 feet with the target.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
