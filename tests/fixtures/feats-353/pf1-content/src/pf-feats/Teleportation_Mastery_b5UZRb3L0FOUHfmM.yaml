name: Teleportation Mastery
system:
  description:
    value: >-
      <p><em>You can coax teleportation from conjuration magic
      items.</em></p><p><strong>Prerequisites</strong>: Use Magic Device 4
      ranks, base Fortitude save bonus +6.</p><p><strong>Benefits</strong>: You
      can cause an item that has a conjuration spell of 3rd level or higher in
      its construction requirements to cast dimension door. You can use this
      ability once per day, plus an additional time per day at base Fortitude
      save bonus +9 and +12.</p><p><strong>Pathfinder Society<br /></strong>When
      qualifying for and calculating the benefits of an item mastery feat, a PC
      uses the base Fortitude save bonus from only one of his classes.</p>
  tags:
    - Item Mastery
type: feat
