name: Ascendant
system:
  description:
    value: >-
      <p><em>You seek unquestioning admiration and respect to escape from a
      shameful past.</em></p><p><strong>Prerequisites</strong>: You must have
      the Secret Shame drawback (page 7) or the Bastard-Born background, and you
      must also have no publicly known faults or made any indisputable mistakes
      that could humiliate or cast down a figure of high station
      .</p><p><strong>Benefits</strong>: You and your apparent allies gain a +2
      bonus on skill checks to gain influence (Ultimate Intrigue 102) or request
      a favor. This bonus no longer applies on checks against a person or
      organization once you fail a skill check to gain influence over or request
      a favor from that person or organization. Additionally, the DC of Sense
      Motive checks to get hunches about you and your apparent allies increases
      by 2.</p><p><strong>Goal</strong>: Achieve a position in a high social
      class (such as the nobility) or an esteemed military position (such as
      general) without any substantiated rumors impugning your reputation. If
      your secret is exposed, you can replace this feat with RedemptionUCA after
      1 month without meeting that feat's prerequisite.</p><p><strong>Completion
      Benefit<br /></strong>You no longer lose this feat's bonus for failing a
      skill check. Your Bluff checks to maintain a good reputation are always at
      worst unlikely (if not believable), and Bluff checks attempted by others
      to spoil your reputation are always at best unlikely (if not harder to
      believe).</p>
  tags:
    - Story
type: feat
