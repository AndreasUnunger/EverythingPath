name: Profane Studies
system:
  description:
    value: >-
      <p><em>Your study of fiends grants you advantages when summoning or
      fighting them.</em></p><p><strong>Prerequisites</strong>: Int 13,
      Knowledge (planes) 4 ranks, ability to cast a summon monster
      spell.</p><p><strong>Benefits</strong>: You gain a +5 bonus on Knowledge
      (planes) checks involving evil outsiders. Additionally, when you cast a
      summon monster spell to summon an evil outsider, treat your caster level
      as 2 levels higher for the purpose of determining the duration.</p>
  tags:
    - General
type: feat
