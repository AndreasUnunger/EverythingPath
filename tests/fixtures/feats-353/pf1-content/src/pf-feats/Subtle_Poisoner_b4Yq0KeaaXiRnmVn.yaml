name: Subtle Poisoner
system:
  description:
    value: >-
      <p><em>You have mastered the art of stealthily and quickly preparing a
      poisoned weapon.</em></p><p><strong>Prerequisites</strong>: Sleight of
      Hand 5 ranks.</p><p><strong>Benefits</strong>: Whenever you draw a weapon,
      you can apply poison to the weapon as part of the same action. To do so,
      you must already have the poison in hand and must succeed at a DC 20
      Sleight of Hand check. Success means the dose of poison is expended and
      you poison the weapon without drawing attention to your act. This check is
      in addition to any other Sleight of Hand checks you attempt to perform the
      action (such as to draw a hidden weapon). Failure means any creatures
      present can immediately attempt opposed Perception checks to notice your
      poisoning attempt. If you fail the check by 5 or more, you also expose
      yourself to the poison unless you have an ability that would prevent
      accidental poisoning, such as an alchemist's poison use ability.</p>
  tags:
    - General
type: feat
