name: Soul-Powered Magic
system:
  description:
    value: >-
      <p><em>You can use captured souls as material
      components.</em></p><p><strong>Prerequisites</strong>: Any evil alignment,
      caster level 5th.</p><p><strong>Benefits</strong>: When casting a spell
      would require an expensive material component, you can substitute a
      captured soul in its place. The soul can be captured in any way (the
      spells create soul gem, soul trap, and trap the soul are the most common
      methods), but you must be able to touch the soul or the object in which it
      is trapped (usually a crystal or gem) to use it as a material component.
      Using a soul in this way does not harm the object in which it was trapped.
      The soul itself must be at least equal in value to the gp cost of the
      material component you are replacing (any excess gp value is lost). See
      the sidebar on page 191 for the gp values of various souls.</p><p>A soul
      used as a material component is damaged but not destroyed. Once used, such
      a soul is no longer trapped and cannot be used as a material component
      again. A creature whose soul has been used as a material component cannot
      be restored to life via raise dead. Reincarnate, resurrection, and can
      restore such a creature to life if the caster succeeds at a DC 20 caster
      level check. Miracle and wish can restore the creature to life without
      requiring a caster level check. Using Soul-Powered Magic is an evil
      act.</p>
  tags:
    - General
type: feat
