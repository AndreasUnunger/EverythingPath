name: Shielded Staff Master
system:
  description:
    value: >-
      <p><em>Your staff and shield act as a single
      item.</em></p><p><strong>Prerequisites</strong>: Dex 17, Improved
      Two-Weapon Fighting, Shielded Staff Style, Two-Weapon Fighting, base
      attack bonus +8.</p><p><strong>Benefits</strong>: While using Shielded
      Staff Style, you add the attached buckler's or shield's enhancement bonus
      (if any) to the shield bonus you gain from this style. In addition, you do
      not take the -1 penalty to attacks made with a shielded staff. If both
      your shield and weapon have an enhancement bonus, use the higher of the
      two bonuses to determine your shielded staff's enhancement bonus to attack
      and damage rolls.</p>
  tags:
    - Combat
type: feat
