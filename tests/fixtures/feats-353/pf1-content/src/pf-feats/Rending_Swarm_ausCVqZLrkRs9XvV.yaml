img: systems/pf1/icons/races/ratfolk.png
name: Rending Swarm
system:
  description:
    value: >-
      <p><em>Together, you and your allies tear through enemies'
      defenses.</em></p><p><strong>Prerequisites</strong>: Dex 15, Rat Stack,
      swarming racial trait.</p><p><strong>Benefits</strong>: You gain a +1
      bonus on all melee damage rolls for each allied creature you share a
      square with that also has this feat.</p><p>If two or more allies sharing a
      square have this feat and hit the same adjacent creature in a round, they
      tear it in different directions, dealing additional damage at the end of
      the round. This rend attack deals an amount of damage equal to 1d6 + the
      highest Strength modifier of all qualifying allies in the same square who
      struck the target this round.</p>
  tags:
    - Combat
    - Teamwork
type: feat
