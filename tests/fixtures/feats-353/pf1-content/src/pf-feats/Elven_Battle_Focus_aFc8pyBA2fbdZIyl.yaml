name: Elven Battle Focus
system:
  description:
    value: >-
      <p><em>Your fighting style is enhanced by your keen
      intellect.</em></p><p><strong>Prerequisites</strong>: Int 13, Elven Battle
      Style, Elven Battle Training, Weapon Finesse, base attack bonus +4, weapon
      familiarity racial trait.</p><p><strong>Benefits</strong>: While using
      Elven Battle Style, you can add your Intelligence modifier to that
      weapon's damage (instead of any other ability bonus or modifier you can
      add to your weapon damage). The weapon must be one appropriate for your
      size.</p><p><strong>Pathfinder Society<br /></strong>This feat only
      functions with melee weapons.</p>
  tags:
    - Combat
type: feat
