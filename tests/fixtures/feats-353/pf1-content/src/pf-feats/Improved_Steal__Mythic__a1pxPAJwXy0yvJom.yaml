name: Improved Steal (Mythic)
system:
  description:
    value: >-
      <p><em>Your light fingers can lift even the most closely held item off an
      enemy.</em></p><p><strong>Prerequisites</strong>: Improved
      Steal.</p><p><strong>Benefits</strong>: You gain a bonus equal to half
      your tier on checks to attempt a steal combat maneuver, and to your CMD
      when an opponent attempts a steal combat maneuver on you. These bonuses
      stack with those granted by Improved Steal.</p><p>Furthermore, you can
      make an attack of opportunity against any creature that attempts a steal
      maneuver against, you unless it also has this feat.</p>
  tags:
    - Combat
    - Mythic
type: feat
