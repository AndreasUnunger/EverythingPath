name: Brutal Grappler
system:
  description:
    value: >-
      <p><em>When helping an ally grapple, you can damage the
      target.</em></p><p><strong>Prerequisites</strong>: Half-orc or
      orc.</p><p><strong>Benefits</strong>: When you and an ally with this feat
      have grappled the same creature, you may attempt to damage the opponent on
      your turn (whether you were the one who first initiated the grapple or
      were assisting your ally in doing so). You and the ally are treated as
      aiding each other in the grapple (+2 bonus on your grapple combat
      maneuver) as long as you both decide to maintain the
      grapple.</p><p><strong>Normal</strong>: When multiple creatures grapple
      one target, the creature that first initiates the grapple is the only one
      that makes a check to damage a grappled opponent, with a +2 bonus for each
      creature that assists the grapple using the Aid Another action.</p>
  tags:
    - Combat
    - Teamwork
    - Racial
    - Half-Orc
    - Orc
type: feat
