name: Retributive Summoning
system:
  description:
    value: >-
      <p><em>Your training in counterspelling summons is so extensive that you
      can redirect some of your foes' power to call forth your own
      allies.</em></p><p><strong>Prerequisites<br /></strong>Spell Focus
      (conjuration) or counter-summons class feature.</p><p><strong>Benefit<br
      /></strong>When you successfully counter a summoning spell with dispel
      magic or your own summon monster spell, you can immediately summon nonevil
      creatures as if you had just finished casting a summon monster spell of 2
      levels lower than the countered summoning spell.</p>
  tags:
    - General
type: feat
