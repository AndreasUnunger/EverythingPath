name: Courage in a Bottle
system:
  description:
    value: >-
      <p><em>You show little fear while
      inebriated.</em></p><p><strong>Prerequisites</strong>: Bravery class
      feature, worshiper of Cayden Cailean.</p><p><strong>Benefits</strong>:
      While you are intoxicated, the bonus you gain from your bravery class
      feature increases by 2. If this increase grants you a total bonus of +6 or
      higher against fear effects, you become immune to fear instead.</p>
  tags:
    - General
type: feat
