img: systems/pf1/icons/feats/greater-shield-focus.jpg
name: Shield Specialization
system:
  description:
    value: >-
      <p><em>You have mastered the use of one type of
      shield.</em></p><p><strong>Prerequisites</strong>: Proficiency with
      selected shield, Shield Focus, fighter level
      4th.</p><p><strong>Benefits</strong>: Choose one type of shield (buckler,
      light, heavy, or tower shield). With the selected shield, you gain a +2
      bonus to your Armor Class against critical hit confirmation rolls. In
      addition, you may add your base shield bonus (including the bonus from
      Shield Focus but not including enhancement bonuses) to your
      CMD.</p><p><strong>Special</strong>: You can gain this feat multiple
      times. Its effects do not stack. Each time you take the feat, it applies
      to a new type of shield.</p><h3>Combat Trick</h3><p>: When you are the
      target of a combat maneuver, you can spend 2 stamina points to add your
      shield's enhancement bonus to your CMD for that combat maneuver.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
