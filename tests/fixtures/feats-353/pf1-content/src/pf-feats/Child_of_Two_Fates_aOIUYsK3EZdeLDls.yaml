name: Child of Two Fates
system:
  description:
    value: >-
      <p><em>You have learned to make the most of your torn
      existence.</em></p><p><strong>Prerequisites</strong>: Knowledge (local) 5
      ranks, half-elf.</p><p><strong>Benefits</strong>: Once per day, you can
      select a teamwork feat that a human or elf ally within 30 feet possesses.
      You can ignore any race, ethnicity, or racial trait prerequisites, but you
      must still meet any other prerequisites for that feat to gain this
      benefit. You're treated as if you possess that feat for up to 1 minute, as
      long as you stay within 30 feet of the ally whose teamwork feat you have
      chosen to emulate.</p>
  tags:
    - Racial
    - Half-Elf
type: feat
