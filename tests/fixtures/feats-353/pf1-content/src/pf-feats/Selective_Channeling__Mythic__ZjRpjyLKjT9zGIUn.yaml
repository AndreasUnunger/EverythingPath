name: Selective Channeling (Mythic)
system:
  description:
    value: >-
      <p><em>When you exclude creatures from your channel, you empower those you
      do affect.</em></p><p><strong>Prerequisites</strong>: Selective
      Channeling.</p><p><strong>Benefits</strong>: When you channel energy, the
      damage you heal or deal increases by a number of points equal to twice the
      number of targets you excluded from your channeled energy. You can expend
      one use of mythic power to increase the number of targets you exclude from
      your channeled energy by half your tier.</p>
  tags:
    - Channeling
    - Mythic
type: feat
