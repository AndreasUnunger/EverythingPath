name: Greater Meditation Master
system:
  description:
    value: >-
      <p><em>You are able to glean insight from your momentary meditation longer
      than most.</em></p><p><strong>Prerequisites</strong>: Wis 15, Combat
      Meditation, Meditation Master, character level
      11th.</p><p><strong>Benefits</strong>: When you meditate, you gain a +2
      insight bonus instead of a +1 insight bonus. You can split this bonus
      between any two d20 rolls made over the duration of the feat that you used
      to meditate, adding +1 to each d20 roll, or using the full bonus on any
      one d20 roll, adding +2 to that single roll.</p>
  tags:
    - Meditation
type: feat
