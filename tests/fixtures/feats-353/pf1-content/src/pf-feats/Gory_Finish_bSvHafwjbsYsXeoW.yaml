name: Gory Finish
system:
  description:
    value: >-
      <p><em>By drawing upon wells of savagery, you can slay your foe in
      creative and horrifyingly gruesome manners, intimidating nearby
      foes.</em></p><p><strong>Prerequisites</strong>: Dazzling Display, Weapon
      Focus.</p><p><strong>Benefits</strong>: When you use the attack action,
      you can use a weapon with which you have Weapon Focus to make a single
      attack at your highest base attack bonus. If you reduce your target to
      negative hit points, you can spend a swift action to make an Intimidate
      check to demoralize all foes within 30 feet who could see your
      attack.</p><h3>Combat Trick</h3><p>You can spend 5 stamina points when
      confirming a critical on a Gory Finish attack to attempt an Intimidate
      check to demoralize all foes within 30 feet of you who can see your
      attack.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
