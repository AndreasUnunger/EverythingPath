  description:
    value: >-
      <p><em>You can sense creatures touching earth or
      stone.</em></p><p><strong>Prerequisites</strong>: Wis 13, Perception 10
      ranks, stone giant.</p><p><strong>Benefits</strong>: You gain tremorsense
      15 feet when in contact with earth or stone, including worked stone, and
      gain all the benefits of the tremorsense universal monster ability.</p>
