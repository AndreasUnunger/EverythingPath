img: systems/pf1/icons/races/creature-types/dragon.png
name: Focused Dragon Expertise
system:
  description:
    value: >-
      <p><em>Your understanding of dragons helps you to easily avoid breath
      weapons.</em></p><p><strong>Prerequisites</strong>: Favored enemy (dragon)
      class feature.</p><p><strong>Benefits</strong>: You gain a bonus on saving
      throws against breath weapons and fear effects equal to half your favored
      enemy (dragon) bonus. Whenever you succeed at a Reflex saving throw
      against a dragon's extraordinary or supernatural ability that would deal
      half damage, you instead take no damage. If you already have the evasion
      class feature, you instead gain an inquisitor's stalwart ability
      (Pathfinder RPG Advanced Player's Guide 41) against dragons' extraordinary
      and supernatural abilities.</p>
  tags:
    - Combat
type: feat
