name: Coordinated Defense
system:
  description:
    value: >-
      <p><em>You are adept at working with allies to avoid being tripped,
      grappled, and subjected to other
      maneuvers.</em></p><p><strong>Benefits</strong>: Whenever you are adjacent
      to an ally who also has this feat, you receive a +2 competence bonus to
      your Combat Maneuver Defense. This bonus increases to +4 if the creature
      attempting the maneuver is larger than both you and your
      ally.</p><h3>Combat Trick</h3><p>When you are targeted with a combat
      maneuver while you are adjacent to an ally who also has this feat, you can
      spend 1 or 2 stamina points. If you do, your bonus to Combat Maneuver
      Defense against that combat maneuver attempt increases by an amount equal
      to the number of stamina points you spent.</p>
  tags:
    - Combat
    - Teamwork
    - Combat Trick
type: feat
