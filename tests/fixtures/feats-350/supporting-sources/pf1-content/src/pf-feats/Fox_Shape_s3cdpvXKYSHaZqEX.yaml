name: Fox Shape
system:
  description:
    value: >-
      <p><em>You can change into a fox in addition to your other
      forms.</em></p><p><strong>Prerequisites</strong>: Cha 13, base attack
      bonus +3, kitsune.</p><p><strong>Benefits</strong>: You can take the form
      of a fox (Pathfinder RPG Bestiary 3 112) whose appearance is static and
      cannot be changed each time you assume this form. Your bite attack's
      damage is reduced to 1d3 points of damage on a hit, but you gain a +10
      racial bonus on Disguise checks made to appear as a fox. Changing from
      kitsune to fox shape is a standard action. This ability otherwise
      functions as beast shape II, and your ability scores change
      accordingly.</p>
  tags:
    - Racial
    - Kitsune
type: feat
