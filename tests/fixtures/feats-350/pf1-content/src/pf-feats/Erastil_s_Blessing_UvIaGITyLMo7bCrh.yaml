    value: >-
      <p><em>Old Deadeye's favor grants you prowess with a bow that far exceeds
      your own physical capabilities.</em></p><p><strong>Prerequisites</strong>:
      Weapon Focus (longbow), must be a worshiper of
      Erastil.</p><p><strong>Benefits</strong>: You can use your Wisdom modifier
      instead of your Dexterity modifier on ranged attack rolls when using a
      bow.</p>
