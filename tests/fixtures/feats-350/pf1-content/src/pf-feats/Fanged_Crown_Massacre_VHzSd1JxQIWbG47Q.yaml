name: Fanged Crown Massacre
system:
  description:
    value: >-
      <p><em>Driven by your loyalty to a fallen queen, you can inspire your
      allies to brutal acts.</em></p><p><strong>Prerequisites</strong>:
      Bodyguard, Combat Reflexes, Perform (oratory) 3 ranks, any evil
      alignment.</p><p><strong>Benefits</strong>: Whenever an ally within 30
      feet makes an attack, you can attempt a DC 10 Perform (oratory) check as
      an immediate action. If you are successful, the ally gains a +2 morale
      bonus on her attack roll. If an attack affected in this way would normally
      deal nonlethal damage, it deals lethal damage instead. This ability has no
      effect if your ally cannot hear you speak or understand your words.</p>
  tags:
    - General
type: feat
