name: Enhanced Gnome Magic
system:
  description:
    value: >-
      <p><em>Your ties to the First World manifest in the form of magical
      abilities that tap into a natural
      element.</em></p><p><strong>Prerequisites</strong>: Cha 13, Knowledge
      (nature) 3 ranks, gnome, gnome magic racial
      trait.</p><p><strong>Benefits</strong>: Add one of the following to your
      gnome magic spell-like abilities: burning hands, corrosive touch, gentle
      breeze, icicle dagger, or shocking grasp. You can use this spell-like
      ability once per day.</p>
