img: systems/pf1/icons/skills/blood_09.jpg
name: Sacrificial Aid
system:
  description:
    value: >-
      <p><em>You convince an ally to help you disable a trap, but the ally takes
      the damage if you fail.</em></p><p><strong>Benefits</strong>: When you
      attempt to disable a trap, an ally who also has this feat can bolster your
      efforts. The ally rolls 1d20 and adds either her total bonus on Disable
      Device checks or her character level, whichever is higher; if the result
      of the ally's roll is 10 or greater, you gain a +4 bonus on your Disable
      Device check. If you trigger the trap, your ally is the target of the
      trap's effects. In the case of a trap with multiple targets, your ally
      takes the effects both for herself and for you (potentially taking damage
      twice or attempting saving throws twice).</p><p><strong>Normal</strong>:
      You can use the aid another action only if you are able to attempt the
      skill check in question. The bonus provided is only +2.</p>
  tags:
    - Teamwork
type: feat
