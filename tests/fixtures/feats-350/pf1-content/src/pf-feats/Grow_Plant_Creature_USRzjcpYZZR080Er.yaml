name: Grow Plant Creature
system:
  description:
    value: >-
      <p><em>Through careful study and communion with nature, you have learned
      how to cultivate and raise plant
      creatures.</em></p><p><strong>Prerequisites</strong>: Train Plants, Handle
      Animal 5 ranks, Knowledge (nature) 5
      ranks.</p><p><strong>Benefits</strong>: You can grow plants and perform
      rituals to invest them with animating spirits, becoming assassin vines,
      treants, or viper vines. Each plant creature has a list of additional
      prerequisites, costs, and skill checks required to grow them (see Growing
      Plant Creatures below). At the GM's discretion, characters with this feat
      may grow other plant creatures as well.</p><hr /><p><strong>Assassin
      Vine</strong></p><p>An assassin vine is usually grown deep in a forest or
      swamp, although it&rsquo;s possible to cultivate an assassin vine among
      overgrown grape vines if the area is shaded from direct
      sun.</p><p><strong>Price </strong>7,750
      gp</p><p><strong>Ritual</strong></p><p>Requirements Grow Plant Creature,
      Knowledge (nature) 5 ranks, entangle, summon nature&rsquo;s ally IV; Skill
      Check Knowledge (nature) DC 16</p><hr
      /><p><strong>Treant</strong></p><p>The ancient knowledge and wisdom
      possessed by the spirit of a treant is unmatched. A treant is usually
      grown in a grove of ancient trees of the predominant local
      variety.</p><p><strong>Price </strong>25,750
      gp</p><p><strong>Ritual</strong></p><p>Requirements Grow Plant Creature,
      Knowledge (nature) 10 ranks, Knowledge (geography or history) 4 ranks,
      liveoak, speak with plants; Skill Check Knowledge (nature) DC 24</p><hr
      /><p><strong>Viper Vine</strong></p><p>Terrifying and deadly, viper vines
      (Pathfinder RPG Bestiary 2 279) make excellent guardians. A viper vine is
      usually grown in jungles or swamps.</p><p><strong>Price</strong> 43,750
      gp</p><p><strong>Ritual</strong></p><p>Requirements Grow Plant Creature,
      Knowledge (nature) 12 ranks, entangle, summon nature&rsquo;s ally VII;
      Skill Check Knowledge (nature) DC 32</p>
  tags:
    - Item Creation
type: feat
