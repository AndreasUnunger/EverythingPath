name: Slipslinger Bombardment
system:
  description:
    value: >-
      <p><em>You can sling a rain of splash weapons at your
      enemies.</em></p><p><strong>Prerequisites</strong>: Quick Draw,
      Slipslinger Grenadier, Slipslinger Style, Throw Anything, Weapon Focus
      (sling) or weapon training (thrown) class feature, warslinger racial
      trait.</p><p><strong>Benefits</strong>: You can use a sling to hurl
      alchemical splash weapons as ammunition with Slipslinger Grenadier during
      an attack action or a full-attack action, loading your sling with such
      weapons as a free action.</p><p><strong>Special</strong>: This feat can't
      be used with alchemists' bombs.</p>
  tags:
    - Combat
type: feat
