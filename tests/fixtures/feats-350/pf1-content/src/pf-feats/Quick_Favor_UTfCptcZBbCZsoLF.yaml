name: Quick Favor
system:
  description:
    value: >-
      <p><em>You can quickly take advantage of your
      charm.</em></p><p><strong>Prerequisites</strong>:
      Persuasive.</p><p><strong>Benefits</strong>: Once per day, you can
      decrease the time required for a Diplomacy check to gather information to
      4d10 minutes when you use Diplomacy to gather information again just after
      you previously gathered information there (whether or not the previous
      attempt was successful).</p><p><strong>Normal</strong>: You must spend 1d4
      hours to gather information using Diplomacy.</p>
