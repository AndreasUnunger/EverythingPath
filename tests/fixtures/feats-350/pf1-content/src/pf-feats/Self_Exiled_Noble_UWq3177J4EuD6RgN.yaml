name: Self-Exiled Noble
system:
  description:
    value: >-
      <p><em>You chose to leave nobility
      behind.</em></p><p><strong>Prerequisites</strong>: You must have
      intentionally left your noble family and changed your name or appearance
      afterward.</p><p><strong>Benefits</strong>: You gain a +2 bonus on
      Disguise checks, and Disguise is a class skill for you. You gain a +1
      bonus on attack rolls and damage rolls against members of your former
      family.</p><p><strong>Goal</strong>: Escape your former name by
      establishing your own noble legacy. In addition, you must decisively
      defeat a challenging foe from your former family who may wish to return
      you to your old home.</p><p><strong>Completion Benefit</strong>: Your
      bonus on attack rolls and damage rolls from this feat increases to +2 and
      applies to anyone who threatens your allies or your new noble legacy.</p>
  tags:
    - Story
type: feat
