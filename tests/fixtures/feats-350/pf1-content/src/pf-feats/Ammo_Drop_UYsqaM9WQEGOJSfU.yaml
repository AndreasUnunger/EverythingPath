name: Ammo Drop
system:
  description:
    value: >-
      <p><em>Your coordination is so perfect that you can simply drop ammunition
      from your hand at the exact moment required for it to fall into an open
      sling as your twirl it around.</em></p><p><strong>Prerequisites</strong>:
      Sleight of Hand 1 rank, proficient with
      sling.</p><p><strong>Benefits</strong>: You can load a sling or one end of
      a double sling with one hand as a swift action or move action. This does
      not provoke an attack of opportunity.</p>
  tags:
    - Combat
type: feat
