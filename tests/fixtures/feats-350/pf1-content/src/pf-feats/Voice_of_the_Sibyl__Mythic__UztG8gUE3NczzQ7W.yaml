name: Voice of the Sibyl (Mythic)
system:
  description:
    value: >-
      <p><em>You overpower weaker and more vulnerable minds with your voice
      alone.</em></p><p><strong>Prerequisites</strong>: Voice of the
      Sibyl.</p><p><strong>Benefits</strong>: You gain a +1 bonus on all Bluff,
      Diplomacy, and Perform (oratory) skill checks for every 3 tiers you
      possess. This bonus stacks with the bonus from Voice of the Sibyl. If you
      have 10 or more ranks in at least two of these skills, gain a +2 bonus to
      the DC of any language-dependent spell you cast.</p>
