name: Dramatic Slam
system:
  description:
    value: >-
      <p><em>Your brutal maneuvers shock any who would dare to stand against
      you.</em></p><p><strong>Prerequisites</strong>: Dazzling Display, Improved
      Grapple, Improved Unarmed Strike, Savage Slam, Weapon Focus, base attack
      bonus +9 or monk level 6th.</p><p><strong>Benefits</strong>: While you are
      using Savage Slam, if you succeed at your grapple combat maneuver check to
      knock the opponent prone, you can spend a swift action to attempt an
      Intimidate check to demoralize foes within 30 feet who could see your
      attack.</p>
  tags:
    - Combat
type: feat
