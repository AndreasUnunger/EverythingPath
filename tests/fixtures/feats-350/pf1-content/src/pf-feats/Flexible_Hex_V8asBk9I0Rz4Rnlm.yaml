name: Flexible Hex
system:
  description:
    value: >-
      <p><em>Your wandering hex shifts at your
      command.</em></p><p><strong>Prerequisites</strong>: Wandering hex class
      feature.</p><p><strong>Benefits</strong>: Once per day as a swift action,
      you can change your wandering hex. When you change your hex, the new hex
      must be associated with the wandering spirit with which you are currently
      bonded. At 12th level, you can change either or both of your wandering
      hexes with the feat.</p><p><strong>Normal</strong>: Shamans select their
      hexes every day when they prepare their spells and cannot change them.</p>
  tags:
    - General
type: feat
