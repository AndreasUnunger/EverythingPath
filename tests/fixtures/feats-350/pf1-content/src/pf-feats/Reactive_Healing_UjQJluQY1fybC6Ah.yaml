name: Reactive Healing
system:
  description:
    value: >-
      <p><em>You can channel healing energy in response to an attack that would
      knock you unconscious.</em></p><p><strong>Prerequisites</strong>: Quick
      Channel or Quicken Spell; channel energy or lay on hands class
      feature.</p><p><strong>Benefits</strong>: When the damage from an attack
      or an effect would reduce you to 0 or fewer hit points, you can expend one
      use of channel energy (of a form that would heal you) or lay on hands as
      an immediate action to heal yourself. The healing affects only you, even
      if it would normally affect others.</p>
  tags:
    - General
type: feat
