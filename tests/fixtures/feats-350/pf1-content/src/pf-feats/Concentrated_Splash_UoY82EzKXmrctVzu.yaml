name: Concentrated Splash
system:
  description:
    value: >-
      <p><em>You can limit the splatter of your splash weapons to increase
      damage against your target.</em></p><p><strong>Prerequisites</strong>:
      Precise Shot or Throw Anything.</p><p><strong>Benefits</strong>: When you
      deal a direct hit to a creature with a splash weapon that normally also
      deals splash damage, you can choose to forgo dealing splash damage. If you
      do, the damage dealt to the target of the direct hit increases by 50%.
      This damage is multiplied on a critical hit.</p><p>This feat cannot be
      used with an alchemist's bombs.</p>
  tags:
    - Combat
type: feat
