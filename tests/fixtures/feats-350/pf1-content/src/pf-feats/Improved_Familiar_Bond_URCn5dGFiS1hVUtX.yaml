name: Improved Familiar Bond
system:
  description:
    value: >-
      <p><em>Your familiar gains greater
      power.</em></p><p><strong>Prerequisites</strong>: Familiar Bond, Iron
      Will.</p><p><strong>Benefits</strong>: Your familiar gains all the normal
      abilities available to a familiar of a wizard with a level equal to your
      total Hit Dice. You also gain the special ability normally gained by a
      master of your type of familiar.</p>
