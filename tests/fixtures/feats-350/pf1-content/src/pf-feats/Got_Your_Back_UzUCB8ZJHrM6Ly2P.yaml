name: Got Your Back
system:
  description:
    value: >-
      <p><em>You protect an ally from attacks he doesn't see
      coming.</em></p><p><strong>Prerequisites</strong>: Int 13, Combat
      Expertise.</p><p><strong>Benefits</strong>: If you successfully use the
      aid another action to give an ally who also has this feat a +2 bonus to AC
      against an opponent's next attack, the ally is also not considered flanked
      or flat-footed against that opponent until the beginning of your next
      turn.</p><p><strong>Normal</strong>: You can use aid another to grant an
      ally a +2 bonus to AC against the next attack from an adjacent
      foe.</p><h3>Combat Trick</h3><p>If you spend 3 stamina points when you use
      this feat, your ally benefits from the AC bonus until the beginning of
      your next turn. (Melee Tactics Toolbox 10)</p>
  tags:
    - Combat
    - Teamwork
    - Combat Trick
type: feat
