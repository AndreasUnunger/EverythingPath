name: Pummeling Charge
system:
  description:
    value: >-
      <p><em>Your charge ends with a mighty
      haymaker.</em></p><p><strong>Prerequisites</strong>: Improved Unarmed
      Strike, Pummeling Style; base attack bonus +12, brawler level 8th, or monk
      level 8th.</p><p><strong>Benefits</strong>: You can charge and make a full
      attack or flurry of blows at the end of your charge as part of the charge
      action. You can use Pummeling Charge in this way only if all of your
      attacks qualify for using Pummeling Style against a single
      target.</p><p><strong>Normal</strong>: You cannot make a full attack on a
      charge.</p><h3>Combat Trick</h3><p>: When you make a Pummeling Charge
      attack, you can spend 5 stamina points to make a single extra attack at
      your highest bonus.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
