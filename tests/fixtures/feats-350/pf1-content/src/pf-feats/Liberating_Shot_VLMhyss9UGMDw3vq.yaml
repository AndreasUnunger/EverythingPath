name: Liberating Shot
system:
  description:
    value: >-
      <p><em>You can use ranged weapons to help grappled allies escape their
      captors' clutches.</em></p><p><strong>Prerequisites</strong>: Dex 13,
      Deadly Aim, base attack bonus +7, weapon training class feature with a
      ranged weapon.</p><p><strong>Benefits</strong>: When you hit an opponent
      with a ranged attack as part of an attack action and that opponent is
      grappling an ally, your grappled ally can use your attack roll result in
      place of her combat maneuver check result, whichever is higher, to escape
      from the grapple during her next turn.</p>
  tags:
    - Weapon Mastery
type: feat
