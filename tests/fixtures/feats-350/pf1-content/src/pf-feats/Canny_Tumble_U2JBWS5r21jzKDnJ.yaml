name: Canny Tumble
system:
  description:
    value: >-
      <p><em>Your acrobatic prowess distracts your
      foes.</em></p><p><strong>Prerequisites</strong>: Dodge, Mobility,
      Acrobatics 5 ranks.</p><p><strong>Benefits</strong>: When you use
      Acrobatics to move through an opponent's threatened area or space without
      provoking an attack of opportunity from that opponent, you gain a +2
      circumstance bonus on your next melee attack roll against that opponent
      and that opponent is denied its Dexterity bonus to AC, as long as you make
      that attack before the start of your next turn.</p><p><strong>Combat
      Trick</strong>: Just before you make an attack roll with the +2
      circumstance bonus granted by this feat, you can spend up to 5 stamina
      points. When you do, if your attack hits, you gain a bonus on the damage
      roll equal to double the number of stamina points spent.</p>
  tags:
    - Combat
type: feat
