name: Orc Hewer
system:
  description:
    value: >-
      <p><em>You are ferocious at hewing your enemies, especially
      orcs.</em></p><p><strong>Prerequisites</strong>: Str 13, Cleave, Goblin
      Cleaver, Power Attack, dwarf.</p><p><strong>Benefits</strong>: This feat
      functions as Goblin Cleaver, but your additional attacks can be made
      against creatures your size or smaller. In addition, any such attacks that
      you make against humanoids (orc) gain a +2 circumstance bonus on attack
      rolls.</p><h3>Combat Trick</h3><p>As long as you have at least 1 stamina
      point in your stamina pool, the bonus on Cleave attacks against humanoids
      with the orc subtype increases to +4.</p>
  tags:
    - Combat
    - Racial
    - Dwarf
    - Combat Trick
type: feat
