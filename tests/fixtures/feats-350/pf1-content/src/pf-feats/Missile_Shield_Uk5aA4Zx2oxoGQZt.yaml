img: systems/pf1/icons/feats/shield-master.jpg
name: Missile Shield
system:
  description:
    value: >-
      <p><em>You are skilled at deflecting ranged attacks with your
      shield.</em></p><p><strong>Prerequisites</strong>: Dex 13, Shield
      Focus.</p><p><strong>Benefits</strong>: You must be using a light, heavy,
      or tower shield to use this feat. Once per round when you would normally
      be hit with an attack from a ranged weapon (not including spell effects,
      natural attacks, or massive ranged weapons), you may deflect it so that
      you take no damage, as if you had the Deflect Arrows feat. You must be
      aware of the attack and not flat-footed.</p><p><strong>Combat
      Trick</strong>: As long as you have at least 1 stamina point in your
      stamina pool, you can use this feat with a buckler. You can spend 5
      stamina points to deflect an arrow even while you're flat-footed. You must
      still be aware of the attack.</p>
  tags:
    - Combat
type: feat
