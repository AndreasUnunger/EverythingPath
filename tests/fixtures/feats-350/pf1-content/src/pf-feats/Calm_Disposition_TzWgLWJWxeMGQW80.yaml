name: Calm Disposition
system:
  description:
    value: >-
      <p><em>You always appear to be in control of your
      situation.</em></p><p><strong>Prerequisites</strong>: Prophets of
      Kalistrade 10 TPA.</p><p><strong>Benefits</strong>: You gain +2 bonus on
      saving throws against effects that affect your composure. This includes
      all mind-affecting spells, as well as any spell or ability that would
      cause you to behave in an out-of-control manner, such as fear effects and
      nausea. This does not include physical effects such as fatigue, and does
      not reduce any damage taken from concurrent effects.</p>
  tags:
    - Faction
type: feat
