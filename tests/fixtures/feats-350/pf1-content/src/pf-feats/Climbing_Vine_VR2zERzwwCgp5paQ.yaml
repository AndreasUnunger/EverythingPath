name: Climbing Vine
system:
  description:
    value: >-
      <p><em>You can climb like a
      vine.</em></p><p><strong>Prerequisites</strong>: Str 13, vine
      leshy.</p><p><strong>Benefits</strong>: You gain a climb speed of 10 feet.
      If you already have a natural climb speed, your climb speed increases by
      10 feet. You can take this feat multiple times, but your climb speed can
      never exceed your base speed.</p>
