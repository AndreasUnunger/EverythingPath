name: Squirming Pile
system:
  description:
    value: >-
      <p><em>Your body is easily lost in the muddy chaos of fighting as a swarm,
      making your vital areas difficult to
      target.</em></p><p><strong>Prerequisites</strong>: Acrobatics 5 ranks,
      swarming racial trait.</p><p><strong>Benefits</strong>: While sharing a
      square with an ally who has this feat, you gain a 25% chance of negating
      the additional damage from a successful critical hit or sneak attack; if
      you negate the damage, it is instead rolled normally. This negation chance
      doesn't stack with similar protection provided by any other source, such
      as the fortification armor special ability.</p>
  tags:
    - Combat
    - Teamwork
type: feat
