name: Sage's Guidance
system:
  description:
    value: >-
      <p><em>Your familiar's keen observations help you defeat foes.
      Prerequisite: Must have a familiar with the sage archetype (see page
      11).</em></p><p><strong>Prerequisites</strong>: Must have a familiar with
      the sage archetype (see page 11).</p><p><strong>Benefits</strong>: When
      your familiar succeeds at a Knowledge check to identify a hazard or an
      opponent's weaknesses and abilities, you gain a +2 insight bonus on
      attacks and skill checks against the opponent or hazard for 1 round. If
      your familiar is sharing a space with the opponent or hazard, this bonus
      is granted to all allies who can see and understand the familiar.</p>
  tags:
    - Familiar
type: feat
