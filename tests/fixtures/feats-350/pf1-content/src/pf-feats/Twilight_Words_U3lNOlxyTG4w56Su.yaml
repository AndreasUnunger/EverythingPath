name: Twilight Words
system:
  description:
    value: >-
      <p><em>Snowborn half-elves often inherit their parents' incurable
      curiosity about other cultures and are particularly good at relating to
      new groups.</em></p><p><strong>Prerequisites</strong>: Diplomacy 3 ranks,
      snowborn half-elf.</p><p><strong>Benefits</strong>: You can attempt a
      Diplomacy check to improve someone's attitude even if you do not speak a
      common language, though the other party must still have an Intelligence of
      3 or higher.</p><p><strong>Normal</strong>: You cannot attempt a Diplomacy
      check to improve someone's attitude if you do not speak a common
      language.</p>
  tags:
    - Racial
    - Half-Elf
type: feat
