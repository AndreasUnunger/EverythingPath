name: Airy Step
system:
  description:
    value: >-
      <p><em>The air responds to your innate elemental nature, protecting you
      from harm and cushioning your
      falls.</em></p><p><strong>Prerequisites</strong>:
      Sylph.</p><p><strong>Benefits</strong>: You gain a +2 bonus on saving
      throws against effects with the air or electricity descriptors and effects
      that deal electricity damage. You may ignore the first 30 feet of any fall
      when determining falling damage.</p>
  tags:
    - Racial
    - Sylph
type: feat
