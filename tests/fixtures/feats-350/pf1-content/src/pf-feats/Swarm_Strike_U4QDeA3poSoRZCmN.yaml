name: Swarm Strike
system:
  description:
    value: >-
      <p><em>You and your allies have trained to overwhelm foes like a swarm of
      rodents.</em></p><p><strong>Benefits</strong>: Whenever a foe provokes an
      attack of opportunity from you, you gain a +1 bonus on your attack roll,
      plus an additional +1 bonus for each ally who also has this feat and
      currently threatens that foe.</p>
