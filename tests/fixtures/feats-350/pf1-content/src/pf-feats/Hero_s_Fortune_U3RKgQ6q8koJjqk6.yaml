name: Hero's Fortune
system:
  description:
    value: >-
      <p><em>Even at the start of your career, it was clear that you had a
      chance at greatness, and your legend continues to grow with every
      adventure.</em></p><p><strong>Benefits</strong>: You gain a hero point.
      The maximum number of hero points you can have at any one time is
      increased to 5.<br /><strong><br />Normal</strong>: You can have no more
      than 3 hero points at one time.</p><p><strong>Special</strong>: NPCs who
      take this feat receive 1 hero point and can have up to 3 (not 5).</p>
