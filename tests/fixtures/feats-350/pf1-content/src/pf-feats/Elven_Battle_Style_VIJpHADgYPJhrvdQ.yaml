name: Elven Battle Style
system:
  description:
    value: >-
      <p><em>You wield traditional elven weapons with
      grace.</em></p><p><strong>Prerequisites</strong>: Elven Battle Training,
      Weapon Finesse, base attack bonus +1, weapon familiarity racial
      trait.</p><p><strong>Benefits</strong>: While wielding a longsword, a
      rapier, or any melee weapon that has 'elven' in its name, combat maneuver
      checks attempted with that weapon as attacks of opportunity don't
      themselves provoke attacks of opportunity.</p>
  tags:
    - Combat
    - Style
type: feat
