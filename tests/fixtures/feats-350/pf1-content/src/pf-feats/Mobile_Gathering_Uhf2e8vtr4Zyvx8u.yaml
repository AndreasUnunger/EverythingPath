name: Mobile Gathering
system:
  description:
    value: >-
      <p><em>You can gather elemental energy while walking
      slowly.</em></p><p><strong>Prerequisites</strong>: Kineticist level 7th,
      kinetic blast class feature.</p><p><strong>Benefits</strong>: While taking
      a move action to gather power, you can move up to half your base speed,
      and while taking 1 full round to gather power, you can move up to half
      your speed on the turn you begin the full round of gathering power. This
      movement provokes attacks of opportunity, and you can't use Acrobatics
      checks or other abilities to attempt to negate them, as you're
      concentrating on gathering power (nor can you use Acrobatics to balance,
      jump, or do anything else that requires a skill check). It's harder to
      concentrate on gathering power while using this feat; if you take damage
      during or after gathering power and before using a kinetic blast that
      releases it (including from an attack of opportunity provoked by the
      movement), the concentration check DC to avoid losing the gathered power
      increases by twice the blast's effective spell level.</p>
  tags:
    - General
type: feat
