name: Excoriating Stare
system:
  description:
    value: >-
      <p><em>Your painful stare burns through your
      opponents.</em></p><p><strong>Prerequisites</strong>: Mesmerist level
      11th, painful stare class feature.</p><p><strong>Benefits</strong>:
      Whenever you trigger a painful stare, the target must succeed at a Will
      saving throw (DC = 10 + 1/2 your mesmerist level + your Charisma modifier)
      or become sickened by the pain for 1 round.</p>
