name: Animal Affinity (Mythic)
system:
  description:
    value: >-
      <p><em>You have a greater affinity with wild animals, and can speak with
      them.</em></p><p><strong>Prerequisites</strong>: Animal
      Affinity.</p><p><strong>Benefits</strong>: The bonus on Handle Animal and
      Ride skill checks from Animal Affinity increases by 2. In addition, you
      can expend one use of mythic power to speak with animals as the spell.
      Your caster level for this effect is equal to twice your tier.</p>
  tags:
    - General
    - Mythic
type: feat
