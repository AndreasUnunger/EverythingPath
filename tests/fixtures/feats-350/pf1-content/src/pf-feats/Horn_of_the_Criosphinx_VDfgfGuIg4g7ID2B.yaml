name: Horn of the Criosphinx
system:
  description:
    value: >-
      <p><em>You end your charge in a devastating two-handed
      attack.</em></p><p><strong>Prerequisites</strong>: Base attack bonus +6 or
      monk level 6th.</p><p><strong>Benefits</strong>: Whenever you make a
      successful charge attack while wielding a two-handed weapon in both hands,
      add two times your Strength bonus to the damage
      roll.</p><p><strong>Normal</strong>: A character wielding a two-handed
      weapon adds 1-1/2 times her Strength bonus to damage
      rolls.</p><p><strong>Special</strong>: A monk can use this feat as long as
      he is wielding a two-handed weapon or both his hands are
      empty.</p><p><strong>Note</strong>: A monk can take this feat as a bonus
      feat at 6th level. To benefit from this feat, monks must have both hands
      free and be capable of delivering an unarmed strike.</p>
  tags:
    - Combat
type: feat
