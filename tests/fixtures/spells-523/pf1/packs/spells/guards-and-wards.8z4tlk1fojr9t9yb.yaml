  description:
    value: >-
      <p>This powerful spell is primarily used to defend a stronghold or
      fortress by creating a number of magical wards and effects. The ward
      protects 200 square feet per caster level. The warded area can be as much
      as 20 feet high, and shaped as you desire. You can ward several stories of
      a stronghold by dividing the area among them; you must be somewhere within
      the area to be warded to cast the spell. The spell creates the following
      magical effects within the warded
      area.</p><ul><li><p><strong>Fog</strong><em>: Fog</em> fills all
      corridors, obscuring all sight, including darkvision, beyond 5 feet. A
      creature within 5 feet has concealment (attacks have a 20% miss chance).
      Creatures farther away have total concealment (50% miss chance, and the
      attacker cannot use sight to locate the target).<br />Saving Throw: none.
      Spell Resistance: no.</p></li><li><p><strong>Arcane Locks</strong>: All
      doors in the warded area are <em>arcane locked.<br /></em>Saving Throw:
      none. Spell Resistance: no.</p></li><li><p><strong>Webs</strong><em>:
      Webs</em> fill all stairs from top to bottom. These strands are identical
      with those created by the <em>web</em> spell, except that they regrow in
      10 minutes if they are burned or torn away while the <em>guards and
      wards</em> spell lasts.<br />Saving Throw: Reflex negates; see text for
      <em>web</em>. Spell Resistance:
      no.</p></li><li><p><strong>Confusion</strong><em>:</em> Where there are
      choices in direction-such as a corridor intersection or side passage-a
      minor <em>confusion-type</em> effect functions so as to make it 50%
      probable that intruders believe they are going in the opposite direction
      from the one they actually chose. This is a mind-affecting effect.<br
      />Saving Throw: none. Spell Resistance: yes.</p></li><li><p><strong>Lost
      Doors</strong>: One door per caster level is covered by a <em>silent
      image</em> to appear as if it were a plain wall.<br />Saving Throw: Will
      disbelief (if interacted with). Spell Resistance: no.</p></li></ul><p>In
      addition, you can place your choice of one of the following five magical
      effects.</p><ol><li><p><em>Dancing lights</em> in four corridors. You can
      designate a simple program that causes the lights to repeat as long as the
      <em>guards and wards</em> spell lasts.<br />Saving Throw: none. Spell
      Resistance: no.</p></li><li><p>A <em>magic mouth</em> in two places.<br
      />Saving Throw: none. Spell Resistance: no.</p></li><li><p>A <em>stinking
      cloud</em> in two places. The vapors appear in the places you designate;
      they return within 10 minutes if dispersed by wind while the <em>guards
      and wards</em> spell lasts.<br />Saving Throw: Fortitude negates; see text
      for <em>stinking cloud</em>. Spell Resistance: no.</p></li><li><p>A
      <em>gust of wind in</em> one corridor or room.<br />Saving Throw:
      Fortitude negates. Spell Resistance: yes.</p></li><li><p>A
      <em>suggestion</em> in one place. You select an area of up to 5 feet
      square, and any creature who enters or passes through the area receives
      the <em>suggestion</em> mentally.<br />Saving Throw: Will negates. Spell
      Resistance: yes.</p></li></ol><p>The whole warded area radiates strong
      magic of the abjuration school. A <em>dispel magic</em> cast on a specific
      effect, if successful, removes only that effect. A successful mage's
      disjunction destroys the entire <em>guards and wards</em> effect.</p>
