      <p><strong>Race</strong>: Dwarf<br /><strong>Replaced Trait(s)</strong>:
      Stability</p><hr /><p>Dwarves are skilled at pushing their way through a
      battlefield, tossing aside lesser foes with ease. Dwarves with this racial
      trait receive a +2 bonus on combat maneuver checks made to bull rush or
