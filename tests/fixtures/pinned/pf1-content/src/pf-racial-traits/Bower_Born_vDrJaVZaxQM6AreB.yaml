    value: >-
      <p><strong>Race</strong>: Gathlain<br /><strong>Replaced
      Trait(s)</strong>: Natural Armor</p><hr /><p>Some gathlain seeds find
      their way to the Hanging Bower, the realm of the alluring Eldest known as
      the Green Mother. Gathlains grown in the Hanging Bower sprout beautiful
      but delicate hibiscus flowers on their vines and emit a seductive
      pheromone. Gathlains with this trait gain a +2 racial bonus on Diplomacy
      and Handle Animal checks. This racial trait replaces natural armor.</p>
