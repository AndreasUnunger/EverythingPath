  description:
    value: >-
      <p><strong>Race</strong>: Shabti<br /><strong>Replaced Trait(s)</strong>:
      Resist Level Drain</p><hr /><p>Crafted to suffer punishments intended for
      their masters, some shabti can use this mortal connection to serve as
      reciprocal conduits. As an immediate action after being afflicted by
      temporary negative levels, a shabti with this racial trait can force the
      creature that inflicted the negative levels to suffer the same cumulative
      penalties, hit point loss, and caster level reduction. The shabti can use
      this ability only on an enemy within @Distance[60 ft;dual] and can share
      penalties with only one creature at a time. The shabti can sever this link
      as a free action.</p><p>This racial trait replaces resist level drain.</p>
