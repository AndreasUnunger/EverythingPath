    value: >-
      <p><strong>Race</strong>: Ghoran<br /><strong>Replaced Trait(s)</strong>:
      Natural Armor</p><hr /><p>Some ghorans evolve by reseeding themselves in
      different locations. With each new seed, these ghorans take on some of the
      traits of the areas surrounding their new growth. Ghorans with this racial
      trait choose one terrain from the
      @UUID[Compendium.pf1.class-abilities.Item.U2YBSx1s8cT8iDq1]{Ranger Favored
      Terrain list} other than planes, urban, or water. These ghorans gain a +4
      racial bonus on Stealth checks when in their chosen terrain.</p><p>This
      replaces natural armor.</p>
