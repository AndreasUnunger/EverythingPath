  description:
    value: >-
      <p><strong>Race</strong>: Catfolk<br /><strong>Replaced Trait(s)</strong>:
      Cat's Luck, Sprinter</p><hr /><p>Catfolk often live in deeply forested
      terrain, such as the Valashmai Jungle, and they have become naturally
      sure-footed to maintain their hunting prowess in these dangerous
      environments. Such catfolk gain a +2 racial bonus on Acrobatics checks and
      can ignore the first square of difficult terrain caused by foliage each
      round. This racial trait replaces cat's luck and sprinter.</p>
