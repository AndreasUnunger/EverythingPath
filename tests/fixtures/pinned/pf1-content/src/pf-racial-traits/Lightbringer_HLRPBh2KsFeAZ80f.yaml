      area: 20 ft (6 m) radius
      description: >-
        <p>Elves with Intelligence scores of 10 or higher may use
        @UUID[Compendium.pf1.spells.Item.ip9onjfp6nf1vlv9]{light} at will as a
        spell-like ability.</p>
      duration:
