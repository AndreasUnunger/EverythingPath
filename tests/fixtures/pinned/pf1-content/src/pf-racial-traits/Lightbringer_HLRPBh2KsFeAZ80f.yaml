  description:
    instructions: >-
      <p>Update your Actor on the Attributes tab&gt; Condition Immunities and
      check the appropriate box to add "dazzle" as a condition to which your
      actor is immune. You can also add a custom entry for "light-based
      blindness"</p>
    value: >-
      <p><strong>Race</strong>: Elf<br /><strong>Replaced Trait(s)</strong>:
      Elven Immunities, Elven Magic</p><hr /><p>Many elves revere the sun, moon,
      and stars, but some are literally infused with the radiant power of the
      heavens. Elves with this racial trait are immune to light-based blindness
      and dazzle effects, and are treated as one level higher when determining
      the effects of any light-based spell or effect they cast (including
      spell-like and supernatural abilities). Elves with Intelligence scores of
      10 or higher may use
      <em>@UUID[Compendium.pf1.spells.Item.ip9onjfp6nf1vlv9]{light} </em>at will
      as a spell-like ability. This racial trait replaces the elven immunities
      and elven magic racial traits.</p>
