  description:
    value: >-
      <p><strong>Race</strong>: Gnome<br /><strong>Replaced Trait(s)</strong>:
      Defensive Training, Hatred</p><hr /><p>Gnomes rarely lose hope and are
      always confident that even hopeless situations will work out. Gnomes with
      this racial trait receive a +2 racial bonus on saving throws against fear
      and despair effects. Once per day, after rolling a 1 on a d20, the gnome
      may reroll and use the second result. This racial trait replaces the
      defensive training and hatred racial traits.</p>
