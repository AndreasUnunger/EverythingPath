  description:
    value: >-
      <p><strong>Race</strong>: Ghoran<br /><strong>Replaced Trait(s)</strong>:
      Natural Magic</p><hr /><p>Some ghorans have an incredibly distracting
      scent. Once per day, as a spell-like ability, a ghoran with this racial
      trait can emit an intoxicating aroma that causes creatures within
      @Distance[30 ft;dual] to be fascinated for 1d4 rounds. Each target
      creature within range can attempt a Will save (DC = 10 + half the ghoran's
      character level + the ghoran's Charisma modifier) to negate the
      effect.</p><p>This replaces natural magic.</p>
