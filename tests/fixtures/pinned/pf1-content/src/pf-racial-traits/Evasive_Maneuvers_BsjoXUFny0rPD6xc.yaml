    value: >-
      <p><strong>Race</strong>: Wyvaran<br /><strong>Replaced Trait(s)</strong>:
      Darkvision, Slapping Tail</p><hr /><p>Coastal wyvarans often take to the
      air to defend their territory from intruding ships, and are forced to
      learn aerial maneuvers to avoid siege fire. They fly with an average
      maneuverability instead of clumsy, and they gain a +2 dodge bonus to AC
      and on Reflex saving throws against siege weapons. This racial trait
      replaces darkvision and slapping tail.</p>
