    value: >-
      <p><strong>Race</strong>: Elf<br /><strong>Replaced Trait(s)</strong>:
      Elven Magic</p><hr /><p>Some elves have potent draconic blood. Elves with
      this racial trait who take a draconic bloodline as a class feature treat
      their Charisma scores as 2 points higher when determining the DC and uses
      per day of all bloodline abilities and bloodline spells. Additionally,
      elves with this trait add spells with the draconic descriptor (see page
      28) to their class spell lists for any spellcasting classes in which they
      have levels.</p>
