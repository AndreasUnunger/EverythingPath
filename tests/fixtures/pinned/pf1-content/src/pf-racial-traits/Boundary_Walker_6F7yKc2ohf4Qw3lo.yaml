  description:
    value: >-
      <p><strong>Race</strong>: Fetchling<br /><strong>Replaced
      Trait(s)</strong>: Shadow Blending, Shadowy Resistance</p><hr
      /><p>Fetchlings of Absalom and Shadow Absalom deftly navigate between the
      worlds of shadow and light. A fetchling with this racial trait gains spell
      resistance equal to 5 + his character level against spells and spell-like
      abilities with the light or shadow descriptors, as well as spells and
      spell-like abilities of the illusion (shadow) subschool. This racial trait
      replaces the shadow blending and shadowy resistance racial traits.</p>
