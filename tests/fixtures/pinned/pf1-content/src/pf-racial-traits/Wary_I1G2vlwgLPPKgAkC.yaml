  description:
    value: >-
      <p><strong>Race</strong>: Half-Elf<br /><strong>Replaced
      Trait(s)</strong>: Keen Senses</p><hr /><p>Many half-elves have spent
      their long lives moving from place to place, often driven out by the
      hostility of others. Such experiences have made them wary of others'
      motivations. Half-elves with this trait gain a +1 racial bonus on Sense
      Motive and Bluff checks. This racial trait replaces the keen senses racial
      trait.</p>
