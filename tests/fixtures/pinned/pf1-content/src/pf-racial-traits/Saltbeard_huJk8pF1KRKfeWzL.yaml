  description:
    value: >-
      <p><strong>Race</strong>: Dwarf<br /><strong>Replaced Trait(s)</strong>:
      Defensive Training, Hatred, Stonecunning</p><hr /><p>Dwarves occasionally
      found iron cities along rugged seacoasts, and natives of such cities gain
      a +2 bonus on Profession (sailor) and Survival checks while at sea. They
      gain a +1 racial bonus on attack rolls and a +2 dodge bonus to AC against
      creatures with the aquatic or water subtype. Their greed racial trait
      applies only to treasure found in or under the water, but applies to all
      such treasure regardless of whether or not it contains metal or gemstones.
      This racial trait replaces defensive training, hatred, and
      stonecunning.</p>
