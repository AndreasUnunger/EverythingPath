      <p><strong>Race</strong>: Gathlain<br /><strong>Replaced
      Trait(s)</strong>: Normal Speed (Gathlain)</p><hr /><p>Occasionally the
      conditions for a gathlain seed's growth heavily favor the plant portion of
      its body, causing more nutrients to go to the building of its vine wings
      and fewer to developing the gathlain's legs. These gathlains have larger
      wings than normal. They have a base speed of @Distance[20 ft;dual] and a
      fly speed of @Distance[40 ft;dual] (average). This racial trait alters the
      gathlain's speeds.</p>
