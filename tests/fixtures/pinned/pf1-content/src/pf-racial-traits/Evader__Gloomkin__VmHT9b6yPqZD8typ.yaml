    value: >-
      <p><strong>Race</strong>: Half-Orc (Gloomkin Only) <br /><strong>Replaced
      Trait(s)</strong>: Intimidating</p><hr /><p>Having lived all their lives
      at the mercy of savage underworld creatures, some
      @UUID[Compendium.pf-content.pf-racial-traits.Item.XSk0ArPbEAnqz9Fm]{gloomkin}
      develop an uncanny knack for finding their way about silently in the dark.
      While underground, Darklands half-orcs with this racial trait gain a +5
      racial bonus on Survival checks to avoid becoming lost, and a +1 racial
      bonus on Stealth checks. This racial trait replaces the intimidating
      racial trait.</p>
