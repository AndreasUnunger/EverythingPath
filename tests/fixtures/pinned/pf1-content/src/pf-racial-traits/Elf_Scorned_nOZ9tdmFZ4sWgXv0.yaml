      <p><strong>Race</strong>: Half-Elf<br /><strong>Replaced
      Trait(s)</strong>: Elven Immunities, Multitalented</p><hr /><p>Many
      half-elves, especially half-drow and half-Ekujae, are rejected by their
      elven parents and feel nothing but hatred and fear toward their inhuman
      ancestors. They gain a +1 racial bonus on attack rolls and a +2 dodge
      bonus to AC against elves. This racial trait replaces elven immunities and
      multitalented.</p>
