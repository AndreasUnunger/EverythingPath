  description:
    value: >-
      <p><strong>Race</strong>: Gnome<br /><strong>Replaced Trait(s)</strong>:
      Base Statistics</p><hr /><p>Sometimes rather than a single gnome becoming
      obsessed with a project, whole families of gnomes undertake a project so
      massive it requires generations of artisans to complete. Such projects
      often involve complex clockwork devices (or entire clockwork buildings),
      and those born into families dedicated to lifetimes of work on them are
      known as gear gnomes. Gear gnomes have the
      @UUID[Compendium.pf-content.pf-racial-traits.Item.qQU7DJtUNw9DkO14]{Academician}
      and
      @UUID[Compendium.pf-content.pf-racial-traits.Item.iHI1zDebmLg28ZWW]{Master
      Tinker} alternate racial traits.</p>
