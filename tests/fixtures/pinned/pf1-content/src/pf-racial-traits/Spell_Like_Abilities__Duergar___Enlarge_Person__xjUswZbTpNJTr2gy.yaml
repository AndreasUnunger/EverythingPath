  description:
    instructions: >-
      <p>This trait only includes the enlarge person SLA but should be paired
      with
      @UUID[Compendium.pf-content.pf-racial-traits.Item.rhrCD8LSYstvt6pp]{Spell-Like
      Abilities (Duergar - Invisibility)} or an alternate that replaces it.</p>
    value: >-
      <p><strong>Race</strong>: Duergar</p><hr /><p>A duergar can use
      <em>enlarge person</em> and <em>invisibility</em> each once per day, using
      her character level as her caster level and affecting itself only.</p>
