      actionType: spellsave
      activation:
        type: round
        unchained:
          cost: 3
          type: action
      description: >-
        <div
        class="description-body"><p>@UUID[Compendium.pf1.spells.Item.jnlr9cuepka1l26e]{Enlarge
        Person} Self only</p><p>This spell causes instant growth of a humanoid
        creature, doubling its height and multiplying its weight by 8. This
        increase changes the creature's size category to the next larger one.
        The target gains a +2 size bonus to Strength, a -2 size penalty to
        Dexterity (to a minimum of 1), and a -1 penalty on attack rolls and AC
        due to its increased size.</p><p>A humanoid creature whose size
        increases to Large has a space of @Distance[10 ft;dual] and a natural
        reach of @Distance[10 ft;dual]. This spell does not change the target's
        speed.</p><p>If insufficient room is available for the desired growth,
        the creature attains the maximum possible size and may make a Strength
        check (using its increased Strength) to burst any enclosures in the
        process. If it fails, it is constrained without harm by the materials
        enclosing it-the spell cannot be used to crush a creature by increasing
        its size.</p><p>All equipment worn or carried by a creature is similarly
        <em>enlarged</em> by the spell. Melee weapons affected by this spell
        deal more damage (see page 145). Other magical properties are not
        affected by this spell. Any <em>enlarged</em> item that leaves an
        <em>enlarged</em> creature's possession (including a projectile or
        thrown weapon) instantly returns to its normal size. This means that
        thrown and projectile weapons deal their normal damage. Magical
        properties of <em>enlarged</em> items are not increased by this
        spell.</p><p>Multiple magical effects that increase size do not
        stack.</p><p><em>Enlarge person</em> counters and dispels <em>reduce
        person</em>.</p><p><em>Enlarge person</em> can be made permanent with a
        <em>permanency</em> spell.</p></div>
      duration:
