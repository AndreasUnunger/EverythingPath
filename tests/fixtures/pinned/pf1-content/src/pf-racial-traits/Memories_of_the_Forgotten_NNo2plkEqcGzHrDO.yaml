    value: >-
      <p><strong>Race</strong>: Wyvaran<br /><strong>Replaced Trait(s)</strong>:
      Flight</p><hr /><p>Generations of wyvaran elders pass down tales that
      predate written history. While many ignore these or dismiss them as simple
      stories, others revere the lore of their elders. These wyvarans consider
      it their sacred duty to study the lost histories and pass them down to
      others. They gain a +2 racial bonus on two Knowledge skills of their
      choice. Those Knowledge skills are class skills for them. This racial
      trait replaces flight.</p>
