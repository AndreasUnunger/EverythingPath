name: Dreamspeaker
system:
  actions:
    - _id: LZUsWIfRJ59OkaAM
      activation:
        type: minute
        unchained:
          type: minute
      description: >-
        <p>Elves with a Charisma of 15 or higher may use
        @UUID[Compendium.pf1.spells.Item.ifcnx1yyw6e7ousm]{dream} once per day
        as a spell-like ability (caster level is equal to the elf's character
        level).</p><p>You, or a messenger you touch, send a message to others in
        the form of a dream. At the beginning of the spell, you must name the
        recipient or identify him or her by some title that leaves no doubt as
        to identity. The messenger then enters a trance, appears in the intended
        recipient's dream, and delivers the message. The message can be of any
        length, and the recipient remembers it perfectly upon waking. The
        communication is one-way. The recipient cannot ask questions or offer
        information, nor can the messenger gain any information by observing the
        dreams of the recipient.</p><p>Once the message is delivered, the
        messenger's mind returns instantly to its body. The duration of the
        spell is the time required for the messenger to enter the recipient's
        dream and deliver the message.</p><p>If the recipient is awake when the
        spell begins, the messenger can choose to wake up (ending the spell) or
        remain in the trance.</p><p>The messenger can remain in the trance until
        the recipient goes to sleep, then enter the recipient's dream and
        deliver the message as normal. A messenger that is disturbed during the
        trance comes awake, ending the spell.</p><p>Creatures who don't sleep or
        don't dream cannot be contacted by this spell.</p><p>The messenger is
        unaware of its own surroundings or of the activities around it while in
        the trance. It is defenseless both physically and mentally (always
        failing any saving throw) while in the trance.</p>
      duration:
        units: seeText
      name: Dream
      notes:
        effect:
          - Subject to SR
      range:
        units: unlimited
      target:
        value: One living creature touched
  changes:
    - _id: U8A0W81o
      formula: '1'
      target: dc.school.div
      type: racial
  contextNotes:
    - target: spellEffect
      text: +[[1]] to DC for sleep effects.
  description:
    value: >-
      <p><strong>Race</strong>: Elf<br /><strong>Replaced Trait(s)</strong>:
      Elven Immunities</p><hr /><p>A few elves have the ability to tap into the
      power of sleep, dreams, and prescient reverie. Elves with this racial
      trait add +1 to saving throw DCs for spells of the divination school and
      sleep effects they cast. In addition, elves with a Charisma of 15 or
      higher may use
      <em>@UUID[Compendium.pf1.spells.Item.ifcnx1yyw6e7ousm]{dream} </em>once
      per day as a spell-like ability (caster level is equal to the elf's
      character level). This racial trait replaces the elven immunities racial
      trait.</p>
