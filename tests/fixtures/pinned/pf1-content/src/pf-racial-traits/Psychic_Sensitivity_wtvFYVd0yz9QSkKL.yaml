    value: >-
      <p><strong>Race</strong>: Drow<br /><strong>Replaced Trait(s)</strong>:
      Drow Immunities, Keen Senses</p><hr /><p>The Darklands is full of strange
      energies, and the drow or half-drow who live there practice bloody rituals
      in exchange for favor and power. Drow or half-elves with this trait gain
      the @UUID[Compendium.pf1.feats.Item.3owNW4QoIZK6Pwm5]{Psychic Sensitivity}
      feat (<em>Pathfinder Roleplaying Game Occult Adventures</em> 138), gaining
      access to occult skill unlocks normally only available to psychic
      spellcasters.</p><p>This racial trait replaces keen senses and drow
      immunities.</p>
