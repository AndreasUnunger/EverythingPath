  description:
    value: >-
      <p><strong>Race</strong>: Gnome<br /><strong>Replaced Trait(s)</strong>:
      Defensive Training, Hatred, Obsessive</p><hr /><p>Some gnomes become
      obsessed with specific individuals. Once per day, such a gnome can observe
      a creature for 10 minutes. After that, she gains a +1 bonus on Bluff,
      Knowledge, Perception, Sense Motive, and Survival checks against that
      creature. She also gains a +1 bonus on weapon attack and damage rolls
      against that creature. These bonuses last for 1 day. This racial trait
      replaces defensive training, hatred, and obsessive.</p>
