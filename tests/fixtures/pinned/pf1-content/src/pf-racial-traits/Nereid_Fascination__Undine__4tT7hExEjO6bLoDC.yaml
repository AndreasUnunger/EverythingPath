  description:
    value: >-
      <p><strong>Race</strong>: Undine<br /><strong>Replaced Trait(s)</strong>:
      Spell-Like Ability</p><hr /><p>Some undines can trace their ancestry to
      nereids as well as to outsiders. Once per day as a standard action, such
      an undine can create a @Distance[20 ft;dual]-radius aura that causes
      humanoids within the aura's range to become fascinated with her for a
      number of rounds equal to 1/2 the undine's character level (minimum 1).
      Targets may resist with a Will save (DC 10 + 1/2 the undine's level + the
      undine's Charisma modifier). This is a supernatural ability. This racial
      trait replaces the spell-like ability racial trait.</p><p><strong>Related
      buff: </strong>@Toggle[Nereid Fascination]</p>
