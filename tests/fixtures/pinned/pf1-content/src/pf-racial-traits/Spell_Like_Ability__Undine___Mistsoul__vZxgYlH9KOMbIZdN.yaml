      description: >-
        <p>@UUID[Compendium.pf1.spells.Item.tuh5vc2bojaws3ig]{obscuring
        mist}</p><p>A misty vapor arises around you. It is stationary. The vapor
        obscures all sight, including darkvision, beyond @Distance[5 ft;dual]. A
        creature @Distance[5 ft;dual] away has concealment (attacks have a 20%
        miss chance). Creatures farther away have total concealment (50% miss
        chance, and the attacker cannot use sight to locate the target).</p><p>A
        moderate wind (11+ mph), such as from a gust of wind spell, disperses
        the fog in 4 rounds. A strong wind (21+ mph) disperses the fog in 1
        round. A fireball, flame strike, or similar spell burns away the fog in
        the explosive or fiery spell's area. A Wall of Fire burns away the fog
        in the area into which it deals damage.</p><p>This spell does not
        function underwater.</p>
      duration:
        units: minute
        value: '@attributes.hd.total'
      name: Obscuring Mist
      range:
        units: ft
        value: '20'
