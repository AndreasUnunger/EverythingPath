  description:
    value: >-
      <p><strong>Race</strong>: Gnome<br /><strong>Replaced Trait(s)</strong>:
      Gnome Magic, Keen Senses</p><hr /><p>Some gnomes retain a trace of the
      vitality of the First World. These gnomes recover 50% more hit points
      (minimum 1) whenever they recover hit points from rest. Whenever they are
      healed of hit point damage by a spell, they heal an additional amount
      equal to 1/2 the spell's caster level (minimum 0). The extra healing does
      not apply to spells that grant fast healing or similar effects. This
      racial trait replaces gnome magic and keen senses.</p>
