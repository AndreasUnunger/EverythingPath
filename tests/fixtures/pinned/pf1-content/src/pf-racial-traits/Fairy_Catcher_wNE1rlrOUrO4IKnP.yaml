  description:
    value: >-
      <p><strong>Race</strong>: Gnome<br /><strong>Replaced Trait(s)</strong>:
      Defensive Training, Hatred, Keen Senses</p><hr /><p>Some gnomes are
      especially sensitive to the presence of fey and receive a +2 racial bonus
      on Perception, Sense Motive, and Survival checks against fey, a +2 racial
      bonus on saving throws against the spells, spell-like abilities, and
      supernatural abilities of fey (this bonus stacks with the bonus granted by
      illusion resistance), and a +2 bonus on caster level checks to overcome
      the spell resistance of fey. The racial trait replaces defensive training,
      hatred, and keen senses.</p>
