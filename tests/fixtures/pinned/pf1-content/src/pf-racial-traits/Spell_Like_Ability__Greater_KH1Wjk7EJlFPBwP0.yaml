name: Spell-Like Ability, Greater
system:
  abilityType: sp
  description:
    instructions: >-
      <p>Once you have chosen a spell, add an action to this trait via the
      details tab and set the spells parameters within the action.  You may wish
      to include a link to the spell with the action for ease of use.</p>
    value: >-
      <p><strong>Special</strong>: This trait costs as many RP as the level of
      the spell chosen. This trait can be taken up to three times. Each time you
      take an additional spell, adjust the RP cost of this trait
      appropriately.</p><hr /><p>Choose a 3rd-level or 4th level spell that does
      not attack a creature or deal damage. Members of this race can use this
      spell as a spell-like ability once per day. The caster level of the spell
      is equal to the user’s character level.</p>
