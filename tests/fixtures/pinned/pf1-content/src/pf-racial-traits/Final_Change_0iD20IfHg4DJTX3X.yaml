    value: >-
      <p><strong>Race</strong>: Deep One Hybrid</p><hr /><p>A deep one hybrid
      ages at the same rate as a half-orc. A mere 1d12 months after a deep one
      hybrid reaches venerable age (at 60 years old), it dies a painful,
      agonizing death, only to have its body transform into that of a mature
      deep one. This transformation functions as the reincarnate spell, with the
      newly formed deep one gaining the following modifications to its physical
      ability scores: +6 Strength, -2 Dexterity, and +6 Constitution.</p>
