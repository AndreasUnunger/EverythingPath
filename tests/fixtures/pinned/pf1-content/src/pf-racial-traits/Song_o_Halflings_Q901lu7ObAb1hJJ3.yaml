name: Song'o Halflings
system:
  description:
    value: >-
      <p><strong>Race</strong>: Halfling<br /><strong>Replaced
      Trait(s)</strong>: Base Statistics</p><hr /><p>Deep in the jungles outside
      the former Chelish colony of Sargava in the Mwangi Expanse, the mysterious
      Song'o halflings avoid almost all non-Mwangi. These halflings live in
      temporary villages, abandoning sites when they are discovered and
      resettling in ever more isolated areas of the jungle. Many believe this
      intense aversion to outside interaction is due to early Chelish slavers
      settling the region and Sargava's oppression of the native Mwangi. Song'o
      halflings are well represented by the
      @UUID[Compendium.pf-content.pf-racial-traits.Item.4oBIdiWGwsIqgHJW]{deep
      jungle} alternate racial trait, as well as the
      @UUID[Compendium.pf-content.pf-racial-traits.Item.s07V8lcVJX3IkC6l]{danger
      detection} and
      @UUID[Compendium.pf-content.pf-racial-traits.Item.vGtt49PJQtdsOIC3]{evasive
      nomad} alternate racial traits described below.</p>
