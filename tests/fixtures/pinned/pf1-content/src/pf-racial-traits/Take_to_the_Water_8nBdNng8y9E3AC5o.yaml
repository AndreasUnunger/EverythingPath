  description:
    instructions: >-
      <p>Rule for humans: <em>You can hold your breath for a number of rounds
      equal to twice your Constitution score, but only if you do nothing other
      than take move actions or free actions. If you take a standard action or a
      full-round action (such as making an attack), the remainder of the
      duration for which you can hold your breath is reduced by 1
      round.</em></p><p>Also note that all creatures with swim speeds receive a
      +8 to swim checks so this trait may be a duplication of that bonus. </p>
    value: >-
      <p><strong>Race</strong>: Deep One Hybrid</p><hr /><p>A deep one hybrid
      can hold its breath 10 times longer than a human can, and gains a +2 bonus
      on Initiative checks and Reflex saving throws while swimming. A deep one
      hybrid has a swim speed of @Distance[30 ft;dual], and gains a +8 racial
      bonus on all Swim checks.</p>
