  description:
    value: >-
      <p><strong>Race</strong>: Human<br /><strong>Replaced Trait(s)</strong>:
      Skilled</p><hr /><p>City-dwelling humans are skilled at blending in with
      the busy multitudes of the city. They gain a +1 racial bonus on Bluff,
      Diplomacy, Disguise, Sleight of Hand, and Stealth checks when within
      @Distance[10 ft;dual] of at least two other humanoids. They gain a +1
      racial bonus on attacks of opportunity made while flanking. This racial
      trait replaces skilled.</p>
