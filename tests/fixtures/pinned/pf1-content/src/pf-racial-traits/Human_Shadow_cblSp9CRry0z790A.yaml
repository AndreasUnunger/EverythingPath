  description:
    value: >-
      <p><strong>Race</strong>: Halfling<br /><strong>Replaced
      Trait(s)</strong>: Keen Senses, Sure-Footed</p><hr /><p>Halflings seem to
      pop up wherever humans are found, in part because they actively support
      and move with human explorers, settlers, and travelers without drawing
      attention to themselves. These halflings can use Stealth to hide behind
      creatures at least one size category larger than themselves, without any
      other source of concealment or cover. As long as the halflings are within
      @Distance[30 ft;dual] of a human, they gain a +2 racial bonus on Sleight
      of Hand checks and Stealth checks. This racial trait replaces keen senses
      and sure-footed.</p>
