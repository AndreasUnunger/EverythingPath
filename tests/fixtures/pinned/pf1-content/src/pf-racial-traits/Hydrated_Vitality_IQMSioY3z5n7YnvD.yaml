      <p><strong>Race</strong>: Undine<br /><strong>Replaced Trait(s)</strong>:
      Water Affinity</p><hr /><p>An undine with this racial trait gains fast
      healing 2 for 1 round anytime she submerges completely within a body of
      natural salt water, fresh water, or brackish water. Stagnant, poisoned, or
      trapped water (such as an artificial pit or a <i>bag of holding</i>) does
      not activate this ability. The undine can heal up to 2 hit points per
      level per day with this ability, after which it ceases to function. This
      racial trait replaces water affinity.</p>
