      <p><strong>Race</strong>: Half-Elf<br /><strong>Replaced
      Trait(s)</strong>: Adaptability<br /><strong>Prerequisite</strong>:
      Charisma 13+</p><hr /><p>Characters who practice coercion and intimidation
