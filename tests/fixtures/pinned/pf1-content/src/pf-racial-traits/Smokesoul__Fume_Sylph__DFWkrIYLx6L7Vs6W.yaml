name: Smokesoul (Fume Sylph)
system:
  description:
    value: >-
      <p><strong>Race</strong>: Sylph<br /><strong>Replaced Trait(s)</strong>:
      Base Statistics</p><hr /><p>Veiled and surreptitious, smokesoul sylphs are
      natural deceivers, always concealing their true
      intentions.</p><p><strong>Typical Alignment</strong> CE <br
      /><strong>Ability Modifiers</strong> +2 Dex, +2 Cha, -2 Con <br
      /><strong>Alternate Spell-Like Ability</strong> Smokesouls gain
      @UUID[Compendium.pf1.spells.Item.h4hrop7rq2c9phyi]{blurred movement} as a
      spell-like ability. <br /><strong>Smoke Affinity</strong> This racial
      trait functions as and can be replaced as the base sylph's air affinity,
      except it benefits sorcerers with the shadow bloodline and spellcasters
      with the Smoke subdomain.</p><p>Obfuscation, secrecy, and the shape of
      things not there: all these are the natural realms of smokesouls. They are
      experts at concealing both their bodies and motivations, and at making the
      insubstantial seem as real as any physical object. Smokesouls are drawn to
      areas of dangerous politics and intrigue, and many can be found in Nidal
      and Brevoy pursuing whatever machinations amuse them.</p><p>With few
      distinguishing features save ashen skin and dark hair, smokesouls can be
      mistaken for any number of other races. Smokesouls often change their
      clothing, cosmetics, or style to keep their appearance in a constant state
      of flux.</p>
