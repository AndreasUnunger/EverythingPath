  description:
    instructions: >-
      <p>Creatures with light blindness are @Condition[blind]ed for 1 round if
      exposed to bright light, such as sunlight or the
      @UUID[Compendium.pf1.spells.Item.7x2z0i8rcx7s81fk]{daylight} spell. Such
      creatures are @Condition[dazzled] as long as they remain in areas of
      bright light.</p>
    value: >-
      <p><strong>Prerequisite</strong>: Darkvision or
      @UUID[Compendium.pf-content.pf-racial-traits.Item.AJ0skaMigV1GU6fG]{See in
      Darkness}</p><hr /><p>Abrupt exposure to bright light blinds members of
      this race for 1 round; on subsequent rounds, they are dazzled as long as
      they remain in the affected area.</p>
