  description:
    value: >-
      <p><strong>Race</strong>: Tiefling<br /><strong>Replaced
      Trait(s)</strong>: Spell-Like Ability</p><hr /><p>Those who brave the
      lightless tunnels below Golarion's surface learn to identify the dangerous
      phenomena that characterize the Darklands. Characters with this trait gain
      a +2 bonus on initiative checks, and on saves against traps and hazards
      when underground (from a lifetime of dodging accursed pools, cave-ins, and
      green slime).</p><p>Tieflings can take this trait in place of the darkness
      spell-like ability.</p>
