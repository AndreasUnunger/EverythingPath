name: Magical Linguist
system:
  actions:
    - _id: QtbM0XuNfUaDqTZE
      activation:
        type: standard
        unchained:
          cost: 2
          type: action
      area: 1 sq ft
      description: >-
        <p><em>@UUID[Compendium.pf1.spells.Item.n8k4pdmjjg8xuv7l]{arcane
        mark}</em>, </p><p>This spell allows you to inscribe your personal rune
        or mark, which can consist of no more than six characters. The writing
        can be visible or invisible. An arcane mark spell enables you to etch
        the rune upon any substance without harm to the material upon which it
        is placed. If an invisible mark is made, a detect magic spell causes it
        to glow and be visible, though not necessarily understandable.</p><p>See
        invisibility, true seeing, a gem of seeing, or a robe of eyes likewise
        allows the user to see an invisible arcane mark. A read magic spell
        reveals the words, if any. The mark cannot be dispelled, but it can be
        removed by the caster or by an erase spell.</p><p>If an arcane mark is
        placed on a living being, the effect gradually fades in about a
        month.</p><p>Arcane mark must be cast on an object prior to casting
        instant summons on the same object (see that spell description for
        details).</p>
      duration:
        units: perm
      name: Arcane Mark
      notes:
        effect:
          - >-
            This spell allows you to inscribe your personal rune or mark, which
            can consist of no more than six characters. The writing can be
            visible or invisible. An arcane mark spell enables you to etch the
            rune upon any substance without harm to the material upon which it
            is placed. If an invisible mark is made, a detect magic spell causes
            it to glow and be visible, though not necessarily understandable. 
            See invisibility, true seeing, a gem of seeing, or a robe of eyes
            likewise allows the user to see an invisible arcane mark. A read
            magic spell reveals the words, if any. The mark cannot be dispelled,
            but it can be removed by the caster or by an erase spell.  If an
            arcane mark is placed on a living being, the effect gradually fades
            in about a month.  Arcane mark must be cast on an object prior to
            casting instant summons on the same object (see that spell
            description for details).
      range:
        units: touch
      uses:
        self:
          maxFormula: gte(@abilities.cha.total, 11)
          per: day
          value: 1
    - _id: Lhoq4fVqkro20H4I
      activation:
        type: standard
        unchained:
          cost: 2
          type: action
      description: >-
        <p>@UUID[Compendium.pf1.spells.Item.jcs7ba5depdyitey]{comprehend
        languages},</p><p>You can understand the spoken words of creatures or
        read otherwise incomprehensible written messages. The ability to read
        does not necessarily impart insight into the material, merely its
        literal meaning. The spell enables you to understand or read an unknown
        language, not speak or write it.</p><p>Written material can be read at
        the rate of one page (250 words) per minute. Magical writing cannot be
        read, though the spell reveals that it is magical. This spell can be
        foiled by certain warding magic (such as the secret page and illusory
        script spells). It does not decipher codes or reveal messages concealed
        in otherwise normal text.</p><p>Comprehend languages can be made
        permanent with a permanency spell.</p>
      duration:
        units: minute
        value: '@attributes.hd.total * 10'
      name: Comprehend Languages
      notes:
        effect:
          - >-
            You can understand the spoken words of creatures or read otherwise
            incomprehensible written messages. The ability to read does not
            necessarily impart insight into the material, merely its literal
            meaning. The spell enables you to understand or read an unknown
            language, not speak or write it.  Written material can be read at
            the rate of one page (250 words) per minute. Magical writing cannot
            be read, though the spell reveals that it is magical. This spell can
            be foiled by certain warding magic (such as the secret page and
            illusory script spells). It does not decipher codes or reveal
            messages concealed in otherwise normal text.  Comprehend languages
            can be made permanent with a permanency spell.
      range:
        units: personal
      uses:
        self:
          maxFormula: gte(@abilities.cha.total, 11)
          per: day
          value: 1
    - _id: XrqSf1aAnNzEDSLt
      activation:
        type: standard
        unchained:
          cost: 2
          type: action
      description: >-
        <p>@UUID[Compendium.pf1.spells.Item.msaqovkgfxi6q8s8]{message},</p><p>You
        can whisper messages and receive whispered replies.</p><p>Those nearby
        can hear these messages with a DC 25 Perception check. You point your
        finger at each creature you want to receive the message. When you
        whisper, the whispered message is audible to all targeted creatures
        within range.</p><p>Magical silence, @Distance[1 ft;dual] of stone, 1
        inch of common metal (or a thin sheet of lead), or @Distance[3 ft;dual]
        of wood or dirt blocks the spell.</p><p>The message does not have to
        travel in a straight line. It can circumvent a barrier if there is an
        open path between you and the subject, and the path's entire length lies
        within the spell's range. The creatures that receive the message can
        whisper a reply that you hear. The spell transmits sound, not meaning;
        it doesn't transcend language barriers. To speak a message, you must
        mouth the words and whisper.</p>
      duration:
        units: minute
        value: '@attributes.hd.total * 10'
      name: Message
      range:
        units: medium
        value: '@attributes.hd.total * 10 + 100'
      target:
        value: up to [[@attributes.hd.total ]] creatures
      uses:
        self:
          maxFormula: gte(@abilities.cha.total, 11)
          per: day
          value: 1
    - _id: uFxCif85re5lMy0P
      activation:
        type: standard
        unchained:
          cost: 2
          type: action
      description: >-
        <p>@UUID[Compendium.pf1.spells.Item.j0bc0iii8zp1jiwr]{read
        magic}.</p><p>You can decipher magical inscriptions on objects-books,
        scrolls, weapons, and the like-that would otherwise be unintelligible.
        This deciphering does not normally invoke the magic contained in the
        writing, although it may do so in the case of a cursed or trapped
        scroll. Furthermore, once the spell is cast and you have read the
        magical inscription, you are thereafter able to read that particular
        writing without recourse to the use of read magic. You can read at the
        rate of one page (250 words) per minute. The spell allows you to
        identify a Glyph of Warding with a DC 13 Spellcraft check, a greater
        Glyph of Warding with a DC 16 Spellcraft check, or any symbol spell with
        a Spellcraft check (DC 10 + spell level).</p><p>Read magic can be made
        permanent with a permanency spell.</p>
      duration:
        units: minute
        value: '@attributes.hd.total * 10'
      name: Read Magic
      notes:
        effect:
          - >-
            You can decipher magical inscriptions on objects-books, scrolls,
            weapons, and the like-that would otherwise be unintelligible. This
            deciphering does not normally invoke the magic contained in the
            writing, although it may do so in the case of a cursed or trapped
            scroll. Furthermore, once the spell is cast and you have read the
            magical inscription, you are thereafter able to read that particular
            writing without recourse to the use of read magic. You can read at
            the rate of one page (250 words) per minute. The spell allows you to
            identify a Glyph of Warding with a DC 13 Spellcraft check, a greater
            Glyph of Warding with a DC 16 Spellcraft check, or any symbol spell
            with a Spellcraft check (DC 10 + spell level).
      range:
        units: personal
      uses:
        self:
          maxFormula: gte(@abilities.cha.total, 11)
          per: day
          value: 1
  contextNotes:
    - target: spellEffect
      text: >-
        +[[1]] to the DC of spells with the language-dependent descriptor or
        those that create glyphs, symbols, or other magical writings.
    - target: allSavingThrows
      text: >-
        +[[2]] Racial bonus against spells with the language-dependent
        descriptor or those that create glyphs, symbols, or other magical
        writings.
  description:
    value: >-
      <p>Members of this race gain a +1 bonus to the DC of spells they cast that
      have the language-dependent descriptor or that create glyphs, symbols, or
      other magical writings. They also gain a +2 racial bonus on saving throws
      against such spells. Members of this race with a Charisma score of 11 or
      higher also gain the following spell-like abilities: 1/day—arcane mark,
      comprehend languages, message, read magic. The caster level for these
      spell-like abilities is equal to the user’s character level.</p>
  racePoints: 2
