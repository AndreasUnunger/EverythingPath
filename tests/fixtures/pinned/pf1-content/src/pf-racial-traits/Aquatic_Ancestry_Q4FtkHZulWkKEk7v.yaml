  description:
    value: >-
      <p><strong>Race</strong>: Human<br /><strong>Replaced Trait(s)</strong>:
      Skilled</p><hr /><p>Humans with deep one or skum ancestry may exhibit
      prominent round eyes or webbed fingers and toes. They gain a racial bonus
      equal to half their character level on Swim checks and Swim is always a
      class skill for them. In addition, they can hold their breath for twice as
      long as normal. When the racial bonus on Swim checks from this ability
      becomes +8 or higher, they can always take 10 on Swim checks, even when
      threatened or distracted. This racial trait replaces skilled.</p>
