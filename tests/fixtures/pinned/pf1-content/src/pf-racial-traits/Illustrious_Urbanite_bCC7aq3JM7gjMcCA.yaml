  description:
    value: >-
      <p><strong>Race</strong>: Elf<br /><strong>Replaced Trait(s)</strong>:
      Keen Senses</p><hr /><p>City elves have a remarkable ability to combine
      magic harmoniously with their surroundings. They gain Spell Focus with
      conjuration, illusion, or transmutation spells as a bonus feat. When
      casting spells of this school, the elves can choose to have the spell
      leave undamaged any building or structure that would normally be affected.
      This racial trait replaces keen senses.</p>
