    value: >-
      <p><strong>Race</strong>: Changeling</p><hr /><p>Each changeling inherits
      one of the following racial traits, depending on her mother's hag type.
      (As outsiders, night hags produce half-fiend children, not
      changelings.)</p><ul><li><p>Crawling Skin (Blood Hag): The changeling
      gains a +2 bonus on Disguise checks made to look like specific
      individuals. </p></li><li><p>Dead Eyes (Mute Hag): One of the changeling’s
      eyes is a solid, dead black (with no whites even at its edges); this gives
      her a +2 bonus on all saves against gaze attacks and visual illusions.
      </p></li><li><p>Frostlaced Flesh (Winter Hag): The changeling leaves no
      tracks in snow, and gains a +2 racial bonus on all saves versus cold
      effects. </p></li><li><p>Green Widow (Green Hag): The changeling gains a
      +2 racial bonus on Bluff checks against creatures that are sexually
      attracted to her. </p></li><li><p>Hulking Changeling (Annis Hag): The
      changeling gains a +1 racial bonus on melee damage rolls.
      </p></li><li><p>Into the Wind (Storm Hag): The changeling gains a +1
      racial bonus on ranged damage rolls. </p></li><li><p>Sea Lungs (Sea Hag):
      The changeling can hold her breath for a number of rounds equal to 3 × her
      Constitution before she risks drowning.</p></li></ul>
