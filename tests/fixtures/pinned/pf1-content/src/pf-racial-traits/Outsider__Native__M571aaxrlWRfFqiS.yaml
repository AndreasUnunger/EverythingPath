  description:
    value: >-
      <p>A native outsider is at least partially composed of the essence (but
      not necessarily the matter) of some plane other than the Material Plane.
      Some creatures start out as some other type and become outsiders when they
      attain a higher (or lower) state of spiritual existence. When making a
      native outsider race, it is sometimes important to pick a single Outer
      Plane that race is tied to. For example, tieflings are tied to Abaddon,
      the Abyss, or Hell. Such ties can be important for qualifying for other
      racial abilities, but it’s not required that a native outsider be tied to
      another plane. A native outsider race has the followings
      features.</p><ul><li><p>Native outsiders have the darkvision @Distance[60
      ft;dual] racial trait.</p></li><li><p>Native outsiders breathe, eat, and
      sleep.</p></li></ul>
