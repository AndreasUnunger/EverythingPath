  description:
    value: >-
      <p><strong>Race</strong>: Human<br /><strong>Replaced Trait(s)</strong>:
      Bonus Feat</p><hr /><p>Humans from cultures steeped in the occult
      sometimes train their minds to resist outside influence. They gain a +2
      racial bonus on saving throws against psychic spells and spell-like
      abilities, including those that originate from the psychic magic ability
      (<i>Pathfinder RPG Bestiary 5 297</i>). This racial trait replaces the
      bonus feat trait.</p>
