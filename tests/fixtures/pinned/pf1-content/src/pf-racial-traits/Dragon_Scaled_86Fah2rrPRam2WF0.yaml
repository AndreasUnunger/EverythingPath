    value: >-
      <p><strong>Race</strong>: Kobold<br /><strong>Replaced Trait(s)</strong>:
      Armor</p><hr /><p>Some kobolds are hatched with scales of such vivid color
      that their connection to a particular sort of chromatic dragon seems
      undeniable. Whether this coloration is just a quirk of a stray egg or a
      trait shared by all the members of a tribe, these kobolds gain a
      resistance that makes them especially suited to work alongside dragons
      matching the color of the kobold's scales. Black-scaled and green-scaled
      kobolds with this racial trait gain acid resistance 5. Blue-scaled kobolds
      with this racial trait gain electricity resistance 5. Red-scaled kobolds
      with this racial trait gain fire resistance 5. White-scaled kobolds with
      this racial trait gain cold resistance 5. This racial trait replaces the
      armor racial trait.</p>
