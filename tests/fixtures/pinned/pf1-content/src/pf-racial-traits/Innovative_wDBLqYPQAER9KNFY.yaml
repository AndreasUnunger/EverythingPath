  description:
    value: >-
      <p><strong>Race</strong>: Human<br /><strong>Replaced Trait(s)</strong>:
      Skilled</p><hr /><p>Humans have come to shape the face of Golarion because
      they are inveterate innovators. Humans with this racial trait gain a +2
      racial bonus on Knowledge (arcana) and Spellcraft checks to independently
      research spells, create magic items they have never encountered before,
      and identify unique magical effects. They also gain a +2 racial bonus on
      Charisma-based skill checks to persuade others to adopt a new ideology or
      further the cause of discovery and progress. This racial trait replaces
      skilled.</p>
