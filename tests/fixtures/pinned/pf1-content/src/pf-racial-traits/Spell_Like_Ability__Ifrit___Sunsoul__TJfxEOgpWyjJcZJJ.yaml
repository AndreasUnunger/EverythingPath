      description: >-
        <p>@UUID[Compendium.pf1.spells.Item.3qpvx0evlgk4bfda]{sun metal}
        </p><p>The target weapon ignites into flame that does not hurt the
        weapon or the wielder, but damages those hit by the weapon. When the
        weapon's wielder hits with this weapon, it deals an additional [[1d4]]
        points of fire damage. This damage is not multiplied in the case of a
        critical hit. This effect immediately ends if the weapon is submerged in
        water. This effect does not stack with the <em>flaming</em> or
        <em>flaming</em> burst weapon special ability or any other effect that
        grants the weapon extra fire damage. It does not function on weapons
        with the <em>frost</em> or <em>icy burst</em> weapon special ability or
        any other effect that grants a weapon extra cold damage.</p>
