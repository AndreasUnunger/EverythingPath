  description:
    value: >-
      <p><strong>Race</strong>: Aphorite<br /><strong>Replaced
      Trait(s)</strong>: Spell-Like Ability</p><hr /><p>With vague memories of
      the Perfect City resting somewhere deep in their minds, aphorites with
      this racial trait gain a +2 racial bonus on Knowledge (local) checks and
      can cast @UUID[Compendium.pf1.spells.Item.fbzut7nb7lvr83e4]{urban grace}
      once per day as a spell-like ability (caster level equal to the aphorite's
      character level). This racial trait replaces the spell-like ability racial
      trait.</p>
