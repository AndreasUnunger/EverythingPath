  description:
    value: >-
      <p><strong>Race</strong>: Ghoran<br /><strong>Replaced Trait(s)</strong>:
      Past-Life Knowledge, Nature Magic</p><hr /><p>Many ghorans are resistant
      to magic or able to dispel it. Some ghorans even gain nourishment from
      absorbing magic. Whenever such a ghoran succeeds at a saving throw against
      a spell or spell-like ability, she regains 1 hit point per level of the
      spell, though this affects the ghoran only if she is above 0 hit points. A
      ghoran can use this ability a number of times per day equal to her level.
      This replaces past-life knowledge and nature magic.</p>
