            Creatures that succeed at the saving throw cannot be sickened by the
            same creature’s stench aura for 24 hours. A delay poison or
            neutralize poison spell or similar effect removes the effect from
            the sickened creature. This is a poison effect.
      range:
        units: ft
        value: '15'
      save:
        dc: 10 + floor(@attributes.hd.total / 2) + @abilities.con.mod
        description: negates
        type: fort
      target:
