name: Stench Aura
system:
  actions:
    - _id: mWGzXdOz2IFj2Ggy
      activation:
        type: nonaction
        unchained:
          type: nonaction
      description: >-
        <p>Members of this race secrete a terrible scent as a @Distance[15
        ft;dual] aura that nearly every other creature finds offensive. All
        living creatures (except those with the stench aura ability) within the
        aura must succeed at a Fortitude saving throw (DC 10 + 1/2 the user’s
        character level + the user’s Constitution modifier) or be sickened for 5
        rounds. Creatures that succeed at the saving throw cannot be sickened by
        the same creature’s stench aura for 24 hours. A delay poison or
        neutralize poison spell or similar effect removes the effect from the
        sickened creature. This is a poison effect.</p>
      duration:
        units: round
        value: '5'
      name: Stench Aura
      notes:
        effect:
          - Creatures that fail are @Condition[sickened] for 5 rounds
        footer:
