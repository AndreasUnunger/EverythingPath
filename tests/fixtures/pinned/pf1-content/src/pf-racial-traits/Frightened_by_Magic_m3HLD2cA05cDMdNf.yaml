name: Frightened by Magic
system:
  description:
    value: >-
      <p><strong>Race</strong>: Primitive Human</p><hr /><p>Primitive humans are
      uneasy around magic, especially spells that have large, impressive
      effects.</p><p>Whenever a primitive human is damaged or affected by a
      spell or supernatural ability that has an obvious visual component, the
      human is shaken for 1 round (subject to GM discretion).</p><p>A primitive
      human that gains the ability to cast spells from a class feature is
      unaffected by this racial trait.</p>
