name: Sticky Tendrils
system:
  changes:
    - _id: HRuXuYsI
      formula: '30'
      operator: set
      target: landSpeed
      type: base
  contextNotes:
    - target: climbSpeed
      text: >-
        You can cling to walls and even ceilings as long as the surface has
        handholds, and it is treated as being constantly under the effects of a
        nonmagical @UUID[Compendium.pf1.spells.Item.3mfmhx8avu7h3iom]{Spider
        Climb} (except that you may not cling to smooth surfaces).
    - target: flySpeed
      text: >-
        You have the ability to glide rather than true flight; you take no
        damage from falling, as if subject to a constant nonmagical
        @UUID[Compendium.pf1.spells.Item.68m9du7zw2di7ew6]{Feather Fall} spell.
        While in midair, you can move up to @Distance[5 ft;dual] horizontally
        for every @Distance[1 ft;dual] it falls, at a speed of @Distance[60
        ft;dual] per round. You cannot gain height with your wings, if subjected
        to strong winds or any other effect that causes you to rise, you can
        increase the distance you can glide.
  description:
    instructions: >-
      <p>Remove
      @UUID[Compendium.pf-content.pf-racial-traits.Item.lhDGN1bu2IsaabX4]{Normal
      Speed (Gathlain)} racial trait to ensure accurate land and fly speeds.</p>
    value: >-
      <p><strong>Race</strong>: Gathlain<br /><strong>Replaced
      Trait(s)</strong>: Racial Fly Speed</p><hr /><p>When a gathlain seed finds
      itself taking root in an environment that warps and changes erratically,
      the resulting gathlain learns to cling tenaciously with its vines. The
      gathlain can cling to walls and even ceilings as long as the surface has
      handholds, and it is treated as being constantly under the effects of a
      nonmagical @UUID[Compendium.pf1.spells.Item.3mfmhx8avu7h3iom]{Spider
      Climb} spell (except that the gathlain may not cling to smooth surfaces).
      The gathlain's vines provide only the ability to glide rather than true
      flight; the gathlain takes no damage from falling, as if subject to a
      constant nonmagical
      @UUID[Compendium.pf1.spells.Item.68m9du7zw2di7ew6]{Feather Fall} spell.
      While in midair, a gathlain can move up to @Distance[5 ft;dual]
      horizontally for every @Distance[1 ft;dual] it falls, at a speed of
      @Distance[60 ft;dual] per round. The gathlain cannot gain height with its
      wings, but instead coasts in other directions as it falls. If subjected to
      strong winds or any other effect that causes it to rise, the gathlain can
      take advantage of this updraft to increase the distance it can glide. This
      racial trait replaces the gathlain's fly speed.</p>
