  description:
    instructions: >-
      <p><em><strong>Special note</strong>: From Halflings of Golarion, pg.
      26.</em></p><p><em>A halfling can select the
      @UUID[Compendium.pf1.feats.Item.QWQH2kZgd1xZicuX]{Ability Focus} monster
      feat (see page 314 of the Pathfinder RPG Bestiary) to increase the DC of
      his jinx.</em></p>
    value: >-
      <p><strong>Race</strong>: Halfling<br /><strong>Replaced
      Trait(s)</strong>: Halfling Luck</p><hr /><p>You lose the halfling luck
      racial trait (and its +1 racial bonus on saving throws) and instead gain
      the ability to curse another creature with bad luck at will as a standard
      action. This curse has a range of 30 feet, and you must be able to see the
      target and have line of effect to it. The target gets a Will saving throw
      to resist this jinx (DC = 10 + 1/2 your level + your Charisma modifier).
      If your target makes this saving throw, it is immune to your jinx ability
      for 24 hours. A jinxed creature takes a -1 penalty on all saving throws.
      This jinx lasts for 24 hours or until you attempt to use your jinx again.
      A jinx is a supernatural ability, is not mind-affecting, does not allow
      spell resistance, and can affect any kind of creature not immune to luck
      effects.</p><p></p>
