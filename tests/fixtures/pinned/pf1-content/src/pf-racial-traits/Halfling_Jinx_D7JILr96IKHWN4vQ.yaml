          type: action
      description: >-
        <p>Curse another creature with bad luck at will as a standard
        action.</p><p>This curse has a range of @Distance[30 ft;dual], and you
        must be able to see the target and have line of effect to it.</p><p>The
        target gets a Will saving throw to resist this jinx (DC = 10 + 1/2 your
        level + your Charisma modifier).</p><p>If your target makes this saving
        throw, it is immune to your jinx ability for 24 hours.</p><p>A jinxed
        creature takes a -1 penalty on all saving throws.</p><p>This jinx lasts
        for 24 hours or until you attempt to use your jinx again.</p><p>A jinx
        is a supernatural ability, is not mind-affecting, does not allow spell
        resistance, and can affect any kind of creature not immune to luck
        effects.</p>
