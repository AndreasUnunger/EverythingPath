  description:
    value: >-
      <p><strong>Race</strong>: Human<br /><strong>Replaced Trait(s)</strong>:
      Skilled</p><hr /><p>Humans rely on their institutions to remember the
      distant past and to preserve their own memories for the distant future.
      They gain a +4 racial bonus on Knowledge checks to answer questions about
      any organizations, guilds, or religions to which they belong, and they can
      attempt such skill checks untrained. This racial trait replaces
      skilled.</p>
