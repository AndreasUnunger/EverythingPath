    value: >-
      <p><strong>Race</strong>: Half-Orc<br /><strong>Replaced
      Trait(s)</strong>: Intimidating, Weapon Familiarity</p><hr /><p>Certain
      half-orcs know rituals to enhance the strength and brutality of their
      allies. These half-orcs gain a +2 racial bonus on Spellcraft checks. In
      addition, when such a half-orc acquires an animal companion, bonded mount,
      cohort, familiar, or spirit animal, that creature gains a +2 bonus to
      Strength, Dexterity, or Constitution, as selected by the half-orc. This
      racial trait replaces weapon familiarity and intimidating.</p>
