        +[[2]] Circumstance bonus vs blinded and dazzled conditions when halo is
        active
  description:
    value: >-
      <p><strong>Prerequisite:</strong>
      @UUID[Compendium.pf-content.pf-racial-traits.Item.M571aaxrlWRfFqiS]{Outsider
      (Native)} with ties to Elysium, Heaven, or Nirvana</p><hr /><p>Members of
      this race can create light centered on their head at will as a spell-like
      ability. When using the halo, a member of this race gains a +2
      circumstance bonus on Intimidate checks against evil creatures and on
      saving throws against becoming blinded or dazzled.</p><p><strong>Related
      Buff:</strong> @Toggle[Halo]</p>
