name: Night-Born (Moon May)
system:
  description:
    value: >-
      <p><strong>Race</strong>: Changeling<br /><strong>Replaced
      Trait(s)</strong>: Base Statistics</p><hr /><p>As much made as born, moon
      mays are deliberately created by night hags with foul futures in mind.
      Destiny haunts their lives, fanning pride and natural talent into
      megalomania.</p><p><b>Ancestry</b> Night hag<br /><b>Typical Alignment</b>
      N<br /><b>Ability Modifiers</b> +2 Wis, +2 Cha, -2 Dex<br /><b>Hag Racial
      Trait</b> Night-born changelings gain a +2 racial bonus on saving throws
      against disease.<br /><b>Awakened Hag Heritage</b> You can form a
      <i>lesser heartstone</i> by performing an 8-hour ritual over any gem worth
      at least 500 gp. While you carry it, a <i>lesser heartstone</i> allows you
      to apply your +2 racial bonus on saving throws against disease to all
      Fortitude saves. A <i>lesser heartstone</i> can also be used as a focus to
      replace any material spell components worth 10 gp or less. A <i>lesser
      heartstone</i> is considered to have a caster level equal to your
      character level at the time of its creation.</p>
