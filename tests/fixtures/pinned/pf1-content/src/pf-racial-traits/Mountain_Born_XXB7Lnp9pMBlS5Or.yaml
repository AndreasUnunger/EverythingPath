      <p><strong>Race</strong>: Oread<br /><strong>Replaced Trait(s)</strong>:
      Spell-Like Ability</p><hr /><p>Oreads are drawn to mountains and other
      high places, and after many generations they've grown well suited to their
      environment. Oreads with this racial trait gain a +2 racial bonus on
      Acrobatics checks made to cross narrow ledges and on saves against
      altitude fatigue and sickness. This racial trait replaces the spell-like
      ability racial trait.</p>
