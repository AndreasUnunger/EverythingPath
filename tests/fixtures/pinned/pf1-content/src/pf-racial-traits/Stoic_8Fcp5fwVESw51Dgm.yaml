  description:
    value: >-
      <p><strong>Race</strong>: Half-Orc<br /><strong>Replaced
      Trait(s)</strong>: Intimidating, Orc Ferocity</p><hr /><p>Some half-orcs
      learn to suppress their strong emotions. They don't usually gain morale
      bonuses, but instead gain a +2 racial bonus on saving throws against
      emotion and fear effects, and the DC to intimidate them increases by 2.
      They can choose to gain morale bonuses when they would normally be able to
      do so, but if they do, they lose the benefits from this racial trait for
      24 hours. This racial trait replaces intimidating and orc ferocity.</p>
