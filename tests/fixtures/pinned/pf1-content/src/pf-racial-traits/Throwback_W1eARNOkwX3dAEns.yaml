      <p><strong>Race</strong>: Gillman<br /><strong>Replaced Trait(s)</strong>:
      Water Dependent</p><hr /><p>Some gillmen are throwbacks to their
      land-dwelling human ancestors. Gillmen with this racial trait do not have
      the amphibious trait, have the human subtype instead of the aquatic
      subtype, have no swim speed or bonuses to the Swim skill, cannot breathe
      water, and do not have the water dependent racial trait.</p><p></p>
