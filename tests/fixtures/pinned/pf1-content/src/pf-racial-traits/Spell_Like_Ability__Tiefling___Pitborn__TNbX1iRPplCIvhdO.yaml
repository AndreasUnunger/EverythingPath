      description: >-
        <p>@UUID[Compendium.pf1.spells.Item.q63jn0kbrrb6t3ea]{Shatter}</p><p>Shatter
        creates a loud, ringing noise that breaks brittle, nonmagical objects;
        sunders a single solid, nonmagical object; or damages a crystalline
        creature.</p><p>Used as an area attack, shatter destroys nonmagical
        objects of crystal, glass, ceramic, or porcelain. All such unattended
        objects within a @Distance[5 ft;dual] radius of the point of origin are
        smashed into dozens of pieces by the spell. Objects weighing more than
        @Weight[1;dual] per your level are not affected, but all other objects
        of the appropriate composition are shattered.</p><p>Alternatively, you
        can target shatter against a single solid nonmagical object, regardless
        of composition, weighing up to @Weight[10;dual] per caster level.
        Targeted against a crystalline creature (of any weight), shatter deals
        1d6</p>
