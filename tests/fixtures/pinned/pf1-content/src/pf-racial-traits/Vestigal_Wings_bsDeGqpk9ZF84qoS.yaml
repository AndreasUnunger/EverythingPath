    value: >-
      <p><strong>Race</strong>: Wyvaran<br /><strong>Replaced Trait(s)</strong>:
      Flight</p><hr /><p>When resources are particularly scarce, some young
      wyvarans develop smaller-than-average wings incapable of flight. However,
      these wings are perfectly suited for other acrobatic maneuvers. These
      wyvarans gain a +2 racial bonus on Acrobatics and Climb checks, and one of
      these is a class skill for them. In addition, they can ignore the first
      @Distance[20 ft;dual] of falling damage when they make a successful
      Acrobatics check. This racial trait replaces flight.</p>
