name: Rain Frenzy
system:
  description:
    value: >-
      <p><strong>Race</strong>: Adaro</p><hr /><p>Adaros revere storms, and
      their lust for blood is amplified exponentially while it is raining. While
      fighting in the rain or during other stormy weather, adaros act as though
      affected by the
      <em>@UUID[Compendium.pf-content.pf-buffs.Item.nRHD11ZwDWlRyT8c]{rage}
      </em>spell. An adaro gains this benefit even if it is underwater, but only
      as long as it remains within its swim speed of the water's surface.</p>
