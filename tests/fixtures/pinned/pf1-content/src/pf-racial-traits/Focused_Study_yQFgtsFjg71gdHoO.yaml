      <p><strong>Race</strong>: Human<br /><strong>Replaced Trait(s)</strong>:
      Bonus Feat</p><hr /><p>All humans are skillful, but some, rather than
      being generalists, tend to specialize in a handful of skills. At 1st, 8th,
      and 16th level, such humans gain Skill Focus in a skill of their choice as
      a bonus feat. This racial trait replaces the bonus feat trait.</p>
