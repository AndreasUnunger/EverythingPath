  description:
    value: >-
      <p>Members of this race gain the following supernatural ability: Once per
      hour as a standard action, a member of this race can emit a thunderous
      croak. Any creature not of its subtype (if humanoid) or type (if another
      race type) must make a successful Will saving throw (DC 10 + 1/2 the
      user’s character level + the user’s Charisma modifier) or become shaken
      for 1d4 rounds. A target that successfully saves cannot be affected by the
      user’s terrifying croak for 24 hours. Creatures that are already shaken
      become frightened for 1d4 rounds instead. This is a sonic, mindaffecting
      effect.</p>
