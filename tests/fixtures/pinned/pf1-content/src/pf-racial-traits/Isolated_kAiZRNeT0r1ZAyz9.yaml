    value: >-
      <p><strong>Race</strong>: Oread<br /><strong>Replaced Trait(s)</strong>:
      Energy Resistance, Languages</p><hr /><p>Many oreads are loners and raise
      their families in isolated groups, either in deep caverns or high
      mountains. They gain a +2 racial bonus on Perception checks and Knowledge
      (dungeoneering) checks, and they can use Knowledge (dungeoneering)
      untrained. They begin play speaking only Terran, rather than Common and
      Terran. This racial trait replaces energy resistance and alters the
      oread's starting languages.</p>
