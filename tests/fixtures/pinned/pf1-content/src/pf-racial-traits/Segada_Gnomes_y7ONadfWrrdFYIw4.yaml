name: Segada Gnomes
system:
  description:
    value: >-
      <p><strong>Race</strong>: Gnome<br /><strong>Replaced Trait(s)</strong>:
      Base Statistics</p><hr /><p>The city of Segada on the continent of Arcadia
      has a substantial gnomish population, which emigrated from the tall peaks
      of the Akrandida Mountains. Known for their creativity and love all forms
      of artistic expression, many of Segada's gnomes make their living as
      entertainers. Even more so than other gnomes, Segada gnomes are fond of
      wearing bright colors, and often wear accessories that make noise as they
      move, such as bells, jangling bracelets, and flute-like reed pendants.
      Most Segada gnomes have the
      @UUID[Compendium.pf-content.pf-racial-traits.Item.MboeefX07pfct1hx]{Darkvision},
      @UUID[Compendium.pf-content.pf-racial-traits.Item.hcagqE7fLh67ZCKZ]{Gift
      of Tongues}, and
      @UUID[Compendium.pf-content.pf-racial-traits.Item.lqFhyqE7frSbHfEA]{Magical
      Linguist} alternate racial traits, as well as the artistic and
      @UUID[Compendium.pf-content.pf-racial-traits.Item.9iLQf70RGSRIPYMK]{Sound
      Mimicry} alternate racial traits.</p>
