  description:
    instructions: >-
      <p><span style="mso-ansi-language:EN-CA">You must modify your natural
      attack(s) to match the parameters specified in this trait, including
      setting damage, reach, etc. manually. These natural attacks may only be
      used when selected during a shape change.</span></p>
    value: >-
      <p><strong>Race</strong>: Skinwalker</p><hr /><p>A skinwalker can change
      shape to a bestial form as a standard action. In bestial form, a
      skinwalker gains a +2 racial bonus to his choice of Strength, Dexterity,
      or Constitution. While in this form, a skinwalker also takes on an
      animalistic feature that provides a special effect. Each time a skinwalker
      assumes bestial form, he can choose to gain one of the following features
      two claw attacks that each deal 1d4 points of damage, darkvision to a
      range of @Distance[60 ft;dual], or a +1 natural armor bonus. These
      benefits last until the skinwalker returns to his humanoid form as a swift
      action. A skinwalker must first return to his humanoid form before
      changing to bestial form again to change benefits.</p><hr /><p><strong>+2
      Strength:</strong> @Toggle[Change Shape (Skinwalker,
      STR)]</p><p><strong>+2 Dexterity:</strong> @Toggle[Change Shape
      (Skinwalker, DEX)]</p><p><strong>+2 Constitution:</strong> @Toggle[Change
      Shape (Skinwalker, CON)]</p><p><strong>Natural Armor:</strong>
      @Toggle[Change Shape (Skinwalker, Natural
      Armor)]</p><p><strong>Darkvision:</strong> @Toggle[Change Shape
      (Skinwalker, Darkvision)]</p>
