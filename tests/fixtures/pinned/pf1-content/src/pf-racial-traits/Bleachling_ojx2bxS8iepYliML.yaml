      @UUID[Compendium.pf-content.pf-racial-traits.Item.LcZE7cPw87DMzJYl]{Obsessive}</p>
    value: >-
      <p><strong>Race</strong>: Gnome<br /><strong>Replaced Trait(s)</strong>:
      Gnome Magic, Obsessive</p><hr /><p>Gnomes who have survived the Bleaching
      are immune to effects of the Bleaching thereafter. These gnomes gain two
      favored classes: druid, and their choice of any other class. They lose all
      spell-like abilities granted by the gnome magic racial trait except
      <em>speak with animals</em>, but they can use their
      <em>@UUID[Compendium.pf1.spells.Item.ct9fhh8uawn8e4md]{speak with
      animals}</em> spell-like ability three times per day. This racial ability
      replaces obsessive and alters gnome magic.</p>
