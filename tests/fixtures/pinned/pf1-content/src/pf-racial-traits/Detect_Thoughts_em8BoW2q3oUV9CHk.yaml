      area: cone-shaped emanation
      description: >-
        <div
        class="description-body"><p>@UUID[Compendium.pf1.spells.Item.xllxylvvqr82o2d5]{Detect
        Thoughts}</p><p>You detect surface thoughts. The amount of information
        revealed depends on how long you study a particular area or
        subject.</p><p><em>1st Round</em>: Presence or absence of thoughts (from
        conscious creatures with Intelligence scores of 1 or
        higher).</p><p><em>2nd Round</em>: Number of thinking minds and the
        Intelligence score of each. If the highest Intelligence is 26 or higher
        (and at least 10 points higher than your own Intelligence score), you
        are stunned for 1 round and the spell ends. This spell does not let you
        determine the location of the thinking minds if you can't see the
        creatures whose thoughts you are detecting.</p><p><em>3rd Round</em>:
        Surface thoughts of any mind in the area. A target's Will save prevents
        you from reading its thoughts, and you must cast <em>detect
        thoughts</em> again to have another chance. Creatures of animal
        intelligence (Int 1 or 2) have simple, instinctual thoughts.</p><p>Each
        round, you can turn to detect thoughts in a new area. The spell can
        penetrate barriers, but @Distance[1 ft;dual] of stone, 1 inch of common
        metal, a thin sheet of lead, or@Distance[3 ft;dual] of wood or dirt
        blocks it.</p></div>
      duration:
        concentration: true
        units: perm
        value: concentration, up to 1 min./level
