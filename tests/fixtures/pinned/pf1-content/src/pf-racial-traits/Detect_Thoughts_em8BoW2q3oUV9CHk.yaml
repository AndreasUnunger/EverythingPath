  description:
    value: >-
      <p><strong>Race</strong>: Green Martian</p><hr /><p>Green Martians possess
      limited telepathy. allowing them to read the surface thoughts at those
      around them. they can use
      <em>@UUID[Compendium.pf1.spells.Item.xllxylvvqr82o2d5]{detect
      thoughts}</em> as a constant spell-like ability. The caster level of the
      spell-like ability is equal to the user's character level.</p>
