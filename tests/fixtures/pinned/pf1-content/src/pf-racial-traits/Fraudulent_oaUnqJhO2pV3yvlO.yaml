  description:
    value: >-
      <p><strong>Race</strong>: Half-Elf<br /><strong>Replaced
      Trait(s)</strong>: Keen Senses</p><hr /><p>To obtain and keep a position
      at court, some half-elves aren't shy about exaggerating or fabricating
      claims to nobility. Half-elves with this racial trait gain a +1 racial
      bonus on Bluff checks, Knowledge (nobility) checks, and Linguistics checks
      to create forgeries. They need to spend only half as much on accessories
      (such as the jewelry required to accessorize a courtier's or noble's
      outfit) to appear suitable in a courtly setting. This racial trait
      replaces keen senses.</p>
