  description:
    instructions: <p>You must manually set Size in the Details tab of the Race.</p>
    value: >-
      <p><strong>Prerequisite</strong>: Humanoids taking this quality must have
      the giant subtype</p><hr /><p>Large creatures gain a +2 size bonus to
      Strength and a –2 size penalty to Dexterity. Large races take a –1 size
      penalty to their AC, a –1 size penalty on attack rolls, a +1 bonus on
      combat maneuver checks and to their CMD, and a –4 size penalty on Stealth
      checks. A Large creature takes up a space that is @Distance[10 ft;dual] by
      @Distance[10 ft;dual] and has a reach of @Distance[5 ft;dual].</p>
