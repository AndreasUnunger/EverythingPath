  description:
    value: >-
      <p><strong>Race</strong>: Half-Elf<br /><strong>Replaced
      Trait(s)</strong>: Keen Senses, Low-Light Vision</p><hr /><p>Rather than
      having bodily and facial features that are a blend of elven and human, or
      tending towards one parent or the other, a rare few half-elves have a
      strange combination of features. They have noticeable mismatched eyes and
      ears, as well as uneven limbs. Half-elves with this trait take a -2
      penalty on Reflex saves but receive a +4 racial bonus on initiative
      checks. This racial trait replaces keen senses and low-light vision.</p>
