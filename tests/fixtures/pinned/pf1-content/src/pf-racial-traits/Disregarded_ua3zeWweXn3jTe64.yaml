  description:
    value: >-
      <p><strong>Race</strong>: Half-Elf<br /><strong>Replaced
      Trait(s)</strong>: Keen Senses</p><hr /><p>Half-elves with this trait
      practice magical techniques to conceal their fey features from casual
      scrutiny. These half-elves treat their caster level as 1 higher when
      casting illusion spells. Half-elves with a Charisma score of 11 or higher
      also gain the following spell-like abilities
      1/day-<em>@UUID[Compendium.pf1.spells.Item.o8ds5jtvf0hf92dw]{guidance}</em>,
      <em>@UUID[Compendium.pf1.spells.Item.4w51afqi5d9t8nl4]{innocence}</em>,
      <em>@UUID[Compendium.pf1.spells.Item.99xovzg8h1nh9o9a]{lullaby}</em>, and
      <em>@UUID[Compendium.pf1.spells.Item.p8lm7khq3ynyif21]{mage hand}</em>.
      The caster level for these effects is equal to the half-elf 's level. The
      DC for these spells is equal to 10 + the spell's level + the half-elf 's
      Charisma modifier. This racial trait replaces keen senses.</p>
  sources:
