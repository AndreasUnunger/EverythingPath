    value: >-
      <p><strong>Race</strong>: Gnome<br /><strong>Replaced Trait(s)</strong>:
      Gnome Magic</p><hr /><p>Gnomes with this racial trait treat their caster
      level as 1 higher for the purposes of divination spells they cast.
      Additionally, if the gnome has a Wisdom or Charisma score of 11 or higher,
      she also gains the ability to cast
      @UUID[Compendium.pf1.spells.Item.pg7dbmuuaksxhp3v]{charm animal} as a
      spell-like ability three times per day. The caster level for this effect
      is equal to the gnome's level, and the DC for these spells is equal to 10
      + the spell's level + the gnome's Charisma modifier.</p><p>This replaces
      gnome magic.</p>
