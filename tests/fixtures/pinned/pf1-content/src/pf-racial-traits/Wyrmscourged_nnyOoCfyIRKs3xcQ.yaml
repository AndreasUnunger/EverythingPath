  description:
    value: >-
      <p><strong>Race</strong>: Dwarf<br /><strong>Replaced Trait(s)</strong>:
      Defensive Training, Hatred, Stonecunning</p><hr /><p>Dwarves with this
      racial trait gain a +1 bonus on attack rolls and a +2 dodge bonus to AC
      and on saving throws against the exceptional, supernatural, and spell-like
      abilities of dragons. They also gain a +2 racial bonus on Knowledge
      (arcana) checks to identify dragons and can make such checks untrained.
      This racial trait replaces defensive training, hatred, and
      stonecunning.</p>
