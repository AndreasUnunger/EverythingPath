      Humanoid} type</p><hr /><p>Members of this race gain the following
      supernatural ability: A member of this race can assume the appearance of a
      single form of a single humanoid race of its size. The form is static and
      cannot be changed each time it takes this form. The creature gains a +10
      racial bonus on Disguise checks made to appear as the member of the race
      whose appearance it assumes. Changing its shape is a standard action. This
      trait otherwise functions as alter self, save that the creature does not
      adjust its ability scores.</p>
