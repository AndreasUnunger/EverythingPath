      <p><strong>Race</strong>: Half-Elf<br /><strong>Replaced
      Trait(s)</strong>: Adaptability</p><hr /><p>Half-elves are skilled at
      charming others and recovering from faux pas. If half-elves with this
      racial trait attempt to change a creature's attitude with a Diplomacy
      check and fail by 5 or more, they can try to influence the creature a
      second time even if 24 hours have not passed. This racial trait replaces
      the adaptability racial trait.</p>
