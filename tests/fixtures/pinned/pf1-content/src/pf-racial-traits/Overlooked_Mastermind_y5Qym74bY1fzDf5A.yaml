  description:
    value: >-
      <p><strong>Race</strong>: Half-Orc<br /><strong>Replaced
      Trait(s)</strong>: Intimidating, Orc Ferocity, Weapon Familiarity</p><hr
      /><p>Some half-orcs use half-orcs' brutish stereotypes to their advantage,
      causing others to underestimate their intelligence and scheming. Such
      half-orcs gain a +2 racial bonus on Bluff, Diplomacy, and Sense Motive
      checks. This bonus increases to +4 against other humanoids. They also
      receive a +2 racial bonus on Bluff checks to feign ignorance and Sense
      Motive checks to intercept secret messages, and this stacks with the above
      bonus. This racial trait replaces intimidating, orc ferocity, and weapon
      familiarity.</p>
