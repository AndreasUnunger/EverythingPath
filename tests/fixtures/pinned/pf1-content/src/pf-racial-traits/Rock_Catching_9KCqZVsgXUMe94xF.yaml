      description: >-
        <p>Once per round, if you would normally be hit by a rock, you can make
        a Reflex saving throw to catch it as a free action. </p><p>The DC is 15
        for a Small rock, 20 for a Medium rock, and 25 for a Large rock (if the
        projectile provides a magical bonus on attack rolls, the DC increases by
        that amount). </p><p>You must be aware of the attack in order to make a
        rock catching attempt.</p>
      name: Catch rock
  description:
    value: >-
      <p><strong>Prerequisite:</strong>
      @UUID[Compendium.pf-content.pf-racial-traits.Item.dhTdr09hDfKJLhiH]{Large}
      size quality</p><hr /><p>Members of this race can catch Small, Medium, or
      Large rocks (or projectiles of similar shape). Once per round, a member of
      this race that would normally be hit by a rock can make a Reflex saving
      throw to catch it as a free action. The DC is 15 for a Small rock, 20 for
      a Medium rock, and 25 for a Large rock (if the projectile provides a
      magical bonus on attack rolls, the DC increases by that amount). The
      member of this race must be aware of the attack in order to make a rock
      catching attempt.</p>
