system:
  description:
    instructions: >-
      <p>Add the bonus for each related spell, class ability, or domain power
      manually.</p>
    value: >-
      <p><strong>Prerequisite:</strong>
      @UUID[Compendium.pf-content.pf-racial-traits.Item.M571aaxrlWRfFqiS]{Outsider
