    value: >-
      <p><strong>Race</strong>: Vine Leshy<br /><strong>Replaced
      Trait(s)</strong>: Change Shape, Verdant Burst</p><hr /><p>Some vine
      leshys can sprout whip-like appendages. These individuals gain proficiency
      with whips and scorpion whips. As a free action, the vine leshy can turn
      one hand into a lashvine. A lashvine is a primary natural attack that
      deals 1d3 points of bludgeoning damage. A lashvine cannot hold items,
      wield weapons, or perform fine manipulation.</p><p> This replaces change
      shape and verdant burst.</p>
