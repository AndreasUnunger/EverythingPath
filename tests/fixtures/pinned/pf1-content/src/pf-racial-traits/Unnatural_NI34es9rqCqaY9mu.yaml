  description:
    value: >-
      <p>Members of this race unnerve normal animals, and train to defend
      themselves against the inevitable attacks from such creatures. Members of
      this race take a –4 penalty on all Charisma-based skill checks to affect
      creatures of the animal type, and receive a +4 dodge bonus to AC against
      animals. Animals’ starting attitude toward members of this race is one
      step worse than normal.</p>
