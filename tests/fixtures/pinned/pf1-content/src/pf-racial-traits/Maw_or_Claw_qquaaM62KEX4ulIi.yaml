    instructions: >-
      <p>Add a
      @UUID[Compendium.pf1.monster-abilities.Item.szjeStouwI3F3WdP]{Bite} attack
      or two @UUID[Compendium.pf1.monster-abilities.Item.MZnbCVzqpvPsMvfT]{Claw}
