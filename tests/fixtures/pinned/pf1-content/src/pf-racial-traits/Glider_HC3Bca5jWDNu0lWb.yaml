name: Glider
system:
  contextNotes:
    - target: skill.acr
      text: >-
        You treat any distance fallen as half the actual distance. You can steer
        while falling, moving horizontally up to a number of feet equal to half
        the vertical distance fallen. You cannot use this trait when you are
        wearing heavy armor,  are carrying a heavy load, or are unable to react
        to the fall (such as being helpless).
  description:
    value: >-
      <p><strong>Race</strong>: Grippli<br /><strong>Replaced Trait(s)</strong>:
      Swamp Stride</p><hr /><p>Gripplis' aerodynamic bodies and thick webbing
      between the toes enable a falling grippli to treat the distance fallen as
      half the actual distance. The grippli can steer himself while falling,
      moving horizontally up to a number of feet equal to half the vertical
      distance fallen. The grippli cannot use this trait if it is wearing heavy
      armor, is carrying a heavy load, or is unable to react to the fall (such
      as being helpless). This racial trait replaces swamp stride.</p>
