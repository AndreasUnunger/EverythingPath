  description:
    value: >-
      <p><strong>Race</strong>: Dwarf<br /><strong>Replaced Trait(s)</strong>:
      Defensive Training, Hardy</p><hr /><p>Drow sometimes augment their slaves
      and frontline warriors by making them toxic, causing their bodies to
      internally produce mawbane poison (see below). The resulting poisonous
      creature makes a potent weapon in the effort to discourage neighboring
      monsters. Any creature that hits such a character with a bite attack is
      immediately exposed to its poison. The save DC for this poison is equal to
      10 + 1/2 the character's Hit Dice + the character's Constitution
      modifier.</p><p><em>Mawbane Poison</em>-ingested; <em>save</em> Fortitude
      as above; <em>frequency</em> 1/round for 4 rounds; <em>effect</em> 1d2
      Constitution damage; <em>cure</em> 1 save.</p><p>Dwarves can take this
      trait in place of defensive training and hardy.</p>
