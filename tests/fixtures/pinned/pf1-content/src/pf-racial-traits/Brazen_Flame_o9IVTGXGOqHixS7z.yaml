  description:
    value: >-
      <p><strong>Race</strong>: Ifrit<br /><strong>Replaced Trait(s)</strong>:
      Energy Resistance, Spell-Like Ability</p><hr /><p>An unusual number of
      ifrits hail from the Brazen Peaks area, home to the remains of Xotani the
      Firebleeder, and their flames infuse their weapons in mortal combat,
      rather than protect them or grant spells. An ifrit with this racial trait
      deals 1 point of fire damage with its melee attacks. This racial trait
      replaces the energy resistance and spell-like ability traits.</p>
