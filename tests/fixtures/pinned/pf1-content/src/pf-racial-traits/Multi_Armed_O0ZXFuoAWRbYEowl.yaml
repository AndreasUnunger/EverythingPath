name: Multi-Armed
system:
  description:
    value: >-
      <p>Members of this race possess three arms. A member of this race can
      wield multiple weapons, but only one hand is its primary hand, and all
      others are off hands. It can also use its hands for other purposes that
      require free hands. Special: This trait can be taken up to twice. When it
      is taken a second time, the race gains a fourth arm.</p>
