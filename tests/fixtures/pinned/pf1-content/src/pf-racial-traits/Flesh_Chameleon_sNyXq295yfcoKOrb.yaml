      <p><strong>Race</strong>: Undine<br /><strong>Replaced Trait(s)</strong>:
      Energy Resistance</p><hr /><p>Some undines can change their coloration to
      match human skin tones. As a standard action, an undine with this racial
      trait can change her natural blue hue to match any normal human skin tone,
      and can revert to normal as a free action. This grants a +4 racial bonus
      on Disguise checks to appear human. This racial trait replaces energy
      resistance.</p>
