  description:
    instructions: <p>You must adjust the relevant class abilities and spells manually</p>
    value: >-
      <p><strong>Race</strong>: Wayang<br /><strong>Replaced Trait(s)</strong>:
      Shadow Magic</p><hr /><p>Wayangs with exceptional ties to their shadowy
      heritage have great skill at manipulating shadows. A wayang with this
      trait treats his caster level as being 1 higher for all level-based
      calculations of illusion spells he casts with the darkness or
      shadow<sup>UM</sup> descriptor, powers of the Darkness domain, bloodline
      powers of the shadow<sup>APG</sup> bloodline, and revelations of the
      oracle's shadow mystery (see page 12). This trait doesn't give wayangs
      early access to level-based powers; it affects their effective level only
      for powers they could already use without this trait. This racial trait
      replaces shadow magic.</p>
