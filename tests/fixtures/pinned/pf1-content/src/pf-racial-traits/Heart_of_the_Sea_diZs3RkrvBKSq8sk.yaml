      Details tab of this trait to reflect Profession (sailor).</p>
    value: >-
      <p><strong>Race</strong>: Human<br /><strong>Replaced Trait(s)</strong>:
      Skilled</p><hr /><p>Humans born near the sea are always drawn to it. They
      gain a +2 racial bonus on Profession (sailor) and Swim checks, and these
      are always class skills for them. They can hold their breath twice as long
      as normal, and spellcasters gain a +4 racial bonus on concentration checks
      when attempting to cast spells underwater. This racial trait replaces
      skilled.</p>
