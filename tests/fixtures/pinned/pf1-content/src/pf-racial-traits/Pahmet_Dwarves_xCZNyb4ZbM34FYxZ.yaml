name: Pahmet Dwarves
system:
  description:
    value: >-
      <p><strong>Race</strong>: Dwarf<br /><strong>Replaced Trait(s)</strong>:
      Base Statistics</p><hr /><p>The Pahmet have been present in Osirion since
      ancient days and claim to have been sent by the gods to warn the pharaohs
      of impending crises and disasters. Though most scholars suspect that claim
      is more legend than history, the ancient pharaohs of Osirion treated the
      Pahmet with great reverence. In return, the Pahmet guard Erekrus, a
      necropolis in the mountains of southern Osirion, where the Pahmet interred
      the bodies of pharaohs deemed particularly worthy. The Pahmet are a rigid
      and often mistrusting people; it is common for its members who avoid
      contact with outsiders to have the
      @UUID[Compendium.pf-content.pf-racial-traits.Item.3z3EDcQxrBgW8hIu]{Xenophobic}
      alternate racial trait. Many Pahmet have the
      @UUID[Compendium.pf-content.pf-racial-traits.Item.wG1e906wkQGlk3eE]{Lorekeeper},
      @UUID[Compendium.pf-content.pf-racial-traits.Item.T7dJVz4m8zpUQERB]{Mountaineer},
      @UUID[Compendium.pf-content.pf-racial-traits.Item.CbUmX1PZrxABz6ob]{Rock
      Stepper}, and
      @UUID[Compendium.pf-content.pf-racial-traits.Item.6d96mOZtn3WCCN1A]{Surface
      Survivalist} alternate racial traits. Those who come from long lines of
      keepers who dedicate themselves to the guarding of tombs also often have
      the
      @UUID[Compendium.pf-content.pf-racial-traits.Item.rkFSqqFnqfXUWjNv]{Death's
      End} alternate racial trait described below.</p>
