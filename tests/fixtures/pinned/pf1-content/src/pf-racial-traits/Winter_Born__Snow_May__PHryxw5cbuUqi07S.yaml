    value: >-
      <p><strong>Race</strong>: Changeling<br /><strong>Replaced
      Trait(s)</strong>: Base Statistics</p><hr /><p>Playful and easily amused,
      snow mays are lighthearted but terribly creative once their anger is
      roused. Little phases these capricious women for long, and their casual
      cruelty can easily melt back to kindness.</p><p><b>Ancestry</b> Winter
      hag<br /><b>Typical Alignment</b> CN<br /><b>Ability Modifiers</b> +2 Int,
      +2 Cha, -2 Con<br /><b>Hag Racial Trait</b> Winter-born changelings gain a
      +5 racial bonus on Acrobatics and Climb checks on icy or slippery
      surfaces.<br /><b>Awakened Hag Heritage</b> You gain cold resistance equal
      to your character level and are no longer affected by severe cold or
      extreme cold.</p>
