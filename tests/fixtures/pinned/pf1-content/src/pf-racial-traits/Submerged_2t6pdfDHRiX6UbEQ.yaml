    value: >-
      <p><strong>Race</strong>: Gillman<br /><strong>Replaced Trait(s)</strong>:
      Water Dependent</p><hr /><p>Gillmen who live in deep water are accustomed
      to the gloom of the depths. Though these gillmen can venture onto land,
      they are uncomfortable doing so and must return to the ocean sooner than
      other gillmen. Gillmen with this racial trait gain low-light vision but
      must submerge themselves in water every 12 hours or die within 2d4 hours.
      This modifies their water dependent racial trait.</p>
