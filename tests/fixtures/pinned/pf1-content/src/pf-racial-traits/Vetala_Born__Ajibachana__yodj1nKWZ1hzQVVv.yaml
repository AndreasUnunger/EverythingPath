    value: >-
      <p><strong>Race</strong>: Dhampir<br /><strong>Replaced Trait(s)</strong>:
      Base Statistics</p><hr /><p>With skin like faded brass, ajibachanas reveal
      their undead taint through their unnatural agility and childlike trains of
      thought.</p><p><strong>Ancestry </strong>Vetala<br /><strong>Ability
      Modifiers </strong>+2 Dex, +2 Int, -2 Wis<br /><strong>Alternate Skill
      Modifiers </strong>Escape Artist, Use Magic Device<br /><strong>Alternate
      Spell-Like Ability </strong>Ajibachanas gain
      @UUID[Compendium.pf1.spells.Item.jcs7ba5depdyitey]{Comprehend
      Languages}<em> </em>as a spell-like ability.<br /><strong>Alternate
      Weakness </strong>Ajibachanas take a -1 penalty to their caster level
      whenever they are in an area affected by
      <em>@UUID[Compendium.pf1.spells.Item.zpav8ywcqwkcuojw]{consecrate}</em>,
      <em>@UUID[Compendium.pf1.spells.Item.vxmp5prgw5fj4h6f]{hallow}</em>, or a
      similar spell that makes an area holy.</p>
