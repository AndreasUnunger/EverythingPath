      description: >-
        <p></p><p>@UUID[Compendium.pf1.spells.Item.0d756xyqhinsstas]{Pyrotechnics}</p><p><em>Pyrotechnics</em>
        turns a fire into a burst of blinding fireworks or a thick cloud of
        choking smoke, depending on your choice. The spell uses one fire source,
        which is immediately extinguished. A fire so large that it exceeds a
        @Distance[20 ft;dual] cube is only partly extinguished. Magical fires
        are not extinguished, although a fire-based creature used as a source
        takes 1 point of damage per caster level.</p><p><em>Fireworks:</em> The
        fireworks are a flashing, fiery, momentary burst of glowing, colored
        aerial lights. This effect causes creatures within @Distance[120
        ft;dual] of the fire source to become blinded for 1d4+1 rounds (Will
        negates). These creatures must have line of sight to the fire to be
        affected. Spell resistance can prevent blindness.</p>
      duration:
        units: round
        value: '[[1d4+1]]'
      name: Pyrotechnics-Fireworks
      notes:
        effect:
          - '@Condition[bllinded] for [[1d4+1]] Rounds'
      range:
        units: long
        value: '@attributes.hd.total * 40 + 400'
      save:
        dc: 10 + 2 + @abilities.cha.mod
        description: negates
        type: will
      target:
        value: creatures within 120 feet of the fire source
    - _id: 7Q3wA89sibSLMUq3
