        <p>@UUID[Compendium.pf1.spells.Item.0d756xyqhinsstas]{Pyrotechnics}</p><p><em>Pyrotechnics</em>
        turns a fire into a burst of blinding fireworks or a thick cloud of
        choking smoke, depending on your choice. The spell uses one fire source,
        which is immediately extinguished. A fire so large that it exceeds a
        @Distance[20 ft;dual] cube is only partly extinguished. Magical fires
        are not extinguished, although a fire-based creature used as a source
        takes 1 point of damage per caster level.</p><p><em>Smoke Cloud</em>: A
        stream of smoke billows out from the fire, forming a choking cloud that
        spreads @Distance[20 ft;dual] in all directions and lasts for 1 round
        per caster level. All sight, even darkvision, is ineffective in or
        through the cloud. All within the cloud take -4 penalties to Strength
        and Dexterity (Fortitude negates). These effects last for 1d4+1 rounds
        after the cloud dissipates or after the creature leaves the area of the
        cloud. Spell resistance does not apply.</p>
