  description:
    value: >-
      <p><strong>Race</strong>: Wayang<br /><strong>Replaced Trait(s)</strong>:
      Light and Dark, Shadow Resistance</p><hr /><p>Some wayangs retain an
      uncommonly powerful connection to the Plane of Shadow. A wayang with this
      racial trait counts as an outsider (native) and a humanoid (wayang) for
      any effect related to race, including feat prerequisites and spells that
      affect humanoids. In addition, attacks made against such a wayang in dim
      light have a 50% miss chance instead of the normal 20% miss chance. This
      ability doesn't grant total concealment; it only increases the miss
      chance. This racial trait replaces light and dark and shadow
      resistance.</p>
