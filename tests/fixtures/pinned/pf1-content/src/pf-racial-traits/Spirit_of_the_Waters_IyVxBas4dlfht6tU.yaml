  description:
    value: >-
      <p><strong>Race</strong>: Elf<br /><strong>Replaced Trait(s)</strong>:
      Elven Magic, Weapon Familiarity</p><hr /><p>Some elves have adapted to
      life in tune with the sea or along the reedy depths of wild rivers and
      lakes. They gain a +4 racial bonus on Swim checks, can always take 10
      while swimming, and may choose Aquan as a bonus language. They are
      proficient with longspear, trident, and net. This racial trait replaces
      elven magic and weapon familiarity racial traits.</p>
