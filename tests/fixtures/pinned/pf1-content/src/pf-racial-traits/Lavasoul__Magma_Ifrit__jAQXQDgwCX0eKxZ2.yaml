name: Lavasoul (Magma Ifrit)
system:
  description:
    value: >-
      <p><strong>Race</strong>: Ifrit<br /><strong>Replaced Trait(s)</strong>:
      Base Statistics</p><hr /><p>Like the primal fires of creation, lavasoul
      ifrits are both fluid and fixed, alternating between stability and violent
      alteration.</p><p><strong>Typical Alignment</strong> CN <br
      /><strong>Ability Modifiers</strong> +2 Con, +2 Int, -2 Dex <br
      /><strong>Alternate Spell-Like Ability</strong> Lavasouls gain
      @UUID[Compendium.pf1.spells.Item.wltdd4jmqepdy0qj]{burning sands} as a
      spell-like ability. <br /><strong>Magma Affinity</strong> This racial
      trait functions as and can be replaced as the base ifrit's fire affinity,
      except it benefits sorcerers with the efreeti bloodline and spellcasters
      with the Ash subdomain.</p><p>Mutable and intense, lavasouls evoke the
      cycle of creation and destruction in their colorful lives, unafraid to
      pursue new paradigms when the old ones no longer suit them. Many are
      dark-skinned but riven with blazing lines, which are sometimes also
      reflected in bright hair or eye colors. They tend to embrace body
      modification, acquiring and discarding tattoos and piercings as they feel
      appropriate.</p><p>Lavasouls can be found in places where seismic change
      is commonplace and destructive creation is not seen as a contradiction;
      they excel in the fast-paced markets of Katapesh and the constant flux of
      Galt.</p>
