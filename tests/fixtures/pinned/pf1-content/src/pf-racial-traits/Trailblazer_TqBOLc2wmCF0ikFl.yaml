name: Trailblazer
system:
  description:
    value: >-
      <p><strong>Race</strong>: Human<br /><strong>Replaced Trait(s)</strong>:
      Base Statistics</p><hr /><p>Adaptive and inventive, these humans must have
      quick wits and a dose of heroic luck to survive in the lands they settle.
      Replace the skilled racial trait with
      @UUID[Compendium.pf-content.pf-racial-traits.Item.naQ5kacMK4kyrhfW]{heart
      of the wilderness} and the bonus feat racial trait with
      @UUID[Compendium.pf-content.pf-racial-traits.Item.iEAy4KMqEtQnvLHZ]{heroic}.</p><p>At
      the GM's discretion, you can swap out the heart of the wilderness racial
      trait for either
      @UUID[Compendium.pf-content.pf-racial-traits.Item.GBfKld1Iw8C2wtli]{heart
      of the mountains},
      @UUID[Compendium.pf-content.pf-racial-traits.Item.diZs3RkrvBKSq8sk]{heart
      of the sea},
      @UUID[Compendium.pf-content.pf-racial-traits.Item.g9H3WgBwfJUfaU4m]{heart
      of the snows}, or
      @UUID[Compendium.pf-content.pf-racial-traits.Item.DsH7y38wfWDPCINE]{heart
      of the sun}, depending on the type of terrain these humans are
      settling.</p>
