    value: >-
      <p><strong>Race</strong>: Strix<br /><strong>Replaced Trait(s)</strong>:
      Normal Speed</p><hr /><p>The flight of wing-clipped strix is weaker than
      normal, whether from deformity or injury. Their fly speed is @Distance[20
      ft;dual] (poor) instead of the normal fly speed, and they must make a DC
      30 Fly check to fly upward. Ostracized by their tribes and forced to deal
      with other races, these strix compensate for their weakness by gaining a
      +2 racial bonus on Bluff, Climb, and Diplomacy checks.</p>
