    value: >-
      <p><strong>Race</strong>: Elf<br /><strong>Replaced Trait(s)</strong>:
      Elven Immunities, Elven Magic</p><hr /><p>Some elves are born with
      sensitive souls that absorb insight from others and from the spirits of
      the deceased. These elves gain a +2 racial bonus on saving throws against
      fear effects. They also choose two Knowledge skills and always treat those
      skills as class skills. If they take a class that grants either or both of
      those skills as class skills, they gain a +1 racial bonus on the
      overlapping skill or skills. This racial trait replaces elven immunities
      and elven magic.</p>
