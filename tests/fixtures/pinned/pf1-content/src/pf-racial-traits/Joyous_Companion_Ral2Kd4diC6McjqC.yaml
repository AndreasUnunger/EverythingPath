  description:
    value: >-
      <p><strong>Race</strong>: Halfling<br /><strong>Replaced
      Trait(s)</strong>: Fearless, Weapon Familiarity</p><hr /><p>Halflings
      enjoy the companionship of copper dragons and other lighthearted
      representatives of dragonkind and learn to share the joyousness of that
      bond with others. When halflings with this trait cast spells or use
      spell-like abilities of the abjuration school or with the
      emotion<sup>UM</sup> descriptor, they can confer a +1 morale bonus on
      saves versus fear on all adjacent allies for a number of rounds equal to
      the spell's level. This trait replaces fearless and weapon
      familiarity.</p><p><strong>Related buff: </strong>@Toggle[Joyous
      Companion]</p>
