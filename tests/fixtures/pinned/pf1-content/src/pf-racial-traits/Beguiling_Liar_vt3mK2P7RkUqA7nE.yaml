      <p><strong>Race</strong>: Tiefling<br /><strong>Replaced
      Trait(s)</strong>: Skilled</p><hr /><p>Many tieflings find that the best
      way to get along in the world is to tell others what they want to hear.
      These tieflings' practice of telling habitual falsehoods grants them a +4
      racial bonus on Bluff checks to convince an opponent that what they are
      saying is true when they tell a lie. This racial trait replaces
      skilled.</p>
