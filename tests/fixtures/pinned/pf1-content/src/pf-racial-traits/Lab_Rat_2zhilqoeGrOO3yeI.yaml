  description:
    value: >-
      <p><strong>Race</strong>: Ratfolk<br /><strong>Replaced Trait(s)</strong>:
      Tinker</p><hr /><p>For every ingenious ratfolk inventor, there is another
      who must inevitably test the invention. Those who survive enough
      experiments sometimes develop strange metabolic quirks that grant them
      heightened resilience and, on occasion, fortunate side effects when
      consuming alchemical or magical draughts. As a result, they gain a +1
      racial bonus on saving throws against poison, alchemical weapons, and
      harmful effects from drinking potions or elixirs. In addition, once per
      day such a ratfolk can either increase the caster level of a potion he
      consumes by 1 or double the duration of an alchemical remedy he consumes
      or applies to himself (to a maximum of 4 hours). This racial trait
      replaces tinker.</p>
