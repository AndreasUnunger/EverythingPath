  description:
    value: >-
      <p>Members of this race receive a +2 bonus on Perception checks to notice
      unusual stonework, such as traps and hidden doors located in stone walls
      or floors. They receive a check to notice such features whenever they pass
      within @Distance[10 ft;dual] of them, whether or not they are actively
      looking.</p>
