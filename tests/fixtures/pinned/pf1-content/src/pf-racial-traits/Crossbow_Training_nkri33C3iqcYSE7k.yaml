  description:
    value: >-
      <p><strong>Race</strong>: Elf<br /><strong>Replaced Trait(s)</strong>:
      Weapon Familiarity</p><hr /><p>Mordant Spire elves train with weapons that
      can be used underwater. An elf with this trait can reload a light crossbow
      as a free action and a heavy crossbow as a move action, provided that she
      is proficient with the weapon. If she selects the
      @UUID[Compendium.pf1.feats.Item.11ClnanF4PdEPd9g]{Rapid Reload} feat for a
      heavy crossbow, she can reload the weapon as a free action. This racial
      trait replaces weapon familiarity.</p><p></p>
