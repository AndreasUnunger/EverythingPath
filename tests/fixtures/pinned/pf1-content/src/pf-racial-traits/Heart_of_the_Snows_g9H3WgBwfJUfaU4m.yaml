  description:
    value: >-
      <p><strong>Race</strong>: Human<br /><strong>Replaced Trait(s)</strong>:
      Skilled</p><hr /><p>Humans born in chilly climes treat cold climates as
      one category less severe. They gain a +2 racial bonus on Fortitude saving
      throws against the effects of cold climates, on any check or saving throw
      to avoid slipping and falling, and to CMD against trip combat maneuvers.
      This bonus applies on Acrobatics and Climb checks made in slippery
      conditions. This racial trait replaces skilled.</p>
