name: 'Experimental Body: Enchanted'
system:
  description:
    instructions: >-
      <p>You must manually add a +2 to the "Spell Slot Ability Bonus" field on
      the spellbook setup screen for any spellcasting class whose primary
      ability is intelligence. </p>
    value: >-
      <p><strong>Race</strong>: Wyrwood<br /><strong>Replaced Trait(s)</strong>:
      Darkvision; Low-Light Vision</p><hr /><p>Some wyrwoods have been built
      from rare materials in an effort to imbue them with special properties.
      Choose one of the following abilities.</p><p><em>Blessed</em>: These
      wyrwoods contain divine relics. Wyrwoods with this trait can use
      @UUID[Compendium.pf1.spells.Item.21bxbzdaawjrnvyo]{Divine Favor} once per
      day as a spell-like ability with a caster level equal to their Hit
      Dice.</p><p><em>Enchanted</em>: Crafted from the remnants of broken
      staves, wands and other items, these wyrwoods have a natural attunement to
      the arcane. Wyrwoods with this trait treat their Intelligence score as 2
      higher for the purpose of determining bonus spells or extracts per
      day.</p><p><em>Fey-Touched</em>: These wyrwoods have components that
      create a powerful link to the First World. Wyrwoods with this trait can
      use @UUID[Compendium.pf1.spells.Item.pg7dbmuuaksxhp3v]{Charm animal} once
      per day as a spell-like ability with a caster level equal to their Hit
      Dice.</p><p><em>Scorched</em>: These wyrwoods are built from the ruins of
      cities and structures destroyed by conflict. Once per day, after a
      successful melee attack against an enemy, wyrwoods with this trait can
      deal an additional number of points of damage equal to their Wisdom
      modifier as a free action.</p><p>This replaces darkvision and low-light
      vision.</p>
