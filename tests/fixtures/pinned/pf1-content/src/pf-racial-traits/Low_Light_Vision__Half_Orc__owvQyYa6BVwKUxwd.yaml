      <p><strong>Race</strong>: Half-Orc<br /><strong>Replaced
      Trait(s)</strong>: Darkvision</p><hr /><p>Many feyborn have low-light
      vision. Races that normally have darkvision (such as dwarves and
      half-orcs) can take low-light vision in place of darkvision. In the case
