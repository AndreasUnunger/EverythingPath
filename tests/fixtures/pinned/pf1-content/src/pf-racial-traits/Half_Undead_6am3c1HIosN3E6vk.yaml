  description:
    value: >-
      <p>Half-undead races are strange or unholy fusions of the living and the
      undead. Players interested in playing a half-undead race might also
      consider the dhampir, the progeny of a vampire and a human. A half-undead
      race has the following features.</p><ul><li><p>Half-undead have the
      darkvision @Distance[60 ft;dual] racial trait.</p></li><li><p>Half-undead
      gain a +2 racial bonus on saving throws against disease and mind-affecting
      effects.</p></li><li><p>Half-undead take no penalties from energy-draining
      effects, though they can still be killed if they accrue more negative
      levels than they have Hit Dice. After 24 hours, any negative levels
      they’ve gained are removed without any additional saving
      throws.</p></li><li><p>Half-undead creatures are harmed by positive energy
      and healed by negative energy. A half-undead creature with the fast
      healing special quality still benefits from that quality.</p></li></ul>
