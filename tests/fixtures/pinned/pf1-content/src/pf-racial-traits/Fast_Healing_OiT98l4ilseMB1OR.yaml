  description:
    value: >-
      <p><strong>Special</strong>: This trait can be taken multiple times. Each
      time fast healing is taken, its cost increases by 1 RP.</p><hr
      /><p>Members of this race regain 1 hit point each round. Except for where
      noted here, fast healing is just like natural healing. Fast healing does
      not restore hit points lost from starvation, thirst, or suffocation, nor
      does it allow a creature to regrow lost body parts. Fast healing continues
      to function (even at negative hit points) until a member of this race
      dies, at which point the effects of fast healing immediately end.</p>
