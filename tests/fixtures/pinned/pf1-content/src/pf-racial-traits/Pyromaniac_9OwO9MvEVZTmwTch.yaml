img: icons/svg/book.svg
name: Pyromaniac
system:
  abilityType: sp
  actions:
    - _id: KJ671LunxrbQ9BPN
      activation:
        type: standard
        unchained:
          cost: 2
          type: action
      area: 10' radius area
      description: >-
        <p>Members of this race with Charisma scores of 11 or higher also gain
        the following spell-like abilities:
        1/day-@UUID[Compendium.pf1.spells.Item.zymaptg3vmnvfvxl]{dancing
        lights}, @UUID[Compendium.pf1.spells.Item.eg67vvykmv9c6j7h]{flare},
        @UUID[Compendium.pf1.spells.Item.a6isom7wx0nmhwfp]{prestidigitation},
        @UUID[Compendium.pf1.spells.Item.1b6irvf27vdt5c1l]{produce flame}. The
        caster level for these effects is equal to the user's level; the DCs are
        Charisma-based.</p>
      duration:
        units: minute
        value: '1'
      name: Dancing Lights
      notes:
        effect:
          - >-
            Depending on the version selected, you create up to four lights that
            resemble lanterns or torches (and cast that amount of light), or up
            to four glowing spheres of light (which look like will-o'-wisps), or
            one faintly glowing, vaguely humanoid shape. The dancing lights must
            stay within a 10-foot-radius area in relation to each other but
            otherwise move as you desire (no concentration required): forward or
            back, up or down, straight or turning corners, or the like. The
            lights can move up to 100 feet per round. A light winks out if the
            distance between you and it exceeds the spell's range.  You can only
            have one dancing lights spell active at any one time. If you cast
            this spell while another casting is still in effect, the previous
            casting is dispelled. If you make this spell permanent, it does not
            count against this limit.  Dancing lights can be made permanent with
            a permanency spell.
      range:
        units: ft
        value: '@attributes.hd.total * 10 +100'
      uses:
        self:
          maxFormula: gte(@abilities.cha.total, 11)
          per: day
          value: 1
    - _id: rHhkd5P7K03822AC
      activation:
        type: standard
        unchained:
          cost: 2
          type: action
      description: >-
        <p>Members of this race with Charisma scores of 11 or higher also gain
        the following spell-like abilities:
        1/day-@UUID[Compendium.pf1.spells.Item.zymaptg3vmnvfvxl]{dancing
        lights}, @UUID[Compendium.pf1.spells.Item.eg67vvykmv9c6j7h]{flare},
        @UUID[Compendium.pf1.spells.Item.a6isom7wx0nmhwfp]{prestidigitation},
        @UUID[Compendium.pf1.spells.Item.1b6irvf27vdt5c1l]{produce flame}. The
        caster level for these effects is equal to the user's level; the DCs are
        Charisma-based.</p>
      duration:
        units: inst
      name: Flare
      notes:
        effect:
          - >-
            This cantrip creates a burst of light. If you cause the light to
            burst in front of a single creature, that creature is dazzled for 1
            minute unless it makes a successful Fortitude save. Sightless
            creatures, as well as creatures already dazzled, are not affected by
            flare.
      range:
        units: ft
        value: floor(@attributes.hd.total / 2) * 5 + 25
      save:
        dc: '@abilities.cha.mod + 10'
        description: Negates
        type: fort
      uses:
        self:
          maxFormula: gte(@abilities.cha.total, 11)
          per: day
          value: 1
    - _id: I3azpGIAEZhddYHu
      activation:
        type: standard
        unchained:
          cost: 2
          type: action
      description: >-
        <p>Members of this race with Charisma scores of 11 or higher also gain
        the following spell-like abilities:
        1/day-@UUID[Compendium.pf1.spells.Item.zymaptg3vmnvfvxl]{dancing
        lights}, @UUID[Compendium.pf1.spells.Item.eg67vvykmv9c6j7h]{flare},
        @UUID[Compendium.pf1.spells.Item.a6isom7wx0nmhwfp]{prestidigitation},
        @UUID[Compendium.pf1.spells.Item.1b6irvf27vdt5c1l]{produce flame}. The
        caster level for these effects is equal to the user's level; the DCs are
        Charisma-based.</p>
      duration:
        units: hour
        value: '1'
      name: Prestidigitation
      notes:
        effect:
          - >-
            Prestidigitations are minor tricks that novice spellcasters use for
            practice. Once cast, a prestidigitation spell enables you to perform
            simple magical effects for 1 hour. The effects are minor and have
            severe limitations. A prestidigitation can slowly lift 1 pound of
            material. It can color, clean, or soil items in a 1-foot cube each
            round. It can chill, warm, or flavor 1 pound of nonliving material.
            It cannot deal damage or affect the concentration of spellcasters.
            Prestidigitation can create small objects, but they look crude and
            artificial. The materials created by a prestidigitation spell are
            extremely fragile, and they cannot be used as tools, weapons, or
            spell components. Finally, prestidigitation lacks the power to
            duplicate any other spell effects. Any actual change to an object
            (beyond just moving, cleaning, or soiling it) persists only 1 hour.
      range:
        units: ft
        value: '10'
      target:
        value: see text
      uses:
        self:
          maxFormula: gte(@abilities.cha.total, 11)
          per: day
          value: 1
    - _id: U4mi7gbcKMEdVhgQ
      activation:
        type: standard
        unchained:
          cost: 2
          type: action
      damage:
        parts:
          - formula: 1d6 + min(5, @attributes.hd.total)
            types:
              - fire
      description: >-
        <p>Members of this race with Charisma scores of 11 or higher also gain
        the following spell-like abilities:
        1/day-@UUID[Compendium.pf1.spells.Item.zymaptg3vmnvfvxl]{dancing
        lights}, @UUID[Compendium.pf1.spells.Item.eg67vvykmv9c6j7h]{flare},
        @UUID[Compendium.pf1.spells.Item.a6isom7wx0nmhwfp]{prestidigitation},
        @UUID[Compendium.pf1.spells.Item.1b6irvf27vdt5c1l]{produce flame}. The
        caster level for these effects is equal to the user's level; the DCs are
        Charisma-based.</p>
      duration:
        units: minute
        value: '@attributes.hd.total'
      name: Produce Flame
      notes:
        effect:
          - >-
            Flames as bright as a torch appear in your open hand. The flames
            harm neither you nor your equipment.  In addition to providing
            illumination, the flames can be hurled or used to touch enemies. You
            can strike an opponent with a melee touch attack, dealing fire
            damage equal to 1d6 + 1 point per caster level (maximum +5).
            Alternatively, you can hurl the flames up to 120 feet as a thrown
            weapon. When doing so, you attack with a ranged touch attack (with
            no range penalty) and deal the same damage as with the melee attack.
            No sooner do you hurl the flames than a new set appears in your
            hand. Each attack you make reduces the remaining duration by 1
            minute. If an attack reduces the remaining duration to 0 minutes or
            less, the spell ends after the attack resolves.  This spell does not
            function underwater.
      range:
        units: ft
        value: '120'
      uses:
        self:
          maxFormula: gte(@abilities.cha.total, 11)
          per: day
          value: 1
  contextNotes:
    - target: cl
      text: >-
        You are treated as one level higher when casting spells with the fire
        descriptor.
    - target: spellEffect
      text: >-
        You are treated as one level higher when casting spells with the fire
        descriptor.
  description:
    instructions: >-
      <p>You must modify to account for the level adjustment to any relevant
      bloodline, domain power or bombs manually.</p>
    value: >-
      <p>Members of this race are treated as +1 level higher when casting spells
      with the fire descriptor, using granted powers of the Fire domain, using
      bloodline powers of the fire elemental bloodline, using the revelations of
      the oracle’s flame mystery, and determining the damage of alchemist bombs
      that deal fire damage. This trait does not give members of this race early
      access to level-based powers; it only affects powers that they could
      already use without this trait. If a member of this race has a Charisma
      score of 11 or higher, it also gains the following spell-like abilities:
      1/day-<em>@UUID[Compendium.pf1.spells.Item.zymaptg3vmnvfvxl]{dancing
      lights}</em>,
      <em>@UUID[Compendium.pf1.spells.Item.eg67vvykmv9c6j7h]{flare}</em>,
      <em>@UUID[Compendium.pf1.spells.Item.a6isom7wx0nmhwfp]{prestidigitation}</em>,
      <em>@UUID[Compendium.pf1.spells.Item.1b6irvf27vdt5c1l]{produce
      flame}</em>.  The caster level for these spell-like abilities is equal to
      the user’s character level.</p>
  racePoints: 3
  showInQuickbar: true
