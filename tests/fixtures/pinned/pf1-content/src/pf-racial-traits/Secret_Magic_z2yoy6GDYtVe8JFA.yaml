    - _id: 4UEwTxAOStPBALtV
      activation:
        type: standard
        unchained:
          cost: 2
          type: action
      description: >-
        <p>@UUID[Compendium.pf1.spells.Item.ct9fhh8uawn8e4md]{Speak with
        Animals}</p><p>You can ask questions of and receive answers from
        animals, but the spell doesn't make them any more friendly than normal.
        Wary and cunning animals are likely to be terse and evasive, while the
        more stupid ones make inane comments. If an animal is friendly toward
        you, it may do some favor or service for you.</p>
      duration:
        units: minute
        value: '@attributes.hd.total'
      img: icons/creatures/fish/fish-shark-swimming.webp
      name: Speak with Animals (Aquatic only)
      range:
        units: personal
      target:
        value: you
      uses:
        self:
          maxFormula: gte(@abilities.cha.total, 13) * 1440
          per: day
    - _id: FPScv1tFEjLl8Sea
      actionType: rcman
      activation:
        type: standard
        unchained:
          cost: 2
          type: action
      attackBonus: >-
        max(@abilities.int.mod, @abilities.wis.mod, @abilities.cha.mod)[Best
        Ability bonus]
      attackName: Bull Rush
      bab: '@attributes.hd.total'
      description: >-
        <p>@UUID[Compendium.pf1.spells.Item.ohy0ty2dawfaaqwd]{Hydraulic
        Push}</p><p>You call forth a quick blast of water that knocks over and
        soaks one creature or square. You can use this blast of water to make a
        bull rush against any one creature or object. Your CMB for this bull
        rush is equal to your caster level plus your Intelligence, Wisdom, or
        Charisma modifier, whichever is highest. This bull rush does not provoke
        an attack of opportunity. <em>Hydraulic push</em> extinguishes any
        normal fires on a creature, object, or in a single @Distance[5 ft;dual]
        square which it is targeted against. Magical fires are unaffected.</p>
      duration:
        units: inst
      img: icons/magic/water/barrier-ice-wall-snow.webp
      name: Hydraulic Push
      range:
        units: close
        value: 25 + (floor(@attributes.hd.total / 2) * 5)
      target:
        value: one creature or object
      uses:
        self:
          maxFormula: gte(@abilities.cha.total, 13)
          per: day
          value: 1
    - _id: WdXNsRihJl9vgfer
      activation:
        type: standard
        unchained:
          cost: 2
          type: action
      description: >-
        <p>You transform the target's fins, flippers, or tail into legs and
        feet, allowing it to walk on land. The target loses its swim speed but
        gains a base speed appropriate for a humanoid of its size (speed
        @Distance[30 ft;dual] if a Medium or larger creature, speed @Distance[20
        ft;dual] if Small). If the creature is immersed in water for 1 round,
        the transformation reverts, allowing it to swim normally. One round
        after leaving the water, the transformation occurs again, allowing it to
        walk. This spell only works on merfolk, tritons, seals, fish, and other
        creatures whose bodies or limbs are used mainly for swimming and are not
        suitable for walking. It does not give the target the ability to breathe
        air.</p>
      duration:
        dismiss: true
        units: hour
        value: '@attributes.hd.total'
      img: icons/equipment/leg/pants-breeches-leather-brown.webp
      name: Fins to Feet (Self Only)
      range:
        units: personal
      target:
        value: Self
      uses:
        self:
          maxFormula: gte(@abilities.cha.total, 13)
          per: day
          value: 1
