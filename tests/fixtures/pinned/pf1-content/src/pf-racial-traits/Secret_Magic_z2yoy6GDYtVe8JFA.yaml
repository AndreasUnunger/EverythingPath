  description:
    instructions: >-
      <p>Remove
      @UUID[Compendium.pf-content.pf-racial-traits.Item.8pL6ADeKtZt2FTum]{Armor
      (Merfolk)} and
      @UUID[Compendium.pf-content.pf-racial-traits.Item.hoHML8zQt0Qib7lN]{Slow
      Speed (Merfolk)}</p>
    value: >-
      <p><strong>Race</strong>: Merfolk<br /><strong>Replaced Trait(s)</strong>:
      Armor, Speed</p><hr /><p>Merfolk sometimes manifest magical powers they
      are unwilling to explain to nonmerfolk, leading scholars to speculate that
      the magic originates from the merfolk's rumored eldritch patrons. Such
      merfolk have only a 40-foot swim speed, but they add +1 to the DC of any
      enchantment spells they cast, and if they have a Charisma score of 13 or
      higher, they gain the ability to cast the following spell-like
      abilities:</p><ul><li><p>At will -
      @UUID[Compendium.pf1.spells.Item.ct9fhh8uawn8e4md]{Speak with Animals}
      (aquatic animals only);</p></li><li><p>1/day -
      @UUID[Compendium.pf1.spells.Item.743rtkqu21azdhah]{Fins to Feet} (self
      only),
      @UUID[Compendium.pf1.spells.Item.ohy0ty2dawfaaqwd].</p></li></ul><p>This
      racial trait replaces the armor racial trait and alters the merfolk's
      movement speed.</p>
