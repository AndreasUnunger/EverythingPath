name: Jininese Elves
system:
  description:
    value: >-
      <p><strong>Race</strong>: Elf<br /><strong>Replaced Trait(s)</strong>:
      Base Statistics</p><hr /><p>The elves of Jinin are descended from those
      who traveled underground millennia ago to escape Earthfall. Led by the
      oracle Jininsiel and guided by a vast, treelike vein of mithral, these
      elves emerged in Tian Xia, where they founded the nation of Jinin.
      Jininese elves have adopted many of the customs of their human and
      samsaran neighbors-Jinin's culture places great emphasis on artistic
      pursuits, especially those involving mithral, which serves as a national
      symbol, lucrative export, and treasured cultural relic for Jininese elves.
      The elves of Jinin are far less isolationist than many other elven
      cultures, freely permitting outsiders into Jinin; likewise, while most
      Jininese elves remain there, many travel or settle across the Dragon
      Empires and beyond.</p><p>Jininese elves frequently have the
      @UUID[Compendium.pf-content.pf-racial-traits.Item.PoeOzomLE0yQZG39]{Dreamspeaker}
      and
      @UUID[Compendium.pf-content.pf-racial-traits.Item.i3JDTzYghUAVE4a2]{Envoy}
      alternate racial traits, as well as the
      @UUID[Compendium.pf-content.pf-racial-traits.Item.MtFsqvoTAnmxR7Du]{Jininese
      Weapon Mastery} alternate racial trait described below.</p>
