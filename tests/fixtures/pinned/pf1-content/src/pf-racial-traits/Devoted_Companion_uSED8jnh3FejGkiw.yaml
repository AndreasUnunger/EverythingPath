  description:
    value: >-
      <p><strong>Race</strong>: Elf<br /><strong>Replaced Trait(s)</strong>:
      Elven Magic, Weapon Familiarity</p><hr /><p>While some Forlorn quickly
      become inured to the loss and tragedy all too common in their lives, some
      refuse to let go, fighting passionately when companions are endangered.
      Elves with this alternate racial trait gain a +1 racial bonus on attack
      rolls and caster level checks while adjacent to an ally who has been
      reduced to fewer than half her maximum hit points.</p><p> This replaces
      elven magic and weapon familiarity.</p>
