  description:
    instructions: >-
      <p>Replace only the  trait
      @UUID[Compendium.pf-content.pf-racial-traits.Item.iulHWSMNp9TABDDU]{Spell-Like
      Abilities (Fetchling - Shadow Walk)}</p>
    value: >-
      <p><strong>Race</strong>: Fetchling<br /><strong>Replaced
      Trait(s)</strong>: Spell-Like Abilities</p><hr /><p>Some fetchlings can
      manipulate shadowy energy in order to displace their location instead of
      transporting between shadows. Upon reaching 9th level, instead of gaining
      <em>shadow walk </em>as a spell-like ability, these fetchlings gain
      @UUID[Compendium.pf1.spells.Item.r190q9zxmei82lmv]{Displacement} as a
      spell-like ability usable twice per day. For this ability, a fetchling's
      caster level is equal to his total Hit Dice. This racial trait modifies
      the spell-like ability racial trait.</p>
