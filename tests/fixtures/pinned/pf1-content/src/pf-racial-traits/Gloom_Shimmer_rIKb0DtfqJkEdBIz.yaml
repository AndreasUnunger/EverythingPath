      description: >-
        <p>@UUID[Compendium.pf1.spells.Item.r190q9zxmei82lmv]{Displacement}</p><p>The
        subject of this spell appears to be about @Distance[2 ft;dual] away from
        its true location. The creature benefits from a 50% miss chance as if it
        had total concealment. Unlike actual total concealment,
        <em>displacement</em> does not prevent enemies from targeting the
        creature normally. <em>True seeing</em> reveals its true location and
        negates the miss chance.</p>
      duration:
