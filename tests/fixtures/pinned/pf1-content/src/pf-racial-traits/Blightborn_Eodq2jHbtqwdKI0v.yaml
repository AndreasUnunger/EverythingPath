  description:
    value: >-
      <p><strong>Race</strong>: Elf<br /><strong>Replaced Trait(s)</strong>:
      Elven Immunities</p><hr /><p>Elves from cursed lands and domains of evil
      develop resistance to foul influences. They gain a +2 racial bonus on
      saving throws against necromancy spells and spell-like abilities and
      spells and spell-like abilities with the curse descriptor, as well as on
      saving throws to remove temporary negative levels. This racial trait
      replaces elven immunities.</p>
