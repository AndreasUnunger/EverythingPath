    instructions: >-
      <p>Select one (1) ethnic language related to your heritage when you take
      this trait.</p><p>Update the Granted Proficiencies&gt;Languages section of
      the details tab of this trait to reflect this choice.</p>
    value: >-
      <p><strong>Race</strong>: Human</p><hr /><p>Humans begin play speaking
      Common and their ethnic language. Humans whose ethnic language is Common
      (or Taldane, in the case of Chelaxians or Taldans) do not receive an
      additional ethnic language. Humans with high Intelligence scores can
      choose any languages they want (except secret languages, such as
      Druidic).</p>
