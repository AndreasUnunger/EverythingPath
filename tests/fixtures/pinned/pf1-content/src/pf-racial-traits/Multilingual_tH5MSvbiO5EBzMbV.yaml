    value: >-
      <p><strong>Race</strong>: Kitsune<br /><strong>Replaced Trait(s)</strong>:
      Agile, Languages</p><hr /><p>Although most kitsune speak only Common, some
      quickly learn other human languages in order to give themselves an edge
      when dealing with humanity. They speak Common, <span data-tooltip="ancient
      language of the spirits of Tian Xia, and spoken most frequently by the
      kami of the Forest of Spirits">Senzar</span>, and the racial language of
      their human form's ethnicity, and they can learn any language they want
      (except Druidic and other secret languages) if they have high Intelligence
      scores. This racial trait replaces agile as well as a kitsune's normal
      languages.</p>
