name: Slapping Tail
system:
  description:
    instructions: >-
      <p>You must modify your natural attack to match the parameters specified
      in this trait, including setting damage, reach, etc. manually.</p>
    value: >-
      <p>Members of this race have a tail they can use to make attacks of
      opportunity with a reach of @Distance[5 ft;dual]. The tail is a natural
      attack that deals 1d6 points of damage plus the user’s Strength modifier
      if Small, 1d8 points of damage plus the user’s Strength modifier if
      Medium, or 1d10 points of damage plus 1-1/2 times the user’s Strength
      modifier if Large. Special: If a Large creature has the reach trait, its
      tail also gains reach.</p>
