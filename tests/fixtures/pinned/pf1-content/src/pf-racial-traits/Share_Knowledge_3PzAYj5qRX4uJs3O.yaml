  description:
    instructions: >-
      <p>Remove
      @UUID[Compendium.pf-content.pf-racial-traits.Item.WfhMYITrAYcmBj7a]{Aphorite
      Resistances}.  Add the electricity resistance 5 that trait normally
      provides to your actor manually.</p>
    value: >-
      <p><strong>Race</strong>: Aphorite<br /><strong>Replaced
      Trait(s)</strong>: Aphorite Resistances</p><hr /><p>Certain aphorites have
      a sliver of their creators' ability to combine their collective intellect
      and solve problems they could not solve on their own. When an aphorite
      with this racial trait successfully uses the aid another action to aid a
      character on a Knowledge check the aphorite is trained in, the character
      receives a +4 bonus instead of the normal +2 bonus. As a result of this
      increased openness, aphorites with this racial trait don't receive a +2
      bonus on saves against mind-affecting effects. This racial trait modifies
      aphorite resistances.</p>
