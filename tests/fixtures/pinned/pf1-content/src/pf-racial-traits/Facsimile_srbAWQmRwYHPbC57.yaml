    value: >-
      <p><strong>Race</strong>: Shabti<br /><strong>Replaced Trait(s)</strong>:
      Immune to Undeath, Native Subtype</p><hr /><p>A few shabti are made with
      such skill they are nearly perfect copies of a mortal. Shabti with this
      racial trait appear to be human, save perhaps for minor features like
      unusual skin color. They count as humanoid (human) as well as outsider
      (native) for all purposes (such as humanoid-affecting spells like
      <em>charm person</em>).</p><p>This racial trait replaces immune to undeath
      and alters the native subtype.</p>
