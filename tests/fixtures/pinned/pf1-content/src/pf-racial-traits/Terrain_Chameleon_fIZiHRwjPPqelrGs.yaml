    value: >-
      <p><strong>Race</strong>: Undine<br /><strong>Replaced Trait(s)</strong>:
      Energy Resistance</p><hr /><p>Some undines can change their coloration to
      blend in with underwater terrain, mixing browns, grays, and greens to
      resemble kelp or other natural water plants. As a standard action, an
      undine with this racial trait can change her coloration, gaining a +4
      bonus on Stealth checks in underwater environments. She can return to
      normal as a free action. This racial trait replaces energy resistance.</p>
