    value: >-
      <p><strong>Prerequisite:</strong>
      @UUID[Compendium.pf-content.pf-racial-traits.Item.M571aaxrlWRfFqiS]{Outsider
      (Native)} with ties to the Plane of Air or
      @UUID[Compendium.pf-content.pf-racial-traits.Item.nb7WkJkqL3bnhkU5]{Fey}
      type</p><hr /><p>Members of this race are surrounded by swirling winds,
      gaining a +2 racial bonus to AC against nonmagical ranged attacks. They
      can calm or renew these winds as a swift action. Once per day, a member of
      this race can channel this wind into a single gust, making a bull rush or
      trip combat maneuver attempt against one creature within @Distance[30
      ft;dual]. Doing so exhausts the user’s breeze-kissed ability for 24 hours.
      This is a supernatural ability.</p>
