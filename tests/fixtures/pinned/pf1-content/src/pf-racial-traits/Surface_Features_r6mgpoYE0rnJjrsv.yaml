  description:
    value: >-
      <p><strong>Race</strong>: Aquatic Elf<br /><strong>Replaced
      Trait(s)</strong>: Keen Senses</p><hr /><p>Some aquatic elves appear
      almost indistinguishable from surface elves. Their coloring, height, and
      weight all suggest those of a surface elf, and the webbing between their
      digits is almost transparent. Aquatic elves with this racial trait gain a
      +4 bonus on Bluff and Disguise checks when attempting to pass themselves
      off as surface elves. This racial trait replaces keen senses.</p>
