  description:
    value: >-
      <p><strong>Race</strong>: Aasimar<br /><strong>Replaced Trait(s)</strong>:
      Celestial Resistance, Skilled</p><hr /><p>Some aasimars follow their
      destiny to war against the powers of ultimate evil. These individuals gain
      a +1 insight bonus on attack rolls and to AC against evil outsiders and a
      +2 racial bonus on Knowledge (planes) and Spellcraft checks to identify
      evil outsiders or items or effects created by evil outsiders; they may use
      these skills untrained for this purpose. This racial trait replaces
      celestial resistance and skilled.</p>
