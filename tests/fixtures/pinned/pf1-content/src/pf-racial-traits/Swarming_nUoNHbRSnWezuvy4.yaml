name: Swarming
system:
  contextNotes:
    - target: attack
      text: >-
        Up to two members of your race can share the same square at the same
        time. If they then attack the same foe, they are considered to be
        flanking that foe as if they were in two opposite squares.
  description:
    value: >-
      <p><strong>Prerequisite:</strong>
      @UUID[Compendium.pf-content.pf-racial-traits.Item.luTbBy7qnmgPBslD]{Medium}
      or smaller size</p><p><strong>Special</strong>: If the race is Small or
      smaller, this trait costs 1 RP. If the race is Medium, it costs 2
      RP.</p><hr /><p>Members of this race are used to living and fighting
      communally with other members of their race. Up to two members of this
      race can share the same square at the same time. If two members of this
      race that are occupying the same square attack the same foe, they are
      considered to be flanking that foe as if they were in two opposite
      squares.</p>
