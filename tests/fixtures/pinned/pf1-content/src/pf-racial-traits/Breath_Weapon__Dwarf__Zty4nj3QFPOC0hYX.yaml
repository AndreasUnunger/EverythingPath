  description:
    instructions: >-
      <p>Delete the non-selected template type attack and edit the remaining one
      to use only the damage type selected.</p>
    value: >-
      <p><strong>Race</strong>: Dwarf<br /><strong>Replaced Trait(s)</strong>:
      Greed, Hatred, Stonecunning, Weapon Familiarity</p><hr /><p>Dwarves with
      this racial trait can call upon the spirit of a sacred dragon to channel a
      fraction of that dragon's power. Upon taking this trait, the dwarf must
      select cold, electricity, or fire as the breath weapon's damage type and
      either a @Distance[15 ft;dual] cone or a @Distance[20 ft;dual] line as the
      breath weapon's shape. Once these selections are made, they cannot be
      changed. Once per day, the dwarf can make a supernatural breath attack in
      the selected shape, dealing 1d4 points of damage of the chosen damage
      type, plus 1d4 points of damage of that type for every 2 levels above 1st
      the dwarf has (to a maximum of 5d4 at 9th level). Targets in the area can
      attempt a Reflex save (DC = 10 + half the dwarf 's level + the dwarf 's
      Constitution bonus) for half damage.</p><p>This replaces greed, hatred,
      stonecunning, and weapon familiarity.</p>
