  description:
    value: >-
      <p><strong>Race</strong>: Cecaelia<br /><strong>Replaced
      Trait(s)</strong>: Ink Cloud</p><hr /><p>Occasionally a cecaelia is born
      with unusually long and agile tentacles. These tentacles allow the
      cecaelia to sense a greater area and to hold small items. A cecaelias with
      this racial trait increases the range of her tentacle sense to
      @Distance[30 ft;dual]. In addition, a cecaelia with this racial trait can
      attempt Sleight of Hand checks with her tentacles rather than her hands
      but with a -4 penalty. This racial trait replaces ink cloud.</p>
