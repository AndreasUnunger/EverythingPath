name: Sunsoul (Solar Ifrit)
system:
  description:
    value: >-
      <p><strong>Race</strong>: Ifrit<br /><strong>Replaced Trait(s)</strong>:
      Base Statistics</p><hr /><p>Strong in character and in body, sunsoul
      ifrits are incurably optimistic agents of positive
      change.</p><p><strong>Typical Alignment</strong> LG <br /><strong>Ability
      Modifiers</strong> +2 Str, +2 Cha, -2 Wis <br /><strong>Alternate
      Spell-Like Ability</strong> Sunsouls gain
      @UUID[Compendium.pf1.spells.Item.3qpvx0evlgk4bfda]{sun metal} as a
      spell-like ability.<br /><strong>Solar Affinity</strong> This racial trait
      functions as and can be replaced as the base ifrit's fire affinity, except
      it benefits sorcerers with the celestial bloodline and spellcasters with
      the Sun domain.</p><p>With fire comes light, and the brightness of the
      sunsouls comes both from their affinity for positive energy and their own
      luminous attitudes. Where others despair, they labor on, striving to lead
      by example. Strong leaders and passionate ethos attract sunsouls, drawing
      them toward powerful religions or crusading nations such as Mendev. They
      can also be found in places where darkness is settling in; both Taldor and
      Ustalav have their share of sunsouls working to return these nations to
      the light.</p><p>Sunsouls cannot easily hide their presence, and most
      would never try. Most sunsouls tend to have fair hair, often nearly white,
      and eyes that glow with a twinkle all their own. Some seem to glow from
      within, as if lit from inside by an inner sunlight. Unafraid to be seen,
      they dress in whatever styles please them, even when it means they stand
      out among populations either more daring or more conservative.</p>
