name: Gemsoul (Crystal Oread)
system:
  description:
    value: >-
      <p><strong>Race</strong>: Oread<br /><strong>Replaced Trait(s)</strong>:
      Base Statistics</p><hr /><p>With scintillating personalities to match
      their captivating appearances, gemsoul oreads command attention-and prefer
      it that way.</p><p><strong>Typical Alignment</strong> N <br
      /><strong>Ability Modifiers</strong> +2 Str, +2 Cha, -2 Wis <br
      /><strong>Alternate Spell-Like Ability</strong> Gemsouls gain
      @UUID[Compendium.pf1.spells.Item.qcjskol4ac3eemhy]{color spray} as a
      spell-like ability. <br /><strong>Crystal Affinity</strong> This racial
      trait functions as and can be replaced as the base oread's earth affinity,
      except it benefits sorcerers with the deep earth bloodline and
      spellcasters with the Charm domain.</p><p>Gemsouls tend to have large egos
      and are flashy in their relationships. They gravitate towards artistic
      pursuits, most frequently of a performative nature, though they also have
      a strong tradition of symmetric poetry. Gemsouls prefer to make their
      homes in flamboyant societies or places where they can make meaningful
      personal contributions, as well as in nations that appreciate cultivated
      beauty, like Kyonin.</p><p>Gemsouls typically have dazzling, faceted skin,
      along with a cluster of crystalline formations instead of hair and
      pupil-less eyes of vivid colors. Some favor tattoos in complex, branching
      geometric shapes, and they can frequently be seen wearing silks or
      brightly dyed linen to contrast their complexions.</p>
