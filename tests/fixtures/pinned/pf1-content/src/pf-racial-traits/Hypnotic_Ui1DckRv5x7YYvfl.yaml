  description:
    value: >-
      <p>Members of this race add +1 to the DC for all saving throws against
      spells or effects they cast that inflict the fascinated condition. Once
      per day, when a creature rolls a saving throw against such an effect from
      a member of this race, the member of the race can force that creature to
      reroll the saving throw and use the second result, even if it is
      worse.</p>
