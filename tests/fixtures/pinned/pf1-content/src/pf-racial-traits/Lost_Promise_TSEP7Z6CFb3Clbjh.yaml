    value: >-
      <p><strong>Race</strong>: Aasimar<br /><strong>Replaced Trait(s)</strong>:
      Spell-Like Ability</p><hr /><p>While many view aasimars' beauty and
      celestial powers as a gift, in some communities an aasimar might be
      persecuted for being different and fall into darkness. The forces of evil
      delight in such a perversion of their celestial counterparts' gifts. As
      long as the aasimar retains an evil alignment, she gains the
      @UUID[Compendium.pf-content.pf-racial-traits.Item.qquaaM62KEX4ulIi]{Maw or
      Claw} tiefling alternate racial trait (<em>Pathfinder RPG Advanced Race
      Guide</em> 169). This racial trait replaces the spell-like ability racial
      trait.</p>
