  description:
    value: >-
      <p><strong>Race</strong>: Dwarf<br /><strong>Replaced Trait(s)</strong>:
      Defensive Training</p><hr /><p>Dwarves with this racial trait grew up
      facing the abominations that live deep beneath the surface. They receive a
      +2 dodge bonus to AC against monsters of the aberration type and a +2
      racial bonus to their CMB on attempts made to grapple such creatures (or
      to continue a grapple). This racial trait replaces the defensive training
      racial trait.</p>
