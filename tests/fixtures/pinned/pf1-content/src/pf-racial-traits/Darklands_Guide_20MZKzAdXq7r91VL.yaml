      <p><strong>Race</strong>: Drow<br /><strong>Replaced Trait(s)</strong>:
      Keen Senses</p><hr /><p>Those who brave the lightless tunnels below
      Golarion's surface learn to identify the dangerous phenomena that
      characterize the Darklands. Characters with this trait gain a +2 bonus on
      initiative checks, and on saves against traps and hazards when underground
      (from a lifetime of dodging accursed pools, cave-ins, and green
      slime).</p><p>Drow can take this trait in place of keen senses. </p>
