  description:
    value: >-
      <p><strong>Race</strong>: Drow<br /><strong>Replaced Trait(s)</strong>:
      Spell Resistance</p><hr /><p>Some drow offer themselves to dark patrons,
      particularly demon lords. Drow with this racial trait apply their spell
      resistance only against spells with the good or healing descriptor or
      against spells cast by a divine spellcaster who worships a good-aligned
      deity. Anytime a drow with this racial trait casts a spell with the evil
      descriptor, the DC to resist the spell's effects increases by 2. This
      modifies the
      @UUID[Compendium.pf-content.pf-racial-traits.Item.NlrWvpPCsJMVC7Qp]{Spell
      Resistance (Drow)} racial trait.</p>
