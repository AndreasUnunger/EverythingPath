  description:
    instructions: >-
      <p>Select one Perform skill when you take this trait. Update the Skills
      tab of your Actor to add the chosen skill. Update the untargeted Change on
      the Changes tab of this trait to reflect your choice.</p>
    value: >-
      <p><strong>Race</strong>: Halfling<br /><strong>Replaced
      Trait(s)</strong>: Keen Senses, Sure-Footed</p><hr /><p>Halflings often
      survive at the whims of larger, more aggressive races. Because of this,
      they go out of their way to make themselves more useful, or at least
      entertaining, to larger folk. Halflings with this racial trait gain a +2
      bonus on skill checks for a single Perform skill of their choice, and
      Perform is always a class skill for them. They also gain a +2 bonus on
      Craft and Profession checks. This racial trait replaces keen senses and
      sure-footed.</p>
