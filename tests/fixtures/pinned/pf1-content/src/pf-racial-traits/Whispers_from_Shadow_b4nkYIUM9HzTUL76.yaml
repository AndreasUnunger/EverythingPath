      <p><strong>Race</strong>: Fetchling<br /><strong>Replaced
      Trait(s)</strong>: Skilled</p><hr /><p>Fetchlings from Absalom are known
      for wheeling and dealing from the city's shadows. A fetchling with this
      racial trait gains a +4 racial bonus on Bluff checks when he tells a lie
      and wants to convince an opponent that what he is saying is true. This
      racial trait replaces the skilled racial trait.</p>
