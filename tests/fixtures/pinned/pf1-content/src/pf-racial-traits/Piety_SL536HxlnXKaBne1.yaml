  description:
    value: >-
      <p><strong>Race</strong>: Human<br /><strong>Replaced Trait(s)</strong>:
      Bonus Feat</p><hr /><p>Humans place great trust in the gods to protect
      them. Humans with this trait receive a +2 racial bonus on Knowledge
      (religion) checks and Knowledge (religion) is always a class skill for
      them. In addition, once per day before attempting an attack roll, saving
      throw, ability check, or skill check, such a human can call out to his
      deity in order to receive a +2 racial bonus on that roll; he can use this
      ability only if he is able to speak. This racial trait replaces the bonus
      feat racial trait.</p>
