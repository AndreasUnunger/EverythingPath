  description:
    value: >-
      <p><strong>Race</strong>: Elf<br /><strong>Replaced Trait(s)</strong>:
      Keen Senses</p><hr /><p>Elves who live in cities for more than a century
      can grow to know the ebb and flow of social situations just as their
      forest-dwelling cousins know the rules of the wild. Elves with this racial
      trait gain a +2 racial bonus on Diplomacy checks made to gather
      information and Sense Motive checks made to get a hunch about a social
      situation. This racial trait replaces keen senses.</p>
