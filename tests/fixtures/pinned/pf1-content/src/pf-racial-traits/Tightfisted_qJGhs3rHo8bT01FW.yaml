name: Tightfisted
system:
  contextNotes:
    - target: cmd
      text: +[[4]] Racial bonus vs. steal and disarm
    - target: skill.slt
      text: >-
        +[[2]] Racial bonus to notice any attempt to steal from you using
        sleight of hand; if you notice, this triggers an aoo if you are not
        flat-footed or if you have combat reflexes.
  description:
    value: >-
      <p><strong>Race</strong>: Dwarf<br /><strong>Replaced Trait(s)</strong>:
      Stability, Stonecunning</p><hr /><p>Dwarves with this racial trait gain a
      +4 racial bonus to their CMD against disarm and steal combat maneuvers and
      a +2 racial bonus on Perception checks to notice Sleight of Hand attempts.
      If a dwarf with this trait notices a Sleight of Hand attempt to steal from
      him and the dwarf is not flat-footed or has Combat Reflexes, the attempt
      triggers an attack of opportunity from that dwarf. This racial trait
      replaces stability and stonecunning.</p>
