  contextNotes:
    - target: skill.clm
      text: >-
        You retain your Dexterity bonus to Armor Class (if any) while climbing
        and opponents get no special bonus to their attacks against you.
  description:
    value: >-
      <p><strong>Prerequisite:</strong>
      @UUID[Compendium.pf-content.pf-racial-traits.Item.Hlouei1c7jB5cV99]{Climb}
      racial trait</p><hr /><p>Members of this race can cling to cave walls and
      even ceilings as long as the surface has hand- and footholds. In effect,
      members of this race are treated as being constantly under the effects of
      a nonmagical @UUID[Compendium.pf1.spells.Item.3mfmhx8avu7h3iom]{spider
      climb} spell, save that members of this race cannot cling to smooth
      surfaces. This trait doubles the normal +8 racial bonus on Climb checks
      normally granted to creatures with a climb speed (to a total +16
      bonus).</p>
