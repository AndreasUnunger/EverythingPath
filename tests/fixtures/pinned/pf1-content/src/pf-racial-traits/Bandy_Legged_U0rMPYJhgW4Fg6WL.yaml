      <p><strong>Race</strong>: Hobgoblin<br /><strong>Replaced
      Trait(s)</strong>: Normal Speed</p><hr /><p>Bandy-legged hobgoblins have
      an even more exaggerated stature than other hobgoblins, with bowed legs
      and massive shoulders. Hobgoblins with this racial trait gain a +2 racial
