  description:
    value: >-
      <p><strong>Race</strong>: Aasimar<br /><strong>Replaced Trait(s)</strong>:
      Skilled, Spell-Like Ability</p><hr /><p>Aasimars with this racial trait
      defy the powers of death. They gain a +2 bonus on Knowledge (history)
      checks and saving throws against death effects and can use <em>lesser
      @UUID[Compendium.pf1.buffs.Item.8MI2BpO4ewblrCvp]{age resistance}
      </em>once per day as a spell-like ability. This racial trait replaces the
      skilled and spell-like ability racial traits.</p>
