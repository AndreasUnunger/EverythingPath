    - target: skill.crf
      text: +[[2]] bonus to Craft (alchemy) when crafting poisons.
  description:
    value: >-
      <p><strong>Race</strong>: Gnome<br /><strong>Replaced Trait(s)</strong>:
      Illusion Resistance, Obsessive</p><hr /><p>Some gnomes have an instinctive
      understanding of poisons and their uses. Gnomes gain a +2 racial bonus on
      Fortitude saves against poison and a +2 bonus on Craft (alchemy) checks to
      make poison. The bonus on Fortitude saving throws against poisons
      increases to +4 if the gnome accidentally poisons himself when applying or
      readying the substance. This racial trait replaces illusion resistance and
      obsessive.</p>
