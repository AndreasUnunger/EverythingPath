  description:
    value: >-
      <p><strong>Race</strong>: Ratfolk<br /><strong>Replaced Trait(s)</strong>:
      Swarming</p><hr /><p>Ratfolk can fight viciously when cut off from friends
      and allies. Whenever a ratfolk with this racial trait is reduced to half
      or fewer of his hit points, and has no conscious ally within <a
      class="pf1-info" data-dual="true" data-tooltip-class="pf1"
      data-tooltip="30">30 ft (9 m)</a>, he gains a +2 racial bonus on melee
      attack rolls and to Armor Class. This racial trait replaces swarming.</p>
