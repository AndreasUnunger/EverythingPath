      <p><strong>Race</strong>: Ratfolk<br /><strong>Replaced Trait(s)</strong>:
      Tinker</p><hr /><p>Some ratfolk can blend easily into their environments,
      and move with surprising grace. Ratfolk gain a +2 racial bonus on Stealth
