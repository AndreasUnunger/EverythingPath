system:
  contextNotes:
    - target: allSavingThrows
      text: You have energy resistance 5 {chosen type]
  description:
    instructions: >-
      <p>You must add the chosen energy resistance 5 to your actor manually and
      update the context note of this trait accordingly</p>
    value: >-
      <p><strong>Prerequisite:</strong>
      @UUID[Compendium.pf-content.pf-racial-traits.Item.M7iCedGNTrldJq5R]{Dragon}
      with ties to a dragon type that grants energy resistance or
      @UUID[Compendium.pf-content.pf-racial-traits.Item.M571aaxrlWRfFqiS]{Outsider
      (Native)} with ties to an elemental plane</p><hr /><p>Pick one of the
      following energy types that corresponds to the dragon type or plane the
      race has ties to: acid (earth), cold (water), electricity (air), or fire
      (fire). Members of this race have resistance 5 to the corresponding energy
      type. Special: This trait can be taken more than once. Each time it is
      taken, select an additional energy type that corresponds to another dragon
      type or elemental plane the race has ties to.</p>
