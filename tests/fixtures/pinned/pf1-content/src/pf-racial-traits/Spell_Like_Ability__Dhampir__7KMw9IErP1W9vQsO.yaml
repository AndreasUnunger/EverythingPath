      description: >-
        <p></p><p>@UUID[Compendium.pf1.spells.Item.aa0w7tk852iqn3ni]{Detect
        Undead}</p><p>1st Round: Presence or absence of undead auras.</p><p>2nd
        Round: Number of undead auras in the area and the strength of the
        strongest undead aura present. If you are of good alignment, and the
        strongest undead aura's strength is overwhelming (see below), and the
        creature has HD of at least twice your character level, you are stunned
        for 1 round and the spell ends.</p><p>3rd Round: The strength and
        location of each undead aura. If an aura is outside your line of sight,
        then you discern its direction but not its exact location.</p><p>Aura
        Strength: The strength of an undead aura is determined by the HD of the
        undead creature, as given on the table below.</p><p>Lingering Aura: An
        undead aura lingers after its original source is destroyed. If detect
        undead is cast and directed at such a location, the spell indicates an
        aura strength of dim (even weaker than a faint aura). How long the aura
        lingers at this dim level depends on its original power, as given on the
        table below.</p>
      duration:
        concentration: true
        units: minute
        value: '@attributes.hd.total'
