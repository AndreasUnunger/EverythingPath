  description:
    value: >-
      <p><strong>Race</strong>: Dhampir</p><hr /><p>A dhampir can use <em>detect
      undead</em> three times per day as a spell-like ability (with a caster
      level equal to the dhampir's character level). Dhampirs of specific
      heritages (see below) gain other spell-like abilities in place of
      <em>detect undead</em>.</p>
