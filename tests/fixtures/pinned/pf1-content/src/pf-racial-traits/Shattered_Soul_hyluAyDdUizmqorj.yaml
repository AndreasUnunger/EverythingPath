name: Shattered Soul
system:
  abilityType: ex
  contextNotes:
    - target: allSavingThrows
      text: >-
        for you to be raised or resurrected the caster must succeed at a caster
        level check whose DC is equal to [[10 + @attributes.hd.total]]. If it
        fails, the spell fails and the caster can't return the you to life for
        the next 24 hours (though the caster can try again after this period).
  description:
    value: >-
      <p><strong>Race</strong>: Shabti</p><hr /><p>Shabti who are killed are
      exceptionally difficult to return to life. Anyone who attempts to return a
      shabti to life using
      @UUID[Compendium.pf1.spells.Item.c5anior2ysy6s2xy]{Raise Dead},
      @UUID[Compendium.pf1.spells.Item.thh46ghi51lrl3cl]{Resurrection}, or a
      similar spell must succeed at a caster level check whose DC is equal to 10
      + the shabti's Hit Dice. If it fails, the spell fails and the caster can't
      return the shabti to life for the next 24 hours (though the caster can try
      again after this period).</p>
