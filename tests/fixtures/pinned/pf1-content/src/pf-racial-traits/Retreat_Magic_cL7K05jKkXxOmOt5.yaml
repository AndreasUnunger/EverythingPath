  description:
    value: >-
      <p><strong>Race</strong>: Elf<br /><strong>Replaced Trait(s)</strong>:
      Elven Magic</p><hr /><p>Elves raised in the traditions of those who
      protected elven holdings before, during, and shortly after Earthfall
      specialize in magic that fools foes into misjudging elven numbers and
      locations. These elves gain a +1 racial bonus to their caster levels for
      the purpose of determining the range and duration of all conjuration and
      illusion spells that they cast. This racial trait replaces elven
      magic.</p>
