  description:
    instructions: >-
      <p>Select one humanoid race without the human subtype when you select this
      racial trait. Update the Granted Proficiencies&gt;Languages section of the
      details tab of this trait to reflect this choice's
      languages.</p><p><strong>Special Note: </strong>There are three versions
      of this trait, the other two versions are linked here for reference
      @UUID[Compendium.pf-content.pf-racial-traits.Item.VySd3q4uEVwTS4i2]{Adoptive
      Parentage (Weapon Familiarity)}
      @UUID[Compendium.pf-content.pf-racial-traits.Item.3o1rw23ElDPjD5FE]{Adoptive
      Parentage (Skill Focus)}</p><p>This version assumes you selected an
      adoptive race that does not have a "weapon familiarity" racial trait and
      you wish instead to take the
      @UUID[Compendium.pf1.feats.Item.n250dFlbykAIAg5Z]{Weapon focus} Feat
      option. This feat must updated once you have selected a racially
      appropriate weapon type.</p>
    value: >-
      <p><strong>Race</strong>: Human</p><p><strong>Replaced</strong>
      <strong>Trait(s)</strong>: Bonus Feat</p><hr /><p>Humans are sometimes
      orphaned and adopted by other races. Choose one humanoid race without the
      human subtype. You start play with that race's languages and gain that
      race's weapon familiarity racial trait (if any). If the race does not have
      weapon familiarity, you gain either Skill Focus or Weapon Focus as a bonus
      feat that is appropriate for that race instead. This racial trait replaces
      the bonus feat trait.</p>
