name: Seasoned
system:
  contextNotes:
    - target: fort
      text: >-
        Summerborn can exist comfortably in conditions between 90 and 110
        degrees Fahrenheit without having to attempt Fortitude saves due to the
        environment. Triaxians have to attempt Fortitude saves only once per
        hour instead of once every 10 minutes.
    - target: fort
      text: >-
        Winterborn can exist comfortably in conditions between 40 and 0 degrees
        Fahrenheit without having to attempt Fortitude saves. 

        When in conditions of severe cold or heat, Triaxians have to attempt
        Fortitude saves only once per hour instead of once every 10 minutes.
  description:
    instructions: >-
      <p>Select Summerborn or Winterborn when creating your character.  You can
      remove the context note on the details tab of this trait that applies to
      the other type.</p>
    value: >-
      <p><strong>Race</strong>: Triaxian</p><hr /><p>Depending on whether they
      are Summerborn or Winterborn, Triaxians suffer no harm from hot or cold
      environments. Summerborn Triaxians can exist comfortably in conditions
      between 90 and 140 degrees Fahrenheit without having to attempt Fortitude
      saves. Winterborn Triaxians can exist comfortably in conditions between 40
      and -20 degrees Fahrenheit without having to attempt Fortitude saves. When
      in conditions of severe cold or heat, Triaxians have to attempt Fortitude
      saves only once per hour instead of once every 10 minutes. Transitional
      Triaxians do not have this ability.</p>
