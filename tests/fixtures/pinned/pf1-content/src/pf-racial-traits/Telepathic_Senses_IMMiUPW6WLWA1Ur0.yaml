  description:
    value: >-
      <p><strong>Race</strong>: Astomoi</p><hr /><p>Astomoi can't speak or see,
      but can mentally sense the area within @Distance[60 ft;dual], as per
      darkvision, and can speak telepathically. An astomoi can't see anything
      beyond @Distance[60 ft;dual]. An astomoi must provide thought components
