name: Stubborn
system:
  contextNotes:
    - target: will
      text: >-
        +[[2]] Racial bonus vs spells and spell-like abilities of enchantment
        (charm or compulsion) schools: receives another save after 1 round vs.
        such effects if they are ongoing.
  description:
    value: >-
      <p>Members of this race gain a +2 racial bonus on Will saving throws to
      resist spells and spell-like abilities of the enchantment (charm) and
      enchantment (compulsion) subschools. In addition, if a member of this race
      fails such a save, it receives another save 1 round later to prematurely
      end the effect (assuming the spell or spell-like ability has a duration
      greater than 1 round). This second save is made at the same DC as the
      first. If the member of the race has a similar ability from another source
      (such as a rogue’s slippery mind class feature), it can only use one of
      these abilities per round, but can try the other on the second round if
      the first reroll ability fails.</p>
