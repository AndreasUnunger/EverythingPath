  description:
    value: >-
      <p><strong>Race</strong>: Human<br /><strong>Replaced Trait(s)</strong>:
      Bonus Feat</p><hr /><p>Some humans build nations that deny the importance
      of gods and divine magic, and those raised to avoid divine influence
      (mostly people of Bachuan, Druma, Rahadoum, or Touvette) develop a knack
      for defying divine magic. They gain a +2 racial bonus on saving throws
      against divine spells and spell-like abilities, as well as the spells and
      spell-like abilities of aeons, psychopomps, and outsiders with an
      alignment subtype. This racial trait replaces the bonus feat trait.</p>
