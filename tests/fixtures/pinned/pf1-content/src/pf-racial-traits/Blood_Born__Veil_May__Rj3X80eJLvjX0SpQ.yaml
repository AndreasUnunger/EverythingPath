      Modifiers</b> +2 Wis, +2 Cha, -2 Int<br /><b>Hag Racial Trait</b> The DCs
      of Sense Motive checks to gain a hunch about a blood-born changeling
      increase by 5.<br /><b>Awakened Hag Heritage</b>  You gain a +2 racial
      bonus on Bluff, Diplomacy, and Sense Motive skill checks as your gifts for
      reading and manipulating others matures.</p>
