name: Energy Strike (Acid)
system:
  abilityType: su
  actions:
    - _id: NmRijzw4UhOcVQbj
      activation:
        type: swift
        unchained:
          type: action
      description: >-
        <p>Once per day as a swift action, a suli can shroud her arms in acid.
        This effect lasts for 1 round per level and can be dismissed as a free
        action. Unarmed strikes with her arms or hands (or attacks with weapons
        held in those hands) deal +1d6 points of acid damage.</p><p>during this
        duration you can:</p><p><em>Earthfoot (acid)</em>: Whenever the suli
        moves through difficult terrain related to earth and stone (rubble, mud,
        sand, and so on), she may move through @Distance[5 ft;dual] of that
        difficult terrain each round as if it were normal terrain. This allows
        the suli to take a @Distance[5 ft;dual] step into that difficult
        terrain. Other kinds of difficult terrain (ice, caltrops, foliage, and
        so on) affect the suli normally.</p>
      duration:
        dismiss: true
        units: round
        value: '@attributes.hd.total'
      name: Elemental Assault (Acid)
      uses:
        self:
          maxFormula: '1'
          per: day
          value: 1
  contextNotes:
    - target: landSpeed
      text: >-
        While her elemental assault is active, you can move through 5 feet
        difficult terrain related to earth and stone (rubble, mud, sand,
        etc),each round as if it were normal terrain. This allows you to take a
        5-foot step in such terrain. this doesn't apply to other kinds of
        difficult terrain.
    - target: allSavingThrows
      text: You have Acid Resistance 5.
  description:
    instructions: >-
      <p>Remove
      @UUID[Compendium.pf-content.pf-racial-traits.Item.0HcXO1YYEXC3TDlc]{Energy
      Resistance (Suli)};   You must add Acid Resistance 5 to your actor
      manually.</p>
    value: >-
      <p><strong>Race</strong>: Suli<br /><strong>Replaced Trait(s)</strong>:
      Elemental Assault</p><hr /><p>A suli with this racial trait has a stronger
      connection to one energy type than to the other three used by sulis.
      Choose one energy type: acid, cold, electricity, or fire. The suli's
      elemental assault ability can only deal energy damage of this type. The
      suli has resistance 5 to this energy type and no racial resistance to the
      other three types. While her elemental assault is active, the suli gains
      an additional ability based on the chosen energy type.</p><p><em>Earthfoot
      (acid)</em>: Whenever the suli moves through difficult terrain related to
      earth and stone (rubble, mud, sand, and so on), she may move through
      @Distance[5 ft;dual] of that difficult terrain each round as if it were
      normal terrain. This allows the suli to take a @Distance[5 ft;dual] step
      into that difficult terrain. Other kinds of difficult terrain (ice,
      caltrops, foliage, and so on) affect the suli normally.</p><p>This racial
      trait otherwise works like and replaces
      @UUID[Compendium.pf-content.pf-racial-traits.Item.RScQcZuZDW9bGV8c]{elemental
      assault}.</p><p>This is one of four elemental options for the Energy
      Strike racial trait. The options are:
      @UUID[Compendium.pf-content.pf-racial-traits.Item.RciaNbMBeBVfJMjZ]{Energy
      Strike (Acid)};
      @UUID[Compendium.pf-content.pf-racial-traits.Item.Uu1wTwtXGLuFWugv]{Energy
      Strike (Cold)};
      @UUID[Compendium.pf-content.pf-racial-traits.Item.cEh0t6PAmegJIQCU]{Energy
      Strike (Electricity)};
      @UUID[Compendium.pf-content.pf-racial-traits.Item.Ax9nTBosPUTxsSm8]{Energy
      Strike (Fire)}</p><p><strong>Related buff:</strong> @Toggle[Elemental
      Assault (Acid, Suli)]</p>
