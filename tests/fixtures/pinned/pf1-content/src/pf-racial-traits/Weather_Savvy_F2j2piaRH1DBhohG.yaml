  description:
    value: >-
      <p><strong>Race</strong>: Sylph<br /><strong>Replaced Trait(s)</strong>:
      Spell-Like Ability</p><hr /><p>Some sylphs are so in tune with the air and
      sky that they can sense the slightest change in atmospheric conditions.
      Sylphs with this trait can spend a full-round action to predict the
      weather in an area for the next 24 hours. The sylph's prediction is always
      accurate, but cannot account for spells or supernatural effects that might
      alter the forecast. This racial trait replaces the sylph's spell-like
      ability racial trait.</p>
