  description:
    value: >-
      <p><strong>Race</strong>: Human<br /><strong>Replaced Trait(s)</strong>:
      Bonus Feat</p><hr /><p>Those who understand the connection between shadows
      and the Negative Energy Plane know how to fight the spirits of darkness.
      Characters with this trait deal 50% weapon damage to incorporeal creatures
      when using nonmagical weapons (including natural and unarmed attacks), as
      if using magic weapons. They also gain a +2 bonus on saving throws to
      remove negative levels, and recover physical ability damage from attacks
      by undead creatures at a rate of 2 points per ability score per day
      (rather than the normal 1 point per ability score per day).</p><p>Humans
      can take this trait in place of their bonus feat, also gaining
      @UUID[Compendium.pf1.feats.Item.iAbIGhm7T2OK9Brt]{Iron Will} as a bonus
      feat.</p>
