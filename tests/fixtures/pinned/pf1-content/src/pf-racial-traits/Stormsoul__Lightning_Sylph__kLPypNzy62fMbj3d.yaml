name: Stormsoul (Lightning Sylph)
system:
  description:
    value: >-
      <p><strong>Race</strong>: Sylph<br /><strong>Replaced Trait(s)</strong>:
      Base Statistics</p><hr /><p>With an abundance of confidence and a shortage
      of patience, stormsoul sylphs are personalities who cannot be
      ignored.</p><p><strong>Typical Alignment</strong> CN <br /><strong>Ability
      Modifiers</strong> +2 Dex, +2 Cha, -2 Wis <br /><strong>Alternate
      Spell-Like Ability</strong> Stormsouls gain
      @UUID[Compendium.pf1.spells.Item.33pe0bge7b7aq3io]{shocking grasp} as a
      spell-like ability. <br /><strong>Lightning Affinity</strong> This racial
      trait functions as and can be replaced as the base sylph's air affinity,
      except it benefits sorcerers with the stormborn bloodline and spellcasters
      with the Weather domain.</p><p>When a stormsoul moves, either in word or
      in action, the world notices. Unafraid to speak their minds, they are both
      direct and unsubtle, and they make fierce allies. When friends are in
      need, stormsouls act without thinking and are always the first to leap to
      their aid.</p><p>A stormsoul sylph has hair that always seems to move,
      even when there is no breeze, and acts with a sudden intensity that can
      seem out of control. Their eyes are the color of stormy water or
      lightning-lit skies, and even a casual glance from a stormsoul can seem
      severe.</p>
