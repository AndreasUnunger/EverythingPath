  description:
    value: >-
      <p><strong>Race</strong>: Sylph<br /><strong>Replaced Trait(s)</strong>:
      Spell-Like Ability</p><hr /><p>Sylphs with this racial trait feel kinship
      toward the creatures of the air, and can use <i>speak with animals
      </i>once per day to speak to birds or other flying animals. Her caster
      level for these effects is equal to her level. This racial trait replaces
      the sylph's spell-like ability racial trait.</p>
