  contextNotes:
    - target: conChecks
      text: >-
        +[[5]] Racial bonus on checks to stabilize when dying.

        You add half your character level to your Constitution score when
        determining the negative hit point total necessary to kill you.
        ([[floor(@attributes.hd.total / 2)]] + [[@abilities.con.total]])
  description:
    value: >-
      <p><strong>Race</strong>: Human<br /><strong>Replaced Trait(s)</strong>:
      Skilled</p><hr /><p>Humans raised in the wild learn the hard way that only
      the strong survive. They gain a racial bonus equal to half their character
      level on Survival checks. They also gain a +5 racial bonus on Constitution
      checks to stabilize when dying and add half their character level to their
      Constitution score when determining the negative hit point total necessary
      to kill them. This racial trait replaces skilled.</p>
