  description:
    value: >-
      <p><strong>Race</strong>: Strix<br /><strong>Replaced Trait(s)</strong>:
      Hatred, Suspicious</p><hr /><p>Because strix are careful to avoid injuring
      other strix even when they fight with each other, they develop a talent
      for fighting without causing lasting harm. They gain a +1 racial bonus on
      damage rolls when dealing nonlethal damage and take no attack penalty when
      dealing nonlethal damage with a lethal weapon. This racial trait replaces
      hatred and suspicious.</p>
