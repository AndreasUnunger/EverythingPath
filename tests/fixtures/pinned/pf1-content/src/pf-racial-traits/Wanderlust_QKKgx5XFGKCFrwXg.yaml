      <p><strong>Race</strong>: Halfling<br /><strong>Replaced
      Trait(s)</strong>: Fearless, Halfling Luck</p><hr /><p>Halflings love
      travel and maps. Halflings with this racial trait receive a +2 bonus on
      Knowledge (geography) and Survival checks. When casting spells or using
      abilities that provide or enhance movement, halflings treat their caster
      level as +1 higher than normal. This racial trait replaces the fearless
      and halfling luck racial traits.</p>
