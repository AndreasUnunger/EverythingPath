        <p>@UUID[Compendium.pf1.spells.Item.kouqz0pm1xl8xilm]{Alter
        Self}</p><p>When you cast this spell, you can assume the form of any
        Small or Medium creature of the humanoid type. If the form you assume
        has any of the following abilities, you gain the listed ability:
        darkvision @Distance[60 ft;dual], low-light vision, scent, and swim
        @Distance[30 ft;dual].</p><p><em>Small creature</em>: If the form you
        take is that of a Small humanoid, you gain a +2 size bonus to your
        Dexterity.</p><p><em>Medium creature</em>: If the form you take is that
        of a Medium humanoid, you gain a +2 size bonus to your Strength.</p>
