      <p><strong>Race</strong>: Dwarf<br /><strong>Replaced Trait(s)</strong>:
      Defensive Training, Hatred</p><hr /><p>Some Pahmet come from long lines of
      guardians who train to defeat any undead that enter the tombs they
      protect. Dwarves with this racial trait gain a +2 bonus to AC against
      undead and a +2 bonus on saving throws against spells and spell-like
      abilities cast by undead.</p><p> This replaces defensive training and
      hatred.</p>
