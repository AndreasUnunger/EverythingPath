    value: >-
      <p><strong>Race</strong>: Oread<br /><strong>Replaced Trait(s)</strong>:
      Base Statistics</p><hr /><p>Stolid and indomitable, ironsoul oreads
      undertake great works, both physical and conceptual, with unwavering
      determination.</p><p><strong>Typical Alignment</strong> LN <br
      /><strong>Ability Modifiers</strong> +2 Con, +2 Wis, -2 Dex <br
      /><strong>Alternate Spell-Like Ability</strong> Ironsouls gain
      @UUID[Compendium.pf1.spells.Item.09juighnblqlqwro]{unerring weapon} as a
      spell-like ability. <br /><strong>Metal Affinity</strong> This racial
      trait functions as and can be replaced as the base oread's earth affinity,
      except it benefits sorcerers with the shaitan bloodline and spellcasters
      with the Metal subdomain.</p><p>Possessed of patience and a sense of
      self-refinement through struggle, ironsouls reflect their ancestry in
      their continuous and determined efforts towards self-improvement.
      Ironsouls are most at home in areas that reflect that same sense of
      directed and intentional growth, and they operate best within existing
      formal structures.</p><p>Ironsouls wear their elemental heritage on their
      skin, with most having some amount of metallic sheen. Their skin tone
      varies, with colors ranging from gold and silver to copper-green and dull,
      oxide gray.</p>
