      <p><strong>Race</strong>: Drow<br /><strong>Replaced Trait(s)</strong>:
      Weapon Familiarity<br /><strong>Prerequisite: </strong>Charisma 13+</p><hr
      /><p>Characters who practice coercion and intimidation in the Darklands or
      on the Shadow Plane learn to do so in dim light or no light at all. As
      long as they are in dim light or darker conditions, characters with this
      trait gain a +2 bonus on Intimidate and Stealth checks.</p><p>Drow can
      take this trait in place of weapon familiarity.</p>
