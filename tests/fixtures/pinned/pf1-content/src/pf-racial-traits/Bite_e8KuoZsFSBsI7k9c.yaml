  description:
    instructions: >-
      <p>You must modify your natural attack to match the parameters specified
      in this trait, including setting damage, reach, etc. manually.</p>
    value: >-
      <p><strong>Prerequisites:</strong>
      @UUID[Compendium.pf-content.pf-racial-traits.Item.BgVWmGCg6iPJqElT]{Small}
      or larger size</p><p><strong>Special</strong>: This trait can be taken up
      to two times. The second time it is taken, the bite damage increases by
      one size category.</p><hr /><p>Members of this race gain a natural bite
      attack, dealing damage equivalent to that of a creature two size
      categories lower than normal for their size (Bestiary 302; 1d2 for Small
      races, 1d3 for Medium, etc.). The bite is a primary attack, or a secondary
      attack if the creature is wielding manufactured weapons.</p>
