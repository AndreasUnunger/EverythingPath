      <p><strong>Race</strong>: Gathlain<br /><strong>Replaced
      Trait(s)</strong>: Natural Armor</p><hr /><p>A gathlain whose seed spends
      a long time drifting through the air before coming to rest grows with a
      natural aerial agility. Gathlains with this racial trait gain a +1 dodge
      bonus to AC against attacks originating from at least @Distance[20
      ft;dual] below the gathlain.</p><p>This replaces natural armor.</p>
