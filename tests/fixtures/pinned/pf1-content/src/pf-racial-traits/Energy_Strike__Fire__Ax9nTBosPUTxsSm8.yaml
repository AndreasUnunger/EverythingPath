    - _id: UF6FTLV7JfXcbL0U
      activation:
        type: swift
        unchained:
          type: action
      description: >-
        <p>Once per day as a swift action, a suli can shroud her arms in fire.
        This effect lasts for 1 round per level and can be dismissed as a free
        action. Unarmed strikes with her arms or hands (or attacks with weapons
        held in those hands) deal +1d6 points of fire damage.</p><p>during this
        duration you can:</p><p><em>Firehand (fire)</em>: Instead of adding
        damage to a melee attack, the suli may hurl a piece of her arm-flames as
        if it were a thrown weapon. The suli makes a ranged touch attack; if the
        attack hits, the target takes 1d6 points of fire damage. The flames have
        a range increment of @Distance[10 ft;dual].</p>
      duration:
        dismiss: true
        units: round
        value: '@attributes.hd.total'
      name: Elemental Assault (Fire)
      uses:
        self:
          maxFormula: '1'
          per: day
          value: 1
