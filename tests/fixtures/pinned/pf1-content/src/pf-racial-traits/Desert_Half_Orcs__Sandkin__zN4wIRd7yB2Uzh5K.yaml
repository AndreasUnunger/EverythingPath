name: Desert Half-Orcs (Sandkin)
system:
  description:
    value: >-
      <p>Desert half-orcs are born primarily in northern Garund and Osirion and
      often hold a level of esteem and self-assurance that is rare for
      half-orcs. Among desert orc tribes, the ability to tolerate harsh sunlight
      is a sign of strength, and weathering the sun is a rite of passage.
      Lacking their ancestors’ light sensitivity, half-orcs excel at these
      contests of endurance and easily earn high positions within their
      tribes.<br /><br />Desert half-orcs also fare better than most among human
      civilizations. The strong presence of Sarenrae’s followers has led to a
      culture of forgiveness and understanding that is rare in other parts of
      Golarion, making it easier for half-orcs to thrive. Many desert half-orcs
      believe they are blessed by Sarenrae and become clerics or paladins of her
      church.</p>
