      <p><strong>Race</strong>: Vine Leshy<br /><strong>Replaced
      Trait(s)</strong>: <em>Pass Without Trace</em></p><hr /><p>A vine leshy
      made from a grapevine can produce magically infused fruit that can heal
      her allies. She can cast
      @UUID[Compendium.pf1.spells.Item.k4whhwm1dsz2upkm]{Goodberry} once per day
      as a spell-like ability, with a caster level equal to her character
      level.</p><p>This replaces pass without trace.</p>
