  description:
    instructions: >-
      <p>Select one terrain type from the ranger's favored terrain list and
      select three 0-level druid spells and one 1st-level druid spell when you
      take this trait.</p><p>update the details tab of this trait
      accordingly.</p>
    value: >-
      <p><strong>Race</strong>: Human<br /><strong>Replaced Trait(s)</strong>:
      Skilled</p><hr /><p>The character has a mystic connection to one terrain
      type, selected from the ranger's favored terrain list. The character
      selects three 0-level druid spells and one 1st-level druid spell. If the
      character has a Charisma score of 11 or higher, when in the selected
      terrain, she gains these spells as spell-like abilities that can be cast
      once per day. The caster level for these effects is equal to the user's
      character level. The DC for the spell-like abilities is equal to 10 + the
      spell's level + the user's Charisma modifier. These spells are treated as
      being from a fey source for the purposes of the druid's resist nature's
      lure class feature and similar abilities.</p><p>A human who replaces
      skilled with fey magic also gains fey thoughts and low-light vision.</p>
