    value: >-
      <p><strong>Race</strong>: Aquatic Elf<br /><strong>Replaced
      Trait(s)</strong>: Elven Magic</p><hr /><p>Aquatic elves generally
      distrust humans, but for some, the suspicion has become festering hatred.
      Those who have lost loved ones to human aggression or have watched humans
      loot artifacts from venerated undersea ruins view all humans as enemies.
      Aquatic elves with this racial trait receive a +1 bonus on attack rolls
      against humans. This racial trait replaces elven magic.</p>
