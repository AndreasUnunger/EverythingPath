  description:
    value: >-
      <p><strong>Race</strong>: Dwarf<br /><strong>Replaced Trait(s)</strong>:
      Greed, Hardy, Hatred</p><hr /><p>Dwarves who make their homes in the Sky
      Citadels are trained to outlast sieges and serve as vigilant guards. They
      gain Endurance as a bonus feat. In addition, during rounds in which they
      have not moved, they gain a +1 racial bonus on attack rolls against foes
      who also did not move since their last turn. This racial trait replaces
      greed, hardy, and hatred.</p>
