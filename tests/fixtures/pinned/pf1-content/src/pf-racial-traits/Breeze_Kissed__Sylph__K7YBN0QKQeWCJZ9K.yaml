  description:
    value: >-
      <p><strong>Race</strong>: Sylph<br /><strong>Replaced Trait(s)</strong>:
      Air Affinity</p><hr /><p>Breezes seem to follow most sylphs wherever they
      go, but some sylphs are better able to control these winds than others. A
      sylph with this racial trait surrounds herself with swirling winds,
      gaining a +2 racial bonus to AC against nonmagical ranged attacks. The
      sylph can calm or renew these winds as a swift action. Once per day, the
      sylph can channel this wind into a single gust, making a bull rush or trip
      combat maneuver attempt against one creature within @Distance[30 ft;dual].
      Whether or not the attempt succeeds, the winds are exhausted and no longer
      provide a bonus to the sylph's AC for 24 hours. This is a supernatural
      ability. This racial trait replaces air affinity.</p>
