      description: >-
        <p>@UUID[Compendium.pf1.spells.Item.tsndfcfijmgxs37p]{darkness}</p><p>This
        spell causes an object to radiate <em>darkness</em> out to a
        @Distance[20 ft;dual] radius. This <em>darkness</em> causes the
        illumination level in the area to drop one step, from bright light to
        normal light, from normal light to dim light, or from dim light to
        <em>darkness</em>. This spell has no effect in an area that is already
        dark. Creatures with light vulnerability or sensitivity take no
        penalties in normal light. All creatures gain concealment (20% miss
        chance) in dim light. All creatures gain total concealment (50% miss
        chance) in <em>darkness</em>.</p><p>Creatures with darkvision can see in
        an area of dim light or <em>darkness</em> without penalty. Nonmagical
        sources of light, such as torches and lanterns, do not increase the
        light level in an area of <em>darkness</em>. Magical light sources only
        increase the light level in an area if they are of a higher spell level
        than <em>darkness</em>.</p><p>If <em>darkness</em> is cast on a small
        object that is then placed inside or under a lightproof covering, the
        spell's effect is blocked until the covering is removed.</p><p>This
        spell does not stack with itself. <em>Darkness</em> can be used to
        counter or dispel any light spell of equal or lower spell level.</p>
      duration:
        dismiss: true
