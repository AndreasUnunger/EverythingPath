  description:
    value: >-
      <p><strong>Race</strong>: Halfling<br /><strong>Replaced
      Trait(s)</strong>: Halfling Luck</p><hr /><p>Some halflings have greater
      control over their innate luck. This ability gives them more options for
      how they can apply their good fortune from day to day, but also narrows
      its scope. Three times per day, a halfling can gain a +2 luck bonus on an
      ability check, attack roll, saving throw, or skill check. If halflings
      choose to use the ability before they make the roll or check, they gain
      the full +2 bonus; if they choose to do so afterward, they only gain a +1
      bonus. Using adaptive luck in this way is not an action. This racial trait
      replaces halfling luck.</p>
