    value: >-
      <p><strong>Race</strong>: Halfling<br /><strong>Replaced
      Trait(s)</strong>: Sure-Footed, Weapon Familiarity</p><hr /><p>Some
      reclusive halfling tribes flourish in tropical locales. These halflings
      begin play speaking only Halfling (in addition to any additional languages
      gained from having a high Intelligence score), rather than Common and
      Halfling. They gain a +2 racial bonus on Survival checks and are
      proficient with blowguns. In addition, they have the
      @UUID[Compendium.pf1.class-abilities.Item.A54sLfcyoR5HGNbP]{Poison Use}
      ability (they never risk poisoning themselves accidentally). This racial
      trait alters halflings' languages and replaces sure-footed and weapon
      familiarity.</p>
