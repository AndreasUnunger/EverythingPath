  description:
    value: >-
      <p><strong>Race</strong>: Naiad</p><hr /><p>A naiad can choose another
      intelligent creature to inspire by giving that creature a token (typically
      a lock of her hair). As long as the creature carries the naiad's token and
      retains her favor, that creature gains a +1 insight bonus on Will saving
      throws and Craft and Perform checks. The naiad retains a link to her token
      and its carrier as if she had cast a
      @UUID[Compendium.pf1.spells.Item.4ya1fs9tyvsqnwqx]{status} spell on the
      carrier. The naiad can end this effect at any time as a free action. A
      single naiad can only inspire one other creature at a time in this
      manner.</p><p><strong>Related Buff:</strong> @Toggle[Inspiration]</p>
