    value: >-
      <p><strong>Race</strong>: Halfling<br /><strong>Replaced
      Trait(s)</strong>: Halfling Luck, Sure-Footed, Weapon Familiarity</p><hr
      /><p>Humans often entrust halfling families with the care of children and
      animals, a task that has helped them develop keen insight. Such halflings
      gain a +2 racial bonus on Sense Motive checks. In addition, when they
      acquire an animal companion, bonded mount, cohort, or familiar, that
      creature gains a +2 bonus to one ability score of the character's choice.
      This racial trait replaces halfling luck, sure-footed, and weapon
      familiarity.</p>
