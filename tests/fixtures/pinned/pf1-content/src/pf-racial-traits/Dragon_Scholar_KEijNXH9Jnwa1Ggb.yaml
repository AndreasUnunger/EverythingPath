  description:
    value: >-
      <p><strong>Race</strong>: Human<br /><strong>Replaced Trait(s)</strong>:
      Bonus Feat</p><hr /><p>Dragons have a long history of individual
      interactions with specific humans, and some humans seek to better
      understand this relationship. Humans with this trait receive a +2 racial
      bonus on caster level checks to overcome a dragon's spell resistance. In
      addition, they receive a +3 racial bonus on Knowledge (arcana) checks
      related to creatures of the dragon type. This trait replaces humans' bonus
      feat racial trait.</p>
