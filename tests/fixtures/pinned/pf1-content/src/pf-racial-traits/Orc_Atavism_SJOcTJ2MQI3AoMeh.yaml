    value: >-
      <p><strong>Race</strong>: Half-Orc<br /><strong>Replaced
      Trait(s)</strong>: Ability Score Modifiers, Intimidating, Orc Blood, Orc
      Ferocity</p><hr /><p>Some half-orcs have much stronger orc blood than
      human blood. Such half-orcs count as only half-orcs and orcs (not also
      humans) for any effect related to race. They gain a +2 bonus to Strength
      and a -2 penalty to one mental ability score of their choice. Finally,
      they gain the
      @UUID[Compendium.pf-content.pf-universal-monster-rules.Item.itiLDlB5BHlUB8os]{ferocity}
      universal monster ability. This racial trait replaces the half-orc's usual
      racial ability score modifiers, as well as intimidating, orc blood, and
      orc ferocity.</p>
