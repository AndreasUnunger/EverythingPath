  description:
    value: >-
      <p><strong>Race</strong>: Android</p><hr /><p>An android's body is infused
      with nanites. Once per day as an immediate action, an android can cause
      her nanites to surge, granting her a bonus equal to 3 + the android's
      character level on any one d20 roll; this ability must be activated before
      the roll is made. When an android uses this power, her circuitry-tattoos
      glow with light equivalent to that of a torch for 1 round.</p>
