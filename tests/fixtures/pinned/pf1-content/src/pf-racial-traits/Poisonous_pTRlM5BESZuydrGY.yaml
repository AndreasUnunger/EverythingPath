  description:
    value: >-
      <p><strong>Race</strong>: Vine Leshy<br /><strong>Replaced
      Trait(s)</strong>: Plantspeech; Change Shape</p><hr /><p>Vine leshys made
      from poison ivy vines carry natural poison in their bodies. As a swift
      action, the leshy can imbue its vines with this irritating substance. The
      next time the leshy hits a creature with an unarmed strike, the creature
      is affected by the following poison.</p><p><i>Vine Leshy Toxin</i>:
      Unarmed strike-injury; <i>save </i>Fort DC 10 + half the vine leshy's Hit
      Dice + the leshy's Constitution modifier; <i>frequency </i>1/round for 6
      rounds; <i>effect </i>sickened for 1 round; cure 1 save.</p><p> The leshy
      can use this ability a number of times per day equal to its Constitution
      modifier (minimum 1). A vine leshy is immune to its own poison, but not to
      those of other vine leshys.</p><p> This replaces plantspeech and change
      shape.</p>
