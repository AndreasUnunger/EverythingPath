  description:
    value: >-
      <p><strong>Race</strong>: Ghoran<br /><strong>Replaced Trait(s)</strong>:
      Delicious, Past-Life Knowledge</p><hr /><p>Some ghorans' link to their
      past lives becomes corrupted, causing their taste to become particularly
      disgusting. Such ghorans gain a +2 racial bonus on Escape Artist and
      combat maneuver checks to escape a grapple against any creature that has a
      bite attack with the grab ability. This racial trait replaces delicious
      and past-life knowledge.</p>
