      description: >-
        <p>@UUID[Compendium.pf1.spells.Item.rrsefzpm3nhztvld]{Speak With Plants}
        (trees only)</p><p>You can communicate with normal plants and plant
        creatures, and can ask questions of and receive answers from them. A
        normal plant's sense of its surroundings is limited, so it won't be able
        to give (or recognize) detailed descriptions of creatures or answer
        questions about events outside its immediate vicinity. The spell doesn't
        make plant creatures any more friendly or cooperative than normal.
        Furthermore, wary and cunning plant creatures are likely to be terse and
        evasive, while the more stupid ones may make inane comments. If a plant
        creature is friendly, it may do some favor or service for you.</p>
      duration:
        units: minute
        value: '@attributes.hd.total'
      name: Speak With Plants
      range:
        units: personal
      target:
        value: you
  description:
    value: >-
      <p><strong>Race</strong>: Gathlain<br /><strong>Replaced
      Trait(s)</strong>: Spell-Like Abilities</p><hr /><p>A rare few gathlains
      are born with the knowledge of an ancient way of speech that allows them
      to communicate with trees. Once per day, they can cast <i>speak with
      plants</i> (trees only) as a spell-like ability with a caster level equal
      to the gathlain's character level.</p><p> This replaces spell-like
      abilities.</p>
