  description:
    value: >-
      <p><strong>Race</strong>: Gnome<br /><strong>Replaced Trait(s)</strong>:
      Defensive Training, Hatred, Keen Senses</p><hr /><p>All gnomes love
      pranks, but some specialize in those improvised during battle. These
      gnomes gain a +2 racial bonus on dirty trick combat maneuvers. They need
      not meet the Intelligence requirement to select Combat Expertise, Improved
      Dirty Trick, and any feat with Improved Dirty Trick as a prerequisite.
      This racial trait replaces defensive training, hatred, and keen
      senses.</p>
