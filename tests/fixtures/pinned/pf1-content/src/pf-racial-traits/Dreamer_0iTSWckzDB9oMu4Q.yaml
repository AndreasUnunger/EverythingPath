  description:
    value: >-
      <p><strong>Race</strong>: Half-Elf<br /><strong>Replaced
      Trait(s)</strong>: Elven Immunities</p><hr /><p>Half-elves with this trait
      gain a +2 racial saving throw bonus against illusion spells and effects.
      In addition, when entering a dreamscape in a lucid body (<i>Pathfinder RPG
      Occult Adventures 241</i>), a half-elf with this racial trait treats her
      Charisma score as 2 points higher for the purpose of effects related to
      the Dimension of Dreams. This racial trait replaces elven immunities.</p>
