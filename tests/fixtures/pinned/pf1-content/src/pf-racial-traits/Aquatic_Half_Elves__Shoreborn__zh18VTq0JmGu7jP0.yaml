name: Aquatic Half-Elves (Shoreborn)
system:
  description:
    value: >-
      <p><strong>Race</strong>: Half-Elf<br /><strong>Replaced
      Trait(s)</strong>: Base Statistics</p><hr /><p>Children of both land and
      sea, the shoreborn revel in their freedom to travel and find joy in all
      forms of exploration and adventure.</p><p><strong>Elven Ancestry
      </strong>aquatic elves<br /><strong>Human Ancestry </strong>any near
      oceans or seas<br /><strong>Regions </strong>any islands or oceans<br
      /><strong>Languages </strong>Aquan, Common, Elven</p><p>The children of
      aquatic elves and land-bound humans feel the disparity between their
      heritages more than any other. These half-elves show their parentage on
      their faces, with sandy, russet, or green-black skin to match their elven
      parent. Slightly webbed fingers and toes aid in swimming, but their neck
      slits almost never function as gills. A few aquatic half-elves can breathe
      underwater and live with their elven parents, but far more shoreborn live
      on land, feeling a constant call to the water. Many find work as sailors.
      Fishing vessels and merchant ships often have shoreborn deckhands and
      first mates, and a crew made up solely of aquatic half-elves sails an
      infamous pirate ship known as the Shoreline Scourge.</p>
