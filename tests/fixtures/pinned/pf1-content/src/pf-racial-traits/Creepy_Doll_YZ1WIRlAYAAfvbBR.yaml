name: Creepy Doll
system:
  contextNotes:
    - target: skill.ste
      text: >-
        You can use the Stealth skill without cover or concealment if you cease
        moving and pretend to be a doll while unobserved.  A successful Stealth
        check still allows other creatures to notice you - they just believe you
        are a doll, similar to the
        @UUID[Compendium.pf-content.pf-universal-monster-rules.Item.P3r81I2PlyyDXkzL]{freeze}
        universal monster ability (without being able to take 20).
    - target: skill.int
      text: You take no size penalty against larger humanoids.
  description:
    value: >-
      <p><strong>Race</strong>: Halfling<br /><strong>Replaced
      Trait(s)</strong>: Keen Senses, Sure-Footed</p><hr /><p>Glassy eyes and
      porcelain skin make some halflings look more like dolls than living
      creatures. If they cease moving and pretend to be a doll while they aren't
      being observed, they can use the Stealth skill without cover or
      concealment. A successful Stealth check still allows other creatures to
      notice the halfling; they just believe the halfling is a doll, similar to
      the @UUID[Compendium.pf1.monster-abilities.Item.P3r81I2PlyyDXkzL]{Freeze}
      universal monster ability (without being able to take 20). In addition,
      they take no size penalty on Intimidate checks against larger humanoids.
      The racial trait replaces keen senses and sure-footed.</p><p></p><p></p>
