    value: >-
      <p><strong>Race</strong>: Ganzi</p><hr /><p>As creatures infused with the
      entropic forces of the Maelstrom, all ganzis have a distinct and unusual
      oddity that manifests as a physical or magical ability that sets the ganzi
      apart. Typically, a ganzi's oddity is chosen from the most common
      manifestations of entropy listed below, but other, more unique oddities
      can certainly exist. The numbers listed for each option can be used to
      randomly determine what form of ganzi oddity a particular Ganzi might
      have, at the GM's option, but the quibble ability is the most
      common.</p><p><strong>1–2: Chaos Champion (Su)</strong> Ganzis with a
      lineage linked to the einherji often become crusaders for the forces of
      entropy and excel in combat against lawful beings. The ganzi can smite law
      once per day as a swift action, targeting a lawful foe. She adds her
      Charisma modifier as a bonus on attack rolls and gains a bonus on damage
      rolls equal to her Hit Dice. Once activated, smite law persists until the
      target is dead or the ganzi rests, whichever comes
      first.</p><p><strong>3–4: Entropic Flesh (Ex)</strong> Ganzis with
      lineages that link strongly to chaos beasts retain some of their
      ancestors’ immunity to transformation. In addition to gaining a +2 bonus
      on Escape Artist checks and to CMD against grapple combat maneuvers, when
      such ganzis are affected by a hostile transmutation effect (such as
      polymorphing or petrification), they can attempt a new saving throw at the
      start of their next turn to end the effect. They gain a +4 bonus on this
      second saving throw, but if they fail, the transmutation effect persists
      as long as it normally would.</p><p><strong>5–6: Prehensile Tail
      (Ex)</strong> Ganzis with lineages that are particularly influenced by the
      presence of proteans often have colorful feathers, scales, or skin, and a
      long serpentine tail. This tail can be used to carry items. While ganzis
      with this oddity cannot wield weapons with their tails, they can use their
      tails to retrieve small, stowed objects carried on their persons as a
      swift action.</p><p><strong>7–14: Quibble (Su)</strong> For most ganzis,
      the influence of chaos is relatively subtle and manifests as an ability to
      infect others with entropy and unexpected luck (be it good luck or bad).
      Once per day as an immediate action, a ganzi can twist probability and
      alter the luck of a single creature within @Distance[20 ft;dual], forcing
      it to reroll a single d20 roll it has just made. The target must take the
      second result, even if it is worse. A ganzi can use this ability after the
      target has rolled but must use it before the GM declares whether the roll
      was a success or failure. Unwilling creatures can resist a ganzi’s quibble
      with a successful Will save (DC = 10 + half the ganzi’s level + the
      ganzi’s Charisma modifier). This is a curse effect.</p><p><strong>15–18:
      Spell-Like Ability (Sp)</strong> Ganzis whose chaotic influences rise from
      regions other than the Maelstrom or its inhabitants often manifest an
      oddity that duplicates the effects of a specific spell. Such ganzis gain
      one of the following spell-like abilities, usable once per day at a caster
      level equal to the ganzi’s HD: alter self, blur, detect thoughts, hideous
      laughter, minor image, shatter, or spider climb.</p><p><strong>19–20:
      Weaponplay (Ex)</strong> Ganzis with lineages that link to the valkyries
      manifest their heritage in their skill in combat. Such ganzis are always
      proficient with all simple and martial weapons, and they can qualify for
      feats normally available only to fighters (such as Weapon Specialization)
      even if they don’t have any fighter class levels.</p>
