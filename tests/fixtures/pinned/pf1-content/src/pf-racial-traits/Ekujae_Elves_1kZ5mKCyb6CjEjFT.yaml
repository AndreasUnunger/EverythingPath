name: Ekujae Elves
system:
  description:
    value: >-
      <p><strong>Race</strong>: Elf<br /><strong>Replaced Trait(s)</strong>:
      Base Statistics</p><hr /><p>Though the Ekujae clans are often mistaken for
      unaffiliated tribes, they are in fact a united nation and still hold
      vestiges of the power that their ancient kingdom once wielded. Ekujae
      elves reside within the Mwangi Expanse in hidden jungle villages so
      interwoven with the surrounding trees that the buildings there are
      overlooked even by travelers passing within a few hundred feet them.
      Unlike many of the elves of Avistan, the Ekujae remained on Golarion
      despite the calamity of Earthfall and tell tales of having defeated a
      -Great Darkness- after the disaster. They still hone their skills for war
      and are ever ready to fight the Darkness if it returns. Due to this
      ancient responsibility, Ekujae hold to strict traditions in many matters,
      including the burying of their fallen and the act of swearing oaths and
      ritualized agreements.</p><p>Like other elves, Ekujae have keen intellects
      and are skilled in magical lore, including what has been passed down
      through their oral traditions and the numerous secrets of the Mwangi
      Expanse. They often journey to the Magaambya to study magic or to share
      their knowledge with that academy's students. Ekujae frequently have the
      @UUID[Compendium.pf-content.pf-racial-traits.Item.x2zsfToayeBdnrvD]{Long-Limbed}
      alternate racial trait and either the
      @UUID[Compendium.pf-content.pf-racial-traits.Item.UzMmqEyE5E3VDox0]{Woodcraft},
      @UUID[Compendium.pf-content.pf-racial-traits.Item.7ungQuC9iDjjX2vP]{Silent
      Hunter}, or
      @UUID[Compendium.pf-content.pf-racial-traits.Item.88rQ9iJdzI8Cmr18]{Light
      against Darkness} alternate racial traits, as well as the
      @UUID[Compendium.pf-content.pf-racial-traits.Item.agovSwSID6zOPIDN]{Sense
      Thoughts} alternate racial trait.</p>
