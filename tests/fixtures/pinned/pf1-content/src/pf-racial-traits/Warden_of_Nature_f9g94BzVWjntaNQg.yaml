  description:
    value: >-
      <p><strong>Race</strong>: Gnome<br /><strong>Replaced Trait(s)</strong>:
      Defensive Training, Hatred</p><hr /><p>Gnomes must often protect their
      homes against unnatural or pestilential infestations. Gnomes with this
      racial trait get a +2 dodge bonus to AC against aberrations, oozes, and
      vermin, and a +1 bonus on attack rolls against them because of their
      special training. This racial trait replaces the defensive training and
      hatred racial traits.</p>
