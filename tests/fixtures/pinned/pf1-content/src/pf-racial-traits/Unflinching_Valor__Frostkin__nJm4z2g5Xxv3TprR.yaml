  description:
    value: >-
      <p><strong>Race</strong>: Half-Orc (Frostkin Only) <br /><strong>Replaced
      Trait(s)</strong>: Intimidating</p><hr /><p>Many fearsome arctic predators
      consider young
      @UUID[Compendium.pf-content.pf-racial-traits.Item.sOuYeZ0ADFtn4Inc]{frostkin}
      easy prey, but some frostkin manage to surpass their fear and fight off
      these beasts in time for help to arrive. Winter half-orcs with this racial
      trait gain a +2 racial bonus on saving throws against fear effects, and a
      +1 racial bonus to CMD to avoid being grappled. This racial trait replaces
      the intimidating racial trait.</p>
