name: Oread Gem Magic
system:
  description:
    instructions: >-
      <p>Recommend that these spells if known by your character, be added to
      your spellbook twice. Once as normal and again as a separate version with
      the gem component and effects augmented as described</p>
    value: >-
      <p><strong>Race</strong>: Oread<br /><strong>Replaced Trait(s)</strong>:
      Earth Affinity</p><hr /><p>The following alternate racial trait can be
      selected instead of an oread's default earth affinity racial trait. More
      information on alternate racial traits can be found on page 8 of the
      <em>Pathfinder RPG Advanced Player's Guide</em>.</p><p>Oreads' proclivity
      for long spans of study and concentration makes them natural wizards,
      witches, and oracles. Oreads with this racial trait can augment their
      earth-related spells and spell-like abilities through the use of precious
      and semiprecious gemstones as additional material components. The gems are
      destroyed in the process, granting the spell the listed effects in
      addition to its normal effects unless otherwise noted. Only one instance
      of oread gem magic can be applied to a spell at a time; excess expended
      gems do not stack.</p><p><strong>Binding Earth</strong><sup>ARG</sup>: +1
      damage; +1 to DC of Strength checks. <em>Cost</em>: Garnet worth 50
      gp.</p><p><strong>Binding Earth, Mass</strong><sup>ARG</sup>: As binding
      earth augmentation, affecting all targets of the augmented spell.
      <em>Cost</em>: Garnets worth 250 gp.</p><p><strong>Calcific
      Touch</strong><sup>APG</sup>: +1 Dexterity damage. <em>Cost</em>:
      Aquamarine worth 250 gp.</p><p><strong>Clashing
      Rocks</strong><sup>APG</sup>: +1 damage per damage die. <em>Cost</em>:
      Emeralds worth 1,500 gp.</p><p><strong>Earthquake</strong>: +2 Reflex save
      DC in whatever application the spell is used; area increases to
      @Distance[100 ft;dual] radius shapeable spread. <em>Cost</em>: Jet worth
      500 gp.</p><p><strong>Elemental Body</strong>: Duration increases to 10
      minutes/level. <em>Cost</em>: Amber worth 250 gp for <em>elemental body
      I</em>, +100 gp per spell level for greater
      versions.</p><p><strong>Elemental Swarm</strong>: Earth elementals
      summoned gain the advanced simple template (this does not stack with the
      Augment Summoning feat). <em>Cost</em>: Rubies worth 1,200
      gp.</p><p><strong>Magic Stone</strong>: Range increment increases by
      @Distance[10 ft;dual]. <em>Cost</em>: Moonstone worth 25
      gp.</p><p><strong>Meld into Stone</strong>: Can bring up to
      @Weight[200;dual] of equipment with you; you can see as normal out of the
      stone. <em>Cost</em>: Peridots worth 150 gp.</p><p><strong>Mighty Fist of
      Earth</strong><sup>ARG</sup>: Increase unarmed strike damage by one step
      (to 1d4 in most instances). <em>Cost</em>: Sard or sardonyx worth 25
      gp.</p><p><strong>Raging Rubble</strong><sup>ARG</sup>: Rubble deals +1
      damage; distraction DC increases by 1. <em>Cost</em>: Tourmaline worth 80
      gp.</p><p><strong>Shifting Sand</strong><sup>APG</sup>: Move area of sands
      up to @Distance[15 ft;dual] as a move action. <em>Cost</em>: Turquoise
      worth 125 gp.</p><p><strong>Soften Earth and Stone</strong>: Creatures can
      move only at a quarter their normal speed (minimum @Distance[5 ft;dual])
      in areas of mud and loose dirt. <em>Cost</em>: Fluorite worth 100
      gp.</p><p><strong>Spike Stones</strong>: +1 piercing damage; spikes deal 1
      point of bleed damage. <em>Cost</em>: Topaz worth 300
      gp.</p><p><strong>Stone Shape</strong>: Shapes that include moving parts
      have only 5% chance of not working. <em>Cost</em>: Opal worth 250
      gp.</p><p><strong>Stone Shield</strong><sup>ARG</sup>: If your opponent's
      attack strikes the stone shield, its full damage roll is also applied to
      its weapon. Unarmed strikes and natural attacks are not affected.
      <em>Cost</em>: Jade worth 75 gp.</p><p><strong>Stoneskin</strong>: The
      cost of this spell's expensive material component can be reduced or
      increased to affect the spell's power accordingly. With reduced
      components, the spell grants DR 10/silver (instead of adamantine); with
      increased components, the spell absorbs 15 points of damage per caster
      level before it's discharged. <em>Cost</em>: Diamonds worth 150 gp
      (reduced); diamonds worth 500 gp (increased).</p>
