      <p><strong>Race</strong>: Half-Orc (Cragkin Only)<br /><strong>Replaced
      Trait(s)</strong>: Orc Ferocity, Weapon Familiarity</p><hr
      /><p>@UUID[Compendium.pf-content.pf-racial-traits.Item.I0yTReZxAfE5biVp]{Cragkin}
      are accustomed to traveling in the steep terrain of their mountain homes.
      When in mountain terrain, mountain half-orcs with this racial trait can
      move through natural difficult terrain at their normal speed; magically
      altered terrain affects them normally. In addition, cragkin gain a
      +@Distance[10 ft;dual] racial bonus to their speed while charging. This
      racial trait replaces the orc ferocity and weapon familiarity racial
      traits.</p>
