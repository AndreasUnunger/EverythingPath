    value: >-
      <p><strong>Race</strong>: Changeling<br /><strong>Replaced
      Trait(s)</strong>: Hag Trait</p><hr /><p>The changelings who result from
      ash hags' wicked work often have one distinctly gray eye; alternatively,
      they may have perpetually dry, almost desiccated skin and chronic
      psoriasis. The daughter of an ash hag can take the following as her hag
      racial trait.</p><p><b>Pyrophile</b>: The changeling gains a +1 racial
      bonus on damage rolls when using spells with the fire descriptor. This
      bonus increases by 1 for every 4 levels the changeling has beyond 1st.</p>
