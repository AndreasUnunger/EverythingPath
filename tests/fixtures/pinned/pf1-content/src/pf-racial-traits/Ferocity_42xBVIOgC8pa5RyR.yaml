  description:
    value: >-
      <p>Members of this race gain the following extraordinary ability: If the
      hit points of a member of this race fall below 0 but it is not yet dead,
      it can continue to fight. If it does, it is staggered, and loses 1 hit
      point each round. It still dies when its hit points reach a negative
      amount equal to its Constitution score.</p>
