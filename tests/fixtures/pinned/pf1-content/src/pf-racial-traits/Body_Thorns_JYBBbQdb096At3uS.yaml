  description:
    value: >-
      <p><strong>Race</strong>: Gathlain<br /><strong>Replaced
      Trait(s)</strong>: Spell-Like Abilities</p><hr /><p>Gathlains that mature
      in particularly hostile environments develop thorns on their vines to
      protect them from overeager herbivores. A gathlain with this racial trait
      is considered to be wearing masterwork armor spikes when not wearing armor
      or bulky clothing, and it is proficient with
      @UUID[Compendium.pf1.weapons-and-ammo.Item.aZ4tLZL0LIZAHnQ1]{armor
      spikes}. These thorns can be sundered or destroyed as if they were a worn
      object (hardness 1, 5 hp), but grow back 1 week later. This racial trait
      replaces the spell-like abilities racial trait.</p>
