      description: >-
        <p><em>@UUID[Compendium.pf1.spells.Item.h4hrop7rq2c9phyi]{blurred
        movement}</em></p><p>This spell functions as
        @UUID[Compendium.pf1.spells.Item.18kryvj2dfuymk9d]{blur}, except that
        the blurring occurs only when you move at least @Distance[10 ft;dual] on
        your turn and ceases at the end of your movement. It is therefore mainly
        used to thwart attacks on your turn, such as attacks of opportunity. If
        you move at least twice your speed on your turn, the blurring lasts
        until the start of your next turn.</p>
