      description: >-
        <p>@UUID[Compendium.pf1.spells.Item.ech2cibcsmsms9s7]{Dust of
        Twilight}</p><p>A shower of iridescent black particles clings to and
        extinguishes torches, lanterns, sunrods, and similar mundane light
        sources and dispels any spell of 2nd level or lower with the light
        descriptor (as dispel magic). Creatures in the area must make a
        Fortitude save or become fatigued.</p>
