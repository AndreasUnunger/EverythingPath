    value: >-
      <p><strong>Race</strong>: Duergar<br /><strong>Replaced Trait(s)</strong>:
      <em>Invisibility</em> Spell-Like Ability</p><hr /><p>While most duergar
      have the power to become invisible, a few are instead able to extinguish
      the light around them. Duergar with this racial trait can use
      @UUID[Compendium.pf1.spells.Item.ech2cibcsmsms9s7]{Dust of Twilight}<em>
      </em>(<em>Pathfinder RPG Advanced Player's Guide</em> 217) once per day as
      a spell-like ability, using their character level as their caster level.
      This racial trait replaces the <em>invisibility</em> spell-like
      ability.</p>
