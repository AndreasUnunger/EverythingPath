      <p><strong>Race</strong>: Half-Orc<br /><strong>Replaced
      Trait(s)</strong>: Orc Ferocity</p><hr /><p>Half-orcs raised by orcs often
      become desensitized to the violence around them. Half-orcs with this trait
      gain a +4 bonus on Will saving throws to avoid sanity damage (see
      <em>Horror Adventures</em> <em>page 12</em>) caused by encountering
      monsters, extreme violence, or death. This racial trait replaces orc
      ferocity.</p>
