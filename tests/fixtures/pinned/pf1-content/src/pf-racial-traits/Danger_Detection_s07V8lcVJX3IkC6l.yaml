      <p><strong>Race</strong>: Halfling<br /><strong>Replaced
      Trait(s)</strong>: Keen Senses</p><hr
      /><p>@UUID[Compendium.pf-content.pf-racial-traits.Item.Q901lu7ObAb1hJJ3]{Song'o
      halflings} have learned to hone in on any indication of danger. Halflings
