name: Tiny
system:
  description:
    instructions: <p>You must manually set Size in the Details tab of the Race.</p>
    value: >-
      <p><strong>Prerequisites</strong>: Aberration, construct, dragon, fey,
      outsider (native), or plant type</p><hr /><p>Tiny creatures gain a +2 size
      bonus to Dexterity and a –2 size penalty to Strength. Tiny races gain a +2
      size bonus to their AC, a +2 size bonus on attack rolls, a –2 penalty on
      combat maneuver checks and to their CMD, and a +8 size bonus on Stealth
      checks. Tiny characters take up a space of @Distance[2.5ft;dual] by
      @Distance[2.5ft;dual], so up to four of these characters can fit into a
      single square. Tiny races typically have a natural reach of @Distance[0
      ft;dual], meaning they can’t reach into adjacent squares. They must enter
      an opponent’s square to attack it in melee. This provokes an attack of
      opportunity from the opponent. Since they have no natural reach, they do
      not threaten the squares around them. Other creatures can move through
      those squares without provoking attacks of opportunity. Tiny creatures
      typically cannot flank an enemy.</p>
  racePoints: 4
