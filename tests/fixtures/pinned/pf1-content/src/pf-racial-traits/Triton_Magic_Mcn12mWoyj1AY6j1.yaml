      description: >-
        <p><em>@UUID[Compendium.pf1.spells.Item.0jwi6xovzukorxok]{summon
        nature's ally I}</em></p><p>This spell summons to your side a natural
        creature (typically an animal, fey, magical beast, outsider with the
        elemental subtype, or a giant). The summoned ally appears where you
        designate and acts immediately, on your turn. It attacks your opponents
        to the best of its ability. If you can communicate with the creature,
        you can direct it not to attack, to attack particular enemies, or to
        perform other actions as you command.</p><p>A summoned monster cannot
        summon or otherwise conjure another creature, nor can it use any
        teleportation or planar travel abilities. Creatures cannot be summoned
        into an environment that cannot support them. Creatures summoned using
        this spell cannot use spells or spell-like abilities that duplicate
        spells that have expensive material components (such as wish).</p><p>The
        spell conjures one of the creatures from the 1st Level list on Table
        10-2. You choose which kind of creature to summon, and you can change
        that choice each time you cast the spell. All the creatures on the table
        are neutral unless otherwise noted.</p><p>When you use a summoning spell
        to summon a creature with an alignment or elemental subtype, it is a
        spell of that type. All creatures summoned with this spell without
        alignment subtypes have an alignment that matches yours, regardless of
        their usual alignment. Summoning these creatures makes the summoning
        spell's type match your alignment.</p>
      duration:
        dismiss: true
        units: round
        value: '@attributes.hd.total'
      name: Summon nature's ally I (Dolphin only)
      range:
        units: ft
        value: floor(@attributes.hd.total / 2) * 5 + 25
  description:
    value: >-
      <p><strong>Race</strong>: Undine<br /><strong>Replaced Trait(s)</strong>:
      Spell-Like Ability</p><hr /><p>Some undines-often from Outsea-descend from
      tritons, rather than genies. Undines with this racial trait can use
      <em>@UUID[Compendium.pf1.spells.Item.0jwi6xovzukorxok]{summon nature's
      ally I}</em> as a spell-like ability, but only to summon a dolphin. This
      racial trait replaces the spell-like ability racial trait.</p>
