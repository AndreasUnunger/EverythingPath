    value: >-
      <p><strong>Race</strong>: Tiefling<br /><strong>Replaced
      Trait(s)</strong>: Fiendish Sorcery, Spell-Like Ability</p><hr /><p>Once
      per day, a tiefling with this racial trait can smite a good-aligned
      creature. As a swift action, the tiefling chooses one target within sight
