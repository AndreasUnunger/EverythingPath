    value: >-
      <p><strong>Race</strong>: Dwarf<br /><strong>Replaced Trait(s)</strong>:
      Defensive Training, Hatred</p><hr /><p>While some dwarves focus their
      early years on training against one specific foe of the dwarven kingdoms,
      others know that there are many enemies who would destroy dwarvenkind if
      given the opportunity. A dwarf with this racial trait gains a +1 bonus on
      melee attack rolls and a +1 bonus to AC against attacks of opportunity
      made by drow, duergar, creatures of the aberration type, or creatures of
      the giant or orc subtype.</p><p> This replaces defensive training and
      hatred.</p>
  sources:
