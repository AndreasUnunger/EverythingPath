  description:
    value: >-
      <p><strong>Race</strong>: Svirfneblin<br /><strong>Replaced
      Trait(s)</strong>: Hatred, Skilled</p><hr /><p>Svirfneblin first came to
      Golarion to thwart the schemes of evil fey. Those who still keep to this
      mission, primarily dwelling in settlements far beneath Andoran, gain a +1
      racial bonus on attack rolls against fey creatures and a +2 racial bonus
      on saving throws against mind-affecting effects. This racial trait
      replaces hatred and skilled.</p>
