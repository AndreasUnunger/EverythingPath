name: Rimesoul (Frost Undine)
system:
  description:
    value: >-
      <p><strong>Race</strong>: Undine<br /><strong>Replaced Trait(s)</strong>:
      Base Statistics</p><hr /><p>Rimesoul undines are distant and imperious,
      aloof in their intellect and hesitant to change their
      ways.</p><p><strong>Typical Alignment</strong> LN <br /><strong>Ability
      Modifiers</strong> +2 Dex, +2 Int, -2 Cha <br /><strong>Alternate
      Spell-Like Ability</strong> Rimesouls gain
      @UUID[Compendium.pf1.spells.Item.to1cdmyh5rtfyg2s]{chill touch} as a
      spell-like ability. <br /><strong>Ice Affinity</strong> This racial trait
      functions as and can be replaced as the base undine's water affinity,
      except it benefits sorcerers with the boreal bloodline and spellcasters
      with the Ice subdomain.</p><p>Like their ice-coated ancestors, rimesouls
      represent the solidification of change. They have precise, ordered minds
      that take well to individual pursuits. Rimesouls often choose to live in
      sparsely populated areas in Irrisen and Varisia. When they do live in
      cities, they prefer areas of disciplined culture such as Druma and
      Cheliax.</p><p>In appearance, rimesouls are frequently pale, sometimes
      with translucent or blue-tinged skin. Rimesouls usually dress in crisp,
      understated fashions that present an impression of austerity.</p>
