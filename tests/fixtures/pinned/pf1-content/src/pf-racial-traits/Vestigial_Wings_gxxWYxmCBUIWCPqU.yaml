  description:
    value: >-
      <p><strong>Race</strong>: Tiefling<br /><strong>Replaced
      Trait(s)</strong>: Skilled</p><hr /><p>Some tieflings possess a pair of
      undersized, withered, or stunted wings like a mockery of those of their
      fiendish forbearer. Sometimes these wings are leathery, like those of a
      bat. Other times they are covered with a scattering of black, red, or
      violet feathers. Rare manifestations can take even more bizarre forms.
      These wings do not provide the lift required for actual flight, but do
      have enough power to aid flight attained by some other method, and grant a
      +4 racial bonus on Fly skill checks. This racial trait replaces skilled.
      </p>
