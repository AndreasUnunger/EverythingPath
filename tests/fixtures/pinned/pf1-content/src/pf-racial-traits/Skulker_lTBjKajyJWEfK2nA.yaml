      <p><strong>Race</strong>: Halfling<br /><strong>Replaced
      Trait(s)</strong>: Fearless, Weapon Familiarity</p><hr /><p>Oppressed
      halflings train from a young age to take advantage of times when their
      oppressors ignore them. Such halflings gain a +1 racial bonus on attacks
      against foes who are denied their Dexterity bonus to AC. This racial trait
      replaces fearless and weapon familiarity.</p>
