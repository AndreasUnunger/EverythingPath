      text: You can't normally be exposed to ingested poisons.
  description:
    value: >-
      <p><strong>Race</strong>: Astomoi</p><hr /><p>Astomoi don't need to eat or
      drink to survive. Instead, they absorb the essence of food and drink; this
      consumes the nutrients of the meal as though it had been eaten, rendering
      the food useless to others. Astomoi consume potions and other ingested
      materials in the same fashion. Since they never actually ingest anything,
      they can't normally be exposed to ingested poisons.</p>
