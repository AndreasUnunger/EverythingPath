name: Special Qualities
system:
  contextNotes:
    - target: skills
      text: >-
        When a reborn samsaran expends psychic energy to cast
        @UUID[Compendium.pf1.spells.Item.ldijs33l5ycavo2g]{psychic reading} to
        identify a humanoid's class, he temporarily treats two of the target's
        class skills as if they were class skills for him. He can use these
        skills untrained and gains a +[[2]] insight bonus on such checks. These
        benefits last for 24 hours or until the reborn samsaran spends psychic
        energy to cast psychic reading again.
    - target: skills
      text: >-
        A reborn samsaran has difficulty hiding his psychic signatures. The DC
        of any skill check made to read his aura decreases by 5, and the check
        takes one-tenth as long as normal to perform.
  description:
    value: >-
      <p><strong>Race</strong>: Reborn Samsaran</p><hr /><p>A reborn samsaran
      gains the following special qualities.</p><p><em>Aura Transparency</em>: A
      reborn samsaran has difficulty hiding his psychic signatures. The DC of
      any skill check made to read his aura decreases by 5, and the check takes
      one-tenth as long as normal to perform.</p><p><em>Psychic Learning</em>:
      When a reborn samsaran expends psychic energy to cast
      <em>@UUID[Compendium.pf1.spells.Item.ldijs33l5ycavo2g]{psychic reading}
      </em>to identify a humanoid's class, he temporarily treats two of the
      target's class skills as if they were class skills for him. He can use
      these skills untrained and gains a +2 insight bonus on such checks. These
      benefits last for 24 hours or until the reborn samsaran spends <em>psychic
      energy</em> to cast psychic reading again.</p>
