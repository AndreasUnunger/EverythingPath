  description:
    value: >-
      <p><strong>Race</strong>: Ratfolk<br /><strong>Replaced Trait(s)</strong>:
      Rodent Empathy</p><hr /><p>Some ratfolk unnerve normal animals, and train
      to defend themselves against the inevitable attacks from such creatures.
      These ratfolk take a -4 penalty on all Charisma-based skill checks to
      affect creatures of the animal type, and receive a +2 dodge bonus to AC
      against animals. An animal's starting attitude toward ratfolk is one step
      worse than normal. This racial trait replaces rodent empathy.</p>
