name: Mwangi Dwarves
system:
  description:
    value: >-
      <p><strong>Race</strong>: Dwarf<br /><strong>Replaced Trait(s)</strong>:
      Base Statistics</p><hr /><p>Two tribes of dwarves reside in the Mwangi
      Expanse: the Mbe'ke and the Taralu. The Mbe'ke build cities in the
      mountains of the Terwa Uplands, while the Taralu live in small clans in
      the eastern jungle. Although there is little contact between the two
      groups, they share a reverence for and affinity with dragons-most
      especially cloud dragons- as well as any draconic creature that can be
      reasoned with, including wyverns. Mwangi dwarves often take the
      @UUID[Compendium.pf-content.pf-racial-traits.Item.BFUKz38eVbL0HHi0]{Magic
      Resistant} or
      @UUID[Compendium.pf-content.pf-racial-traits.Item.6d96mOZtn3WCCN1A]{Surface
      Survivalist} alternate racial traits. Those who form the strongest
      spiritual bonds to some form of dragon sometimes also have the
      @UUID[Compendium.pf-content.pf-racial-traits.Item.Zty4nj3QFPOC0hYX]{Breath
      Weapon} alternate racial trait.</p>
