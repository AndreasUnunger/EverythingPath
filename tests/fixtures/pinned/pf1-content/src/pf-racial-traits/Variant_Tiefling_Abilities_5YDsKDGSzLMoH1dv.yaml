name: Variant Tiefling Abilities
system:
  description:
    instructions: >-
      <p>You must determine the option and update your actor manually for this
      trait. If you roll the optional table is available here:
      @UUID[Compendium.pf1.roll-tables.RollTable.W4pz9FurKj95HS78]{Variant
      Tiefling Abilities}</p>
    value: >-
      <p><strong>Race</strong>: Tiefling<br /><strong>Replaced
      Trait(s)</strong>: Spell-Like Ability</p><hr /><p>Some tieflings are
      blessed or cursed with unusual abilities. GMs may customize their tiefling
      NPCs using the following chart, or allow their players to do so by rolling
      a d%. Players with a particular character concept in mind may consult
      their GM if they want to select a specific variant ability.</p><p>The
      abilities presented here replace a tiefling's spell-like ability racial
      trait. Any abilities that grant spells or spelllike abilities are treated
      as having a caster level equal to the tiefling's character
      level.</p><table><tbody><tr><td><p><strong>d%</strong></p></td><td><p><strong>Ability</strong></p></td></tr><tr><td><p>1</p></td><td><p>You
      can animate a 1 HD skeleton, as per
      <em>@UUID[Compendium.pf1.spells.Item.8uwmrygxgih1fb57]{animate dead}</em>,
      once per day as a spell-like
      ability.</p></td></tr><tr><td><p>2</p></td><td><p>You possess some type of
      extrasensory organ, granting you all-around
      vision.</p></td></tr><tr><td><p>3</p></td><td><p>You enjoy being cut. The
      first time each day you take slashing damage, you gain a +1 bonus on
      attack and damage rolls for the following
      round.</p></td></tr><tr><td><p>4</p></td><td><p>You can use
      @UUID[Compendium.pf1.spells.Item.p8lm7khq3ynyif21]{mage hand} three times
      per day as a spell-like
      ability.</p></td></tr><tr><td><p>5</p></td><td><p>Inherited memories grant
      you a +2 racial bonus on one Knowledge skill of your
      choice.</p></td></tr><tr><td><p>6</p></td><td><p>You can levitate yourself
      plus @Weight[10;dual] at will, as per the spell
      <em>@UUID[Compendium.pf1.spells.Item.plou8h168bfn5hq6]{levitate}</em>.
      This is a supernatural
      ability.</p></td></tr><tr><td><p>7</p></td><td><p>You can eat and gain
      nourishment from ash, cinders, dust, and
      sand.</p></td></tr><tr><td><p>8</p></td><td><p>You gain a +1 bonus on all
      attack and damage rolls against good-aligned
      outsiders.</p></td></tr><tr><td><p>9</p></td><td><p>You gain an additional
      +2 racial bonus to your Charisma
      score.</p></td></tr><tr><td><p>10</p></td><td><p>You possess a bite that
      is treated as a natural weapon and deals 1d4 points of
      damage.</p></td></tr><tr><td><p>11</p></td><td><p>Once per day, you can
      exhibit a burst of speed, moving as if your base land speed were
      @Distance[50 ft;dual] for one move
      action.</p></td></tr><tr><td><p>12</p></td><td><p>You do not need to
      sleep. You are not immune to sleep
      effects.</p></td></tr><tr><td><p>13</p></td><td><p>You gain a +2 bonus on
      saving throws made against
      disease.</p></td></tr><tr><td><p>14</p></td><td><p>Your base land speed
      increases by +@Distance[5
      ft;dual].</p></td></tr><tr><td><p>15</p></td><td><p>You possess a
      fiendishly cunning tongue, granting you a +2 racial bonus on all Diplomacy
      checks.</p></td></tr><tr><td><p>16</p></td><td><p>You have oversized
      limbs, allowing you to use Large weapons without
      penalty.</p></td></tr><tr><td><p>17</p></td><td><p>You possess claws that
      are treated as natural weapons and deal 1d4 points of
      damage.</p></td></tr><tr><td><p>18</p></td><td><p>You gain DR
      2/bludgeoning.</p></td></tr><tr><td><p>19</p></td><td><p>You gain a Swim
      speed of @Distance[30
      ft;dual].</p></td></tr><tr><td><p>20</p></td><td><p>You gain a +2 racial
      bonus on combat maneuver
      checks.</p></td></tr><tr><td><p>21</p></td><td><p>You possess fiendish
      luck. Once per day, you can reroll one die roll. You must take the result
      of this second roll.</p></td></tr><tr><td><p>22</p></td><td><p>You can use
      <em>@UUID[Compendium.pf1.spells.Item.tr7m97npkbgm4wp7]{detect evil}</em>,
      as per the spell, three times per
      day.</p></td></tr><tr><td><p>23</p></td><td><p>You never need to drink to
      survive.</p></td></tr><tr><td><p>24</p></td><td><p>Once per day, you can
      produce a sharp barb from your body. This barb is removable and is treated
      as a dagger.</p></td></tr><tr><td><p>25</p></td><td><p>You gain acid
      resistance 5.</p></td></tr><tr><td><p>26</p></td><td><p>Your body produces
      intense, searing heat. Any creature that grapples you takes 1d4 points of
      fire damage per round.</p></td></tr><tr><td><p>27</p></td><td><p>You can
      speak two additional languages spoken by extraplanar
      beings.</p></td></tr><tr><td><p>28</p></td><td><p>Any evil creature you
      call via summon monster remains for 3 rounds longer than
      usual.</p></td></tr><tr><td><p>29</p></td><td><p>You gain a +1 bonus on
      all Reflex saving throws.</p></td></tr><tr><td><p>30</p></td><td><p>You
      can alter your shadow to make it appear as that of any creature or object
      of your size or smaller.</p></td></tr><tr><td><p>31</p></td><td><p>You can
      burrow through dirt, sand, and loose gravel at a rate of @Distance[5
      ft;dual] per round.</p></td></tr><tr><td><p>32</p></td><td><p>You can
      sense weakness, granting you a +1 bonus on all rolls to confirm critical
      hits.</p></td></tr><tr><td><p>33</p></td><td><p>You gain DR
      2/silver.</p></td></tr><tr><td><p>34</p></td><td><p>You do not lose
      consciousness until you are reduced to -5 hit
      points.</p></td></tr><tr><td><p>35</p></td><td><p>You possess long limbs
      and a powerful grip, features that grant you a +2 racial bonus on all
      Climb checks.</p></td></tr><tr><td><p>36</p></td><td><p>You can
      communicate telepathically with any sentient creature with which you are
      in contact.</p></td></tr><tr><td><p>37</p></td><td><p>Once per day, you
      can use <em>@UUID[Compendium.pf1.spells.Item.k0k8gvqyy3rd5gke]{death
      knell}</em> as a spell-like
      ability.</p></td></tr><tr><td><p>38</p></td><td><p>At will, you can spend
      a full-round action concentrating to receive the benefits of tremorsense
      @Distance[60 ft;dual] for 1
      round.</p></td></tr><tr><td><p>39</p></td><td><p>Once per day, you can
      move at double your normal speed for 1
      round.</p></td></tr><tr><td><p>40</p></td><td><p>As a full-round action,
      you can bleed and collect 5 sp worth of precious blood per
      day.</p></td></tr><tr><td><p>41</p></td><td><p>You possess spell
      resistance equal to 10 + 1/2 your Hit
      Dice.</p></td></tr><tr><td><p>42</p></td><td><p>The spell
      <em>@UUID[Compendium.pf1.spells.Item.8uwmrygxgih1fb57]{animate dead}</em>
      can return you to life as per the spell
      <em>@UUID[Compendium.pf1.spells.Item.c5anior2ysy6s2xy]{raise dead}</em>
      1d4 times.</p></td></tr><tr><td><p>43</p></td><td><p>Your fiendish sorcery
      ability treats your Charisma score as if it were 3 points higher instead
      of 2.</p></td></tr><tr><td><p>44</p></td><td><p>You are unusually short,
      granting you all the standard traits of a Small
      creature.</p></td></tr><tr><td><p>45</p></td><td><p>Your features are
      subtly malleable, granting you a +2 racial bonus on all Disguise
      checks.</p></td></tr><tr><td><p>46</p></td><td><p>You gain an additional
      +2 racial bonus to your Intelligence
      score.</p></td></tr><tr><td><p>47</p></td><td><p>You can use
      <em>@UUID[Compendium.pf1.spells.Item.c0hvjnqzry149ugs]{curse water} </em>
      three times per day as a spell-like
      ability.</p></td></tr><tr><td><p>48</p></td><td><p>You are invisible to
      all unintelligent undead. This is a supernatural
      ability.</p></td></tr><tr><td><p>49</p></td><td><p>You are healed by both
      positive and negative channeled
      energy.</p></td></tr><tr><td><p>50</p></td><td><p>Your skin is unnaturally
      tough, granting you a +1 natural bonus to your
      AC.</p></td></tr><tr><td><p>51</p></td><td><p>You can speak to all
      birds.</p></td></tr><tr><td><p>52</p></td><td><p>You gain a +2 bonus on
      saving throws against
      poison.</p></td></tr><tr><td><p>53</p></td><td><p>You possess the scent
      special ability.</p></td></tr><tr><td><p>54</p></td><td><p>You gain DR
      2/piercing.</p></td></tr><tr><td><p>55</p></td><td><p>You are unnaturally
      sly, granting you a +2 racial bonus on all Sleight of Hands
      checks.</p></td></tr><tr><td><p>56</p></td><td><p>Once per day, you can
      spit acid. This glob deals 1d4 points of acid damage and has a range
      increment of 5 feet.</p></td></tr><tr><td><p>57</p></td><td><p>Your body
      exudes painfully freezing cold. Any creature that grapples you takes 1d4
      points of cold damage per
      round.</p></td></tr><tr><td><p>58</p></td><td><p>You heal yourself of
      double the normal amount of damage by
      resting.</p></td></tr><tr><td><p>59</p></td><td><p>You gain a +1 bonus on
      all Will saving throws.</p></td></tr><tr><td><p>60</p></td><td><p>You gain
      a +2 bonus on initiative checks at
      night.</p></td></tr><tr><td><p>61</p></td><td><p>You can manipulate any
      armor, gauntlets, or shield you wield, causing them to grow spikes. These
      spikes last only as long as you wear your
      armor.</p></td></tr><tr><td><p>62</p></td><td><p>You can use
      <em>@UUID[Compendium.pf1.spells.Item.1hjxxr3k62rcpb5c]{deathwatch}</em>
      three times per day as a spell-like
      ability.</p></td></tr><tr><td><p>63</p></td><td><p>You have some manner of
      inhuman sensory organ. You gain a +2 bonus on saving throws against all
      gaze attacks.</p></td></tr><tr><td><p>64</p></td><td><p>Once per day, for
      1 round, you may see through any substance less than @Distance[5 ft;dual]
      thick-except for lead-as if it were glass. This is a supernatural
      ability.</p></td></tr><tr><td><p>65</p></td><td><p>Your strange physiology
      grants you a +2 racial bonus on all Acrobatics
      checks.</p></td></tr><tr><td><p>66</p></td><td><p>You can drink and gain
      nourishment from ash, cinders, dust, and
      sand.</p></td></tr><tr><td><p>67</p></td><td><p>Your eyes glow fiendishly
      and you possess the see in darkness ability as if you were a
      devil.</p></td></tr><tr><td><p>68</p></td><td><p>You gain damage reduction
      2/cold iron.</p></td></tr><tr><td><p>69</p></td><td><p>Once per day, you
      can use <em>@UUID[Compendium.pf1.spells.Item.g33euis7yi9pwddy]{fog
      cloud}</em> as a spell-like
      ability.</p></td></tr><tr><td><p>70</p></td><td><p>You are aware of and
      can choose the result of any attempt to detect your
      alignment.</p></td></tr><tr><td><p>71</p></td><td><p>Once per day, you can
      spend a full-round action eating from a corpse to regain 1d6+1 hit
      points.</p></td></tr><tr><td><p>72</p></td><td><p>You can communicate
      telepathically with any evil creature within @Distance[50
      ft;dual].</p></td></tr><tr><td><p>73</p></td><td><p>You can use
      <em>@UUID[Compendium.pf1.spells.Item.27o3msobhyghmfid]{minor image}</em>
      three times per day as a spell-like
      ability.</p></td></tr><tr><td><p>74</p></td><td><p>Once per day, as a
      spell-like ability, you can animate a Small or smaller object for a number
      of rounds equal to your level. Treat this object as
      @UUID[Compendium.pf1.spells.Item.k9iu3d82hlo7coct]{animate
      object}.</p></td></tr><tr><td><p>75</p></td><td><p>You gain sonic
      resistance 5.</p></td></tr><tr><td><p>76</p></td><td><p>You can hold your
      breath for 3 rounds longer than
      normal.</p></td></tr><tr><td><p>77</p></td><td><p>You can speak to
      insects.</p></td></tr><tr><td><p>78</p></td><td><p>Your skin is spiky. Any
      creature that attempts to grapple you takes 1d4 points of
      damage.</p></td></tr><tr><td><p>79</p></td><td><p>You receive a +1 bonus
      on all Fortitude saving
      throws.</p></td></tr><tr><td><p>80</p></td><td><p>You gain a +2 bonus to
      your CMD.</p></td></tr><tr><td><p>81</p></td><td><p>Once per day, you can
      use <em>@UUID[Compendium.pf-content.pf-buffs.Item.nRHD11ZwDWlRyT8c]{rage}
      </em>on yourself as a spell-like
      ability.</p></td></tr><tr><td><p>82</p></td><td><p>You gain a +2 bonus on
      saving throws against mind-affecting
      effects.</p></td></tr><tr><td><p>83</p></td><td><p>Once per day, exposure
      to fire heals you of 1d6 points of damage. This ability does not negate
      fire damage.</p></td></tr><tr><td><p>84</p></td><td><p>You are immune to
      magic sleep and paralysis
      effects.</p></td></tr><tr><td><p>85</p></td><td><p>Supernatural awareness
      grants you a +2 racial bonus on all Perception
      checks.</p></td></tr><tr><td><p>86</p></td><td><p>Your anatomy is slightly
      unusual, giving you a 15% chance to ignore critical hits made against
      you.</p></td></tr><tr><td><p>87</p></td><td><p>You can survive on
      one-quarter the amount of food and water a human
      requires.</p></td></tr><tr><td><p>88</p></td><td><p>Any damage you deal
      with a melee weapon is treated as evil for the purposes of overcoming
      damage reduction.</p></td></tr><tr><td><p>89</p></td><td><p>Once per day,
      you can use <em>@UUID[Compendium.pf1.spells.Item.qooag8g9dxck4lik]{inflict
      light wounds}</em> as a spell-like
      ability.</p></td></tr><tr><td><p>90</p></td><td><p>You gain an additional
      +2 racial bonus to your Wisdom
      score.</p></td></tr><tr><td><p>91</p></td><td><p>You gain DR
      2/slashing.</p></td></tr><tr><td><p>92</p></td><td><p>You can see
      creatures on the Ethereal
      Plane.</p></td></tr><tr><td><p>93</p></td><td><p>Once per day, you may ask
      a corpse one yes-or-no question, as per the spell
      @UUID[Compendium.pf1.spells.Item.byn5q46du0ck592a]{speak with dead}. This
      is a spell-like ability.</p></td></tr><tr><td><p>94</p></td><td><p>You
      gain a +2 bonus on saving throws against
      nausea.</p></td></tr><tr><td><p>95</p></td><td><p>You are flexible and
      slightly slimy, and thus gain a +2 racial bonus on all Escape Artist
      checks.</p></td></tr><tr><td><p>96</p></td><td><p>You can use
      @UUID[Compendium.pf1.spells.Item.0onqjy8gfgop1xsi]{ventriloquism} at will
      as a spell-like ability.</p></td></tr><tr><td><p>97</p></td><td><p>Once
      per day as a standard action, you may suppress your unusual tiefling
      physical features for a number of minutes equal to your Con modifier, thus
      appearing human.</p></td></tr><tr><td><p>98</p></td><td><p>You receive +1
      bonus hit point per level.</p></td></tr><tr><td><p>99</p></td><td><p>Once
      per week, you may mentally contact a fiendish ancestor to gain
      information, as per the spell
      @UUID[Compendium.pf1.spells.Item.p2kosvizylhy8vfa]{commune}. This is a
      spell-like ability.</p></td></tr><tr><td><p>100</p></td><td><p>Roll on
      this table twice, ignoring any further rolls of
      100.</p></td></tr></tbody></table><p></p>
