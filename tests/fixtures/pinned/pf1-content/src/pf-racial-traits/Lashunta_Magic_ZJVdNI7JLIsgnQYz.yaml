      <em>@UUID[Compendium.pf1.spells.Item.p8lm7khq3ynyif21]{mage hand}</em>;
      1/day-<em>@UUID[Compendium.pf1.spells.Item.xllxylvvqr82o2d5]{detect
      thoughts}</em>. The caster level for these effects is equal to the
      lashunta's character level.</p>
