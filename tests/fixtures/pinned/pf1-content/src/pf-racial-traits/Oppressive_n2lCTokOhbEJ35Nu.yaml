  description:
    value: >-
      <p><strong>Race</strong>: Syrinx<br /><strong>Replaced Trait(s)</strong>:
      Nocturnal, Pride</p><hr /><p>Syrinxes often have a natural talent for
      sensing how to unsettle and oppress other creatures. As a swift action, a
      syrinx can attempt a Sense Motive check against a DC of 10 + a creature's
      Hit Dice + its Charisma modifier or a DC of 10 + the creature's Bluff
      modifier, whichever is higher. On a success, syrinx gains a +4 racial
      bonus on Intimidate checks against that target and a +1 racial bonus to
      the DC of any fear effects she uses against that target. This racial trait
      replaces nocturnal and pride.</p>
