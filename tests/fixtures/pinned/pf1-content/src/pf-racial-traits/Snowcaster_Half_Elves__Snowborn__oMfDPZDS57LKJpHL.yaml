name: Snowcaster Half-Elves (Snowborn)
system:
  description:
    value: >-
      <p><strong>Race</strong>: Half-Elf<br /><strong>Replaced
      Trait(s)</strong>: Base Statistics</p><hr /><p>Half-elves born to
      Snowcasters are outcasts from birth, and must struggle to survive the
      harsh environs of the north either alone or with an adopted
      family.</p><p><strong>Elven Ancestry </strong>Snowcaster elves<br
      /><strong>Human Ancestry </strong>Erutaki, Jadwiga, Ulfen, Varki<br
      /><strong>Regions </strong>Crown of the World, Irrisen, Lands of the
      Linnorm Kings, Varisia<br /><strong>Languages </strong>Elven, Erutaki,
      Hallit, Skald, Varki</p><p>Found throughout the northern countries,
      snowborn are typically the children of twilight speakers—religious envoys
      from the normally distrustful Snowcaster clans, who consider it a sacred
      duty to befriend humans and other non-elves. Snowcaster clans vary in
      their acceptance of these children, but the average clan’s seclusion from
      humanity and inability to understand half-elves almost invariably ends up
      driving the snowborn away. Twilight speakers, however, tend to enjoy a
      particularly close relationship with their snowborn children, and the two
      groups often wander together. Snowborn have their elven parents’ snowy
      white skin and particularly sharp ears. Some Snowcaster half-elves find
      welcome homes among the Jadwiga and Ulfen communities, as well as the
      Erutaki tribes. Others wander, looking for a permanent place to
      belong.</p>
