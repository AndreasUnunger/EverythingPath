      <p><strong>Race</strong>: Half-Elf<br /><strong>Replaced
      Trait(s)</strong>: Elven Immunities</p><hr /><p>Half-elves who strive to
      embody the culture in which they live develop a keen instinct for the ebb
      and flow of fashions, fads, and political trends. They gain a +2 racial
      bonus on Knowledge (history) and Knowledge (local) checks and can use
      those skills untrained even for checks with a DC of 10 or more. This
      racial trait replaces elven immunities.</p>
