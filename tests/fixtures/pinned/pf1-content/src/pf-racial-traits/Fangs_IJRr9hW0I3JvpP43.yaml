    value: >-
      <p><strong>Race</strong>: Dhampir<br /><strong>Replaced Trait(s)</strong>:
      Spell-Like Ability</p><hr /><p>On occasion, a dhampir may inherit his
      father's lengthy canines. Whenever the dhampir makes a grapple combat
      maneuver check to damage an opponent, he can choose to bite his opponent,
      dealing 1d3 points of damage as if using a natural bite attack. As a
      standard action, the dhampir can bite a creature that is bound, helpless,
      paralyzed, or similarly unable to defend itself. This racial trait
      replaces the spell-like ability racial trait.</p>
