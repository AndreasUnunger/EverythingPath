  description:
    value: >-
      <p><strong>Race</strong>: Undine<br /><strong>Replaced Trait(s)</strong>:
      Spell-Like Ability</p><hr /><p>Undines whose outsider heritage can be
      traced to a water mephit can wield acid as a weapon. Such an undine has a
      breath weapon that is a @Distance[5 ft;dual] cone of acidic water usable
      once per day. The breath deals 1d8 points of acid damage per two character
      levels (maximum 5d8). A Reflex saving throw (DC 10 + 1/2 the undine's
      level + the undine's Constitution modifier) halves the damage. This racial
      trait replaces the spell-like ability racial trait.</p>
