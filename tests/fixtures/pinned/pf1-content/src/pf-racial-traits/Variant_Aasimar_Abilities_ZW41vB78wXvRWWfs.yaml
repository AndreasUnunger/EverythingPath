folder: PZxrk9JzfGnFGo9P
img: systems/pf1/icons/races/aasimar.png
name: Variant Aasimar Abilities
system:
  description:
    instructions: >-
      <p>You must determine the option and update your actor manually for this
      trait. If you roll the optional table is available here:
      @UUID[Compendium.pf1.roll-tables.RollTable.DvTUMvi8KRERLBNb]{Variant
      Aasimar Abilities}</p>
    value: >-
      <p><strong>Race</strong>: Aasimar<br /><strong>Replaced Trait(s)</strong>:
      Spell-Like Ability</p><hr /><p>Some aasimars are blessed or cursed with
      unusual abilities. GMs may customize their aasimar NPCs using the
      following chart, or allow their players to do so by rolling a d%. Players
      with a particular character concept in mind may consult their GM if they
      want to select a specific variant ability. The abilities presented here
      replace an aasimar's spelllike ability racial trait. Any abilities that
      grant spells or spell-like abilities are treated as having a caster level
      equal to the aasimar's character level.</p><table><tbody><tr><td
      data-colwidth="444"><p><strong>d%</strong></p></td><td
      data-colwidth="692"><p><strong>Abilities</strong></p></td></tr><tr><td
      data-colwidth="444"><p>1</p></td><td data-colwidth="692"><p>You can
      channel 1d6 points of positive energy once per day as a supernatural
      ability.</p></td></tr><tr><td data-colwidth="444"><p>2</p></td><td
      data-colwidth="692"><p>You can use <em>cure minor wounds</em> 3/day as a
      spell-like ability.</p></td></tr><tr><td
      data-colwidth="444"><p>3</p></td><td data-colwidth="692"><p>As a move
      action, you can manifest or dismiss a halo around your head that sheds
      colored light as a torch.</p></td></tr><tr><td
      data-colwidth="444"><p>4</p></td><td data-colwidth="692"><p>Once per day,
      you can drink a flask of holy water to heal 1d6 hit
      points.</p></td></tr><tr><td data-colwidth="444"><p>5</p></td><td
      data-colwidth="692"><p>You gain a +4 racial bonus on Knowledge (religion)
      checks pertaining to a deity of your choice.</p></td></tr><tr><td
      data-colwidth="444"><p>6</p></td><td data-colwidth="692"><p>You possess
      taloned fingers that act as natural weapons and deal 1d4 points of
      damage.</p></td></tr><tr><td data-colwidth="444"><p>7</p></td><td
      data-colwidth="692"><p>You gain DR 2/evil.</p></td></tr><tr><td
      data-colwidth="444"><p>8</p></td><td data-colwidth="692"><p>You use your
      Charisma score instead of your Constitution score to determine how many
      rounds you can hold your breath.</p></td></tr><tr><td
      data-colwidth="444"><p>9</p></td><td data-colwidth="692"><p>You gain an
      additional +2 racial bonus to your Strength score.</p></td></tr><tr><td
      data-colwidth="444"><p>10</p></td><td data-colwidth="692"><p>You can
      subsist entirely on honey and wine.</p></td></tr><tr><td
      data-colwidth="444"><p>11</p></td><td data-colwidth="692"><p>You can
      breathe both thin and stale air without ill effects, and you never suffer
      from altitude sickness.</p></td></tr><tr><td
      data-colwidth="444"><p>12</p></td><td data-colwidth="692"><p>You have a
      natural swim speed of @Distance[20 ft;dual].</p></td></tr><tr><td
      data-colwidth="444"><p>13</p></td><td data-colwidth="692"><p>You gain a +2
      racial bonus on attack rolls made to confirm critical hits against evil
      outsiders.</p></td></tr><tr><td data-colwidth="444"><p>14</p></td><td
      data-colwidth="692"><p>You possess the unnatural aura universal monster
      ability, except the DC to make animals come near you is equal to 10 + 1/2
      your character level + your Charisma modifier.</p></td></tr><tr><td
      data-colwidth="444"><p>15</p></td><td data-colwidth="692"><p>Once per day,
      when you are at 0 hit points, you can take a full round of actions without
      losing a hit point and falling unconscious.</p></td></tr><tr><td
      data-colwidth="444"><p>16</p></td><td data-colwidth="692"><p>You display
      exceptional grace and easily keep your balance. You gain a +2 racial bonus
      on Acrobatics checks.</p></td></tr><tr><td
      data-colwidth="444"><p>17</p></td><td data-colwidth="692"><p>You can cast
      @UUID[Compendium.pf1.spells.Item.ccklt2ehmeacsojx]{spear of purity} once
      per day as a spell-like ability.</p></td></tr><tr><td
      data-colwidth="444"><p>18</p></td><td data-colwidth="692"><p>You gain a +2
      racial bonus on saving throws made against poison.</p></td></tr><tr><td
      data-colwidth="444"><p>19</p></td><td data-colwidth="692"><p>Once you've
      reached adulthood, you never appear to age, although you take aging
      penalties normally and die when it is your time.</p></td></tr><tr><td
      data-colwidth="444"><p>20</p></td><td data-colwidth="692"><p>You gain an
      additional +2 racial bonus to your Dexterity score.</p></td></tr><tr><td
      data-colwidth="444"><p>21</p></td><td data-colwidth="692"><p>You can
      manipulate any metal armor you wear, causing it to appear to be made of
      shining silver or gold. This illusion lasts only as long as you wear your
      armor.</p></td></tr><tr><td data-colwidth="444"><p>22</p></td><td
      data-colwidth="692"><p>You gain a +1 racial bonus on Will
      saves.</p></td></tr><tr><td data-colwidth="444"><p>23</p></td><td
      data-colwidth="692"><p>You can cast
      @UUID[Compendium.pf1.spells.Item.snj78r5rw96btfjn]{create water} three
      times per day as a spell-like ability.</p></td></tr><tr><td
      data-colwidth="444"><p>24</p></td><td data-colwidth="692"><p>You gain
      sonic resistance 5.</p></td></tr><tr><td
      data-colwidth="444"><p>25</p></td><td data-colwidth="692"><p>Once per day,
      you can exhibit a burst of speed, moving as if your base land speed were
      @Distance[50 ft;dual] for 1 round.</p></td></tr><tr><td
      data-colwidth="444"><p>26</p></td><td data-colwidth="692"><p>You gain a +2
      dodge bonus to AC against attacks of opportunity made by creatures of the
      human subtype.</p></td></tr><tr><td data-colwidth="444"><p>27</p></td><td
      data-colwidth="692"><p>You have a knack for creating high-quality objects.
      You gain a +2 racial bonus on any one kind of Craft
      check.</p></td></tr><tr><td data-colwidth="444"><p>28</p></td><td
      data-colwidth="692"><p>Once per day, for 1 minute, you can understand and
      be understood by any creature as though using
      @UUID[Compendium.pf1.spells.Item.m1rmcpcaixcpz9ib]{tongues}.</p></td></tr><tr><td
      data-colwidth="444"><p>29</p></td><td data-colwidth="692"><p>You gain a +2
      racial bonus on initiative checks during the day.</p></td></tr><tr><td
      data-colwidth="444"><p>30</p></td><td data-colwidth="692"><p>Pick one
      weapon that normally deals lethal damage. You can deal nonlethal damage
      with that weapon without the usual -4 penalty on your attack
      rolls.</p></td></tr><tr><td data-colwidth="444"><p>31</p></td><td
      data-colwidth="692"><p>You gain a +2 racial bonus on saving throws against
      charm effects.</p></td></tr><tr><td data-colwidth="444"><p>32</p></td><td
      data-colwidth="692"><p>You can cast
      @UUID[Compendium.pf1.spells.Item.menqakfoa1ftvi3f]{shield other} once per
      day as a spell-like ability.</p></td></tr><tr><td
      data-colwidth="444"><p>33</p></td><td data-colwidth="692"><p>When coins or
      other small metal objects pass through your hands, they become perfectly
      clean and shiny again.</p></td></tr><tr><td
      data-colwidth="444"><p>34</p></td><td data-colwidth="692"><p>You gain a +2
      dodge bonus to your AC against attacks of opportunity from evil outsiders
      or undead.</p></td></tr><tr><td data-colwidth="444"><p>35</p></td><td
      data-colwidth="692"><p>You can cast
      @UUID[Compendium.pf1.spells.Item.ibk7jrc5rwubpia6]{aid} once per day as a
      spell-like ability.</p></td></tr><tr><td
      data-colwidth="444"><p>36</p></td><td data-colwidth="692"><p>Nonmagical
      insects never bite or sting you unless magically compelled to do
      so.</p></td></tr><tr><td data-colwidth="444"><p>37</p></td><td
      data-colwidth="692"><p>You gain a +2 racial bonus on checks made with any
      one Perform skill.</p></td></tr><tr><td
      data-colwidth="444"><p>38</p></td><td data-colwidth="692"><p>Once per day,
      you can generate a glowing aura that emanates in a @Distance[20 ft;dual]
      radius centered on you. Any creature within the aura that is at negative
      hit points stabilizes immediately. The aura lasts for 1
      round.</p></td></tr><tr><td data-colwidth="444"><p>39</p></td><td
      data-colwidth="692"><p>You can mimic the sound of any animal
      perfectly.</p></td></tr><tr><td data-colwidth="444"><p>40</p></td><td
      data-colwidth="692"><p>You gain an additional +2 racial bonus to your
      Intelligence score.</p></td></tr><tr><td
      data-colwidth="444"><p>41</p></td><td data-colwidth="692"><p>Three times
      per day, you can sing for 10 minutes to put one willing creature to sleep.
      Any creature that falls asleep to the sound of your song is protected from
      nightmare and similar spells for the duration of its
      rest.</p></td></tr><tr><td data-colwidth="444"><p>42</p></td><td
      data-colwidth="692"><p>Whenever you successfully use the aid another
      action to help someone make a skill check, you grant a +3 bonus instead of
      +2.</p></td></tr><tr><td data-colwidth="444"><p>43</p></td><td
      data-colwidth="692"><p>You gain a +2 racial bonus on saving throws made
      against fear effects.</p></td></tr><tr><td
      data-colwidth="444"><p>44</p></td><td data-colwidth="692"><p>If you stand
      atop a grave and meditate for 10 minutes, you learn the name of whoever
      lies buried below.</p></td></tr><tr><td
      data-colwidth="444"><p>45</p></td><td data-colwidth="692"><p>You have
      catlike ears that grant you a +2 racial bonus on hearing-based Perception
      checks.</p></td></tr><tr><td data-colwidth="444"><p>46</p></td><td
      data-colwidth="692"><p>Once per day, you can breathe frosty air in a
      @Distance[10 ft;dual] cone. This acts as a breath weapon that deals a
      number of points of cold damage equal to 1d4 + 1/2 your level, to a
      maximum of 1d4+5.</p></td></tr><tr><td
      data-colwidth="444"><p>47</p></td><td data-colwidth="692"><p>You feel sick
      to your stomach and take a -1 penalty on ability checks when within
      @Distance[30 ft;dual] of an evil outsider.</p></td></tr><tr><td
      data-colwidth="444"><p>48</p></td><td data-colwidth="692"><p>You can cast
      @UUID[Compendium.pf1.spells.Item.hlom4mgjkdy2dd5u]{weapon of awe} once per
      day as a spell-like ability.</p></td></tr><tr><td
      data-colwidth="444"><p>49</p></td><td data-colwidth="692"><p>You gain a +1
      racial bonus on Reflex saves.</p></td></tr><tr><td
      data-colwidth="444"><p>50</p></td><td data-colwidth="692"><p>You gain an
      additional +2 racial bonus to your Wisdom score.</p></td></tr><tr><td
      data-colwidth="444"><p>51</p></td><td data-colwidth="692"><p>You can make
      fruit ripen with a touch.</p></td></tr><tr><td
      data-colwidth="444"><p>52</p></td><td data-colwidth="692"><p>You can
      understand any written material as though under the effects of
      @UUID[Compendium.pf1.spells.Item.jcs7ba5depdyitey]{comprehend
      languages}.</p></td></tr><tr><td data-colwidth="444"><p>53</p></td><td
      data-colwidth="692"><p>You gain a +2 racial bonus to your
      CMD.</p></td></tr><tr><td data-colwidth="444"><p>54</p></td><td
      data-colwidth="692"><p>You gain a +2 racial bonus on saving throws against
      spells and effects that would cause you to become
      dazzled.</p></td></tr><tr><td data-colwidth="444"><p>55</p></td><td
      data-colwidth="692"><p>You can cast
      @UUID[Compendium.pf1.spells.Item.d1wxnax51cecplm4]{augury} once per day as
      a spell-like ability.</p></td></tr><tr><td
      data-colwidth="444"><p>56</p></td><td data-colwidth="692"><p>You can cast
      @UUID[Compendium.pf1.spells.Item.snspotd2cno49ed5]{zone of truth} once per
      day as a spell-like ability.</p></td></tr><tr><td
      data-colwidth="444"><p>57</p></td><td data-colwidth="692"><p>You gain a +2
      racial bonus on Heal checks.</p></td></tr><tr><td
      data-colwidth="444"><p>58</p></td><td data-colwidth="692"><p>Any creature
      that bites you must succeed at a DC 12 Fortitude save or become sickened
      for 1d4 rounds.</p></td></tr><tr><td data-colwidth="444"><p>59</p></td><td
      data-colwidth="692"><p>Any good creature you call via summon monster
      remains for 3 rounds longer than usual.</p></td></tr><tr><td
      data-colwidth="444"><p>60</p></td><td data-colwidth="692"><p>You always
      know the current position of the sun.</p></td></tr><tr><td
      data-colwidth="444"><p>61</p></td><td data-colwidth="692"><p>You gain a +1
      racial bonus on attack and damage rolls against evil
      outsiders.</p></td></tr><tr><td data-colwidth="444"><p>62</p></td><td
      data-colwidth="692"><p>You gain a +4 racial bonus on saving throws to
      remove any temporary negative levels you possess.</p></td></tr><tr><td
      data-colwidth="444"><p>63</p></td><td data-colwidth="692"><p>You have a
      strong and stable build. You gain a +2 racial bonus to CMD against bull
      rush and trip attempts.</p></td></tr><tr><td
      data-colwidth="444"><p>64</p></td><td data-colwidth="692"><p>You gain a +4
      racial bonus on Intimidate checks made to demoralize
      foes.</p></td></tr><tr><td data-colwidth="444"><p>65</p></td><td
      data-colwidth="692"><p>Once per day as a full-round action, you can summon
      a silver holy symbol out of thin air. The holy symbol remains in existence
      for 1 hour or until you drop it.</p></td></tr><tr><td
      data-colwidth="444"><p>66</p></td><td data-colwidth="692"><p>You are
      immune to undead creatures' create spawn special
      ability.</p></td></tr><tr><td data-colwidth="444"><p>67</p></td><td
      data-colwidth="692"><p>You gain a +2 racial bonus on Sense Motive
      checks.</p></td></tr><tr><td data-colwidth="444"><p>68</p></td><td
      data-colwidth="692"><p>You can cast
      @UUID[Compendium.pf1.spells.Item.v8czhud6wpmc9esu]{whispering wind} once
      per day as a spell-like ability.</p></td></tr><tr><td
      data-colwidth="444"><p>69</p></td><td data-colwidth="692"><p>Your tears
      cure disease. You can cast
      @UUID[Compendium.pf1.spells.Item.ocbjt6z7amc3yn8w]{remove disease} once
      per day as a spell-like ability.</p></td></tr><tr><td
      data-colwidth="444"><p>70</p></td><td data-colwidth="692"><p>You gain an
      additional +2 racial bonus to your Constitution
      score.</p></td></tr><tr><td data-colwidth="444"><p>71</p></td><td
      data-colwidth="692"><p>You gain sustenance from sunlight. Standing in
      direct sunlight for half an hour nourishes you as though you had just
      eaten a hearty meal. You still need to drink water.</p></td></tr><tr><td
      data-colwidth="444"><p>72</p></td><td data-colwidth="692"><p>You gain
      spell resistance equal to 10 + 1/2 your Hit Dice.</p></td></tr><tr><td
      data-colwidth="444"><p>73</p></td><td data-colwidth="692"><p>If your body
      is placed on consecrated ground and prayers to your deity are recited
      continuously for 24 hours, you return to life as if by a
      @UUID[Compendium.pf1.spells.Item.c5anior2ysy6s2xy]{raise dead} spell. This
      ability works 1d4 times in your lifetime.</p></td></tr><tr><td
      data-colwidth="444"><p>74</p></td><td data-colwidth="692"><p>Your kiss
      invigorates others. Once per day, you can kiss a creature to change its
      condition from exhausted to fatigued, or from fatigued to
      normal.</p></td></tr><tr><td data-colwidth="444"><p>75</p></td><td
      data-colwidth="692"><p>You can sense when a creature is pregnant by
      standing within 10 feet of the creature.</p></td></tr><tr><td
      data-colwidth="444"><p>76</p></td><td data-colwidth="692"><p>You gain a +2
      racial bonus on saving throws made against curses.</p></td></tr><tr><td
      data-colwidth="444"><p>77</p></td><td data-colwidth="692"><p>You gain a +2
      racial bonus on Knowledge (planes) checks.</p></td></tr><tr><td
      data-colwidth="444"><p>78</p></td><td data-colwidth="692"><p>You are
      always comfortably warm. You gain a +4 racial bonus to resist
      environmental cold effects.</p></td></tr><tr><td
      data-colwidth="444"><p>79</p></td><td data-colwidth="692"><p>You always
      know the current position of the stars.</p></td></tr><tr><td
      data-colwidth="444"><p>80</p></td><td data-colwidth="692"><p>You gain fire
      resistance 5.</p></td></tr><tr><td data-colwidth="444"><p>81</p></td><td
      data-colwidth="692"><p>You heal double the normal amount of hit points
      while resting.</p></td></tr><tr><td data-colwidth="444"><p>82</p></td><td
      data-colwidth="692"><p>You can cast
      @UUID[Compendium.pf1.spells.Item.24zg8a05hqum3e6j]{mending} three times
      per day as a spell-like ability.</p></td></tr><tr><td
      data-colwidth="444"><p>83</p></td><td data-colwidth="692"><p>You feel
      energized and gain a +1 racial bonus on ability checks while you are
      within @Distance[30 ft;dual] of a good outsider.</p></td></tr><tr><td
      data-colwidth="444"><p>84</p></td><td data-colwidth="692"><p>You gain a +4
      racial bonus to resist environmental heat effects.</p></td></tr><tr><td
      data-colwidth="444"><p>85</p></td><td data-colwidth="692"><p>When targeted
      by <em>@UUID[Compendium.pf1.spells.Item.fxz69pwpqt9b6uss]{lesser
      restoration}</em> or another spell or effect that cures temporary ability
      damage, you heal an extra +1 point of temporary ability
      damage.</p></td></tr><tr><td data-colwidth="444"><p>86</p></td><td
      data-colwidth="692"><p>You can cast
      @UUID[Compendium.pf-content.pf-buffs.Item.93oIrx2wLSx0jMkM]{blessing of
      courage and life} once per day as a spell-like
      ability.</p></td></tr><tr><td data-colwidth="444"><p>87</p></td><td
      data-colwidth="692"><p>You gain a +2 racial bonus on Handle Animal and
      Ride checks.</p></td></tr><tr><td data-colwidth="444"><p>88</p></td><td
      data-colwidth="692"><p>Once per day as a move action, you can make a melee
      weapon you are wielding
      @UUID[Compendium.pf-content.pf-special-qualities.Item.RjT3gEYZJmHsPhJI]{holy}.
      The enchantment lasts for 3 rounds or until you drop or give away your
      weapon.</p></td></tr><tr><td data-colwidth="444"><p>89</p></td><td
      data-colwidth="692"><p>You gain a +2 racial bonus on saving throws made
      against disease.</p></td></tr><tr><td
      data-colwidth="444"><p>90</p></td><td data-colwidth="692"><p>You gain an
      additional +2 racial bonus to your Charisma score.</p></td></tr><tr><td
      data-colwidth="444"><p>91</p></td><td data-colwidth="692"><p>If you die,
      your body can never be reanimated as an undead
      creature.</p></td></tr><tr><td data-colwidth="444"><p>92</p></td><td
      data-colwidth="692"><p>You gain a +1 racial bonus on Fortitude
      saves.</p></td></tr><tr><td data-colwidth="444"><p>93</p></td><td
      data-colwidth="692"><p>You can summon a Lantern Archon once per day as
      though by <em>@UUID[Compendium.pf1.spells.Item.1zmn8vqy3s5l9kiv]{summon
      monster III}</em>.</p></td></tr><tr><td
      data-colwidth="444"><p>94</p></td><td data-colwidth="692"><p>You can speak
      to horses and other equine animals.</p></td></tr><tr><td
      data-colwidth="444"><p>95</p></td><td data-colwidth="692"><p>You gain a +2
      racial bonus on Diplomacy checks.</p></td></tr><tr><td
      data-colwidth="444"><p>96</p></td><td data-colwidth="692"><p>You gain a +2
      racial bonus on Use Magic Device checks.</p></td></tr><tr><td
      data-colwidth="444"><p>97</p></td><td data-colwidth="692"><p>You gain DR
      2/magic.</p></td></tr><tr><td data-colwidth="444"><p>98</p></td><td
      data-colwidth="692"><p>You can cast
      @UUID[Compendium.pf1.spells.Item.xwudq0udiudu4v8g]{compassionate ally}
      once per day as a spell-like ability.</p></td></tr><tr><td
      data-colwidth="444"><p>99</p></td><td data-colwidth="692"><p>You have a
      natural fly speed of @Distance[20 ft;dual] (poor).</p></td></tr><tr><td
      data-colwidth="444"><p>100</p></td><td data-colwidth="692"><p>Roll on this
      table twice, ignoring any further rolls of
      100.</p></td></tr></tbody></table><p></p>
  sources:
    - id: PZO9424
      pages: '18'
  subType: racial
  tags:
    - Aasimar
type: feat
