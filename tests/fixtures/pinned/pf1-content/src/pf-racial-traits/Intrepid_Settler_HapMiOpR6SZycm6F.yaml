      <p><strong>Race</strong>: Gnome<br /><strong>Replaced Trait(s)</strong>:
      Illusion Resistance, Keen Senses, Obsessive</p><hr /><p>Some gnomes add to
      the thrill of living by settling in precarious places such as the flotsam
      of Gogpodda or the treehouses of Omesta. These intrepid gnomes gain a +2
