name: Half-Drow (Darkborn)
system:
  description:
    value: >-
      <p><strong>Race</strong>: Half-Elf<br /><strong>Replaced
      Trait(s)</strong>: Base Statistics</p><hr /><p>Brutalized from birth,
      half­-drow are the lowest of the low in drow society, and often grow up to
      be pitiless, hateful beings.</p><p><strong>Elven Ancestry</strong> Drow<br
      /><strong>Human Ancestry</strong> Any<br /><strong>Regions
      </strong>Sekamina (the Darklands)<br /><strong>Languages </strong>Elven,
      Undercommon</p><p>Scorned by both drow, who call them thinbloods, and
      humans, who call them darkborn, half-drow face discrimination and
      tribulation from an early age. Those half-drow who are not crushed by
      persecution are forced to age into particularly strong and independent
      adults. Some give into bitterness from their upbringing, becoming hardened
      assassins or wanton killers. Others deliberately rebel against their
      brutal childhoods, becoming righteous warriors against evil. Either way,
      half-drow fight fiercely to the very last. Darkborn have the gray skin and
      light-colored hair of the drow but have human-looking eyes, and they have
      a more difficult time appearing fully elven or human than most half-elves
      do.</p>
