name: Weapon Familiarity
system:
  description:
    instructions: >-
      <p>Update the details tab of this trait with each weapon with which this
      trait grants proficiency.</p>
    value: >-
      <p><strong>Special</strong>: This trait can be taken up to two times. The
      second time it is taken, the race becomes proficient with another two
      weapons or one weapon and a racial weapon group.</p><hr /><p>Choose up to
      two weapons, or one weapon and a racial weapon group. When choosing a
      racial weapon group, you must choose a group that includes the same name
      as one of your subtypes. Members of this race are proficient with those
      weapons. For the purposes of weapon familiarity, all bows are considered
      one weapon.</p>
