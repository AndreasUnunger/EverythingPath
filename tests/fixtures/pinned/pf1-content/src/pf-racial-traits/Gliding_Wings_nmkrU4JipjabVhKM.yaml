  description:
    value: >-
      <p>Members of this race take no damage from falling (as if subject to a
      constant nonmagical
      @UUID[Compendium.pf1.spells.Item.68m9du7zw2di7ew6]{feather fall} spell).
      While in midair, members of this race can move up to @Distance[5 ft;dual]
      in any horizontal direction for every @Distance[1 ft;dual] they fall, at a
      speed of @Distance[60 ft;dual] per round. A member of a race with gliding
      wings cannot gain height with these wings alone; it merely coasts in other
      directions as it falls. If subjected to a strong wind or any other effect
      that causes a creature with gliding wings to rise, it can take advantage
      of the updraft to increase the distance it can glide.</p>
