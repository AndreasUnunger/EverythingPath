name: Adoptive Parentage (Weapon Familiarity)
system:
  description:
    instructions: >-
      <p>Select one humanoid race without the human subtype when you select this
      racial trait.  Update the Granted Proficiencies&gt;Languages section of
      the details tab of this trait to reflect this choice's
      languages.</p><p><strong>Special Note: </strong>There are three versions
      of this trait, the other two versions are linked here for reference
      @UUID[Compendium.pf-content.pf-racial-traits.Item.7g3F8YEFDlNPiGkA]{Adoptive
      Parentage (Weapon Focus)}
      @UUID[Compendium.pf-content.pf-racial-traits.Item.3o1rw23ElDPjD5FE]{Adoptive
      Parentage (Skill Focus)}</p><p>This version assumes you selected an
      adoptive race that has a "weapon familiarity" racial trait.</p><p>Add the
      weapon familiarity racial trait of your chosen race to your actor.</p>
    value: >-
      <p><strong>Race</strong>: Human<br /><strong>Replaced Trait(s)</strong>:
      Bonus Feat</p><hr /><p>Humans are sometimes orphaned and adopted by other
      races. Choose one humanoid race without the human subtype. You start play
      with that race's languages and gain that race's weapon familiarity racial
      trait (if any). If the race does not have weapon familiarity, you gain
      either Skill Focus or Weapon Focus as a bonus feat that is appropriate for
      that race instead. This racial trait replaces the bonus feat trait.</p>
