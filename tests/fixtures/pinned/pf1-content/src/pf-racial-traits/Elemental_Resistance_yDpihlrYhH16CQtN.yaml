  description:
    instructions: >-
      <p>Choose <span style="font-family: Signika, sans-serif">acid, cold,
      electricity, or fire. you must </span>add resistance 5 of the chosen type
      to attributes tab of your actor manually.  Update the context note on the
      changes tab of this trait to match your chosen type.</p>
    value: >-
      <p><strong>Race</strong>: Elf<br /><strong>Replaced Trait(s)</strong>:
      Elven Immunities</p><hr /><p>Elves who dwell in the most extreme
      environments, from arctic wastelands to volcanic plains, develop natural
      resistance to the dangers of their homelands over the course of a few
      generations. Elves with this racial trait gain elemental resistance 5 to
      acid, cold, electricity, or fire. This choice is made at character
      creation, and once made it cannot be changed. This racial trait replaces
      elven immunities.</p>
