  description:
    value: >-
      <p><strong>Race</strong>: Half-Orc<br /><strong>Replaced
      Trait(s)</strong>: Intimidating, Orc Ferocity</p><hr /><p>Half-orcs are
      sometimes forced to live on the rancid and unsanitary margins of society,
      becoming inured to all manner of sickness. Half-orcs with this racial
      trait gain a +2 racial bonus on saving throws against disease, ingested
      poisons, and becoming nauseated or sickened. This racial trait replaces
      the intimidating and orc ferocity racial traits.</p>
