name: Spell-Like Ability, At-Will
system:
  abilityType: sp
  description:
    instructions: >-
      <p>Once you have chosen a spell, add an action to this trait via the
      details tab and set the spells parameters within the action.  You may wish
      to include a link to the spell with the action for ease of use.</p>
    value: >-
      <p><strong>Special</strong>: This trait costs as many RP as twice the
      level of spell chosen (minimum 2). Up to five spells can be chosen when
      you take this trait. Each time you take an additional spell, adjust the RP
      cost of this trait appropriately.</p><hr /><p>Choose a 3rd-level or lower
      spell that does not attack a creature or deal damage. Members of this race
      can use this spell as an at-will spell-like ability. The caster level of
      the spell is equal to the user’s character level. </p>
