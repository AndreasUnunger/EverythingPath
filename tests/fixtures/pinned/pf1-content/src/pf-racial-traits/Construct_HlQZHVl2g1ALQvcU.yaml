    - target: fort
      text: >-
        Immune to any effect that requires a Fortitude save (unless the effect
        also works on objects or is harmless).

        This includes death from massive damage. (but are destroyed immediately
        when reduced to zero hp or below)
    - target: allSavingThrows
      text: >-
        Immune to all mind-affecting effects (charms, compulsions, morale
        effects, patterns, and phantasms).

        Not subject to ability damage, ability drain, fatigue, exhaustion,
        energy drain, or nonlethal damage.
