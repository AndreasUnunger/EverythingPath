  description:
    value: >-
      <p><strong>Race</strong>: Grippli<br /><strong>Replaced Trait(s)</strong>:
      Swamp Stride, Camouflage</p><hr /><p>Once per day as a swift action, a
      grippli can create a poison that can be applied to a weapon or delivered
      as a touch attack. Alternatively, the grippli can smear the poison on its
      own body as a standard action, affecting the first creature to hit it with
      an unarmed strike or natural weapon. The poison loses its potency after 1
      hour. The grippli is immune to its own poison. This racial trait replaces
      swamp stride and camouflage.</p><p>  <i>Grippli Poison</i>: Skin or
      weapon-contact or injury; <i>save </i>Fort DC 10 + 1/2 the grippli's Hit
      Dice plus its Constitution modifier; <i>frequency </i>1/round for 6
      rounds; <i>effect </i>1d2 Dexterity damage; <i>cure </i>1 save.</p>
