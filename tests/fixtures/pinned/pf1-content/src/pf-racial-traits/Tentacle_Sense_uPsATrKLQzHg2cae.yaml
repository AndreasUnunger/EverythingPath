      <p><strong>Race</strong>: Cecaelia</p><hr /><p>While swimming and not
      grappled or grappling, a cecaelia can spread her tentacles wide to form a
      sensory net around herself as a swift action. This grants blindsight to a
      range of @Distance[10 ft;dual] and lasts as long as the cecaelia
      concentrates or until the cecaelia attacks with a tentacle or
      moves.</p><p><strong>Related buff: </strong>@Toggle[Tentacle Sense]</p>
