  description:
    value: >-
      <p><strong>Race</strong>: Dhampir<br /><strong>Replaced Trait(s)</strong>:
      Manipulative</p><hr /><p>Though dhampirs often relate poorly to humanoids,
      some share an affinity with baser creatures. These dhampirs gain the
      ability to communicate with bats, rats, and wolves as if under the effects
      of a <i>speak with animals </i>spell (caster level equal to 1/2 the
      dhampir's Hit Dice). In addition, they gain a +2 racial bonus on Diplomacy
      checks when dealing with these animals. Whenever these dhampirs initiate
      an exchange, animals begin with a starting attitude of indifferent. This
      is a supernatural ability. This racial trait replaces manipulative.</p>
