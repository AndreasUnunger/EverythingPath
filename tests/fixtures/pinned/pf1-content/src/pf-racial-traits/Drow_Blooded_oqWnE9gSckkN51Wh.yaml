    value: >-
      <p><strong>Race</strong>: Half-Elf<br /><strong>Replaced
      Trait(s)</strong>: Low-Light Vision</p><hr /><p>Some half-elves born of
      drow parents exhibit more drow traits than others-particularly many of the
      physical features of the drow-and have darkvision @Distance[60 ft;dual]
      and light blindness. This racial trait replaces the low-light vision
      racial trait.</p>
