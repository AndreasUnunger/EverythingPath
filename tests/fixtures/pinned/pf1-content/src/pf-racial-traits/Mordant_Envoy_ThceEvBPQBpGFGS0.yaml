name: Mordant Envoy
system:
  actions:
    - _id: V8XU9TJxOIVfJomi
      activation:
        type: standard
        unchained:
          cost: 2
          type: action
      description: >-
        <p>If you have a Charisma score of 11 or higher you gain:
        @UUID[Compendium.pf1.spells.Item.jcs7ba5depdyitey]{Comprehend
        languages}, </p><p>You can understand the spoken words of creatures or
        read otherwise incomprehensible written messages. The ability to read
        does not necessarily impart insight into the material, merely its
        literal meaning. The spell enables you to understand or read an unknown
        language, not speak or write it.</p><p>Written material can be read at
        the rate of one page (250 words) per minute. Magical writing cannot be
        read, though the spell reveals that it is magical. This spell can be
        foiled by certain warding magic (such as the secret page and illusory
        script spells). It does not decipher codes or reveal messages concealed
        in otherwise normal text.</p><p>Comprehend languages can be made
        permanent with a permanency spell.</p>
      duration:
        units: minute
        value: '@attributes.hd.total * 10'
      name: Comprehend Languages
      target:
        value: You
      uses:
        self:
          maxFormula: gte(@abilities.cha.total, 11)
          per: day
          value: 1
    - _id: EOpcbNPqxpKgS5Ya
      activation:
        type: standard
        unchained:
          cost: 2
          type: action
      area: cone-shaped emanation
      description: >-
        <p>If you have a Charisma score of 11 or higher you gain:
        @UUID[Compendium.pf1.spells.Item.moftgchcn1d0p2t0]{detect secret
        doors},</p><p>You can detect secret doors, compartments, caches, and so
        forth. Only passages, doors, or openings that have been specifically
        constructed to escape detection are detected by this spell. The amount
        of information revealed depends on how long you study a particular area
        or subject.</p><p>1st Round: Presence or absence of secret
        doors.</p><p>2nd Round: Number of secret doors and the location of each.
        If an aura is outside your line of sight, then you discern its direction
        but not its exact location.</p><p>Each Additional Round: The mechanism
        or trigger for one particular secret portal closely examined by you.
        Each round, you can turn to detect secret doors in a new area. The spell
        can penetrate barriers, but @Distance[1 ft;dual] of stone, 1 inch of
        common metal, a thin sheet of lead, or @Distance[3 ft;dual] of wood or
        dirt blocks it.</p>
      duration:
        concentration: true
        units: minute
        value: '@attributes.hd.total'
      name: Detect Secret Doors
      range:
        units: spec
        value: 60 ft (18 m)
      uses:
        self:
          maxFormula: gte(@abilities.cha.total, 11)
          per: day
          value: 1
    - _id: YyU0PVjDQRjJm0R3
      activation:
        type: standard
        unchained:
          cost: 2
          type: action
      description: >-
        <p>If you have a Charisma score of 11 or higher you gain:
        @UUID[Compendium.pf1.spells.Item.qvpzcjm5lmtn389j]{erase}, </p><p>Erase
        removes writings of either magical or mundane nature from a scroll or
        from one or two pages of paper, parchment, or similar surfaces. With
        this spell, you can remove explosive runes, a Glyph of Warding, a sepia
        snake sigil, or an arcane mark, but not illusory script or a symbol
        spell. Nonmagical writing is automatically erased if you touch it and no
        one else is holding it. Otherwise, the chance of erasing nonmagical
        writing is 90%. Magic writing must be touched to be erased, and you also
        must succeed on a caster level check (1d20 + caster level) against DC
        15. A natural 1 is always a failure on this check. If you fail to erase
        explosive runes, a Glyph of Warding, or a sepia snake sigil, you
        accidentally activate that writing instead.</p>
      name: Erase
      notes:
        effect:
          - Includes +1 CL provided by this trait
      range:
        units: ft
        value: floor((@attributes.hd.total + 1) / 2) *5 + 25
      uses:
        self:
          maxFormula: gte(@abilities.cha.total, 11)
          per: day
          value: 1
    - _id: Vs2tqXRKUq50UJmj
      activation:
        type: standard
        unchained:
          cost: 2
          type: action
      description: >-
        <p>If you have a Charisma score of 11 or higher you gain:
        @UUID[Compendium.pf1.spells.Item.j0bc0iii8zp1jiwr]{read
        magic}.</p><p>You can decipher magical inscriptions on objects-books,
        scrolls, weapons, and the like-that would otherwise be unintelligible.
        This deciphering does not normally invoke the magic contained in the
        writing, although it may do so in the case of a cursed or trapped
        scroll. Furthermore, once the spell is cast and you have read the
        magical inscription, you are thereafter able to read that particular
        writing without recourse to the use of read magic. You can read at the
        rate of one page (250 words) per minute. The spell allows you to
        identify a Glyph of Warding with a DC 13 Spellcraft check, a greater
        Glyph of Warding with a DC 16 Spellcraft check, or any symbol spell with
        a Spellcraft check (DC 10 + spell level).</p><p>Read magic can be made
        permanent with a permanency spell.</p>
      duration:
        units: minute
        value: '@attributes.hd.total * 10'
      name: Read Magic
      range:
        units: personal
      target:
        value: you
      uses:
        self:
          maxFormula: gte(@abilities.cha.total, 11)
          per: day
          value: 1
  changes:
    - _id: tYRMhIGy
      formula: '1'
      target: cl.school.trs
