  description:
    value: >-
      <p><strong>Race</strong>: Half-Elf (Spireborn only)<br /><strong>Replaced
      Trait(s)</strong>: Adaptability</p><hr
      /><p>@UUID[Compendium.pf-content.pf-racial-traits.Item.wQnT357k2EwEAT49]{Spireborn}
      add +1 to the caster level of any transmutation spells they cast.
      Spireborn with a Charisma score of 11 or higher also gain the following
      spell-like abilities: 1/day:
      @UUID[Compendium.pf1.spells.Item.jcs7ba5depdyitey]{Comprehend languages},
      @UUID[Compendium.pf1.spells.Item.moftgchcn1d0p2t0]{detect secret doors},
      @UUID[Compendium.pf1.spells.Item.qvpzcjm5lmtn389j]{erase}, and
      @UUID[Compendium.pf1.spells.Item.j0bc0iii8zp1jiwr]{read magic}. The caster
      level for these effects is equal to the Spireborn's character
      level.</p><p>This replaces adaptability.</p><p></p>
