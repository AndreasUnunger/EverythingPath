        unchained:
          cost: 2
          type: action
      area: 30 ft cone
      description: >-
        <p>Some fetchlings gain an upsetting gaze attack that they can activate
        three times per day as a standard action, affecting all creatures within
        a @Distance[30 ft;dual] cone that can see. All creatures that meet the
        fetchling's unnerving gaze are shaken for 1 round (DC = 10 + 1/2 the
        fetchling's character level + her Charisma modifier; Will negates). When
        the fetchling reaches 9th level, her gaze instead causes creatures to be
        staggered. When the fetchling reaches 13th level, her gaze instead
        causes creatures to be stunned. Unnerving gaze is a mind-affecting fear
        effect. This racial trait replaces the fetchling's spell-like
        abilities.</p>
