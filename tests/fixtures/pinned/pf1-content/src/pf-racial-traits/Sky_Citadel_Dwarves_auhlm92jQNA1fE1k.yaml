name: Sky Citadel Dwarves
system:
  description:
    value: >-
      <p><strong>Race</strong>: Dwarf<br /><strong>Replaced Trait(s)</strong>:
      Base Statistics</p><hr /><p>When the dwarves successfully completed the
      Quest for Sky, they set about constructing 10 Sky Citadels, massive
      fortresses that formed the basis for dwarven kingdoms in the Inner Sea
      region. While several of those Sky Citadels have been lost or overrun, a
      few-such as Highhelm, Janderhoff, and Dongun Hold-remain bastions of
      dwarven tradition and authority. Because these Sky Citadels often have
      connections to the Darklands, it is common for the dwarves dwelling in
      their lower reaches to have the
      @UUID[Compendium.pf-content.pf-racial-traits.Item.QdzlzrqWtgfjE4Fs]{Ancient
      Enmity} or
      @UUID[Compendium.pf-content.pf-racial-traits.Item.7LSKyC0eM1uQgBvm]{Deep
      Warrior} alternate racial traits, while those in lands populated by ogres
      and hill giants often have the
      @UUID[Compendium.pf-content.pf-racial-traits.Item.Xx0q0xnySBBY3OUr]{Giant
      Hunter} alternate racial trait, and those in wealthy areas that attract
      the attention of dragons sometimes have the
      @UUID[Compendium.pf-content.pf-racial-traits.Item.k3BZrtmbJvxCHeHt]{Sky
      Sentinel} or
      @UUID[Compendium.pf-content.pf-racial-traits.Item.nnyOoCfyIRKs3xcQ]{Wyrmscourged}
      alternate racial traits. Because of the eon-long histories of the Sky
      Citadels, their citizens also often have the
      @UUID[Compendium.pf-content.pf-racial-traits.Item.0732ZhCzO00426kM]{Deep
      Tradition} alternate racial trait.</p>
