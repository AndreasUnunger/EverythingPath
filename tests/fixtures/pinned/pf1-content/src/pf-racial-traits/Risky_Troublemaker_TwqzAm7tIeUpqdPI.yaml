  description:
    value: >-
      <p><strong>Race</strong>: Vanara<br /><strong>Replaced Trait(s)</strong>:
      Prehensile Tail</p><hr /><p>Vanara families who seek to emulate the Monkey
      King teach their members that unexpected opportunities are worth taking
      great risks. These vanaras can choose to roll twice on Use Magic Device
      checks. If they do, they take the higher result unless either die roll is
      a natural 1, in which case the check automatically fails. This racial
      trait replaces prehensile tail.</p>
