name: Ekujae Half-Elves (Wildborn)
system:
  description:
    value: >-
      <p><strong>Race</strong>: Half-Elf<br /><strong>Replaced
      Trait(s)</strong>: Base Statistics</p><hr /><p>Wild and passionate, the
      half-elven children of the Ekujae live hard lives and constantly strive to
      prove themselves to others.</p><p><strong>Elven Ancestry</strong> Ekujae
      elves<br /><strong>Human Ancestry</strong> Garundi, Keleshite, Mwangi<br
      /><strong>Regions </strong>Mwangi Expanse, northern Garund<br
      /><strong>Languages </strong>Elven, Kelish, Osiriani, Polyglot</p><p>The
      half-elves of the Mwangi Expanse have the dark skin of their Ekujae
      parents, but they tend to be closer in stature and build to their human
      parents, allowing wildborn to pass for human more easily than most of
      their fellow half-elves. These half-elves are equally at home in the wilds
      of the jungle or arranging trade deals in the larger Mwangi cities. While
      some Ekujae raise their wildborn children, others ritually turn over their
      half-elven offspring to specific half-elven villages within their Mwangi
      nation. The adult wildborn of these villages seek out and accept any of
      these children who might have fallen through the cracks, raising them with
      respect for both the wilderness and society. Even a few half-elves from
      other backgrounds travel to the Mwangi Expanse to join these villages,
      finding acceptance they can’t get anywhere else. The members of these
      villages protect their homes fiercely, and few dare attack them.</p>
