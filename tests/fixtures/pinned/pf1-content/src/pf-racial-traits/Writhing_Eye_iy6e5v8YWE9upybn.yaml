  description:
    value: >-
      <p><strong>Race</strong>: Vine Leshy<br /><strong>Replaced
      Trait(s)</strong>: Darkvision, Low-Light Vision</p><hr /><p>Some vine
      leshys can grow thin vines that serve as sensory organs. Growing or
      controlling the vine is a full-round action that provokes attacks of
      opportunity. The vine can extend up to @Distance[15 ft;dual] and is small
      enough to pass through a keyhole. A leshy can perceive, using all of her
      senses, within @Distance[20 ft;dual] of the vine's tip.</p><p>This
      replaces darkvision and low-light vision.</p>
