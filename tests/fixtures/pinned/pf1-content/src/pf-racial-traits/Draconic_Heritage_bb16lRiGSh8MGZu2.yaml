      <p><strong>Race</strong>: Human<br /><strong>Replaced Trait(s)</strong>:
      Skilled</p><hr /><p>At times, a human's family history can have a dragon's
      power bound to the bloodline. Humans with this trait gain darkvision with
      a range of @Distance[10 ft;dual] and low-light vision. They can also
      ignore the Charisma prerequisite for
      @UUID[Compendium.pf-content.pf-feats.Item.ECyLUubv5HWmYv1U]{Eldritch
      Heritage}<sup>APG</sup> and any feat that has Eldritch Heritage as a
      prerequisite, but can select only the draconic bloodline with these feats.
      This replaces the bonus skill rank humans receive at each level.</p>
