  description:
    value: >-
      <p><strong>Race</strong>: Dwarf<br /><strong>Replaced Trait(s)</strong>:
      Languages</p><hr /><p>Isolationist dwarves despise non-dwarven humanoids.
      They speak only Dwarven and do not gain any bonus languages from
      possessing a high Intelligence score. In addition, they learn only one
      language per 2 ranks of Linguistics they possess. However, their
      untrusting nature gives them a +1 bonus against mind-affecting effects,
      except for fear effects. This racial trait replaces a dwarf's normal
      languages.</p>
