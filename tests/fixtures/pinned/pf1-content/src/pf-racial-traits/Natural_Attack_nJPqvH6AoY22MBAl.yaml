name: Natural Attack
system:
  description:
    instructions: >-
      <p>Add your chosen natural attack type to your actor, including setting
      damage and reach, manually.</p><p>These can be dragged in from Character
      building&gt;Monster Abilities&gt;Universal Monster rules&gt;Natural
      Attacks.</p>
    value: >-
      <p>Pick one of the following natural attacks: gore, hoof (if the race has
      hooves), slam, talons, or wings (if the race has flight). Members of this
      race receive one natural attack of the chosen type. Gore, slam, and talons
      are primary natural attacks, while hoof and wings are secondary natural
      attacks. The damage is based on the creature’s size (Bestiary
      302).</p><p>Special: This trait can be taken multiple times. Each time,
      pick a different natural attack.</p>
