  description:
    value: >-
      <p><strong>Race</strong>: Dwarf<br /><strong>Replaced Trait(s)</strong>:
      Defensive Training, Hatred</p><hr /><p>Dwarves from dishonored families
      must append --slag,- --slagsun,- or --slagdam- to their surnames to
      indicate their shameful status. These dwarves are commonly banished or
      ostracized; they are forced to eke out a living at the fringes of dwarven
      settlements or in bleak wilderness areas such as the Kodar Mountains. They
      gain a +2 racial bonus on Stealth and Survival checks. This racial trait
      replaces defensive training and hatred.</p>
