          maxFormula: gte(@abilities.wis.total, 11)
          per: day
  description:
    value: >-
      <p><strong>Race</strong>: Skinwalker</p><hr /><p>A skinwalker with a
      Wisdom score of 11 or higher can use
      <em>@UUID[Compendium.pf1.spells.Item.ct9fhh8uawn8e4md]{speak with
      animals}</em> once per day as a spell-like ability, using his Wisdom
      modifier to determine his concentration checks. The caster level for this
      ability is equal to the skinwalker's character level.</p>
