  description:
    value: >-
      <p>A half-construct race is a group of creatures that are artificially
      enhanced or have parts replaced by constructed mechanisms, be they magical
      or mechanical. A half-construct race has the following
      features.</p><ul><li><p>Half-constructs gain a +2 racial bonus on saving
      throws against disease, mind-affecting effects, poison, and effects that
      cause either exhaustion or fatigue.</p></li><li><p>Half-constructs cannot
      be raised or resurrected.</p></li><li><p>Half-constructs do not breathe,
      eat, or sleep, unless they want to gain some beneficial effect from one of
      these activities. This means that a half-construct can drink potions to
      benefit from their effects and can sleep in order to regain spells, but
      neither of these activities is required for the construct to survive or
      stay in good health.</p></li></ul>
