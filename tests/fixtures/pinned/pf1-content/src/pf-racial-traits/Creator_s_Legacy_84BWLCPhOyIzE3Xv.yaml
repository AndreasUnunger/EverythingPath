    instructions: >-
      <p>You must adjust any of the noted powers, spells, and class abilities
      manually</p>
    value: >-
      <p><strong>Race</strong>: Ghoran<br /><strong>Replaced Trait(s)</strong>:
      Past-Life Knowledge</p><hr /><p>Infused with the druidic magic of their
      creator, ghorans quickly take to nature-based spells and spellcasting.
      Ghoran bloodragers and sorcerers with the verdant bloodline treat their
      Charisma score as 2 points higher for sorcerer spells and class abilities.
      Ghoran clerics and druids with the Plant domain use their domain powers
      and spells at +1 caster level. This doesn't give the ghoran early access
      to level-based powers; it affects only powers that could already be used
      without this trait.</p><p> This replaces past-life knowledge.</p>
