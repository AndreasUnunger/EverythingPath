      <p><strong>Race</strong>: Elf<br /><strong>Replaced Trait(s)</strong>:
      Languages</p><hr /><p>Some elves are so convinced of elven superiority, or
      else otherwise so xenophobic, that they have difficulty seeing the point
      in communicating with "lesser" races. Their racial bonus on saving throws
      against enchantments increases by 1 (to +3) against such effects from
      non-elf humanoids, but they begin play speaking only Elven, and if they
      have high Intelligence scores, they can select bonus languages from only
      Azlanti, Celestial, Draconic, and Sylvan (or Senzar instead of Sylvan if
      they hail from Tian Xia).</p>
