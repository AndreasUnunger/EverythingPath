  description:
    value: >-
      <p><strong>Race</strong>: Hobgoblin<br /><strong>Replaced
      Trait(s)</strong>: Sneaky</p><hr /><p>Hobgoblins hate and fear arcane
      casters. A magehunter gains a +2 racial bonus on Spellcraft checks made to
      identify a spell being cast and a +1 racial bonus on attack rolls against
      arcane spellcasters. He only gains this bonus against creatures that use
      spells, and not against those that only use spell-like abilities. This
      racial trait replaces sneaky.</p>
