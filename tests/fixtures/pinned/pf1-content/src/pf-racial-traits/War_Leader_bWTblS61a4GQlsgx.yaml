  description:
    instructions: >-
      <p>Update the Skills tab of your Actor to add the Profession (soldier)
      skill.  Update the target of the changes on the Changes tab of this trait
      to reflect Profession (brewer).</p>
    value: >-
      <p><strong>Race</strong>: Half-Orc<br /><strong>Replaced
      Trait(s)</strong>: Darkvision, Orc Ferocity</p><hr /><p>Some orcs seek out
      human mates in hopes of birthing intelligent leaders for their
      interminable war efforts. When nature and luck smile upon this endeavor
      and a half-orc child shows cunning, that child is raised with many
      harrowing opportunities to learn how to best lead on the battlefield. Such
      half-orcs gain a +2 bonus on Diplomacy and Profession (soldier) checks as
      well as to their Leadership score (for the purpose of the
      @UUID[Compendium.pf1.feats.Item.R3a1OV18RwDJftvq]{Leadership} feat).
      Armies they control in mass combat gain a +1 bonus to Morale. (See
      <em>Pathfinder RPG Ultimate Campaign</em>.) This racial trait replaces
      darkvision and orc ferocity.</p>
