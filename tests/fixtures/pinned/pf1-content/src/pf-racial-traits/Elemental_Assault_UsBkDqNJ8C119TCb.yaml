      @UUID[Compendium.pf-content.pf-racial-traits.Item.M571aaxrlWRfFqiS]{Outsider
      (Native)} with ties to an elemental plane</p><hr /><p>Pick one of the
      following energy types that corresponds to the plane the race has ties to:
      acid (earth), cold (water), electricity (air), or fire (fire). Members of
      this race gain the following supernatural ability: Once per day as a swift
      action, a member of this race can call on the elemental power lurking in
      its veins to shroud its arms in the energy type that corresponds to the
      elemental plane its race has ties to. Unarmed strikes with its elbows or
      hands (or attacks with weapons held in those hands) deal +1d6 points of
      damage of the appropriate energy type. This lasts for 1 round per
      character level. The creature may end the effects of its elemental assault
      early as a free action.</p><p><strong>Related
      buffs:</strong></p><p>@Toggle[Elemental Assault (Acid, Race
      Builder)]</p><p>@Toggle[Elemental Assault (Cold, Race
      Builder)]</p><p>@Toggle[Elemental Assault (Electricity, Race
      Builder)]</p><p>@Toggle[Elemental Assault (Fire, Race Builder)]</p>
