name: Elemental Immunity
system:
  contextNotes:
    - target: allSavingThrows
      text: You are immune to {your chosen energy} type.
  description:
    instructions: >-
      <p>You must choose an energy type and then update your actor's immunities
      and the context note of this trait manually.</p>
    value: >-
      <p><strong>Prerequisite:</strong>
      @UUID[Compendium.pf-content.pf-racial-traits.Item.M571aaxrlWRfFqiS]{Outsider
      (Native)} with ties to an elemental plane</p><p><strong>Special:</strong>
      This trait can be taken more than once. Each additional time you take this
      trait, increase its cost by 1 RP. Each time it is taken, select another
      energy type that corresponds to another elemental plane the race has ties
      to. If a race has vulnerability to fire and immunity to cold, it gains the
      cold subtype. If a race has vulnerability to cold and immunity to fire, it
      gains the fire subtype.</p><hr /><p>Pick one of the following energy types
      that corresponds to the plane the race has ties to: acid (earth), cold
      (water), electricity (air), or fire (fire). Members of this race are
      immune to the chosen energy type.</p>
