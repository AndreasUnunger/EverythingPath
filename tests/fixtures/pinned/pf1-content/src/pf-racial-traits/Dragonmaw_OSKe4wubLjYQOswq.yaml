    value: >-
      <p><strong>Race</strong>: Kobold<br /><strong>Replaced Trait(s)</strong>:
      Armor</p><hr /><p>Your draconic heritage makes you smile- not just because
      it makes you happy, but also because your powerful jaws and teeth are
      proof of your kinship to a chromatic dragon. You gain a bite attack that
