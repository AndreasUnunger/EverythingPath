      additional energy damage with your bite attack. The damage type depends on
      your scale color: acid damage for black or green, electricity for blue,
      fire for red, or cold for white. If you have a different scale color, you
      still gain the bite attack, but can't do the additional energy damage.
      This racial trait replaces the armor racial trait.</p>
