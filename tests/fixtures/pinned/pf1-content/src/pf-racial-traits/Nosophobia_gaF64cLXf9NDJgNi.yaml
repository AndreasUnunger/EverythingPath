  description:
    value: >-
      <p><strong>Race</strong>: Gnome<br /><strong>Replaced Trait(s)</strong>:
      Obsessive</p><hr /><p>Gnomes are humanoid, rather than fey, and are
      therefore not particularly susceptible to the Darkblight contagion
      afflicting the fey of the Fangwood. Nevertheless, many gnomes grow up
      fearing its taint and are obsessive about training their bodies to stave
      off illness of all kinds. These gnomes gain a +4 bonus on Fortitude saves
      against disease and poison, including magical diseases. This racial trait
      replaces obsessive.</p>
