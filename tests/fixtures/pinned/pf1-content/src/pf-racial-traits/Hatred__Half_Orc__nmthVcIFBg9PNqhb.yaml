  description:
    value: >-
      <p><strong>Race</strong>: Half-Orc<br /><strong>Replaced
      Trait(s)</strong>: Intimidating, Orc Ferocity</p><hr /><p>Half-orcs raised
      among orcs must prove themselves against their people's enemies. Half-orcs
      with this racial trait gain a +1 racial bonus on attack rolls against
      humanoids of the dwarf, elf, and human subtypes because of their special
      training against these hated foes. This racial trait replaces intimidating
      and orc ferocity.</p>
