      and can cast
      <em>@UUID[Compendium.pf1.spells.Item.zymaptg3vmnvfvxl]{dancing
      lights}</em>,
      <em>@UUID[Compendium.pf1.spells.Item.tsndfcfijmgxs37p]{darkness}</em>, and
