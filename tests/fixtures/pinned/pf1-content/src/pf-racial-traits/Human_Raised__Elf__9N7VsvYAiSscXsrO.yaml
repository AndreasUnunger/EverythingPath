  description:
    instructions: >-
      <p>There are multiple versions of the
      @UUID[Compendium.pf1.feats.Item.7zJTztNW7hdaqjKc]{Skill Focus} feat, one
      for each skill, and those specific feats must be added to your actor
      separately once you have selected a skill.</p>
    value: >-
      <p><strong>Race</strong>: Elf<br /><strong>Replaced Trait(s)</strong>:
      Elven Magic, Weapon Familiarity</p><hr /><p>Forlorn-elves raised outside
      of elven communities-are accustomed to other races' brevity of life.
      Although they lose the opportunity to train in traditional elven arts,
      these elves pick up a bit of their adoptive parents' skills. They gain
      Skill Focus as a bonus feat. This racial trait replaces elven magic and
      weapon familiarity.</p>
