  description:
    value: >-
      <p><strong>Race</strong>: Dwarf<br /><strong>Replaced Trait(s)</strong>:
      Stonecunning</p><hr /><p>A dwarf can embrace predictable traditions to
      avoid social missteps. A dwarf with this racial trait can rely upon
      conservative tactics when attempting a Diplomacy check; this choice must
      be made before the Diplomacy check is attempted. The dwarf treats any roll
      of less than 5 on such a Diplomacy check as though she had rolled a 5, but
      she treats any roll higher than 15 on such a check as though she rolled a
      15. This racial trait replaces stonecunning.</p>
