    value: >-
      <p><strong>Race</strong>: Halfling<br /><strong>Replaced
      Trait(s)</strong>: Keen Senses, Language</p><hr /><p>Some halflings,
      especially those who spend a lot of time traveling, develop a talent for
      learning new languages. These halflings gain a +2 racial bonus on
      Linguistics checks, and it is always a class skill for them. Halflings
      with this racial trait also begin play with the ability to speak Common,
      Halfling, and any one other language of their choice (except for secret
      languages, such as Druidic) in addition to bonus languages due to high
      Intelligence. They still gain the normal list of halfling bonus languages.
      This racial trait replaces keen senses and alters the halfling language
      racial trait.</p>
