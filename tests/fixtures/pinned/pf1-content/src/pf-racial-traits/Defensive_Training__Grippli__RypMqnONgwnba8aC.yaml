      <p><strong>Race</strong>: Grippli<br /><strong>Replaced Trait(s)</strong>:
      Swamp Stride, Weapon Familiarity</p><hr /><p>Gripplis of Golarion, common
      in the Valashmai Jungle, often live in close proximity to very large
      animals and dangerous creatures they must learn to avoid in order to
      survive. They gain a +2 dodge bonus to AC against Large or larger animals
      and magical beasts. This racial trait replaces swamp stride and weapon
      familiarity.</p>
