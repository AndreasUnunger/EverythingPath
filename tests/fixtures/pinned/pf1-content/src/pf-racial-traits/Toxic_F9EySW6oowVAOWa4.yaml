    value: >-
      <p><strong>Prerequisite:</strong>
      @UUID[Compendium.pf-content.pf-racial-traits.Item.OGvHcwhmrl2F70Rh]{Aberration},
      @UUID[Compendium.pf-content.pf-racial-traits.Item.M7iCedGNTrldJq5R]{Dragon},
      @UUID[Compendium.pf-content.pf-racial-traits.Item.6tmkzGAbCFuUIclP]{Plant},
      or
      @UUID[Compendium.pf-content.pf-racial-traits.Item.VZg9M6DaaZkIA8ql]{Undead}
      type, or grippli,
      @UUID[Compendium.pf-content.pf-racial-traits.Item.6am3c1HIosN3E6vk]{Half-Undead},
      reptilian, or vishkanya subtype</p><hr /><p>Members of this race gain the
      following extraordinary ability: A number of times per day equal to its
      Constitution modifier (minimum 1/day), a member of this race can envenom a
      weapon that it wields with its toxic saliva or blood (using blood requires
      the creature to be injured when it uses this ability). Applying venom in
      this way is a swift action. When you take this trait, choose one of the
      following venoms.</p><ul><li><p><strong>Life-Stealing Venom:</strong>
      Injury; <em>save</em> Fort DC 10 + 1/2 the user’s Hit Dice + the user’s
      Constitution modifier; <em>frequency</em> 1/round for 6 rounds;
      <em>effect</em> 1 Con; <em>cure</em> 1
      save.</p></li><li><p><strong>Paralytic Venom</strong>: Injury;
      <em>save</em> Fort DC 10 + 1/2 the user’s Hit Dice + the user’s
      Constitution modifier; <em>frequency</em> 1/round for 6 rounds;
      <em>effect</em> 1d2 Dex; <em>cure</em> 1
      save.</p></li><li><p><strong>Weakening Venom</strong>: Injury;
      <em>save</em> Fort DC 10 + 1/2 the user’s Hit Dice + the user’s
      Constitution modifier; <em>frequency</em> 1/round for 6 rounds;
      <em>effect</em> 1d2 Str; <em>cure</em> 1 save.</p></li></ul>
