    value: >-
      <p><strong>Race</strong>: Changeling<br /><strong>Replaced
      Trait(s)</strong>: Base Statistics</p><hr /><p>Possessed of a blazing
      inner fire, hearth mays are passionate and excitable. Ranging from bubbly
      to irate, they lack emotional nuance, but their drive and discipline can
      overcome nearly any obstacle.</p><p><b>Ancestry</b> Ash hag<br
      /><b>Typical Alignment</b> LN<br /><b>Ability Modifiers</b> +2 Wis, +2
      Cha, -2 Con<br /><b>Hag Racial Trait</b> Ash-born changelings gain a +1
      racial bonus on damage rolls for spells with the fire descriptor. This
      bonus increases by 1 for every 4 character levels the changeling has
      beyond 1st.<br /><b>Awakened Hag Heritage</b> You gain immunity to
      extremely warm conditions, as if you were under the effects of a permanent
      <i>endure elements</i> spell (heat only) that cannot be dispelled.</p>
