  description:
    value: >-
      <p><strong>Race</strong>: Halfling<br /><strong>Replaced
      Trait(s)</strong>: Fearless, Halfling Luck</p><hr /><p>While most
      halflings are fearless, some are skittish, making them particularly alert.
      Halflings with this racial trait gain a +1 bonus on initiative checks and
      a +1 bonus on attack rolls when flanking. They take a -2 penalty on saves
      against fear effects and gain no benefit from morale bonuses on such
      saves. When affected by a fear effect, their base speed increases by
      @Distance[10 ft;dual] and they gain a +1 dodge bonus to Armor Class. This
      racial trait replaces fearless and halfling luck.</p>
