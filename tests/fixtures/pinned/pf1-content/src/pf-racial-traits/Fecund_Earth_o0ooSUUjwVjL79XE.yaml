  description:
    value: >-
      <p><strong>Race</strong>: Ghoran<br /><strong>Replaced Trait(s)</strong>:
      Past-Life Knowledge, Nature Magic</p><hr /><p>Ghorans were created to
      provide nourishment to creatures, but Ghorus also intended for the ghorans
      to help the land around them to grow and thrive. Once per day, a ghoran
      with this racial trait can cast
      <em>@UUID[Compendium.pf1.spells.Item.tvhm9lzgnjlcucsn]{plant growth}</em>
      as a spell-like ability with a caster level equal to the ghoran's
      character level.</p><p>This replaces past-life knowledge and nature
      magic.</p>
