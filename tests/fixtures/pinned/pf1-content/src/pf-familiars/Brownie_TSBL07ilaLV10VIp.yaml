  details:
    notes:
      value: "\n        <div class=\"statblockContainer\" style=\"margin-top: 15px\"><div style=\"width: 100%; background-color: #ffe9c7; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); columns: 2 150px\">\r\n    <hr style=\"margin-left: 0; margin-top:-2px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n    <div style=\"padding: 5px;\">\r\n        <h1>Brownie CR 1 </h1>\r\n        \r\n        <!-- BASE -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <strong>Source</strong>: Bestiary 2 pg. 49<br/>\r\n            <strong>XP 400</strong><br/>\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            N \r\n            Tiny \r\n            Fey <br/>\r\n            <strong>Init</strong> 8;\r\n            <strong>Senses</strong> low-light vision; Perception +8; \r\n            \r\n        </div>\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Defense</h3>\r\n                <strong>AC</strong> 17, <strong>Touch</strong> 17, <strong>Flat-Footed</strong> 12 (+4 Dex, +1 dodge, +2 size)<br/>\r\n            <strong>Hit Points</strong> 4 (1 HD; 1d6+1)<br/>\r\n            <strong>Fort</strong> 1, <strong>Ref</strong> 6, <strong>Will</strong> 4;  +2 vs. illusions\r\n            \r\n            <strong>DR</strong> 5/cold iron\r\n            \r\n            \r\n            <strong>SR</strong> 12\r\n            \r\n            \r\n        </div>\r\n        <div>\r\n            <div style=\"break-inside: avoid;\">\r\n                <h3>Offense</h3>\r\n                        <strong>Speed</strong> 20 ft.<br/>\r\n                <strong>Melee</strong> short sword +6 (1d2-2/19-20)<br/>\r\n                \r\n                \r\n                \r\n                \r\n            </div>\r\n        </div>\r\n        <!-- SPELLCASTING -->\r\n                \r\n        <!-- TACTICS -->\r\n                \r\n                \r\n                \r\n                \r\n        <!-- STATISTICS -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Statistics</h3>\r\n                <strong>Str</strong> 7, <strong>Dex</strong> 18, <strong>Con</strong> 12, <strong>Int</strong> 14, <strong>Wis</strong> 15, <strong>Cha</strong> 17<br/>\r\n            <strong>Base Atk</strong> +0; <strong>CMB</strong> +2; <strong>CMD</strong> 11<br/>\r\n            <strong>Feats</strong> Dodge, Improved Initiative, Weapon Finesse<br/>\r\n            <strong>Skills</strong> Acrobatics +8 (+4 jump), Bluff +7, Craft (any one) +6, Escape Artist +8, Handle Animal +4, Perception +8, Sense Motive +6, Stealth +16 (+20 in forest), Racial Modifiers +2 Perception, +4 Stealth in forests<br/>\r\n            <strong>Languages</strong> Common, Elven, Gnome, Sylvan<br/>\r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <!-- ECOLOGY -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Ecology</h3>                <strong>Environment</strong>: temperate forests or plains<br/>\r\n                <strong>Organization</strong>: solitary, gang (2-5), or band (7-12)<br/>\r\n                <strong>Treasure</strong>: standard<br/>\r\n            </div>\r\n        <!-- SPECIAL ABILITIES -->\r\n        \r\n        <!-- DESCRIPTION -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Description</h3>        <div style=\"white-space: pre-wrap\">Brownies make their homes in the trunks of hollow trees, small earthy burrows, and even under porches and within the crawlspaces of farmhouses. Often attired in clothes that appear to be made of plants or leaves, brownies wear belts lined with pouches and tools. Whatever language they choose to speak is often is riddled with odd pronunciations and colloquialisms. Brownies stand barely 2 feet tall and weigh 20 pounds.\n\nWhen facing danger, brownies rarely engage in combat, preferring instead to confound and confuse their attackers in order to buy enough time for escape. Content with honest toil and the love of their kin, brownies maintain a pacifist nature, only harassing creatures to run them off or punish them for an insult. Despite this nature, all brownies carry a blade. They refer to their swords with a hint of disgust, and jokingly call their blades the &#x27;final trick,&#x27; using them only in the direst of consequences.\n\nHonest to a fault, brownies take freely, but always repay their debt through work or leave something behind as an offering. They may eat an apple from a farmer&#x27;s orchard, but will harvest the entire tree as repayment. A brownie might eat an entire pie left on a windowsill, only to straighten up the kitchen or wash the dishes. A brownie can share a home with a family for years and years while avoiding detection. A family that is aware of a brownie usually finds this a beneficial relationship and leaves dishes of milk, pieces of fruit, trinkets, and sometimes even wine as gifts. In exchange, the brownie keeps the home clean, mends clothes, repairs tools, and shoos away vermin and small predators. Bragging about having a brownie in the house is the best way to lose one. Brownies distrust foxes and fear wolves, and tend to avoid farms with dogs.\n\nA 5th-level neutral spellcaster with the Improved Familiar feat can gain a brownie as a familiar.\n</div>\r\n                    \r\n    </div>\r\n    <hr style=\"margin-left: 0; margin-bottom: -3px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n</div></div>\n    \n        <br>\n        <hr>\n        <div class=\"rawInputContainer\" style=\"margin-top: 15px;\">\n            <h2>RAW INPUT</h2>\n            <hr>\n            <pre style=\"white-space: pre-wrap; font-size: 10px;\">Brownie CR 1\nSource Bestiary 2 pg. 49\nXP 400\nN Tiny fey\nInit +8; Senses low-light vision; Perception +8\nDefense\nAC 17, touch 17, flat-footed 12 (+4 Dex, +1 dodge, +2 size)\nhp 4 (1d6+1)\nFort +1, Ref +6, Will +4; +2 vs. illusions\nDR 5/cold iron; SR 12\nOffense\nSpeed 20 ft.\nMelee short sword +6 (1d2-2/19-20)\nSpace 2-1/2 ft., Reach 0 ft.\nSpell-Like Abilities (CL 7th; concentration +10)\nAt will-dancing lights, mending, prestidigitation\n1/day-lesser confusion (DC 14), dimension door (self only), mirror image, ventriloquism (DC 14)\nStatistics\nStr 7, Dex 18, Con 12, Int 14, Wis 15, Cha 17\nBase Atk +0; CMB +2; CMD 11\nFeats Dodge, Improved Initiative, Weapon Finesse\nSkills Acrobatics +8 (+4 jump), Bluff +7, Craft (any one) +6, Escape Artist +8, Handle Animal +4, Perception +8, Sense Motive +6, Stealth +16 (+20 in forest); Racial Modifiers +2 Perception, +4 Stealth in forests\nLanguages Common, Elven, Gnome, Sylvan\nEcology\nEnvironment temperate forests or plains\nOrganization solitary, gang (2-5), or band (7-12)\nTreasure standard\nDescription\nBrownies make their homes in the trunks of hollow trees, small earthy burrows, and even under porches and within the crawlspaces of farmhouses. Often attired in clothes that appear to be made of plants or leaves, brownies wear belts lined with pouches and tools. Whatever language they choose to speak is often is riddled with odd pronunciations and colloquialisms. Brownies stand barely 2 feet tall and weigh 20 pounds.\n\nWhen facing danger, brownies rarely engage in combat, preferring instead to confound and confuse their attackers in order to buy enough time for escape. Content with honest toil and the love of their kin, brownies maintain a pacifist nature, only harassing creatures to run them off or punish them for an insult. Despite this nature, all brownies carry a blade. They refer to their swords with a hint of disgust, and jokingly call their blades the 'final trick,' using them only in the direst of consequences.\n\nHonest to a fault, brownies take freely, but always repay their debt through work or leave something behind as an offering. They may eat an apple from a farmer's orchard, but will harvest the entire tree as repayment. A brownie might eat an entire pie left on a windowsill, only to straighten up the kitchen or wash the dishes. A brownie can share a home with a family for years and years while avoiding detection. A family that is aware of a brownie usually finds this a beneficial relationship and leaves dishes of milk, pieces of fruit, trinkets, and sometimes even wine as gifts. In exchange, the brownie keeps the home clean, mends clothes, repairs tools, and shoos away vermin and small predators. Bragging about having a brownie in the house is the best way to lose one. Brownies distrust foxes and fear wolves, and tend to avoid farms with dogs.\n\nA 5th-level neutral spellcaster with the Improved Familiar feat can gain a brownie as a familiar.</pre>\n        </div>\n    "
