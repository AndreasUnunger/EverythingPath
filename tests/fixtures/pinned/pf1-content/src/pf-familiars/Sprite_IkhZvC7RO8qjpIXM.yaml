  details:
    alignment: cn
    cr:
      base: 0.3375
    notes:
      value: "\n        <div class=\"statblockContainer\" style=\"margin-top: 15px\"><div style=\"width: 100%; background-color: #ffe9c7; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); columns: 2 150px\">\r\n    <hr style=\"margin-left: 0; margin-top:-2px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n    <div style=\"padding: 5px;\">\r\n        <h1>Sprite CR 1/3 </h1>\r\n        \r\n        <!-- BASE -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <strong>Source</strong>: Bestiary 3 pg. 256<br/>\r\n            <strong>XP 135</strong><br/>\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            CN \r\n            Diminutive \r\n            Fey <br/>\r\n            <strong>Init</strong> 3;\r\n            <strong>Senses</strong> detect evil, detect good, low-light vision; Perception +6; \r\n            \r\n        </div>\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Defense</h3>\r\n                <strong>AC</strong> 17, <strong>Touch</strong> 17, <strong>Flat-Footed</strong> 14 (+3 Dex, +4 size)<br/>\r\n            <strong>Hit Points</strong> 3 (1 HD; 1d6)<br/>\r\n            <strong>Fort</strong> 0, <strong>Ref</strong> 5, <strong>Will</strong> 2\r\n            \r\n            <strong>DR</strong> 2/cold iron\r\n            \r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <div>\r\n            <div style=\"break-inside: avoid;\">\r\n                <h3>Offense</h3>\r\n                        <strong>Speed</strong> 60 ft. (perfect)<br/>\r\n                <strong>Melee</strong> short sword +0 (1d2-4/19-20)<br/>\r\n                <strong>Ranged</strong> short bow +7 (1d2-4/x3)<br/>\r\n                \r\n                \r\n                \r\n            </div>\r\n        </div>\r\n        <!-- SPELLCASTING -->\r\n                \r\n        <!-- TACTICS -->\r\n                \r\n                \r\n                \r\n                \r\n        <!-- STATISTICS -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Statistics</h3>\r\n                <strong>Str</strong> 3, <strong>Dex</strong> 17, <strong>Con</strong> 10, <strong>Int</strong> 6, <strong>Wis</strong> 11, <strong>Cha</strong> 10<br/>\r\n            <strong>Base Atk</strong> +0; <strong>CMB</strong> +-1; <strong>CMD</strong> 5<br/>\r\n            <strong>Feats</strong> Alertness<br/>\r\n            <strong>Skills</strong> Escape Artist +15, Fly +21, Perception +6, Sense Motive +6, Stealth +19, Racial Modifiers +8 Escape Artist<br/>\r\n            <strong>Languages</strong> Common, Sylvan<br/>\r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <!-- ECOLOGY -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Ecology</h3>                <strong>Environment</strong>: temperate forests<br/>\r\n                <strong>Organization</strong>: solitary, pair, troop (3-6), band (7-14), or tribe (15-40)<br/>\r\n                <strong>Treasure</strong>: standard (short sword, short bow with 20 arrows, other treasure)<br/>\r\n            </div>\r\n        <!-- SPECIAL ABILITIES -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Special Abilities</h3>                <div style='white-space: pre-wrap;'>Luminous (su): A sprite naturally sheds light equal to that provided by a torch. A sprite can control the color and intensity of the light as a swift action, reducing it to the dimness of a candle or even extinguishing its luminosity entirely if it wishes.</div>\r\n            </div>\r\n        \r\n        <!-- DESCRIPTION -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Description</h3>        <div style=\"white-space: pre-wrap\">Sprites gather in groups deep in forested lands, aligned to the cause of defending nature. Whole tribes of sprites deem themselves protectors of a certain person, place, or creature of importance in their lands, even if the being doesn&#x27;t actually want or need protecting.\n\nA sprite&#x27;s body is naturally luminous, although the sprite can vary the color and intensity of its body as it wishes. Shortly after death, a sprite&#x27;s body simply melts away to a twinkling vapor. Sprites are among the smallest of fey, standing just over 9 inches in height and rarely weighing more than 1 or 2 pounds.\n\nSprites are more primitive in many ways than most fey. They enjoy each other&#x27;s company, but tend to be distrustful of other fey and assume any humanoids and any other creatures that they haven&#x27;t expressly chosen to protect mean to do them ill. Even animals are generally regarded as dangerous. Much of this is due to sprites&#x27; diminutive size, which makes them popular targets for predators. As a result, a sprite&#x27;s initial reaction to danger is typically to flee-it uses its spell-like abilities to delay or distract pursuers, and relies on its speed in flight and its size to allow it to escape in the end.\n\nWhile sprites themselves are relatively uncultured and savage in nature, they do have a healthy curiosity for all things magical in nature. They are particularly drawn to sites of great but latent magical power, such as the ruins of ancient temples. This curiosity makes them unusually receptive to roles as familiars as well. A 5th-level chaotic neutral spellcaster with the Improved Familiar feat can gain a sprite as a familiar.\n</div>\r\n                    \r\n    </div>\r\n    <hr style=\"margin-left: 0; margin-bottom: -3px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n</div></div>\n    \n        <br>\n        <hr>\n        <div class=\"rawInputContainer\" style=\"margin-top: 15px;\">\n            <h2>RAW INPUT</h2>\n            <hr>\n            <pre style=\"white-space: pre-wrap; font-size: 10px;\">Sprite CR 1/3\nSource Bestiary 3 pg. 256\nXP 135\nCN Diminutive fey\nInit +3; Senses detect evil, detect good, low-light vision; Perception +6\nDefense\nAC 17, touch 17, flat-footed 14 (+3 Dex, +4 size)\nhp 3 (1d6)\nFort +0, Ref +5, Will +2\nDR 2/cold iron\nOffense\nSpeed 15 ft., fly 60 ft. (perfect)\nMelee short sword +0 (1d2-4/19-20)\nRanged short bow +7 (1d2-4/x3)\nSpace 1 ft., Reach 0 ft.\nSpell-Like Abilities (CL 5th; concentration +5)\nConstant-detect evil, detect good\nAt will-dancing lights, daze (DC 10)\n1/day-color spray (DC 11)\nStatistics\nStr 3, Dex 17, Con 10, Int 6, Wis 11, Cha 10\nBase Atk +0; CMB -1; CMD 5\nFeats Alertness\nSkills Escape Artist +15, Fly +21, Perception +6, Sense Motive +6, Stealth +19; Racial Modifiers +8 Escape Artist\nLanguages Common, Sylvan\nSQ luminous\nEcology\nEnvironment temperate forests\nOrganization solitary, pair, troop (3-6), band (7-14), or tribe (15-40)\nTreasure standard (short sword, short bow with 20 arrows, other treasure)\nSpecial Abilities\nLuminous (Su) A sprite naturally sheds light equal to that provided by a torch. A sprite can control the color and intensity of the light as a swift action, reducing it to the dimness of a candle or even extinguishing its luminosity entirely if it wishes.\nDescription\nSprites gather in groups deep in forested lands, aligned to the cause of defending nature. Whole tribes of sprites deem themselves protectors of a certain person, place, or creature of importance in their lands, even if the being doesn't actually want or need protecting.\n\nA sprite's body is naturally luminous, although the sprite can vary the color and intensity of its body as it wishes. Shortly after death, a sprite's body simply melts away to a twinkling vapor. Sprites are among the smallest of fey, standing just over 9 inches in height and rarely weighing more than 1 or 2 pounds.\n\nSprites are more primitive in many ways than most fey. They enjoy each other's company, but tend to be distrustful of other fey and assume any humanoids and any other creatures that they haven't expressly chosen to protect mean to do them ill. Even animals are generally regarded as dangerous. Much of this is due to sprites' diminutive size, which makes them popular targets for predators. As a result, a sprite's initial reaction to danger is typically to flee-it uses its spell-like abilities to delay or distract pursuers, and relies on its speed in flight and its size to allow it to escape in the end.\n\nWhile sprites themselves are relatively uncultured and savage in nature, they do have a healthy curiosity for all things magical in nature. They are particularly drawn to sites of great but latent magical power, such as the ruins of ancient temples. This curiosity makes them unusually receptive to roles as familiars as well. A 5th-level chaotic neutral spellcaster with the Improved Familiar feat can gain a sprite as a familiar.</pre>\n        </div>\n    "
