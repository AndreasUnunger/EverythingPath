    notes:
      value: >-
        <div class="statblockContainer" style="margin-top:15px"><div
        style="width:100%;background-color:#ffe9c7;box-shadow:0 4px 8px 0
        rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19);columns:2
        150px"><hr
        style="margin-left:0;margin-top:-2px;width:100%;height:4px;background-color:#e0a100;border:1px
        solid #000;column-span:all" /><div style="padding:5px"><h1>Arbiter CR
        2</h1><div style="break-inside:avoid"><p><strong>Source</strong>:
        Bestiary 2 pg. 162<br /><strong>XP 600</strong><br />LN Tiny Outsider
        (Extraplanar, Inevitable, Lawful) <br /><strong>Init</strong> 3;
        <strong>Senses</strong> darkvision 60 ft., detect chaos, low-light
        vision; Perception +5;</p></div><div
        style="break-inside:avoid"><h3>Defense</h3><p><strong>AC</strong> 16,
        <strong>Touch</strong> 15, <strong>Flat-Footed</strong> 13 (+3 Dex, +1
        natural, +2 size)<br /><strong>Hit Points</strong> 15 (2 HD; 2d10+4);
        regeneration 2 (chaotic)<br /><strong>Fort</strong> 5,
        <strong>Ref</strong> 3, <strong>Will</strong> 3 <br /><strong>Defensive
        Abilities</strong> constant vigilance, constructed; <strong>SR</strong>
        13</p></div><div><div
        style="break-inside:avoid"><h3>Offense</h3><p><strong>Speed</strong> 50
        ft. (average)<br /><strong>Melee</strong> short sword +7
        (1d3/19-20)</p></div></div><div
        style="break-inside:avoid"><h3>Statistics</h3><p><strong>Str</strong>
        11, <strong>Dex</strong> 16, <strong>Con</strong> 14,
        <strong>Int</strong> 11, <strong>Wis</strong> 11, <strong>Cha</strong>
        14<br /><strong>Base Atk</strong> +2; <strong>CMB</strong> +3;
        <strong>CMD</strong> 13<br /><strong>Feats</strong> Flyby Attack, Weapon
        FinesseB<br /><strong>Skills</strong> Diplomacy +7, Fly +12, Knowledge
        (planes) +5, Perception +5, Sense Motive +5, Stealth +16<br
        /><strong>Languages</strong> truespeech</p></div><div
        style="break-inside:avoid"><h3>Ecology</h3><p><strong>Environment</strong>:
        any<br /><strong>Organization</strong>: solitary, pair, or flock
        (3-14)<br /><strong>Treasure</strong>: none</p></div><div
        style="break-inside:avoid"><h3>Special Abilities</h3><div
        style="white-space:pre-wrap"><p>Constant Vigilance (su): An arbiter
        gains a +4 bonus to recognize and disbelieve illusions created by
        creatures with the chaotic subtype or possessing the chaotic descriptor.
        Electrical Burst (ex): An arbiter can release electrical energy from its
        body in a 10-foot-radius burst that deals 3d6 electricity damage (DC 13
        Reflex half). Immediately following such a burst, the arbiter becomes
        stunned for 24 hours. The save DC is Constitution-based. Locate
        Inevitable (su): An arbiter can always sense the direction of the
        nearest non-arbiter inevitable on the plane, the better to help it
        report back to its superiors. It cannot sense the range to this
        inevitable.</p></div></div><div
        style="break-inside:avoid"><h3>Description</h3><div
        style="white-space:pre-wrap"><p>Stealthy, observant, and frequently
        persuasive, arbiter inevitables are the scouts and diplomats of the
        inevitable race. Found throughout the multiverse in courts and on
        battlefields, arbiters keep a close eye on the forces of chaos and do
        their best to keep the lawful from straying, while simultaneously
        winning over the hearts and minds of those who might yet be saved.
        Though their assorted abilities make them extremely useful, arbiters see
        themselves less as servants than as advisers and counselors, preferring
        to ride around on their summoners' shoulders and help guide their
        'partners' on the path of law. They detest being summoned by chaotic
        individuals, and when teamed with such a creature, they aren't above
        using Diplomacy to try to influence the summoner's friends or refusing
        to undertake actions that seem contrary to their programming. An arbiter
        who comes across evidence of a significant insurgence of chaos upon a
        given plane does everything in its power to rally its allies against the
        dangerous instability, and in situations that are clearly beyond its
        ability to handle, it may refuse to continue onward until the group
        agrees to help it reach the nearest greater inevitable and make a full
        report, or else may travel to Utopia itself and present its urgent
        information in person. Arbiters typically bear the shapes of tiny
        clockwork spheres with shiny metal wings. Generally peaceful unless
        combating true creatures of chaos, arbiters prefer to cast protection
        from chaos on their allies and use command to make opponents drop their
        weapons and run. Their most powerful weapon, the ability to release
        their internal energy as a deadly burst, is reserved for dire need and
        battles of the utmost service to law, as the resulting period of
        darkness while they're powered down is the only thing that seems to
        truly scare the tiny automatons. An arbiter inevitable can serve a
        spellcaster as a familiar. Such a spellcaster must be lawful neutral,
        must be at least caster level 7th, and must have the Improved Familiar
        feat. Arbiter inevitables measure 1 foot in diameter but are
        surprisingly heavy, weighing 60 pounds. Their ability to fly on metal
        wings is as much a supernatural ability as a physical
        one.</p></div></div><hr
        style="margin-left:0;margin-bottom:-3px;width:100%;height:4px;background-color:#e0a100;border:1px
        solid #000;column-span:all" /></div></div><hr /><div
        class="rawInputContainer" style="margin-top:15px"><h2>RAW INPUT</h2><hr
        /><pre style="white-space:pre-wrap;font-size:10px"><code>Arbiter CR 2

        Source Bestiary 2 pg. 162

        XP 600

        LN Tiny outsider (extraplanar, inevitable, lawful)

        Init +3; Senses darkvision 60 ft., detect chaos, low-light vision;
        Perception +5

        Defense

        AC 16, touch 15, flat-footed 13 (+3 Dex, +1 natural, +2 size)

        hp 15 (2d10+4); regeneration 2 (chaotic)

        Fort +5, Ref +3, Will +3

        Defensive Abilities constant vigilance, constructed; SR 13

        Offense

        Speed 20 ft., fly 50 ft. (average)

        Melee short sword +7 (1d3/19-20)

        Space 2-1/2 ft., Reach 0 ft.

        Special Attacks electrical burst

        Spell-Like Abilities (CL 2nd; concentration +4)

        Constant-detect chaos

        3/day-command (DC 13), make whole, protection from chaos

        1/week-commune (CL 12th, 6 questions)

        Statistics

        Str 11, Dex 16, Con 14, Int 11, Wis 11, Cha 14

        Base Atk +2; CMB +3; CMD 13

        Feats Flyby Attack, Weapon FinesseB

        Skills Diplomacy +7, Fly +12, Knowledge (planes) +5, Perception +5,
        Sense Motive +5, Stealth +16

        Languages truespeech

        SQ locate inevitable

        Ecology

        Environment any

        Organization solitary, pair, or flock (3-14)

        Treasure none

        Special Abilities

        Constant Vigilance (Su) An arbiter gains a +4 bonus to recognize and
        disbelieve illusions created by creatures with the chaotic subtype or
        possessing the chaotic descriptor.


        Electrical Burst (Ex) An arbiter can release electrical energy from its
        body in a 10-foot-radius burst that deals 3d6 electricity damage (DC 13
        Reflex half). Immediately following such a burst, the arbiter becomes
        stunned for 24 hours. The save DC is Constitution-based.


        Locate Inevitable (Su) An arbiter can always sense the direction of the
        nearest non-arbiter inevitable on the plane, the better to help it
        report back to its superiors. It cannot sense the range to this
        inevitable.

        Description

        Stealthy, observant, and frequently persuasive, arbiter inevitables are
        the scouts and diplomats of the inevitable race. Found throughout the
        multiverse in courts and on battlefields, arbiters keep a close eye on
        the forces of chaos and do their best to keep the lawful from straying,
        while simultaneously winning over the hearts and minds of those who
        might yet be saved. Though their assorted abilities make them extremely
        useful, arbiters see themselves less as servants than as advisers and
        counselors, preferring to ride around on their summoners' shoulders and
        help guide their 'partners' on the path of law. They detest being
        summoned by chaotic individuals, and when teamed with such a creature,
        they aren't above using Diplomacy to try to influence the summoner's
        friends or refusing to undertake actions that seem contrary to their
        programming.


        An arbiter who comes across evidence of a significant insurgence of
        chaos upon a given plane does everything in its power to rally its
        allies against the dangerous instability, and in situations that are
        clearly beyond its ability to handle, it may refuse to continue onward
        until the group agrees to help it reach the nearest greater inevitable
        and make a full report, or else may travel to Utopia itself and present
        its urgent information in person.


        Arbiters typically bear the shapes of tiny clockwork spheres with shiny
        metal wings. Generally peaceful unless combating true creatures of
        chaos, arbiters prefer to cast protection from chaos on their allies and
        use command to make opponents drop their weapons and run. Their most
        powerful weapon, the ability to release their internal energy as a
        deadly burst, is reserved for dire need and battles of the utmost
        service to law, as the resulting period of darkness while they're
        powered down is the only thing that seems to truly scare the tiny
        automatons.


        An arbiter inevitable can serve a spellcaster as a familiar. Such a
        spellcaster must be lawful neutral, must be at least caster level 7th,
        and must have the Improved Familiar feat. Arbiter inevitables measure 1
        foot in diameter but are surprisingly heavy, weighing 60 pounds. Their
        ability to fly on metal wings is as much a supernatural ability as a
        physical one.</code></pre></div></div>
