  - _id: 8kKWn5TQvDIr8ecs
    _key: '!actors.items!u5TajQuOMVZgk1mT.8kKWn5TQvDIr8ecs'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/skills/yellow_36.jpg
    name: Emotion Aura
    system:
      abilityType: sp
      description:
        value: >-
          Each paracletus exists as the embodiment of a specific emotive
          duality. Three times per day, a paracletus can create an aura
          representing one of its two programmed emotions. Creatures in the area
          must make a DC 12 Will save to resist the aura. A creature that makes
          its save against the aura is unaffected by that aeon's aura for the
          next 24 hours. The paracletus can choose one creature in the area to
          ignore its effects. The effect of the aura lasts for 10 minutes, and
          ends if a creature moves more than 30 feet from the aeon. The aura is
          a mind-affecting compulsion effect. The save DC is Charisma-based.
          Specific emotive dualities and their powers follow-any single
          paracletus can only use one of these three dualistic options and
          cannot change to a different one.
      subType: classFeat
    type: feat
