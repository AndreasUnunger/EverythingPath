        spelllike:
          name: Spell-likes
        tertiary:
          name: Tertiary
    sr:
      formula: '7'
  details:
    cr:
      base: 2
    notes:
      value: "\n        <div class=\"statblockContainer\" style=\"margin-top: 15px\"><div style=\"width: 100%; background-color: #ffe9c7; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); columns: 2 150px\">\r\n    <hr style=\"margin-left: 0; margin-top:-2px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n    <div style=\"padding: 5px;\">\r\n        <h1>Paracletus CR 2 </h1>\r\n        \r\n        <!-- BASE -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <strong>Source</strong>: Bestiary 2 pg. 11<br/>\r\n            <strong>XP 600</strong><br/>\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            N \r\n            Small \r\n            Outsider (Aeon, Extraplanar) <br/>\r\n            <strong>Init</strong> 2;\r\n            <strong>Senses</strong> darkvision 60 ft.; Perception +7; \r\n            <strong>Aura</strong>  emotion aura (DC 12, 30 ft.)\r\n        </div>\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Defense</h3>\r\n                <strong>AC</strong> 14, <strong>Touch</strong> 13, <strong>Flat-Footed</strong> 12 (+2 Dex, +1 natural, +1 size)<br/>\r\n            <strong>Hit Points</strong> 13 (3 HD; 3d10-3)<br/>\r\n            <strong>Fort</strong> 4, <strong>Ref</strong> 3, <strong>Will</strong> 6\r\n            \r\n            \r\n            <strong>Immune</strong> cold, critical hits, poison; \r\n            <strong>Resist</strong> electricity 10, fire 10; \r\n            <strong>SR</strong> 7\r\n            \r\n            \r\n        </div>\r\n        <div>\r\n            <div style=\"break-inside: avoid;\">\r\n                <h3>Offense</h3>\r\n                        <strong>Speed</strong> 40 ft. (good)<br/>\r\n                <strong>Melee</strong> slam +3 (1d3-1 plus<br/>\r\n                \r\n                \r\n                \r\n                \r\n            </div>\r\n        </div>\r\n        <!-- SPELLCASTING -->\r\n                \r\n        <!-- TACTICS -->\r\n                \r\n                \r\n                \r\n                \r\n        <!-- STATISTICS -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Statistics</h3>\r\n                <strong>Str</strong> 8, <strong>Dex</strong> 14, <strong>Con</strong> 9, <strong>Int</strong> 11, <strong>Wis</strong> 13, <strong>Cha</strong> 12<br/>\r\n            <strong>Base Atk</strong> +3; <strong>CMB</strong> +1; <strong>CMD</strong> 13<br/>\r\n            <strong>Feats</strong> Great Fortitude, Iron Will<br/>\r\n            <strong>Skills</strong> Fly +8, Intimidate +7, Knowledge (arcana) +7, Knowledge (planes) +7, Perception +7, Sense Motive +7, Stealth +12<br/>\r\n            <strong>Languages</strong> envisaging<br/>\r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <!-- ECOLOGY -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Ecology</h3>                <strong>Environment</strong>: any (Outer Planes)<br/>\r\n                <strong>Organization</strong>: solitary, pair, or commune (3-12)<br/>\r\n                <strong>Treasure</strong>: none<br/>\r\n            </div>\r\n        <!-- SPECIAL ABILITIES -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Special Abilities</h3>                <div style='white-space: pre-wrap;'>Emotion Aura (sp): Each paracletus exists as the embodiment of a specific emotive duality. Three times per day, a paracletus can create an aura representing one of its two programmed emotions. Creatures in the area must make a DC 12 Will save to resist the aura. A creature that makes its save against the aura is unaffected by that aeon&#x27;s aura for the next 24 hours. The paracletus can choose one creature in the area to ignore its effects. The effect of the aura lasts for 10 minutes, and ends if a creature moves more than 30 feet from the aeon. The aura is a mind-affecting compulsion effect. The save DC is Charisma-based. Specific emotive dualities and their powers follow-any single paracletus can only use one of these three dualistic options and cannot change to a different one.\n\nCourage/Fear:: The aura acts as bless or bane.\n\nEmpathy/Apathy:: The aura gives creatures a +2 bonus or a -2 penalty on Bluff, Diplomacy, and Intimidate checks.\n\nHope/Despair:: The aura gives creatures a +2 morale bonus on Will saving throws or a -2 penalty on Will saving throws.</div>\r\n            </div>\r\n        \r\n        <!-- DESCRIPTION -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Description</h3>        <div style=\"white-space: pre-wrap\">While mortals possess the gift of free will, both logic and emotion influence their decisions. The paracletus serve the aeons as agents who connect with mortals and study the influence of emotions (particularly the dualistic nature of raw emotion) upon mortal behavior. They wander the planes seeking mortals with particularly strong emotional or logical capabilities (characters with high Charisma or Intelligence scores). Once a paracletus locates such a creature, the paracletus remains nearby, studying the target&#x27;s relationship with emotional and logical input and choices. Often, the paracletus will use its emotion aura on the target in order to study how outside influences affect the subject. Unfortunately for the target creature, whether or not the paracletus uses a helpful or harmful effect is, for all intents and purposes, a matter of random chance-even though to the paracletus&#x27;s complex reasoning, nothing is left to actual random chance.\n\nIf presented the option, a paracletus avoids direct combat, and uses its emotion aura to influence situations. If pressed to defend itself, it flies at opponents, slamming into them and discharging an electrical jolt of energy in addition to buffeting with its crystalline components. The crystals that orbit a paracletus are solidified aspects of logic, while the swirling vapors and lights that make up its central mass are manifestations of raw emotion-when a paracletus is slain, both the crystals and vapors fade away into nothingness.\n\nA paracletus can be chosen as a familiar by a 7th-level neutral spellcaster who has the Improved Familiar feat. A paracletus familiar does not abandon its mission to observe emotions and logic at play, but it does follow its master&#x27;s orders-this is one situation where the application of a paracletus&#x27;s emotion aura need not be random.\n\nAlthough the central mass of a paracletus&#x27;s body appears to be made of light and energy, it is in fact solid, and feels strangely like electrified flesh to the touch.\n</div>\r\n                    \r\n    </div>\r\n    <hr style=\"margin-left: 0; margin-bottom: -3px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n</div></div>\n    \n        <br>\n        <hr>\n        <div class=\"rawInputContainer\" style=\"margin-top: 15px;\">\n            <h2>RAW INPUT</h2>\n            <hr>\n            <pre style=\"white-space: pre-wrap; font-size: 10px;\">Paracletus CR 2\nSource Bestiary 2 pg. 11\nXP 600\nN Small outsider (aeon, extraplanar)\nInit +2; Senses darkvision 60 ft.; Perception +7\nAura emotion aura (DC 12, 30 ft.)\nDefense\nAC 14, touch 13, flat-footed 12 (+2 Dex, +1 natural, +1 size)\nhp 13 (3d10-3)\nFort +4, Ref +3, Will +6\nImmune cold, critical hits, poison; Resist electricity 10, fire 10; SR 7\nOffense\nSpeed fly 40 ft. (good)\nMelee slam +3 (1d3-1 plus\nSpell-Like Abilities (CL 3rd; concentration +4)\nAt will-sanctuary (DC 12)\n3/day-calm emotions (DC 13)\n1/week-commune (6 questions, CL 12th)\nStatistics\nStr 8, Dex 14, Con 9, Int 11, Wis 13, Cha 12\nBase Atk +3; CMB +1; CMD 13 (can't be tripped)\nFeats Great Fortitude, Iron Will\nSkills Fly +8, Intimidate +7, Knowledge (arcana) +7, Knowledge (planes) +7, Perception +7, Sense Motive +7, Stealth +12\nLanguages envisaging\nSQ extension of all, void form\nEcology\nEnvironment any (Outer Planes)\nOrganization solitary, pair, or commune (3-12)\nTreasure none\nSpecial Abilities\nEmotion Aura (Sp) Each paracletus exists as the embodiment of a specific emotive duality. Three times per day, a paracletus can create an aura representing one of its two programmed emotions. Creatures in the area must make a DC 12 Will save to resist the aura. A creature that makes its save against the aura is unaffected by that aeon's aura for the next 24 hours. The paracletus can choose one creature in the area to ignore its effects. The effect of the aura lasts for 10 minutes, and ends if a creature moves more than 30 feet from the aeon. The aura is a mind-affecting compulsion effect. The save DC is Charisma-based. Specific emotive dualities and their powers follow-any single paracletus can only use one of these three dualistic options and cannot change to a different one.\n\nCourage/Fear: The aura acts as bless or bane.\n\nEmpathy/Apathy: The aura gives creatures a +2 bonus or a -2 penalty on Bluff, Diplomacy, and Intimidate checks.\n\nHope/Despair: The aura gives creatures a +2 morale bonus on Will saving throws or a -2 penalty on Will saving throws.\nDescription\nWhile mortals possess the gift of free will, both logic and emotion influence their decisions. The paracletus serve the aeons as agents who connect with mortals and study the influence of emotions (particularly the dualistic nature of raw emotion) upon mortal behavior. They wander the planes seeking mortals with particularly strong emotional or logical capabilities (characters with high Charisma or Intelligence scores). Once a paracletus locates such a creature, the paracletus remains nearby, studying the target's relationship with emotional and logical input and choices. Often, the paracletus will use its emotion aura on the target in order to study how outside influences affect the subject. Unfortunately for the target creature, whether or not the paracletus uses a helpful or harmful effect is, for all intents and purposes, a matter of random chance-even though to the paracletus's complex reasoning, nothing is left to actual random chance.\n\nIf presented the option, a paracletus avoids direct combat, and uses its emotion aura to influence situations. If pressed to defend itself, it flies at opponents, slamming into them and discharging an electrical jolt of energy in addition to buffeting with its crystalline components. The crystals that orbit a paracletus are solidified aspects of logic, while the swirling vapors and lights that make up its central mass are manifestations of raw emotion-when a paracletus is slain, both the crystals and vapors fade away into nothingness.\n\nA paracletus can be chosen as a familiar by a 7th-level neutral spellcaster who has the Improved Familiar feat. A paracletus familiar does not abandon its mission to observe emotions and logic at play, but it does follow its master's orders-this is one situation where the application of a paracletus's emotion aura need not be random.\n\nAlthough the central mass of a paracletus's body appears to be made of light and energy, it is in fact solid, and feels strangely like electrified flesh to the touch.</pre>\n        </div>\n    "
