  details:
    alignment: ne
    cr:
      base: 2
    notes:
      value: "\n        <div class=\"statblockContainer\" style=\"margin-top: 15px\"><div style=\"width: 100%; background-color: #ffe9c7; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); columns: 2 150px\">\r\n    <hr style=\"margin-left: 0; margin-top:-2px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n    <div style=\"padding: 5px;\">\r\n        <h1>Cacodaemon CR 2 </h1>\r\n        \r\n        <!-- BASE -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <strong>Source</strong>: Bestiary 2 pg. 64<br/>\r\n            <strong>XP 600</strong><br/>\r\n            \r\n            \r\n            \r\n            \r\n            \r\n            NE \r\n            Tiny \r\n            Outsider (Daemon, Evil, Extraplanar) <br/>\r\n            <strong>Init</strong> 4;\r\n            <strong>Senses</strong> darkvision 60 ft., detect good, detect magic; Perception +7; \r\n            \r\n        </div>\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Defense</h3>\r\n                <strong>AC</strong> 16, <strong>Touch</strong> 12, <strong>Flat-Footed</strong> 16 (+4 natural, +2 size)<br/>\r\n            <strong>Hit Points</strong> 19 (3 HD; 3d10+3);  fast healing 2<br/>\r\n            <strong>Fort</strong> 2, <strong>Ref</strong> 5, <strong>Will</strong> 4\r\n            \r\n            <strong>DR</strong> 5/good or silver\r\n            <strong>Immune</strong> acid, death effects, disease, poison; \r\n            <strong>Resist</strong> cold 10, electricity 10, fire 10; \r\n            \r\n            \r\n            \r\n        </div>\r\n        <div>\r\n            <div style=\"break-inside: avoid;\">\r\n                <h3>Offense</h3>\r\n                        <strong>Speed</strong> 50 ft. (perfect)<br/>\r\n                <strong>Melee</strong> bite +6 (1d4+1 plus disease)<br/>\r\n                \r\n                \r\n                \r\n                \r\n            </div>\r\n        </div>\r\n        <!-- SPELLCASTING -->\r\n                \r\n        <!-- TACTICS -->\r\n                \r\n                \r\n                \r\n                \r\n        <!-- STATISTICS -->\r\n        <div style=\"break-inside: avoid;\">\r\n            <h3>Statistics</h3>\r\n                <strong>Str</strong> 12, <strong>Dex</strong> 11, <strong>Con</strong> 13, <strong>Int</strong> 8, <strong>Wis</strong> 13, <strong>Cha</strong> 12<br/>\r\n            <strong>Base Atk</strong> +3; <strong>CMB</strong> +1; <strong>CMD</strong> 12<br/>\r\n            <strong>Feats</strong> Improved Initiative, Lightning Reflexes<br/>\r\n            <strong>Skills</strong> Bluff +7, Fly +18, Knowledge (planes) +5, Perception +7, Stealth +14<br/>\r\n            <strong>Languages</strong> Abyssal, Common, Infernal, telepathy 100 ft.<br/>\r\n            \r\n            \r\n            \r\n            \r\n        </div>\r\n        <!-- ECOLOGY -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Ecology</h3>                <strong>Environment</strong>: any (Abaddon)<br/>\r\n                <strong>Organization</strong>: solitary or swarm (2-10)<br/>\r\n                <strong>Treasure</strong>: standard<br/>\r\n            </div>\r\n        <!-- SPECIAL ABILITIES -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Special Abilities</h3>                <div style='white-space: pre-wrap;'>Disease (su): Cacodaemonia: Bite-injury; save Fort DC 12; onset 1 day; frequency 1/day; effect 1d2 Wis damage, cure 2 consecutive saves. In addition to the normal effects of the disease, as long as a victim is infected, the cacodaemon can telepathically communicate with the creature over any distance (as long as they remain on the same plane).\n\nSoul Lock (su): Once per day as a full-round action, a cacodaemon can ingest the spirit of any sentient creature that has died within the last minute. This causes a soul gem to grow inside of the cacodaemon&#x27;s gut, which it can regurgitate as a standard action. A soul gem is a fine-sized object with 1 hit point and hardness 2. Destroying a soul gem frees the soul within, though it does not return the deceased creature to life. This is a death effect. Any attempt to resurrect a body whose soul is trapped in a soul gem requires a DC 12 caster level check. Failure results in the spell having no effect, while success shatters the victim&#x27;s soul gem and returns the creature to life as normal. If the soul gem rests in an unholy location, such as that created by the spell unhallow, the DC of this caster level check increases by +2. The caster level check DC is Charisma-based.</div>\r\n            </div>\r\n        \r\n        <!-- DESCRIPTION -->\r\n            <div style='break-inside: avoid;'>\r\n                <h3>Description</h3>        <div style=\"white-space: pre-wrap\">Any evil outsider can, as a standard action, ingest a soul gem. Doing so frees the soul within, but condemns it to one of the lower planes (though the soul can be returned to life as normal). The outsider gains fast healing 2 for a number of rounds equal to its Hit Dice.\n\nThe least of daemonkind, cacodaemons spawn from eddies of angry, violent, and demented souls amid the mists of Abaddon. Dim-witted but utterly evil, they endlessly seek to cause pain and indulge their hunger for mortal souls. Many more powerful fiends keep cacodaemons as pets, if only to be able to harvest the tiny creatures&#x27; soul gems. A 7th-level spellcaster can gain a cacodaemon as a familiar if she has the Improved Familiar feat.\n</div>\r\n                    \r\n    </div>\r\n    <hr style=\"margin-left: 0; margin-bottom: -3px; width: 100%; height: 4px; background-color: #e0a100; border: 1px solid #000; column-span: all;\" />\r\n</div></div>\n    \n        <br>\n        <hr>\n        <div class=\"rawInputContainer\" style=\"margin-top: 15px;\">\n            <h2>RAW INPUT</h2>\n            <hr>\n            <pre style=\"white-space: pre-wrap; font-size: 10px;\">Cacodaemon CR 2\nSource Bestiary 2 pg. 64\nXP 600\nNE Tiny outsider (daemon, evil, extraplanar)\nInit +4; Senses darkvision 60 ft., detect good, detect magic; Perception +7\nDefense\nAC 16, touch 12, flat-footed 16 (+4 natural, +2 size)\nhp 19 (3d10+3); fast healing 2\nFort +2, Ref +5, Will +4\nDR 5/good or silver; Immune acid, death effects, disease, poison; Resist cold 10, electricity 10, fire 10\nOffense\nSpeed 5 ft., fly 50 ft. (perfect)\nMelee bite +6 (1d4+1 plus disease)\nSpace 2-1/2 ft., Reach 0 ft.\nSpecial Attacks soul lock\nSpell-Like Abilities (CL 6th; concentration +7)\nConstant-detect good, detect magic\nAt will-invisibility (self only)\n3/day-lesser confusion (DC 12)\n1/week-commune (CL 12th, six questions)\nStatistics\nStr 12, Dex 11, Con 13, Int 8, Wis 13, Cha 12\nBase Atk +3; CMB +1; CMD 12\nFeats Improved Initiative, Lightning Reflexes\nSkills Bluff +7, Fly +18, Knowledge (planes) +5, Perception +7, Stealth +14\nLanguages Abyssal, Common, Infernal; telepathy 100 ft.\nSQ change shape (2 of the following forms: lizard, octopus, Small scorpion, venomous snake, polymorph)\nEcology\nEnvironment any (Abaddon)\nOrganization solitary or swarm (2-10)\nTreasure standard\nSpecial Abilities\nDisease (Su) Cacodaemonia: Bite-injury; save Fort DC 12; onset 1 day; frequency 1/day; effect 1d2 Wis damage, cure 2 consecutive saves. In addition to the normal effects of the disease, as long as a victim is infected, the cacodaemon can telepathically communicate with the creature over any distance (as long as they remain on the same plane).\n\nSoul Lock (Su) Once per day as a full-round action, a cacodaemon can ingest the spirit of any sentient creature that has died within the last minute. This causes a soul gem to grow inside of the cacodaemon's gut, which it can regurgitate as a standard action. A soul gem is a fine-sized object with 1 hit point and hardness 2. Destroying a soul gem frees the soul within, though it does not return the deceased creature to life. This is a death effect. Any attempt to resurrect a body whose soul is trapped in a soul gem requires a DC 12 caster level check. Failure results in the spell having no effect, while success shatters the victim's soul gem and returns the creature to life as normal. If the soul gem rests in an unholy location, such as that created by the spell unhallow, the DC of this caster level check increases by +2. The caster level check DC is Charisma-based.\nDescription\nAny evil outsider can, as a standard action, ingest a soul gem. Doing so frees the soul within, but condemns it to one of the lower planes (though the soul can be returned to life as normal). The outsider gains fast healing 2 for a number of rounds equal to its Hit Dice.\n\nThe least of daemonkind, cacodaemons spawn from eddies of angry, violent, and demented souls amid the mists of Abaddon. Dim-witted but utterly evil, they endlessly seek to cause pain and indulge their hunger for mortal souls. Many more powerful fiends keep cacodaemons as pets, if only to be able to harvest the tiny creatures' soul gems. A 7th-level spellcaster can gain a cacodaemon as a familiar if she has the Improved Familiar feat.</pre>\n        </div>\n    "
