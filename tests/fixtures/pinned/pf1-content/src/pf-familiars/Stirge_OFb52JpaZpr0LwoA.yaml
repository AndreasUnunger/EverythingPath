  - _id: jXhLfdnsLzXC81Mk
    _key: '!actors.items!OFb52JpaZpr0LwoA.jXhLfdnsLzXC81Mk'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/skills/yellow_36.jpg
    name: Attach
    system:
      abilityType: ex
      description:
        value: >-
          When a stirge hits with a touch attack, its barbed legs latch onto the
          target, anchoring it in place. An attached stirge is effectively
          grappling its prey. The stirge loses its Dexterity bonus to AC and has
          an AC of 12, but holds on with great tenacity and inserts its
          proboscis into the grappled target's flesh. A stirge has a +8 racial
          bonus to maintain its grapple on a foe once it is attached. An
          attached stirge can be struck with a weapon or grappled itself-if its
          prey manages to win a grapple check or Escape Artist check against it,
          the stirge is removed.
      subType: classFeat
    type: feat
  - _id: TcYNYI2q5H40CMsP
    _key: '!actors.items!OFb52JpaZpr0LwoA.TcYNYI2q5H40CMsP'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/skills/yellow_36.jpg
    name: Blood Drain
    system:
      abilityType: ex
      description:
        value: >-
          A stirge drains blood at the end of its turn if it is attached to a
          foe, inflicting 1 point of Constitution damage. Once a stirge has
          dealt 4 points of Constitution damage, it detaches and flies off to
          digest the meal. If its victim dies before the stirge's appetite has
          been sated, the stirge detaches and seeks a new target.
      subType: classFeat
    type: feat
  - _id: T46oRdCl97EvQCZ1
    _key: '!actors.items!OFb52JpaZpr0LwoA.T46oRdCl97EvQCZ1'
    _stats:
      coreVersion: '12.331'
    img: systems/pf1/icons/skills/yellow_36.jpg
    name: Diseased
    system:
      abilityType: ex
      description:
        value: >-
          Due to the stagnant swamps in which they live and their contact with
          the blood of numerous creatures, stirges are harbingers of disease.
          Any creature subjected to a stirge's blood drain attack has a 10%
          chance of being exposed to filth fever, blinding sickness, or a
          similar disease (Pathfinder RPG Core Rulebook 557). Once this check is
          made, the victim can no longer be infected by this particular stirge,
          though attacks by different stirges are resolved normally and may
          result in multiple illnesses.
      subType: classFeat
    type: feat
  - _id: 4p14WRvjNL6jHl7p
    _key: '!actors.items!OFb52JpaZpr0LwoA.4p14WRvjNL6jHl7p'
