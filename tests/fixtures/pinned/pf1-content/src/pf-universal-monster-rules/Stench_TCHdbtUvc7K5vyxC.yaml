  description:
    value: >-
      <p>A creature with the stench special ability secretes an oily chemical
      that other creatures find offensive. All living creatures (except those
      with the stench special ability) within 30 feet must succeed at a
      Fortitude save or be <a>sickened</a> (DC = 10 + 1/2 the racial HD of the
      creature with stench + that creature&rsquo;s Constitution modifier; the
      exact DC is given in the creature&rsquo;s descriptive text) . The duration
      of the <a>sickened</a> condition is given in the creature&rsquo;s
      descriptive text. Creatures that successfully save cannot be affected by
      the same creature&rsquo;s stench for 24 hours. A <a>delay poison</a> or
      <a>neutralize poison</a> spell removes the effect from the sickened
      creature. Creatures with <a draggable="false"
      data-pack="pf-content.pf-universal-monster-rules"
      data-id="tMXDONflorjcBvOx">immunity</a> to poison are unaffected, and
      creatures resistant to poison receive their normal bonus on their saving
      throws.</p><p><em>Format</em>: stench (DC 15, 10
      rounds)</p><p><em>Location</em>: Aura.</p><p><em>Usage:</em> Replace DC
      and duration.&nbsp;</p>
