  description:
    value: >-
      <p>@UUID[Compendium.pf-content.pf-racial-traits.Item.2NXp8S2ZZ2Lh5LS3]{Halo}</p><p>An
      Aasimar can manifest a halo of light on their head, giving a +2
      circumstance bonus on intimidate checks against evil creatures and on
      saves to avoid being blinded or dazzled.</p>
  duration:
