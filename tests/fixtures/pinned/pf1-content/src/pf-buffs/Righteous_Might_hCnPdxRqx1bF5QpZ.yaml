  description:
    value: >-
      <p>@UUID[Compendium.pf1.spells.Item.6ax0ythzw8n4bta8]{Righteous
      Might}</p><p>Your height immediately doubles, and your weight increases by
      a factor of eight. This increase changes your size category to the next
      larger one.</p><p>You gain a +4 size bonus to Strength and Constitution
      and take a -2 penalty to your Dexterity. You gain a +2 enhancement bonus
      to your natural armor. You gain DR 5/evil if you normally channel positive
      energy or damage reduction 5/good if you normally channel negative energy.
      At 15th level, this damage reduction becomes 10/evil or 10/good (the
      maximum). Your size modifier for AC and attacks changes as appropriate to
      your new size category.</p>
  duration:
    units: round
    value: '@item.level'
  level: 9
  scriptCalls:
    - _id: AacjgmQlhK8Q0SBN
      category: toggle
      hidden: false
      img: icons/svg/dice-target.svg
      name: Change Size
      type: script
      value: |-
        if(state) {
          const actorSize = actor.system.traits.size;
          await item.setItemDictionaryFlag("original_size", actorSize);

          const newIndex = Object.keys(pf1.config.actorSizes).indexOf(actorSize) + 1;
          const newSize = Object.keys(pf1.config.actorSizes)[newIndex];

          await actor.update({'system.traits.size': newSize });
        } else {
          const actorSize = item.getItemDictionaryFlag("original_size");
          await actor.update({'system.traits.size': actorSize});
          await item.removeItemDictionaryFlag("original_size");
        }
  subType: spell
type: buff
