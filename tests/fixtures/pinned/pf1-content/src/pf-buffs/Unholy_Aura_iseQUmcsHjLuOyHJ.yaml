    value: >-
      <p>@UUID[Compendium.pf1.spells.Item.flrn1xmm2wfrxbkf]{Unholy Aura}</p><p>A
      malevolent darkness surrounds the subjects, protecting them from attacks,
      granting them resistance to spells cast by good creatures, and weakening
      good creatures when they strike the subjects. This abjuration has four
      effects.</p><ul><li>Each warded creature gains a +4 deflection bonus to AC
      and a +4 resistance bonus on saves. Unlike the effect of protection from
      good, this benefit applies against all attacks, not just against attacks
      by good creatures.</li><li>A warded creature gains spell resistance 25
      against good spells and spells cast by good creatures.</li><li>The
      abjuration protects the subjects from possession and mental influence,
      just as @UUID[Compendium.pf1.spells.Item.71g6nmvy8qnodwyz]{protection from
      good} does.</li><li>If a good creature succeeds on a melee attack against
      a warded creature, the offending attacker takes 1d6 points of Strength
      damage (Fortitude negates).</li></ul>
  duration:
