name: Bless Weapon
system:
  contextNotes:
    - target: attack
      text: >-
        The weapon also becomes good-aligned, which means it can bypass the DR
        of certain creatures.
    - target: attack
      text: >-
        All critical hit rolls against evil foes are automatically successful,
        so every threat is a critical hit. This last effect does not apply to
        any weapon that already has a magical effect related to critical hits,
        such as a keen weapon or a vorpal sword.
    - target: attack
