name: Spell Immunity
system:
  contextNotes:
    - target: sr
      text: 'You are immune to your chosen spell(s):'
  description:
    instructions: <p>Add your spells to the context note.</p>
    value: >-
      <p>@UUID[Compendium.pf1.spells.Item.ui70binwqvjsgaam]{Spell
      Immunity}</p><p>The warded creature is immune to the effects of one
      specified spell for every four levels you have. The spells must be of 4th
      level or lower. The warded creature effectively has unbeatable spell
      resistance regarding the specified spell or spells. Naturally, that
      immunity doesn’t protect a creature from spells for which spell resistance
      doesn’t apply. <em>Spell immunity</em> protects against spells, spell-like
      effects of magic items, and innate spell-like abilities of creatures. It
      does not protect against supernatural or extraordinary abilities, such as
      breath weapons or gaze attacks.</p><p>Only a particular spell can be
      protected against, not a certain domain or school of spells or a group of
      spells that are similar in effect. A creature can have only one <em>spell
      immunity</em> or <em>greater spell immunity</em> spell in effect on it at
      a time.</p>
  duration:
    units: minute
    value: '@item.level * 10'
  level: 7
  subType: spell
type: buff
