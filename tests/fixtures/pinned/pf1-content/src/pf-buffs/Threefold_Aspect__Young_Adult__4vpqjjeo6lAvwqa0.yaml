  description:
    value: >-
      <p>@UUID[Compendium.pf1.spells.Item.w2yf0ksu14e91uae]{Threefold
      Aspect}</p><p>Threefold aspect allows you to shift your appearance between
      your natural age and three idealized age categories: young adult
      (youth/maiden), adulthood (father/mother), or elderly (elder/crone). In
      each case, your appearance is your own at the appropriate age, rather than
      that of a new individual.</p><p>You may change between these three aspects
      or your actual age as a standard action. As the young adult, you gain a +2
      enhancement bonus to Dexterity and Constitution, but suffer a -2 penalty
      to Wisdom. As enhancement bonuses, these stack with any bonuses or
      penalties you may have from your actual age (which are untyped
      bonuses)-the bonuses granted by this spell represent your idealized form
      in this threefold aspect rather than simply duplicating your ability
      scores at any one particular
      age.</p><p>@UUID[Compendium.pf1.spells.Item.jbqo4o2b2tmdz7wv]{True seeing}
      reveals your natural appearance overlaid with that your aspect,
      recognizing both as part of your true self.</p><p>Individuals who study
      you closely and have interacted with you at another apparent age recognize
      a resemblance (as though family) with a successful DC 20 Perception
      check.</p><p>Threefold aspect does not alter your clothing or equipment,
      and does not heal any deformity or injury unrelated to age.</p>
  duration:
