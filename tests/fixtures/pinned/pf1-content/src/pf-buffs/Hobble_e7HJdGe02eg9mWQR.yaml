  description:
    value: >-
      <p>@UUID[Compendium.pf1.spells.Item.mzrx5anb5eeovv7t]{Hobble}</p><p>This
      spell disrupts the method a target uses for movement. Creatures under the
      effects of this spell move at half their base speed (rounded down to the
      nearest 5-foot increment) but can still take 5-foot steps as
      normal.</p><p>Incorporeal creatures and creatures flying with perfect
      maneuverability are immune to the effects of this spell.</p><p>Each round,
      a target receives another save to end the effect.</p>
