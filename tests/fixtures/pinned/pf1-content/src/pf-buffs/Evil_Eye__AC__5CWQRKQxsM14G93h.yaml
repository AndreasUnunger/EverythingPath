  description:
    instructions: >-
      <p>Set the item level to the Level of the Witch (Up to level 8) using the
      ability.</p>
    value: >-
      <p>@UUID[Compendium.pf1.class-abilities.Item.U4o5YunSfhiWoZi8]{Evil
      Eye}</p><p>The witch can cause doubt to creep into the mind of a foe
      within 30 feet that she can see. The target takes a –2 penalty on one of
      the following (witch's choice): AC, ability checks, attack rolls, saving
      throws, or skill checks. This hex lasts for a number of rounds equal to 3
      + the witch's Intelligence modifier. A Will save reduces this to just 1
      round. This is a mind-affecting effect.</p><p>At 8th level the penalty
      increases to –4.</p>
  level: 1
  subType: feat
type: buff
