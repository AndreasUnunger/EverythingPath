  description:
    value: >-
      <p>@UUID[Compendium.pf1.spells.Item.vl7yer8k1leyuxld]{Foresight}</p><p>The
      caster receives instantaneous warnings of impending danger or harm to you.
      Provided the caster acts on these warnings and communicates what they
      learn to you, you cannot be surprised or flat-footed. You can be caught
      unprepared in the absence of such a warning.</p><p>Shouting a warning,
      yanking you back, and even telepathically communicating (via an
      appropriate spell) can all be accomplished before some danger befalls
      you.</p>
