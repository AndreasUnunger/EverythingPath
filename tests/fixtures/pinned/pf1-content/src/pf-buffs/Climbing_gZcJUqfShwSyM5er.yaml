  description:
    value: >-
      <p>You need both hands free to climb, but you may cling to a wall with one
      hand while you cast a spell or take some other action that requires only
      one hand.</p><p>While climbing, you can&rsquo;t move to avoid a blow, so
      you lose your Dexterity bonus to AC (if any). You also can&rsquo;t use a
      shield while climbing.</p><p>Anytime you take damage while climbing, make
      a Climb check against the DC of the slope or wall. Failure means you fall
      from your current height and sustain the appropriate falling damage.</p>
