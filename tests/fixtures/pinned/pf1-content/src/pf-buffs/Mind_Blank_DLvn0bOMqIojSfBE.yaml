img: icons/magic/perception/silhouette-stealth-shadow.webp
name: Mind Blank
system:
  contextNotes:
    - target: ac
      text: >-
        Immune to any devices or spells that gather information via Divination
        Magic.
    - target: allSavingThrows
      text: +[[8]] Resistance vs mind-affecting spells and effects
  description:
    value: >-
      <p>@UUID[Compendium.pf1.spells.Item.blvetbc929cfx4m8]{Mind
      Blank}</p><p>You are protected from all devices and spells that gather
      information about the target through divination magic (such as
      @UUID[Compendium.pf1.spells.Item.tr7m97npkbgm4wp7]{detect evil},
      @UUID[Compendium.pf1.spells.Item.vl2mznu91c3efcam]{locate creature},
      @UUID[Compendium.pf1.spells.Item.g66w32kdup1f43bp]{scry}, and
      @UUID[Compendium.pf1.spells.Item.nokru6mxk9p3r513]{see invisible}). This
      spell also grants a +8 resistance bonus on saving throws against all
      mind-affecting spells and effects. Mind blank even foils
      @UUID[Compendium.pf1.spells.Item.s2p7a4biy7bl4ks2]{limited wish},
      @UUID[Compendium.pf1.spells.Item.suel7sgnztenv551]{miracle}, and
      @UUID[Compendium.pf1.spells.Item.nnj51dwfkwd15ngj]{wish} spells when they
      are used in such a way as to gain information about the target. In the
      case of scrying that scans an area the creature is in, such as
      @UUID[Compendium.pf1.spells.Item.fmuea6pmgrylbux7]{arcane eye}, the spell
      works but the creature simply isn't detected. Scrying attempts that are
      targeted specifically at the subject do not work at all.</p>
  duration:
    units: hour
    value: '24'
  level: 15
  subType: spell
type: buff
