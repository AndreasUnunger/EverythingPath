name: Cover (Soft)
system:
  contextNotes:
    - target: ac
      text: +[[4]] vs Ranged Attacks. AoO can't be made against you.
    - target: attack
      text: Can't make AoOs vs opponents that have partial cover from you.
  description:
    value: >-
      <p>Creatures, even your enemies, can provide you with cover against ranged
      attacks, giving you a +4 bonus to AC. However, such soft cover provides no
      bonus on Reflex saves, nor does soft cover allow you to make a Stealth
      check.</p><hr><p><strong>Soft Cover and Attacks of
      Opportunity</strong></p><p>You can’t execute an attack of opportunity
      against an opponent with soft cover relative to you.</p>
  level: null
type: buff
