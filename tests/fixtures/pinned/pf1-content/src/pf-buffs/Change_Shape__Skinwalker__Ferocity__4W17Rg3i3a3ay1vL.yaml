  description:
    value: >-
      <p>@UUID[Compendium.pf-content.pf-racial-traits.Item.2Do0WTfTNBwfKgjU],
      @UUID[Compendium.pf-content.pf-racial-traits.Item.JdmRjdRfq9S16pmP]</p><p>In
      the skinwalker's bestial form, they gain the ability to remain conscious
      and can continue fighting even if their hit point total is below 0. The
      skinwalker is still <a>staggered</a> and loses 1 hit point each round. The
      skinwalker still dies when their hit point total reaches a negative amount
      equal to their Constitution score.</p>
