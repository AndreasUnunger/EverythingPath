    value: >-
      <p>@UUID[Compendium.pf1.spells.Item.o0s3eo85npgigh3w]{Cloak of
      Chaos}</p><p>A random pattern of color surrounds the subjects, protecting
      them from attacks, granting them resistance to spells cast by lawful
      creatures, and causing lawful creatures that strike the subjects to become
      <em>confused</em>. This abjuration has four effects.</p><ul><li>First,
      each warded creature gains a +4 deflection bonus to AC and a +4 resistance
      bonus on saves. Unlike protection from law, the benefit of this spell
      applies against all attacks, not just against attacks by lawful
      creatures.</li><li>Second, each warded creature gains spell resistance 25
      against lawful spells and spells cast by lawful creatures.</li><li>Third,
      the abjuration protects from possession and mental influence, just as
      protection from law does.</li><li>Finally, if a lawful creature succeeds
      on a melee attack against a warded creature, the offending attacker is
      confused for 1 round (Will save negates, as with the <em>confusion</em>
      spell, but against the save DC of <em>cloak of chaos</em>).</li></ul><hr
      />
