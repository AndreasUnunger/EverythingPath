  description:
    value: >-
      <p>To squeeze through or into a space less than half your space&rsquo;s
      width, you must use the Escape Artist skill. You can&rsquo;t attack while
      using Escape Artist to squeeze through or into a narrow space, you take a
      &ndash;4 penalty to AC, and you lose any Dexterity bonus to AC.</p><p>A
      creature can squeeze past a creature while moving but it can&rsquo;t end
      its movement in an occupied square.</p>
