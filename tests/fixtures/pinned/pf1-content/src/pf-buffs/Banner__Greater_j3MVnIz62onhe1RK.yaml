  description:
    value: >-
      <p>@UUID[Compendium.pf1.class-abilities.Item.1Yy6Fn3UD82uviFg]{Greater
      Banner}</p><p>At 14th level, the cavalier’s banner becomes a rallying call
      to his allies.</p><p>All allies within 60 feet receive a +2 morale bonus
      on saving throws against charm and compulsion spells and effects.</p><p>In
      addition, while his banner is displayed, the cavalier can spend a standard
      action to wave the banner through the air, granting all allies within 60
      feet an additional saving throw against any one spell or effect that is
      targeting them.</p><p>This save is made at the original DC. Spells and
      effects that do not allow saving throws are unaffected by this
      ability.</p><p>An ally cannot benefit from this ability more than once per
      day.</p>
