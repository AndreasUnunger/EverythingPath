  description:
    value: >-
      <p>@UUID[Compendium.pf1.spells.Item.1deu73tsthfuepk5]{Aspect of the
      Stag}</p><p>You gain a +2 dodge bonus to AC against attacks of
      opportunity, your base speed increases by 20 ft., you can move through any
      undergrowth (including magically manipulated undergrowth) at your normal
      speed, and can even make a 5-foot step within such
      terrain.</p><p>Furthermore, when you are hit with an attack of
      opportunity, you can make a single attack with your antlers against the
      opponent that hit you as an immediate action. This attack uses your
      highest base attack bonus plus your Strength or Dexterity bonus (your
      choice) and deals 1d8 points of piercing damage (if you are Medium; 1d6
      points of damage if Small) plus your Strength modifier on a successful
      hit. The antlers have a critical multiplier of 19-20/x2.</p>
  duration:
    end: turnStart
    units: minute
    value: '@item.level'
  level: 7
  subType: spell
