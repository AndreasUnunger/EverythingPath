      <p>@UUID[Compendium.pf1.spells.Item.p6irfohhgss1iod5]{Ape Walk}</p><p>You
      gain a climb speed of 30 feet and a +8 racial bonus on Climb skill checks.
      You must have your hands free to climb in this manner. In addition, as
