  description:
    value: >-
      <p>@UUID[Compendium.pf1.spells.Item.bgtmki0xl4xl4y91]{Magic Fang,
      Greater}</p><p>This spell functions like
      @UUID[Compendium.pf1.spells.Item.cfzk3vkv1c7ncaug]{Magic Fang}, except
      that the enhancement bonus on attack and damage rolls is +1 per four
      caster levels (maximum +5). This bonus does not allow a natural weapon or
      unarmed strike to bypass damage reduction aside from
      magic.</p><p>Alternatively, you may imbue all of the creature's natural
      weapons with a +1 enhancement bonus (regardless of your caster
      level).</p><p>Greater magic fang can be made permanent with a
      @UUID[Compendium.pf1.spells.Item.nsxngq65mbrzgwnm]{Permanency} spell.</p>
