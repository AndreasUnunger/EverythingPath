      <p>@UUID[Compendium.pf1.spells.Item.3wdb34u6m64ctji7]{Lay of the
      Land}</p><p>This instant familiarity grants you an insight bonus equal to
      your caster level (maximum +5) on Knowledge (geography) checks and
      Survival checks to avoid getting lost so long as you remain in the
      affected area.</p><p>Additionally, for the duration of the spell you can
