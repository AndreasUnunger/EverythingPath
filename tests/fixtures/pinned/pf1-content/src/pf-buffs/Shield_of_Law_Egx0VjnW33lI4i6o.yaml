  description:
    instructions: >-
      <p>Change the <code>4[Casting Modifier]</code> section in the action's
      saving throw formula to the buff caster's casting modifier.</p>
    value: >-
      <p>@UUID[Compendium.pf1.spells.Item.lzj5umxjvogvpg6b]{Shield of
      Law}</p><p>A dim, blue glow surrounds you, protecting from attacks,
      granting you resistance to spells cast by chaotic creatures, and
      <em>slowing</em> chaotic creatures when they strike you. This abjuration
      has four effects.</p><ul><li>First, you gain a +4 deflection bonus to AC
      and a +4 resistance bonus on saves. Unlike <em>protection from chaos</em>,
      this benefit applies against all attacks, not just against attacks by
      chaotic creatures.</li><li>Second, you gain Spell Resistance 25 against
      chaotic spells and spells cast by chaotic creatures.</li><li>Third, the
      abjuration protects you from possession and mental influence, just as
      @UUID[Compendium.pf1.spells.Item.md6ltvqh9paadsm4]{protection from chaos}
      does.</li><li>Finally, if a chaotic creature succeeds on a melee attack
      against you, the attacker is slowed (Will save negates, as the
      @UUID[Compendium.pf1.spells.Item.jcr72piqo6g549e1]{slow} spell, but
      against shield of law‘s save DC). </li></ul><hr />
