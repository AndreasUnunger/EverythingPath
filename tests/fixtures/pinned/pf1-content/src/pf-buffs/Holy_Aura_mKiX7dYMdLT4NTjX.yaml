    value: >-
      <p>@UUID[Compendium.pf1.spells.Item.n0vm6or4nwaylpfa]{Holy Aura}</p><p>A
      brilliant divine radiance surrounds you, protecting you from attacks,
      granting you resistance to spells cast by evil creatures, and causing evil
      creatures to become blinded when they strike you. This abjuration has four
      effects.</p><ul><li>First, you gain a +4 deflection bonus to AC and a +4
      resistance bonus on saves. Unlike <em>protection from evil</em>, this
      benefit applies against all attacks, not just against attacks by evil
      creatures.</li><li>Second, you gain spell resistance 25 against evil
      spells and spells cast by evil creatures.</li><li>Third, the abjuration
      protects you from possession and mental influence, just as
      @UUID[Compendium.pf1.spells.Item.skgjjub1hng29nwo]{protection from evil}
      does.</li><li>Finally, if an evil creature succeeds on a melee attack
      against you, the offending attacker is blinded (Fortitude save negates, as
      <em>blindness/deafness</em>, but against <em>holy aura’s</em> save
      DC).</li></ul>
