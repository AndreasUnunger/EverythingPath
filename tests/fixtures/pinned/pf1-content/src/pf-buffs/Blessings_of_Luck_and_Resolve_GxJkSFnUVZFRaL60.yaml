  description:
    value: >-
      <p>@UUID[Compendium.pf1.spells.Item.m8nue3zocbg7c5o1]{Blessing of Luck and
      Resolve}</p><p>You gain a +2 morale bonus on saving throws against fear
      effects. If you have the fearless racial trait, you are immune to fear
      instead. If you fail a saving throw against fear, you can end the spell as
      an immediate action to reroll the save with a +4 morale bonus, and must
      take the new result, even if it is worse.</p>
