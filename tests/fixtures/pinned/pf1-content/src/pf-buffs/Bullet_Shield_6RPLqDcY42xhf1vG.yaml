      <p>@UUID[Compendium.pf1.spells.Item.vhfj5bkt9hmgvh9p]{Bullet
      Shield}</p><p>You gain a +4 deflection bonus to AC against firearm and
      ranged attacks, with an additional +1 to the bonus for every five caster
      levels you have (to a maximum of +8 at 20th level). Though the spell is
      called <em>bullet shield</em>, it also grants this protection from attacks
      made from firearms with the scatter weapon quality.</p>
