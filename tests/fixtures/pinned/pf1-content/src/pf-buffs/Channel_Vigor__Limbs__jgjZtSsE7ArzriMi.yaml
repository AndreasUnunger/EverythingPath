  description:
    instructions: >-
      <p>Deactivate active buff and activate the desired variant upon
      choice.</p>
    value: >-
      <p>@UUID[Compendium.pf1.spells.Item.tj3xdnlwtgk5ecln]{Channel
      Vigor}</p><p>When you cast the spell, choose one of the following portions
      of your self as your focus target. Thereafter, you may change the focus
      target as a move action. You can gain the benefit of only one <em>channel
      vigor</em> spell at a time.</p><ul><li><em>Limbs</em>: You gain the
      benefits of a haste spell.</li><li><em>Mind</em>: You gain a +4 competence
      bonus on Knowledge and Perception skill checks and on ranged attack
      rolls.</li><li><em>Spirit</em>: You gain a +6 competence bonus on Will
      saving throws and Bluff and Intimidate checks.</li><li><em>Torso</em>: You
      gain a +6 competence bonus on Fortitude saving throws and concentration
      checks.</li></ul><p><strong>Haste</strong>: When making a full attack
      action, you may make one extra attack with one natural or manufactured
      weapon at your highest base attack bonus. This effect is not cumulative
      with similar effects, such as that provided by a speed weapon.</p>
  level: 5
  scriptCalls:
    - _id: hgG9kraD14pE0Lti
      category: toggle
      hidden: false
      img: icons/svg/dice-target.svg
      name: Toggle Others
      type: script
      value: |-
        if(state) {
          const otherBuffTags = [
            "channelVigorLimbs",
            "channelVigorMind",
            "channelVigorSpirit",
            "channelVigorTorso"
          ];

          const otherBuffs = actor.itemTypes.buff.filter(b => otherBuffTags.includes(b.system.tag) && b.system.tag !== item.system.tag);
          otherBuffs.forEach(async (buff) => { await buff.setActive(false) });
        }
  subType: spell
  tag: channelVigorLimbs
type: buff
