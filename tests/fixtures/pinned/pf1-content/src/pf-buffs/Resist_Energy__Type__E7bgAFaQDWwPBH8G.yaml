  description:
    value: >-
      <p>@UUID[Compendium.pf1.spells.Item.tkjnm3lw7ni82tag]{Resist
      Energy}</p><p>This spell grants you a limited protection from damage of
      whichever one of five energy types you select: acid, cold, electricity,
      fire, or sonic. You gain resist energy 10 against the energy type chosen,
      meaning that each time you are subjected to such damage (whether from a
      natural or magical source), that damage is reduced by 10 points before
      being applied to you hit points. The value of the energy resistance
      granted increases to 20 points at 7th level and to a maximum of 30 points
      at 11th level. The spell protects your equipment as well.</p><p>Resist
      energy absorbs only damage. You could still suffer unfortunate side
      effects.</p><p>Resist energy overlaps (and does not stack with)
      @UUID[Compendium.pf1.spells.Item.1vh2ewwvzvxunoxk]{protection from
      energy}. If a character is warded by protection from energy and resist
      energy, the protection spell absorbs damage until its power is
      exhausted.</p>
  duration:
    units: minute
    value: '@item.level * 10'
  level: 3
  subType: spell
type: buff
