  description:
    instructions: <p>Set the cursed ability score in the changes tab.</p>
    value: >-
      <p>@UUID[Compendium.pf1.spells.Item.lsboosfk26m0ycqv]{Bestow
      Curse}</p><p>You place a curse on the subject. Choose one of the
      following.</p><ul><li>-6 decrease to an ability score (minimum
      1).</li><li>-4 penalty on attack rolls, saves, ability checks, and skill
      checks.</li><li>Each turn, the target has a 50% chance to act normally;
      otherwise, it takes no action.</li></ul><p>You may also invent your own
      curse, but it should be no more powerful than those described
      above.</p><p>The curse bestowed by this spell cannot be dispelled, but it
      can be removed with a break enchantment, limited wish, miracle, remove
      curse, or wish spell.</p><p><em>Bestow curse</em> counters <em>remove
      curse</em>.</p>
  level: null
  subType: spell
type: buff
