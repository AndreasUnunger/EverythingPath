    text:
      content: >-
        <p>@Compendium[pf-content.pf-rules.XOJpjqmBzwE4R4n0]{(Index)
        Environment}</p><p>@Compendium[pf-content.pf-rules.GUKeQEgdxbleWA0l]{3.4.
        Weather}</p><ul><li>@Compendium[pf-content.pf-rules.pHXeVyYf1x4VAEHD]{3.4.1.
        Rain, Snow, Sleet, and
        Hail}</li><li>@Compendium[pf-content.pf-rules.CGWYylbSPcCdf6xq]{3.4.2.
        Storms}</li><li>@Compendium[pf-content.pf-rules.zbaKzSfM3Synw9Cd]{3.4.3.
        Fog}</li><li><strong>@Compendium[pf-content.pf-rules.TGNihLM3XTYgf6MV]{3.4.4.
        Winds}</strong></li></ul><hr /><p>@Source[PZO1110;pages=439]</p><p>The
        wind can create a stinging spray of sand or dust, fan a large fire, keel
        over a small boat, and blow gases or vapors away. If powerful enough, it
        can even knock characters down (see Table 13-10 in
        @Compendium[pf-content.pf-rules.GUKeQEgdxbleWA0l]{3.4. Weather}),
        interfere with ranged attacks, or impose penalties on some skill
        checks.</p><p>Light Wind</p><p>A gentle breeze, having little or no game
        effect.</p><p>Moderate Wind</p><p>A steady wind with a 50% chance of
        extinguishing small, unprotected flames, such as candles.</p><p>Strong
        Wind</p><p>Gusts that automatically extinguish unprotected flames
        (candles, torches, and the like). Such gusts impose a –2 penalty on
        ranged attack rolls and on Perception checks.</p><p>Severe Wind</p><p>In
        addition to automatically extinguishing any unprotected flames, winds of
        this magnitude cause protected flames (such as those of lanterns) to
        dance wildly and have a 50% chance of extinguishing these lights. Ranged
        weapon attacks and Perception checks are at a –4 penalty. This is the
        velocity of wind produced by a gust of wind
        spell.</p><p>Windstorm</p><p>Powerful enough to bring down branches if
        not whole trees, windstorms automatically extinguish unprotected flames
        and have a 75% chance of blowing out protected flames, such as those of
        lanterns. Ranged weapon attacks are impossible, and even siege weapons
        have a –4 penalty on attack rolls. Perception checks that rely on sound
        are at a –8 penalty due to the howling of the
        wind.</p><p>Hurricane-Force Wind</p><p>All flames are extinguished.
        Ranged attacks are impossible (except with siege weapons, which have a
        –8 penalty on attack rolls). Perception checks based on sound are
        impossible: all characters can hear is the roaring of the wind.
        Hurricane-force winds often fell trees.</p><p>Tornado (CR 10)</p><p>All
        flames are extinguished. All ranged attacks are impossible (even with
        siege weapons), as are sound-based Perception checks. Instead of being
        blown away (see Table 13–10), characters in close proximity to a tornado
        who fail their Fortitude saves are sucked toward the tornado. Those who
        come in contact with the actual funnel cloud are picked up and whirled
        around for 1d10 rounds, taking 6d6 points of damage per round, before
        being violently expelled (falling damage might apply). While a tornado’s
        rotational speed can be as great as 300 mph, the funnel itself moves
        forward at an average of 30 mph (roughly 250 feet per round). A tornado
        uproots trees, destroys buildings, and causes similar forms of major
        destruction.</p>
