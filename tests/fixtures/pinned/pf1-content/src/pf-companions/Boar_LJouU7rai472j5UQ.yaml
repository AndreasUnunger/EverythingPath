    img: systems/pf1/icons/items/inventory/fish.jpg
    name: Bonus Tricks
    system:
      associations:
        classes:
          - Animal Companion
      class: animalCompanion
      description:
        value: >-
          <p><strong>Tricks selected</strong>:</p><ol><li></li></ol><hr
          /><p>Bonus Tricks Granted: [[(floor(@class.level / 3) + 1)]]</p><p>The
          value given in this column is the total number of &ldquo;bonus&rdquo;
          tricks that the animal knows in addition to any that the druid might
          choose to teach it (see the Handle Animal skill for more details on
          how to teach an animal tricks). These bonus tricks don't require any
          training time or Handle Animal checks, and they don't count against
          the normal limit of tricks known by the animal. The druid selects
          these bonus tricks, and once selected, they can't be changed.</p>
      subType: classFeat
    type: feat
  - _id: ouSNYqJAOyCx1s2k
    _key: '!actors.items!LJouU7rai472j5UQ.ouSNYqJAOyCx1s2k'
    _stats:
      compendiumSource: Compendium.pf-content.pf-companion-features.Item.g6t6hQoc95ASlz7D
      coreVersion: '12.331'
    img: systems/pf1/icons/feats/quick-draw.jpg
    name: Link
    system:
      abilityType: ex
      associations:
        classes:
          - Animal Companion
      class: animalCompanion
      contextNotes:
        - target: skill.han
          text: >-
            +[[4]] Circumstance bonus when using Wild Empathy or Handle Animal
            on animal companion. (Not factored in)
      description:
        value: >-
          <p>A druid can handle her animal companion as a free action, or push
          it as a move action, even if she doesn't have any ranks in the Handle
          Animal skill. The druid gains a +4 circumstance bonus on all wild
          empathy checks and Handle Animal checks made regarding an animal
          companion.</p>
      subType: classFeat
    type: feat
  - _id: zIScEwtTw0hqJ93b
