  - _id: SP9Y6CdMgxrbr6uq
    _key: '!actors.items!LJouU7rai472j5UQ.SP9Y6CdMgxrbr6uq'
    _stats:
      compendiumSource: Compendium.pf-content.pf-companion-features.Item.I9aVgYTVbwwmdZYz
