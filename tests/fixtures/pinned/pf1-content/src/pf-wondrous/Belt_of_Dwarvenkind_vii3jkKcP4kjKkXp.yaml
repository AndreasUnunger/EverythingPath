  description:
    instructions: >-
      <p>This item's bonuses assume it is worn by a non-dwarf. any dwarves
      wearing this belt do not gain "<span style="font-family: Signika,
      sans-serif">60-foot darkvision, dwarven stonecunning, a +2 enhancement
      bonus to Constitution, and a +2 resistance bonus on saves against poison,
      spells, and spell-like effects." and these should be removed from the item
      if worn by a dwarf.  These can be found on the changes tab and the links
      tab.</span></p>
    unidentified: <p>This belt is unremarkable.</p>
    value: >-
      <p>This belt gives the wearer a +4 competence bonus on Charisma checks and
      Charisma-based skill checks as they relate to dealing with dwarves, a +2
      competence bonus on similar checks when dealing with gnomes and halflings,
      and a -2 competence penalty on similar checks when dealing with anyone
      else. The wearer can understand, speak, and read Dwarven. If the wearer is
      not a dwarf, he gains 60-foot darkvision, dwarven stonecunning, a +2
      enhancement bonus to Constitution, and a +2 resistance bonus on saves
      against poison, spells, and spell-like
      effects.</p><h3>Construction</h3><p><strong>Requirements</strong>
      @UUID[Compendium.pf1.feats.Item.tD76K8QGco9scT0r]{Craft Wondrous Item},
      <em>@UUID[Compendium.pf1.spells.Item.m1rmcpcaixcpz9ib]{Tongues}</em>,
      creator must be a dwarf <strong>Cost</strong> 7,450
      gp</p><p><strong>Editor's note</strong>: The text of this item says there
      is a -2 competence penalty, however the general rules state that all
      penalties are untyped.</p>
