  description:
    instructions: >-
      <ol><li><p>Select Disable Device or Knowledge (engineering) when you take
      this trait.</p></li><li><p>Update the Class skills section of the details
      tab of this trait to reflect your choice.</p></li><li><p>Update the target
      of the Context note on the changes tab of this trait to reflect your
      choice.</p></li></ol><p>If you gain the Technologist feat, update the
      change on the Changes tab associated with the selected skill and change
      the bonus value from 1 to 3, then delete the context note.</p>
    value: >-
      <p><em>You have ties to a prominent local in the town of Torch—the missing
      wizard Khonnir Baine. If you’re a wizard, alchemist, or other scholarly
      type, he may have been your tutor or teacher. If you’re of a more martial
      bent, Khonnir could instead have been a friend or business associate of
      your mother, father, or patron. He may even have been your adoptive
      father, in which case you likely have a bond of friendship or rivalry with
      his adopted daughter Val (your GM has more information on her in this case
      if you wish to know more for your character’s
      background).</em></p><p><strong>Benefits</strong>: Your association with
      Khonnir has given you insight into how technology works. Choose Disable
      Device or Knowledge (engineering). You gain a +1 trait bonus on checks
      with this skill, and it is a class skill for you. In addition, you are
      treated as if you possessed the Technologist feat for the purposes of
      resolving checks associated with that skill. If you gain the Technologist
      feat, your trait bonus for the selected skill increases to +3.</p><hr />
