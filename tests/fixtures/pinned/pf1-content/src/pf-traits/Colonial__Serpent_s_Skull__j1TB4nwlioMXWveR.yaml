  description:
    value: >-
      <p><em>You come from a long line of Sargavan colonists, stretching back to
      Cheliax's original expansion into the land during the Everwar. While your
      people's control of Sargava wanes every day, and Eleder has functioned
      independently from Cheliax since House Thrune brought diabolism to the
      political forefront, you nevertheless maintain a hardy Chelish
      constitution and natural sense of survival. What took you away from home
      is up to you, but you return to the land of your birth on the Jenivere in
      the hope of putting Sargava back on the
      map.</em></p><p><strong>Benefits</strong>: You gain a +1 trait bonus on
      Knowledge (local) checks relating to Sargavan settlements and politics and
      a +1 trait bonus on saving throws against disease. Characters with this
      trait are Sargavan natives and might be returning via any city, but
      especially from the Chelish ports of Kintargo, Pezzack, or Corentyn.</p>
