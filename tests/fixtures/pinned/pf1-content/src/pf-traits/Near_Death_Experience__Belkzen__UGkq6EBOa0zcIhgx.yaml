name: Near-Death Experience (Belkzen)
system:
  contextNotes:
    - target: conChecks
      text: >-
        +[[1]] Trait bonus on checks to become stable when dying. In addition,
        you die only once your hit points equal or exceed a negative amount
        equal to your Constitution score + 2. (hp=[[@attributes.hp.value]] ,
        con+2=[[@abilities.con.total +2]])
  description:
    value: >-
      <p><em>You had a close brush with death that you survived only thanks to
      one of the witch doctors of Belkzen, and your body has learned to cling to
      life in dire situations.</em></p><p><strong>Requirements</strong>: Must
      hail from the <span style="text-decoration:underline" data-tooltip="Orc
      homeland in central Avistan"><span
      style="text-decoration:underline">Belkzen</span></span> or have lived
      there for at least 1 year</p><p><strong>Benefits</strong>: You gain a +1
      trait bonus on Constitution checks to stabilize, and you don’t die until
      your hit points drop to a negative amount equal to 2 + your Constitution
      score.</p>
  sources:
    - id: PZO9475
      pages: '16'
  subType: trait
  tags:
    - Belkzen
  traitType: region
type: feat
