      <p><em>You were raised on Akiton, where you were hardened against the
      ravages of battle.</em></p><p><strong>Requirements</strong>: <span
      data-tooltip="Fourth planet from Golarion's sun"><span
      style="text-decoration:underline">Akiton</span></span></p><p><strong>Benefits</strong>:
