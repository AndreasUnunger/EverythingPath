  description:
    value: >-
      <p><em>You are used to dealing with outsiders that would fluster a less
      experienced negotiator.</em></p><p><strong>Requirements</strong>: <span
      style="text-decoration:underline" data-tooltip="The Abyss (pronounced
      uh-BIS), is a plane in the Outer Sphere dedicated to the rule of evil
      unfettered by law."><span style="text-decoration:underline">The
      Abyss</span></span></p><p><strong>Benefits</strong>: When dealing with an
      outsider within one step of your alignment, you gain a +1 trait bonus on
      Diplomacy and Sense Motive checks. Increase these bonuses to +2 if you and
      the outsider worship the same deity.</p>
