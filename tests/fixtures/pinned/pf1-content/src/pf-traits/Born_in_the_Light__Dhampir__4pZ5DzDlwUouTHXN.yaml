img: icons/creatures/eyes/lizard-single-slit-blue.webp
name: Born in the Light (Dhampir)
system:
  contextNotes:
    - target: skill.per
      text: >-
        When your light sensitivity causes you to become dazzled, you do not
        take the –1 penalty on sight-based Perception checks.
    - target: skill.swm
      text: >-
        +[[2]] Trait bonus to resist nonlethal damage from exhaustion.  This
        bonus does not stack with the bonus from the Endurance feat.
    - target: conChecks
      text: >-
        +[[2]] Trait bonus to continue running; or to hold your breath; and to
        avoid nonlethal damage from a forced march, or starvation or thirst.
        This bonus does not stack with the bonus from the Endurance feat.
    - target: fort
      text: >-
        +[[2]] Trait bonus to avoid nonlethal damage from hot or cold
        environments; and to resist damage from suffocation.  This bonus does
        not stack with the bonus from the Endurance feat.
  description:
    value: >-
      <p><em>The circumstance of your birth and upbringing left little room to
      accommodate your weaknesses, and many hours toiling in broad daylight have
      decreased the severity of your innate
      hindrances.</em></p><p><strong>Requirements</strong>:
      Dhampir</p><p><strong>Benefits</strong>: You gain a +2 bonus on checks and
      saves affected by the Endurance feat (this bonus does not stack with the
      bonus granted by the
      @UUID[Compendium.pf1.feats.Item.ehqx8txNRGMaNOPt]{Endurance feat}).
      </p><p>When your light sensitivity causes you to become dazzled, you do
      not take the –1 penalty on sight-based Perception checks.</p>
  sources:
    - id: PZO9427
      pages: '19'
  subType: trait
  tags:
    - Dhampir
  traitType: race
