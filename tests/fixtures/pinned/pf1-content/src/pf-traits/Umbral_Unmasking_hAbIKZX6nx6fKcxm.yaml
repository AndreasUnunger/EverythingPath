name: Umbral Unmasking
system:
  description:
    value: >-
      <p><strong>Effects</strong>: You cast no shadow whatsoever, or the shadow
      you do have is monstrous. Under normal lighted conditions, this is not
      hard to observe—but uncommon to notice.  Creatures that succeed at a DC 15
      Wisdom check notice it plainly (an additional Perception check may be
      required based on environmental conditions). This telltale sign of
      wickedness cannot be concealed by
      <em>@UUID[Compendium.pf1.spells.Item.8nrt26t37v7koqr8]{misdirection}</em>,
      <em>@UUID[Compendium.pf1.spells.Item.awia42zci8nufpfl]{nondetection}</em>,
      or illusions, except those that also affect shadows (such as
      <em>@UUID[Compendium.pf1.spells.Item.oylikodnyku2zewu]{invisibility}</em>).</p>
  sources:
    - id: PZO9450
      pages: '29'
  subType: trait
  traitType: drawback
type: feat
