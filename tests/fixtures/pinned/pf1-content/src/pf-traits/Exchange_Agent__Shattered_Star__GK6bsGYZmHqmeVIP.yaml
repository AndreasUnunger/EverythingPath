      formula: '1'
      type: trait
  description:
    instructions: >-
      <ol><li><p>Select a country other than Varisia and a language spoken
      therein when you take this trait.</p></li><li><p>Update the Granted
      Proficiencies&gt;Languages section of the details tab of this trait to
      reflect this choice.</p></li><li><p>Select one (1) of: Handle Animal,
      Knowledge (geography), Linguistics, or Survival when you take this
      trait.</p></li><li><p>Update the Class skills section of the Details tab
      of this trait to reflect your choice.</p></li><li><p>Update the target of
      the change on the Changes tab of this trait to reflect your
      choice.</p></li></ol>
    value: >-
      <p><em>Although you're a relative newcomer to Magnimar, you're not some
      naive stranger. You've been sent by the Pathfinder Society lodge in your
      home country to learn more about Varisia by experiencing the frontier
      firsthand. After arriving, you reported to the Magnimar lodge and placed
      your expertise at the venture-captain's
      disposal.</em></p><p><strong>Benefits</strong>: To represent your
      experience in distant lands, choose a country other than Varisia as your
      homeland and gain one of the languages spoken in that country as a bonus
      language. Additionally, choose one of the following skills: Handle Animal,
      Knowledge (geography), Linguistics, or Survival. You gain a +1 trait bonus
      on checks made with this skill and it is always a class skill for you.</p>
