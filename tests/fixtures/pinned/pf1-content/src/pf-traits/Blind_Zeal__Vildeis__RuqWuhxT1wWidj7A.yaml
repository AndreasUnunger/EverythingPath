  description:
    value: >-
      <p><em>You are blind but trained by followers of Vildeis to sense your
      surroundings by sound and touch.</em></p><p><strong>Requirements</strong>:
      Vildeis</p><p><strong>Benefits</strong>: You need not attempt a skill
      check to move at full speed. You take a –4 penalty from blindness on only
      Acrobatics, Ride, Sleight of Hand, and Stealth checks. You gain
      Blind-Fight as a bonus feat. You lose the benefits of this trait whenever
      you can see, but regain them if you once again become blind.</p>
