  description:
    value: >-
      <p><em>With the help of a druidic healer, you narrowly escaped death by
      disease or poisoning while on the run from Molthuni militias, whether
      contracting the ailment was an accident or you were the victim of more
      sinister forces.</em></p><p><strong>Requirements</strong>: Must hail from
      <span data-tooltip="Young resource-heavy nation in central Avistan. 
      Formerly claimed by Taldor, Cheliax and Molthune."><span
      style="text-decoration:underline">Nirmathas</span></span> or have lived
      there for at least 1 year</p><p><strong>Benefits</strong>: Whenever you
      successfully use the Heal skill to treat an ally’s poison or disease, you
      grant the ally an additional +1 trait bonus on the saving throw against
      the disease or poison. Heal is a class skill for you.</p>
