  description:
    value: >-
      <p><em>Whether you were serving in the military or simply beset by a
      surprise attack, you barely survived an encounter with the Ironfang
      Legion, one of Molthune’s infamous monster regiments. Maybe you even
      survived the horrors of the Ramgate Massacre. You can’t scrub the memories
      of their brutality from your waking or sleeping mind, and you keenly
      recall their distinctive fighting
      styles.</em></p><p><strong>Benefits</strong>: You gain a +2 dodge bonus to
      AC against goblinoids, and once per day when you attempt an Intimidate,
      Sense Motive, or Stealth check against a goblinoid, you can roll two dice
      and use the better result.</p>
