  description:
    value: >-
      <p><em>One of your ancestors ran afoul of a mummy’s curse while exploring
      an ancient tomb. This curse was passed down to later generations of your
      family, but over time, your line has become more resistant to curses.
      You’ve come to Wati to explore its untouched necropolis, and while you
      hope you won’t have to face a real undead mummy, at least you have some
      defense if you do.</em></p><p><strong>Benefits</strong>: You gain a +2
      trait bonus on saving throws against curses and curse effects (including
      mummy rot and spells with the curse descriptor) and a +2 trait bonus on
      saving throws against a mummy’s aura of despair.</p>
