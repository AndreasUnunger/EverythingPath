name: Chernasardo Hopeful (Ironfang Invasion)
system:
  contextNotes:
    - target: attack
      text: >-
        In forest or plains terrain, you may reduce a single target’s effective
        level of concealment against you (from total concealment to concealment
        to not concealed) by studying your natural surroundings as a move
        action. This reduced concealment ends immediately once the target moves
        from its current location. At 10th level, you may study your terrain as
        a swift action instead.
  description:
    value: >-
      <p><em>You’ve pledged your skills and your life to the Chernasardo
      rangers, studying to protect your homeland from foreign invaders. You
      currently remain a neophyte in this secretive guerrilla army. You have yet
      to be entrusted with many of their secrets, and spend a great deal of time
      training with the old ranger Aubrin in Phaendar to hone your skills of
      hunting and tracking.</em></p><p><strong>Benefits</strong>: In forest or
      plains terrain, you may reduce a single target’s effective level of
      concealment against you (from total concealment to concealment to not
      concealed) by studying your natural surroundings as a move action. This
      reduced concealment ends immediately once the target moves from its
      current location. At 10th level, you may study your terrain as a swift
      action instead.</p>
