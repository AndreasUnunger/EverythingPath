  description:
    value: >-
      <p><em>You are the product of generations of selective breeding, organized
      by the gold dragon Mengkare. Your education is top-notch, and you have a
      broad base of knowledge. Unfortunately, the isolation of Hermea has also
      made you slightly naive.</em></p><p><strong>Requirements</strong>: <span
      style="text-decoration:underline" data-tooltip="An isolated island nation
      in the Steaming Sea southwest off the coast of Varisia. Uninhabited until
      4552 AR, when the gold dragon Mengkare began to use it as the site of a
      unique social, and human breeding, experiment he called the Glorious
      Endeavor"><span
      style="text-decoration:underline">Hermea</span></span></p><p><strong>Benefits</strong>:
      You gain a +1 trait bonus on Knowledge (history) and Knowledge (religion)
      checks but take a –1 penalty on all Sense Motive checks.</p>
