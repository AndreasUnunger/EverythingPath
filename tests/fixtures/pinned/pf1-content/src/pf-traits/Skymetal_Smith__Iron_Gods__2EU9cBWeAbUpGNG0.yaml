name: Skymetal Smith (Iron Gods)
system:
  contextNotes:
    - target: will
      text: >-
        +[[2]] Trait bonus made against emotion and fear effects as long as you
        retain your Skymetal bauble. You lose this bonus if you willingly sell
        or give up the item, but if it is destroyed or lost through no fault of
        your own, the bonus becomes +1 instead.
  description:
    value: >-
      <p><em>The fires atop Torch Hill have long been a boon to smiths and
      metalworkers, and your family is no exception. Whether you grew up in
      Torch or simply made several trips here with your parents to use the fire,
      this was to be your first time to use the torch for your own project. You
      managed to use the fires to craft a small weapon or piece of armor from
      skymetal, but not long thereafter the fires went out. The violet flames
      are as much a part of your upbringing as anything else, and their loss
      distresses you; you hope to find a way to rekindle the torch below the
      hill.</em></p><p><strong>Benefits</strong>: You’ve long hoped to work with
      skymetal, and begin the game with a small metal bauble made of the
      skymetal of your choice—you made this item yourself. The item is nothing
      more than a valuable art object worth 100 gp. You can sell it to gain an
      additional 100 gp when creating your character, but if you keep it, your
      pride in its crafting grants you a +2 trait bonus on Will saving throws
      made against emotion and fear effects. You lose this bonus if you
      willingly sell or give up the item, but if it is destroyed or lost through
      no fault of your own, you retain a +1 trait bonus on such Will saves.</p>
