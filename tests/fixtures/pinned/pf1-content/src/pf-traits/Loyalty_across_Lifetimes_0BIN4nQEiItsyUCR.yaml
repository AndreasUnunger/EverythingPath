name: Loyalty across Lifetimes
system:
  description:
    instructions: >-
      <p>You can add a new ability feature to your eidolon and create a context
      note for this trait. Choose Constitution Checks and Will saves in the
      target of the context notes.</p>
    value: >-
      <p><em>You and your eidolon share a link that seems to span multiple
      lifetimes.</em></p><p><strong>Benefits</strong>: Your eidolon treats its
      Constitution score as if it were 2 points higher for the purposes of
      determining when its negative hit point total sends it back to its home
      plane. In addition, your eidolon gains a +1 trait bonus on Will saves
      against enchantment spells and effects.</p>
