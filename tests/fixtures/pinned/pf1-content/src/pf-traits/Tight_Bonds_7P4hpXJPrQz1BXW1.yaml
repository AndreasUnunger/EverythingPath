name: Tight Bonds
system:
  contextNotes:
    - target: will
      text: >-
        +[[1]] Trait bonus against charm and compulsion effects if a partner is
        within 60 feet. Increasing to a +[[3]] Trait bonus against a command to
        compromise your relationship or harm a partner.
  description:
    value: >-
      <p><em>Whether siblings, spouses, or dedicated members of the same clan,
      characters who take this trait are an inseparable pair committed to each
      other.&nbsp;</em></p><p><strong>Benefits</strong>: Your partner or
      partners must also have this trait. You gain a +1 trait bonus on Will
      saves against charm and compulsion effects if a partner is within 60 feet,
      increasing to +3 against a command to compromise your relationship or harm
      a partner.</p>
