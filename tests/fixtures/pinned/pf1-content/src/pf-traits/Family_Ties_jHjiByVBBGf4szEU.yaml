name: Family Ties
system:
  contextNotes:
    - target: wisSkills
      text: >-
        When a family member makes a request of you, you must fulfill that
        request or take a -[[2]] penalty on all Wisdom and Charisma based
        ability checks and skill checks until you either do what was requested
        or succeed at a DC 20 Will saving throw, which you can attempt once per
        day at the start of each day.
