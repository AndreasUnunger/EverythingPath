      Elion.</p><p>Either Knowledge (geography) or Survival becomes a class
      skill for you.</p><p>Once per day you can consult your compass or
      <em>wayfinder</em> as a full round action to gain a +2 trait bonus on one
      Knowledge (geography) or Survival check.</p>
