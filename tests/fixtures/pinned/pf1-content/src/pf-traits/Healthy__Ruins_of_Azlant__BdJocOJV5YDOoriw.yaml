  contextNotes:
    - target: skill.swm
      text: >-
        +[[1]] Trait bonus on checks to prevent nonlethal damage from fatigue
        after swimming for more than an hour at a time.  You can hold your
        breath for a number of rounds equal to [[3 * @abilities.con.total]].
    - target: conChecks
