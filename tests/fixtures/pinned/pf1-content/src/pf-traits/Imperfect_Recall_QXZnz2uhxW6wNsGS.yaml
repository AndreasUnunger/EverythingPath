  description:
    value: >-
      <p><em>Your belief in reincarnation, as taught by the Sangpotshi
      philosophy and in lands that were once Imperial Lung Wa, has been
      reinforced by personal experience. In moments of great stress, you
      sometimes experience flashes of déjà vu in which you recall information
      you don’t remember ever having
      known.</em></p><p><strong>Benefits</strong>: Once per day while you are in
