  description:
    value: >-
      <p><em>You have always looked after yourself first, and done whatever you
      need to do to survive. You’ve killed before, and you’ll kill again, but
      you don’t lose sleep over it. If it’s you or them, you invariably choose
      yourself. You follow no code, unless it’s doing whatever brings you to the
      top. Of course, sometimes you have to work with others, and that’s fine
      too, as long as the pay is right—whatever it takes to get the job done.
      With the current unrest in Cheliax, it’s starting to look like a good deal
      to work with House Thrune. You know Thrune rewards those who serve it
      well, and there’s no one else in Cheliax who can offer the power,
      prestige, and money that Thrune
      can.</em></p><p><strong>Requirements</strong>: Neutral
      evil</p><p><strong>Benefits</strong>: You’ve got a keen eye for what makes
      a good arrangement and when to walk away from a bad deal. You gain a +1
      trait bonus on Sense Motive checks, and Sense Motive is a class skill for
      you. In addition, as an immediate action once per day, you can shift your
      effective alignment so that you are considered neutral instead of evil for
      the purpose of good effects that target evil creatures (such as <em>holy
      smite</em> or a paladin’s smite evil ability). Your alignment does not
      actually change when you use this ability.</p>
