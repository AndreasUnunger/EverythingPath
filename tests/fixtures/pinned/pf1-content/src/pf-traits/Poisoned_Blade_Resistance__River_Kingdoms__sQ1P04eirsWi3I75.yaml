name: Poisoned Blade Resistance (River Kingdoms)
system:
  contextNotes:
    - target: fort
      text: +[[2]] Trait bonus against injury poisons.
  description:
    value: >-
      <p><em>In the River Kingdoms’ </em><span style="text-decoration:underline"
      data-tooltip="Daggermark is both a city and nation.  The largest city in
      all of the River Kingdoms, with a population over 27 thousand people, 
      Daggermark has political and economic stability in a region where both are
      very rare, with thriving industry and is wealthy enough to mint its own
      currency and maintain the largest army in the River Kingdoms."><em><span
      style="text-decoration:underline">Daggermark</span></em></span><em>, odds
      are good that any given blade is coated in some kind of poison, and people
      there are used to both poisoning and being
      poisoned.</em></p><p><strong>Requirements</strong>: <span
      style="text-decoration:underline" data-tooltip="Constantly shifting group
      of small city-states and fiefdoms in northeastern Avistan "><span
      style="text-decoration:underline">River
      Kingdoms</span></span></p><p><strong>Benefits</strong>: You gain a +2
      trait bonus on Fortitude saving throws against injury
      poisons.</p><p>Additionally, you are immune to one specific nonmagical
      injury poison. You must choose this poison when you choose this trait and
      cannot change it.</p>
