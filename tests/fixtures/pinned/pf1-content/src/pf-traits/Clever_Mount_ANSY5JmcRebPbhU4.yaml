  description:
    value: >-
      <p><strong>Requirements</strong>: Any animal can be a clever
      mount.</p><p><strong>Benefits</strong>: This mount can learn four tricks
      per point of Intelligence, instead of the typical three. Commanding the
      mount with the Handle an Animal use of the Handle Animal skill requires a
      successful DC 15 skill check instead of the usual DC 10, however, as it is
      willful and easily bored.</p>
