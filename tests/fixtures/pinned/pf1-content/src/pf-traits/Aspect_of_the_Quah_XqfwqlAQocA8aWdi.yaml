name: Aspect of the Quah
system:
  description:
    value: >-
      <p><em>You call upon your quah’s totem to grant you
      power.</em></p><p><strong>Benefits</strong>: You gain a unique totem
      aspect that replaces one of the animal aspects granted to you by the
      animal focus feature. You must be a hunter or have access to the animal
      aspect class feature to select this trait, and you must choose the Shoanti
      quah to which you belong. You gain access to the totem aspect listed for
      that clan, and you lose access to the animal aspect listed. Once made,
      this choice cannot be changed.</p><hr /><h3>Cliff (Shadde-Quah,
      Frog)</h3><p>The creature gains a +4 competence bonus on Acrobatics checks
      to avoid falling and on Constitution checks to avoid drowning. This bonus
      increases to +4 at 8th level and +6 at 15th level.</p><h3>Emberstorm
      (Sklar-Quah, Bear)</h3><p>The creature gains fire resistance 5. This
      increases to fire resistance 10 at 8th level and fire resistance 15 at
      15th level.</p><h3>Horse (Shriikirri-Quah, Owl)</h3><p>The creature gains
      a +4 competence bonus on Ride checks. This bonus increases to +6 at 8th
      level and +8 at 15th level.</p><h3>Star (Lyrune-Quah, Falcon)</h3><p>The
      creature gains low-light vision and a +2 competence bonus on Perception
      checks. This bonus increases to +4 at 8th level and +6 at 15th
      level.</p><h3>Storm (Tamiir-Quah, Snake)</h3><p>The creature gains a +4
      bonus on saving throws against cold dangers, disease, heat dangers,
      starvation, and thirst. This bonus increases to +6 at 8th level and +8 at
      15th level.</p><h3>Storm Roc (Shundar-Quah, Mouse)</h3><p>The creature
      gains a +2 enhancement bonus to Charisma. This bonus increases to +4 at
      8th level and +6 at 15th level.</p><h3>Will-o’-Wisp (Skoan-Quah, Wolf
      )</h3><p>The creature gains +2 bonus on saving throws against fear effects
      and mindaffecting effects. This bonus increases to +4 at 8th level and +6
      at 15th level.</p>
