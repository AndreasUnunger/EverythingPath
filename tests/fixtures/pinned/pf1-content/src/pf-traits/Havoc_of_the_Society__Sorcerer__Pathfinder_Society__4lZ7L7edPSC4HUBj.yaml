      <p><em>Through countless hours studying vast libraries of arcane power,
      you have learned how to cause greater damage to your
      foes.</em></p><p><strong>Requirements</strong>: Sorcerer, Pathfinder
      Society</p><p><strong>Benefits</strong>: Whenever you cast a spell that
      deals damage, you gain a +1 trait bonus to the total damage dealt. This
      damage is considered force damage regardless of the type of damage dealt
      by the spell.</p>
