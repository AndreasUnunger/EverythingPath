  description:
    instructions: >-
      <p>Select both a Focus and one of the 2 associated skills when you take
      this trait.</p><p>Update the Class skills section of the details tab of
      this trait to reflect your choice.</p><p>Update the target of the change
      on the Changes tab of this trait to reflect your choice.</p><p>Update the
      target of both Context notes on the changes tab of this trait to reflect
      the 2 Knowledge skills associated with your focus.</p>
    value: >-
      <p><em>Much of Kintargo’s history is lost or hidden. You know because
      you’ve made a point of seeking out those secrets. Local urban legends and
      bits of strange historical rumors have long fascinated you—who knows what
      amazing truths about Kintargo’s past have been lost forever to the
      redactors of House Thrune? What caused Professor Mangvhune of the
      Alabaster Academy to become the city’s most infamous serial killer? Who
      were the dragons Adrakash, Ithanothaur, and Rivozair, and what were their
      ties to Kintargo? Why do the Devil’s Bells of the Temple of Asmodeus seem
      to ring at random times, and is there a pattern to the peals? Who were the
      Silver Ravens who defended Kintargo during the Chelish Civil War, and why
      did they vanish so soon after that war’s resolution? So many mysteries,
      and who better than you to find the
      answers?</em></p><p><strong>Benefits</strong>: Pick one of the questions
      above as your focus. Answers to these questions can be discovered at
      different points during Hell’s Rebels, but don’t expect to learn these
      answers any time soon! More important, your choice of focus grants you a
      +1 trait bonus in a particular Knowledge skill check associated with that
      focus (pick one of the two options provided below for your question). That
      Knowledge skill is always a class skill for you. Once per day, when you
      attempt a Knowledge skill check in either of the types associated with
      your focus, you can roll twice and take the better result as your actual
      result.</p><p><em>Devil’s Bells</em>: Knowledge (arcana) or Knowledge
      (planes)</p><p><em>Local Dragons</em>: Knowledge (arcana) or Knowledge
      (history)</p><p><em>Professor Mangvhune</em>: Knowledge (local) or
      Knowledge (planes)</p><p><em>Silver Ravens</em>: Knowledge (local) or
      Knowledge (history).&nbsp;</p>
