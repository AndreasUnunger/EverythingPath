name: Triaxian Tradition (Triaxus)
system:
  contextNotes:
    - target: allSavingThrows
      text: >-
        +[[2]] Trait bonus against spells and spell-like abilities with the
        <choose from Disease or Cold when taking this trait> descriptor.
  description:
    instructions: >-
      <p>Select disease or cold when you take this trait.</p><p>Update the text
      of the first context note on the Changes tab of this trait to reflect your
      choice.</p><p>If you chose disease, update the target of the second
      context note to target fortitude saves</p><p>if you chose cold, delete the
      second context note.</p>
    value: >-
      <p><em>Your experience with one of the long Triaxian seasons has taught
      you much about the dangers of a long summer or
      winter.</em></p><p><strong>Requirements</strong>: <span
      style="text-decoration:underline" data-tooltip="Triaxus, known as the
      Wanderer, is the seventh planet in Golarion's solar system."><span
      style="text-decoration:underline">Triaxus</span></span></p><p><strong>Benefits</strong>:
      Choose disease or cold. You gain a +2 trait bonus on saves against spells
      and spell-like abilities with the chosen descriptor. If you choose
      disease, you gain the bonus on Fortitude saves against nonmagical diseases
      as well.</p>
