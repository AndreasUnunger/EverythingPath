name: Balanced Offensive (The Concordance)
system:
  description:
    instructions: >-
      <p>Select one (1) of five (5) available options when you take this
      trait.</p><p>Add this class ability to your actor and edit it as
      follows:</p><p>in the Limited Uses formula, replace existing text with: 1
      + floor(@attributes.hd.total / 5)</p><p>in the Damage Formula, replace
      existing text with: 1d6 + (floor(@attributes.hd.total / 2))</p>
    value: >-
      <p><em>You can call forth a surge of elemental energy to strike against
      your foes.</em></p><p><strong>Requirements</strong>: The
      Concordance</p><p><strong>Benefits</strong>: Once per day, you can target
      a distant foe with an elemental attack. This functions as one of the
      following cleric domain powers, chosen whenever you activate this ability:
      @UUID[Compendium.pf1.class-abilities.Item.L5jrgNDA43dMH1wm]{acid dart},
      @UUID[Compendium.pf1.class-abilities.Item.V57hEfKt1MroRI91]{fire bolt},
      @UUID[Compendium.pf1.class-abilities.Item.ructcpEg6rejcpYQ]{icicle},
      @UUID[Compendium.pf1.class-abilities.Item.o8rxNsQ7P7Yjlvvu]{lightning
      arc}, or @UUID[Compendium.pf1.class-abilities.Item.Kgcm3ye8CYGipsg3]{storm
      burst}. Your effective cleric level for this ability is equal to your
      character level. You can use this ability one additional time per day at
      5th level and every 5 levels thereafter.</p><hr />
  sources:
    - id: PZOPSS0000E
      pages: '29'
