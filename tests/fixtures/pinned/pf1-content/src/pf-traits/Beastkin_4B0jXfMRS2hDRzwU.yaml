  description:
    value: >-
      <p><strong>Benefits</strong>: Select one specific type of animal (such as
      wolves or apes). You were raised from infancy by an animal or pack of
      animals of that type. You learned their ways and have more in common with
      your beastly kin than members of any humanoid race. You gain a +1 trait
      bonus on Survival checks and can use
      <em>@UUID[Compendium.pf1.spells.Item.ct9fhh8uawn8e4md]{speak with
      animals}</em> as a spell-like ability at will to communicate with the type
      of animal that raised you.</p>
