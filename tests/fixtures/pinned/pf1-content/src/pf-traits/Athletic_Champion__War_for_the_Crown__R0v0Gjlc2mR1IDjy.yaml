  description:
    instructions: >-
      <p>Select two of: Climb, Diplomacy, Perception, or Swim when you take this
      trait.</p><p>Update the Class skills section of the Details tab of this
      trait to reflect both of your choices.</p><p>Update the targets of the 2
      changes on the Changes tab of this trait to reflect your choices.</p>
    value: >-
      <p><em>Your physique and skill brought you into the public eye, and a
      winning smile helps you stay there. Taldor honors its extraordinary
      athletes, celebrating them as cultural heroes. Whether you were a
      gladiator, a runner, a wrestler, or any other competitor, your most recent
      victory caused someone important to sit up and take notice. You may never
      have a political career in front of you, but for now your name is helping
      to bring a little extra money in, and maybe that’s good
      enough.</em></p><p><strong>Benefits</strong>: Select two of the following
      skills: Climb, Diplomacy, Perception, and Swim. You gain a +1 trait bonus
      on checks with those skills, and they are always class skills for you. In
      addition, you are accustomed to maneuvering through crowds; you gain a +2
      trait bonus on checks to navigate through a crowd or resist being moved
      against your will, including spells and bull rush, drag, and reposition
      combat maneuvers.</p>
