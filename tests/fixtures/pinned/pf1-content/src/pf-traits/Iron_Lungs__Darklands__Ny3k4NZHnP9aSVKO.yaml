name: Iron Lungs (Darklands)
system:
  contextNotes:
    - target: conChecks
      text: >-
        You can hold your breath for twice as long ([[4*@abilities.con.total]]
        rounds)
    - target: allSavingThrows
      text: +[[2]] Trait bonus against the effects of inhaled poisons.
  description:
    instructions: >-
      <p>Suffocation</p><p>source PRPG Core Rulebook pg. 445</p><p>A character
      who has no air to breathe can hold her breath for 2 rounds per point of
      Constitution.</p><p>If a character takes a standard or full-round action,
      the remaining duration that the character can hold her breath is reduced
      by 1 round.</p><p>After this period of time, the character must make a DC
      10 Constitution check in order to continue holding her breath.</p><p>The
      check must be repeated each round, with the DC increasing by +1 for each
      previous success.</p><p>When the character fails one of these Constitution
      checks, she begins to suffocate.</p><p>In the first round, she falls
      unconscious (0 hit points).</p><p>In the following round, she drops to –1
      hit points and is dying.</p><p>In the third round, she suffocates.</p>
    value: >-
      <p><strong>Requirements</strong>: <span style="text-decoration:underline"
      data-tooltip="Immense series of caverns, vaults, and passages that can be
      found beneath the surface of all of Golarion's continents"><span
      style="text-decoration:underline">Darklands</span></span>, usually under
      marshlands</p><p><strong>Benefits</strong>: Due to the constant intrusion
      of marsh gases seeping into the tunnels and chambers of your lair, you can
      hold your breath for twice as long and gain a +2 trait bonus on saving
      throws against the effects of inhaled poisons.</p><hr />
