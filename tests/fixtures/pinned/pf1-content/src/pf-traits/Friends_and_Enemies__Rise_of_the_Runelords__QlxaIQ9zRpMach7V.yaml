name: Friends and Enemies (Rise of the Runelords)
system:
  description:
    value: >-
      <p><em>One of your family members, perhaps a parent, cousin, aunt, or
      uncle, helped Daviren Hosk put down a group of goblins near Sandpoint.
      Since then, your family member passed away, but not before telling you
      about that day and the offer Daviren made her should she ever be in
      need.</em></p><p><strong>Benefits</strong>: Once you make it to Sandpoint
      and meet up with Daviren Hosk at the Goblin Squash Stables, he gives you
      one of his best steeds and all the necessary accoutrements as gratitude
      for your family member’s help: a
      @UUID[Compendium.pf-content.pf-goods-services.Item.JZdn5vUoAMGkBC3h]{heavy
      combat trained horse}, a
      @UUID[Compendium.pf1.items.Item.CIAbIcLjLUC7FtYP]{military saddle},
      @UUID[Compendium.pf1.items.Item.gW1bPqOvVfpmqEqd]{saddlebags},
      @UUID[Compendium.pf1.items.Item.zkfnrahkeufabend]{bit and bridle}, a
      month’s worth of @UUID[Compendium.pf1.items.Item.hwrgbauvnnirgqdy]{feed},
      and lifetime @UUID[Compendium.pf1.items.Item.mioexvfndsvhtkgn]{stabling}
      at the Goblin Squash Stables.</p>
