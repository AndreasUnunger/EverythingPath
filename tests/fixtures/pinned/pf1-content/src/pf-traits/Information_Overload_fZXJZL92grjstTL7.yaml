  description:
    value: >-
      <p><em>You have had access to thousands of spy reports, many of which
      turned out to be based on faulty deductions or even intentionally false
      stories spread by opposed spy groups. At this point, you have been exposed
      to false knowledge as much as accurate information, and you can’t always
      remember which is which.</em></p><p><strong>Effects</strong>: You take a
      -2 penalty on all Knowledge checks, and if you fail a Knowledge check by 5
      or more, you can recall information that is diametrically opposed to the
      truth.</p>
