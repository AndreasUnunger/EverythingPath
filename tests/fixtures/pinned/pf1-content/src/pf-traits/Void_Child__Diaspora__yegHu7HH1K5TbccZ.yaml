  description:
    value: >-
      <p><em>You were raised in the Diaspora and are accustomed to being
      isolated from most other life in the vast void of
      space.</em></p><p><strong>Requirements</strong>: <span
      style="text-decoration:underline" data-tooltip="The Diaspora is the name
      given to the wide belt of asteroids found between the planets of Verces
      and Eox. (The 5th and 6th, respectively, from Golarion's sun). These balls
      of rock and ice range in size from smaller than a grain of sand to the
      size of small planetoids."><span
      style="text-decoration:underline">Diaspora</span></span></p><p><strong>Benefits</strong>:
      You gain a +1 trait bonus on saves against fear; this bonus increases to
      +2 whenever you are 30 feet or farther from your nearest ally.</p>
