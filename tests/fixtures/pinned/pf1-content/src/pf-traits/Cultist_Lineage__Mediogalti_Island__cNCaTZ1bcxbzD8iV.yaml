  description:
    value: >-
      <p><em>Your parents were both Red Mantis assassins and your family has a
      long tradition of service in the Red Mantis cult. Your strict, fanatical
      upbringing and familiarity with murder have bestowed upon you an air of
      confidence and menace.</em></p><p><strong>Requirements</strong>: <span
      data-tooltip="Island nation located off the western coast of Garund and
      home to the Red Mantis Assassins."><span
      style="text-decoration:underline">Mediogalti
      Island</span></span></p><p><strong>Benefits</strong>: This grants you a +1
      trait bonus on Intimidate checks. If you act during the surprise round, as
      a free action during that round you can draw a light weapon (or two if you
      have the Two-Weapon Fighting feat .</p>
