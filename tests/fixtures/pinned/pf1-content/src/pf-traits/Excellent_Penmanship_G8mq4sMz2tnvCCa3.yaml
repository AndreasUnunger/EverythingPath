  description:
    value: >-
      <p><em>You are a master of calligraphy, an art once highly valued in Lung
      Wa and still held in high esteem in
      Lingshen.</em></p><p><strong>Benefits</strong>: The DC to detect forgeries
      you create increases by 2. If you attempt to persuade someone via a
      written message, you gain a +2 bonus on any Bluff, Diplomacy, or
      Intimidate check attempted for that communication. Linguistics is always a
      class skill for you.</p>
