name: Distance Aptitude
system:
  contextNotes:
    - target: spellEffect
      text: +[[1]] to CL to determine the range of spells and spell-like abilities.
  description:
    value: >-
      <p><em>You were exposed to the magic of an elf gate, portal, or some other
      form of distance-spanning magic when you were young. This contact with
      ancient world-spanning magic has granted you insight into means to extend
      the range of your own spells.</em></p><p><strong>Benefits</strong>: Treat
      your caster level as 1 higher for the purposes of determining the range of
      spells and spell-like abilities.</p><p><strong>Suggested
      Characters</strong></p><p>Elves, Numerians, Sarkorians.</p>
