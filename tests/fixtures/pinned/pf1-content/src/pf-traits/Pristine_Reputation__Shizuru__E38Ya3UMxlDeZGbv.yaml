      img: icons/environment/settlement/temple-night.webp
      name: reroll first failed save vs charm or compulsion
  contextNotes:
    - target: allSavingThrows
      text: >-
        The first time each day that you fail a saving throw against a charm or
        compulsion effect, you can reroll that saving throw. If you do so, you
        gain a +2 trait bonus on this roll and use this result as the actual
        result for that saving throw.
  description:
    value: >-
      <p><em>You come from an especially esteemed family, religious order,
      school, or other group that worships Shizuru, and draw upon that tradition
      to maintain your identity.</em></p><p><strong>Requirements</strong>:
      Shizuru</p><p><strong>Benefits</strong>: The first time each day that you
      fail a saving throw against a charm or compulsion effect, you can reroll
      that saving throw. If you do so, you gain a +2 trait bonus on this roll
      and use this result as the actual result for that saving throw.</p>
  scriptCalls:
    - _id: 7ZTYoGCGqEjKngeP
      category: postUse
      hidden: false
      img: icons/svg/dice-target.svg
      name: Reroll a Saving Throw
      type: script
      value: >-
        const content = `
          <div class="flexcol">
            <h3>Rerolling a Saving Throw:</h3>
            <p>Please pick a saving throw to reroll from the buttons below.</p>
          </div>
        `;


        const labels = [game.i18n.localize("PF1.SavingThrowFort"),
        game.i18n.localize("PF1.SavingThrowRef"),
        game.i18n.localize("PF1.SavingThrowWill")];


        async function getAnswer() {
          return Dialog.wait({
            title: `${item.name} – Reroll a Saving Throw`,
            content: content,
            buttons: {
              fort: {
                label: labels[0],
                callback: () => "fort",
              },
              ref: {
                label: labels[1],
                callback: () => "ref",
              },
              will: {
                label: labels[2],
                callback: () => "will",
              }
            },
            default: 'fort',
            close: () => null,
          },
          {
             height: "auto",
             width: 680,
          });
        }


        const answer = await getAnswer();

        if(answer !== null) {
          actor.rollSavingThrow(answer);
        } else {
          ui.notifications.warn(`No answer was selected. Restoring use of "${item.name}".`);
          await item.update({"system.uses.value": 1 });
        }
  sources:
    - id: PZO9472
      pages: '19'
