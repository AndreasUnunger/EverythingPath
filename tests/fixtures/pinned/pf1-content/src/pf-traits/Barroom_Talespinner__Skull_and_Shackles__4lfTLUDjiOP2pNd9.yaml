      description: >-
        <p>Once per week, you can make a DC 15 Knowledge (local) or Intelligence
        check to see if you know a popular legendary pirate tale, the telling of
        which grants you a +1 trait bonus on checks made to influence NPCs on
        the Wormwood.</p>
      img: icons/tools/navigation/map-chart-tan.webp
      name: Use
  description:
    instructions: >-
      <ol><li><p>Select one category of Perform when you take this
      trait.</p></li><li><p>Update the Skills tab of your Actor to add the
      chosen Perform skill.</p></li><li><p>Select Diplomacy or the previously
      selected Perform type</p></li><li><p>Update the Class skills section of
      the Details tab of this trait to reflect your choice.</p></li></ol>
    value: >-
      <p><em>You grew up listening to tales of adventure and piracy on the high
      seas and the sea chanteys of old salts in dockside dives. You learned all
      about what it's like to be a pirate by talking with the sailors on shore
      leave, and learned how to tell a tale (or perform some other pirate
      entertainment) yourself. You went to a tavern called the Formidably Maid
      in Port Peril to earn a few coins with your tales of the sea. The patrons
      seemed pleased with your performance and bought you a few drinks. You had
      just remembered a tale of an unfortunate sailor who found himself
      press-ganged on a pirate ship after his drink was drugged when suddenly
      everything went black.</em></p><p><strong>Benefits</strong>: You gain a +1
      trait bonus on Diplomacy checks and one category of Perform checks, and
      one of these skills is a class skill for you. In addition, once per week
      you can make a DC 15 Knowledge (local) or Intelligence check to see if you
      know a popular legendary pirate tale, the telling of which grants you a +1
      trait bonus on checks made to influence NPCs on the Wormwood.</p><hr />
