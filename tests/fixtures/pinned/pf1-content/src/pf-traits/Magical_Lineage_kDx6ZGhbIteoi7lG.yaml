system:
  description:
    value: >-
      <p><em>One of your parents was a gifted spellcaster who not only used
      metamagic often, but developed many magical items and perhaps even a new
      spell or two,and you have inherited a fragment of this
      greatness.</em></p><p><strong>Benefits</strong>: Pick one spell when you
      choose this trait. When you apply metamagic feats to this spell, treat its
      actual level as 1 lower for determining the spell's final adjusted
      level.</p>
