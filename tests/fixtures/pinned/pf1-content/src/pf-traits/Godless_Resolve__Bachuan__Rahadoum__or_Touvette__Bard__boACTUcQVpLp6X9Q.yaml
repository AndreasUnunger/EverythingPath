      text: +[[2]] Trait bonus to stabilize dying creatures and stop bleeding.
  description:
    value: >-
      <p><em>Some brilliant and earnest speech or other performance inspired you
      to take charge of your own health rather than begging indifferent or
      outlawed deities for
      deliverance.</em></p><p><strong>Requirements</strong>: Bard who hails from
      <span data-tooltip=" Autocratic atheist nation at mid-latitudes of Tian
      Xia on the Okaiyo coast"><span
      style="text-decoration:underline">Bachuan</span></span>, <span
      data-tooltip=" Arid desert nation on the north-western corner of Garund.
      It is led by a council of elders and has a strict policy and law
      prohibiting the worship of Gods"><span
      style="text-decoration:underline">Rahadoum</span></span>, or <span
      data-tooltip="One of the River Kingdoms, Touvette is a military
      dictatorship and atheist state in north eastern Avistan"><span
      style="text-decoration:underline">Touvette</span></span>, or who has lived
      there for at least 1 year</p><p><strong>Benefits</strong>: Heal is a class
      skill for you, and you gain a +2 trait bonus on Heal checks to stabilize
      dying creatures and stop bleeding.</p>
