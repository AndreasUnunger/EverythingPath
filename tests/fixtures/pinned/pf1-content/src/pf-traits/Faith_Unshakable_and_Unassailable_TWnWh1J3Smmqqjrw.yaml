name: Faith Unshakable and Unassailable
system:
  contextNotes:
    - target: will
      text: >-
        +[[2]] Trait bonus against charm, compulsion, and fear effects. For
        every two other faith traits you have, this bonus increases by 1.
  description:
    instructions: >-
      <p> Increase bonus in changes tab by one for every two faith traits you
      have.</p>
    value: >-
      <p><em>Your dedication to your ideals is stronger than
      steel.</em></p><p><strong>Exemplar Type</strong>: Faith
      Exemplar</p><p><strong>Benefits</strong>: You gain a +2 trait bonus on
      Will saves against charm, compulsion, and fear effects. For every two
      other faith traits you have, this bonus increases by
      1.</p><p><strong>Exemplar Traits</strong>: A character can have only one
      exemplar trait, and selecting an exemplar trait takes the place of two
      regular traits. Each exemplar trait is tied to a trait category, such as
      combat traits or regional traits; a character with an exemplar trait is no
      longer restricted to a single trait of that category and can select any
      number of such traits when gaining further traits. In addition, a
      character with an exemplar trait can select the Additional Traits feat any
      number of times and use the feat to gain an exemplar trait of a valid
      trait category for which they qualify.</p>
