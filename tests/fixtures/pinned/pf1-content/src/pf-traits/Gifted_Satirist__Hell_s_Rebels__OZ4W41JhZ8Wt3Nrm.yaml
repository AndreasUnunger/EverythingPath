  description:
    value: >-
      <p><em>You grew up among Kintargo’s performers and entertainers. Perhaps
      your parents or older siblings were singers at the Kintargo Opera House,
      or maybe you simply had to make ends meet as an orphan of the streets by
      busking. Whatever the case, you’ve long been exposed to the practice of
      cloaking scathing political commentaries in the form of harmless
      entertainment. Whether you conceal your satire in the form of novels,
      plays, screeds, or public letters, you’ve yet to make a name for yourself
      as a political presence in Kintargo—but in time, you hope to change
      that!</em></p><p><strong>Benefits</strong>: You gain a +1 trait bonus on
      Linguistics checks, and Linguistics is always a class skill for you. In
      addition, your irreverent attitude grants you a +2 trait bonus on all
      saving throws against fear effects.</p>
