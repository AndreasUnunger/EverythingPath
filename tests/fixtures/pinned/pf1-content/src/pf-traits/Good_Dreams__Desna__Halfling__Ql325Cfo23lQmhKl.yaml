name: Good Dreams (Desna; Halfling)
system:
  actions:
    - _id: LuvGPqdwDEBj4jZX
      activation:
        type: nonaction
        unchained:
          type: nonaction
      name: roll save twice, take best result
  contextNotes:
    - target: allSavingThrows
      text: >-
        Once per day, if you have to make a saving throw against a threat
        related, or similar, to your dangerous dream, you can roll twice and
        take the more favorable result.
  description:
    value: >-
      <p><em>Your dreams often give you a hint of possible dangers you might
      face during your day, such as a fall, a blast of fire, or a poisonous
      snake, and this hint sometimes makes all the
      difference.</em></p><p><strong>Requirements</strong>: Desna; Halfling,
      [Can not have the
      @UUID[Compendium.pf-content.pf-racial-traits.Item.D7JILr96IKHWN4vQ]{Halfling
      jinx} racial trait]</p><p><strong>Benefits</strong>: Each time you sleep,
      the GM tells you of a dangerous dream you had.</p><p>Once per day, if you
      have to make a saving throw against a threat related or similar to that
      dream, you can roll twice and take the more favorable result.</p><p><span
      id="ctl00_MainContent_DataListTypes_ctl94_LabelType">If you do not
      encounter circumstances similar to the threat or situation you dreamed,
      this trait has no effect that day.</span></p><p><span
      id="ctl00_MainContent_DataListTypes_ctl94_LabelType">If you have the
      </span>@UUID[Compendium.pf-content.pf-racial-traits.Item.D7JILr96IKHWN4vQ]{Halfling
      jinx} <span id="ctl00_MainContent_DataListTypes_ctl94_LabelType">trait,
      you cannot select this trait and vice versa.<br /></span></p>
