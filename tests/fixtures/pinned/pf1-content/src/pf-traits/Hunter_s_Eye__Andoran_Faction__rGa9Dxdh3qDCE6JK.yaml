system:
  description:
    instructions: >-
      <p>Select longbow or shortbow when you take this trait.</p><p>Update the
      Granted Proficiencies&gt;Weapon Proficiencies section of the details tab
      of this trait to reflect this choice.</p>
    value: >-
      <p><em>Your parents had you blessed by the god Erastil as a youth, and you
      are a prodigy with a bow.</em></p><p><strong>Requirements</strong>:
      Andoran Faction</p><p><strong>Benefits</strong>: You do not take any
      penalties for the second range increment when using a
      @UUID[Compendium.pf1.weapons-and-ammo.Item.PqJih70EG2A1XNGf]{longbow} or
      @UUID[Compendium.pf1.weapons-and-ammo.Item.Ata6ajiY9wuAnBLB]{shortbow},
      and you are always considered proficient with one of these weapons (your
      choice).</p>
