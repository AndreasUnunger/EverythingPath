  description:
    value: >-
      <p><em>You have a way with calming tempers, using cool logic to sooth
      heated disagreements, and you were always the one to settle arguments
      among your friends, family, and
      community.</em></p><p><strong>Benefits</strong>: You receive a +1 trait
      bonus on Diplomacy checks.</p><p>In addition, you receive a +1 trait bonus
      to the DC of any charm or compulsion effect that does not provide ongoing
      control and results in peaceful acts, such as
      @UUID[Compendium.pf1.spells.Item.6orhthk4g27rncuu]{calm emotions},
      @UUID[Compendium.pf1.spells.Item.3plb67e51webutdz]{sleep}, or a
      @UUID[Compendium.pf1.spells.Item.zqj5qzyl46af27v0]{suggestion} to lay down
      arms.</p>
