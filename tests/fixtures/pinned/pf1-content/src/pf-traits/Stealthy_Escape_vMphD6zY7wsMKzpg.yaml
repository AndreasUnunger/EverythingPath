name: Stealthy Escape
system:
  contextNotes:
    - target: skill.esc
      text: >-
        When escaping restraints (but not grapples) you may make a Sleight of
        Hand check instead of Escape Artist check. if you succeed, you gain
        +[[2]] to Bluff to pretend to still be bound
    - target: skill.slt
