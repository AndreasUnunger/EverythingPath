name: Gemstone Collector (Yuelral)
system:
  contextNotes:
    - target: will
      text: >-
        +[[1]] Trait bonus as long as you carry bejeweled objects worth a total
        combined value of [[200 * @attributes.hd.total]] gp
    - target: ''
      text: >-
        +[[2]] Trait bonus as long as you carry bejeweled objects worth a total
        combined value of [[200 * @attributes.hd.total]] gp
  description:
    instructions: >-
      <p>Select any one skill that is normally Charisma-based when you take this
      trait.</p><p>Update the target of the note on the changes tab of this
      trait to reflect your choice.</p>
    value: >-
      <p><em>You have long found focus and inspiration in the natural beauty of
      rare gemstones.</em></p><p><strong>Requirements</strong>:
      Yuelral</p><p><strong>Benefits</strong>: As long as you carry bejeweled
      objects worth a total combined value of 200 gp x your character level, you
      gain a +1 trait bonus on all Will saving throws and a +2 trait bonus on a
      single Charisma-based skill check of your choice.&nbsp;</p>
