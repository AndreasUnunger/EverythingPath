name: Sun-Blessed
system:
  contextNotes:
    - target: effect
      text: >-
        Any healing that exceeds your maximum hit points is gained as temporary
        hit points up to your character level per day.
  description:
    value: >-
      <p><em>You have shown a significant talent for the magical arts, gaining
      the attention of the famed Acadamae of
      Korvosa.</em></p><p><strong>Benefits</strong>: Whenever you’re affected by
      a healing effect that would heal more hit points than your maximum hit
      point total, you gain the excess healing as temporary hit points. You can
      gain up to a number of temporary hit points per day equal to your
      character level in this way. These temporary hit points last for 1
      minute.</p>
