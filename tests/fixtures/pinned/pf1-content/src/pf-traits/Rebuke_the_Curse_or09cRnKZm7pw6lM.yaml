      name: Use
  description:
    value: >-
      <p><strong>Benefits</strong>: Once per day, you can attempt to suppress
      the effects of a curse on a single creature with a touch. This functions
      as a <em>remove curse</em> spell, treating your character level as your
      caster level. If you succeed at your caster level check against the curse,
      the curse’s effects are negated for 1 minute. This trait does not allow a
      person burdened with a cursed item to remove or discard it. Use of this
      trait is a supernatural ability.</p>
