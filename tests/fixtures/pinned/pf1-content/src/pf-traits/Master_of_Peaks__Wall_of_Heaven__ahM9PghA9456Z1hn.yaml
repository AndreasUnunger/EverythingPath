name: Master of Peaks (Wall of Heaven)
system:
  contextNotes:
    - target: fort
      text: >-
        +[[2]] Trait bonus against the effects of cold dangers and altitude
        sickness.
  description:
    value: >-
      <p><em>You have made it to the summits of a number of the Wall of Heaven's
      peaks, and your body is used to the effects of both extreme cold and high
      altitude.</em></p><p><strong>Requirements</strong>: <span
      style="text-decoration:underline" data-tooltip="The Wall of Heaven, known
      locally as the Qiang Tian, is the dominant mountain range on the continent
      of Tian Xia. The range extends along almost all of Tian Xia's western
      coast, beginning near the Crown of the World in the northern realm of
      Hongal and run down to the naga empire of Nagajor far to the south."><span
      style="text-decoration:underline">Wall of
      Heaven</span></span></p><p><strong>Benefits</strong>: You gain a +2 trait
      bonus on Fortitude saving throws made against the effects of cold dangers
      and altitude sickness.</p>
