name: Headstrong
system:
  description:
    value: >-
      <p><em>You feel compelled to correct every action and argument that
      contradicts your worldview.</em></p><p><strong>Effects</strong>: Whenever
      you witness an action or hear an argument that contradicts your alignment,
      you must attempt to stop or correct that action or argument. If you either
      don’t try to stop it or fail in your attempt to stop it (as adjudicated by
      the GM), you are shaken for 1 hour.</p>
