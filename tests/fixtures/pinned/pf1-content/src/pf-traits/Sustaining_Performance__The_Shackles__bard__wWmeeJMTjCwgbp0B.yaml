  description:
    value: >-
      <p><em>Abandoned by a traditional healer at a critical time, you
      improvised a tale or jokes to keep up the spirits of someone in dire
      health.</em></p><p><strong>Requirements</strong>: Bard who hails from
      <span style="text-decoration:underline" data-tooltip="The Shackles is an
      extended archipelago off the coast of western Garund, directly to the
      south of the never-ending hurricane known as the Eye of Abendego"><span
      style="text-decoration:underline">The Shackles</span></span> or who has
      lived there for at least 1 year</p><p><strong>Benefits</strong>: Once per
      day as a standard action, you can attempt a DC 15 Perform check with an
      audible component (such as comedy, oratory, sing, or with any instrument)
      to stabilize a dying creature that can hear you within 30 feet. You can
      also attempt Perform checks instead of Heal checks to provide long-term
      care.</p>
