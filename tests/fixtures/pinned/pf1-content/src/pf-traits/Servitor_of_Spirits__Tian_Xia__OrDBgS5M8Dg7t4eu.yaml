name: Servitor of Spirits (Tian Xia)
system:
  actions:
    - _id: uP0YTXhQBn3JgRbR
      activation:
        type: free
        unchained:
          type: free
      description: >-
        <p>At the start of each day, you can choose one medium spirit
        (<em>Pathfinder RPG Occult Adventures 33–36</em>) and accept one of its
        taboos for 24 hours. As long as you don’t break that taboo, once during
        the next 24 hours, you can add a +1 trait bonus to any one roll, check,
        or saving throw (but not to AC) listed under your chosen spirit’s spirit
        bonus. Using this ability is a free action that you can use even if it
        isn’t your turn. If you are a medium, the spirit you choose with this
        trait must be the same as the spirit you are channeling and vice
        versa.</p>
      img: icons/environment/settlement/watchtower-city.webp
      name: Use
  description:
    value: >-
      <p><em>For as long as you can remember, the spirits have always whispered
      into your ears and guided you—provided that you appease
      them.</em></p><p><strong>Requirements</strong>: Must hail from <span
      data-tooltip="Tian Xia, aka the Dragon Empires, is the continent farthest
      from the Inner Sea and home to the Tian peoples."><span
      style="text-decoration:underline">Tian Xia</span></span> or have lived
      there for at least 1 year</p><p><strong>Benefits</strong>: At the start of
      each day, you can choose one medium spirit (<em>Pathfinder RPG Occult
      Adventures 33–36</em>) and accept one of its taboos for 24 hours. As long
      as you don’t break that taboo, once during the next 24 hours, you can add
      a +1 trait bonus to any one roll, check, or saving throw (but not to AC)
      listed under your chosen spirit’s spirit bonus. Using this ability is a
      free action that you can use even if it isn’t your turn. If you are a
      medium, the spirit you choose with this trait must be the same as the
      spirit you are channeling and vice versa.</p>
