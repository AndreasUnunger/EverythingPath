  description:
    instructions: >-
      <p>Select two skills for which your associated hero has skill ranks when
      you take this trait.</p><p>Update the Class skills section of the Details
      tab of this trait to reflect these two choices.</p><p>Update the target of
      the changes on the Changes tab of this trait to reflect these two
      choices.</p>
    value: >-
      <p><em>Your character has a personal link or association with one of
      Varisia’s established heroes. This hero should be a PC you played in a
      previous campaign (and could be, but need not be, one of the Sihedron
      Heroes). Your character could be a younger sibling, younger cousin, or
      even an apprentice of the hero. If enough time has passed, you might be
      the hero’s child, or your character could have reincarnated from the soul
      of a hero that died before your character was
      born.</em></p><p><strong>Benefits</strong>: Choose two skills for which
      your associated hero has skill ranks. You gain a +1 trait bonus on checks
      with both of those skills, and those two skills are class skills for
      you.</p><p>Once per adventure as a free action, you can call upon a
      previously forgotten bit of advice or lore imparted to you by the hero to
      gain an insight bonus equal to your class level (minimum +10) to a skill
      check. You may choose to apply this bonus after you roll the skill check,
      but must do so before the result of the roll is known.</p><hr />
