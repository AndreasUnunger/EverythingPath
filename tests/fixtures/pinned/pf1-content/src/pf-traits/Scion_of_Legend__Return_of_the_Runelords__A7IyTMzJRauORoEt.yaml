      description: >-
        <p>Once per adventure, as a free action, you can call upon a previously
        forgotten bit of advice or lore imparted to you by the hero to gain an
        insight bonus equal to your class level (minimum +10) to a skill check.
        You may choose to apply this bonus after you roll the skill check, but
        must do so before the result of the roll is known.</p><p>(+[[max(10,
