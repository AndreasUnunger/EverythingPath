  description:
    value: >-
      <p><em>You’ve spent more than your fair share of time among the strange
      sloping slums that cover the rooftops of much of Old
      Korvosa.</em></p><p><strong>Requirements</strong>: <span
      style="text-decoration:underline" data-tooltip="Largest city in Varisia
      and was once the capital of Chelaxian Varisia"><span
      style="text-decoration:underline">Korvosa</span></span> in <span
      style="text-decoration:underline" data-tooltip="Vast, sparsely populated,
      region in northwest Avistan"><span
      style="text-decoration:underline">Varisia</span></span></p><p><strong>Benefits</strong>:
      When using the Acrobatics skill to make a long jump, you treat the DC of
      the skill check as if the distance being jumped were 5 feet shorter than
      it actually is.</p>
