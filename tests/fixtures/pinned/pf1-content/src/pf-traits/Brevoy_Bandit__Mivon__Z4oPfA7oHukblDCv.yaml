  description:
    instructions: >-
      <p>Select one Profession skill and one ability score other than Wisdom
      when you take this trait. Update the Skills tab of your Actor to add the
      chosen skill. Update the target of the change on the Changes tab of this
      trait to reflect your choice.</p><p>Update the formula of the change to
      one of following the 5 options reflecting the selected ability score
      (other than Wisdom): @abilities.str.mod; @abilities.dex.mod;
      @abilities.con.mod; @abilities.int.mod; @abilities.cha.mod</p>
    value: >-
      <p><em>You fled the persecution of Brevoy authorities and wound up in
      Mivon. Whether or not you are guilty of your alleged crimes, you seek to
      build a new life amid new
      neighbors.</em></p><p><strong>Requirements</strong>:
      Mivon</p><p><strong>Benefits</strong>: Choose one Profession skill and one
      ability score other than Wisdom. You add that ability score’s modifier in
      addition to your Wisdom modifier on checks with the chosen Profession
      skill.</p>
