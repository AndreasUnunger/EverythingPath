    value: >-
      <p><em>Alchemy is a point of national pride in Thuvia, home of the famous
      sun orchid elixir. But resources are often hard to come by in the blasted
      desert landscape, so you have found creative ways to create many of the
      tools you need to survive.</em></p><p><strong>Requirements</strong>: <span
      style="text-decoration:underline" data-tooltip="Desert nation on northern
      coast of Garund, on the Inner Sea."><span
      style="text-decoration:underline">Thuvia</span></span></p><p><strong>Benefits</strong>:
      You gain a +2 trait bonus on Craft (alchemy) skill checks. This bonus
      increases to +3 when you are using Craft (alchemy) to craft an alchemical
      item.</p>
