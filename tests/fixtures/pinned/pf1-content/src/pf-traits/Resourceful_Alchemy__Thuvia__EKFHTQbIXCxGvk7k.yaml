  description:
    instructions: >-
      <p>Update the Skills tab of your Actor to add the Craft (alchemy)
      skill.</p><p>Update the target of the change on the Changes tab of this
      trait to reflect the Craft (alchemy) skill.</p><p>Update the target of the
