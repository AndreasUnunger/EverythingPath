name: Toilcrafter (Droskar)
system:
  description:
    instructions: >-
      <p>Select one Craft or Profession skill in which you have at least 1 rank 
      when you take this trait.</p>
    value: >-
      <p><em>You can craft passable if inferior magical weapons, armors, and
      shields through diligence and
      toil.</em></p><p><strong>Requirements</strong>:
      Droskar</p><p><strong>Benefits</strong>: Choose one Craft or Profession
      skill in which you have at least 1 rank. Ranks in your chosen skill count
      as your caster level for the purpose of qualifying for the Craft Magic
      Arms and Armor feat. You may craft +1 armor, weapons, or shields (with no
      special qualities), substituting your rank in the chosen skill for your
      caster level. You must use the chosen skill for the check to create the
      item. Crafting in this fashion takes twice as long as normal. These items
      cannot be upgraded with new abilities.</p>
