name: Blight-Burned (Ironfang Invasion)
system:
  contextNotes:
    - target: fort
      text: +[[2]] Trait bonus against <chose disease or poison>
    - target: init
      text: >-
        You are immediately alerted to the presence of aberrations, oozes, and
        all creatures with the blighted fey and fungal creature templates within
        30 feet (though it doesn’t indicate their exact location). You can
        always act during the surprise round against such creatures, and you
        aren’t considered flat-footed against such creatures in the first round
        of combat.
  description:
    instructions: >-
      <p>Select disease or poison when you take this trait.</p><p>Update the
      text of the Context note that targets Fortitude Saves on the changes tab
      of this trait to reflect your choice</p>
    value: >-
      <p><em>You were raised deep in the Fangwood Forest, but in your childhood
      the Darkblight overtook your community, and blighted fey attacked your
      friends and family. Even after escaping, you barely survived infection by
      the otherworldly fungal disease and still bear a terrible scar from your
      ordeal.</em></p><p><strong>Benefits</strong>: You gain a +2 trait bonus on
      Fortitude saving throws against disease or poison (your choice), and your
      scar now throbs painfully in the presence of unnatural creatures,
      immediately alerting you to their presence. This sixth sense alerts you to
      the presence of aberrations, oozes, and all creatures with the blighted
      fey and fungal creature templates within 30 feet (though it doesn’t
      indicate their exact location). You can always act during the surprise
      round against such creatures, and you aren’t considered flat-footed
      against such creatures in the first round of combat.</p>
