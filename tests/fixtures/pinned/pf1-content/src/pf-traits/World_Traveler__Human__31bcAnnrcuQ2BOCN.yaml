    instructions: >-
      <p>Select one of the following skills: Diplomacy, Knowledge (local), or
      Sense Motive, when you take this trait.</p><p>Update the Class skills
      section of the Details tab of this trait to reflect your
      choice.</p><p>Update the target of the change on the Changes tab of this
