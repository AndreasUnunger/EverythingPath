name: Brute (Orc)
system:
  contextNotes:
    - target: attack
      text: >-
        Whenever you score a critical threat, you add (but not multiply, in the
        case of a confirmed critical hit) an amount of damage equal to your
        weapon’s critical modifier.
  description:
    instructions: >-
      <p>For each weapon your actor wields, modify as
      follows:</p><ul><li><p>Edit the weapon.</p></li><li><p>On the weapon's
      details tab, edit the attack.</p></li><li><p>On the attack's Action tab,
      scroll down to the Damage section and click the "+ Add Critical Damage
      Bonus Formula" button</p></li><li><p>In the damage formula, enter the
      weapon's Critical Multiplier.</p></li><li><p>The type (B/P/S) should match
      that of the weapon.</p></li></ul><p>The above steps will add damage
      automatically to confirmed criticals but, as this trait applies to all
      threats,  this bonus damage must still be added manually to regular damage
      on threats which are not confirmed.</p>
    value: >-
      <p><em>You are an especially large and hulking individual, and when you
      strike, you aim to deliver the maximum amount of
      pain.</em></p><p><strong>Requirements</strong>: Half-Orc,
      Orc</p><p><strong>Benefits</strong>: Whenever you score a critical threat,
      you add (but not multiply, in the case of a confirmed critical hit) an
      amount of damage equal to your weapon’s critical modifier.</p>
