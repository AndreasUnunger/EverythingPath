      <p><em>As a resident of the undead lands of Geb, you know well that the
      walking dead often carry deadly poisons and diseases within
      them.</em></p><p><strong>Requirements</strong>: <span data-tooltip="Once
      the southern most province of Osirion, it is now an undead dictatorship on
      Garund's Obari coast."><span
      style="text-decoration:underline">Geb</span></span></p><p><strong>Benefits</strong>:
      <span id="ctl00_MainContent_DataListTypes_ctl266_LabelType">You gain a +3
