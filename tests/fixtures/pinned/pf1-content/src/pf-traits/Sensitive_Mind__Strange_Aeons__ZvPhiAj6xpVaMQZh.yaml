name: Sensitive Mind (Strange Aeons)
system:
  actions:
    - _id: h14pUh0TdsQrjJUk
      activation:
        type: minute
        unchained:
          type: minute
      description: >-
        <p>Once per week you can use the psychometry occult skill unlock even if
        you are not capable of casting psychic spells or have the Psychic
        Sensitivity feat.</p><p><strong>rule note<strong>:</p><p><strong>source
        Occult Adventures pg. 196</strong></p><p>You can read the psychic
        impressions left on objects or in places by previous owners and
        events.</p><p>Check: Once per day, you can concentrate for 1 minute
        while in physical contact with an item or location, during which you
        receive flashes of insight regarding the subject’s nature and ownership.
        After 1 minute, you attempt a DC 15 Appraise check to decipher the
        visions. You gain one piece of information about the historical
        significance or the last previous owner—such as a glimpse of the last
        owner’s appearance or its emotional state when it last used the
        item—determined by the GM. You learn one more piece of information for
        every 10 by which your check result exceeds the DC, as long as you
        concentrate for 1 additional minute for each piece of information. If
        you fail the check by less than 5 or the item has no significant psychic
        imprint, you don’t learn any information. If you fail this check by 5 or
        more, the item appears to be psychically significant even if it’s not,
        and the information you gain is wildly inaccurate. If you attempt to use
        psychometry on an item affected by charge object or implant false
        reading, you automatically learn all information imprinted by the spell.
        You must also attempt a Will save. If the item is affected by an implant
        false reading spell, on a success, you realize the information was
        false, and can determine the true information as well. On a failure, or
        if the item is affected by a charge object spell, you believe the
        information is true.</p><p>Action: Reading an object requires at least 1
        minute of uninterrupted concentration.</p>
      img: icons/tools/navigation/map-chart-tan.webp
