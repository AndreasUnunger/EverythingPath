  description:
    instructions: >-
      <p>Select Appraise, Perception, or Sense Motive when you take this
      trait.</p><p>Update the Class skills section of the details tab of this
      trait to reflect your choice.</p>
    value: >-
      <p><em>You awake in the asylum horribly aware of dangers lurking nearby.
      While your memories are hazy and indistinct, everything around you looks
      vibrant and clear. You have an inkling that you have always been
      perceptive and can tell a lot about a person even in a quick meeting. This
      sensitivity can overwhelm you at times, especially in your current
      situation.</em></p><p><strong>Benefits</strong>: You gain a +1 trait bonus
      on Appraise, Perception, and Sense Motive checks, and one of these (your
      choice) is a class skill for you. In addition, once per week you can use
      the psychometry occult skill unlock even if you are not capable of casting
      psychic spells or have the Psychic Sensitivity feat.&nbsp;</p>
