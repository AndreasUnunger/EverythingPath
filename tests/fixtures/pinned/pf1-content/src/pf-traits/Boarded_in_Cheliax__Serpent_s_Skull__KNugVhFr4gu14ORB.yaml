name: Boarded in Cheliax (Serpent's Skull)
system:
  contextNotes:
    - target: skill.kge
      text: >-
        +[[2]] Competence bonus on check made regarding the Mwangi Expanse, as
        long as you remain able to consult the detailed map of the Mwangi
        Expanse you began play with.
  description:
    value: >-
      <p><em>While you aren't necessarily a native of Cheliax, you boarded the
      Jenivere at one of that country's port cities. As the people of Cheliax
      generally know the Mwangi Expanse as a near legendary land home to strange
      beasts and exotic treasures, your views of the region have a distinctly
      romantic tinge, and the desire for fame, wealth, and adventure likely
      motivate your travels.</em></p><p><strong>Benefits</strong>: You begin the
      campaign with a detailed map of the Mwangi Expanse (this grants +2
      competence bonus on all Knowledge (geography) checks made regarding this
      region) and 200 gp worth of mundane equipment to aid your exploration of
      the jungle.</p>
