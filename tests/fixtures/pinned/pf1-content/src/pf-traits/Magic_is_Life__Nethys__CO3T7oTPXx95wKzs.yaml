name: Magic is Life (Nethys)
system:
  contextNotes:
    - target: allSavingThrows
      text: >-
        +[[2]] Trait bonus against death effects while you are under the effects
        of any spell.
    - target: conChecks
      text: >-
        If you are reduced to negative hit points, while you are under the
        effects of any spell, you automatically confirm stabilization checks to
        stop bleeding.
  description:
    value: >-
      <p><em>Your faith in magic allows you to reflexively use the energy of any
      spell effect on you to save you from
      death.</em></p><p><strong>Requirements</strong>:
      Nethys</p><p><strong>Benefits</strong>: As long as you are under the
      effects of any spell, you gain a +2 trait bonus on saving throws against
      death effects. If you are reduced to negative hit points while you are
      under the effects of any spell, you automatically confirm stabilization
      checks to stop bleeding.</p>
