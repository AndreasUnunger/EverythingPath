  description:
    value: >-
      <p><br /><em>You’ve come (or been sent) to </em><span
      data-tooltip="Riddleport is the third-largest city in Varisia and its most
      northern port."><em><span
      style="text-decoration:underline">Riddleport</span></em></span><em> to
      observe the strange Blot that has appeared in the city’s sky. You’ve
      decided to put your keen senses to the test at the </em><span
      data-tooltip="Gold Goblin is a gaming hall and casino located in the
      Varisian city of Riddleport"><em><span
      style="text-decoration:underline">Golden Goblin</span></em></span><em>’s
      upcoming gambling competition while you’re here. Your sharp eyesight makes
      it easier for you to notice things at a
      distance.</em></p><p><strong>Benefits</strong>: For you, Perception checks
      only start increasing in difficulty at a range of 20 feet or farther, as
      opposed to the normal 10. This has no effect on checks made to perceive
      things within 10 feet.</p>
