name: Ex-Iomedaean (Hell's Vengeance)
system:
  contextNotes:
    - target: ''
      text: >-
        +[[1]] Trait bonus on attack rolls and weapon damage rolls against
        followers of Iomedae.
    - target: ''
      text: >-
        +[[1]] Trait bonus to the save DCs of your spells against followers of
        Iomedae.
  description:
    instructions: >-
      <p>Select either (attack and weapon damage rolls) or spell save DCs when
      you take this trait.</p><p>Update the target of the note on the changes
      tab of this trait to reflect your choice (Attack Rolls or Spell Effect)
      and delete the change relating to the other choice.</p>
    value: >-
      <p><em>You, or perhaps your family, were once worshipers of Iomedae, but
      something happened that made you lose your faith. Perhaps your family was
      accused of being dishonorable or cowardly, or maybe one of your family
      members was the victim of church “justice.” Or perhaps you simply met
      someone who opened your eyes and showed you the truth—that the Inheritor’s
      so-called honor, valor, and justice are just tin plating on a strict dogma
      that seeks to control people by restricting their free will. In any event,
      you left the church, and as a result, your family was subjected to scorn
      and holier-than-thou disapproval. Ever since, you’ve vowed to some day get
      revenge against the church of Iomedae—and with the current situation
      brewing in Cheliax, you might finally have the
      opportunity.</em></p><p><strong>Benefits</strong>: Choose
      one:</p><p>Against followers of Iomedae, including many (but not all)
      archons and angels, you gain a +1 trait bonus on attack rolls and weapon
      damage rolls, or you gain a +1 trait bonus on the save DCs of your
      spells.</p>
