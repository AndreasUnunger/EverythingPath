name: Green-Blooded
system:
  description:
    instructions: >-
      <p>In your character sheet, go to the settings tab and check "Spell-like"
      under spellbook usage.  Then navigate to the spells tab, go to your
      spell-like spellbook, and add one 0-level druid spell. In the spell-like
      spellbook configuration, set the spellcasting class to "Hit Die".</p>
    value: >-
      <p><em>You are touched by the supernatural essence of nature, marking you
      since birth as something other than purely
      mortal.</em></p><p><strong>Benefits</strong>: Choose a single 0-level
      druid spell. You can cast this spell once per day as a spell-like ability
      with a caster level equal to your character level.</p>
