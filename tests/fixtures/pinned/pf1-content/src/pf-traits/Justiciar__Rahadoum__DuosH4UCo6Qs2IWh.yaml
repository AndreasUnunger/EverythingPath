  description:
    value: >-
      <p><em>You are experienced in interpreting and applying legal doctrine,
      notably the Laws of Man, independent of any divine
      mandates.</em></p><p><strong>Requirements</strong>: <span
      style="text-decoration:underline" data-tooltip="Atheist nation in
      northwestern Garund"><span
      style="text-decoration:underline">Rahadoum</span></span></p><p><strong>Benefits</strong>:
      You gain a +1 trait bonus on Diplomacy and Knowledge (local) checks to
      settle disputes or arbitrate laws. Once per day if you succeed at an
      Intimidate check to demoralize a foe who has repudiated or ignored a
      pronounced judgment you’ve made, you may choose to cause the creature to
      be sickened instead of shaken. The duration of the effect remains the
      same.</p>
