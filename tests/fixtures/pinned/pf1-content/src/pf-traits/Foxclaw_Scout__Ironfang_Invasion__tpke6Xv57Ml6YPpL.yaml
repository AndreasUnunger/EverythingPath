  description:
    value: >-
      <p><em>You are part of Nirmathas’s informal network of hunters and scouts
      known as the Foxclaws, and study the secret vulnerabilities of those
      dangerous beasts that prey upon your fellow
      settlers.</em></p><p><strong>Benefits</strong>: You gain a +2 trait bonus
      to confirm critical hits against creatures of the animal, magical beast,
      and vermin types, and while wearing a trophy from an animal, magical
      beast, or vermin whose CR was higher than your current class level, you
      gain a +1 morale bonus on Will saves.</p>
