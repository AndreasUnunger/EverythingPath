name: Rescued (Jade Regent)
system:
  changes:
    - _id: IOO5qOio
      formula: '1'
      type: trait
  contextNotes:
    - target: ''
      text: +2 trait bonus whenever you use cure spells to heal damage
    - target: attack
      text: >-
        +[[1]] Trait bonus on all attack rolls against foes that threaten your
        savior: (Koya or Shalelu)
  description:
    instructions: >-
      <ol><li><p>Select Koya (Spells) or Shalelu (Acrobatics) when you take this
      trait.</p></li><li><p>If you selected Koya, Update the target of the 1st
      context note to Spell Effect, then delete the untargeted
      change</p></li><li><p>If you selected Shalelu, Update the target of the
      change on the Changes tab of this trait to reflect Acrobatics, Update the
      Class skills section of the details tab of this trait to reflect
      Acrobatics, and delete the untargeted context note.</p></li><li><p>Update
      the text of the context note on the Changes tab of this trait to reflect
      your choice. (Koya or Shalelu)</p></li></ol>
    value: >-
      <p><em>At some point in the past, you had a terrifyingly close brush with
      death. Maybe a goblin nearly killed you during an attack on the town, or
      perhaps a building struck by a giant's boulder collapsed around you.
      Whatever the peril was, you would have certainly died if not for the swift
      actions of Koya or Shalelu, who intervened just in time to save your life.
      You've never forgotten this, and remain fiercely loyal to the NPC who
      saved you. Perhaps even more importantly, the method in which she saved
      you seems to have had an impact on your own
      skills.</em></p><p><strong>Benefits</strong>: You gain a +1 trait bonus on
      all attack rolls against foes that threaten your savior as well as one of
      the following:</p><p>If Koya saved you, she did so by casting a healing
      spell on you just before you died, and as a result you gain a +2 trait
      bonus whenever you use cure spells to heal damage. If it was Shalelu who
      saved you, she did so by pulling you to safety while simultaneously
      defeating the peril that almost did you in, and as a result, you gain a +1
      trait bonus on Acrobatics checks and Acrobatics is a class skill for
      you.</p><p><strong>NPC Choices </strong>Koya, Shalelu</p>
