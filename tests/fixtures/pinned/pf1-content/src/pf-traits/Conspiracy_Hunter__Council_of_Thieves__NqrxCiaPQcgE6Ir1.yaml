      type: trait
  description:
    instructions: >-
      <p> Select Bluff, Diplomacy, Knowledge (local), Perception, Sense Motive,
      or Stealth when you take this trait.</p><p>Update the Class skills section
      of the Details tab of this trait to reflect your choice.</p><p>Update the
      target of the change on the Changes tab of this trait to reflect your
      choice.</p>
    value: >-
      <p><em>You’ve long heard rumors of dark deeds afoot in Westcrown.
      Shipments of valuable cargo that go missing with nary a trace or question
      asked. People who disappear as though they never existed. Lords of
      business and nobles who speak in veiled references and accidental slips of
      masters even they must obey. What lords rule the Westcrown underworld? Do
      the tales of far-reaching criminal organizations hold a hint of truth?
      Could the fabled Council of Thieves, said to have been purged from the
      city ages ago, have somehow survived or reformed? And what hold do they
      hold over the city today? You don’t know, but you’re determined to find
      out!</em></p><p><strong>Benefits</strong>: Choose one of the following
      skills: Bluff, Diplomacy, Knowledge (local), Perception, Sense Motive, or
      Stealth. You gain a +1 trait bonus on this skill and it is always
      considered a class skill for you.</p>
