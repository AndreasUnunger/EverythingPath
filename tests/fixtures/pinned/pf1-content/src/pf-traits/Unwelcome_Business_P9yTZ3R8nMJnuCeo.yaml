      type: trait
  contextNotes:
    - target: skill.dis
      text: Ignore the -2 penalty to disguise yourself as <chosen humanoid species>.
  description:
    instructions: >-
      <p>Choose Disguise or Sleight of Hand when this trait is taken and add
      that skill on the Details and Changes tab.</p><p>Choose a Humanoid species
      and update Disguise note to reflect that choice.</p>
    value: >-
      <p><em>You specialize in delivering or procuring shipments where those
      commodities are not allowed or where your identity would elicit negative
      bias.</em></p><p><strong>Benefits</strong>: You gain a +1 trait bonus on
      Disguise or Sleight of Hand checks, and that skill becomes a class skill
      for you. In addition, choose one humanoid species; you ignore the –2
      penalty on Disguise checks to disguise yourself as a member of that
      species.</p>
