name: Scarred by War (Dalenydra)
system:
  contextNotes:
    - target: skill.dip
      text: +[[1]] Trait bonus outside of combat.
  description:
    value: >-
      <p><em>You have experienced firsthand the horrors of war, which have left
      you physically or mentally scarred. Now you have committed yourself to the
      teachings of the Blessed Attendant, seeking to heal those wounded in
      combat and to prevent battles from occurring whenever you
      can.</em></p><p><strong>Requirements</strong>:
      Dalenydra</p><p><strong>Benefits</strong>: You gain a +1 trait bonus on
      Diplomacy checks outside of combat. </p><p>In addition, when you heal
      creatures other than yourself using class abilities, feats, spells, and
      spell-completion or spell-trigger magic items, you restore 1 additional
      hit point.</p>
