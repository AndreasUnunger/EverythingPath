  description:
    instructions: >-
      <p> to take this trait you must follow the Revolution Knightly code of
      conduct.</p><p>If a knight violates their code of conduct, they are
      disgraced and must perform penance to atone for their transgressions.
      until the penance is completed, disgraced knights no longer receive
      benefits from their knightly traits.</p><p><strong>Revolution</strong>:
      Knights who follow the code of revolution believe that strict laws are an
      unnecessary bulwark standing in the way of social progress. According to
      these knights, intelligent and civilized people are inherently
      good-natured, and if left to their own devices, individuals would prove
      more wholesome and attuned to the natural order of things than when
      tainted by the unnatural strictures of organized society.</p><p>Their vows
      are as follows.</p><ul><li><p>The wicked must be punished, though not by
      the hands of corrupted officials or easily swayed
      politicians.</p></li><li><p>I shall not let stand acts of unfairness
      performed by governments or their harbingers. Those who contribute to
      an</p></li><li><p>organized system of cruelty shall feel my
      wrath.</p></li><li><p>All prisoners, regardless of whether they were
      convicted or not, deserve a second chance.</p></li><li><p>Tribal or
      lawless societies exemplify the natural order, and under my watch shall
      not come to harm from those who would seek to rule
      them.</p></li><li><p>Those creatures who live free shall see no harm fall
      to them by myself or my sword.</p></li><li><p>I shall not place
      unnecessary value on material possessions, as such things are fleeting,
      whereas deeds are immortal.</p></li></ul>
    value: >-
      <p><em>If you follow this code, your appreciation for unfettered social
      freedom allows you to locate supporters of law with supernatural
      ease.</em></p><p><strong>Requirements</strong>: Code of
      Revolution</p><p><strong>Benefits</strong>: Once per day, you can use
      detect law as a spell-like ability (caster level 1st). If you have levels
      in a class that can cast detect law, your caster level for this spell-like
      ability is equal to that class level.</p>
