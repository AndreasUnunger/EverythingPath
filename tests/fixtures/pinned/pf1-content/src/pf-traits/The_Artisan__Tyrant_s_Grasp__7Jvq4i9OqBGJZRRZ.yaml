  description:
    instructions: >-
      <p>Select Appraise or Heal when you take this trait.</p><p>Update the
      Class skills section of the Details tab of this trait to reflect your
      choice.</p>
    value: >-
      <p><em>Precision is important in getting exactly what you want, and you
      give careful consideration in building everything from homes and vases to
      roads and empires. Your own attention to detail has proven vital in
      rebuilding Roslar’s Coffer from the orc occupation a decade ago, whether
      you are an accountant, architect, engineer, or
      herbalist.</em></p><p><strong>Benefits</strong>: Your attention to detail
      provides you a +1 trait bonus on Appraise and Heal checks, and one of
      these skills becomes a class skill for you.</p><p>Once per day, you can
      spend a full round casting a spell you can cast that has a normal casting
      time of 1 standard action to increase your effective caster level for that
      spell by 1. This ability has no affect on spells with a casting time other
      than 1 standard action.</p>
