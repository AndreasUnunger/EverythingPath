name: Jacket Training
system:
  description:
    value: >-
      <p><em>Mercenary League</em></p><p>The bodyguards to Druma’s ruling
      Kalistocrats, Mercenary League members are more commonly called
      Blackjackets for the armored coats that are part of their
      uniforms.</p><p><strong>Benefits</strong>: You can treat an
      @UUID[Compendium.pf1.armors-and-shields.Item.mJYWI4VZBo0c0CCC]{armored
      coat} as light armor. This choice must be made when you don the armor, and
      can’t be changed until you remove and redon the armor.</p><p>You must
      still be proficient in wearing medium armor to avoid adding the armor’s
      check penalty on all attack rolls and skill checks that involve
      moving.</p>
