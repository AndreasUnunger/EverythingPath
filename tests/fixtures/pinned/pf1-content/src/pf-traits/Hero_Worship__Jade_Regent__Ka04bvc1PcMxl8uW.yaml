      formula: '2'
      type: trait
  contextNotes:
    - target: ''
      text: +[[1]] bonus to your AC against attacks of opportunity
    - target: attack
      text: >-
        +[[1]] Trait bonus on all attack rolls against foes that threaten,
        (Ameiko or Shalelu),  your hero.
  description:
    instructions: >-
      <ol><li><p>Select Ameiko (concentration) or Shalelu (AC) when you take
      this trait.</p></li><li><p>If you selected Ameiko, Update the target of
      the change on the Changes tab of this trait to reflect Concentration and
      delete the untargeted context note.</p></li><li><p>If you selected
      Shalelu, Update the target of the 1st context note to AC, then delete the
      untargeted change</p></li><li><p>Update the text of the context note on
      the Changes tab of this trait to reflect your choice. (Ameiko or
      Shalelu)</p></li></ol>
    value: >-
      <p><em>Everyone in town seems to admire Ameiko and Shalelu,they're heroes,
      after all, and played key roles in the recent troubles that plagued
      Sandpoint. You, though, take this admiration to a new level,you
      practically worship one of these two. This could be because you saw one of
      them perform a particularly impressive act of bravery at some point in the
      past, or maybe they just happened to give you the exact right words of
      encouragement or a kind gift at some point a few years ago when you were
      young and impressionable. In any case, you've done your best to emulate
      your hero's talents at spellcasting or
      combat.</em></p><p><strong>Benefits</strong>: You gain a +1 trait bonus on
      all attack rolls against foes that threaten your hero as well as one of
      the following:</p><p>If your hero is Ameiko, you gain a +2 bonus on
      concentration checks. If your hero is Shalelu, you gain a +1 bonus to your
      AC against attacks of opportunity.</p><p><strong>NPC Choices
      </strong>Ameiko, Shalelu</p><hr />
