  description:
    value: >-
      <p><em>Your great interests as a child did not lie with current events or
      the mundane, you have always felt out of place, as if you were born in the
      wrong era. You take to philosophical discussions of the Great Beyond and
      of historical events with ease.</em></p><p><strong>Benefits</strong>: You
      gain a +1 trait bonus on Knowledge (history) and Knowledge (planes)
      checks, and one of these skills (your choice) is always a class skill for
      you.</p><p><strong >Usage</strong>: Choose which skill is a class skill
      and mark it in the Details tab. Knowledge (history) is chosen by
      default.</p>
