name: Magical Talent
system:
  description:
    instructions: >-
      <p>If you don't have the spells tab, navigate to your sheet's Settings tab
      and check "Spell-like" under Spellbook Usage, then, go to the newly added
      spells tab and add your chosen 0-level spell. In the spell's tab
      configuration, if your caster level is 0, type 1 in the "Class Level
      Modification" formula.</p>
    value: >-
      <p><em>Either from inborn talent, whimsy of the gods, or obsessive study
      of strange tomes, you have mastered the use of a
      cantrip.</em></p><p><strong>Benefits</strong>: Choose a 0-level spell. You
      may cast that spell once per day as a spell-like ability. This spell-like
      ability is cast at your highest caster level gained; if you have no caster
      level, it functions at CL 1st. The spell-like ability's save DC is
      Charisma-based.</p>
