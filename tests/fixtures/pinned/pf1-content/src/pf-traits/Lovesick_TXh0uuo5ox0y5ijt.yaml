name: Lovesick
system:
  contextNotes:
    - target: init
      text: >-
        -[[2] penalty if, at the start of each day, if you are away from your
        focus person. (GM choice)
    - target: skill.per
      text: >-
        -[[2] penalty if, at the start of each day, if you are away from your
        focus person. (GM choice)
  description:
    value: >-
      <p><em>Your love for another occupies your every thought, and you become
      despondent when you are away from that
      person.</em></p><p><strong>Effects</strong>: A person is chosen by your GM
      (with consideration to your roll on the Romantic Relationships table below
      if you used the background generator). At the start of each day, if you
      are away from this person you take a –2 penalty on initiative checks and
      Perception checks. If you ever lose or fall out of love with this person,
      exchange this drawback for the Doubt drawback.</p><p><strong>Romantic
      Relationships</strong></p><table style="width:98.6014%;height:136px"
      border="1"><tbody><tr style="text-align:center"><td
      style="width:11.7834%;height:17px"><p><strong>d20</strong></p></td><td
      style="width:87.3497%;height:17px"><p><strong>RESULT</strong></p></td></tr><tr
      style="text-align:center"><td
      style="width:11.7834%;height:17px"><p>1–2</p></td><td
      style="width:87.3497%;height:17px"><p><strong>One Significant
      Relationship<strong>: You had a true love once, but that time has
      passed.</p></td></tr><tr style="height:17px;text-align:center"><td
      style="width:11.7834%;text-align:center;height:17px"><p>3–6</p></td><td
      style="width:87.3497%;height:17px"><p><strong>A Few Significant
      Relationships<strong>: You’ve tried to make deep connections with
      individuals on several occasions, but it’s never worked
      out.</p></td></tr><tr style="height:17px;text-align:center"><td
      style="width:11.7834%;text-align:center;height:17px"><p>7–9</p></td><td
      style="width:87.3497%;height:17px"><p><strong>Several Significant
      Relationships<strong>: You’ve engaged in a number of partnerships, but for
      some reason or another your relationships always fail.</p></td></tr><tr
      style="height:17px;text-align:center"><td
      style="width:11.7834%;text-align:center;height:17px"><p>10–12</p></td><td
      style="width:87.3497%;height:17px"><p><strong>Current Lover<strong>: You
      are currently involved in a romantic relationship. You gain access to the
      True Love story feat.</p></td></tr><tr
      style="height:17px;text-align:center"><td
      style="width:11.7834%;text-align:center;height:17px"><p>13–16</p></td><td
      style="width:87.3497%;height:17px"><p><strong>Several Inconsequential
      Relationships<strong>: You have had many lovers but no long-lasting,
      meaningful relationships.</p></td></tr><tr
      style="height:17px;text-align:center"><td
      style="width:11.7834%;text-align:center;height:17px"><p>17–18</p></td><td
      style="width:87.3497%;height:17px"><p><strong>Experience But No
      Substantial Relationships<strong>: You’ve had a fling or two, but have so
      far shied away from any ties or commitments.</p></td></tr><tr
      style="height:17px;text-align:center"><td
      style="width:11.7834%;text-align:center;height:17px"><p>19–20</p></td><td
      style="width:87.3497%;height:17px"><p><strong>No Experience<strong>: You
      have never experienced any kind of romantic connection
      whatsoever.</p></td></tr></tbody></table>
  sources:
