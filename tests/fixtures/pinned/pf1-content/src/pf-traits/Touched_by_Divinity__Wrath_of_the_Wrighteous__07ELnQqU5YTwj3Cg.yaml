      description: >-
        <p>choose one domain associated with your chosen deity. You gain the use
        of that domain’s 1st-level domain spell as a spell-like ability usable
        once per day (CL equals your character level).</p>
      img: icons/tools/navigation/map-chart-tan.webp
      name: Use
  description:
    value: >-
      <p><em>As long as you can remember, you’ve had an unexplainable interest
      in one deity in particular. One of your parents may have been a priest of
      this deity, or you may have been an orphan raised by the church, but these
      alone cannot explain your deep connection to the faith. You’ve always felt
      calm and at ease in places holy to the deity, and often have dreams about
      the god or goddess visiting you—most often in the form of a sacred animal
      or creature. Your faith is strong, even if you don’t happen to be a divine
      spellcaster—if you are a divine spellcaster, you should be a worshiper of
      this deity.</em></p><p><strong>Benefits</strong>: You begin play with a
      silver holy symbol of your chosen deity for free. In addition, choose one
      domain associated with your chosen deity. You gain the use of that
      domain’s 1st-level domain spell as a spell-like ability usable once per
      day (CL equals your character level).</p><p><strong>Associated Mythic
      Path</strong></p><p>Hierophant</p><p><strong>Multiple
      Characters</strong></p><p>If other characters choose this trait, you
      should all work together to decide what deity you’re associated with—it
      should be the same deity shared by all of you. You might even share the
      same dreams.</p>
