name: Snake Handler (Osirion; Apep or Wadjet)
system:
  classSkills:
    han: true
  contextNotes:
    - target: fort
      text: +[[2]] Trait bonus against poison.
  description:
    value: >-
      <p><em>You have spent time as a member of a cult of either Apep or Wadjet,
      the serpent gods of Osirion. Membership involved the handling of dangerous
      snakes during rituals, and you have learned how to keep yourself and
      others safe around them.</em></p><p><strong>Requirements</strong>: <span
      style="text-decoration:underline" data-tooltip="Nation in northeastern
      Garund on the Inner Sea"><span
      style="text-decoration:underline">Osirion</span></span> native, worshiper
      of <span style="text-decoration:underline" data-tooltip="Apep and Wadjet
      are twin gods. Apep, Devourer of the Dawm, is believed will eventually
      devour the sun, creating a night that will never end and effectively
      bringing about the apocalypse. He has two forms, a great golden serpent
      miles long whose coils encircle the world and a dragon with night-black
      scales. Wadjet, The Green Empress, is the nurturer of the River Sphinx and
      a personification of the spirits guiding and guarding the ruler of
      Osirion."><span style="text-decoration:underline">Apep or
      Wadjet</span></span></p><p><strong>Benefits</strong>: You gain a +2 bonus
      on Fortitude saves against poison. Handle Animal is always a class skill
      for you.</p>
