name: Ex-Asmodean (Hell's Rebels)
system:
  contextNotes:
    - target: ''
      text: >-
        +[[1]] Trait bonus on attack rolls and weapon damage rolls against
        agents of House Thrune and worshipers of Asmodeus
    - target: ''
      text: >-
        +[[1]] Trait bonus to the save DCs of your spells against agents of
        House Thrune and worshipers of Asmodeus.
  description:
    instructions: >-
      <p>Select either (attack and weapon damage rolls) or spell save DCs when
      you take this trait.</p><p>Update the target of the note on the changes
      tab of this trait to reflect your choice (Attack Rolls or Spell Effect)
      and delete the change relating to the other choice.</p>
    value: >-
      <p>You, or perhaps your family, were once worshipers of Asmodeus, but
      something happened that made you lose your faith. Perhaps your family was
      asked to give up something dear as a sacrifice, such as the life of a
      newly born brother or sister. Maybe the church used your family as a
      scapegoat to cover up a crime someone higher in the church committed. Or
      perhaps you simply met someone who opened your eyes and showed you the
      truth—that Asmodeus does not care for his followers, and that the deity of
      your new religion does. In any event, you left the church, and as a
      result, your family was punished; they were either put in prison, exiled
      from Kintargo, or perhaps even executed. Ever since, you’ve vowed to some
      day get revenge against the church.</p><p><strong>Benefits</strong>:
      Choose one:</p><p>You gain a +1 trait bonus on attack rolls and weapon
      damage rolls or you gain a +1 trait bonus on the save DCs of your spells
      against agents of House Thrune and worshipers of Asmodeus, including most
      (but not all) devils.</p>
