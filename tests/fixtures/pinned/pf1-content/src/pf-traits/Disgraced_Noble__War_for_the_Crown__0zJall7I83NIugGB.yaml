  description:
    instructions: >-
      <p>Select Bluff or Linguistics when you take this trait.</p><p>Update the
      Class skills section of the details tab of this trait to reflect your
      choice.</p>
    value: >-
      <p><em>Your noble family used to matter, until your father took a stand
      against Maxillar Pythareus, the commander of Taldor’s military. True or
      not, the accusations Pythareus leveled against your family in return
      destroyed your reputation and isolated you from the society you grew up
      in. Now the only thing that matters to you is clawing your way back up the
      social ladder, either for your own quality of life or to clear your
      family’s name.</em></p><p><strong>Benefits</strong>: You’ve had to
      practice deception as you began working your way back into Taldan social
      circles; you gain a +2 trait bonus on Bluff checks to conceal your
      identity and a +2 bonus on Linguistics checks to spot or produce
      forgeries, and one of these skills is always a class skill for you. Once
      each day, you can choose a single humanoid you believe to have been
      involved in the conspiracy to destroy your family; you gain a +1 morale
      bonus on attack and damage rolls against that NPC for a number of rounds
      equal to your character level. At 10th level, this bonus increases to
      +2.</p>
