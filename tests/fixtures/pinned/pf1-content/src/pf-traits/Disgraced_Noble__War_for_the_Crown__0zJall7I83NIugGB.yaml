      description: >-
        <p>Once each day, you can choose a single humanoid you believe to have
        been involved in the conspiracy to destroy your family; </p><p>you gain
        a +1 morale bonus on attack and damage rolls against that NPC for a
        number of rounds equal to your character level. At 10th level, this
        bonus increases to +2.</p>
      duration:
