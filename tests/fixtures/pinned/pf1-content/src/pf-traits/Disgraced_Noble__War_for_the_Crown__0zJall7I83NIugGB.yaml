  contextNotes:
    - target: attack
      text: >-
        Once each day, you can target a humanoid believe to conspire to destroy
        your family;you gain a +[[1]] Morale bonus on attack and damage rolls
        against that NPC for a number of rounds equal to your character level.
        At 10th level, this bonus increases to +2.
    - target: skill.blf
