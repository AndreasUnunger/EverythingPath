name: Family Resemblance
system:
  contextNotes:
    - target: skill.dip
      text: >-
        +[[4]] Trait bonus to improve the attitude of a creature that has a
        friendly or helpful attitude toward another member of your family
    - target: skill.dis
      text: +[[2]] bonus to look like a specific member of your family
    - target: skill.dis
      text: –[[2]] Penalty to look like anyone who is not a member of your family.
  description:
    value: >-
      <p><em>You have some of the common, recognizable features of your
      family.</em></p><p><strong>Benefits</strong>: You gain a +4 trait bonus on
      Diplomacy checks made to improve the attitude of a creature that has a
      friendly or helpful attitude toward another member of your family, and a
      +2 bonus on Disguise checks to look like a specific member of your family.
      You also take a –2 penalty on Disguise checks to look like anyone who is
      not a member of your family.</p>
