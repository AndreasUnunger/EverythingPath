name: Dispelled Battler
system:
  contextNotes:
    - target: attack
      text: >-
        +[[1]] Trait bonus to weapon attack and damage rolls while within an
        area of antimagic. You also gain this bonus for 1 round after you are
        subject to an area or targeted dispel magic spell, regardless of the
        effect’s success or failure in dispelling your spells and magical
        effects.
  description:
    value: >-
      <p><em>When deprived of magic, you fight
      harder.</em></p><p><strong>Benefits</strong>: You gain a +1 trait bonus on
      weapon attack and damage rolls while within an area of antimagic such as
      that created by an
      @UUID[Compendium.pf1.spells.Item.niqxt53lhxrjfaty]{antimagic field}.
      </p><p>You also gain this bonus for 1 round after you are subject to an
      area or targeted @UUID[Compendium.pf1.spells.Item.gmgwyjfpeuuc4t4o]{dispel
      magic} spell, regardless of the effect’s success or failure in dispelling
      your spells and magical effects.</p>
  sources:
    - id: PZO1125
      pages: '52'
  subType: trait
  traitType: combat
type: feat
