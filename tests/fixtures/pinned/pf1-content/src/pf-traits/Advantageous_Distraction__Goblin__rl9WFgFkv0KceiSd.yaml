  description:
    value: >-
      <p><em>Like most goblins, you're easily distracted. Unlike most goblins,
      though, you have a knack for being distracted at the right time,
      especially when it comes to avoiding
      pain.</em></p><p><strong>Requirements</strong>:
      Goblin</p><p><strong>Benefits</strong>: Once per day as a swift action,
      you can be momentarily distracted in combat, ducking an axe swing to
      inspect a toadstool, or stooping behind a tree to lick some bark and
      accidentally avoiding an arrow, and so on.</p><p>When you activate this
      ability, you gain a +2 dodge bonus to your AC for 1 round.</p>
