      text: >-
        You may extend the casting time of a spell from the conjuration
        (healing) school from a standard action to a full-round action to imbue
        it with light as the spell for 1 round per caster level.
  description:
    value: >-
      <p><em>You’ve learned how to infuse your healing magic with lingering
      traces of light.</em></p><p><strong>Benefits</strong>: Whenever you cast a
      spell from the conjuration (healing) school that has a casting time of a
      standard action, you can extend its casting time to a full-round action to
      imbue the target with
      @UUID[Compendium.pf1.spells.Item.ip9onjfp6nf1vlv9]{light}, as per light,
      with a duration of 1 round per caster level.</p>
