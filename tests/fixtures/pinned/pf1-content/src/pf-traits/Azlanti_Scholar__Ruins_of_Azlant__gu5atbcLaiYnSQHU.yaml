name: Azlanti Scholar (Ruins of Azlant)
system:
  description:
    instructions: >-
      <p>Select Knowledge (history), Knowledge (local), or Use Magic Device when
      you take this trait.</p><p>Update the Class skills section of the Details
      tab of this trait to reflect your choice.</p>
    value: >-
      <p><em>You are familiar with an aspect of Azlanti lore. Maybe you first
      became enamored with this ancient culture after stumbling across a copy of
      the first volume of the Pathfinder Chronicles or after learning about
      Azlant in a university or another type of formal education. Perhaps your
      parents or guardians were scholars and you’ve grown up hearing about and
      reading about the ancient Azlanti. For years you dreamed about visiting
      the continent’s ruins and returning with a discovery that could propel
      your career. Due to this scholarly bent, the Bountiful Venture Company
      selected you to join the colony at </em><span
      style="text-decoration:underline" data-tooltip="Andoren colony on the
      island of Ancorato, which is part of the continent of Azlant."><em><span
      style="text-decoration:underline">Talmandor's
      Bounty</span></em></span><em> .</em></p><p><strong>Benefits</strong>: You
      gain a +1 trait bonus on Knowledge (history), Knowledge (local), and Use
      Magic Device checks, and one of these skills is a class skill for you. In
      addition, you gain Azlanti as a bonus language.</p>
  languages:
