name: Gesture Expertise
system:
  contextNotes:
    - target: skill.lin
      text: >-
        +[[2]] Trait bonus to understand gestures. With a successful DC 15
        Linguistics check, you can express yourself clearly enough to
        communicate basic messages to people who do not understand your
        gestures.
    - target: skill.blf
      text: +[[2]] Trait bonus to send secret messages via gestures.
  description:
    value: >-
      <p><em>You are adept at nonverbal
      communication.</em></p><p><strong>Benefits</strong>: You can use a sign
      language or gestural system to send complex messages quickly in combat,
      and with a successful DC 15 Linguistics check, you can express yourself
      clearly enough to communicate basic messages to people who do not
      understand your gestures. You gain a +2 trait bonus to send secret
      messages via gestures using the Bluff skill, and to understand gestures
      with the Linguistics skill.</p>
