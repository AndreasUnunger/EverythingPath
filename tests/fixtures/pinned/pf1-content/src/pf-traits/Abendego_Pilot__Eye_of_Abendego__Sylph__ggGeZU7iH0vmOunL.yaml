  description:
    instructions: >-
      <p>Update the Skills tab of your Actor to add the Profession (sailor)
      skill.</p><p>Update the target of the change on the Changes tab of this
      trait to reflect Profession (Sailor).</p>
    value: >-
      <p><em>The howling gales of the Eye of Abendego were your lullaby as a
      child, and you quickly learned to anticipate the winds’ danger as well as
      parse their song.</em></p><p><strong>Requirements</strong>: <span
      data-tooltip="permanent hurricane located in the southern Arcadian Ocean
      off the western coast of the continent of Garund"><span
      style="text-decoration:underline">Eye of Abendego</span></span>,
      Sylph</p><p><strong>Benefits</strong>: You gain a +2 trait bonus on
      Profession (sailor) checks, and you treat the wind force of environmental
      @UUID[Compendium.pf-content.pf-rules.JournalEntry.TGNihLM3XTYgf6MV]{Wind}
      effects as one step less powerful for the purposes of determining any
      penalties on ranged attacks and Fly checks as well as whether you would be
      checked or blown away.</p>
