  description:
    instructions: >-
      <p>Select Diplomacy, Knowledge (planes), or Knowledge (religion) when you
      take this trait.</p><p>Update the Class skills section of the Details tab
      of this trait to reflect your choice.</p>
    value: >-
      <p><em>You grew up in the church of Asmodeus, and have served as a
      faithful follower your entire life. You’ve studied the unholy texts,
      committed the rigid hierarchies of Hell to memory, and striven to
      eliminate emotion and mercy from your mind in emulation of the Prince of
      Darkness. You may have continued your career in the church, officially
      joining the priesthood and aspiring to advance to positions of higher
      authority and greater power, or you may have left the church, deciding the
      life of a priest was not for you. In either case, the education you
      received in the church has remained with
      you.</em></p><p><strong>Benefits</strong>: You gain a +1 trait bonus on
      Diplomacy, Knowledge (planes), and Knowledge (religion) checks, and one of
      these skills (your choice) is a class skill for you. You also know the
      Infernal tongue (this does not count toward your number of languages).</p>
