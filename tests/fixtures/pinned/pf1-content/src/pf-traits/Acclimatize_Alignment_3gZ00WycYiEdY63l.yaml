name: Acclimatize Alignment
system:
  contextNotes:
    - target: chaChecks
      text: >-
        Reduce Charisma-based check penalties by 1 for each day on a mildly
        opposing plane, to a minimum of 0, excluding strongly opposing planes.
  description:
    value: >-
      <p><em>Like a climber ascending a mountain, you gradually grow
      acclimatized to an opposing planar
      alignment.</em></p><p><strong>Benefits</strong>: For each consecutive day
      you remain on a mildly aligned plane that opposes your alignment, reduce
      your penalty on Charisma-based checks by 1, to a minimum of 0. This does
      not affect the penalty from a strongly aligned plane.</p>
