      text: +[[1]] Trait bonus to resist the effects of cold weather.
  description:
    instructions: >-
      <p>Select one (1) of </span>Hallit, Hon-La, Minkaian, Skald, or Tien when
      you take this trait.</p><p>Update the Granted Proficiencies&gt;Languages
      section of the details tab of this trait to reflect this choice.</p>
    value: >-
      <p><em>You are one of the brave travelers who have traversed the Path of
      Aganhei, a lucrative trade route from Tian Xia to Avistan that crosses the
      frigid Crown of the World.</em></p><p><strong>Requirements</strong>: <span
      data-tooltip="Glacier-covered continent at the extreme north of Golarion.
      Home of the Erutaki human ethnicity,  Ilverani elves and the Mitzenki
      catfolk."><span style="text-decoration: underline;">Crown of the
      World</span></span></p><p><strong>Benefits</strong>: These voyages have
      left you hardier, granting you a +1 trait bonus on Fortitude saving throws
      to resist the effects of cold weather. Survival is a class skill for you,
      and you gain Hallit, Hon-La, Minkaian, Skald, or Tien as a bonus
      language.</p><hr>
