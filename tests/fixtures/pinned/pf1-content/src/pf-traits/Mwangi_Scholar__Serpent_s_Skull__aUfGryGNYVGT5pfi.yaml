name: Mwangi Scholar (Serpent's Skull)
system:
  contextNotes:
    - target: skill.khi
      text: +[[1]] Trait bonus on checks regarding the Mwangi Expanse.
  description:
    value: >-
      <p><em>The Mwangi Expanse is one of the richest regions in all of
      Golarion, and also one of the most mysterious. Despite its history of
      countless years and its fostering of nameless empires, very little is
      known of the Mwangi Expanse by outsiders or even natives of the primeval,
      jungle-covered land. You have long studied the region and its lore, and
      count yourself among a small handful of genuine experts throughout the
      Inner Sea. The Jenivere promises to take you to the very subject of your
      fascination, and you eagerly await firsthand investigation of the deep
      jungles and cyclopean ruins of Garund’s
      interior.</em></p><p><strong>Benefits</strong>: You gain Polyglot as a
      bonus language and receive a +1 trait bonus on all Knowledge (history)
      checks regarding the Mwangi Expanse.</p><p>Characters with this trait
      likely boarded the <em>Jenivere</em> in Ilizmagorti or one of the cities
      of the Shackles or the Mwangi Expanse.</p>
