  description:
    value: >-
      <p><em>When you were a child, you were nearly slain by a demon that
      managed to make its way through the wardstones into the lands beyond. The
      demon was slain before it could kill you, but you lingered at death’s door
      in a coma for weeks before waking. Ever since then, you’ve been unusually
      hale and hearty, as if your body had endured its brush with awfulness by
      becoming supernaturally fit. But still, the scars (whether physical or
      purely mental) of your brush with death remain, and nightmares of what
      could have happened often plague your sleep. Something, be it your own
      personal force of will, some strange “infection” from the assault, or
      perhaps a combination of both, has made you stronger than before. You’re
      not sure what to make of the theories that you survived this exposure to
      awfulness because you yourself have some trace of demonic heritage that
      helped give you the advantage you needed to survive— but whatever it was,
      you’re glad for it! Your strange resistance to demonic attacks persists to
      this day.</em></p><p><strong>Benefits</strong>: Once per day when you fail
      a saving throw against an effect created by a demon that would kill or
      physically incapacitate you, you can immediately reroll that saving throw
      as a free action. You must take the second result, even if it is
      worse.</p><p><strong>Associated Mythic
      Path</strong></p><p>Guardian</p><p><strong>Multiple
      Characters</strong></p><p>You and any others with this trait are related,
      if only distantly. You could be siblings or cousins—a condition that
      perhaps lends some credence to the theory that all of you share more than
      just a common bloodline.</p>
  scriptCalls:
    - _id: QYJBxY4aYZlt0nPh
      category: postUse
      hidden: false
      img: icons/svg/dice-target.svg
      name: Reroll Saving Throw
      type: script
      value: >-
        const content = `
          <div class="flexcol">
            <h3>Rerolling a Saving Throw:</h3>
            <p>Please pick a saving throw to reroll from the buttons below.</p>
          </div>
        `;


        const labels = [game.i18n.localize("PF1.SavingThrowFort"),
        game.i18n.localize("PF1.SavingThrowRef"),
        game.i18n.localize("PF1.SavingThrowWill")];


        async function getAnswer() {
          return Dialog.wait({
            title: `${item.name} – Reroll a Saving Throw`,
            content: content,
            buttons: {
              fort: {
                label: labels[0],
                callback: () => "fort",
              },
              ref: {
                label: labels[1],
                callback: () => "ref",
              },
              will: {
                label: labels[2],
                callback: () => "will",
              }
            },
            default: 'fort',
            close: () => null,
          },
          {
             height: "auto",
             width: 680,
          });
        }


        const answer = await getAnswer();

        if(answer !== null) {
          actor.rollSavingThrow(answer);
        } else {
          ui.notifications.warn(`No answer was selected. Restoring use of "${item.name}".`);
          await item.update({"system.uses.value": 1 });
        }
  sources:
