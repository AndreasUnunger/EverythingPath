name: Strength's Fanfare (Kurgess)
system:
  contextNotes:
    - target: strSkills
      text: >-
        +[[1]] Trait bonus when you are the subject of any sonic effect that
        grants a morale bonus on attack or damage rolls.
    - target: cmb
      text: >-
        +[[1]] Trait bonus to CMB to bull rush, grapple, or reposition maneuvers
        when you are the subject of any sonic effect that grants a morale bonus
        on attack or damage rolls.
    - target: cmd
      text: >-
        +[[1]] Trait bonus to CMD to bull rush, grapple, or reposition maneuvers
        when you are the subject of any sonic effect that grants a morale bonus
        on attack or damage rolls.
  description:
    value: >-
      <p><em>Songs of your glory and prowess bolster your
      strength.</em></p><p><strong>Requirements</strong>:
      Kurgess</p><p><strong>Benefits</strong>: When you are the subject of any
      sonic effect that grants a morale bonus on attack or damage rolls, you
      also gain a +1 trait bonus on Strength-based skill checks; on combat
      maneuver checks to bull rush, grapple, and reposition; and to your CMD
      against those combat maneuvers.</p>
