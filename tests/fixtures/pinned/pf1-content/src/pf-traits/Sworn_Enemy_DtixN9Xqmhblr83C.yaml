name: Sworn Enemy
system:
  description:
    instructions: >-
      <p>Add conditional modifier to weapons / attacks against selected
      enemy.</p>
    value: >-
      <p><em>You were raised with defiance, fear, or hatred of a particular sort
      of foe.</em></p><p><strong>Benefits</strong>: To make you ready to resist
      such foes, you were trained for long hours in the proper ways to defeat
      them. Choose a foe from the ranger’s list of favored enemies. You gain a
      +1 trait bonus on attacks of opportunity against the chosen
      foe.</p><p><strong>Suggested Characters</strong></p><p>Dwarves, Isgeri,
      Mendevian crusaders.</p>
