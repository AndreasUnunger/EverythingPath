name: Robot Slayer (Iron Gods)
system:
  contextNotes:
    - target: attack
      text: +[[1]] Trait against robots.
    - target: ac
      text: +[[1]] Dodge bonus against attacks of robots.
  description:
    value: >-
      <p><em>The strange automatons that plague the wilds of Numeria are a
      blight upon the world, and the idea that there could be countless more of
      these creatures lying in wait in the unknown ruins scattered throughout
      the region chills your blood. Khonnir’s recovery of a deactivated robot
      from the caves below Torch worries you—not only could that thing wake up
      and run amok in town, but there may well be more lurking
      below!</em></p><p><strong>Benefits</strong>: You want to explore the caves
      under Torch to determine if there is indeed a lurking robot threat below
      town. You gain a +1 trait bonus on attack rolls against robots and a +1
      dodge bonus to AC against attacks made by robots.</p>
