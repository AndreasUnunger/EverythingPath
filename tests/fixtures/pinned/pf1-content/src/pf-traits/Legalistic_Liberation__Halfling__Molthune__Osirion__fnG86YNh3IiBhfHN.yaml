  description:
    value: >-
      <p><em>You followed - or some might say exploited - the rules and earned
      your freedom by finding the loopholes within your homeland's labyrinthine
      codes regulating slavery and indentured
      servitude.</em></p><p><strong>Requirements</strong>: Halfling; <span
      style="text-decoration:underline" data-tooltip="Military Oligarchy in
      central Avistan on the shores of Lake Encarthan"><span
      style="text-decoration:underline">Molthune</span></span>, <span
      style="text-decoration:underline" data-tooltip="Nation in northeastern
      Garund on the Inner Sea"><span
      style="text-decoration:underline">Osirion</span></span></p><p><strong>Benefits</strong>:
      You gain a +1 bonus on all Knowledge checks to find a legitimate way to
      avoid, negate, or escape an existing obligation.</p>
