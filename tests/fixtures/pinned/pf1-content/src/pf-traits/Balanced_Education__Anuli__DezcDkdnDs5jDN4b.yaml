  description:
    value: >-
      <p><em>Your upbringing focused on strengthening mind and body in equal
      measure.</em></p><p><strong>Requirements</strong>: <span
      data-tooltip="Northernmost city of the nation of Holomog, on the Obari
      coast of central Garund"><span
      style="text-decoration:underline">Anuli</span></span></p><p><strong>Benefits</strong>:
      Once per day, you can draw on this training to apply a physical ability
      modifier to a skill check instead of its usual mental ability modifier, or
      apply a mental ability modifier to a skill check instead of its usual
      physical ability modifier. You can only exchange ability modifiers between
      the following pairings: Strength with Intelligence, Dexterity with Wisdom,
      and Constitution with Charisma.</p>
