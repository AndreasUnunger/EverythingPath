  description:
    value: >-
      <p><strong>Note<strong>:</p><p><em>This is a special trait that can only
      be gained by progressing through the Hell's Vengeance Adventure Path. It
      is not available for normal character creation</em></p><p><em>You have
      sworn your body to Queen Abrogail and House Thrune in a ritual ceremony,
      and are willing to lay down your life in service to Thrune.
      </em></p><p><strong>Benefits</strong>: <em>Once per week, when reduced to
      fewer than 0 hit points, you automatically gain fast healing 1 for 1
      minute. Once this ability has been used, you instead gain a +4 trait bonus
      on Constitution checks to stabilize when reduced to negative hit
      points.</em></p><p>In addition, you receive an invisible
      <em>@UUID[Compendium.pf1.spells.Item.n8k4pdmjjg8xuv7l]{arcane mark}</em>
      of the encircled cross emblem of Cheliax as a symbol of your loyalty. This
      mark does not fade and is visible only to other creatures with this trait,
      or creatures with the ability to perceive the invisible (via or <em>true
      seeing</em>, for example). You can make this mark visible to other
      creatures for 1 round as a swift action. If the mark is dispelled or
      removed (such as with <em>erase</em>), it can be replaced with another
      casting of <em>arcane mark</em>, which thereafter functions as detailed in
      this trait.</p>
