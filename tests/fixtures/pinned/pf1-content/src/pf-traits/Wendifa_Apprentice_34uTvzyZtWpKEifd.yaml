    value: >-
      <p><em>For a time during your childhood, you were left in the care of a
      juju oracle or wendifa, who saw your potential and taught you simple juju
      magic to influence the weakminded for brief periods of
      time.</em></p><p><strong>Benefits</strong>: You can use <em>daze</em> as a
      spell-like ability once per day, using your character level as your caster
      level (minimum 1). The save DC of this effect is Charisma-based. The dazed
      individual looks ashen and deathly for the duration of the effect.</p>
