  description:
    value: >-
      <p><em>The blood of the ancient, magical empire of Azlant flows in your
      veins, even if your family members have no knowledge of their mythic
      pedigree. All your life you've had dreams that seem more like memories of
      a forgotten age.</em></p><p><strong>Requirements</strong></p><p>Human;
      Azlanti*</p><p><strong>Benefits</strong></p><p><em>You gain a +1 trait
      bonus on Knowledge (history) checks and a +2 trait bonus on Appraise
      checks related to objects of Azlanti origin or made to identify ioun
      stones.</em></p><p>(*At the GM's discretion, ethnicities other than
      Azlanti might take this trait, marking a character as a throwback to these
      legendary people.)</p>
