name: Oppressive Expectations
system:
  contextNotes:
    - target: skills
      text: >-
        When you fail at a skill check, you take a -[[2]] penalty on checks with
        that skill until you succeed or until you fail at a different skill
        check, whichever comes first.
  description:
    value: >-
      <p><em>You were raised with the belief that your family was special, and
      that those of your status always succeed at whatever they do. Due to your
      concern about upholding the family name and your memories of the
      consequences for disappointing them (such as violence or unsettling
      disapproval), you are easily
      frustrated.</em></p><p><strong>Effects</strong>: When you fail at a skill
      check, you take a –2 penalty on checks with that skill until you succeed
      or until you fail at a different skill check, whichever comes first.</p>
