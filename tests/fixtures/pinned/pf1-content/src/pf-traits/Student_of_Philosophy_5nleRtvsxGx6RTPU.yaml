name: Student of Philosophy
system:
  contextNotes:
    - target: skill.dip
      text: >-
        You can use your Intelligence modifier in place of your Charisma
        modifier to persuade others, but not on checks to gather information.
    - target: skill.blf
      text: >-
        You can use your Intelligence modifier in place of your Charisma
        modifier to convince others that a lie is true, but not on checks to
        feint in combat.
  description:
    value: >-
      <p><em>You were trained in a now defunct philosophical tradition—such as
      that of the now destroyed Galtan universities or Lirgeni astrologers—and
      learned to use logic and reason to persuade
      others.</em></p><p><strong>Benefits</strong>: You can use your
      Intelligence modifier in place of your Charisma modifier on Diplomacy
      checks to persuade others and on Bluff checks to convince others that a
      lie is true. (This trait does not affect Diplomacy checks to gather
      information or Bluff checks to feint in combat.)</p><p><strong>Suggested
      Characters</strong></p><p>Arodenites, Galtans, Sodden Lands natives.</p>
  sources:
    - id: PZO9433
      pages: '21'
  subType: trait
  traitType: social
type: feat
