  description:
    value: >-
      <p><em>You were born and raised in the city of Wati, and you know its
      streets and secrets well. Although it’s frowned upon by the city’s
      authorities, you have sneaked into the necropolis on multiple occasions to
      wander its dusty, abandoned streets. Out of respect for the deceased,
      you’ve never actually entered one of the necropolis’s silent tombs, but
      you have no fear of what might lie
      inside.</em></p><p><strong>Benefits</strong>: You gain a +2 trait bonus on
      saves against fear effects. In addition, your knowledge of the city grants
      you a +1 trait bonus on Knowledge (local) checks, and that skill is always
      a class skill for you.</p>
