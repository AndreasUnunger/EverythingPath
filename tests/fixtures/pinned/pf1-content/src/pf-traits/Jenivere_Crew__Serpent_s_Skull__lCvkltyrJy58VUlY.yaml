  description:
    instructions: >-
      <p>Select Acrobatics, Climb, Knowledge (nature), Knowledge (geography),
      Swim, or Survival when you take this trait.</p><p>Update the Class skills
      section of the Details tab of this trait to reflect your
      choice.</p><p>Update the target of the change on the Changes tab of this
      trait to reflect your choice.</p>
    value: >-
      <p><em>This trip to Eleder is just one of many in a long career as a
      sailor aboard the Jenivere and other cargo vessels. Whether you joined the
      crew with the hope of one day captaining your own ship, as the means of
      paying your way to a foreign port with sweat and blood, or as a slave or
      indentured servant, you now call the ship
      home.</em></p><p><strong>Benefits</strong>: Pick one of the following
      skills: Acrobatics, Climb, Knowledge (nature), Knowledge (geography),
      Swim, or Survival. You gain a +1 trait bonus on that skill, and that skill
      is always treated as a class skill for you.</p><p>Characters with this
      trait have likely been on the Jenivere since it departed Magnimar.</p>
