name: Affinity for the Elements (any Elemental Lord)
system:
  description:
    instructions: >-
      <p>Choose a single Elemental lord which your character venerates. Each
      lord is associated with an elemental plane. Spells you cast with the
      descriptor of the associated plane are at +1 DC.</p><p>Manually add +1 to
      the spell DC of any spell with the selected descriptor.</p>
    value: >-
      <p><strong>Requirements</strong>: Any Elemental
      Lord</p><p><strong>Benefits</strong>: Add 1 to the DC of saving throws
      made to resist the effects of spells cast by you that have either the air,
      earth, fire, or water descriptor, depending on which elemental lord you
      worship. You must choose a single elemental lord when you take this trait;
      once chosen, it cannot be changed.</p>
