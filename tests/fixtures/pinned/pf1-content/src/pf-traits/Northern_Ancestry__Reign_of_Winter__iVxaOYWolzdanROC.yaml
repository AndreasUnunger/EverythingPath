  description:
    value: >-
      <p><em>One of your parents came from the North, and the tales of the
      frozen lands at the top of the world that you grew up listening to excited
      your imagination. Alternatively, maybe one of your ancestors passed on the
      blood of some frost-rimed creature. You feel most alive during the chill
      of winter, and as a child, you spent hours playing in the snow. You rarely
      feel the cold, and you’ve always had a restless longing to travel
      north.</em></p><p><strong>Benefits</strong>: You gain a +1 trait bonus on
      Fortitude saves, as well as cold resistance 2; this resistance does not
      stack with cold resistance gained from any other source.</p>
