  description:
    value: >-
      <p><em>While the mercantile industries of Magnimar appeal to your keen eye
      for monetary gain, you know that the boldest route to true fortune lays in
      hunting down rare relics and selling them to the highest bidder. Becoming
      a Pathfinder seemed like an obvious decision, allowing you to travel
      throughout Varisia in your search for wealth, so you signed up right away.
      You brought with you a sharp eye and keen ability to distinguish fakes
      from the genuine article.</em></p><p><strong>Benefits</strong>: You gain a
      +1 trait bonus on Appraise checks. Additionally, you gain a +4 bonus on
      Perception checks made to distinguish statue-like creatures (like caryatid
      columns and gargoyles) from actual sculptures.</p>
