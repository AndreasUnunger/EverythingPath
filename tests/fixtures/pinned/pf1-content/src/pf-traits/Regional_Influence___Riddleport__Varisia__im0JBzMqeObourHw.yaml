    value: >-
      <p><em>Although you live some distance from the city-state your community
      owes fealty to, you’ve been influenced by its sophisticated urban
      ways.</em></p><p>Requirements</strong></p><p>Varisia</p><p><strong>Benefits</strong></p><p>Determine
      the city-state of which your home is a holding. You gain a +1 trait bonus
      on checks with one Profession skill and one of the following
      benefits.</p><p><strong>Riddleport</strong></p><p>Gain a +1 trait bonus on
      Swim checks.</p>
