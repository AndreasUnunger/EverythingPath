      </em><span data-tooltip=" Capital city of Taldor, nation in southeastern
      Avistan"><em><span
      style="text-decoration:underline">Oppara</span></em></span><em>. Your
      performance skills have been known to bring even the toughest crowd to
      their feet.</em></p><p><strong>Requirements</strong>: Taldor
      Faction</p><p><strong>Benefits</strong>: Choose one type of Perform skill.
      You gain a +1 trait bonus on Perform checks of the chosen type and this
      skill becomes a class skill for you.</p><hr />
