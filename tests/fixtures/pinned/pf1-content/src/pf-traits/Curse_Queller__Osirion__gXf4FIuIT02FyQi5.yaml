  description:
    value: >-
      <p><strong>Requirements</strong>: <span data-tooltip="Nation in
      northeastern Garund on the Inner Sea"><span
      style="text-decoration:underline">Osirion</span></span></p><p><strong>Benefits</strong>:
      Whenever a caster level check is required to treat an affliction with
      magic (such as when casting <em>remove curse</em> on a cursed creature or
      object), you gain a +2 trait bonus on your caster level check.
      Additionally, you gain a +1 trait bonus on your saving throws against
      curses.</p>
