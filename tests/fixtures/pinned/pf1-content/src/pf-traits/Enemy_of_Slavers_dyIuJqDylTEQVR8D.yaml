      text: >-
        +[[2]] Trait bonus to sway the minds of slavers and anyone who otherwise
        keeps innocent people against their will.
    - target: skill.int
      text: >-
        +[[2]] Trait bonus to sway the minds of slavers and anyone who otherwise
        keeps innocent people against their will.
  description:
    instructions: >-
      <p>to take this trait you must follow the Freedom Knightly code of
      conduct.</p><p>If a knight violates their code of conduct, they are
      disgraced and must perform penance to atone for their transgressions.
      until the penance is completed, disgraced knights no longer receive
      benefits from their knightly traits.</p><p><strong>Freedom<strong>:
      Knights who follow the code of freedom believe that no man, woman, or
      child should be owned by another individual. They believe that all of the
      humanoid races, even those of monstrous descent, deserve to be given a
      chance to make their own decisions in life.</p><p>Their vows are as
      follows.</p><ul><li><p>I will not tolerate slavery in any form. If I
      witness one individual being sold to another, I will intervene with words
      or actions as necessary.</p></li><li><p>If I encounter any escaped slaves,
      I will make it my duty to take them under my care until they find a safe
      home.</p></li><li><p>I shall not willingly deal with any who support or
      benefit from slavery.</p></li><li><p>I keep no slaves. Those who wait upon
      me do so of their own volition or because they are in my employ and are
      treated with the utmost respect.</p></li><li><p>When visiting others who
      keep servants, I will treat them honorably. I shall inquire as to their
      happiness and treatment. Those who are treated as no more than slaves will
      gain my</p><p>strength to support them.</p></li><li><p>Shackles and bonds
      are forbidden unless used on an individual convicted of a crime. Placing
      another person in chains is akin to being a slaver.</p></li></ul>
    value: >-
      <p><em>If you follow this code, you are known to be single-minded with
      regard to slavery, and this fervent belief is easily perceived by others.
      Those who deal in flesh have a greater desire to appease you before
      matters escalate to confrontation, knowing that your wrath will be
      unwavering and swift.</em></p><p><strong>Benefits</strong>: You gain a +2
      trait bonus on Diplomacy and Intimidate checks made to sway the minds of
      slavers and anyone who otherwise keeps innocent people against their
      will.</p>
