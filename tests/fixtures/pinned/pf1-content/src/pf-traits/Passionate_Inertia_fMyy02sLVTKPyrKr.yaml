  description:
    value: >-
      <p><em>Your passions drive your thinking so irresistibly that even magic
      struggles to change your mind.</em></p><p><strong>Benefits</strong>: You
      gain a +2 trait bonus on Will saves to resist having your mind changed
      about something, but you take a –1 penalty on Will saves to resist
      temptation and compulsions you might reasonably be already inclined
      toward.</p>
