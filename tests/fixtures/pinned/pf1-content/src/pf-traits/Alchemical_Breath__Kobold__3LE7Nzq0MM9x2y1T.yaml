name: Alchemical Breath (Kobold)
system:
  description:
    value: >-
      <p><em>Your tribe, in an effort to emulate the green chromatic dragons
      they admire, goes to great lengths to secure alchemical
      coal.</em></p><p><strong>Requirements</strong>:
      Kobold</p><p><strong>Benefits</strong>: As a member of a green kobold
      tribe, you begin play with three pieces of the choking smoke variety of
      @UUID[Compendium.pf-content.pf-items.Item.Zf3UVfrbf2UPJ9ZC]{alchemical
      coal}.</p><p>Eating one of these pellets allows you to exhale noxious
      vapors, damaging and sickening your enemies.</p><p>These pellets do not
      count against your starting character wealth.</p>
