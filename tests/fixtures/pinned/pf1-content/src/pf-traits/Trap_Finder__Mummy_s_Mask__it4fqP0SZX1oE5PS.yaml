      text: You can disarm magic traps.
  description:
    value: >-
      <p><em>Forgotten dungeons and ancient tombs have always held an appeal for
      you, and you’ve never been able to resist the urge to delve into these
      lost sites in search of knowledge, treasure, or both. You may not have
      received any formal training in the roguish arts, but you’ve nonetheless
      become skilled at spotting and disabling hidden traps. The tombs of Wati’s
      necropolis, just opened for exploration, seem like the perfect place to
      put your skills to the test.</em></p><p><strong>Benefits</strong>: You
      gain a +1 trait bonus on Disable Device checks, and that skill is always a
      class skill for you. In addition, you can use Disable Device to disarm
      magic traps, like a rogue.</p>
