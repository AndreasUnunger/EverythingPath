  description:
    value: >-
      <p><em>People don’t need to take your word that things are getting better;
      they only need to look around and see the proof before their eyes. The
      town’s recovery from the orc occupation more than a decade ago is all but
      complete, and the monster in the Sarenite temple outside of town has
      finally been bested. Your irrepressible sense of optimism seems to fly in
      the face of the hard life that most residents of Roslar’s Coffer face, but
      you’re convinced that your positive attitude lifts up your
      community.</em></p><p><strong>Benefits</strong>: You gain a +1 trait bonus
      on saving throws against mind-affecting effects. Further, your optimism
      can be infectious. As a swift action a number of times per day equal to
      your Charisma modifier (minimum 1), you can grant this bonus to an ally
      within 10 feet. This bonus lasts for 1 minute.</p>
