  description:
    instructions: >-
      <p>Select Knowledge (geography) or Profession (sailor) when you take this
      trait.</p><p>Update the Skills tab of your Actor to add the Profession
      (sailor) skill.</p><p>Update the Class skills section of the details tab
      of this trait to reflect your choice.</p><p>Update the target of the
      change on the Changes tab of this trait to reflect your choice.</p>
    value: >-
      <p><em>You've sailed the treacherous waters of the Xidao Gulf in your
      past, and you can navigate their dangers
      adroitly.</em></p><p><strong>Requirements</strong>: <span
      style="text-decoration:underline" data-tooltip="The Tian Xia nation of
      Xidao is unique in that it is an underwater kingdom located beneath of
      waves of the Xidao Gulf, which separates Minkai from the mainland. Xidao
      exists almost entirely underwater, with the exception of stone trade
      spires built on small reefs and atolls that reach the surface"><span
      style="text-decoration:underline">Xidao</span></span></p><p><strong>Benefits</strong>:
      You gain a +1 trait bonus on Knowledge (geography) checks, and a +1 trait
      bonus on Profession (sailor) checks. One of these skills becomes a class
      skill for you.</p>
