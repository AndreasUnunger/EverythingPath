name: Aquatic Survivalist (Plane of Water)
system:
  contextNotes:
    - target: skill.ste
      text: +[[2]] Trait bonus while underwater.
    - target: skill.ste
      text: >-
        Once per day, you can attempt to
        @UUID[Compendium.pf1.class-abilities.Item.ytotO22rp5ji6rT1]{hide in
        plain sight} while underwater. This is only effective against creatures
        that rely on blindsense, blindsight, or tremorsense.
  description:
    value: >-
      <p><em>For whatever reason, you spent much of your formative years
      fighting to keep yourself alive amid the fearsome creatures that inhabit
      the infinite oceans of the Plane of Water, and you learned how to stay
      hidden even against predators with unusual
      senses.</em></p><p><strong>Requirements</strong>: Plane of
      Water</p><p><strong>Benefits</strong>: You gain a +2 trait bonus on
      Stealth checks while underwater. Once per day, you can attempt a Stealth
      check to @UUID[Compendium.pf1.class-abilities.Item.ytotO22rp5ji6rT1]{hide
      in plain sight} (as the ranger class feature of the same name) while
      underwater. This is only effective against creatures that rely on
      @UUID[Compendium.pf-content.pf-universal-monster-rules.Item.VkXlIb0zYsH4IDxz]{blindsense},
      @UUID[Compendium.pf-content.pf-universal-monster-rules.Item.6M7h341H35f5t83M]{blindsight},
      or
      @UUID[Compendium.pf-content.pf-universal-monster-rules.Item.rzESliiwisWAdLTr]{tremorsense}.
      Creatures with other senses perceive you normally.</p>
