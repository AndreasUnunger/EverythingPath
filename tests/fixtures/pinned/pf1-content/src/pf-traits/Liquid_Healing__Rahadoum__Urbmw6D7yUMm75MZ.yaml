name: Liquid Healing (Rahadoum)
system:
  description:
    value: >-
      <p><em>Growing up in Rahadoum, you did not have access to clerics and
      other divine magic for healing, so you relied heavily on potions to cure
      your wounds.&nbsp;As a result, potions heal you more
      effectively.&nbsp;</em></p><p><strong>Requirements</strong>: <span
      style="text-decoration:underline" data-tooltip="Atheist nation in
      northwestern Garund"><span
      style="text-decoration:underline">Rahadoum</span></span></p><p><strong>Benefits</strong>:
      Whenever you consume a potion that heals any number of hit points, you
      heal 2 additional hit points.</p>
