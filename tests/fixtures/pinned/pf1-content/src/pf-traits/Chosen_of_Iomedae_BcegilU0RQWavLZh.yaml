name: Chosen of Iomedae
system:
  description:
    instructions: >-
      <p>When you add the spell to the spellbook, you can adjust the "0/0"
      display to be "1/1", change the "Casts Per Day Used" formula to 1, then
      change the spellbook's spell slots to match.<br />Add a longsword to your
      inventory and mark it masterwork.</p>
    value: >-
      <p><em>At your birth, your parents dedicated your soul to Iomedae to mold
      into a sword of her light. The goddess blessed you, granting you a gift of
      light to brighten your path through darkness and a fine sword with which
      to spread her will.</em></p><p><strong>Benefits</strong>: You may cast
      @UUID[Compendium.pf1.spells.Item.ip9onjfp6nf1vlv9]{light} once per day as
      a spell-like ability (caster level 1st), and you begin play with a
      masterwork longsword. In addition, whenever <em>light</em> is cast upon
      this sword, the radius of <em>light </em>and its duration is doubled.</p>
  sources:
    - id: PZO9431
      pages: '13'
  subType: trait
  traitType: faith
type: feat
