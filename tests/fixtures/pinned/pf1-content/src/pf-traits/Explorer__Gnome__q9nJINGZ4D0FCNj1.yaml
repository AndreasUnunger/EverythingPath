name: Explorer (Gnome)
system:
  contextNotes:
    - target: skill.sur
      text: +[[2]] bonus in your current desired terrain type.
  description:
    value: >-
      <p><em>Though many gnomes settle down in communities large enough and
      interesting enough to provide them with all the stimulation they need to
      ward off the Bleaching, you’re never going to be one of them. You are
      always looking around the next bend in the road or over the next hill,
      past the borders of where you are to where you want to
      be.</em></p><p><strong>Requirements</strong>:
      Gnome</p><p><strong>Benefits</strong>: At the beginning of each character
      level, select one desired terrain type from the following
      list:</p><ul><li>cold</li><li>desert</li><li>forest</li><li>jungle</li><li>mountains
      (including hills)</li><li>plains</li><li>planes (other than the Material
      Plane)</li><li>swamp</li><li>underground (including caves and
      dungeons)</li><li>urban</li><li>water</li></ul><p>You gain a +2 bonus on
      all Survival checks made in your desired terrain type.</p><p>At the
      beginning of each level, you must select a new desired terrain type to
      replace the old one</p><p>(you <strong>cannot</strong> take the same
      desired terrain type two levels in a row).</p>
