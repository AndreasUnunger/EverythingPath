        value: '60'
  description:
    instructions: >-
      <p>Select one of Perform (act, comedy, oratory, or sing)  when you take
      this trait.</p><p>Update the Skills tab of your Actor to add the chosen
      skill.</p><p>Update the Class skills section of the Details tab of this
      trait to reflect your choice.</p>
    value: >-
      <p><em>You are particularly adept at expressing your beliefs in a way that
      resonates with others.</em></p><p><strong>Requirements</strong>: Liberty's
      Edge</p><p><strong>Benefits</strong>: Perform (act, comedy, oratory, or
      sing) becomes a class skill for you. Once per day you can spend 1 minute
      addressing and inspiring your allies within 60 feet, after which you can
      attempt a DC 15 Perform (act, comedy, oratory, or sing) check. If you
      succeed, your allies gain a +1 trait bonus on saving throws against fear
      effects for 5 minutes. If you exceed the check DC by 10 or more, increase
      the bonus by 1.</p>
