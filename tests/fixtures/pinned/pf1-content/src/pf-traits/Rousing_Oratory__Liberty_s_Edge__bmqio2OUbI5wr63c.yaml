      description: >-
        <p>Once per day you can spend 1 minute addressing and inspiring your
        allies within 60 feet, after which you can attempt a DC 15 Perform (act,
        comedy, oratory, or sing) check. If you succeed, your allies gain a +1
        trait bonus on saving throws against fear effects for 5 minutes. If you
        exceed the check DC by 10 or more, increase the bonus by 1.</p>
