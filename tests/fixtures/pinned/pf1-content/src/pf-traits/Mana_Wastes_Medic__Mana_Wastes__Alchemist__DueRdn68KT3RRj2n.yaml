  description:
    value: >-
      <p><em>After witnessing a terrible disaster result from an attempt at
      magical healing in the Mana Wastes, you are careful and methodical when
      crafting your own healing
      tinctures.</em></p><p><strong>Requirements</strong>: Alchemist healers who
      hail from the <span style="text-decoration:underline" data-tooltip="Magic
      warped strip of land devastated by a thousand year war between to nations
      led by wizards in eastern Garund."><span
      style="text-decoration:underline">Mana Wastes</span></span> or who have
      lived there for at least 1 year</p><p><strong>Benefits</strong>: The
      amount of hit points restored by your Heal checks to treat deadly wounds
      and your extracts of the healing subschool is increased by 1.</p>
