name: Mana Wastes Medic (Mana Wastes; Alchemist)
system:
  contextNotes:
    - target: skill.hea
      text: >-
        The amount of hit points restored by your Heal checks to treat deadly
        wounds is increased by 1.
    - target: spellEffect
