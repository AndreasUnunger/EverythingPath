  description:
    value: >-
      <p><em>During your childhood, you suffered occasional or frequent abuse
      from those too powerful for you to resist. Now you thrill at the chance to
      get back at those who wronged you.</em></p><p><strong>Benefits</strong>:
      Whenever you strike the last creature that damaged you in the past 24
      hours, you gain a +1 trait bonus on damage rolls against that
      creature.</p><p><strong>Suggested Characters</strong></p><p>Calistrians,
      Galtan refugees, Gyronna worshipers</p>
