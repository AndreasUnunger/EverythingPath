    value: >-
      <p><em>You come from a cannibal tribe, and find strength in the flesh of
      your foes.</em></p><p><strong>Requirements</strong>:
      Zura</p><p><strong>Benefits</strong>: Whenever you eat the flesh or drink
      the blood of another orc—a full-round action that provokes attacks of
