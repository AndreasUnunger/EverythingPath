  description:
    value: >-
      <p><em>During your childhood, you knew someone who was addicted to
      @UUID[Compendium.pf-content.pf-items.Item.moOwdDOVvdf5XkE5]{mumia}, a drug
      made from the flesh of the dead, whether that was a drug-addled parent, an
      unsavory employer, or a libertine childhood
      friend.</em></p><p><strong>Requirements</strong>: <span
      data-tooltip="Nation in northeastern Garund on the Inner Sea"><span
      style="text-decoration:underline">Osirion</span></span></p><p><strong>Benefits</strong>:
      Although you did not indulge in the ghoulish narcotic yourself, your
      exposure to it grants you a +1 trait bonus on saving throws against curses
      and diseases, including magical diseases. (For more information on mumia,
      see page 21 of <em>Pathfinder Campaign Setting: Lost Kingdoms</em>.)</p>
