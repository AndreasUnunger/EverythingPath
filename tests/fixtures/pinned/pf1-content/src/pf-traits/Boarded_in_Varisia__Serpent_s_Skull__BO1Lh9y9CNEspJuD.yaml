name: Boarded in Varisia (Serpent's Skull)
system:
  contextNotes:
    - target: ''
      text: >-
        +[[2]] Trait bonus on all Bluff checks made against inhabitants of the
        jungle.
    - target: ''
      text: >-
        +[[1]] caster level to your spells with the mind-affecting descriptor
        when cast against creatures and natives of the jungle.
  description:
    instructions: >-
      <p>Select either Bluff checks or mind-affecting descriptor spells when you
      take this trait.</p><p>Update the target of the note on the changes tab of
      this trait to reflect your choice and delete the change relating to the
      other choice.</p>
    value: >-
      <p><em>Traveling from lands far to the north, you likely have little
      experience with the jungle, its denizens, or its strange forces. Just as
      the lands of Garund are wild and exotic to you, so are you to
      them.</em></p><p><strong>Benefits</strong>: This unusualness manifests in
      one of two ways. Choose to gain either a +2 trait bonus on all Bluff
      checks made against inhabitants of the jungle, or treat your spells with
      the mind-affecting descriptor as being +1 caster level higher when cast
      against creatures and natives of the jungle.</p>
