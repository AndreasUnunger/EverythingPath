  description:
    instructions: >-
      <p> Select Knowledge (local) or Knowledge (nobility) when you take this
      trait.</p><p>Update the Class skills section of the details tab of this
      trait to reflect your choice.</p>
    value: >-
      <p><em>Whether you are a commoner who has come to despise the haughty
      upper crust or a holier-than-thou noble who can’t stand being around the
      unwashed masses, your contempt drives you to study carefully, making sure
      you always have the upper hand in social exchanges with
      them.</em></p><p><strong>Benefits</strong>: You gain a +1 trait bonus on
      Knowledge (local) checks and Knowledge (nobility) checks, and one of these
      skills becomes a class skill for you.</p>
