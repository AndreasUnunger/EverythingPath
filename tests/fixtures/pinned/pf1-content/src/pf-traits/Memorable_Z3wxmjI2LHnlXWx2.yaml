  description:
    value: >-
      <p><em>Growing up amid a large number of children, you learned quickly how
      to get others’ attention and keep
      it.</em></p><p><strong>Benefits</strong>: When you modify a character’s
      attitude with the Diplomacy or Intimidate skill, the attitude change lasts
      1-1/2 times longer than it otherwise would. </p><p>Whenever you create a
      fear or mind-affecting effect that imposes a penalty or bonus with a
      duration of at least 2 rounds, it lasts 1 additional round after it would
      normally end. </p><p>For example, if you demoralize a foe with an
      Intimidate check and beat the DC by 5, the victim is shaken for 3 rounds
      instead of the usual 2 rounds.</p><p><strong>Suggested
      Characters</strong></p><p>Free Captains, gnomes, Keleshites.</p>
