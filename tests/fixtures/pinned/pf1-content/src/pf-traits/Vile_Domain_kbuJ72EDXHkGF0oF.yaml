  description:
    instructions: >-
      <p>Select both an evil aligned deity and a domain granted by the chosen
      deity when you take this trait.</p>
    value: >-
      <p><em>Your connection with a malignant force has granted you great
      power.&nbsp;</em></p><p><strong>Benefits</strong>: Choose a domain granted
      by an evil aligned deity, such as an archdevil, demon lord, or Great Old
      One. You gain a +1 trait bonus to your caster level when casting spells
      that are granted by that domain. </p><p>This doesn’t grant you the ability
      to cast such spells—you must still have access to the spells through some
      other means.</p>
