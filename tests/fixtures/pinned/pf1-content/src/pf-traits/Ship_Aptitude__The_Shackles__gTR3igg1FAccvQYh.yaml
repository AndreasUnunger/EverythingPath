      never set foot on before.</em></p><p><strong>Requirements</strong>: The
      Shackles</p><p><strong>Benefits</strong>: You gain a +1 trait bonus on
      Profession (sailor) checks, and Profession (sailor) becomes a class skill
      for you.</p>
