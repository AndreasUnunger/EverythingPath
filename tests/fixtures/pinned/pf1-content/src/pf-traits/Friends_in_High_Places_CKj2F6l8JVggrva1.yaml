name: Friends in High Places
system:
  contextNotes:
    - target: skill.dip
      text: >-
        +[[1]] Trait bonus in areas in which you have used the Diplomacy skill
        to gather information. This bonus increases to +[[2]] when dealing with
        government officials.
    - target: skill.int
      text: >-
        +[[1]] Trait bonus in areas in which you have used the Diplomacy skill
        to gather information. This bonus increases to +[[2]] when dealing with
        government officials.
  description:
    value: >-
      <p><em>You have often seen lawbreakers go free when they demonstrate they
      have friends in high places, and so you put special effort into
      befriending powerful people
      yourself.</em></p><p><strong>Benefits</strong>: Whenever you are in an
      area in which you have used the Diplomacy skill to gather information, you
      gain a +1 trait bonus on Diplomacy and Intimidate checks. This bonus
      increases to +2 when dealing with government
      officials.</p><p><strong>Suggested Characters</strong></p><p>Absalom
      natives, Aspis Consortium agents, Taldans.</p>
