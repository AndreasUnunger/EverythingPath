  description:
    instructions: >-
      <ol ><li ><p>Select Knowledge (geography) or Knowledge (local) when you
      take this trait.</p></li><li><p>Update the Class skills section of the
      details tab of this trait to reflect your choice.</p></li><li><p >Select
      one additional language when you take this trait.</p></li><li ><p>Update
      the Granted Proficiencies&gt;Languages section of the details tab of this
      trait to reflect this choice.</p></li></ol>
    value: >-
      <p><em>You have long led a nomadic life—perhaps because your parents were
      travelers (whether roaming Varisian caravaneers or traveling merchants who
      traded far and wide), you belonged to a nomadic tribe, or you ran away
      from home to discover the world at a young age. Some call it wanderlust,
      but to you the thought of new places and experiences is truly what makes
      life worth living, and no region catches your imagination like the
      windswept wilderness of the North. You are used to getting along in
      unfamiliar lands and interacting with interesting new
      people.</em></p><p><strong>Benefits</strong>: You gain a +1 trait bonus on
      Knowledge (geography) and Knowledge (local) checks, and one of these
      skills (your choice) is a class skill for you. You can also speak one
      additional language (this does not count toward your number of
      languages).</p><hr

      />
