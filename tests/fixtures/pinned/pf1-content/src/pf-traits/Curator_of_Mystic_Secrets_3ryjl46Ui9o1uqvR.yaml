    value: >-
      <p><em>Your broad collection of lore grants unparalleled understanding of
      magic’s underlying principles.</em></p><p><strong>Exemplar
      Type</strong></p><p>Magic Exemplar</p><p><strong>Benefits</strong>: Twice
      per day when spontaneously casting a spell altered by metamagic, you can
      do so without increasing the spell’s casting time. For each other magic
      trait you have, you can use this trait’s benefit an additional time each
      day.</p><p><strong>Exemplar Traits</strong></p><p>A character can have
      only one exemplar trait, and selecting an exemplar trait takes the place
      of two regular traits. Each exemplar trait is tied to a trait category,
      such as combat traits or regional traits; a character with an exemplar
      trait is no longer restricted to a single trait of that category and can
      select any number of such traits when gaining further traits. In addition,
      a character with an exemplar trait can select the Additional Traits feat
      any number of times and use the feat to gain an exemplar trait of a valid
      trait category for which they qualify.</p>
