name: Airship Captain (Plane of Air)
system:
  contextNotes:
    - target: wisChecks
      text: >-
        +[[2]] Trait bonus to move in a plane with subjective directional
        gravity, and on driving checks.
  description:
    value: >-
      <p><em>Your years of piloting airships on the Plane of Air, dodging angry
      mephits and protecting your passengers from the depredations of capricious
      elementals, have taught you how to expertly command your vessel, as well
      as how to arrest yourself even in the midst of the most turbulent planar
      storms.</em></p><p><strong>Requirements</strong>: Plane of
      Air</p><p><strong>Benefits</strong>: You gain a +2 trait bonus on Wisdom
      checks to move in a plane with subjective directional gravity (see the
      planar rules in the <em>Pathfinder RPG GameMastery Guide</em>) and a +2
      trait bonus on driving checks (see the vehicle rules in <em>Pathfinder RPG
      Ultimate Combat</em>).</p>
