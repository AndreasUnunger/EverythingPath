      <p><em>You are blessed by fate.</em></p><p><strong>Benefits</strong>: Once
      per day when you use a spell or magic item with a randomized effect (such
      as @UUID[Compendium.pf1.spells.Item.n0bsyxchnigkkuqo]{confusion},
      @UUID[Compendium.pf1.spells.Item.97mcivnu2owb8119]{mirror image},
