      formula: '1'
      type: trait
  description:
    instructions: >-
      <p>Select <strong>Dropout</strong>&nbsp;or <strong>Family Honor</strong>
      when you take this trait.</p><p>Update the Class skills section of the
      Details tab of this trait to reflect the Skill associated with your
      choice.</p><p>Update the target of the Change on the Changes tab of this
      trait to reflect the Skill associated with your choice.</p>
    value: >-
      <p><em>Someone you know and love was accused of murder. A supposed
      eyewitness account from a local fisherman seemed to be enough to seal the
      case, but the accused had enough alibis that sentencing wasn't immediate.
      Someone confronted the fisherman and discovered he was intimidated into
      providing false witness and forced into planting the murder weapon by the
      actual murderer - a local crimelord named Gaedren Lamm. Lamm's thugs
      killed the fisherman before he could recant his testimony. Although this
      removed the key witness and resulted in the accused being set free, the
      stigma was enough to badly damage his reputation. If you can find Gaedren,
      you're sure you can find evidence that ties him to the murder and can
      clear the accused's
      name.</em></p><p><strong>Benefits</strong></p><p>Choose one of the
      following benefits:</p><p><strong>Dropout</strong></p><p>You were the one
      accused. Although you were eventually freed when a friend confronted the
      fisherman and got the truth, the damage had been done. You were forced to
      leave your school (perhaps the Acadamae) or church. As a result, you were
      forced to self-train and promised yourself you would become better at your
      chosen profession despite the spurning of your peers. You gain a +1 trait
      bonus on Spellcraft checks, and Spellcraft is a class skill for
      you.</p><p><strong>Family Honor</strong></p><p>The person framed was a
      family member, perhaps a father or brother. You managed to trick the
      fisherman into revealing the truth with your skilled tongue. You gain a +1
      trait bonus on Bluff checks, and Bluff is a class skill for you.</p><hr />
