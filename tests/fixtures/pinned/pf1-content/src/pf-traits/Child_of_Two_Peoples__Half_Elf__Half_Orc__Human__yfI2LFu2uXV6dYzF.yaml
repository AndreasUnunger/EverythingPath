name: Child of Two Peoples (Half-Elf, Half-Orc, Human)
system:
  contextNotes:
    - target: allSavingThrows
      text: +[[2]] Trait bonus against charm and compulsion effects.
  description:
    instructions: >-
      <p>Determine the racial or ethnic languages of both your parents&nbsp;when
      you take this trait.</p><p>Update the Granted Proficiencies section
      Languages, on the details tab of this trait, to reflect these options.</p>
    value: >-
      <p><em>Your parents come from two visibly different cultures that maintain
      distinct identities regardless of their physical proximity (such as Tians
      and Ulfen). The tug of conflicting expectations has strengthened your
      sense of individuality and given you a gift for
      languages.</em></p><p><strong>Requirements</strong>: Half-Elf, Half-Orc,
      or Human</p><p><strong>Benefits</strong>: You receive a +2 trait bonus on
      Will saves against charm and compulsion effects, and you automatically
      know the racial or ethnic languages of both your parents.&nbsp;</p>
