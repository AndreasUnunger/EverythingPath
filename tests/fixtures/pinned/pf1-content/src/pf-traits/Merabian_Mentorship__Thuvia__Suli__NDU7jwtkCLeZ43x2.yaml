name: Merabian Mentorship (Thuvia; Suli)
system:
  description:
    value: >-
      <p><em>You were apprenticed to a renowned alchemist of </em><span
      style="text-decoration:underline" data-tooltip="Merab is the largest of
      Thuvia's five allied city-states; a port city on the Inner Sea, located on
      Garund's northern coast."><em><span
      style="text-decoration:underline">Merab</span></em></span><em>, and she
      taught you how to recognize elemental reagents by
      taste.</em></p><p><strong>Requirements</strong>: <span
      style="text-decoration:underline" data-tooltip="Sulis are geniekin touched
      by multiple elements"><span
      style="text-decoration:underline">Suli</span></span> native to <span
      style="text-decoration:underline" data-tooltip="Desert nation on northern
      coast of Garund, on the Inner Sea."><span
      style="text-decoration:underline">Thuvia</span></span></p><p><strong>Benefits</strong>:
      Upon imbibing a potion containing a spell on your formula list of a spell
      level you are capable of casting, you can attempt a Spellcraft check (DC
      15 + extract level). On a success, you can immediately add the spell to
      your formula book.</p>
