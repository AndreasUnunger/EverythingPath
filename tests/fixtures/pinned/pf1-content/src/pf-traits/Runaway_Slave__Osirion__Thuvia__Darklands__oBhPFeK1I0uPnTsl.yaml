name: Runaway Slave (Osirion, Thuvia, Darklands)
system:
  contextNotes:
    - target: allSavingThrows
      text: +[[1]] Trait bonus against fear effects.
  description:
    value: >-
      <p><em>Though the ghouls of </em><span style="text-decoration:underline"
      data-tooltip="Nemret Noktoria is the hidden city of the civilized ghouls
      of the Darklands. It is located in distant Sekamina, far beneath the
      border between the Garundi nations of Osirion and Thuvia."><em><span
      style="text-decoration:underline">Nemret Noktoria</span></em></span><em>
      and the drow of </em><span style="text-decoration:underline"
      data-tooltip="The massive city of Zirnakaynin (pronounced
      zeer-nuh-KAY-nin) is not only the largest drow settlement, but also the
      most populous city in the Darklands. It has stood for over eight millennia
      and spreads out over three enormous caverns in the realm of Sekamina, far
      below the surface nation of Nirmathas."><em><span
      style="text-decoration:underline">Zirnakaynin</span></em></span><em>
      seldom darken the surface of Golarion, both have pacts with influential
      slavers and warlords who periodically provide the demon worshipers with
      kidnapped slaves. You were once one of these unfortunate victims and were
      destined to become a sacrifice to a dreadful demon lord, but you managed
      to slip your bonds and escape back to the surface. The horrors you
      witnessed were beyond fathoming, and though visions of imprisoned loved
      ones and friends plague your dreams, you are stronger for the
      experience.</em></p><p><strong>Requirements</strong>: <span
      style="text-decoration:underline" data-tooltip="Osirion is a nation in
      northeastern Garund on the Inner Sea; Thuvia is a desert nation on
      northern coast of Garund, on the Inner Sea and on Osirion's western
      border; the Darklands is an immense series of caverns, vaults, and
      passages that can be found beneath the surface of all of Golarion's
      continents.  for information about nations with connections to the
      Darklands you may wish to review 
      https://pathfinderwiki.com/wiki/Entrances_to_the_Darklands"><span
      style="text-decoration:underline">Osirion, Thuvia, or any region with ties
      to the Darklands</span></span></p><p><strong>Benefits</strong>: You gain a
      +1 trait bonus on saves against fear effects and gain low-light vision 10
      feet. If you already have low-light vision, its range extends by 10
      feet.</p>
