  description:
    instructions: >-
      <p>Select one (1) of the three options available when you take this
      trait.</p><p>If you choose the bonus to Perception:</p><ol><li><p>Update
      the Formula of the change on the Changes tab of this trait to
      "1".</p></li><li><p>Delete the note on the changes tab.</p></li></ol><p>If
      you choose to gain Low-light vision:</p><ol><li><p>Delete the change on
      the Changes tab of this trait.</p></li><li><p>Delete the note on the
      changes tab of this trait.</p></li><li><p>On your actor's Attributes tab,
      edit the "senses" and check the box beside "Low-light Vision" and click
      the Save Changes Button.</p></li></ol><p>If you choose to gain the bonus
      to saving throws:</p><ol><li><p>Delete the change on the Changes tab of
      this trait.</p></li><li><p>Update Target of the note on the Changes tab of
      this trait to "All Saving Throws".</p></li></ol>
    value: >-
      <p><em>Long ago, your ancestors’ blood mixed with that of
      dragons.</em></p><p><strong>Requirements</strong>: Any
      race</p><p><strong>Benefits</strong>: Choose one of the following: gain a
      +1 trait bonus on Perception checks, gain low-light vision, or gain a +2
      trait bonus on saving throws against effects that cause sleep or
      paralysis.</p><div><hr /></div>
