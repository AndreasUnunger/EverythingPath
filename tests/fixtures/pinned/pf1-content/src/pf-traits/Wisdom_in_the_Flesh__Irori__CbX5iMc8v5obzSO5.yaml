name: Wisdom in the Flesh (Irori)
system:
  description:
    instructions: >-
      <p>Select any one skill that is normally Strength, Constitution, or
      Dexterity-based when you take this trait. </p><p>Update the Class skills
      section of the Details tab of this trait to reflect your choice. Update
      the Skills tab of the actor to reflect wisdom rather than the default
      ability for the chosen skill.</p><p>&nbsp;</p>
    value: >-
      <p><em>Your meditation on the nature of strength and speed allows you to
      focus your thoughts to achieve things your body might not be able to do on
      its own.</em></p><p><strong>Requirements</strong>:
      Irori</p><p><strong>Benefits</strong>: Select any Strength, Constitution,
      or Dexterity-based skill. You make checks with that skill using your
      Wisdom modifier instead of its normal ability score. That skill is always
      a class skill for you.</p>
