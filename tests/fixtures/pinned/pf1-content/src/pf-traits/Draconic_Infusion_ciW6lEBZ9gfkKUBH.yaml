  description:
    instructions: >-
      <p>Choose the acid, cold, electricity, or fire spell descriptor when you
      take this trait. Update the text of the note on the changes tab of this
      trait to reflect your choice. On the details tab of this trait, edit the
      action to include the appropriate damage type.</p>
    value: >-
      <p><em>You were exposed to an artifact or other powerful magic that
      infused you with the power of
      dragons.</em></p><p><strong>Benefits</strong>: Choose the acid, cold,
      electricity, or fire spell descriptor when you take this trait. Once per
      day for every 2 caster levels you have (minimum once per day), when you
      cast a spell that has your chosen elemental descriptor, you can deal an
      additional 1d4 points of damage of that energy type to one target of that
      spell.</p>
