name: Younger Sibling (Jade Regent)
system:
  changes:
    - _id: 0exUVkqQ
      formula: '1'
      type: trait
  contextNotes:
    - target: attack
      text: >-
        +[[1]] Trait bonus on all attack rolls against foes that threaten your
        older sibling, (Ameiko, Sandru, or Shalelu).
  description:
    instructions: >-
      <ol><li><p>Select Ameiko (Will),  Sandru (Fortitude) or Shalelu (Reflex)
      when you take this trait.</p></li><li><p>Update the target of the change
      on the Changes tab of this trait to reflect your choice. (Will,
      Fortitude,  or Reflex)</p></li><li><p>Update the text of the context note
      on the Changes tab of this trait to reflect your choice. (Ameiko, Sandru,
      or Shalelu)</p></li></ol>
    value: >-
      <p><em>You've lived your whole life in the shadow of your older sibling, a
      person who seems to have the adventure-filled lifestyle you've always
      wanted for yourself. While your sibling always took care of you, he or she
      never supported your desire to become an adventurer,your sibling never
      explained why, only saying, "Adventuring can cause a lot of pain just as
      easily as it can bring success and riches."</em> <em>As a younger sibling
      to one of Sandpoint's more influential citizens, you share some of that
      NPC's innate talent and skill at
      adventuring.</em></p><p><strong>Benefits</strong>: You gain a +1 trait
      bonus on all attack rolls against foes that threaten your older sibling as
      well as one of the following:</p><p>If you're Ameiko's younger sibling,
      your ferocious independence and self-confidence give you a +1 trait bonus
      on Will saving throws.</p><p>If you're Sandru's younger sibling, your
      hearty constitution gives you a +1 trait bonus on all Fortitude saving
      throws.</p><p>If you're Shalelu's younger sibling, your quick reflexes
      give you a +1 trait bonus on all Reflex saving
      throws.</p><p><strong>Notes</strong></p><p>Although you're a younger
      sibling of an established NPC, this doesn't necessarily lock you in to
      being the same race as that NPC - if you're a different race or ethnicity
      than the NPC you choose as your older sister or brother, you were adopted
      into the family by your parents.</p><p><strong>NPC Choices</strong>:
      Ameiko, Sandru, Shalelu.</p>
  sources:
