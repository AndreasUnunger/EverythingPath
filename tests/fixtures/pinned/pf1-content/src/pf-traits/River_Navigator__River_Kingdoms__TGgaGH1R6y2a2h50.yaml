  description:
    instructions: >-
      <p>Select Survival or Profession (sailor) when you take this
      trait.</p><p>Update the Skills tab of your Actor to add the Profession
      (sailor) skill.</p><p>Update the Class skills section of the details tab
      of this trait to reflect your choice.</p><p>Update the target of the
      Context Note on the changes tab of this trait to Profession (sailor).</p>
    value: >-
      <p><em>You grew up in the River Kingdoms and are familiar with the many
      winding streams that cross the
      land.</em></p><p><strong>Requirements</strong>: <span
      style="text-decoration:underline" data-tooltip="Constantly shifting group
      of small city-states and fiefdoms in northeastern Avistan "><span
      style="text-decoration:underline">River
      Kingdoms</span></span></p><p><strong>Benefits</strong>: You gain a +1
      trait bonus on Survival checks or Profession (sailor) checks dealing with
      lakes, rivers, and their immediate surroundings, and one of these skills
      becomes a class skill for you.&nbsp;</p>
