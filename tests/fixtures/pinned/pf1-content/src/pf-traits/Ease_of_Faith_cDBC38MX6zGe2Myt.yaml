    value: >-
      <p><em>Your mentor, the person who invested your faith in you from an
      early age, took steps to ensure that you understood that what powers your
      divine magic is no different than that which powers the magic of other
      religions. This philosophy makes it easier for you to interact with others
      who may not share your views.</em></p><p><strong>Benefits</strong>: You
      gain a +1 bonus on Diplomacy checks, and Diplomacy is always a class skill
      for you.</p>
