      formula: '1'
      type: trait
  description:
    instructions: >-
      <p>Select Climb, Handle Animal, Knowledge (nature), Perception, Ride,
      Survival, or Swim when you take this trait.</p><p>Update the target of the
      change on the Changes tab of this trait to reflect your choice.</p>
    value: >-
      <p><em>You have long lived along the southern border of Brevoy, in the
      shadow of wilderness known as the Stolen Lands. Life has been hard, but
      through hunting, trapping, trading, and coaxing crops from the freezing
      earth, you've learned how to survive on the rugged frontier. With the
      wilderness ever at your door, you've also learned much about its denizens
      and the wild creatures that lurk in that unwholesome land. Your family
      might even claim holdings in the Stolen Lands, with elders telling stories
      of being driven from or robbed of a lost ancestral homestead, fertile
      farmlands, bountiful orchards, or a hidden mining claim. Whether because
      of your personal expertise and familiarity with the borderlands or in
      order to reclaim your family's land, you've joined the expedition into the
      Stolen Lands.</em></p><p><strong>Benefits</strong>: You begin play with a
      horse. Also, choose one of the following skills: Climb, Handle Animal,
      Knowledge (nature), Perception, Ride, Survival, or Swim - you gain a +1
      trait bonus on this skill.</p>
