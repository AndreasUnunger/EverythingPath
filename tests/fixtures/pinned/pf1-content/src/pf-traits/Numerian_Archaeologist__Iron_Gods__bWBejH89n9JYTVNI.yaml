name: Numerian Archaeologist (Iron Gods)
system:
  description:
    value: >-
      <p><em>Numeria is a land ripe for archaeological exploration, since so
      many of the strange technological dungeons have been either avoided by the
      superstitious barbarian tribes or have been locked down by the Technic
      League, leaving many of them untouched and ripe for exploration. You’ve
      studied the strange language associated with these eerie technological
      ruins, and are eager to start exploring them—you suspect that Torch’s
      namesake is in fact part of a larger buried ruin, and you hope to enter
      these ruins and learn their original purpose by exploring the caves below
      town.</em></p><p><strong>Benefits</strong>: You gain Androffan as an
      additional language. In addition, you possess a knack for technological
      items; when you use a timeworn technological item, roll twice when
      determining any glitches the item might cause and choose which result to
      use as your actual result. Talk to your GM for more information about
      resolving glitches.</p>
