    instructions: >-
      <p>Select Knowledge (geography), Knowledge (local), or Sense Motive when
      you take this trait.</p><p>Update the Class skills section of the details
      tab of this trait to reflect your choice.</p><p>Select one bonus language
      when you take this trait.</p><p>Update the Granted
      Proficiencies&gt;Languages section of the details tab of this trait to
      reflect your choice.</p>
    value: >-
      <p><em>You grew up in Absalom, and as a child you learned trivia about
      people and places from all across the
      world.</em></p><p><strong>Requirements</strong>: <span
      style="text-decoration:underline" data-tooltip="Largest city on Golarion,
      located on the southern coast of the Isle of Kortos in the Inner Sea.
      Population exceeds 300,000."><span
      style="text-decoration:underline">Absalom</span></span></p><p><strong>Benefits</strong>:
      Choose Knowledge (geography), Knowledge (local), or Sense Motive; that
      skill is a class skill for you. In addition, you know one additional bonus
      language.</p>
