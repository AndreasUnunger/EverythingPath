  description:
    value: >-
      <p><br /><em>The end times are coming, and the shadow in the sky over
      </em><span data-tooltip="Riddleport is the third-largest city in Varisia
      and its most northern port."><em><span
      style="text-decoration:underline">Riddleport</span></em></span><em> is
      just the first piece of proof. Convinced that the end of the world is
      nigh, you’ve decided to take part in the </em><span data-tooltip="Gold
      Goblin Gambling Hall is a gaming hall and casino located in the Varisian
      city of Riddleport"><em><span style="text-decoration:underline">Golden
      Goblin</span></em></span><em>'s gambling tournament—after all, what do you
      have to
      lose?</em></p><p><em><strong>Benefits</strong></em></p><p><em>Whenever you
      roll a “1” on an attack roll, you gain a +1 trait bonus on your next
      attack roll so long as it is made within 1 minute. You also begin play
      with a placard bearing an apocalyptic slogan of your choice—this wooden
      sign can be used as a
      @UUID[Compendium.pf1.weapons-and-ammo.Item.vu3N4zCRDTUJ5FW4]{club}.<br
      /></em></p>
