name: Horrifying Mind
system:
  contextNotes:
    - target: will
      text: >-
        Whenever a creature attempts to read your mind, it has to attempt a will
        save opposed by your Wisdom or Charisma check (your choice). If the
        reader fails this save, she is shaken for 1 round. If she fails by 10 or
        more, she is instead frightened for 1 round, then shaken for 1 round.
  description:
    value: >-
      <p><strong>Benefits</strong>: When a nonevil humanoid attempts to read
      your mind via a magical effect, the reader must attempt a Will save
      opposed by your Wisdom or Charisma check (your choice). If the reader
      fails this save, she is shaken for 1 round. If she fails by 10 or more,
      she is instead frightened for 1 round, then shaken for 1 round.</p>
