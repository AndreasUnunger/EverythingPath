  description:
    instructions: >-
      <p>Select one Knowledge skill when you take this drawback.</p><p>Delete
      the one Note on the changes tab related to this skill only.</p>
    value: >-
      <p><em>You have always had difficulty learning and retaining information,
      and know very little about the world beyond the obvious and what pertains
      to your profession.</em></p><p><strong>Effects</strong>: Choose one
      Knowledge skill. You cannot attempt untrained Knowledge checks with any
      other Knowledge skills, even if the check’s DC is 10 or lower. If you have
      access to a library that covers a specific Knowledge skill, you may
      attempt an untrained Knowledge check with a –2 penalty.</p><hr />
