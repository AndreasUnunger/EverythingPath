    value: >-
      <p><em>You are a product of </em><span data-tooltip="An isolated island
      nation in the Steaming Sea southwest off the coast of Varisia. Uninhabited
      until 4552 AR, when the gold dragon Mengkare began to use it as the site
      of a unique social, and human breeding, experiment he called "><em><span
      style="text-decoration:underline">Hermea</span></em></span><em>'s breeding
      programs - either your parents were chosen to be citizens, or you were,
      but later failed to live up to the island's high
      standards.</em></p><p><strong>Requirements</strong>: <span
      data-tooltip="Portion of the Arcadian ocean situated just off the
      northwestern coast of Avistan, the Steaming Sea stretches from Cheliax’s
      northern border up into the frozen reaches of the Crown of the World in
      the extreme north."><span style="text-decoration:underline">The Steaming
      Sea</span></span></p><p><strong>Benefits</strong>: Whatever the case, you
      are quicker than normal members of your race, and gain a +2 trait bonus on
      Initiative checks.</p>
