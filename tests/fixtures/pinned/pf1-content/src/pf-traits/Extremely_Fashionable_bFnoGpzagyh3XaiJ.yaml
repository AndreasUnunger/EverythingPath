  description:
    value: >-
      <p><em>You really know how to make a good impression when you’re dressed
      well.</em></p><p><strong>Benefits</strong>: Whenever you are wearing
      clothing and/or jewelry worth at least 150 gp (and not otherwise covered
      in gore, sewage, or other things that mar your overall look), you gain a
      +1 trait bonus on Bluff, Diplomacy, and Intimidate checks. One of these
      skills (your choice) is a class skill for you.</p>
