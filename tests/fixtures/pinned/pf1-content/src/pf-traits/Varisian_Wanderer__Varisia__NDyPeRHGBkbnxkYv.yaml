  description:
    instructions: >-
      <p>Select one (1) of Perform (choose one type), Profession
      (fortuneteller), or Sleight of Hand when you take this trait.</p><p>If you
      selected a Perform type or Profession (fortuneteller), update the Skills
      tab of your Actor to add the chosen skill.</p><p>Update the Class skills
      section of the Details tab of this trait to reflect your
      choice.</p><p>Update the target of the Change on the Changes tab of this
      trait to reflect your choice.</p>
    value: >-
      <p><em>You were raised among or have spent time with a group of Varisian
      nomads, whether travelers, Sczarni criminals, or entertainers, and have
      learned their ways.</em></p><p><strong>Requirements</strong>: <span
      style="text-decoration:underline" data-tooltip="Vast, sparsely populated,
      region in northwest Avistan"><span
      style="text-decoration:underline">Varisia</span></span></p><p><strong>Benefits</strong>:
      Choose one of the following skills: Perform (choose one type), Profession
      (fortuneteller), or Sleight of Hand. You gain a +1 trait bonus on this
      skill, and it is always a class skill for you.</p>
