name: Killer
system:
  description:
    instructions: >-
      <p>Add <code>if(eq(@critCount, 1), @action.ability.critMult)[Trait]</code>
      to weapon's Critical Damage Bonus Formula.</p>
    value: >-
      <p><em>You made your first kill at a very young age and found the task of
      war or murder to your liking. You either take particular pride in a
      well-placed blow, or vile pleasure in such a strike as you twist the blade
      to maximize the pain.</em></p><p><strong>Benefits</strong>: You deal
      additional damage equal to your weapon's critical hit modifier when you
      score a successful critical hit with a weapon; this additional damage is
      added to the final total, and is not multiplied by the critical hit
      multiple itself. This extra damage is a trait bonus.</p><hr />
