  description:
    instructions: >-
      <ol><li><p>Select three Knowledge skills when you take this
      trait.</p></li><li><p>Update the targets of the 3 untargeted changes on
      the Changes tab of this trait to reflect your
      choices.</p></li><li><p>Select one Knowledge skill, it need not be one of
      the 3 previously selected.</p></li><li><p>Update the target of the Context
      note on the changes tab of this trait to reflect this
      choice.</p></li></ol>
    value: >-
      <p><em>When you awake with nothing but hazy memories, you begin carefully
      cataloging your thoughts to determine the reasons for your condition and
      where you might be. This comforts you, and you know deep down that you
      have always relied on your ordered mind and pragmatic approach to face
      challenges. You use this focus and sensibility to your advantage as you
      investigate your current dire
      situation.</em></p><p><strong>Benefits</strong>: Choose three Knowledge
      skills. You gain a +1 trait bonus on Knowledge checks of these kinds and
      on concentration checks. In addition, choose one Knowledge skill. When
      researching, you are considered to have Skill Focus for that Knowledge
      skill when determining what die you roll to reduce a library’s knowledge
      points (kp).</p>
