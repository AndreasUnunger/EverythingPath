  description:
    value: >-
      <p><em>You belong to a particular faith, and your religious leaders see
      you as a mortal aspect of their deity. You are treated with respect and
      graciousness whenever you visit a temple of your
      faith.</em></p><p><strong>Requirements</strong>:
      Aasimar</p><p><strong>Benefits</strong>: You receive a +1 trait bonus on
      Diplomacy checks when interacting with ordained members of your religion,
      and once per week you can request aid from a temple of your faith. The GM
      has final say in what sort of aid you can reasonably request, but in
      general you may ask for the casting of a 1st-level spell or for a
      non-magical item worth 50 gp or less.</p>
