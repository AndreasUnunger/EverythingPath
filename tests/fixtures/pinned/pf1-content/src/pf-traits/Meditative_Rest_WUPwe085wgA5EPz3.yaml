name: Meditative Rest
system:
  contextNotes:
    - target: spellEffect
      text: >-
        If you cast spells during the first time you are interrupted during your
        rest, you don’t count these against your daily limit of spells when you
        wake and prepare spells provided the interruption lasts no more than 15
        minutes.
  description:
    value: >-
      <p><strong>Benefits</strong>: When you rest, you ignore the first time you
      are interrupted during that rest for the purposes of determining how long
      you need to rest in full to regain the capacity to regain spells, provided
      the interruption lasts no more than 15 minutes. If you cast spells during
      this interruption, you don’t count these against your daily limit of
      spells when you wake and prepare spells.</p>
