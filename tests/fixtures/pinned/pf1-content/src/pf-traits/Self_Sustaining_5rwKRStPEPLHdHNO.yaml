name: Self-Sustaining
system:
  description:
    instructions: >-
      <p>When you add the spell to the spellbook, you can adjust the "0/0"
      display to be "1/1", change the "Casts Per Day Used" formula to 1, then
      change the spellbook's spell slots to match.</p>
    value: >-
      <p><em>As a follower of Razmir, the Prophecies of Kalistrade, or some
      other tradition that preaches self-reliance, you make a point of not
      seeking divine aid for minor
      matters.</em></p><p><strong>Benefits</strong>: When you gain this trait,
      choose one of the following 0-level spells: <em>create water</em>,
      <em>mending</em>, <em>purify food and drink</em>, or <em>stabilize</em>.
      You can cast this spell once per day as a spell-like ability, using your
      character level as your caster level. Once chosen, this selection can’t
      change.</p>
