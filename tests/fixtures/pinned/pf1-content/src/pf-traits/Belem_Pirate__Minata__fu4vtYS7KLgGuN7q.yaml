  description:
    instructions: >-
      <p>Select Knowledge (geography) or Profession (sailor) when you take this
      trait.</p><p>Update the Skills tab of your Actor to add the Profession
      (sailor) skill.</p><p>Update the Class skills section of the Details tab
      of this trait to reflect your choice.</p><p>Update the target of the
      change on the Changes tab of this trait to reflect Profession (sailor)
      .</p>
    value: >-
      <p><em>The hidden coves and bays of the island of </em><span
      style="text-decoration:underline" data-tooltip="Belem (pronounced BEL-em)
      is the largest island in the Tengah Pulu region of the Wandering Isles of
      Minata."><em><span
      style="text-decoration:underline">Belem</span></em></span><em> have been
      your home throughout most of your career as a pirate, and the winding
      waterways of Minata have trained you well in the art of
      sailing.</em></p><p><strong>Requirements</strong>: <span
      style="text-decoration:underline" data-tooltip="Massive archipelago
      located on the far southeastern edge of the continent of Tian Xia."><span
      style="text-decoration:underline">Minata</span></span></p><p><strong>Benefits</strong>:
      You gain a +1 trait bonus on Knowledge (geography) checks and Profession
      (sailor) checks, and one of these skills becomes a class skill for
      you.</p>
