name: Wicked Leader
system:
  contextNotes:
    - target: chaChecks
      text: +[[1]] Trait bonus vs evil creatures
  description:
    value: >-
      <p><strong>Benefits</strong>: You gain a +1 trait bonus on Charisma checks
      against evil creatures. If you select the
      @UUID[Compendium.pf1.feats.Item.R3a1OV18RwDJftvq]{Leadership} feat or the
      Vile Leadership feat at any point when you meet the prerequisites for that
      feat, you can recruit a cohort who is up to 1 level lower than you
      (instead of the normal requirement that your cohort must be 2 or more
      levels lower than you are) as long as your cohort is evil.</p>
