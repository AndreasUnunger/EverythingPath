name: Power of Suggestion
system:
  contextNotes:
    - target: skill.blf
      text: >-
        Make observers believe that an object in your possession is actually a
        different object entirely. The DC for the check is 20 for items of a
        similar size, shape, and color (such as a glaive and a quarterstaff).
        Items of a different shape, size, or color raise the DC by 5 for each
        dissimilar aspect, or more if the dissimilarity is extreme. This
        deception lasts 1 minute; if the item is still in view, the observers
        may recognize their error unless you make another bluff check.
  description:
    value: >-
      <p><em>People trust your words over their own
      eyes.</em></p><p><strong>Benefits</strong>: You may make a Bluff check to
      make observers believe that an object in your possession is actually a
      different object entirely. The DC for the check is 20 for items of a
      similar size, shape, and color (such as a glaive and a quarterstaff).
      Items of a different shape, size, or color raise the DC by 5 for each
      dissimilar aspect, or more if the dissimilarity is extreme. This deception
      lasts 1 minute; if the item is still in view, the observers may recognize
      their error unless you make another bluff check.</p>
