      <p><em>You grew up in a culture where the touch of totem spirits was felt
      in everyday life, their subtle urgings constantly guiding you and keeping
      you safe. As a result, you learned quickly to ask for their help when
      trouble arises.</em></p><p><strong>Benefits</strong>: Once per day, you
      may call upon your totem’s wisdom as a standard action. You gain the
      benefits of
      <em>@UUID[Compendium.pf1.spells.Item.o8ds5jtvf0hf92dw]{guidance}</em>,
      except that the granted competence bonus is equal to half your character
      level (minimum +1). This is a supernatural ability.</p>
