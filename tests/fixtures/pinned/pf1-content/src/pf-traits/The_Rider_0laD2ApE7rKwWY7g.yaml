      <p><em>You are born under the auspice of the mounted caravan guard, whose
      very presence deters danger.</em></p><p><strong>Requirements</strong>: 14
      Desnus - 20 Sarenith</p><p><strong>Benefits</strong>: Once per day, when
      you succeed at a Ride check, you can attempt an immediate Intimidate check
