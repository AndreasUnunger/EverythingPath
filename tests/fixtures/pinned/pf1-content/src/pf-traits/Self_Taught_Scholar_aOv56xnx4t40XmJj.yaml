  description:
    value: >-
      <p><em>Being self-taught has made it necessary for you to scour all
      documentation you can get your hands
      on.</em></p><p><strong>Benefits</strong>: You gain a +1 trait bonus on
      Linguistics checks to decipher unfamiliar languages, and Linguistics is
      always a class skill for you. In addition, you gain a +1 trait bonus on
      Spellcraft checks made to decipher the writing on a scroll.</p>
