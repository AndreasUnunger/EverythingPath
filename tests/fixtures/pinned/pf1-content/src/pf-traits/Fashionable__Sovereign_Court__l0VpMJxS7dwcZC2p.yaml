  description:
    instructions: >-
      <p>Select Bluff or Diplomacy or Sense Motive when you take this
      trait.</p><p>Update the Class skills section of the details tab of this
      trait to reflect your choice.</p>
    value: >-
      <p><em>You spent your formative years as a young blade in Oppara and
      learned the ins and outs of using fashion to improve your relations with
      others.</em></p><p><strong>Requirements</strong>: Sovereign
      Court</p><p><strong>Benefits</strong>: So long as you are wearing clothing
      and jewelry worth more than 80 gp, you gain a +1 trait bonus on Bluff,
      Diplomacy, and Sense Motive checks. One of these skills (your choice)
      becomes a class skill for you.&nbsp;</p><hr />
