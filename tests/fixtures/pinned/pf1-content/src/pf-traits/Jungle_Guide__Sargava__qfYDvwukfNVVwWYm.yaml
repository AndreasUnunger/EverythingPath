      west coast of Garund achieved fragile independence in 4660 AR."><span
      style="text-decoration:underline">Sargava</span></span></p><p><strong>Benefits</strong>:
      You gain a +1 trait bonus on Handle Animal checks, and a +1 trait bonus on
      Survival checks in jungle terrain. One of these skills is a class skill
      for you.</p><div><hr /></div>
