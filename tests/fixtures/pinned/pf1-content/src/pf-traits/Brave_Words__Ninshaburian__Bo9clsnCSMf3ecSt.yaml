  description:
    value: >-
      <p><em>You inherit your forebears’ ability to fight off terror with
      bragging or insults.</em></p><p><strong>Requirements</strong>: <span
      style="text-decoration:underline"><span
      style="text-decoration:underline">Ninshabur</span></span>ian</p><p><strong>Benefits</strong>:
      As a swift action, when you have the
      @UUID[Compendium.pf1.pf1e-rules.JournalEntry.NSqfXaj4MevUR2uJ.JournalEntryPage.uqpJ7ZMnWF5qjOTl]{Frightened}
      condition, you can function as if you only have the
      @UUID[Compendium.pf1.pf1e-rules.JournalEntry.NSqfXaj4MevUR2uJ.JournalEntryPage.XxLUswkCuXnXmA5T]{Shaken}
      condition for 1 round by shouting at the source of your fear. You must be
      able to see the source of the fear condition. You can use this trait only
      once per fear effect. This trait grants no benefits against the shaken or
      @UUID[Compendium.pf1.pf1e-rules.JournalEntry.NSqfXaj4MevUR2uJ.JournalEntryPage.nGTsTfpWcJTTU3rk]{Panicked}
      conditions.</p>
