name: Paraheen Weaponsmith (Qadira)
system:
  contextNotes:
    - target: skill.crf
      text: >-
        +[[1]] Trait bonus to create magical armor, shields, or weapons and you
        treat your caster level as 1 higher for purposes of creating magical
        weapon.
    - target: skill.spl
      text: >-
        You treat your caster level as 1 higher for purposes of creating magical
        weapon.
  description:
    value: >-
      <p><em>You are a descendant of a long line of skilled dwarven weapon
      makers or have apprenticed under such artisans. Either way, you learned
      their long-held secrets relating to the production of magical arms and
      armor.</em></p><p><strong>Requirements</strong>: <span
      style="text-decoration:underline" data-tooltip="Westernmost province of
      the Padishah Empire of Kelesh, southeastern most nation in Avistan, on the
      Inner Sea."><span
      style="text-decoration:underline">Qadira</span></span></p><p><strong>Benefits</strong>:
      You treat your caster level as 1 higher for purposes of creating magical
      weapons, and gain a +1 trait bonus on Craft checks to create magical
      armor, shields, or weapons.</p>
