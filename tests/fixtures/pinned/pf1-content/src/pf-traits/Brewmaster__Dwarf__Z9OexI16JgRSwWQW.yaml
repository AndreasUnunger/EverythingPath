  description:
    instructions: >-
      <p>Update the Skills tab of your Actor to add the Profession (brewer) and
      Craft (alchemy) skills.</p><p>Update the target of the changes on the
      Changes tab of this trait to reflect Profession (brewer) and Craft
      (alchemy).</p>
    value: >-
      <p><em>Your family brought the secrets of dwarven brewing to non-dwarven
      lands. Though this has given you skill in the brewer’s craft, it’s also
      earned you distrust among dwarven
      purists.</em></p><p><strong>Requirements</strong>:
      Dwarf</p><p><strong>Benefits</strong>: You gain a +1 trait bonus on
      Profession (brewer) and Craft (alchemy) checks, but you take a –1 penalty
      on Diplomacy checks made to change the attitude of dwarves who know that
      your family has shared brewing secrets with non-dwarves.</p>
