name: Clumsy Slave (Cheliax, Katapesh; Halfling)
system:
  description:
    value: >-
      <p><em>As a former slave, you learned how to conceal your malice toward
      your owner behind a facade of
      clumsiness.</em></p><p><strong>Requirements</strong>: <span
      data-tooltip="Cheliax is a powerful nation in southwestern Avistan;
      Katapesh is a nation on the eastern coast of Garund"><span
      style="text-decoration:underline">Cheliax, Katapesh</span></span>;
      Halfling</p><p><strong>Benefits</strong>: The first time you attack
      someone with an attack that deals nonlethal damage, your target must make
      a Sense Motive opposed by your Bluff check minus the damage dealt to
      realize you actually intended to harm him; failure means he believe the
      injury was an accident on your part instead (though he may still want to
      punish you for it).</p>
