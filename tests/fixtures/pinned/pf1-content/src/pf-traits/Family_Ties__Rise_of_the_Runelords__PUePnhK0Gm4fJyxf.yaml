  description:
    value: >-
      <p><em>While not ethnically a Varisian, you have been raised among
      Varisians and they consider you one of their own. Furthermore, you managed
      to get in good with a group of Sczarni and consider them your new family.
      After being run out of the last place your Sczarni family camped, you
      tracked down a friend of the family in Sandpoint—a ruthless thug named
      Jubrayl Vhiski at the Fatman’s
      Feedbag.</em></p><p><strong>Benefits</strong>: During your time with the
      Sczarni, you learned a few tricks of the trade. You gain a +1 trait bonus
      on Knowledge (local) checks and Knowledge (local) is always a class skill
      for you. In addition, you begin play able to speak and read Varisian.</p>
