  description:
    value: >-
      <p><em>While enslaved in the City of Brass, you watched too many of your
      friends fall victim to efreet tempers. Now, you help others avoid thorny
      situations whenever you are
      able.</em></p><p><strong>Requirements</strong>: <span
      style="text-decoration:underline" data-tooltip="City of Brass, aka Medina
      Mudii'a and Fommok Madinah,  is the capital of the nation of ifrit genies
      and is located on the Plane of Fire."><span
      style="text-decoration:underline">City of
      Brass</span></span></p><p><strong>Benefits</strong>: Any time you
      successfully use the aid another action to help an ally succeed at a Bluff
      or Escape Artist check, you add a +3 bonus to this check (rather than a +2
      bonus).</p>
