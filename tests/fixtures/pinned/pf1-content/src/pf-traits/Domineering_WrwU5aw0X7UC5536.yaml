name: Domineering
system:
  description:
    instructions: <p>Increase one enchantment spell's DC by 1.</p>
    value: >-
      <p><em>When you were young, you attracted a group of devoted companions
      thanks to your impressive talent, and the experience inspired in you a
      powerful selfassurance and air of superiority. Your confidence is so
      strong that others feel naturally compelled to follow your
      commands.</em></p><p><strong>Benefits</strong>: Choose one 1st-level
      enchantment spell you are capable of casting. The DC of that spell
      increases by 1.</p><p><strong>Suggested
      Characters</strong></p><p>Chelaxians, Irriseni, Mwangi.</p>
