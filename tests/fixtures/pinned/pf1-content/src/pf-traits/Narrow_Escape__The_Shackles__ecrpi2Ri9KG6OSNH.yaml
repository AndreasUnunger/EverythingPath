  description:
    value: >-
      <p><em>You were captured by kuru cannibals and nearly devoured in a
      sacrificial ritual. At the last second you wriggled free from your bonds
      and escaped into the jungle. Your narrow escape has left you with a
      paranoid fear of capture. You secretly conduct regular sessions in which
      you slip out of different types of
      knots.</em></p><p><strong>Requirements</strong>: <span
      style="text-decoration:underline" data-tooltip="The Shackles is an
      extended archipelago off the coast of western Garund, directly to the
      south of the never-ending hurricane known as the Eye of Abendego"><span
      style="text-decoration:underline">The
      Shackles</span></span></p><p><strong>Benefits</strong>: You gain a +1
      trait bonus on Escape Artist checks, and Escape Artist becomes a class
      skill for you.</p>
