  description:
    value: >-
      <p><em>Though you were raised as a member of one of Magnimar's various
      Sczarni gangs, you never fit in with the rest of your settled,
      metropolitan brethren. The Pathfinder Society in particular recognized
      your wanderlust and potential as an agent, and on more than one occasion
      you impressed or bamboozled their agents with your street smarts and
      finesse. Over the years, you fell out of favor with the Sczarni, and
      eventually left to pursue interests outside of simple banditry, though you
      still remember the lessons your criminal relations taught
      you.</em></p><p><strong>Benefits</strong>: You gain a +2 trait bonus on
      Bluff checks to pass hidden messages. Also, anytime you deliver a coup de
      grace, you deal an additional 1d6 points of damage.</p>
