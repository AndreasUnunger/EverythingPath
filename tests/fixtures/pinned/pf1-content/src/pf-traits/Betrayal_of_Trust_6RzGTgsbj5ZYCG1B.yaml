  description:
    value: >-
      <p><strong>Benefits</strong>: If you have the trait
      @UUID[Compendium.pf-content.pf-traits.Item.7P4hpXJPrQz1BXW1]{Tight Bonds},
      you swap it for this trait at the moment you decide to betray the
      relationship. (You need not wait until you have actually committed an act
      of betrayal.) You gain a +2 trait bonus on Bluff checks, increasing to +4
      on checks specifically made to conceal or deny your infidelity.</p><p>It
      is possible to regain the Tight Bonds trait, for either the same or a
      different relationship, but it requires substantial in-character work. The
      GM decides when this trait reverts back to the original one.</p>
