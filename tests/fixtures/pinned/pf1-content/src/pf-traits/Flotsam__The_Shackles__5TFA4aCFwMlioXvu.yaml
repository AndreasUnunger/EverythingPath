  description:
    value: >-
      <p><em>You were one of only a few that survived the destruction of the
      merchant vessel Vantage. Your crew was more than able to hold off the
      blundering pirate attackers, but their red dragon ally proved too much for
      your defenses. As you watched the sharks and eels feast on the bodies of
      your fallen comrades, you vowed to see Aashaq
      slain.</em></p><p><strong>Requirements</strong>: <span data-tooltip="The
      Shackles is an extended archipelago off the coast of western Garund,
      directly to the south of the never-ending hurricane known as the Eye of
      Abendego"><span style="text-decoration:underline">The
      Shackles</span></span></p><p><strong>Benefits</strong>: You gain a +2
      bonus on Reflex saves against spells and effects with the fire
      descriptor.</p>
