  description:
    value: >-
      <p><em>Though others think you merely waste time, you know that those
      extra flourishes and ceremonial touches actually make your work just that
      much better.</em></p><p><strong>Requirements</strong>: Halfling; <span
      style="text-decoration:underline" data-tooltip="Ancient empire in decline
      in southeast Avistan"><span
      style="text-decoration:underline">Taldor</span></span></p><p><strong>Benefits</strong>:
      You gain a +1 trait bonus on Acrobatics, Diplomacy, Handle Animal,
      Intimidate, Perform, and Ride checks with class skills if you spend twice
      as long as it normally takes to make that check.</p>
