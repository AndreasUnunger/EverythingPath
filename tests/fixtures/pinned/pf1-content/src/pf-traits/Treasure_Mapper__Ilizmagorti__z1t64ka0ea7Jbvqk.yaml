  description:
    instructions: >-
      <p>Update the Skills tab of your Actor to add Profession
      (sailor).</p><p>Update the target of the context note on the Changes tab
      of this trait to Profession (sailor).</p><p>Select Survival or Profession
      (sailor) when you take this trait.</p><p>Update the Class skills section
      of the details tab of this trait to reflect your choice.</p>
    value: >-
      <p><em>You’ve spent a great deal of time hunting down and following
      treasure maps—most false, but a few with legitimate
      information.</em></p><p><strong>Requirements</strong>: <span
      data-tooltip="Ilizmagorti, aka Scum Tide City, aka Black Pearl of the
      Tropics, is only settlement of any size on Mediogalti Island"><span
      style="text-decoration:underline">Ilizmagorti</span></span></p><p><strong>Benefits</strong>:
      You gain a +2 bonus on Survival or Profession (sailor) checks made to
      navigate using a map or chart, and one of them becomes a class skill for
      you.</p>
