    value: >-
      <p><em>Digging tunnels near a body of rushing water has taught you how to
      use water as a means of travel and escape. Others whisper that you must
      have been born with webbed feet.</em></p><p><strong>Requirements</strong>:
      <span style="text-decoration:underline" data-tooltip="Immense series of
      caverns, vaults, and passages that can be found beneath the surface of all
      of Golarion's continents"><span
      style="text-decoration:underline">Darklands, usually under
      rivers</span></span></p><p><strong>Benefits</strong>: You gain a +1 trait
      bonus on Swim checks, and Swim is always a class skill for you. You
      increase the speed of any raft, barge, keelboat, or rowboat you pilot by 4
      miles per day (1/2 mile per hour).</p>
