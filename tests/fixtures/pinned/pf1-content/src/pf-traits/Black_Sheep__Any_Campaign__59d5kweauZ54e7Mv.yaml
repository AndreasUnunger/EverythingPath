  description:
    value: >-
      <p><em>You were born and raised in town. You know many of the region’s
      secrets and the locals already know who you are. You aren’t quite hated in
      town, but folk seem to think you’re a troublemaker and a bastard and not
      to be trusted. The town’s tougher folk respect you, but the law-abiding
      citizens don’t.</em></p><p><strong>Benefits</strong>: You gain a +1 trait
      bonus on Knowledge (local) checks, and Knowledge (local) is a class skill
      for you. In addition, you can choose any one notorious citizen from below
      as an ally; depending on the person you pick, you’ll get different
      benefits.</p><p><strong>Notorious
      Citizens</strong></p><p><strong>Apothecary</strong></p><p><em>Everyone
      suspects the sweaty, shifty-eyed apothecary sells poisons from his
      cluttered, acrid smelling wreck of a shop. You’re one of the few in town
      who know this for a fact.</em></p><p>You start the game with 400 gp worth
      of poison, and the apothecary will continue to sell you poison as long as
      you don’t spread the word.</p><p><strong>Bitter
      Nobleman</strong></p><p><em>A local unscrupulous family was hit hard
      recently, revealing criminal ties that damaged its reputation as well. One
      noble is eager to rebuild his presence in town, and you’re one of the ones
      he’s selected as an agent.</em></p><p>Choose one of the following skills:
      Bluff, Sleight of Hand, or Stealth. Your work for the family gives you a
      +1 trait bonus on that skill, and it is always a class skill for
      you.</p><hr /><p><br />Usage</p><ol><li><p>Select Apothecary or Bitter
      Nobleman when you take this trait.</p></li><li><p>If you select
      Apothecary, you may add the permitted amount of poison to your inventory,
      then delete the untargeted change on the changes tab.</p></li><li><p>If
      you select Bitter Nobleman, Choose one of the optional skills: Bluff,
      Sleight of Hand, or Stealth; Update the target of the change on the
      Changes tab of this trait to reflect your choice and Update the Class
      skills section of the Details tab of this trait to reflect this same
      choice.</p></li></ol>
