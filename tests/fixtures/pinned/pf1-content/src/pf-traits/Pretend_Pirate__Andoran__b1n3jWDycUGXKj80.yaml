name: Pretend Pirate (Andoran)
system:
  contextNotes:
    - target: skill.dis
      text: +[[2]] Trait bonus to disguise yourself as a pirate or merchant sailor.
  description:
    value: >-
      <p><em>You enjoy luring slave ships to you. Sometimes you run a pirate
      flag to lull criminals into a false sense of security; other times you
      disguise yourself as a merchant
      ship.</em></p><p><strong>Requirements</strong>: <span
      style="text-decoration:underline" data-tooltip="Democratic nation on the
      northern coast of the Inner Sea."><span
      style="text-decoration:underline">Andoran</span></span></p><p><strong>Benefits</strong>:
      You gain a +2 bonus on Disguise checks made to disguise yourself as a
      pirate or merchant sailor. In addition, you can take 5 minutes to alter
      your ship’s appearance to add +2 to the DC of any check made to identify
      your ship’s allegiance or purpose.</p>
