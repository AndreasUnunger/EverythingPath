    value: >-
      <p><em>During your time on the Plane of Air, you visited the libraries of
      </em><span data-tooltip="Political and religious capital city of the
      Jaathoom Empire on the Plane of Air."><em><span style="text-decoration:
      underline;">Armun Kelisk</span> </em></span><em>frequently and voraciously
      read the tomes therein.</em></p><p><strong>Requirements</strong>: Plane of
      Air</p><p><strong>Benefits</strong>: You gain a +1 trait bonus on
      Knowledge (planes) checks and checks made with one other Knowledge skill
      of your choice. This bonus increases to +3 when used to identify a
      creature with the air subtype. Knowledge (planes) becomes a class skill
      for you, and your bonus language options at 1st level include Auran. This
      choice is in addition to the bonus languages available to the character
      because of her race.</p><hr>
