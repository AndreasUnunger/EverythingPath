  description:
    value: >-
      <p><em>You are trained in using your cloak to disguise your body and
      deceive your enemies.</em></p><p><strong>Benefits</strong>: While wearing
      a cloak and using an
      @UUID[Compendium.pf1.weapons-and-ammo.Item.ioPvNyyv6L4hv0aW]{Aldori
