name: Natural-Born Leader (UC)
system:
  description:
    value: >-
      <p><em>You've always found yourself in positions where others look up to
      you as a leader, and you can distinctly remember an event from your early
      childhood where you led several other children to accomplish a goal that
      each of you individually could not.</em></p><p><strong>Benefits</strong>:
      All cohorts, followers, or summoned creatures under your leadership gain a
      +1 morale bonus on Will saves to avoid mind-affecting effects. If you ever
      take the @UUID[Compendium.pf1.feats.Item.R3a1OV18RwDJftvq]{Leadership}
      feat, you gain a +1 trait bonus to your Leadership score.</p>
