name: Outsider Ties
system:
  contextNotes:
    - target: spellEffect
      text: >-
        When you summon an outsider of your chosen subtype, the summoned
        creature gains a number of temporary hit points equal to the level of
        the spell.
  description:
    value: >-
      <p><em>An outsider visited you at a young age, and you have had a
      significant affinity with that type of outsider ever
      since.</em></p><p><strong>Benefits</strong>: Choose a subtype of outsider,
      such as angel or elemental. When you summon an outsider of that subtype
      via <em>summon monster</em>, <em>planar ally</em>, <em>planar
      binding</em>, or similar spells and abilities, the summoned creature gains
      a number of temporary hit points equal to the level of spell used to
      summon it.</p>
