  description:
    instructions: >-
      <p>Select Bluff or Disguise when you take this trait.</p><p>Update the
      Class skills section of the Details tab of this trait to reflect your
      choice.</p>
    value: >-
      <p><em>You have lived a double life since your youth, perhaps to avoid
      persecution for your true identity or in service to an enemy of the people
      or group associated with your cover
      identity.</em></p><p><strong>Benefits</strong>: You can always take 10 on
      Bluff and Disguise checks to assume and maintain your cover identity.
      Bluff or Disguise (your choice) is a class skill for you.</p>
