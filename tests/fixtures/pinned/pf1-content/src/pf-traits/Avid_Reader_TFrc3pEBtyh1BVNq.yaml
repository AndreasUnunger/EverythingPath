  description:
    value: >-
      <p><em>As a youth, you voraciously consumed books and scrolls provided by
      a member of an adventurer’s guild or a learned organization like the
      Pathfinder Society, and you have internalized these stories of bold
      adventurers</em></p><p><strong>Benefits</strong>: Choose one Knowledge
      skill. You can always choose to take 10 on checks with the chosen
      Knowledge skill, even when distracted or
      threatened.</p><p><strong>Suggested Characters</strong></p><p>Osirians,
      Pathfinders, Taldans</p>
