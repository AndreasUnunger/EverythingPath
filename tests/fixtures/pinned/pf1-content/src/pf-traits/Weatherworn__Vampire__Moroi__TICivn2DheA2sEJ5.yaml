      <p><em>Lairing in desolate mountains or on coastal cliff tops has taught
      you to deal with the effects of strong
      winds.</em></p><p><strong>Requirements</strong>: Moroi Vampire
      Heritage</p><p><strong>Benefits</strong>: You gain a +2 trait bonus
