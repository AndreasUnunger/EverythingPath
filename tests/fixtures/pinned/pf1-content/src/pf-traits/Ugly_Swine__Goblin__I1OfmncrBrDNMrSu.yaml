      keep a low profile. However, if examined closely, your goblin origins are
      revealed.</em></p><p><strong>Requirements</strong>:
      Goblin</p><p><strong>Benefits</strong>: You gain a +2 trait bonus on
      Disguise checks, and Disguise is a class skill for you.</p>
