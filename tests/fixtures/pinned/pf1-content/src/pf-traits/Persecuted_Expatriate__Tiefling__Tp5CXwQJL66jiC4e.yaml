      formula: '1'
      type: trait
  description:
    instructions: >-
      <p>Update the Class skills section of the Details tab of this trait to
      reflect the skill associated above with your Heritage.</p><p>Update the
      target of the change on the Changes tab of this trait to reflect the skill
      associated above with your Heritage.</p>
    value: >-
      <p><em>You were born in a nation that persecuted you for your heritage.
      Although you were under terrible duress, you escaped either with the aid
      of family or by your own
      cunning.</em></p><p><strong>Requirements</strong>:
      Tiefling</p><p><strong>Benefits</strong>: You gain a +1 bonus on one skill
      depending on your fiendish heritage: asura (Knowledge [local]), daemon
      (Sleight of Hand), demodand (Intimidate), demon (Perception), devil (Sense
      Motive), div (Diplomacy), kyton (Escape Artist), oni (Disguise), qlippoth
      (Survival), or rakshasa (Sense Motive). That skill is always a class skill
      for you.</p>
