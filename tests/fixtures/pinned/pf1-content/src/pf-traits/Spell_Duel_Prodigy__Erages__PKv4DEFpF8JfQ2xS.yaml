      <p><em>You’ve participated in many spell duels during your time at Erages
      Academy, and you’ve developed a keen talent for identifying magical
      arts.</em></p><p><strong>Requirements</strong>: <span
      style="text-decoration:underline" data-tooltip="Erages is a small fishing
      community located on the shore of Lake Encarthan in the elven nation of
      Kyonin. Erages' population is almost entirely half-elves who live in
      virtual exile from the rest of the country."><span
      style="text-decoration:underline">Erages</span></span></p><p><strong>Benefits</strong>:
      You gain a +2 trait bonus on Spellcraft checks to identify a spell as it
      is being cast and on dispel checks to counterspell a spell.</p>
