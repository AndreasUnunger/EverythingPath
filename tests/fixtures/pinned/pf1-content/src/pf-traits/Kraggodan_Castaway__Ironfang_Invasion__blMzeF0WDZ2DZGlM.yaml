name: Kraggodan Castaway (Ironfang Invasion)
system:
  contextNotes:
    - target: conChecks
      text: >-
        Whenever you are underground you automatically stabilize if brought
        below 0 hit points, and if reduced to 0 hit points (or you are stable
        and conscious when below 0 hit points) you do not take the usual 1 point
        of damage disabled characters take from performing a standard action.
        This revitalizing effect fades after 4 consecutive days spent
        underground, but returns after you spend more than a week above ground
        again.
  description:
    instructions: >-
      <p>Select one (1) of Common, Hallit, Varisian, or Undercommon when you
      take this trait.</p><p>Update the Granted Proficiencies&gt;Languages
      section of the details tab of this trait to reflect this choice.</p>
    value: >-
      <p><em>You hail from the dwarven Sky Citadel of Kraggodan in southern
      Nirmathas and have spent the past several years among the surface people
      serving as a mercenary in the war, trading with Nirmathi towns, or simply
      seeing the surface world. Molthune’s recent siege of Kraggodan has
      squelched any hopes you had of returning home, and now you struggle to
      find a home on the surface.</em></p><p><strong>Requirements</strong>:
      Dwarf</p><p><strong>Benefits</strong>: Thanks to your travels, you gain
      one of the following as a bonus language: Common, Hallit, Varisian, or
      Undercommon. In addition, your homesickness means time spent underground
      revitalizes your spirits; whenever you are underground—either in natural
      caverns or an artificial complex—you automatically stabilize if brought
      below 0 hit points, and if reduced to 0 hit points (or you are stable and
      conscious when below 0 hit points) you do not take the usual 1 point of
      damage disabled characters take from performing a standard action. This
      revitalizing effect fades after 4 consecutive days spent underground, but
      returns after you spend more than a week above ground again.</p>
