  description:
    value: >-
      <p><em>As a child, you learned the power of a simple expression of faith
      in another when you gave a hero the inspiration to fight on in the face of
      terrible odds and save you from
      danger.</em></p><p><strong>Benefits</strong>: As a standard action, you
      can speak words of encouragement to grant a +1 morale bonus to an ally
      within 30 feet who can see and hear you.</p><p>The ally can use this bonus
      on any d20 roll of her choice before the start of your next
      turn.</p><p>You cannot use this trait to grant a bonus to yourself or to
      an ally who has already benefited from this trait within the last 24
      hours.</p><p><strong>Suggested Characters</strong></p><p>Eagle Knights,
      Iomedaeans, Mendevian crusaders.</p>
