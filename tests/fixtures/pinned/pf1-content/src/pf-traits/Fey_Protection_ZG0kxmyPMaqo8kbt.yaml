  description:
    value: >-
      <p><em>Your birth brought an unexpected guest to your parents’ home: a
      helpful fey who prophesied about your future and gave you a magical gift
      in exchange for your parents’ hospitality, a cup of milk, and a drop of
      your blood.</em></p><p><strong>Benefits</strong>: You gain a +1 trait
      bonus to AC against attacks of opportunities made by fey and a +1 trait
      bonus on saving throws against the effects of fey
      creatures.</p><p><strong>Suggested Characters</strong></p><p>Drumans,
      Eldest worshipers, Ulfen.</p>
