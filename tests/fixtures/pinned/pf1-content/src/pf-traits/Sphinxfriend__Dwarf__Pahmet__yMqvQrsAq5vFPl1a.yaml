  description:
    value: >-
      <p><em>You were raised near the lair of a proud sphinx. Well known for
      their wisdom, sphinxes are greatly respected by your people, and in times
      of uncertainty and crisis, their counsel has been invaluable. When you
      came of age, you were chosen to be the emissary between your settlement
      and the sphinx. Luckily for you, the proud creature enjoyed your company,
      and in addition to bartering for information, you learned to enjoy the
      riddles of your noble friend.</em></p><p><strong>Requirements</strong>:
      Pahmet Dwarf Heritage</p><p><strong>Benefits</strong>: As a result of your
      experiences, you gain a +1 trait bonus on Diplomacy checks, Linguistics
      skill checks made to decipher writing in an unfamiliar language, and Sense
      Motive checks made to discern secret messages.</p>
