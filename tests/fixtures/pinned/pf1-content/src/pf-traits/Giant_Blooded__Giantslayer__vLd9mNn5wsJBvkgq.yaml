name: Giant-Blooded (Giantslayer)
system:
  contextNotes:
    - target: attack
      text: >-
        The penalty on attack rolls for using inappropriately large-sized
        weapons is reduced by half. (see page 140 of core rulebook)
    - target: cmd
      text: >-
        +[[2]] Trait bonus to your CMD against awesome blow combat maneuvers. If
        you’re a dwarf, your stability racial trait applies to awesome blow
        combat maneuvers as well.
  description:
    value: >-
      <p><em>Your family has always been dogged by rumors that a bit of giant
      blood got into the family’s veins at some point. Whether this was through
      alchemical or magical experimentation, or because your
      great-great-grandfather married a giant, it has made you big for your
      race, and may have given you other minor cosmetic features of giants, such
      as flaming red hair, a bluish tinge to your skin, or oversized
      hands.</em></p><p><strong>Benefits</strong>: When you wield a weapon that
      is larger than your size, the penalty on attack rolls for using
      inappropriately sized weapons is reduced by half. In addition, you gain a
      +2 trait bonus to your CMD against awesome blow combat maneuvers. If
      you’re a dwarf, your stability racial trait applies to awesome blow combat
      maneuvers as well.</p>
