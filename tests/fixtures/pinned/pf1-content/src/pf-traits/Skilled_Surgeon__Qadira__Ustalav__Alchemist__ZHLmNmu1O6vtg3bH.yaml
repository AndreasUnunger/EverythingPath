name: Skilled Surgeon (Qadira, Ustalav; Alchemist)
system:
  contextNotes:
    - target: skill.hea
      text: >-
        Whenever you perform surgery or otherwise must deal damage to remove a
        condition or affliction, you roll the damage but use the minimum result
        unless you rolled the maximum result. The amount of hit points or points
        of ability damage restored each day when you provide long-term care is
        increased by 1.
  description:
