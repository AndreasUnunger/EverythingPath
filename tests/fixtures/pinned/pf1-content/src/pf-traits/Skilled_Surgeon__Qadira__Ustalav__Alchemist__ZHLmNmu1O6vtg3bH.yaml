      Avistan, on the Inner Sea. Ustalav is a fog-shrouded nation in central
      Avistan"><span style="text-decoration:underline">Qadira or
      Ustalav</span></span>, or who have lived there for at least 1
      year</p><p><strong>Benefits</strong>: Whenever you perform surgery or
      otherwise must deal damage to remove a condition or affliction, you roll
      the damage but use the minimum result unless you rolled the maximum
      result. The amount of hit points or points of ability damage restored each
      day when you provide long-term care is increased by 1.</p>
