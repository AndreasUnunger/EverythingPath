name: Dualborn (Suli)
system:
  description:
    value: >-
      <p><em>You were not born of a janni—your non-human heritage can instead be
      traced back to some dualistic power between elemental
      realms.</em></p><p><strong>Requirements</strong>:
      Suli</p><p><strong>Benefits</strong>: Choose two energy types other than
      sonic (acid, cold, electricity, or fire). Once made, this choice cannot be
      changed. You gain racial energy resistance only to the energy types you
      choose, and not to others. When using your elemental assault ability, you
      can only sheath your arms in the energy types selected, but you can choose
      to sheath your primary hand with one of the selected energy types and your
      off-hand with the other. Attacks made with each hand (or a weapon held in
      each hand) deal bonus energy damage of the selected type. While wielding a
      two-handed weapon, half of the bonus energy damage is one energy type and
      half is the other.</p>
