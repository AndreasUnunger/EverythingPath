    instructions: >-
      <p>Select one Profession skill when you take this trait.</p><p>Update the
      Skills tab of your Actor to add the chosen skill.</p><p>Update the target
      of the untargeted change on the Changes tab of this trait to reflect your
      choice.</p><p><strong>Special Note</strong></p><p>This is one of three
      versions of this trait. Other versions can be found
      here:</p><p>@UUID[Compendium.pf-content.pf-traits.Item.im0JBzMqeObourHw]{Regional
      Influence - Riddleport
      (Varisia)}</p><p>@UUID[Compendium.pf-content.pf-traits.Item.UNEA8OGKTfw7UdSb]{Regional
      Influence - Korvosa (Varisia)}</p>
    value: >-
      <p><em>Although you live some distance from the city-state your community
      owes fealty to, you’ve been influenced by its sophisticated urban
      ways.</em></p><p><strong>Requirements</strong>:
      Varisia</p><p><strong>Benefits</strong>: Determine the city-state of which
      your home is a holding. You gain a +1 trait bonus on checks with one
      Profession skill and one of the following
      benefits.</p><p><strong>Magnimar</strong></p><p>Gain one random
      @UUID[Compendium.pf-content.pf-items.Item.IbSjz0hXs2E7TwoN]{Varisian Idol}
      (see page 15 of&nbsp;<em>Varisia, Birthplace of Legends</em>).</p>
