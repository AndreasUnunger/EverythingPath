name: Making Good on Promises (Carrion Crown)
system:
  contextNotes:
    - target: allSavingThrows
      text: +[[2]] Trait bonus against fear effects.
  description:
    value: >-
      <p><em>At some point in the past, Professor Lorrimor did you a favor under
      the condition that he would someday call on you to repay it. After he came
      to your aid, however, you never saw nor heard from him again, leaving you
      with a sense of unending anticipation that each day might be the day you
      were asked to return the favor. Yet that day never came, and your fears
      and anxiety about what the professor would call on you to do abated.
      Assuming the old man had either forgotten about you or died, you
      eventually assumed you'd never have to follow through on your end of the
      bargain. When you received word of the professor's death, and that he had
      named you specifically in his will, your dread of what he could possibly
      want from you has grown throughout your entire journey to Ravengro. Years
      of living with the fear and uncertainty of the unclaimed debt to Professor
      Lorrimor have inured you to extreme
      anxiety.</em></p><p><strong>Benefits</strong>: You gain a +2 trait bonus
      on saves against fear effects.</p>
