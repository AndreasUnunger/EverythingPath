name: Educated Druggist (Alchemist)
system:
  description:
    value: >-
      <p><strong>Requirements</strong>: Alchemist healers who hail from <span
      data-tooltip="the hidden city of Osibu, aka the guilded city, is a
      democracy, located deep within the Screaming Jungle of the Mwangi Expanse
      in central Garund"><span
      style="text-decoration:underline">Osibu</span></span>, <span
      data-tooltip="Desert nation on northern coast of Garund, on the Inner
      Sea."><span style="text-decoration:underline">Thuvia</span></span>, <span
      data-tooltip="Tian Xia aka the Dragon Empires is the continent farthest
      from the Inner Sea and home to the Tian peoples."><span
      style="text-decoration:underline">Tian Xia</span></span>, or <span
      data-tooltip="Nation in central Avistan"><span
      style="text-decoration:underline">Ustalav</span></span>, or who have lived
      there for at least 1 year</p><p><strong>Benefits</strong>: Any alchemical
      remedies you administer that provide an alchemical bonus have that bonus
      increased by 1. These remedies also restore 1 hit point to the target in
      addition to their usual effects.</p>
