    instructions: <p>Add context note to corresponding summon spell.</p>
    value: >-
      <p><em>The subtle power of the deep places of the world flows within you,
      and grants you mastery of summoning beings of earth and
      stone.</em></p><p><strong>Requirements</strong>:
      Dwarf</p><p><strong>Benefits</strong>: Any creature you conjure with a
      summon spell that has the earth subtype or a burrow speed gains a +1
