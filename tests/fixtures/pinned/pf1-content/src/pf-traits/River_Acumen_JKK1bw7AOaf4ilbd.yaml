name: River Acumen
system:
  contextNotes:
    - target: skill.sur
      text: +[[2]] Trait bonus to forage for food in or near a river or stream.
    - target: skill.swm
      text: +[[2]] Trait bonus on Swim checks in rivers or streams.
  description:
    value: >-
      <p><em>Your connection with the river and its tributaries has blended with
      your reverence for the gods of the river passages so much so that you seem
      divinely blessed while plying river
      waters.</em></p><p><strong>Benefits</strong>: You gain a +2 trait bonus on
      Swim checks in rivers or streams, and a +2 trait bonus on Survival checks
      to forage for food in or near a river or stream.</p>
