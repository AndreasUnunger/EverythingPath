  description:
    value: >-
      <p><em>You spent much of your youth helping the clergy of your chosen
      faith perform their duties, and learned from them respect for
      authority.</em></p><p><strong>Benefits</strong>: As long as you are acting
      in the service of a liege or leader you recognize as legitimate, you gain
      a +2 trait bonus on saving throws against fear and compulsion
      effects.</p><p><strong>Suggested Characters</strong></p><p>Abadarans,
      Hellknights, Hermeans.</p>
