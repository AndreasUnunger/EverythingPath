  description:
    value: >-
      <p><em>You are used to sailing in the terrible winds that roll out from
      the Eye of Abendego, and can apply the skills you’ve learned to any
      storm.</em></p><p><strong>Requirements</strong>: <span data-tooltip="The
      Shackles is an extended archipelago off the coast of western Garund,
      directly to the south of the never-ending hurricane known as the Eye of
      Abendego"><span style="text-decoration:underline">The
      Shackles</span></span></p><p><strong>Benefits</strong>: You treat wind
      effects as one wind force category less than they actually are, both for
      any personal checks you must make and for any you make to captain or steer
      a ship.</p>
