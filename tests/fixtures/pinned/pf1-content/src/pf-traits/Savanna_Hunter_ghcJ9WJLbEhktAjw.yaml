  description:
    instructions: >-
      <p> In Combat tab; for any shortspear attack, add a Conditional Modifier
      named Savanna Hunter, set its formula to 1, set its type to Trait and
      target to Attack Rolls.</p>
    value: >-
      <p><em>You have been trained to hunt and fight on the open plains since
      birth.</em></p><p><strong>Benefits</strong>: You gain a +1 trait bonus on
      attacks of opportunity attack rolls made with a shortspear, as well as a
      +1 racial bonus on Constitution checks to continue running and avoid
      nonlethal damage from a forced march.</p>
