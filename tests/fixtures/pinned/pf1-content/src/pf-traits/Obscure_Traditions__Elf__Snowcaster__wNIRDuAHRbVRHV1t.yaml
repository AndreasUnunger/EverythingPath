name: Obscure Traditions (Elf; Snowcaster)
system:
  contextNotes:
    - target: ac
      text: >-
        Any character or creature that normally gains a bonus on attack or
        damage rolls against elves (such as a ranger’s favored enemy ability)
        has such a bonus reduced by 1 (minimum 0).
    - target: skill.blf
      text: >-
        Any creature attempting to make a Sense Motive check to determine
        whether you are lying takes a -2 penalty on the check.
    - target: skill.sur
      text: >-
        Any creature attempting to make a Survival check to track you takes a -2
        penalty on the check.
  description:
    value: >-
      <p><em>You confound those who think they know about
      elves.</em></p><p><strong>Requirements</strong>: Snowcaster Elf
      heritage</p><p><strong>Benefits</strong>: Any creature attempting to make
      a Knowledge check about your people, a Sense Motive check to determine
      whether you are lying, or a Survival check to track you takes a –2 penalty
      on the check. Additionally, any character or creature that normally gains
      a bonus on attack or damage rolls against elves (such as a ranger’s
      favored enemy ability) has such a bonus reduced by 1 (minimum 0).</p>
