  description:
    value: >-
      <p><em>You have been exposed to fey magic and know tricks to avoid
      it.</em></p><p><strong>Requirements</strong>: <span data-tooltip="Forest
      in northern Andoran"><span style="text-decoration: underline;">Darkmoon
      Wood</span></span></p><p><strong>Benefits</strong>: Once per day, when you
      fail a saving throw against a fey’s spell-like or supernatural ability,
      you may reroll the save. You must take the second result, even if it is
      worse.</p>
  scriptCalls:
    - _id: h4vbQdtDSzjCkK8b
      category: postUse
      hidden: false
      img: icons/svg/dice-target.svg
      name: Reroll Saving Throw
      type: script
      value: >-
        const content = `
          <div class="flexcol">
            <h3>Rerolling a Saving Throw:</h3>
            <p>Please pick a saving throw to reroll from the buttons below.</p>
          </div>
        `;


        const labels = [game.i18n.localize("PF1.SavingThrowFort"),
        game.i18n.localize("PF1.SavingThrowRef"),
        game.i18n.localize("PF1.SavingThrowWill")];


        async function getAnswer() {
          return Dialog.wait({
            title: `${item.name} – Reroll a Saving Throw`,
            content: content,
            buttons: {
              fort: {
                label: labels[0],
                callback: () => "fort",
              },
              ref: {
                label: labels[1],
                callback: () => "ref",
              },
              will: {
                label: labels[2],
                callback: () => "will",
              }
            },
            default: 'fort',
            close: () => null,
          },
          {
             height: "auto",
             width: 680,
          });
        }


        const answer = await getAnswer();

        if(answer !== null) {
          actor.rollSavingThrow(answer);
        } else {
          ui.notifications.warn(`No answer was selected. Restoring use of "${item.name}".`);
          await item.update({"system.uses.value": 1 });
        }
  subType: trait
  tags:
