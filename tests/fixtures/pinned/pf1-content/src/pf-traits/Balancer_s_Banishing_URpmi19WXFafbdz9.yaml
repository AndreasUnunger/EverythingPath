name: Balancer's Banishing
system:
  contextNotes:
    - target: spellEffect
      text: >-
        Spells that would send an outsider with the chaotic, evil, good, or
        lawful subtype have their DC increased by [[1]].
  description:
    value: >-
      <p><em>The interference of the Outer Planes in mortal affairs angers you
      to no end and invigorates the potency of your
      magic.</em></p><p><strong>Benefits</strong>: As long as you remain
      neutral, whenever you cast a spell that would send an outsider with the
      chaotic, evil, good, or lawful subtype back to its home plane, the spell’s
      saving throw DC increases by 1.</p>
