  description:
    value: >-
      <p><em>You are not from town; you’ve recently come from somewhere else and
      are hoping to make your fortune here. Pick one of the following reasons to
      be a newcomer to the area.</em></p><p><strong>Benefits</strong>: Pick one
      of the following reasons to be a newcomer to the
      area:</p><p><strong>Exile</strong></p><p><em>For whatever reason, you were
      forced to flee your homeland. Chance or fate has brought you to town, and
      it’s here that your money ran out, leaving you stranded in this small
      town. You are also being pursued by enemies from your homeland, and that
      has made you paranoid and quick to react to danger.</em></p><p>You gain a
      +2 trait bonus on Initiative checks.</p><p><strong>Special
      Note</strong></p><p>This is one of three versions of this trait. Other
      versions can be found
      here:</p><p>@UUID[Compendium.pf-content.pf-traits.Item.KVrNf7eTgJbtA8gl]{Outlander
