  description:
    instructions: >-
      <p>Select one Perform skill when you take this trait.</p><p>Update the
      Skills tab of your Actor to add the chosen skill.</p><p>Update the target
      of the change on the Changes tab of this trait to reflect your
      choice.</p><p>Select one spell of the enchantment school when you take
      this trait.</p><p>Edit the chosen spell. Edit the Use&gt;Action tab&gt;  
      In the DC Offset Formula box enter a 1</p>
    value: >-
      <p><em>Hearing that Sandpoint had a theater rivaling those found in large
      cities like Magnimar and Korvosa, you decided to try your luck getting
      stage time there. After sending a letter to Cyrdak Drokkus requesting an
      audition and not hearing back, you’ve taken it upon yourself to travel to
      Sandpoint and meet him in person, trusting your force of will and charming
      inf luence will get you what you
      want.</em></p><p><strong>Benefits</strong>: You gain a +1 trait bonus on
      checks for any one Perform skill. Additionally, choose any one spell of
      the enchantment school; its save DC increases by +1.</p>
