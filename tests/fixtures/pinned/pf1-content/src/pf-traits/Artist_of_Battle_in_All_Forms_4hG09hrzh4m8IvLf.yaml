name: Artist of Battle in All Forms
system:
  contextNotes:
    - target: cmb
      text: >-
        +[[1]] Trait bonus on <selected Combat Maneuvers>; these don't provoke
        AoOs unless the target has "Improved <maneuver>" feat.
  description:
    instructions: <p>Maintain selected combat maneuver(s) in context note.</p>
    value: >-
      <p><em>You employ complex combat tactics with
      ease.</em></p><p><strong>Exemplar Type</strong>: Combat
      Exemplar</p><p><strong>Benefits</strong>: Choose a type of combat
      maneuver. You gain a +1 trait bonus on combat maneuver checks to perform
      that maneuver, and you do not provoke an attack of opportunity from the
      target unless that creature has the appropriate Improved feat, such as
      Improved Grapple if you attempt a combat maneuver check to grapple. For
      every two other combat traits you have, choose an additional type of
      combat maneuver to gain these benefits.</p><p><strong>Exemplar
      Traits</strong>: A character can have only one exemplar trait, and
      selecting an exemplar trait takes the place of two regular traits. Each
      exemplar trait is tied to a trait category, such as combat traits or
      regional traits; a character with an exemplar trait is no longer
      restricted to a single trait of that category and can select any number of
      such traits when gaining further traits. In addition, a character with an
      exemplar trait can select the Additional Traits feat any number of times
      and use the feat to gain an exemplar trait of a valid trait category for
      which they qualify.</p>
  sources:
    - id: PZO9496
      pages: '2'
  subType: trait
  traitType: exemplar
type: feat
