name: Old Before Your Time (Dhampir; Ancient-Born)
system:
  contextNotes:
    - target: skill.blf
      text: >-
        +[[5]] Trait bonus on opposed checks versus any creature trying to
        discern your true age using Perception or Sense Motive.
    - target: skill.dis
      text: >-
        +[[2]] Trait bonus if your disguise makes you look at least one age
        category older.  You also ignore the check penalty for disguising
        yourself as a different age category while doing so.
  description:
    value: >-
      <p><em>Your fragile flesh shows signs of years not yet
      lived.</em></p><p><strong>Requirements</strong>: Ancient-Born Dhampir
      Heritage</p><p><strong>Benefits</strong>: Any creature trying to discern
      your true age must make a Perception or Sense Motive check opposed by your
      Bluff check; you gain a +5 trait bonus on this check. You gain a +2 trait
      bonus on Disguise checks if your disguise makes you look at least one age
      category older, and ignore the check penalty for disguising yourself as a
      different age category while doing so.</p>
