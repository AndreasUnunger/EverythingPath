      description: >-
        <p>Once per adventure as a standard action, you may concentrate on the
        bond you and Audrahni share. The strong emotions brought on by these
        memories bolster your desire to forge ahead and remain alive, granting
        you the effects of one of the following spells at a caster level equal
        to your character level:
        <em>@UUID[Compendium.pf1.spells.Item.6orhthk4g27rncuu]{calm emotions},
