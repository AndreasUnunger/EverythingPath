      type: trait
  contextNotes:
    - target: allSavingThrows
      text: >-
        +[[2]] Trait bonus against spells or effects with the fear or emotion
        descriptors.
  description:
    value: >-
      <p><em>Even though your pulse is pounding in your ears when you awake in
      the asylum, you feel strangely nonplussed. You can recognize that the
      situation you find yourself in is horrific, but you refuse to let that
      fear control you. It doesn’t feel like it’s worth worrying over too much.
      You know that when you face unspeakable forces, keeping your cool will
      keep you alive.</em></p><p><strong>Benefits</strong>: You gain a +2 trait
      bonus on all saving throws against spells or effects with the fear or
      emotion descriptors. In addition, you gain a +1 trait bonus on Intimidate
      checks due to your intimidating presence, as people don’t know what to
      expect from you.</p>
