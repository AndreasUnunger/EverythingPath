name: Heirloom Weapon
system:
  description:
    value: >-
      <p><em>You carry a non-masterwork simple or martial weapon that has been
      passed down from generation to generation in your family (pay the standard
      gp cost for the weapon).</em></p><p><strong>Benefits</strong>: When you
      select this trait, choose one of the following benefits: proficiency with
      that specific weapon, a +1 trait bonus on attacks of opportunity with that
      specific weapon, or a +2 trait bonus on one kind of combat maneuver when
      using that specific weapon.</p>
