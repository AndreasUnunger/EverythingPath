name: Bifurcated Magic (Half-Elf)
system:
  description:
    instructions: >-
      <p>Pick two spellcasting classes when you gain this trait.</p><p>Once you
      have levels in at least two classes, you may add 1 to the caster level of
      either, or both if applicable, of your chosen classes.</p><p>To do so, go
      to the Spells tab of your actor, select the appropriate spellbook tab,
      edit by clicking on the button that looks like two gears, enter a 1 in the
      "Caster Level Bonus Formula"</p>
    value: >-
      <p><em>You’ve studied the methods of both elven and human
      spellcasters.</em></p><p><strong>Requirements</strong>:
      Half-Elf</p><p><strong>Benefits</strong>: Pick two classes when you gain
      this trait.</p><p>Your caster level in each of those classes is treated as
      1 higher as long as this doesn’t raise your caster level above your total
      Hit Dice.</p><p>This doesn’t stack with any similar increase from traits
      such as Magical Knack.</p>
