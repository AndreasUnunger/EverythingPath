  description:
    value: >-
      <p><em>You have spent a lot of time dealing with the criminal
      underworld—so much that it might be hard for observers to see you as
      distinct from it. However, this familiarity gives you a leg up on heroes
      who refuse to muddy their
      reputation.</em></p><p><strong>Benefits</strong>: While in settlements,
      you gain a +1 trait bonus on Knowledge (local) checks and on Diplomacy
      checks to gather information.</p>
