name: Avarice
system:
  description:
    value: >-
      <p><em>Deep, compulsive greed gnaws at
      you.</em></p><p><strong>Effects</strong>: Whenever monetary treasure is
      divided, you must end up with a greater share of that treasure than your
      companions or you’re wracked with feelings of jealousy and ill will. When
      treasure is divided, if you do not end up with at least 10% more treasure
      than any other individual companion does, you have a hard time being
      helpful to your allies. You become irritable, and can’t take the aid
      another action for the next week.</p>
