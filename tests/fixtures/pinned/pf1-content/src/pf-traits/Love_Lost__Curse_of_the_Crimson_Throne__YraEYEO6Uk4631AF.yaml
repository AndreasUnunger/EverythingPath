      formula: '1'
      type: trait
  description:
    instructions: >-
      <p>Select <strong>All Alone</strong>&nbsp;or <strong>Orphaned
      </strong>when you take this trait.</p><p>Update the Class skills section
      of the Details tab of this trait to reflect the Skill associated with your
      choice.</p><p>Update the target of the Change on the Changes tab of this
      trait to reflect the Skill associated with your choice.</p>
    value: >-
      <p><em>Someone you loved was knifed to death in a dark alley one night.
      You were called to the scene by the Korvosan Guard to identify the body,
      and as rough as that was for you, you also noticed a ring was missing from
      the body. Whoever murdered your loved one stole that ring,you're convinced
      of it. You've done some investigation on your own and recently found the
      ring for sale at a local merchant. Although, to your great frustration,
      you can't afford yet to buy it back, the merchant did tell you from whom
      he purchased the ring: a man named Gaedren Lamm. It seems likely this
      criminal is the one who killed your loved one, or at the very least knows
      who did. The only problem is finding
      him.</em></p><p><strong>Benefits</strong></p><p>Choose one of the
      following benefits:</p><p><strong>All Alone</strong></p><p>The murder
      victim was a lover. With your lover's death, a part of you died as well,
      leaving you haunted, grim, and prone to dark musings. You gain a +1 bonus
      on Intimidate checks, and Intimidate is a class skill for
      you.</p><p><strong>Orphaned</strong></p><p>The murder victim was your only
      surviving parent.You had to work hard to make ends meet for yourself and
      any siblings, and often had to scavenge for food. You gain a +1 trait
      bonus on Survival checks, and Survival is a class skill for you.</p><hr />
