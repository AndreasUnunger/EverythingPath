  description:
    instructions: >-
      <p>Select one of skills permitted [Craft (any one), Disable Device, or
      Knowledge (engineering)] when you take this trait.</p><p>Update the target
      of the change on the changes tab of this trait to reflect your
      choice</p><p>Update the Class skills section of the details tab of this
      trait to reflect your choice.</p>
    value: >-
      <p><em>Growing up bordering the Mana Wastes and living within the Grand
      Duchy of Alkenstar has made you familiar with tools and practical objects.
      You rely on mechanics to solve problems and are familiar with basic
      engineering concepts.</em></p><p><strong>Requirements</strong>: <span
      style="text-decoration:underline" data-tooltip="The city-state of
      Alkenstar is located in a low valley of the eastern Shattered Peaks
      mountain range on the banks of the Ustradi River, amid the magic-dead
      region known as the Mana Wastes in eastern Garund"><span
      style="text-decoration:underline">Alkenstar
      native</span></span></p><p><strong>Benefits</strong>: Select one of the
      following skills: Craft (any), Disable Device, or Knowledge (engineering).
      You gain a +1 trait bonus on checks with that skill, and it is always a
      class skill for you.</p>
