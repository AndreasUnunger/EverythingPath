      text: +[[2]] Trait bonus with those who find you attractive.
  description:
    instructions: >-
      <p>In your character sheet, go to the settings tab and check "Spell-like"
      under spellbook usage. Then navigate to the spells tab, go to your
      spell-like spellbook, and add the Daze spell. In the spell-like spellbook
      configuration, set the spellcasting class to "Hit Die". Open your new Daze
      spell and go to the details tab, open the use properties, in the use
      window go to the usage tab, and at the bottom, below "Action" choose "Per
      Day" and type 1 in the formula.</p>
    value: >-
      <p><em>You have the art of turning a passing glance into
      love.</em></p><p><strong>Requirements</strong>:
      Bolka</p><p><strong>Benefits</strong>: You receive a +2 trait bonus on
      Diplomacy checks with those who find you attractive. You can use daze once
      per day as a spell-like ability, with a caster Level equal to your
      character level.</p>
