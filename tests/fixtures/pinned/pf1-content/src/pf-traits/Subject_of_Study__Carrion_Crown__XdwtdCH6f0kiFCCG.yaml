name: Subject of Study (Carrion Crown)
system:
  contextNotes:
    - target: attack
      text: +[[1]] bonus on damage rolls against creatures of the <chosen> type.
  description:
    instructions: >-
      <p>Select one non-humanoid creature type (and subtype if outsider) when
      you take this trait.</p><p>Update the text of the note on the changes tab
      of this trait to reflect your choice</p>
    value: >-
      <p><em>Professor Lorrimor approached you as part of his studies, as he had
      heard that you had survived a recent encounter with a strange monster or
      had another fateful encounter. Interested in the conditions of the run-in
      and the means by which you avoided death or injury, he met with you and
      maintained frequent correspondence until several months ago. The scars of
      your experience and his continual reminders of the encounter prompted you
      to hone your skills lest you someday face the same type of creature again.
      The professor assisted you in this endeavor, providing you with insight
      into the anatomy and defenses of the creature that attacked you. Years of
      study have improved your combat effectiveness against your chosen
      foe.</em></p><p><strong>Benefits</strong>: Choose a non-humanoid creature
      type (and subtype if outsider). You gain a +1 bonus on damage rolls
      against creatures of this type.</p>
