name: Forgetful
system:
  description:
    value: >-
      <p><em>You are easily distracted and prone to forgetting important
      things.</em></p><p><strong>Effects</strong>: Whenever you leave a location
      you have been at for longer than 1 hour, you must attempt a DC 10 Wisdom
      check. If you fail, you leave behind one random mundane item (a purse of
      money counts as an item).</p>
