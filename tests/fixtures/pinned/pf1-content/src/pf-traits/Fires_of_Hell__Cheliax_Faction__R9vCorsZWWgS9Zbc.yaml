  description:
    value: >-
      <p><em>Your parents signed a pact with a fiend of Hell before you were
      born, and as a result you can summon fire to your
      aid.</em></p><p><strong>Requirements</strong>: Cheliax
      Faction</p><p><strong>Benefits</strong>: Once per day, as a swift action,
      you can summon fire, imbuing a single weapon you hold with a nimbus of
      fire that deals an extra 1 point of fire damage for a number of rounds
      equal to your Charisma bonus. This fire gives off light equivalent to a
      torch. This is a supernatural ability.</p>
