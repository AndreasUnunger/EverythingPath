name: Anticipate Evil (Tiefling)
system:
  contextNotes:
    - target: dexSkills
      text: >-
        +[[1]] Trait bonus on opposed Dexterity-based skill checks against
        outsiders with the evil subtype.
    - target: init
      text: >-
        When your initiative is tied with outsiders with the evil subtype, you
        always act first.
  description:
    value: >-
      <p><em>You can read subtle clues in the body language of fiends, allowing
      you to react just a bit faster than normal when dealing with such
      beings.</em></p><p><strong>Requirements</strong>:
      Tiefling</p><p><strong>Benefits</strong>: You gain a +1 trait bonus on
      opposed Dexterity-based skill checks against outsiders with the evil
      subtype.</p><p>In addition, when your initiative is tied with such
      creatures, you always act first regardless of which of you has a higher
      initiative modifier.</p>
