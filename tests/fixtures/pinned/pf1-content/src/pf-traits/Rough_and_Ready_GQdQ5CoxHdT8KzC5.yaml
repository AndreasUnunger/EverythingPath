name: Rough and Ready
system:
  description:
    value: >-
      <p><em>Your intense familiarity with the tools of your trade allows you to
      use them in combat as if they were actual weapons and makes them more
      effective for that purpose than they would normally
      be.</em></p><p><strong>Benefits</strong>: When you use a tool of your
      trade (requiring at least 1 rank in the appropriate Craft or Profession
      skill) as a weapon, you do not take the improvised weapon penalty and
      instead receive a +1 trait bonus on your attack. This trait is commonly
      used with shovels, picks, blacksmith hammers, and other sturdy tools—lutes
      and brooms make terribly fragile weapons.</p>
