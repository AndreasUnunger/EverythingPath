name: Merchant Family (Rise of the Runelords)
system:
  description:
    value: >-
      <p><em>You are related to one of the four noble families from Magnimar who
      founded the Mercantile League of Sandpoint. You either grew up in Magnimar
      as a cousin in the Valdemar or Deverin family or were born and raised in
      Sandpoint. Education in running a business and years of looking after the
      family enterprise have given you a knack for
      trade.</em></p><p><strong>Benefits</strong>: You increase the gp limit of
      any settlement by 20% and can resell items at an additional 10% over the
      amount of gp you normally would get from selling off treasure.</p>
