name: Scorned by Magic
system:
  contextNotes:
    - target: sr
      text: >-
        Reduce the caster level of spells and spell-like abilities cast upon you
        by 1 against spells that attempt to overcome your spell resistance.
    - target: cl
      text: >-
        Reduce the caster level of spells and spell-like abilities cast upon you
        by 1 when dispel checks are attempted.
  description:
    value: >-
      <p><em>As a youth, you assisted a wise woman or witch doctor who removed
      magical maladies from the needy and was present for the breaking of many
      spells—or perhaps you passed through a dead magic zone. Whatever the
      cause, magic seems a little more reluctant to affect you than
      others.</em></p><p><strong>Benefits</strong>: Reduce the caster level of
      spells and spell-like abilities cast upon you by 1 for the purpose of
      attempting dispel checks and overcoming your spell resistance (if
      any).</p><p><strong>Suggested Characters</strong></p><p>Kellids, Mana
      Wastes natives, Shoanti.</p>
  sources:
    - id: PZO9433
      pages: '20'
  subType: trait
  traitType: magic
type: feat
