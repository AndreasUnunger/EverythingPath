  description:
    value: >-
      <p><em>You have studied the architectural styles of nations throughout the
      Inner Sea region, but none have fascinated you like the architecture of
      Ancient Osirion. Hearing that the famed necropolis of Wati has finally
      been opened for exploration, you’ve come to that city to get firsthand
      experience with the lost secrets of Ancient Osirion’s master
      builders.</em></p><p><strong>Benefits</strong>: You gain a +2 trait bonus
      on Knowledge (engineering) checks, and that skill is always a class skill
      for you. In addition, you gain a +2 trait bonus on Perception checks to
      find concealed or secret doors in structures built in the style of Ancient
      Osirion.</p>
