      formula: '1'
      type: trait
  contextNotes:
    - target: ''
      text: +[[2]] Trait bonus to stabilize at negative hit points.
  description:
    instructions: >-
      <ol><li><p>Select <strong>Tortured</strong>, or <strong>Religious</strong>
      when you take this trait.</p></li><li><p>If you select
      <strong>Religious,</strong> Update the target of the untargeted change on
      the changes tab of this trait to reflect a value of 2 and a target of
      Spells&gt; Concentration  then Update the UnTargeted Context Note to
      Ability Checks&gt; Constitution</p></li><li><p>If you select
      <strong>Tortured, </strong>Update the target of the untargeted Change on
      the changes tab of this trait to reflect Saving Throws&gt;Reflex, Then
      Delete the untargeted Context Note</p></li></ol>
    value: >-
      <p><em>You spent a period of time as one of Gaedren Lamm’s enslaved
      orphans, doing all manner of dirty work for him. Maybe you were abducted
      from your parent’s home or during a trip to the market. Perhaps the
      irresponsible matron who ruled your orphanage traded you to him in return
      for a desperately needed financial loan. Or perhaps you, like most of
      Gaedren’s slaves, were merely a child of the street who succumbed to his
      promise of regular meals and a roof in return for what he said would be “a
      little light work.” Whatever the case, you spent several years of your
      life as one of “Lamm’s Lambs” before escaping. You’ve nursed a grudge
      against the old man ever
      since.</em></p><p><strong>Benefits</strong></p><p>Choose one of the
      following benefits:</p><p><strong>Religious</strong></p><p>Today, while on
      a job for Gaedren, you found a holy symbol of the god you worship,
      intrigued by it, you snuck off to attend services. When Gaedren found out,
      he beat you to within an inch of your life and broke your holy symbol.
      Your faith let you block out the pain, and you escaped his control and
      took shelter in the church, where you spent the rest of your youth. You
      gain a +2 bonus on Concentration checks and Constitution checks to
      stabilize at negative hit
      points.</p><p><strong>Tortured</strong></p><p>After you made one too many
      errors, Gaedren tortured you and left you for dead on a garbage heap. Your
      scars and memories have honed your reaction speed and make you rather
      jumpy. You gain a +1 bonus on Reflex saves.</p><hr />
