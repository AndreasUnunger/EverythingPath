name: Feral Speech
system:
  description:
    instructions: >-
      <p> Choose one of the permitted language options Aklo, Aquan, Auran,
      Giant, Ignan, or Sylvan (or Druidic).</p><p>Add the chosen language to the
      bonus language area of the "Granted Proficiencies" section of the Details
      tab of this trait</p>
    value: >-
      <p><em>You were raised in a community that included numerous individuals
      who spoke with creatures of the
      wild.</em></p><p><strong>Benefits</strong>: You gain one of the following
      languages of your choice as a bonus language: Aklo, Aquan, Auran, Giant,
      Ignan, or Sylvan.</p><p>With your GM’s permission, you can instead select
      Druidic, but druids are protective of their language—you are likely to
      find yourself hunted by druids wishing to eliminate you as a threat to
      their sole ownership of their secrets.</p>
