  description:
    instructions: >-
      <p>Select Heal or Knowledge (nature) when you take this
      trait.</p><p>Update the Class skills section of the details tab of this
      trait to reflect your choice.</p>
    value: >-
      <p><em>You make your way in life by putting people back together after the
      rigors of the world take their toll—brewing herbal remedies, setting
      broken bones, and treating diseases.</em></p><p><strong>Benefits</strong>:
      You gain a +1 trait bonus on all Heal and Knowledge (nature) checks, and
      one of these skills is always a class skill for you.  Any time you restore
      hit points using the Heal skill or a cure spell (but not with channeled
      energy, lay on hands, or a magic device such as a potion or wand), you
      restore 1 additional hit point, plus 1 for every 2 class levels you have
      beyond 1st.</p>
