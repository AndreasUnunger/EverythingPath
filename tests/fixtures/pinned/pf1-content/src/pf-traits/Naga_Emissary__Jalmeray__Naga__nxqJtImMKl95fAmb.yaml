  description:
    value: >-
      <p><em>You were groomed from childhood to act as an emissary to Nagajor’s
      allies in Jalmeray, and you understand much about the Jalmeri people as a
      result.</em></p><p><strong>Requirements</strong>: <span
      style="text-decoration:underline" data-tooltip="Nagas are a family of
      strange creatures found throughout Golarion. They share the same general
      physical shape: a long, serpentine body with a humanoid head. According to
      myth, nagas are the children of Ravithra, the Vudran goddess of snakes.
      Naga were the first rulers of Vudra and created the foundations for its
      caste system and are the current rulers of Nagajor in Tian Xia."><span
      style="text-decoration:underline">Naga</span></span> native to <span
      data-tooltip="Large island-nation in the Obari Ocean"><span
      style="text-decoration:underline">Jalmeray</span></span></p><p><strong>Benefits</strong>:
      You gain a +1 trait bonus on Diplomacy checks, and Diplomacy is a class
      skill for you. In addition, you gain Vudrani as a bonus language.</p>
