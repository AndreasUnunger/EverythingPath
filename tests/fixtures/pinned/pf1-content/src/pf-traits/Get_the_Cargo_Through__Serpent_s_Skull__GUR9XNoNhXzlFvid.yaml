name: Get the Cargo Through (Serpent's Skull)
system:
  description:
    value: >-
      <p><em>Sea trade is never safe, even on the highly trafficked waters of
      the Inner Sea, but the way to Eleder is more perilous still. The
      ever-present hurricane known as the Eye of Abendego blows hundreds of
      ships each year off course, into jagged rocks, or directly to the sea f
      loor. Pirates operating out of the Shackles Isles wait on the other side
      to take cargo from ships lucky enough to traverse or bypass the storm.
      Your job is to ensure a precious cargo aboard the Jenivere arrives safely
      in Eleder—what form this cargo takes and the nature of your relationship
      to it are up to you and your GM.</em></p><p><strong>Benefits</strong>:
      Your character’s history as a merchant or mercenary has earned her a
      respectable living, and you begin the campaign with an additional 300 gp
      in starting wealth.</p><p>Characters with this trait likely boarded in
      Magnimar, Corentyn, Ilizmagorti, Port Peril, or Bloodcove.</p>
