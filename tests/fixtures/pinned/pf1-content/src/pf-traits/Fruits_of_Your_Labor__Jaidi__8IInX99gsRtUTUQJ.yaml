  description:
    value: >-
      <p><em>You take pride in providing for your
      community.</em></p><p><strong>Requirements</strong>:
      Jaidi</p><p><strong>Benefits</strong>: Once per day you can serve a meal
      comprising food you have produced, purchased, or foraged to yourself and
      up to six other creatures.</p><p>Serving and consuming this meal takes 10
      minutes, during which the other participants can also partake in light
      activity such as conversation, reading, and keeping watch.</p><p>Each
      creature regains 1d3 hit points at the end of the meal, and gains a +1
      trait bonus on its next d20 roll using the aid another action to assist
      other creatures who consumed the meal.</p><p>The +1 trait bonus lasts 24
      hours, and a creature can gain that bonus on its next d20 roll to assist
      other creatures from this trait only once per day.</p>
