name: Dragon Pact
system:
  contextNotes:
    - target: skill.dip
      text: +[[1]] Trait bonus against true dragons of the <chosen> category.
    - target: skill.int
      text: +[[1]] Trait bonus against true dragons NOT of the <chosen> category.
  description:
    instructions: >-
      <p>Choose one category of true dragon (Chromatic, Esoteric, Imperial,
      Metallic, Outer, Planar, Primal) when you take this trait.</p><p>Update
      the text of the notes on the changes tab of this trait to reflect your
      choice.</p>
    value: >-
      <p><em>At some point your family served a dragon, and acted as its
      emissary to others. Some members of your family have benefited from this
      arrangement, gaining some small fraction of that dragon's noble
      bearing.</em></p><p><strong>Benefits</strong>: Choose one category of true
      dragon (chromatic, metallic, primal, etc.). You gain a +1 trait bonus on
      Diplomacy checks against that category of dragon and a +1 trait bonus on
      Intimidate checks against all creatures of the dragon type that are not of
      the same category of true dragon.</p>
  sources:
    - id: PZO9470
      pages: '3'
  subType: trait
  traitType: social
type: feat
