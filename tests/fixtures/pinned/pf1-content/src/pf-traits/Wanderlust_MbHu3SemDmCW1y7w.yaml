name: Wanderlust
system:
  description:
    value: >-
      <p><em>Your childhood was brightened by the new places you constantly saw
      as you traveled with your parents, who were merchants. Still excited by
      travel, you gain great energy when traveling
      overland.</em></p><p><strong>Benefits</strong>: Treat your base land speed
      as 10 feet higher when determining your overland
      speed.</p><p><strong>Suggested Characters</strong></p><p>Desnans,
      halflings, Varisians.</p>
