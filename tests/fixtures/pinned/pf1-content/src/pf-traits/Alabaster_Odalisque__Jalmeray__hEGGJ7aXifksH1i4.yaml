    value: >-
      <p><em>The rajahs of Jalmeray favored you for your stately physique and
      flawless skin, and so endorsed your candidacy for tutelage at the
      Conservatory on the island of Grand
      Sarret.</em></p><p><strong>Requirements</strong>: <span
      data-tooltip="Large island-nation in the Obari Ocean"><span
      style="text-decoration:underline">Jalmeray</span></span></p><p><strong>Benefits</strong>:
      Trained to be the perfect bard, courtesan, or undercover operative, you
      gain a +1 trait bonus on two Charisma-based skills of your choice. In
      addition, once per day as a swift action, you can brush your fingers
      against a closed door or stone wall up to 1 foot thick. Doing so allows
      you to ignore penalties on Perception checks to listen through the
      designated object for 1 minute.</p>
