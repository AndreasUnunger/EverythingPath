name: Swamp Survivor (Ustalav)
system:
  contextNotes:
    - target: skill.sur
      text: +[[2]] Trait bonus to find fresh water.
  description:
    value: >-
      <p><em>Leaving </em><span style="text-decoration:underline"
      data-tooltip="Graidmere Swamp lies to the north-east of Lake Prophyria, in
      the far north-eastern Ustalavic county of Sinaria. It is a large swamp
      covering nearly 400 square miles."><em><span
      style="text-decoration:underline">Graidmere Swamp</span></em></span><em>
      is forbidden, and to flee the mire is to court </em><span
      style="text-decoration:underline" data-tooltip="The great wyrm black
      dragon Seryzilian is one of the most well-known members of her species in
      all of Avistan. She makes her home in the small swamp north of the town of
      Karcau in Ustalav."><em><span
      style="text-decoration:underline">Seryzilian</span></em></span><em>’s
      wrath. However, you are one of the few to successfully make it out of the
      swamp alive. Now, you’re resolved to liberate your
      kinfolk.</em></p><p><strong>Requirements</strong>: <span
      style="text-decoration:underline" data-tooltip="Fog-shrouded nation in
      central Avistan"><span
      style="text-decoration:underline">Ustalav</span></span></p><p><strong>Benefits</strong>:
      You gain a +2 bonus on Survival checks to find fresh water, and magical
      liquids in your possession gain a +2 bonus on Will saves to avoid being
      corrupted or otherwise spoiled.</p>
