  description:
    value: >-
      <p><em>You’ve long been interested in the legacy of the Silver Ravens—a
      group of freedom fighters that rose to prominence in Kintargo during the
      Chelish Civil War. There’s frustratingly little information today about
      the group, and you suspect that most of what was recorded about the Silver
      Ravens has long since been redacted or destroyed by government agents, but
      you’ve managed to pick up a tidbit here and there. Most of your knowledge
      isn’t so much about the Silver Ravens specifically, but more about general
      histories of rebel groups and freedom fighters who have fought against
      oppressive governments throughout history, both in Cheliax and
      beyond.</em></p><p><strong>Benefits</strong>: Your familiarity with rebel
      groups allows you to grant a +2 bonus on an Organization check of your
      choice once the party reestablishes the Silver Ravens during the first
      adventure. You can change which check you assign this bonus to once at the
      start of the rebellion’s Upkeep phase. Your time preparing for joining the
      Silver Ravens has also honed your skill at remaining unseen. You gain a +1
      trait bonus on Stealth checks, and Stealth is always a class skill for
      you.</p>
