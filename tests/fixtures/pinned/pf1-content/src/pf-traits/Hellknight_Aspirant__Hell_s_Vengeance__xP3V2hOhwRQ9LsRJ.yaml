  description:
    value: >-
      <p><em>You have always admired the authority, discipline, and
      righteousness of the ebon-armored Hellknights. Whether it’s their
      unwavering self-control, uncompromising dedication to law and order,
      relentless pursuit of justice, or merciless administration of punishment,
      you have tried to model your own actions on the Hellknight philosophy
      called the Measure and the Chain. Your most fervent wish is to eventually
      join one of the Hellknight orders and take your place among the grim ranks
      dedicated to upholding and enforcing the laws of Hell and of
      Cheliax.</em></p><p><strong>Benefits</strong>: You gain a +1 trait bonus
      on Knowledge (planes) checks, and Knowledge (planes) is a class skill for
      you. In addition, choose one of the following Hellknight orders. You have
      trained yourself in the use of that order’s favored weapon (if more than
      one weapon is listed, pick one), and gain a +1 trait bonus to your Combat
      Maneuver Defense whenever an opponent tries to sunder or disarm you of
      that weapon.</p><p><em>Order of the Chain: </em>Flail</p><p><em>Order of
      the Gate:</em> Dagger</p><p><em>Order of the Godclaw:</em>
      Morningstar</p><p><em>Order of the Nail:</em> Lance or
      halberd</p><p><em>Order of the Pike:</em> Longspear</p><p><em>Order of the
      Pyre:</em> Glaive</p><p><em>Order of the Rack</em>: Longsword or
      whip</p><p><em>Order of the Scourge</em>: Heavy mace or whip</p>
