  description:
    instructions: >-
      <p>Select Knowledge (any one) when you take this trait.</p><p>Update the
      target of the change on the Changes tab of this trait to reflect your
      choice.</p><p>Select Knowledge (same as previous choice) or Survival when
      you take this trait.</p><p>Update the Class skills section of the details
      tab of this trait to reflect your choice.</p><p><strong>Special
      note<strong>: the rules for the machete indicate that: <em>A character
      proficient with a machete gains a +1 circumstance bonus on Survival checks
      to get along in the wild.</em></strong></p>
    value: >-
      <p><em>Adventurous scholars raised you, or perhaps you were born during an
      expedition and haven’t known any other life. You get fidgety and impatient
      when you become too familiar with a certain place. You are used to having
      excitement and the quest for knowledge guides your path in life, and you
      picked up a number of skills along the way that relate to this lifestyle.
      During your interview with the Bountiful Venture Company, they were
      impressed with the diverse locations you’ve visited in your life and
      selected you because of your skills in maneuvering uncharted
      territory.</em></p><p><strong>Benefits</strong>: Choose one Knowledge
      skill when you gain this trait. You gain a +1 trait bonus to check with
      that Knowledge skill and Survival checks, and either that Knowledge skill
      or Survival is a class skill for you. In addition, you treat the
      @UUID[Compendium.pf1.weapons-and-ammo.Item.A7H1FjMo0jGDY3dB]{machete} as a
      simple weapon.&nbsp;</p>
