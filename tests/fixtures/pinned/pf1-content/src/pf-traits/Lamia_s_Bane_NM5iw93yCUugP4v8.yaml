  description:
    value: >-
      <p><em>You have been exposed to the magical energies of lamias in your
      past, or you have heard innumerable stories about your family’s dealings
      with lamias, and you have built up a resistance to their
      charms.</em></p><p><strong>Benefits</strong>: You gain a +1 trait bonus on
      saving throws against enchantment effects and a +2 trait bonus on saving
      throws against the spells and spell-like abilities of lamias.</p>
