name: Natural Negotiator (The Concordance)
system:
  description:
    instructions: >-
      <p>Select Diplomacy or Handle Animal when you take this
      trait.</p><p>Update the Class skills section of the details tab of this
      trait to reflect your choice.</p><p>Select one (1) of Aklo, Aquan, Auran,
      Ignan, Sylvan, or Terran when you take this trait.</p><p>Update the
      Granted Proficiencies&gt;Languages section of the details tab of this
      trait to reflect this choice.</p>
    value: >-
      <p><em>Negotiating with other creatures, whether they be animals or people
      from far-flung realms, is second nature to
      you.</em></p><p><strong>Requirements</strong>: The
      Concordance</p><p><strong>Benefits</strong>: Either Diplomacy or Handle
      Animal becomes a class skill for you. Add your choice of Aklo, Aquan,
      Auran, Ignan, Sylvan, or Terran as a bonus language to your list of
      languages known.</p>
