  description:
    value: >-
      <p><em>Your time spent amid angry mobs has taught you exactly how to use
      crowds of people to distract your
      opponents.</em></p><p><strong>Requirements</strong>: Halfing native to
      <span style="text-decoration:underline" data-tooltip="Galt is a former
      province of Taldor and vassal of Cheliax.  The nation is located in
      eastern Avistan."><span
      style="text-decoration:underline">Galt</span></span></p><p><strong>Benefits</strong>:
      If you have at least three allies threatening your opponent, you gain a +2
      bonus on Bluff checks to feint him and a +2 bonus on Sleight of Hand
      checks against him.</p>
