  description:
    value: >-
      <p><em>You have learned many adventuring skills—as well as hatred for
      efreet—during your years of military service to Sultana Ashadieeyah bint
      Khalid, ruler of the Opaline Vault on the Plane of
      Earth.</em></p><p><strong>Requirements</strong>: Plane of
      Earth</p><p><strong>Benefits</strong>: You gain a +2 trait bonus on
      Disable Device checks to disarm any traps that you know deal fire damage,
      and you gain a +2 trait bonus on attack rolls to confirm critical hits
      against creatures with the fire subtype.</p>
