name: Smoke Resistant (Kobold)
system:
  contextNotes:
    - target: fort
      text: >-
        +[[5]] Trait bonus to avoid coughing and choking because of smoke
        inhalation.
    - target: skill.per
      text: Your vision isn’t impaired by nonmagical smoke.
  description:
    value: >-
      <p><em>You’ve spent so much of your life around fires that smoke no longer
      affects you the way it does other
      creatures.</em></p><p><strong>Requirements</strong>:
      Kobold</p><p><strong>Benefits</strong>: Your vision isn’t impaired by
      nonmagical smoke, and you gain a +5 trait bonus on Fortitude saves to
      avoid coughing and choking because of smoke inhalation (<em>Pathfinder RPG
      Core Rulebook</em> 426). This trait confers no benefits against magically
      created smoke, such as that produced by <em>pyrotechnics</em>.</p>
