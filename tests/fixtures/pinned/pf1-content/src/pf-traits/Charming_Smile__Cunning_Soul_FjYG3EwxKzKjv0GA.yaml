  description:
    instructions: >-
      <p> Increase bonus in changes tab by one for every two social traits you
      have.</p>
    value: >-
      <p><em>You know how to guilefully weave words, sway hearts and minds,
      verbally destroy rivals, and pierce cunning
      lies.</em></p><p><strong>Exemplar Type</strong>: Social
      Exemplar</p><p><strong>Benefits</strong>: You gain a +1 trait bonus on
      Bluff, Diplomacy, Intimidate, and Sense Motive checks. This bonus
      increases by 1 for every two other social traits you
      have.</p><p><strong>Exemplar Traits</strong>: A character can have only
      one exemplar trait, and selecting an exemplar trait takes the place of two
      regular traits. Each exemplar trait is tied to a trait category, such as
      combat traits or regional traits; a character with an exemplar trait is no
      longer restricted to a single trait of that category and can select any
      number of such traits when gaining further traits. In addition, a
      character with an exemplar trait can select the Additional Traits feat any
      number of times and use the feat to gain an exemplar trait of a valid
      trait category for which they qualify.</p>
