name: Monk Weapon Skill
system:
  description:
    instructions: >-
      <p>Select one permitted monk weapon when you take this trait. Each time
      you add a weapon of the chosen type to your actor, take the following
      steps:</p><ol><li>Edit the weapon, on the details tab of the weapon, edit
      the attack.</li><li>On the action tab of the attack scroll down to the
      damage formula section then click the "add damage formula"
      button.</li><li>Put a 1 in the formula area and add a custom damage type
      of "trait".</li></ol>
    value: >-
      <p><em>Your exposure to teaching from the Houses of Perfection makes your
      attacks with monk weapons even more
      deadly.</em></p><p><strong>Benefits</strong>: Select one monk weapon with
      which you are proficient (unarmed attacks do not qualify for this
      purpose). You gain a +1 trait bonus on damage rolls with this
      weapon.</p><div><hr /></div>
