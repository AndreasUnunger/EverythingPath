name: Shadow-Scarred
system:
  contextNotes:
    - target: allSavingThrows
      text: '-[[1]] penalty when in dim light or darkness.'
  description:
    value: >-
      <p><em>You were touched by terrible horrors that live in the darkness just
      outside the human sphere, such as shadow-beasts or aberrations linked to
      the Dark Tapestry, and feel your life-force ebb away ever so slightly
      whenever you return to the shadows.</em></p><p><strong>Effects</strong>:
      Whenever you are in an area of dim light or darkness, you take a –1
      penalty on saving throws.</p>
