  description:
    value: >-
      <p><em>You interposed yourself between an innocent and a dangerous evil
      monster or force, lost a great deal of blood as a result, and barely
      survived. Now, your blood seems to replenish with blessed speed, a sure
      sign of Vildeis’s favor.</em></p><p><strong>Requirements</strong>:
      Vildeis</p><p><strong>Benefits</strong>: You recover twice as many hit
      points and points of ability damage as normal when you rest, or three
      times as many when you take total bed rest.</p>
