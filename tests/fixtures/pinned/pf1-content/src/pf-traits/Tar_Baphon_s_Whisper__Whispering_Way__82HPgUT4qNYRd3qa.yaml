name: Tar-Baphon's Whisper (Whispering Way)
system:
  description:
    instructions: >-
      <p>In your character sheet, go to the settings tab and check "Spell-like"
      under spellbook usage. Then navigate to the spells tab, go to your
      spell-like spellbook, and add the sotto voce spell. In the spell-like
      spellbook configuration, set the spellcasting class to the same
      spellcasting class you have if any. If you have no caster level, open your
      new sotto voce spell and go to the details tab, under "Offsets", type 1
      inside the "Caster Level Offset". Then, open the use properties, in the
      use window go to the usage tab, and at the bottom, below "Action" choose
      "Per Day" and type 3 in the formula.</p>
    value: >-
      <p><em>You have learned the secrets of sotto voce, the eerie, dry
      whispering voice used to pass on cult
      secrets.</em></p><p><strong>Requirements</strong>: Whispering
      Way</p><p><strong>Benefits</strong>: You may cast
      @UUID[Compendium.pf1.spells.Item.5s8jqu87susjxarc]{sotto voce} as a
      spell-like ability three times per day as a spell-like ability. This
      spell-like ability is cast at your highest caster level; if you have no
      caster level, it functions at CL 1st.</p>
  sources:
    - id: PZO9221
      pages: '63'
  subType: trait
  traitType: magic
type: feat
