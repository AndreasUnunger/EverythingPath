name: Vorpal
system:
  description:
    value: >-
      <p><strong>Aura</strong> strong necromancy and transmutation
      <strong>CL</strong> 18th</p><p><strong>Slot</strong> weapon quality;
      <strong>Price</strong> +5 bonus;</p><p>This potent and feared ability
      allows the weapon to sever the heads of those it strikes. Upon a roll of
      natural 20 (followed by a successful roll to confirm the critical hit),
      the weapon severs the opponent's head (if it has one) from its body. Some
      creatures, such as many aberrations and all oozes, have no heads. Others,
      such as golems and undead creatures other than vampires, are not affected
      by the loss of their heads. Most other creatures, however, die when their
      heads are cut off. A <em>vorpal </em>weapon must be a slashing melee
      weapon. If you roll this special ability randomly for an inappropriate
      weapon, reroll.</p><h3>Construction</h3><p><strong>Requirements</strong>
      Craft Magic Arms and Armor, <em>circle of death</em>, <em>keen edge</em>;
      <strong>Price</strong> -</p>
