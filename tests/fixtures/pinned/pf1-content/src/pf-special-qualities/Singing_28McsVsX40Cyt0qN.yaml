name: Singing
system:
  description:
    value: >-
      <p><strong>Aura</strong> moderate evocation <strong>CL</strong>
      10th</p><p><strong>Slot</strong> none; <strong>Price</strong> +1 bonus;
      <p>This special ability can be placed only on a shield. Once per day, a
      <em>singing</em> shield's bearer can command the shield to sing for 10
      rounds to counter magical effects that depend on sound (as the bard's
      countersong ability). Once per round during this time, the shield's bearer
      can roll 1d20+10, treating that as the result of the shield's Perform
      check for
      countersong.</p><h3>Construction</h3><p><strong>Requirements</strong>
      Craft Magic Arms and Armor, <em>soundburst</em>; <strong>Price</strong> +1
      bonus</p>
