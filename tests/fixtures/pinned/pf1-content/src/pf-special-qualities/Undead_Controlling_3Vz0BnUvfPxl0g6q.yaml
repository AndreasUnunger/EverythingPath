    value: >-
      <p><strong>Aura</strong> strong necromancy <strong>CL</strong>
      13th</p><p><strong>Slot</strong> armor/shield quality;
      <strong>Price</strong> +49,000 gp;</p><p><em>Undead controlling </em>armor
      and shields often have skeletal or other grisly decorations or flourishes
      to their decor. They let the user control up to 26 Hit Dice of undead per
      day, as the <em>control undead </em>spell. At dawn each day, the wearer
      loses control of any undead still under his sway. Armor or a shield with
      this ability appears to be made of bone; this feature is entirely
      decorative and has no other effect on the
      armor.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Magic Arms and Armor, <em>control undead</em>; <strong>Price</strong>
      +24,500 gp</p>
