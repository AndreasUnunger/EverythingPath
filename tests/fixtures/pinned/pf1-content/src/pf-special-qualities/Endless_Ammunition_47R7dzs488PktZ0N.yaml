name: Endless Ammunition
system:
  description:
    value: >-
      <p><strong>Aura</strong> moderate conjuration <strong>CL</strong>
      9th</p><p><strong>Slot</strong> weapon quality; <strong>Price</strong> +2
      bonus;</p><p>Only bows and crossbows can be made into <em>endless
      ammunition </em>weapons-firearms and other projectile weapons cannot. Each
      time an <em>endless ammunition </em>weapon is nocked, a single nonmagical
      arrow or bolt is spontaneously created by the magic, so the weapon's
      wielder never needs to load the weapon with ammunition.<p>If the wielder
      attempts to load the weapon with other ammunition, the created arrow or
      bolt immediately vanishes and the wielder can load the weapon as normal.
      This ability does not reduce the amount of time required to load or fire
      the weapon. The created arrow or bolt vanishes if removed from the weapon;
      it persists only if fired. Unlike normal bow and crossbow ammunition,
      these arrows and bolts are always destroyed when
      fired.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Magic Arms and Armor, <em>minor creation</em>; <strong>Price</strong>
      -</p>
