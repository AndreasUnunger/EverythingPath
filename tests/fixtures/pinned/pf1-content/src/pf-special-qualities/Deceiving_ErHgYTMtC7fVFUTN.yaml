name: Deceiving
system:
  description:
    value: >-
      <p><strong>Aura</strong> moderate evocation <strong>CL</strong>
      7th</p><p><strong>Price</strong> +5,000 gp;</p><p>A suit of armor with
      this special ability alters the perceived aura of the wearer for the
      purpose of divination spells that reveal auras (such as <em>detect
      evil</em>) to an aura decided when the armor is enchanted. The wearer
      always radiates this alternate alignment aura while wearing a suit of
      <em>deceiving</em> armor, and cannot suppress this effect. The wearer does
      not count as having this modified alignment for effects other than
      detection, such as smite, access to class abilities, and spells that have
      alternative effects based on a target's alignment. If the wearer is struck
      by an attack or effect that is more effective against evil-aligned
      creatures (such as smite, holy word, etc.), the attacker perceives the
      strike as being far more effective than it actually is. However, with a
      successful DC 20 Sense Motive check, the attacker realizes something is
      amiss with the
      attack.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Magic Arms and Armor, <em>nondetection</em>, <em>unholy blight</em>;
      <strong>Price</strong> +2,500 gp</p>
