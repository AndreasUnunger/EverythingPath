name: Phantom Ammunition
system:
  description:
    value: >-
      <p><strong>Aura</strong> moderate transmutation <strong>CL</strong>
      7th</p><p><strong>Slot</strong> none; <strong>Price</strong> +2,000 gp;
      This special ability can be placed only on ammunition. Ammunition with
      this weapon special ability dissolves 1 round after it is fired.
      Additionally, if the projectile strikes true, the wound closes after the
      ammunition disintegrates. The weapon deals normal damage, but leaves
      behind no visible trace of foul play.<p>The listed price is for 50 pieces
      of phantom
      ammunition.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Magic Arms and Armor, <em>disintegrate</em>, <em>make whole</em>;
      <strong>Price</strong> 1,000 gp</p>
