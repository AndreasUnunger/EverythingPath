name: Righteous
system:
  description:
    value: >-
      <p><strong>Aura</strong> moderate transmutation <strong>CL</strong>
      10th</p><p><strong>Slot</strong> armor quality; <strong>Price</strong>
      +27,000 gp;</p><p>Armor with this special ability is often engraved or
      enameled with religious symbols. Once per day on command, the wearer can
      invoke an effect, as per the spell <em>righteous might</em>, lasting for
      10 rounds. <em>Righteous </em>armor is always aligned toward good
      (positive energy), for the effects of <em>righteous might</em>.
      <em>Righteous</em> armor bestows one permanent negative level on any evil
      creature attempting to wear it. The negative level remains as long as the
      armor is worn and disappears when it is removed. This negative level
      cannot be overcome in any way (including by <em>restoration </em>spells)
      while the armor is
      worn.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft Magic
      Arms and Armor, <em>righteous might</em>; <strong>Price</strong> +13,500
      gp</p>
