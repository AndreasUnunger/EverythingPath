    value: >-
      <p><strong>Aura</strong> moderate evocation <strong>CL</strong>
      7th</p><p><strong>Slot</strong> weapon quality; <strong>Price</strong> +2
      bonus;</p><p>A <em>holy </em>weapon is imbued with holy power. This power
      makes the weapon good-aligned and thus bypasses the corresponding damage
      reduction. It deals an extra 2d6 points of damage against all creatures of
      evil alignment. It bestows one permanent negative level on any evil
      creature attempting to wield it. The negative level remains as long as the
      weapon is in hand and disappears when the weapon is no longer wielded.
      This negative level cannot be overcome in any way (including by
      <em>restoration </em>spells) while the weapon is
      wielded.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Magic Arms and Armor, <em>holy smite</em>, creator must be good;
      <strong>Price</strong> -</p>
