    value: >-
      <p><strong>Aura</strong> moderate transmutation <strong>CL</strong>
      9th</p><p><strong>Slot</strong> weapon quality; <strong>Price</strong> +2
      bonus;</p><p>This special ability can only be placed on melee weapons that
      are not light weapons. An <em>impact </em>weapon delivers a potent kinetic
      jolt when it strikes, dealing damage as if the weapon were one size
      category larger. In addition, any bull rush combat maneuver the wielder
      attempts while wielding the weapon gains a bonus equal to the weapon's
      enhancement bonus;</p><p>this includes all bull rush attempts, not only
      those in which a weapon is used, such as Bull Rush Strike, Shield Slam, or
      Unseat.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Magic Arms and Armor, <em>bull's strength</em>, <em>lead blades</em>
      (<em>Advanced Player's Guide</em>), <em>righteous might </em>or <em>giant
      form I</em>; <strong>Price</strong> -</p>
