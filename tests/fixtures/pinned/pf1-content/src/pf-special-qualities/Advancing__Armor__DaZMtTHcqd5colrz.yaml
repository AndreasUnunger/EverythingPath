      5th</p><p><strong>Slot</strong>&nbsp;armor
      quality;&nbsp;<strong>Price</strong>&nbsp;+1
      bonus;&nbsp;<strong>Weight</strong>&nbsp;-</p><h3>Description</h3><p>A
      suit of armor with the&nbsp;<em>advancing</em>&nbsp;special ability allows
      its wearer to move through fallen enemies to the forefront of any
      conflict. Once per round when the wearer of a suit
      of&nbsp;<em>advancing</em>&nbsp;armor reduces an opponent to 0 hit points
      or fewer with a melee attack, she can immediately move up to 10 feet as a
      free action. This movement does not provoke attacks of opportunity. If
      this armor is created as barding, the effect is triggered if either the
      mount or its rider reduces an opponent to 0 hit points or fewer, and
      allows the mount to move up to 10 feet.
      The&nbsp;<em>advancing</em>&nbsp;special ability can be applied only to
      heavy
      armor.</p><h3>Construction</h3><p><strong>Requirements</strong>&nbsp;Craft
      Magic Arms and Armor,&nbsp;<em>deadly
      juggernaut</em><sup>UC</sup>;&nbsp;<strong>Price</strong>&nbsp;+1
      bonus</p>
