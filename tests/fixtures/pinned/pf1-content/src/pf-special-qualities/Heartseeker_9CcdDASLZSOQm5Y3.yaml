      <p><strong>Aura</strong> moderate necromancy <strong>CL</strong>
      7th</p><p><strong>Slot</strong> weapon quality; <strong>Price</strong> +1
      bonus;</p><p>This special ability can only be placed on melee weapons. A
      <em>heartseeker </em>weapon is drawn unerringly toward beating hearts. A
      <em>heartseeker </em>weapon ignores the miss chance for concealment
      against most living targets, though the attack must still target the
      proper square. This special ability does not apply against aberrations,
      oozes, plants, outsiders with the elemental subtype, or any creature
      specifically noted to lack a
      heart.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Magic Arms and Armor, <em>death knell</em>; <strong>Price</strong> -</p>
