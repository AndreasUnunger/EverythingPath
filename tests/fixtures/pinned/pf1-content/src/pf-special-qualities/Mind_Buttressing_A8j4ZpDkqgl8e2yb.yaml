name: Mind Buttressing
system:
  description:
    value: >-
      <p><strong>Aura</strong> faint abjuration <strong>CL</strong>
      12th</p><p><strong>Slot</strong> armor; <strong>Price</strong> +2 bonus;
      <em>Mind buttressing</em> armor grants the wearer a +2 resistance bonus on
      Will saves and renders her immune to possession and mental control
      (including charm and compulsion effects like <em>command</em> and
      <em>charm person</em>). If it's donned by a creature already under the
      influence of such an effect, the creature immediately receives another
      saving throw (if one was allowed to begin with) against the spell or
      effect. If the check is successful, the effects are suppressed until the
      creature removes the armor, after which they resume. This ability can be
      applied only to medium or heavy
      armor.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Magic Arms and Armor, <em>protection from chaos</em>, <em>evil</em>,
      <em>good</em>, or <em>law</em>; <strong>Price</strong> +2 bonus</p>
