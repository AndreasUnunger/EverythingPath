name: Ramming
system:
  description:
    value: >-
      <p><strong>Aura</strong> faint evocation <strong>CL</strong>
      5th</p><p><strong>Slot</strong> shield quality; <strong>Price</strong> +1
      bonus;</p><p>These shields are sturdily built and often bear the device of
      a ram or bull. When the wielder of a <em>ramming </em>shield makes a
      shield bash attack as part of a charge, the shield's enhancement bonus to
      Armor Class applies to the attack and damage rolls. This doesn't stack
      with any existing enhancement the shield has. If the attack hits, as a
      swift action the wielder can attempt a bull rush combat maneuver against
      that target, adding the +2 bonus for charging and the shield's enhancement
      bonus to the combat maneuver check. Only shields that can make a shield
      bash attack can have the <em>ramming
      </em>ability.</p><h3>Construction</h3><p><strong>Requirements</strong>
      Craft Magic Arms and Armor, <em>force punch </em>(<em>Ultimate
      Magic</em>); <strong>Price</strong> +1 bonus</p>
