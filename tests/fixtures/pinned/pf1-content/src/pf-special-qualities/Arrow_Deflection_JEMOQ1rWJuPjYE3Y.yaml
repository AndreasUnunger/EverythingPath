name: Arrow Deflection
system:
  description:
    value: >-
      <p><strong>Aura</strong> faint abjuration <strong>CL</strong>
      5th</p><p><strong>Slot</strong> shield quality; <strong>Price</strong> +2
      bonus;</p><p>This shield protects the wielder as if he had the Deflect
      Arrows feat. Once per round when he would normally be struck by a ranged
      weapon, he can make a DC 20 Reflex save. If the ranged weapon (or piece of
      ammunition) has an enhancement bonus, the DC increases by that amount. If
      he succeeds, the shield deflects the weapon. He must be aware of the
      attack and not flat-footed. Attempting to deflect a ranged weapon doesn't
      count as an action. Exceptional ranged weapons, such as boulders hurled by
      giants or <em>acid arrows</em>, can't be
      deflected.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Magic Arms and Armor, <em>shield</em>; <strong>Price</strong> +2 bonus</p>
