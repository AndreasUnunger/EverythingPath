      bonus;</p><p>This special ability can only be placed on melee weapons.
      When a cavalier wielding a <em>valiant </em>weapon targets a foe with his
      challenge ability, the <em>valiant </em>weapon deals an additional 1d6
      points of damage against that foe. The wielder receives a +2 bonus on
      combat maneuver checks made to disarm or sunder a challenged foe's weapon
      as well as a +4 bonus to his CMD against disarm and sunder attacks from
      that foe.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Magic Arms and Armor, <em>true strike</em>; <strong>Price</strong> -</p>
