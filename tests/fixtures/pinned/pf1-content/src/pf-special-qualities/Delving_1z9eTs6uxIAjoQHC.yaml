    value: >-
      <p><strong>Aura</strong> faint transmutation <strong>CL</strong>
      5th</p><p><strong>Slot</strong> armor quality; <strong>Price</strong>
      +10,000 gp;</p><p>Armor with this special ability grants the wearer a
      burrow speed of 10 feet. This speed allows the wearer to tunnel through
      any type of soil, including rocky soil, but not actual solid stone. This
      special ability does not give the wearer the ability to breathe
      underground, so he must hold his breath or use other magic that provides
      air or allows him to breathe. The wearer gains a +4 bonus on all saving
      throws against landslides, avalanches, tunnel collapses, and similar
      effects.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Magic Arms and Armor, <em>soften earth and stone</em>;
      <strong>Price</strong> +5,000 gp</p>
