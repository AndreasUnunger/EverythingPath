      <p><strong>Aura</strong> moderate enchantment <strong>CL</strong>
      12th</p><p><strong>Slot</strong> weapon quality; <strong>Price</strong> +4
      bonus;</p><p>This special ability can only be placed on ranged weapons or
      ammunition. Each time a ranged weapon or ammunition with this ability hits
      a creature, its magic designates the target. Allies gain a +4 morale bonus
      on melee attack rolls and a +6 morale bonus on melee damage rolls against
      the designated target for 1 round. Multiple successful shots fired at the
      same target do not increase the bonuses or their
      duration.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
