name: Injecting
system:
  description:
    value: >-
      <p><strong>Aura</strong> moderate conjuration <strong>CL</strong>
      5th</p><p><strong>Price</strong> +1 bonus;</p><p><em>Injecting</em>
      weapons feature bulbous pommels and small grooves along their blades,
      allowing them to store and deliver poison. An <em>injecting</em> weapon
      can hold up to 3 doses of injury poison. As a swift action, the wielder of
      an <em>injecting</em> weapon can coat the weapon with 1 dose of one of the
      inserted poisons. Only bladed weapons can be made into <em>injecting</em>
      weapons. Adding a dose of poison to the reservoir is a full-round
      action.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Magic Arms and Armor, <em>delay poison</em>; <strong>Price</strong> -</p>
