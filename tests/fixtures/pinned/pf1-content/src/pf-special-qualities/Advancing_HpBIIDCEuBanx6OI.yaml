name: Advancing
system:
  description:
    value: >-
      <p><strong>Aura</strong>&nbsp;faint
      transmutation&nbsp;<strong>CL</strong>&nbsp;5th</p><p><strong>Slot</strong>&nbsp;weapon
      quality;&nbsp;<strong>Price</strong>&nbsp;+2
      bonus;&nbsp;<strong>Weight</strong>&nbsp;-</p><h3>Description</h3><p>This
      ability can only be placed on melee weapons. Once per round, when the
      wielder damages a creature in melee with
      an&nbsp;<em>advancing&nbsp;</em>weapon, she can take a 5-foot step as a
      swift action after the attack but before the end of her turn. This
      movement does not count against her ability to move or take a 5-foot step
      earlier or later in the round, though using this ability imposes a -2
      penalty on all attack rolls until the start of her next turn. This ability
      may not be used in conjunction with any other ability or effect that
      allows moving as part of an
      attack.</p><h3>Construction</h3><p><strong>Requirements</strong>&nbsp;Craft
      Magic Arms and Armor,&nbsp;<em>feather step&nbsp;</em>(<em>Advanced
      Player's Guide</em>);&nbsp;<strong>Price</strong>&nbsp;-</p>
