      <p><strong>Aura</strong>&nbsp;moderate
      conjuration&nbsp;<strong>CL</strong>&nbsp;8th</p><p><strong>Slot</strong>&nbsp;armor/shield
      quality;&nbsp;<strong>Price</strong>&nbsp;+1
      bonus;&nbsp;<strong>Weight</strong>&nbsp;-</p><h3>Description</h3><p>Armor
      and shields with this special ability excel at blocking the attacks of
      certain types of creatures, similar to a&nbsp;<em>bane&nbsp;</em>weapon's
      excelling against certain foes. Against the designated foe, the item's
      enhancement bonus to AC is +2 better than its actual bonus and provides DR
      2/- against attacks from that foe. This increase in enhancement bonus
      applies only to the armor or shield's enhancement bonus, not to temporary
      bonuses (such as the&nbsp;<em>magic vestment</em>&nbsp;spell). To randomly
      determine the armor or shield's designated foe, use the table for
      the&nbsp;<em>bane&nbsp;</em>weapon special ability (page
      136).</p><h3>Construction</h3><p><strong>Requirements</strong>&nbsp;Craft
      Magic Arms and Armor,&nbsp;<em>summon monster
      I</em>;&nbsp;<strong>Price</strong>&nbsp;+1 bonus</p>
