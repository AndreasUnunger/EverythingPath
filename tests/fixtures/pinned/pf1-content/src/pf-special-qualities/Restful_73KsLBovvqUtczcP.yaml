name: Restful
system:
  description:
    value: >-
      <p><strong>Aura</strong> faint necromancy <strong>CL</strong>
      5th</p><p><strong>Slot</strong> none; <strong>Price</strong> +4,500 gp;
      <p>A suit of <em>restful </em>armor permits the wearer to reduce the
      amount of uninterrupted sleep or rest she needs from 8 hours to 2 hours,
      and the wearer does not become fatigued by sleeping in this armor. She
      recovers hit points and ability damage and endures diseases, poisons, or
      other afflictions as if she had slept through the night in a comfortable
      bed, awakening refreshed. Additional rest time in this armor does not
      confer extra healing (as would be gained with complete bed rest), nor can
      the wearer benefit from the armor's effect more than once per
      day.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft Magic
      Arms and Armor, <em>nap stack</em><sup>APG</sup>; <strong>Price</strong>
      2,250 gp</p>
