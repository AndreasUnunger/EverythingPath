    value: >-
      <p><strong>Aura</strong> moderate evocation <strong>CL</strong>
      7th</p><p><strong>Slot</strong> shield quality; <strong>Price</strong> +1
      bonus;</p><p>A shield with this ability rings loudly when struck in
      combat. As an immediate action when the wearer is hit by an attack, the
      wearer can activate the shield to create a deafening bang equivalent to a
      thunderstone. If the attack is a critical hit, the wearer can instead
      create a <em>sound burst </em>(Fortitude DC 13 partial). The wearer
      decides the area for either effect, but must include the attacker in the
      area. Neither ability affects the
      wearer.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Magic Arms and Armor, <em>deafness</em>, <em>sound burst</em>;
      <strong>Price</strong> +1 bonus</p>
