name: Brawling
system:
  description:
    value: >-
      <p><strong>Aura</strong> faint transmutation <strong>CL</strong>
      5th</p><p><strong>Slot</strong> armor quality; <strong>Price</strong> +3
      bonus;</p><p>The wearer of <em>brawling </em>armor gains a +2 bonus on
      unarmed attack and damage rolls, including combat maneuver checks made to
      grapple. Her unarmed strikes count as magic weapons for the purpose of
      bypassing damage reduction. These bonuses do not apply to natural weapons.
      This special ability does not prevent the wearer's unarmed strikes from
      provoking attacks of opportunity or make the wearer's unarmed strikes
      count as armed attacks. The <em>brawling </em>ability can be applied only
      to light armor.</p><h3>Construction</h3><p><strong>Requirements</strong>
      Craft Magic Arms and Armor, <em>bull's strength</em>;
      <strong>Price</strong> +3 bonus</p>
