name: Harvesting
system:
  description:
    value: >-
      <p><strong>Aura</strong> moderate necromancy <strong>CL</strong>
      9th</p><p><strong>Slot</strong> none; <strong>Price</strong> +2
      bonus;</p><p>A <em>harvesting</em> weapon siphons away mythic power from
      one mythic creature to empower another. Whenever a mythic wielder confirms
      a critical hit against another mythic creature, the weapon leeches away
      one use of the target's mythic power and transfers it to the wielder. If
      the wielder already has her maximum number of uses of mythic power, the
      target's use of mythic power is still leeched, but the wielder doesn't
      gain it. The weapon can do this a number of times per day equal to the
      enhancement bonus of the weapon.<p>If the <em>harvesting</em> weapon is a
      legendary item (see page 169), the wielder can have the mythic power that
      is leeched replenish one of that weapon's uses of legendary power. Only
      melee weapons can have this
      ability.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Magic Arms and Armor, Mythic Crafter, <em>steal power</em>;
      <strong>Price</strong> -</p>
