name: Clustershot
system:
  description:
    value: >-
      <p><strong>Aura</strong> weak transmutation <strong>CL</strong>
      5th</p><p><strong>Slot</strong> weapon quality; <strong>Price</strong> +1
      bonus;</p><p>These arrows are inscribed with a spiral groove down the
      length of the haft and an eye-glyph on the head. They are designed to
      maintain accuracy when firing multiple arrows at the same time (such as
      with the Manyshot feat) by steering their paths toward the impact point of
      the first arrow. For a <em>clustershot arrow</em> to function, all arrows
      fired in the attack must have this property. If the first arrow can deal
      sneak attack damage or is a critical hit, the remaining arrows from that
      shot can deal half normal sneak attack damage, and if they critically hit
      deal half normal critical hit
      damage.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Magic Arms and Armor, <em>magic weapon</em>; <strong>Price</strong> -</p>
