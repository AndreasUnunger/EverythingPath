    value: >-
      <p><strong>Aura</strong> moderate enchantment <strong>CL</strong>
      10th</p><p><strong>Slot</strong> weapon quality; <strong>Price</strong> +3
      bonus;</p><p>This special ability can only be placed on melee weapons. A
      <em>repositioning </em>weapon grants the wielder a +2 enhancement bonus on
      combat maneuver checks to reposition a foe (<em>Advanced Player's Guide
      </em>322). I f the wielder confirms a critical hit with the weapon, he can
      attempt to reposition his opponent as a free action. These reposition
      attempts still provoke attacks of opportunity as normal. A weapon cannot
      have both the <em>anchoring </em>and <em>repositioning </em>special
      abilities.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Magic Arms and Armor, <em>telekinesis</em>; <strong>Price</strong> -</p>
