name: Exhausting
system:
  description:
    value: >-
      <p><strong>Aura</strong> strong necromancy <strong>CL</strong>
      12th</p><p><strong>Slot</strong> none; <strong>Price</strong> +3 bonus;
      <p>This ability can be placed only on melee weapons. An <em>exhausting
      </em>weapon can bring a great weariness to opponents in battle. On a
      critical hit, the wielder can choose to forgo the additional damage dice
      to instead sap the struck creature's strength and stamina, causing it to
      become exhausted. Opponents that are already exhausted don't suffer any
      additional effects, and creatures immune to the effects of exhaustion or
      to critical hits are not
      affected.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Magic Arms and Armor, <em>ray of exhaustion</em>; <strong>Price</strong>
      -</p>
