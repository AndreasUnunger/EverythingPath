name: Calming
system:
  description:
    value: >-
      <p><strong>Aura</strong> faint enchantment <strong>CL</strong>
      5th</p><p><strong>Slot</strong> none; <strong>Price</strong> +1 bonus;
      <p><em>Calming </em>armor is dyed or stained a soothing color, usually
      blue. As a swift action, the wearer can create a 5-foot aura around her
      that quiets the emotions of any agitated opponent threatening her. A
      creature that is raging or under an emotion effect must succeed at a DC 15
      Will saving throw or those effects are suppressed (but not dispelled) for
      as long as the aura persists. The aura can be used up to 10 rounds each
      day, though the rounds don't need to be consecutive. Ending the aura is a
      swift action.</p><h3>Construction</h3><p><strong>Requirements</strong>
      Craft Magic Arms and Armor, <em>calm emotion</em>; <strong>Price</strong>
      +1 bonus</p>
