name: Exclusionary
system:
  description:
    value: >-
      <p><strong>Aura</strong> faint necromancy <strong>CL</strong>
      1st</p><p><strong>Slot</strong> none; <strong>Price</strong> +3,750 gp;
      <p>When the wielder of an <em>exclusionary </em>weapon damages a creature
      with it, she can choose to not affect that creature with any channel
      energy ability she uses within the next minute. The maximum number of
      targets the wielder can exclude at one time is equal to her Wisdom bonus
      plus the enhancement bonus of the <em>exclusionary </em>weapon. If the
      wielder of an <em>exclusionary </em>weapon strikes a creature that would
      cause her to go over this limit, she loses the ability to exclude the
      target she has been excluding for the longest amount of
      time.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft Magic
      Arms and Armor, Selective Channeling, <em>sanctuary</em>;
      <strong>Price</strong> 1,875 gp</p>
