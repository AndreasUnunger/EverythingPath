name: Flamboyant
system:
  description:
    value: >-
      <p><strong>Aura</strong> moderate transmutation <strong>CL</strong>
      8th</p><p><strong>Slot</strong> none; <strong>Price</strong> +1 bonus;
      This special ability can be placed only on one-handed or light piercing
      melee weapons. A <em>flamboyant </em>weapon has its own magical reservoir
      of panache that its wielder can spend to use her deeds. Usually this
      panache is stored within a jewel or other adornment. This reservoir holds
      1 panache point, which is refreshed at the start of each day.<p>Whether or
      not the wielder of a <em>flamboyant </em>weapon has any deeds, she can
      always spend 1 panache point from the <em>flamboyant </em>weapon to reroll
      an attack made with it that missed due to rolling a natural 1. When the
      wielder does so, she must take the second result, even if it also
      misses.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Magic Arms and Armor, <em>heroism</em>, creator must be a panache user;
      <strong>Price</strong> -</p>
