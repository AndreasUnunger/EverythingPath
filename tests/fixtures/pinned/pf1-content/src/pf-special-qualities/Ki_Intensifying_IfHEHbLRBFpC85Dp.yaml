name: Ki Intensifying
system:
  description:
    value: >-
      <p><strong>Aura</strong> strong transmutation <strong>CL</strong>
      12th</p><p><strong>Slot</strong> weapon quality; <strong>Price</strong> +2
      bonus;</p><p>The weapon channels and amplifies the wielder's <em>ki</em>,
      allowing her to use her special <em>ki</em> attacks through the weapon as
      though they were unarmed attacks. These attacks include the monk's <em>ki
      </em>strike, quivering palm, and the Stunning Fist feat. The save DC for
      <em>ki</em> abilities used through the weapon increases by half the
      enhancement bonus of the weapon (minimum 1).<p>After a successful strike
      with a <em>ki intensifying</em> weapon, the wielder can spend 1
      <em>ki</em> point as a swift action to perform a combat maneuver to bull
      rush, disarm, reposition, or trip as a free action without provoking
      attacks of opportunity. Any bonuses or penalties applicable to the weapon
      attack also apply to this combat maneuver check. The wielder cannot move
      from her space as a part of the chosen maneuver.</p><p>Only melee weapons
      can have the <em>ki intensifying</em> ability. It cannot be placed on an
      <em>amulet of mighty fist </em>or similar non-weapon item. Weapons with
      the <em>ki focus</em> ability can be upgraded to be <em>ki
      intensifying</em>.</p><h3>Construction</h3><p><strong>Requirements</strong>
      Craft Magic Arms and Armor, creator must be a monk; <strong>Price</strong>
      -</p>
