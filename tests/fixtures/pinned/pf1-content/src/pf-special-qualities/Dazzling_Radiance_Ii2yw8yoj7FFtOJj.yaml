name: Dazzling Radiance
system:
  description:
    value: >-
      <p><strong>Aura</strong> moderate illusion <strong>CL</strong>
      7th</p><p><strong>Price</strong> +1 bonus;</p><p>This special weapon
      ability can be placed on only melee weapons. When a character wielding a
      <em>dazzling radiance</em> weapon uses the Dazzling Display feat, the
      weapon flashes in a burst of bright color. All creatures within 15 feet of
      the wielder who can see the display must attempt a DC 17 Fortitude save.
      Those who fail are blinded for 2 rounds and dazzled for an additional 1d4
      rounds; those who succeed are instead dazzled for 1d4
      rounds.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Magic Arms and Armor, <em>color spray</em>; <strong>Price</strong> -</p>
