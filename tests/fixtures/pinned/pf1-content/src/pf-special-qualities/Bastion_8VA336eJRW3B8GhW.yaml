name: Bastion
system:
  description:
    value: >-
      <p><strong>Aura</strong> strong abjuration <strong>CL</strong>
      15th</p><p><strong>Slot</strong> shield quality; <strong>Price</strong> +4
      bonus;</p><p>A <em>bastion</em> shield grants its wielder the ability to
      shrug off mind-affecting effects for a limited time. Whenever the wielder
      of a <em>bastion</em> shield fails a Will saving throw against a
      mind-affecting effect, the shield suppresses this effect for a number of
      rounds equal to its enhancement bonus. During this time, the
      <em>bastion</em> shield loses its enhancement bonus. If the wearer of a
      <em>bastion</em> shield drops or loses it, any suppressed mind-affecting
      effect immediately takes effect. The <em>bastion</em> special ability can
      be applied only to heavy shields and tower
      shields.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Magic Arms and Armor, <em>mind blank</em>; <strong>Price</strong> +4
      bonus</p>
