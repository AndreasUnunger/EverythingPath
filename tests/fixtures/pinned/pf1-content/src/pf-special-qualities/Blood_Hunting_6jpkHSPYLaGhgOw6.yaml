name: Blood-Hunting
system:
  description:
    value: >-
      <p><strong>Aura</strong> moderate conjuration <strong>CL</strong>
      8th</p><p><strong>Slot</strong> none; <strong>Price</strong> +1
      bonus;</p><p>A <em>blood-hunting</em> weapon excels against enemies with
      the bloodline class feature. Against a designated foe, the weapon's
      enhancement bonus is 2 better than its actual bonus. It also deals an
      additional 2d6 points of damage against such foes. When combined with
      abilities like <em>bane </em>or <em>spirit-hunting</em>, the enhancement
      bonus increases granted by these abilities don't stack, but an extra 1d6
      points of damage are added to the additional damage for each special
      ability beyond the first. (For example, a <em>bane blood-hunting
      </em>weapon would deal 3d6 additional points of damage, and a <em>bane
      blood-hunting spirit-hunting</em> weapon would deal 4d6 additional points
      of damage.) To randomly determine a weapon's designated foe, roll on the
      following table. Other designated foes are possible, but most of these
      weapons are tuned against creatures with the following
      bloodlines.</p><table><tbody><tr><td><strong>d%</strong></td><td><strong>Designated
      Foe</strong></td></tr>
      <tr><td>01-05</td><td>Aberrant</td></tr><tr><td>06-15</td><td>Abyssal</td></tr><tr><td>16-30</td><td>Arcane</td></tr><tr><td>31-35</td><td>Celestial</td></tr><tr><td>36-40</td><td>Destined</td></tr><tr><td>41-50</td><td>Draconic</td></tr><tr><td>51-60</td><td>Elemental</td></tr><tr><td>61-70</td><td>Fey</td></tr><tr><td>71-80</td><td>Infernal</td></tr><tr><td>81-90</td><td>Undead</td></tr><tr><td>91-100</td><td>Other</td></tr></tbody></table><h3>Construction</h3><p><strong>Requirements</strong>
      Craft Magic Arms and Armor, <em>summon monster I</em>;
      <strong>Price</strong> -</p>
