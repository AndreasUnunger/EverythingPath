    value: >-
      <p><strong>Aura</strong> moderate transmutation <strong>CL</strong>
      6th</p><p><strong>Slot</strong> none; <strong>Price</strong> +1 bonus;
      This special ability can be placed only on melee weapons. Once per day, a
      <em>growing</em> weapon is able to grow by one size category, dealing
      damage as appropriate for its new size and allowing its wielder to affect
      creatures one size larger than normal with combat maneuvers limited by
      size. The wielder is able to use the weapon normally without penalty
      despite its increased size. The weapon remains at its increased size for
      10 minutes.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Magic Arms and Armor, <em>enlarge person</em>; <strong>Price</strong>
      -</p>
