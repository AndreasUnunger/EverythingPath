  description:
    value: >-
      <p><strong>Type</strong> inhaled, ingested, or injury;
      <strong>Addiction</strong> major, Fortitude DC
      18</p><p><strong>Effect</strong> 1 hour; +1d8 temporary hit points, +2
      alchemical bonus on saving throws made against spells and effects with the
      curse or disease descriptor, fatigue. If the user is addicted for more
      than a week straight, she has a cumulative +5% chance of transforming into
      a ghoul every week she remains addicted.</p><p><strong>Damage</strong> 1d2
      Wis damage</p><p>Perhaps the strangest of the valuables removed from the
      dusty tombs of Osirion is the flesh of the dead itself. During the years
      of satrapy-dominated Osirion and later under the rule of Keleshite
      sultans, a highly prized royal physician of Osirian descent by the name of
      Merenfren used a previously unknown black, tarlike substance as an
      ingredient in numerous salves, potions, and pills she concocted to treat
      ailments and revitalize her wealthy clientele.</p><p>Calling the drug
      mumia, Merenfren managed to keep the key ingredient of her potent cure-all
      hidden from her patients until 2271 AR, when a rival scholar finally
      discovered her sinister secret: Mumia was nothing more than the f lesh of
      carefully preserved corpses excavated from Osirian tombs. Even the sweet
      elixir that she sold as the “water of life” was merely a diluted substance
      derived from the body of a young child preserved in a jar of honey.
      Merenfren was quickly tried and executed for her crimes, including the
      desecration of the dead as well as tricking her noble patients into
      consuming the vile substance. However, it was too late to undo the
      chemist's discoveries—she had already left her mark on Osirian society by
      inspiring an entire subculture based on the trade and consumption of
      mumia. An extensive black market took hold in Osirion's grisly underworld,
      and even the Keleshite masters of Osirion continued to partake of the foul
      drug made from the dead. The mysterious disappearances of mumia addicts
      were often attributed to their contact with the Osirian criminal element
      rather than any of the drug's long-lasting side effects, but mumia sellers
      knew better and took care to not get hooked to the drug
      themselves.</p><p>Even today, mumia made from the bodies of properly
      prepared and aged corpses—as well as cheap, knock-off mumia made from the
      embalmed bodies of animals or the recently dead—fetches a fine price in
      the back alleysof Sothis and other major cities in northern Garund. An
      unscrupulous graverobber need not hawk only fineries and art anymore, but
      can profit immensely from the act of plundering mummified bodies as well
      if she knows where to pawn them.</p><p>Cheap, imitation mumia made from
      the recently deceased or improperly treated bodies has the same stats as
      mumia, but the benefits are rendered at 50% their normal potency and for
      half the duration.</p>
