name: Varisian Idol
system:
  description:
    value: >-
      <p>Scavenged from mysterious monuments, these depictions of forgotten
      figures and nameless spirits are often sold as good luck charms, but most
      commoners don't know that they can also be used to augment magic. Seven
      types of Varisian idols exist; those that affect evocation, transmutation,
      and illusion are the most common. Varisians associate each type of idol
      with their peoples' names for the various schools of magic.</p><p>If used
      as an additional material component when casting a spell the idol affects,
      a Varisian idol increases the effect of that spell. Using multiple idols
      to cast a spell has no additional effect. A Varisian idol is destroyed
      after one use.</p><p><em>Avaria</em>: When used to cast <em>bear's
      endurance</em>, <em>bull's strength</em>, <em>cat's grace</em>,
      <em>eagle's splendor</em>, <em>fox's cunning</em>, or <em>owl's
      wisdom</em>, the spell grants a +5 enhancement bonus to the affected
      ability score.</p><p><em>Avidais</em>: When used to cast a spell that
      allows you to make a dispel check (such as <em>dispel magic </em>or
      <em>mage's disjunction</em>), you gain a +2 bonus on that check.</p><p>
      <em>Carnasia</em>: When used to cast any spell of the charm subschool, a
      threatened target does not gain the usual +5 bonus on its saving throw to
      resist the effect.</p><p><em>Idolis</em>: When used to cast <em>summon
      monster </em>or <em>summon nature's ally</em>, the summoned creature's
      maximum hit points increase by +2 for every Hit Die it
      possesses.</p><p><em>Ragario</em>: When used to cast a spell that deals
      energy damage, you gain a +2 bonus on caster level checks made to overcome
      spell resistance.</p><p><em>Vangloris</em>: When used to cast a spell of
      the glamer subschool with a duration measured in minutes or less (such as
      <em>displacement </em>or <em>invisibility</em>), the effects of that spell
      persist for 1 round longer than normal.</p><p><em>Voratalo</em>: When used
      to cast a spell of the necromancy school that deals hit point damage, you
      also deal a number of points of bleed damage equal to the spell level.
      This bleed effect lasts for 5 rounds.</p>
