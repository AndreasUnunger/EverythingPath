    value: >-
      <h3>Background Details</h3><p>The spindle of perfect knowledge is large,
      bright, and flawless marquise-cut diamond ioun stone the size of a
      halfling's fist. The gemstone would be a treasure in itself if it lacked
      magic, but it is also a powerful ioun stone.</p><h3>Effect</h3><p>The
      spindle of perfect knowledge functions like a
      @UUID[Compendium.pf1.items.Item.RTqAMP4th4qhWIQu]{headband of mental
      superiority} +4 and grants 5 ranks in two random Knowledge skills. The
      wearer can communicate and understand languages as if using
      @UUID[Compendium.pf1.spells.Item.jcs7ba5depdyitey]{comprehend languages},
      @UUID[Compendium.pf1.spells.Item.m1rmcpcaixcpz9ib]{tongues}, and
      @UUID[Compendium.pf1.spells.Item.lovx4kiq18gbvg4e]{telepathy} with a range
      of 100 feet.</p><h3>Destruction</h3><p>The spindle of perfect knowledge is
      destroyed if worn by a mindless creature for an entire year.</p>
