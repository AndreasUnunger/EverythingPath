name: Decoy's Misdirection
system:
  description:
    value: >-
      <p><em>You can fool scrying attempts by using your
      familiar.</em></p><p><strong>Prerequisites</strong>: Must have a familiar
      with the decoy archetype (see page 10).</p><p><strong>Benefits</strong>:
      As long as your familiar is within 30 feet of you, anytime you succeed at
      a Will save to negate a scrying effect (including scrying and greater
      scrying), you become aware of the scrying attempt as though you succeeded
      at the Spellcraft check to identify it, and you can choose to let the
      spell function as normal instead of causing it to fail. If you do, you can
      choose to redirect the scrying effect toward your familiar, causing the
      familiar to immediately change shape (as its secret sharer spell-like
      ability, except the duration is as long as the scrying effect lasts). The
      creator of the scrying effect observes the familiar as though it were you,
      though spells such as detect magic detect the alter self effect as
      normal.</p>
  tags:
    - Familiar
type: feat
