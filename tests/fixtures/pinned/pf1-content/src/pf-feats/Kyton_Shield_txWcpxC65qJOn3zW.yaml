name: Kyton Shield
system:
  description:
    value: >-
      <p><em>Whether in your hand or draped around your body, the spiked chain
      serves as both weapon and
      shield.</em></p><p><strong>Prerequisites</strong>: Wis 15, Exotic Weapon
      Proficiency (spiked chain), Kyton Style, base attack bonus +5, Knowledge
      (planes) 3 ranks, ki pool class feature.</p><p><strong>Benefits</strong>:
      When using Kyton Style, you gain a +1 shield bonus to your Armor Class as
      long as you are wielding a spiked chain. If the spiked chain is magical,
      add 1/2 its enhancement bonus to this shield bonus. If the spiked chain
      has the vicious ability, instead add its full enhancement bonus to the
      shield bonus.</p>
  tags:
    - Combat
    - Monster
    - Kyton
type: feat
