name: Woodland Wraith
system:
  description:
    value: >-
      <p><em>You put the terrain between yourself and your opponents to avoid
      attacks.</em></p><p><strong>Prerequisites</strong>: Dex 15, Dodge, base
      attack bonus +6.</p><p><strong>Benefits</strong>: If you take two actions
      to move or a withdrawal action in a turn while starting or ending your
      movement in either naturally occurring difficult terrain (bushes,
      brambles, etc.) or a space with a natural object providing at least
      partial cover (a tree, rock, etc.), you gain concealment until you attack,
      until you move out of that space, or until the end of your next turn,
      whichever occurs first.</p>
  tags:
    - Combat
type: feat
