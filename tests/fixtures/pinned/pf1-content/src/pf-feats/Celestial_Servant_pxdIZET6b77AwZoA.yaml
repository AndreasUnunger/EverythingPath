name: Celestial Servant
system:
  description:
    value: >-
      <p><em>Rather than being a normal animal or beast, your companion or
      familiar hails from the heavenly
      realms.</em></p><p><strong>Prerequisites</strong>: Aasimar, animal
      companion, familiar, or mount class
      feature.</p><p><strong>Benefits</strong>: Your animal companion, familiar,
      or mount gains the celestial template and becomes a magical beast, though
      you may still treat it as an animal when using Handle Animal, wild
      empathy, or any other spells or class abilities that specifically affect
      animals.</p>
  tags:
    - Racial
    - Aasimar
type: feat
