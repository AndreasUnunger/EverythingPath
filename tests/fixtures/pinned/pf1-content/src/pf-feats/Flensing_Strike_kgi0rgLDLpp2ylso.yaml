name: Flensing Strike
system:
  description:
    value: >-
      <p><em>Your slashing sneak attacks tend to slice away swaths of skin and
      natural armor.</em></p><p><strong>Prerequisites</strong>: Sneak attack
      +3d6, bleeding sneak attack rogue trick or bleed universal monster
      ability.</p><p><strong>Benefits</strong>: When you successfully inflict
      sneak attack damage on a foe with a slashing weapon, your attack doesn't
      go particularly deep, but you do carve away a significant portion of skin
      and flesh. If this sneak attack inflicts bleed damage, the victim of the
      sneak attack is sickened by the pain and has its natural armor bonus (if
      any) reduced by a number of points equal to the number of sneak attack
      dice you possess. These penalties persist as long as the bleed damage
      persists. Multiple strikes on the same foe do not stack the bleed damage,
      but the penalty to natural armor does stack, to a maximum penalty equal to
      the target's normal full natural armor score.</p>
  tags:
    - General
type: feat
