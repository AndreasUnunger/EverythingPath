name: Cautious Fighter
system:
  description:
    value: >-
      <p><em>You care more about survival than
      victory.</em></p><p><strong>Prerequisites</strong>:
      Halfling.</p><p><strong>Benefits</strong>: When fighting defensively or
      using total defense, your dodge bonus to AC increases by 2.</p><h3>Combat
      Trick</h3><p>When not fighting defensively or using total defense, you can
      spend 5 stamina points to increase your dodge bonus by 2. This increase
      lasts until the start of your next turn.</p>
  tags:
    - Combat
    - Racial
    - Halfling
    - Combat Trick
type: feat
