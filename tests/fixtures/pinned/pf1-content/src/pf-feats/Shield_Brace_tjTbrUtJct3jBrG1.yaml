name: Shield Brace
system:
  description:
    value: >-
      <p><em>You've mastered the art of balancing a polearm's weight against a
      shield's stability.</em></p><p><strong>Prerequisites</strong>: Shield
      Focus; base attack bonus +3 or fighter level 1st; proficiency with light
      shields, heavy shields, or tower shields.</p><p><strong>Benefits</strong>:
      You can use a two-handed weapon sized appropriately for you from the
      polearm or spears weapon group while also using a light, heavy, or tower
      shield with which you are proficient. The shield's armor check penalty (if
      any) applies to attacks made with the weapon.</p><p><strong>Combat
      Trick</strong>: You can spend 1 stamina point to negate the penalty on
      attacks for using this feat for a single round. (See page 19.)</p><p><br
      /><strong>Pathfinder Society<br /></strong>When using the Shield Brace
      feat, treat the polearm or spear as a one-handed weapon. More
      specifically, when calculating the damage the weapon deals, it uses your
      Strength bonus instead of 1.5 times your Strength bonus, and it counds as
      a one-handed weapon when determining extra damage from the Power Attack
      feat. You may use Two-Weapon Fighting and other feats as if the polearm
      were a one handed weapon.</p>
  tags:
    - Combat
    - Shield Mastery
type: feat
