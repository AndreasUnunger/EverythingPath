name: Wave Master
system:
  description:
    value: >-
      <p><em>Gozreh has seen fit to bless you as an uncommonly skilled
      swimmer.</em></p><p><strong>Prerequisites</strong>: Worshiper of
      Gozreh.</p><p><strong>Benefits</strong>: When you succeed at a Swim check,
      you can move your full speed as a full-round action or half your speed as
      a move action. This does not grant you the benefit of having a swim
      speed.</p><p><strong>Normal</strong>: A successful Swim check allows you
      to move up to half your speed as a full-round action or up to a quarter
      your speed as a move action.</p>
  tags:
    - General
type: feat
