name: Mantis Style
system:
  description:
    value: >-
      <p><em>You have learned to target vital areas with crippling
      accuracy.</em></p><p><strong>Prerequisites</strong>: Improved Unarmed
      Strike, Stunning Fist, Heal 3 ranks.</p><p><strong>Benefits</strong>: You
      gain one additional Stunning Fist attempt per day. While using this style,
      you gain a +2 bonus to the DC of effects you deliver with your Stunning
      Fist.</p><h3>Combat Trick</h3><p>While using this style, you can spend 5
      stamina points to use Stunning Fist without expending a use of Stunning
      Fist for the day.</p>
  tags:
    - Combat
    - Style
    - Combat Trick
type: feat
