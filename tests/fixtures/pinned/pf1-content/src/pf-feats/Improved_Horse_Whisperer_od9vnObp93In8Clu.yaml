name: Improved Horse Whisperer
system:
  description:
    value: >-
      <p><em>Your understanding of horses goes so deep that you can communicate
      with them as if you shared a
      language.</em></p><p><strong>Prerequisites</strong>: Horse Whisperer,
      Handle Animal 5 ranks, Ride 5 ranks.</p><p><strong>Benefits</strong>: With
      a successful DC 20 Handle Animal check, you can communicate with a horse
      as if you were using speak with animals for 1 round. The horse's ability
      to communicate and take actions is still limited by its intelligence.</p>
  tags:
    - General
type: feat
