name: Goblin Gunslinger
system:
  description:
    value: >-
      <p><em>You have learned how to fire the big
      guns.</em></p><p><strong>Prerequisites</strong>:
      Goblin.</p><p><strong>Benefits</strong>: You can wield Medium firearms
      without taking the penalty for an inappropriately sized
      weapon.</p><p><strong>Normal</strong>: You take a -2 penalty when using an
      inappropriately sized weapon.</p><h3>Combat Trick</h3><p>When wielding a
      firearm that deals fire damage, when you threaten but fail to confirm a
      critical hit, you can spend 5 stamina points to regain 1 grit point. You
      still can't gain a grit point if the target is immune to critical
      hits.</p>
  tags:
    - Combat
    - Racial
    - Goblin
    - Combat Trick
type: feat
