name: Cleansing Burst
system:
  description:
    value: >-
      <p><em>Your channeled energy wards off
      disease.</em></p><p><strong>Prerequisites</strong>: Able to cast remove
      disease or the ability to cure disease with a mercy, channel positive
      energy class feature.</p><p><strong>Benefits</strong>: When you channel
      positive energy to harm or turn undead creatures, any undead creatures in
      the area lose the ability to cause disease with their melee and ranged
      attacks for 1d4+1 rounds. If an undead creature successfully saves against
      your channeled energy, this duration is reduced to 1 round for that
      creature. Immunity to positive energy negates this ability.</p><p>When you
      channel positive energy to heal living creatures, any living creatures in
      the area gain a +4 sacred bonus on saving throws against disease for 1d4+1
      rounds. Creatures not healed by positive energy receive no benefit.</p>
  tags:
    - General
type: feat
