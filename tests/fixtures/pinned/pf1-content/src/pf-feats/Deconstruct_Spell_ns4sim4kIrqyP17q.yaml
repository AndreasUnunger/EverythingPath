name: Deconstruct Spell
system:
  description:
    value: >-
      <p><em>You deconstruct a spell into its constituent glyphs, storing them
      to replenish your crystalline
      dust.</em></p><p><strong>Prerequisites</strong>: Improved Counterspell or
      ability to cast dispel magic or greater dispel magic, aphorite,
      crystalline dust racial trait.</p><p><strong>Benefits</strong>: Once per
      day when you successfully counterspell or dispel a spell, you can instead
      deconstruct the spell to regain a number of rounds of your crystalline
      dust racial trait equal to half the level of the spell. You can't use this
      feat to gain more than your maximum number of rounds of your crystalline
      dust racial trait.</p>
  tags:
    - Racial
    - Aphorite
type: feat
