name: Ancient Draconic
system:
  description:
    value: >-
      <p><em>You empower spells using the ancient language of
      dragons.</em></p><p><strong>Prerequisites</strong>: Arcane caster level
      5th, speaks Draconic.</p><p><strong>Benefits</strong>: You gain a +1 bonus
      on caster level checks to overcome spell resistance when casting arcane
      spells that have a verbal component. If you speak Draconic when casting an
      arcane language-dependent spell, all intelligent creatures with a language
      can understand your words.</p>
  tags:
    - General
type: feat
