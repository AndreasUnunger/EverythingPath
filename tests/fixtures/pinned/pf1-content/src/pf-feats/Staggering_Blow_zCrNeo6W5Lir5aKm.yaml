name: Staggering Blow
system:
  description:
    value: >-
      <p><em>You know just where to strike to temporarily stagger a
      foe.</em></p><p><strong>Prerequisites</strong>: Str 13, Power Attack,
      Vital Strike, base attack bonus +8.</p><p><strong>Benefits</strong>: When
      you attack a foe using Vital Strike, you can choose to take a -2 penalty
      on your attack roll to also make the attack a staggering strike. You must
      make this choice before making the attack roll. If your attack roll is
      successful, your target must succeed at a Fortitude saving throw (DC = 10
      + 1/2 your character level + your Strength modifier) or be staggered until
      the start of your next turn. Once a creature that failed its save recovers
      from the effects of your staggering blow, it is immune to the effects of
      this feat for 24 hours. Constructs, oozes, plants, undead, incorporeal
      creatures, and creatures that are immune to critical hits are immune to
      this effect.</p>
  tags:
    - Combat
type: feat
