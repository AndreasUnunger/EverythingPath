name: Hard-Headed
system:
  description:
    value: >-
      <p><em>Your thick skull is almost a weapon unto
      itself.</em></p><p><strong>Prerequisites</strong>: Base attack bonus +1,
      dwarf.</p><p><strong>Benefits</strong>: You gain a +1 bonus on attack
      rolls and combat maneuver checks made using a helmet. You receive a +2
      bonus on saves against spells and special abilities that cause you to
      become staggered or stunned.</p><h3>Combat Trick</h3><p>When targeted by a
      spell or a special ability that could cause you to become staggered or
      stunned, you can spend up to 2 stamina points before attempting the save
      to gain a bonus on the saving throw equal to the number of stamina points
      you spent.</p>
  tags:
    - Combat
    - Racial
    - Dwarf
    - Combat Trick
type: feat
