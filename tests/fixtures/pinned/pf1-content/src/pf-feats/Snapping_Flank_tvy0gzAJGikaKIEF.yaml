name: Snapping Flank
system:
  description:
    value: >-
      <p><em>You can make a swift bite attack against a flanked
      foe.</em></p><p><strong>Prerequisites</strong>: Base attack bonus +9, bite
      attack.</p><p><strong>Benefits</strong>: Whenever you are flanking with an
      ally who also has this feat, as a swift action you can make a bite attack
      against the opponent you and your ally are flanking.</p>
  tags:
    - Combat
    - Teamwork
type: feat
