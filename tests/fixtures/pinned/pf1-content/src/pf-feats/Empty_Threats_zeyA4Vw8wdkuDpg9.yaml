name: Empty Threats
system:
  description:
    value: >-
      <p><em>You have a gift for making authentic-sounding threats you never
      intend to follow through on.</em></p><p><strong>Prerequisites</strong>:
      Bluff 5 ranks.</p><p><strong>Benefits</strong>: You can use the Bluff
      skill to demoralize opponents in combat instead of Intimidate. You can
      attempt a Bluff check in place of an Intimidate check when using the
      Dazzling Display feat and feats that list Dazzling Display as a
      prerequisite. If you use the Bluff skill to demoralize, you cannot use it
      to feint until the beginning of your next turn, and vice versa.</p>
  tags:
    - General
type: feat
