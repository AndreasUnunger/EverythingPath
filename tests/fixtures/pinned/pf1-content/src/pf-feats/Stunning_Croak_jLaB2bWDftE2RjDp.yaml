name: Stunning Croak
system:
  description:
    value: >-
      <p><em>The terrifying force of your croak disorients and debilitates your
      enemies.</em></p><p><strong>Prerequisites</strong>: Sonic Croak, Throat
      Pouch, boggard, terrifying croak.</p><p><strong>Benefits</strong>: When
      you use your terrifying croak ability, instead of imparting its normal
      effect you can choose to stun one creature within 30 feet for 1 round. If
      the target succeeds at a Fortitude save, it is instead staggered for 1
      round. The DC of this Fortitude save is the same as that of your
      terrifying croak ability.</p>
  tags:
    - Monster
    - Boggard
type: feat
