name: Greater Elemental Focus
system:
  description:
    value: >-
      <p><em>Choose an energy type to which you have already applied the
      Elemental Focus feat. Any spells you cast of this energy type are very
      hard to resist.</em></p><p><strong>Prerequisites</strong>: Elemental
      Focus.</p><p><strong>Benefits</strong>: Add +1 to the Difficulty Class for
      all saving throws against spells that deal damage of the energy type you
      select. This bonus stacks with the bonus from Elemental
      Focus.</p><p><strong>Special</strong>: You can gain this feat multiple
      times. Its effects do not stack. Each time you take this feat, it applies
      to a new energy type to which you have already applied the Elemental Focus
      feat.</p>
  tags:
    - General
type: feat
