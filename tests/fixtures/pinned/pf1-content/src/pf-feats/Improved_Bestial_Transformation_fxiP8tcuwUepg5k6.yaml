name: Improved Bestial Transformation
system:
  description:
    value: >-
      <p><em>You have mastered the ability to transform into a variety of
      beasts.</em></p><p><strong>Prerequisites</strong>:
      Vampire.</p><p><strong>Benefits</strong>: You can change shape (as the
      universal monster rule) to assume the form of one of the following beasts,
      as beast shape II: boar, dire bat, giant frog, grizzly bear, hyena,
      leopard, lion, shark, squid, or wolf. This is a supernatural
      ability.</p><p><strong>Special</strong>: You can gain this feat multiple
      times. Each time you take this feat, choose another animal
      transformation.</p>
  tags:
    - Monster
    - Vampire
type: feat
