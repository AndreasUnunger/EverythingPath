name: Tangle Feet
system:
  description:
    value: >-
      <p><em>Creatures who cross your path find themselves tripping over their
      own feet.</em></p><p><strong>Prerequisites</strong>: Dodge, Mobility,
      Underfoot, goblin, Small size or smaller.</p><p><strong>Benefits</strong>:
      When you successfully make an Acrobatics check to avoid provoking an
      attack of opportunity from a larger opponent when you move through its
      threatened area or its space, you can make that opponent lose its balance
      until the end of its next turn as a free action. While that creature's
      balance is lost, if it attempts to move, it must make a successful DC 15
      Acrobatics check or fall prone, wasting the move action. You can only
      affect one creature with this effect each round.</p><p><strong>Combat
      Trick</strong>: When you make an opponent lose its balance with this feat,
      you can spend 2 stamina points to increase the DC of its Acrobatics check
      to avoid falling prone to 20.</p>
  tags:
    - Combat
    - Racial
    - Goblin
type: feat
