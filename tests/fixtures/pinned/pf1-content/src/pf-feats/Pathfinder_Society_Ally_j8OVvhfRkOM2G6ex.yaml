name: Pathfinder Society Ally
system:
  description:
    value: >-
      <p><em>The Pathfinder Society grants you access to its archives in thanks
      for services previously
      rendered.</em></p><p><strong>Prerequisites</strong>: Associate (Pathfinder
      Society).</p><p><strong>Benefits</strong>: The Pathfinder Society's vast
      archives are available for you to exploit. In any settlement that is the
      size of a small town or larger, you can spend 1d4 hours researching notes
      from available Pathfinders to gain a +4 circumstance bonus on a single
      Knowledge check.</p>
