name: Penetrating Possession
system:
  description:
    value: >-
      <p><em>Your ability to possess foes can bypass magical
      protections.</em></p><p><strong>Prerequisites</strong>: Magic jar as a
      known spell or spell-like ability, Cha 21</p><p><strong>Benefits</strong>:
      The first time you attempt to possess a host under the effect of
      protection from evil spell or any similar spell, you have a chance to
      dispel that spell as if you had cast dispel magic on the spell.</p>
  tags:
    - General
type: feat
