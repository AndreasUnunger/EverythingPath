    value: >-
      <p><em>You are able to glean insight from your momentary meditation for
      longer than most can.</em></p><p><strong>Prerequisites</strong>: Wis 13,
      Combat Meditation, Meditation Master, character level
      9th.</p><p><strong>Benefits</strong>: Add your Wisdom bonus (if any) to
