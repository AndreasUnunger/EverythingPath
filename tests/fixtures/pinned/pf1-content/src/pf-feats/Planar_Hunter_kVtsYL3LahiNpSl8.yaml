name: Planar Hunter
system:
  description:
    value: >-
      <p><em>After careful study of otherworldly environments, you can quickly
      evaluate how an outsider reacts in its home surroundings. You can use your
      knowledge of the outsider's native environment to guide your attacks and
      overcome the outsider's natural
      resistances.</em></p><p><strong>Prerequisites</strong>: Knowledge (planes)
      5 ranks, favored terrain (any plane) class
      feature.</p><p><strong>Benefits</strong>: When you are on one of the
      planes you've selected as a favored terrain, you gain a +2 bonus on weapon
      attack rolls against outsiders native to that plane. You also ignore up to
      5 points of damage reduction when making weapon attacks against outsiders
      native to that plane, except for damage reduction without a type (such as
      DR 10/--). In addition, you gain this bonus against extraplanar creatures
      you encounter and identify as being from one of your planar favored
      terrains, such as with a successful Knowledge (planes) check, regardless
      of what plane you or they are on.</p><p><strong>Special</strong>: You may
      select this feat multiple times. Each time you take it, you apply it to a
      different qualifying favored terrain.</p>
  tags:
    - General
type: feat
