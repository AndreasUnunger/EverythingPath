name: Death from Above
system:
  description:
    value: >-
      <p><em>You allow gravity to add extra force to your
      charges.</em></p><p><strong>Benefits</strong>: Whenever you charge an
      opponent from higher ground, or from above while flying, you gain a +5
      bonus on attack rolls in place of the bonuses from charging and being on
      higher ground.</p><h3>Combat Trick</h3><p>When charging an opponent from
      higher ground or from above while flying, you can spend 4 stamina points
      to gain a +5 bonus on the damage roll, and also retain the bonuses from
      charging and being on higher ground.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
