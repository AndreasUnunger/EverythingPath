name: Verdant Spell
system:
  description:
    value: >-
      <p><em>Your magical connection to nature allows you to entice, fool, and
      misdirect plants and fungi as though they were
      people.</em></p><p><strong>Prerequisites</strong>: Spell Focus
      (enchantment), Knowledge (nature) 6
      ranks.</p><p><strong>Benefits</strong>: A verdant spell affects plant
      creatures (even mindless plant creatures) as if they weren't immune to
      mind-affecting effects, but it has no effect on other types of creatures.
      A verdant spell uses up a spell slot 2 levels higher than the spell's
      actual level. This feat works only on mind-affecting
      spells.</p><p><strong>Normal</strong>: Creatures of the plant type are
      immune to mind-affecting effects.</p>
  tags:
    - Metamagic
type: feat
