name: Belier's Bite
system:
  description:
    value: >-
      <p><em>Your unarmed strikes cause your opponent to
      bleed.</em></p><p><strong>Prerequisites</strong>: Improved Unarmed
      Strike.</p><p><strong>Benefits</strong>: When you damage an opponent with
      an unarmed strike, you deal an extra 1d4 bleed
      damage.</p><p><strong>Special</strong>: This ability does not stack with
      other special abilities, attacks, or items that allow you to deal bleed
      damage. The belier devil appears in Pathfinder Adventure Path volume
      #12.</p>
  tags:
    - Combat
type: feat
