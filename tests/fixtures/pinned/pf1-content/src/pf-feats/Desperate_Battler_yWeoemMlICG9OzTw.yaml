name: Desperate Battler
system:
  description:
    value: >-
      <p><em>Your experiences fighting against numerous foes that have already
      overwhelmed your allies, friends, and family have forced you to excel at
      fighting on your own.</em></p><p><strong>Benefits</strong>: When no ally
      is within 10 feet of you and you are not receiving benefits from the aid
      another action, you gain a +1 morale bonus on melee attack and damage
      rolls.</p><h3>Combat Trick</h3><p>You can spend 2 stamina points to gain
      the benefits of Desperate Battler even while an ally is within 10 feet of
      you (but not when receiving the benefits of the aid another action).</p>
  tags:
    - Combat
    - Combat Trick
type: feat
