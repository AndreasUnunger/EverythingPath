name: Arcane Armor Training (Mythic)
system:
  description:
    value: >-
      <p><em>You've adapted your spellcasting to overcome limitations of wearing
      armor.</em></p><p><strong>Prerequisites</strong>: Arcane Armor
      Training.</p><p><strong>Benefits</strong>: You don't have to spend a swift
      action to gain the reduction to arcane spell failure chance from Arcane
      Armor Training. Furthermore, if you're wearing light armor, reduce your
      arcane spell failure chance by 20%.</p>
