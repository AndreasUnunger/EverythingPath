name: Stick Together
system:
  description:
    value: >-
      <p><em>You stick close to your allies in
      combat.</em></p><p><strong>Benefits</strong>: When an adjacent ally with
      this feat moves, you can move up to your speed as an immediate action, as
      long as your movement ends adjacent to that ally. If you do so, you are
      staggered on your next turn. This movement provokes attacks of opportunity
      as normal.</p>
  tags:
    - Combat
    - Teamwork
type: feat
