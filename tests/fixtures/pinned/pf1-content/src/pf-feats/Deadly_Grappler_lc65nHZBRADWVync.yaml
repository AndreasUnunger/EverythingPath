img: systems/pf1/icons/feats/greater-grapple.jpg
name: Deadly Grappler
system:
  description:
    value: >-
      <p><em>While you're grappled, you become even more
      dangerous.</em></p><p><strong>Prerequisites</strong>: Dex 13, Improved
      Grapple, Improved Unarmed Strike.</p><p><strong>Benefits</strong>: You
      have learned to leverage a grappling creature's weight against it. While
      you're grappled, attacks you make against the grappler using armor spikes,
      a light or one-handed weapon, a natural weapon, or an unarmed strike deal
      damage as if the strike or weapon were one size category larger than it
      actually is.</p>
  tags:
    - Combat
type: feat
