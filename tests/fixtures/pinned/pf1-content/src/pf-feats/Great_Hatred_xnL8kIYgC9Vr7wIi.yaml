name: Great Hatred
system:
  description:
    value: >-
      <p><em>Your rage burns with vast
      intensity.</em></p><p><strong>Prerequisites</strong>: Gnome, hatred racial
      trait.</p><p><strong>Benefits</strong>: You gain an additional +1 bonus on
      melee and thrown weapon attacks against targets of your hatred racial
      trait.</p><h3>Combat Trick</h3><p>When you hit an opponent of a subtype
      subject to your hatred racial trait, you can spend up to 5 stamina points
      to deal an amount of extra damage equal to double the number of stamina
      points you spent.</p>
  tags:
