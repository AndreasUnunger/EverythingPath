name: Step of the Flighty Fey
system:
  description:
    value: >-
      <p><em>Your spell-like ability taps the magic and resilience of the First
      World.</em></p><p><strong>Prerequisites</strong>: Gathlain, feather step
      spell-like ability.</p><p><strong>Benefits</strong>: A creature under the
      effect of your feather step spell-like ability gains DR 1/cold iron for
      the duration of the effect. If you have at least 8 Hit Dice, the creature
      instead gains DR 2/cold iron, and if you have at least 16 Hit Dice, the
      creature instead gains DR 3/cold iron.</p>
  tags:
    - Racial
    - Gathlain
