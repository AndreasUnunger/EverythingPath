name: Asura Spellrend
system:
  description:
    value: >-
      <p><em>Your blasphemies shatter divine
      magic.</em></p><p><strong>Prerequisites</strong>: Asura Sight, Asura
      Style, base attack bonus +13 or monk level
      13th.</p><p><strong>Benefits</strong>: You can replace one of your attacks
      at your highest base attack bonus each round with a spellrending strike.
      If your spellrending strike hits, it deals no damage, but you can attempt
      to dispel a harmless divine spell affecting this target as per dispel
      magic, with a caster level equal to your character level. If you succeed
      at your dispel check, the target is sickened as if you had interrupted the
      spell with Asura Style and receives no saving throw to reduce the sickened
      duration.</p>
  tags:
    - Combat
type: feat
