name: Bludgeoner
system:
  description:
    value: >-
      <p><em>You can knock foes out cold with just about any blunt
      instrument.</em></p><p><strong>Benefits</strong>: You take no penalty on
      attack rolls for using a lethal bludgeoning weapon to deal nonlethal
      damage.</p><p><strong>Normal</strong>: You take a -4 penalty on attack
      rolls when using a lethal weapon to deal nonlethal damage. You cannot use
      a lethal weapon to deal nonlethal damage in a sneak
      attack.</p><p><strong>Special</strong>: A rogue with this feat can use a
      lethal bludgeoning weapon to deal nonlethal damage with a sneak
      attack.</p><h3>Combat Trick</h3><p>When you make an attack with a lethal
      bludgeoning weapon to deal nonlethal damage, you can spend 2 stamina
      points to treat the weapon's damage as if the weapon were one size
      category larger. This does not stack with any other effects that treat the
      weapon's damage as if the weapon were a larger size.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
