name: Elemental Fist (Mythic)
system:
  description:
    value: >-
      <p><em>Your ability to channel elemental power through your unarmed
      attacks is ferociously potent.</em></p><p><strong>Prerequisites</strong>:
      Elemental Fist.</p><p><strong>Benefits</strong>: The extra energy damage
      dealt by Elemental Fist increases to 1d8 points, and you gain additional
      uses of Elemental Fist per day equal to your tier. You can expend one use
      of mythic power as an immediate action to add the extra damage from your
      Elemental Fist to all of the unarmed strikes you make until the beginning
      of your next turn. This counts as only one use of Elemental Fist,
      regardless of the number of attacks that you make in this fashion.</p>
  tags:
    - Combat
    - Mythic
type: feat
