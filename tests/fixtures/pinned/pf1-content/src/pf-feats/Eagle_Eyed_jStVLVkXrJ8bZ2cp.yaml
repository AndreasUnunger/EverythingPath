name: Eagle-Eyed
system:
  description:
    value: >-
      <p><em>Your distance vision is exceptionally keen, enabling you to see
      well in both normal and dim lighting conditions and providing you an
      advantage when making ranged
      attacks.</em></p><p><strong>Prerequisites</strong>: Perception 3
      ranks.</p><p><strong>Benefits</strong>: Your distance modifier to the DC
      of vision-based Perception checks is decreased to +1 per 50 feet in bright
      light or normal light, or +1 per 20 feet in dim light. You also gain a +2
      circumstance bonus on ranged attacks against targets that are more than
      100 feet away.</p>
  tags:
    - General
type: feat
