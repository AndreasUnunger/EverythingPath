name: Ferocious Resolve
system:
  description:
    value: >-
      <p><em>Your orc heritage allows you to fight
      on.</em></p><p><strong>Prerequisites</strong>: Con 13, half-orc, orc
      ferocity racial trait.</p><p><strong>Benefits</strong>: You gain the
      ferocity universal monster ability, allowing you to continue fighting at
      negative hit points. When using this ability, you gain a +2 bonus on
      Intimidate checks.</p><p><strong>Normal</strong>: A half-orc with the orc
      ferocity racial trait can fight for 1 more round after he is brought below
      0 hit points.</p>
  tags:
    - Racial
    - Half-Orc
type: feat
