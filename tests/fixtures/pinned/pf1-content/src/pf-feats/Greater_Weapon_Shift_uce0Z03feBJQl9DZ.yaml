name: Greater Weapon Shift
system:
  description:
    value: >-
      <p><em>In animal form, your natural attacks are as deadly as the weapons
      you were holding.</em></p><p><strong>Prerequisites</strong>: Improved
      Weapon Shift, Weapon Shift, base attack bonus +8, wild shape class
      feature.</p><p><strong>Benefits</strong>: When you apply a melee weapon's
      damage type and properties to your natural attacks using the Weapon Shift
      feat, your natural attacks also gain an enhancement bonus on attack and
      damage rolls equal to the enhancement bonus (if any) of the weapon.</p>
  tags:
    - General
type: feat
