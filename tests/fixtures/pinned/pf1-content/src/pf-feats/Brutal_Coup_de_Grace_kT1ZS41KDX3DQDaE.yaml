name: Brutal Coup de Grace
system:
  description:
    value: >-
      <p><em>Your killing blows are so brutal that they scare other
      foes.</em></p><p><strong>Prerequisites</strong>: Dazzling Display, Weapon
      Focus, base attack bonus +5, proficiency with the selected
      weapon.</p><p><strong>Benefits</strong>: When you deliver a coup de grace
      with the selected weapon and kill the target, enemies within 30 feet of
      you who can see or hear you must succeed at a Will saving throw (DC = 10 +
      1/2 your character level + your Charisma bonus) or become shaken. This is
      a mind-affecting fear effect.</p>
  tags:
    - Combat
type: feat
