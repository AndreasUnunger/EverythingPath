name: Damned Soldier
system:
  description:
    value: >-
      <p><em>Your favored boons reflect your martial
      predilections.</em></p><p><strong>Prerequisites</strong>: Fiendish
      Obedience.</p><p><strong>Benefits</strong>: When you gain boons through
      the Fiendish Obedience feat, you can choose a sentinel boon or an exalted
      boon, but once you select this boon, it can't be changed. You gain a +1
      profane bonus on weapon damage rolls with your god's favored weapon.</p>
