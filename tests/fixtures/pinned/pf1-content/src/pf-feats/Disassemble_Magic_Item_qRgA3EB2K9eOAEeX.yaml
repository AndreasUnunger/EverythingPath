name: Disassemble Magic Item
system:
  description:
    value: >-
      <p><em>You can take apart and reassemble magic
      items.</em></p><p><strong>Prerequisites</strong>: Any item creation feat,
      Aspis Consortium 20 TPA.</p><p><strong>Benefits</strong>: You can break a
      magic item down into component pieces. These pieces are nonmagical and may
      have little resemblance to the original item other than being of the same
      material (a magical sword may be three recognizable metal pieces or simply
      a collection of metal scraps). Disassembling a magic item takes 1 hour per
      1,000 gp of the item's price and requires you to concentrate as if
      crafting an item. You can only use this feat on items your item creation
      feat would let you craft (for example, if you have Craft Wondrous Item,
      you can disassemble wondrous items but not magic weapons or
      armor).</p><p>You may reassemble a dismantled item as long as all the
      pieces are present; this takes the same amount of time as taking it apart
      did. There is a 10% chance the reconstruction fails and the item is
      permanently destroyed.</p>
  tags:
    - Faction
type: feat
