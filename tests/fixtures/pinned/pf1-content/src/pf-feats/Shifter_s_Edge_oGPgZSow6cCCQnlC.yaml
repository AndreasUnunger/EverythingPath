name: Shifter's Edge
system:
  description:
    value: >-
      <p><em>You use your shapechanging powers to make your natural attacks
      especially lethal.</em></p><p><strong>Prerequisites</strong>: Dex 13,
      Weapon Finesse, shifter claws class
      feature.</p><p><strong>Benefits</strong>: Whenever you use Weapon Finesse
      to make a melee attack with your claws or a natural attack augmented by
      your claws, and you use your Dexterity bonus on attack rolls and your
      Strength modifier on damage rolls, you also add half your shifter level to
      the damage.</p>
  tags:
    - General
type: feat
