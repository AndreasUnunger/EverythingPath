name: Spirit Sight
system:
  description:
    value: >-
      <p><em>You fully open your mind to the spirit world, learning to perceive
      the hidden.</em></p><p><strong>Prerequisites</strong>: Wis 15, Iron Will,
      Spirit Beacon.</p><p><strong>Benefits</strong>: Invisible creatures of the
      fey, outsider, and undead types gain only concealment from you, rather
      than total concealment (though they can still gain total concealment from
      cover or use of the Stealth skill). Such creatures do not gain a bonus on
      attack rolls against you or ignore your Dexterity bonus to AC as normally
      granted by invisibility.</p>
  tags:
    - General
type: feat
