name: Bestow Luck
system:
  description:
    value: >-
      <p><em>You are extremely lucky and sometimes your allies are as
      well.</em></p><p><strong>Prerequisites</strong>: Defiant Luck,
      Inexplicable Luck, human.</p><p><strong>Benefits</strong>: You gain an
      extra use per day of your Defiant Luck ability. You can also use your
      Inexplicable Luck ability to grant an ally that can see and hear its
      benefit as an immediate action.</p>
