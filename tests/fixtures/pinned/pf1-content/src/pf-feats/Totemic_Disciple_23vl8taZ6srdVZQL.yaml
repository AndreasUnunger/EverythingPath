name: Totemic Disciple
system:
  description:
    value: >-
      <p><em>Your understanding of your barbaric totem flourishes as your combat
      prowess grows.</em></p><p><strong>Prerequisites</strong>: Str 15; Dex 13;
      Athletic, Totemic Initiate; base attack bonus +9; no barbarian totem rage
      powers except those chosen with this feat or Totemic Initiate; nonlawful
      alignment.</p><p><strong>Benefits</strong>: Choose one barbarian totem
      rage power that requires that you have the totem rage power you selected
      with Totemic Initiate. While gaining the benefits of Totemic Initiate, you
      also gain the benefits of this new rage power.</p>
  tags:
    - General
type: feat
