name: Summon Neutral Monster
system:
  description:
    value: >-
      <p><em>You can summon creatures that embody the forces of
      balance.</em></p><p><strong>Prerequisites</strong>: Chaotic neutral,
      lawful neutral, or neutral alignment.</p><p><strong>Benefits</strong>:
      When casting a summon monster spell, you gain access to the list of
      neutral creatures on this page. You may also summon creatures from the
      standard summon monster list and apply the counterpoised creature simple
      template (see the sidebar) to applicable creatures instead of the
      celestial or fiendish template. Creatures you summon from the list on this
      page and creatures you summon with the counterpoised template gain a +2
      resistance bonus on Will saves.</p><table><tbody><tr><td><strong>1st
      Level</strong></td></tr><tr><td>Sprite (CN)</td></tr><tr><td>Stirge
      (N)</td></tr></tbody></table>



      <table><tbody><tr><td><strong>2nd Level</strong></td></tr><tr><td>Atomie
      (CN)</td></tr><tr><td>Brownie (N)</td></tr></tbody></table>



