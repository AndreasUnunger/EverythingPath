      (inevitable) (LN)</td></tr><tr><td>Nosoi (psychopomp)
      (N)</td></tr><tr><td>Paracletus (aeon) (N)</td></tr><tr><td>Thoqqua
      (N)</td></tr><tr><td>Voidworm (protean) (CN)</td></tr></tbody></table>



      <table><tbody><tr><td><strong>4th Level</strong></td></tr><tr><td>D'ziriak
      (N)</td></tr><tr><td>Magmin (CN)</td></tr><tr><td>Mephit (any)
