      (N)</td></tr><tr><td>Viduus<sup>ISB</sup> (psychopomp)
      (N)</td></tr></tbody></table>



      <table><tbody><tr><td><strong>5th Level</strong></td></tr><tr><td>Catrina
      (psychopomp) (N)</td></tr><tr><td>Mercane (LN)</td></tr><tr><td>Rast
