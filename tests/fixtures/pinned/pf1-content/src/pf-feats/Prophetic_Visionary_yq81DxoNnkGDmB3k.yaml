name: Prophetic Visionary
system:
  description:
    value: >-
      <p><em>Your oracular abilities give you a glimpse into the
      future.</em></p><p><strong>Prerequisites</strong>: Mystery class
      feature.</p><p><strong>Benefits</strong>: Once per day, you can enter a
      deep trance to receive a vision of the future. The trance lasts for 10
      minutes, during which time you can take no other actions. If you are
      interrupted, you must begin again. When you come out of the trance, you
      know whether a particular action in the immediate future will bring good
      or bad results, as an augury spell with a 70% chance of success.</p>
  tags:
    - General
type: feat
