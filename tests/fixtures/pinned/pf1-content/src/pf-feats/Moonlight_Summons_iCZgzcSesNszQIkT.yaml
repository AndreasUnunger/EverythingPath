name: Moonlight Summons
system:
  description:
    value: >-
      <p><em>Your summoned minions are infused with the power of the
      moon.</em></p><p><strong>Prerequisites</strong>: Spell Focus
      (conjuration), able to cast summon nature's
      ally.</p><p><strong>Benefits</strong>: Creatures you summon shed light as
      a light spell. They are immune to confusion and sleep effects, and their
      natural weapons are treated as silver for the purposes of overcoming
      damage reduction.</p>
