name: Iconoclast
system:
  description:
    value: >-
      <p><em>You know how to turn a holy symbol into a weapon against her
      followers.</em></p><p><strong>Prerequisites</strong>: Divine Defiance,
      Improved Sunder, Power Attack, Intimidate 3
      ranks.</p><p><strong>Benefits</strong>: When you succeed at a sunder
      combat maneuver against a holy or unholy symbol, you can attempt an
      Intimidate check to demoralize as a free action. This demoralization
      affects all followers of the deity or philosophy whose symbol you sundered
      who saw you sunder it and are within 30 feet. If you destroyed the symbol,
      you gain a +5 bonus on your Intimidate check. You can use this feat when
      sundering any physical holy symbol--it doesn't have to be the hand-held
      variety commonly used by clerics and other divine spellcasters.</p>
  tags:
    - Combat
type: feat
