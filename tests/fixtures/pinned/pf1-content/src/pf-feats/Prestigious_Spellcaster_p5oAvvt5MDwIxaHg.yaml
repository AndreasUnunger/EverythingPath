name: Prestigious Spellcaster
system:
  description:
    value: >-
      <p><em>The transition into a spellcasting prestige class is less difficult
      for you, and because of this, you gain 1 additional effective spellcaster
      level from your prestige class
      levels.</em></p><p><strong>Prerequisites</strong>: Favored Prestige Class
      with selected prestige class.</p><p><strong>Benefits</strong>: The first
      time you gain a level in your favored prestige class and the spells per
      day class feature does not grant an increase in effective level for the
      purpose of casting spells, you gain new spells per day as if the prestige
      class did grant +1 level of spellcasting for that level. This effect is
      retroactive if you gain this feat at a level beyond the point where your
      favored prestige class would normally have not advanced your
      spellcasting.</p><p>The Prestigious Spellcaster feat does not have any
      effect if your favored prestige class does not have the spells per day
      class feature, or if it does have the spells per day class feature but
      already grants a level increase for every level of the prestige class (as
      do the arcane trickster and loremaster prestige
      classes).</p><p><strong>Normal</strong>: You can select the Prestigious
      Spellcaster feat multiple times. Each time you select the Prestigious
      Spellcaster feat, your effective caster level increases by 1. However,
      regardless of the number of times you choose this feat, the total increase
      to your effective caster level cannot exceed your actual prestige class
      level.</p><p> This feat also applies to prestige classes that grant
      extracts per day instead of spells per day.</p>
  tags:
    - General
type: feat
