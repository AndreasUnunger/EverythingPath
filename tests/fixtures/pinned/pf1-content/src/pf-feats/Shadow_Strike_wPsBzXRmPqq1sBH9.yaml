name: Shadow Strike
system:
  description:
    value: >-
      <p><em>You accurately strike even those you cannot clearly
      see.</em></p><p><strong>Prerequisites</strong>: Base attack bonus
      +1.</p><p><strong>Benefits</strong>: You can deal precision damage, such
      as sneak attack damage, against targets with concealment (but not total
      concealment).</p><h3>Combat Trick</h3><p>: You can spend 5 stamina points
      when you hit a creature with total concealment to deal precision damage to
      that creature.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
