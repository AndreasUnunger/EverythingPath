name: Favored Judgment
system:
  description:
    value: >-
      <p><em>Your judgment against a particular type of creature is particularly
      harsh.</em></p><p><strong>Prerequisites</strong>: Wis 13, judgment class
      feature.</p><p><strong>Benefits</strong>: Select a favored race from the
      ranger's favored enemies chart. Any sacred or profane bonus you gain from
      a judgment is 1 higher for attacks you make against or take from creatures
      that match the selected favored enemy.</p><p><strong>Special</strong>: You
      can gain this feat multiple times. Its effects do not stack. Each time you
      take the feat, it applies to a different favored enemy.</p>
  tags:
    - General
type: feat
