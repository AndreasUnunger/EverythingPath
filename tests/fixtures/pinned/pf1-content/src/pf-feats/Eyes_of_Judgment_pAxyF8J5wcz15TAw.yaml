name: Eyes of Judgment
system:
  description:
    value: >-
      <p><em>The true motives of creatures cannot escape your discerning
      gaze.</em></p><p><strong>Prerequisites</strong>: Detect alignment class
      feature, caster level 6th.</p><p><strong>Benefits</strong>: When using
      your detect alignment class feature, you may spend 3 rounds studying a
      creature within 60 feet. You cannot take any other actions while doing
      this. After that time has passed, you learn the alignment of the
      creature.</p>
  tags:
    - General
type: feat
