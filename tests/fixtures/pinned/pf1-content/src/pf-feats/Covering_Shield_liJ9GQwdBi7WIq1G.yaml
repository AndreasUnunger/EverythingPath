name: Covering Shield
system:
  description:
    value: >-
      <p><em>You can use your shield to protect your most vulnerable parts from
      area effects.</em></p><p><strong>Prerequisites</strong>: Dex 13, Shield
      Focus, Shield Proficiency.</p><p><strong>Benefits</strong>: While using a
      shield of the type to which your Shield Focus feat applies, you gain a
      bonus on Reflex saves against area of effect attacks equal to your
      shield's base bonus to armor class plus any bonuses granted by feats or
      class abilities. This does not transfer any enhancement bonuses on a
      shield to Reflex saves.</p><h3>Combat Trick</h3><p>You can spend 3 stamina
      points to also gain the enhancement bonus of your shield on your Reflex
      save against one attack or hazard. (Dragonslayer's Handbook 24)</p>
  tags:
    - Combat
    - Combat Trick
type: feat
