name: Additional Affiliations
system:
  description:
    value: >-
      <p><em>You have an expansive personality and can forge more affiliations
      than normal.</em></p><p><strong>Benefits</strong>: Increase your
      affiliation slot total by 2.</p><p><strong>Normal</strong>: You have a
      number of affiliation slots equal to your Charisma modifier + 1 (minimum
      1).</p><p><strong>Special</strong>: You can take this feat multiple times;
      each time you do so, your number of affiliation slots increases by 2.</p>
