name: Aldori Style Conquest
system:
  description:
    value: >-
      <p><em>Defense is now second nature to you, and your blade punishes those
      who try to attack and fail.</em></p><p><strong>Prerequisites</strong>:
      Aldori Style, Aldori Style Aegis, Alertness, Combat Reflexes, Exotic
      Weapon Proficiency (Aldori dueling sword), Weapon Finesse, Weapon Focus
      (Aldori dueling sword).</p><p><strong>Benefits</strong>: When you attempt
      to parry an attack using Aldori Style Aegis, you do not take any penalties
      on the attack roll incurred from using Combat Expertise or fighting
      defensively.</p>
  tags:
    - Combat
type: feat
