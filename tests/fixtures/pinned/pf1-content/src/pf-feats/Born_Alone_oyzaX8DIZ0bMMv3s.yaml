name: Born Alone
system:
  description:
    value: >-
      <p><em>You are so tough and vicious that you killed and ate the rest of
      your litter while still in the
      womb.</em></p><p><strong>Prerequisites</strong>:
      Orc.</p><p><strong>Benefits</strong>: Whenever you kill or knock
      unconscious an opponent with a melee attack, you gain temporary hit points
      equal to your Constitution bonus (minimum 1) until your next turn. These
      temporary hit points do not stack. You do not gain this bonus if the
      opponent is helpless or has less than half your Hit Dice.</p>
  tags:
    - Racial
    - Orc
type: feat
