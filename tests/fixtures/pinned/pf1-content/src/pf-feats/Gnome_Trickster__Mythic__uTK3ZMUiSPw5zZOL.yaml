name: Gnome Trickster (Mythic)
system:
  description:
    value: >-
      <p><em>Thanks to your mythic power, the magic in your blood has grown more
      potent and diverse.</em></p><p><strong>Prerequisites</strong>: Gnome
      Trickster.</p><p><strong>Benefits</strong>: You gain the following
      spell-like abilities: 1/day--blur and vanish.</p><p>You can use your gnome
      spell-like abilities an additional number of times per day equal to half
      your tier. You can spend these additional uses to use any of your gnome
      spell-like abilities you wish. Your caster level for your gnome spell-like
      abilities becomes your character level plus your tier.</p>
  tags:
    - Racial
