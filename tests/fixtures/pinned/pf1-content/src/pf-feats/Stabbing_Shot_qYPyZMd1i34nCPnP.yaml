name: Stabbing Shot
system:
  description:
    value: >-
      <p><em>You can clear the way to continue using your
      bow.</em></p><p><strong>Prerequisites</strong>: Rapid Shot,
      elf.</p><p><strong>Benefits</strong>: When adjacent to an opponent and
      making a full-attack action with a longbow or shortbow (including
      composite bows), you may choose to make a melee attack against that
      opponent with a drawn arrow rather than firing it. If the attack
      hits--whether or not it does damage--your target is pushed back 5 feet
      away from you. You can then fire arrows from your bow normally, at the
      original target, or at another target within range. This melee attack
      replaces the extra attack from Rapid Shot, and all of your attack rolls
      for the round (the melee attack and the ranged attacks) take a -2 penalty.
      If your initial attack leaves you with no enemies threatening you, you can
      make the subsequent ranged attack or attacks without provoking attacks of
      opportunity.</p><h3>Combat Trick</h3><p>: When using this feat, you can
      spend 2 stamina points to negate the -2 penalty on all attacks for 1
      round.</p>
  tags:
    - Combat
    - Racial
    - Elf
    - Combat Trick
type: feat
