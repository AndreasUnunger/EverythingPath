name: Turn Undead (Mythic)
system:
  description:
    value: >-
      <p><em>The power of your divine energy can not only cause undead to flee
      but also destroy them where they
      stand.</em></p><p><strong>Prerequisites</strong>: Turn
      Undead.</p><p><strong>Benefits</strong>: When you use Turn Undead, the
      range increases by 10 feet per tier, and non-mythic undead take a penalty
      on their saving throws equal to your tier.</p><p>You can expend one use of
      mythic power when using Turn Undead to destroy undead. Instead of fleeing,
      undead that fail their saves might be destroyed. You destroy 2d4 Hit Dice
      worth of undead per tier. Undead with the fewest HD are affected first;
      among undead with equal HD, those that are closest to the burst's point of
      origin are affected first. No undead of 9 or more HD can be affected, and
      HD that aren't sufficient to affect an undead are wasted.</p>
  tags:
    - General
    - Mythic
type: feat
