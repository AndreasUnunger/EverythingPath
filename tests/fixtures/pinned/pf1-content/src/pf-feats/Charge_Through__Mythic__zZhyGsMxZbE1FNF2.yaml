name: Charge Through (Mythic)
system:
  description:
    value: >-
      <p><em>You can plow through those who stand between you and the target of
      your charge.</em></p><p><strong>Prerequisites</strong>: Charge
      Through.</p><p><strong>Benefits</strong>: When charging, you can ignore
      allies in your path when determining whether or not you can charge your
      target. Furthermore, after you have attempted at least one overrun with
      Charge Through, you can expend one use of mythic power as a free action to
      attempt another overrun against a different opponent in the path of the
      same charge.</p>
  tags:
    - Combat
    - Mythic
type: feat
