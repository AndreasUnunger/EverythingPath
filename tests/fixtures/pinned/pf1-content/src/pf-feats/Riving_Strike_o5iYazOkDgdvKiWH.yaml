name: Riving Strike
system:
  description:
    value: >-
      <p><em>When you infuse your weapon with arcane might, your attacks make
      foes more susceptible to magic.</em></p><p><strong>Prerequisites</strong>:
      Arcane Strike, ability to cast arcane
      spells.</p><p><strong>Benefits</strong>: If you have a weapon that is
      augmented by your Arcane Strike feat, when you damage a creature with an
      attack made with that weapon, that creature takes a -2 penalty on saving
      throws against spells and spell-like abilities. This effect lasts for 1
      round.</p><h3>Combat Trick</h3><p>: When you use this feat, you can spend
      up to 3 stamina points to increase the duration of the effect by 1 round
      for each stamina point spent.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
