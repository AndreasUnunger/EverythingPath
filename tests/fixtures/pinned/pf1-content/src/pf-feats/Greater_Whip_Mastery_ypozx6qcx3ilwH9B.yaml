name: Greater Whip Mastery
system:
  description:
    value: >-
      <p><em>You can use a whip to make combat maneuvers with
      ease.</em></p><p><strong>Prerequisites</strong>: Improved Whip Mastery,
      Weapon Focus (whip), Whip Mastery, base attack bonus
      +8.</p><p><strong>Benefits</strong>: You are so quick with your whip that
      you never drop it due to a failed disarm or trip combat maneuver attempt.
      Further, you gain the ability to grapple using your whip. To do so, use
      the normal grapple rules with the following changes. Attack</p><p>You
      cannot use your whip to attack while you are using it to grapple an
      opponent.</p><p>Damage</p><p>When dealing damage to your grappled
      opponent, you deal your whip's weapon damage rather than your unarmed
      strike damage. </p><p>Free Hands</p><p>You take no penalty on your combat
      maneuver check for having fewer than two hands free when you use your whip
      to grapple.</p><p>Reach</p><p>Rather than pulling your grappled opponent
      adjacent to you when you successfully grapple and when you move the
      grapple, you must keep him within your whip's reach minus his own reach to
      maintain the grapple. If the difference in reach is less than 0, such as
      is the case for a Medium whip wielder and a Gargantuan creature, you
      cannot grapple that opponent with your whip. If you have to pull a
      creature adjacent to you to grapple it with your whip, you still provoke
      an attack of opportunity from that opponent unless you have the Improved
      Grapple feat.</p><p>Tie Up</p><p>While adjacent to your opponent, you can
      attempt to use your whip to tie him up. If you do so to an opponent you
      have grappled rather than pinned, you take only a -5 penalty on the combat
      maneuver check rather than the normal -10.</p><p><strong>Combat
      Trick</strong>: When you initiate a grapple with a whip, you can spend 5
      stamina points to attempt a second grapple check as a swift action to
      either move or damage the creature you are grappling. This is not a check
      to maintain the grapple.</p>
  tags:
    - Combat
type: feat
