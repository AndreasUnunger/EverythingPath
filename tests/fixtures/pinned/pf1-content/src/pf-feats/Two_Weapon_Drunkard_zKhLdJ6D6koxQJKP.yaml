name: Two-Weapon Drunkard
system:
  description:
    value: >-
      <p><em>You effortlessly wield tankards in your off hand, and can use them
      to drink from and as deadly weapons in a battle with equal
      ease.</em></p><p><strong>Prerequisites</strong>: Catch Off-Guard,
      Two-Weapon Fighting.</p><p><strong>Benefits</strong>: When you wield a
      tankard as an improvised weapon in your off hand, it functions as a light
      mace, including for the purpose of determining the effects of feats like
      Weapon Focus. If you worship Cayden Cailean, your off-hand tankard
      functions as a divine focus and does not interfere with somatic spell
      components.</p><p>When you fight with two weapons and have the sickened
      condition, you do not apply the penalties from being sickened to attack
      rolls or weapon damage rolls.</p><p><strong>Normal</strong>: A tankard
      wielded as an improvised weapon normally functions as a gauntlet.</p>
  tags:
    - Combat
type: feat
