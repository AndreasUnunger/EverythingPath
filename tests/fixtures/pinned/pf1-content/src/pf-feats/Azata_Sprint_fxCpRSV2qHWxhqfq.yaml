name: Azata Sprint
system:
  description:
    value: >-
      <p><em>You move across the battlefield in a
      blur.</em></p><p><strong>Prerequisites</strong>: Agile Maneuvers, Azata
      Mischief, Azata Style, Dodge, Mobility, Wind Stance, base attack bonus
      +10.</p><p><strong>Benefits</strong>: While using Azata Style, your base
      speed increases by 10 feet and you ignore the movement penalties applied
      by the first 10 feet of difficult terrain you move through in the
      round.</p>
