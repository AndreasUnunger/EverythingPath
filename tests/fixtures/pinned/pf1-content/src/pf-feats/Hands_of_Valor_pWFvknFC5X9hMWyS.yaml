name: Hands of Valor
system:
  description:
    value: >-
      <p><em>Your touch staunches wounds and inspires great
      deeds.</em></p><p><strong>Prerequisites</strong>: Lay on hands class
      feature, worshiper of Iomedae.</p><p><strong>Benefits</strong>: Once per
      day when you use lay on hands, you can also imbue that ally with valor. In
      addition to the normal effects of your lay on hands, the targeted ally
      gains a sacred bonus on attack rolls and on saves against fear effects
      equal to your Charisma bonus (minimum +1) for 1 minute.</p>
  tags:
    - General
type: feat
