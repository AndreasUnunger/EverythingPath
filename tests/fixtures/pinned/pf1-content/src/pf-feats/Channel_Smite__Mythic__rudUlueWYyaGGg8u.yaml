img: systems/pf1/icons/feats/channel-smite.jpg
name: Channel Smite (Mythic)
system:
  description:
    value: >-
      <p><em>Your weapon a conduit of divine
      energy.</em></p><p><strong>Prerequisites</strong>: Channel
      Smite.</p><p><strong>Benefits</strong>: When using Channel Smite, you gain
      a bonus on your attack roll equal to the number of d6s granted by your
      channel energy class feature. This is either a sacred bonus (if channeling
      positive energy) or a profane bonus (if channeling negative energy). If
      your attack misses the target, you can expend one use of mythic power as a
      free action to release the channeled energy, producing the normal effects
      of your channel energy class feature centered on the creature you were
      attempting to smite.</p>
  tags:
    - Combat
    - Mythic
    - Channeling
type: feat
