name: Giant's Wallop
system:
  description:
    value: >-
      <p><em>When you strike, you knock the sense out of smaller
      foes.</em></p><p><strong>Prerequisites</strong>: Str 13, Power Attack,
      Vital Strike, base attack bonus +6, giant
      subtype.</p><p><strong>Benefits</strong>: If you hit a creature at least
      one size category smaller than you with a melee attack while using both
      Power Attack and Vital Strike, the creature you attacked is also dazed for
      1 round. A successful Fortitude save negates this effect (DC = 10 + your
      base attack bonus). You must choose to use this feat before making the
      attack roll.</p>
  tags:
    - Combat
    - Monster
    - Giant
type: feat
