name: Intimidate Animals
system:
  description:
    value: >-
      <p><em>You are skilled at intimidating animals with your bluster and
      fury.</em></p><p><strong>Prerequisites</strong>: Greater Wild Empathy,
      Intimidate 5 ranks, Knowledge (nature) 5 ranks, wild empathy class
      feature.</p><p><strong>Benefits</strong>: You add your Wisdom modifier on
      Intimidate checks against animals in addition to your Charisma modifier.
      An animal with 4 or fewer Hit Dice is frightened instead of shaken on a
      successful Intimidate check to demoralize it.</p>
  tags:
    - Combat
type: feat
