name: Inner Light
system:
  description:
    value: >-
      <p><em>Some ghorans glow with a nurturing inner
      light.</em></p><p><strong>Prerequisites</strong>: Wis 13,
      ghoran.</p><p><strong>Benefits</strong>: Once per day, you can cast
      daylight as a spell-like ability with a caster level equal to your
      character level. If you have the light dependent racial trait, you can
      instead cast this spell without the usual effect, but you are considered
      to be exposed to sunlight for that day.</p>
  tags:
    - Racial
    - Ghoran
type: feat
