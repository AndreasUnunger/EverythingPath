name: Beacon of Hope
system:
  description:
    value: >-
      <p><em>Your hope inspires allies in their
      struggles.</em></p><p><strong>Prerequisites</strong>: Channel energy 3d6,
      worshiper of Milani.</p><p><strong>Benefits</strong>: When you channel
      positive energy to heal living creatures, those you heal gain a +2 morale
      bonus on saving throws, attack rolls, ability checks, and skill checks for
      a number of rounds equal to your Charisma bonus (minimum 1 round).</p>
