img: systems/pf1/icons/feats/animal-affinity.jpg
name: Cavalry Formation
system:
  description:
    value: >-
      <p><em>You are skilled at riding in close formation with your mounted
      allies without impeding your effectiveness on the
      battlefield.</em></p><p><strong>Prerequisites</strong>: Mounted
      Combat.</p><p><strong>Benefits</strong>: You and your mount can overlap
      the space of mounts whose riders have this feat, although no more than two
      creatures can share any one square. Further, you can charge through a
      space containing an allied mount if that mount's rider has this feat,
      although the space from which you make your charge attack must comply with
      this feat's other benefit or be unoccupied.</p><p><strong>Combat
      Trick</strong>: At the start of your turn, you can spend 2 stamina points
      to gain the ability to overlap with allied riders who do not have this
      feat. This ability lasts until the start of your next turn.</p>
  tags:
    - Combat
    - Teamwork
type: feat
