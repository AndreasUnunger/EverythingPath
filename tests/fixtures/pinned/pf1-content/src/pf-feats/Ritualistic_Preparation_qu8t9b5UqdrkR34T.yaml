name: Ritualistic Preparation
system:
  description:
    value: >-
      <p><em>You have learned to access preparation rituals from spellbooks from
      which you can't otherwise
      benefit.</em></p><p><strong>Prerequisites</strong>: Knowledge (arcana) 1
      rank, Linguistics 1 rank, Spellcraft 1 rank, ability to cast read
      magic.</p><p><strong>Benefits</strong>: You can treat spellbooks with
      preparation rituals as if they were prayer books or meditation
      books.</p><p><strong>Special</strong>: A character with this feat can take
      the Avid Spellbook Reader feat even if she does not meet its
      prerequisites. Doing so allows her to benefit from the preparation rituals
      from two spellbooks, though she must still sacrifice spell slots to
      benefit from preparation rituals when treating such books as meditation
      books.</p>
  tags:
    - General
type: feat
