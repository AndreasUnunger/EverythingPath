name: Weapon Adept
system:
  description:
    value: >-
      <p><em>You are skilled at using customized
      weaponry.</em></p><p><strong>Benefits</strong>: Choose a weapon
      modification (such as jagged hooks). You treat weapons with that
      modification as being of their normal category (simple, martial, or
      exotic).</p><p><strong>Normal</strong>: A modified weapon is treated as
      one category more difficult to wield.</p><p><strong>Special</strong>: You
      can gain this feat multiple times, choosing a different weapon
      modification each time.</p>
  tags:
    - Combat
type: feat
