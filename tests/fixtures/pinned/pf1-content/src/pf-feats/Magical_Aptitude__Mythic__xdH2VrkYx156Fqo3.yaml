name: Magical Aptitude (Mythic)
system:
  description:
    value: >-
      <p><em>Your understanding of the principles and intricacies of magic goes
      far beyond your training.</em></p><p><strong>Prerequisites</strong>:
      Magical Aptitude.</p><p><strong>Benefits</strong>: The bonus on Spellcraft
      and Use Magic Device skill checks from Magical Aptitude increases by 2. In
      addition, you can expend one use of mythic power to treat a Spellcraft or
      Use Magic Device check as if you had rolled a natural 20. You must decide
      to use this ability before making the roll.</p>
