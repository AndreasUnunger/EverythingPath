name: Shield of Swings
system:
  description:
    value: >-
      <p><em>A wild frenzy of attacks serves to bolster your
      defenses.</em></p><p><strong>Prerequisites</strong>: Str 13, Power Attack,
      base attack bonus +1.</p><p><strong>Benefits</strong>: When you take a
      full-attack action while wielding a two-handed weapon, you can choose to
      reduce the damage by 1/2 to gain a +4 shield bonus to AC and CMD until the
      beginning of your next turn. The reduction in damage applies until the
      beginning of your next turn.</p><h3>Combat Trick</h3><p>: When using this
      feat, you can spend 2 stamina points to reduce your damage dealt by half
      only until the end of your turn, but you gain the +2 shield bonus to AC
      only from the end of your turn until the start of your next turn.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
