name: Tiger Pounce
system:
  description:
    value: >-
      <p><em>Your unarmed strikes are as precise as they are powerful, but they
      leave you open and you can pursue foes with blinding
      speed.</em></p><p><strong>Prerequisites</strong>: Improved Unarmed Strike,
      Power Attack, Tiger Claws, Tiger Style, base attack bonus +9 or monk level
      8th.</p><p><strong>Benefits</strong>: While using the Tiger Style feat,
      you can apply the penalty from Power Attack to your AC instead of attack
      rolls. Additionally, once per round as a swift action, you can move up to
      half your speed closer to a target you hit with an unarmed strike or made
      a successful combat maneuver against on this turn or your last
      turn.</p><h3>Combat Trick</h3><p>: When using Tiger Style, you can spend 2
      stamina points and take a swift action to move closer to an enemy you've
      hit with an unarmed strike or made a successful combat maneuver against at
      any point during this combat, instead of one you hit on this or your last
      turn.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
