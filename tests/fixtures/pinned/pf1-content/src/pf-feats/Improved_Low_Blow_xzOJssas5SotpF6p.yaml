name: Improved Low Blow
system:
  description:
    value: >-
      <p><em>You are adept at hitting larger opponents where it
      hurts.</em></p><p><strong>Prerequisites</strong>: Base attack bonus +4,
      halfling, low-blow racial trait.</p><p><strong>Benefits</strong>: Your
      bonus to confirm critical hits against opponents larger than yourself
      improves to +2. Furthermore, once per day, after you fail to hit with a
      critical hit confirmation roll, you can reroll the confirmation roll, but
      must take the new result even if it is worse.</p><p><strong>Combat
      Trick</strong>: You can spend 5 stamina points to reroll a second critical
      hit confirmation roll in the same day.</p>
  tags:
    - Combat
    - Racial
    - Halfling
type: feat
