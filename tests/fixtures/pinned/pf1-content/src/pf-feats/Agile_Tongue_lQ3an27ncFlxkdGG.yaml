name: Agile Tongue
system:
  description:
    value: >-
      <p><em>Your long pink tongue is capable of manipulating small items and
      even stealing objects.</em></p><p><strong>Prerequisites</strong>:
      Grippli.</p><p><strong>Benefits</strong>: You have a prehensile tongue
      with a range of 10 feet. You can pick up items weighing no more than 5
      pounds, make Sleight of Hand checks, perform the steal or disarm combat
      maneuvers, or make melee touch attacks with your tongue.</p>
