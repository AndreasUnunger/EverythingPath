name: Indomitable Mount
system:
  description:
    value: >-
      <p><em>Your skill at riding helps your mount avoid
      attacks.</em></p><p><strong>Prerequisites</strong>: Mounted Combat, Handle
      Animal 5 ranks, Ride 5 ranks, Lastwall
      affinity.</p><p><strong>Benefits</strong>: Once per round when your mount
      must make a saving throw, you can make a Ride check as an immediate
      action. Your mount makes its save if your Ride check result is greater
      than the DC of the opponent's attack.</p>
  tags:
    - Combat
type: feat
