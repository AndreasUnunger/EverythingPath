name: Ace Disarm
system:
  description:
    value: >-
      <p><em>You catch objects with your ranged attacks and drag them along with
      you.</em></p><p><strong>Prerequisites</strong>: Dex 13, Deadly Aim, Ranged
      Disarm (Ranged Tactics Toolbox 8), base attack bonus +6, weapon training
      class feature with a ranged weapon.</p><p><strong>Benefits</strong>: You
      don't take the -2 penalty for attempting disarm combat maneuver checks
      with a ranged weapon using Ranged Disarm, and you can attempt a steal
      combat maneuver check instead of a disarm combat maneuver check when using
      Ranged Disarm. In addition, when you successfully disarm or steal an item
      from an opponent, that item is deposited in that opponent's square. For
      every 5 by which your attack exceeds the target's CMD, you can deposit the
      item 5 feet away from the target (to a maximum of the attack's maximum
      range or until your projectile strikes an object that it cannot
      penetrate). If you use this ability with a thrown weapon and have the
      Ricochet Toss feat, both the weapon and the item return to you.</p>
  tags:
    - Targeting
    - Weapon Mastery
type: feat
