name: Infused Spell Cartridges
system:
  description:
    value: >-
      <p><em>You can improve your arcane ammunition with more powerful
      magic.</em></p><p><strong>Prerequisites</strong>: Int 15, Arcane Strike,
      Spell Cartridges, ability to cast 4th-level arcane spells, proficient with
      firearms.</p><p><strong>Benefits</strong>: While your gun is imbued with
      power from the Arcane Strike feat, you can spend a standard action to cast
      a spell of 3rd level or lower and deliver it via a force bullet. The spell
      must have a range of touch or produce a ray; if the spell would produce
      multiple rays, the bullet delivers the effect of only one ray. If the
      force bullet strikes a target, it deals its force damage and also delivers
      the effects of the spell. If the force bullet critically hits a target,
      the spell deals double damage.</p>
  tags:
    - Combat
type: feat
