name: Monastic Legacy
system:
  description:
    value: >-
      <p><em>Your formal unarmed training continues to bolster your training in
      other areas.</em></p><p><strong>Prerequisites</strong>: Still mind class
      feature, Improved Unarmed Strike.</p><p><strong>Benefits</strong>: Add
      half the levels you have in classes other than monk to your monk level to
      determine your effective monk level for your base unarmed strike damage.
      This feat does not make levels in classes other than monk count toward any
      other monk class features.</p><h3>Combat Trick</h3><p>At the start of your
      turn, you can spend 5 stamina points to use your full character level to
      determine your effective monk level for your unarmed strike damage. This
      increase lasts until the start of your next turn.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
