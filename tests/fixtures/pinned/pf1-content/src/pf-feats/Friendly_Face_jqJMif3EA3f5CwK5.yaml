name: Friendly Face
system:
  description:
    value: >-
      <p><em>Other animals of your species adore you. No matter how territorial,
      ill-tempered, wounded, or hungry they are, they see you as a friend, not
      an enemy. They'll give your two-legged friend the benefit of the doubt as
      well.</em></p><p><strong>Prerequisites</strong>: Animal
      companion.</p><p><strong>Benefits</strong>: Other animals of roughly the
      same kind as you (cats to felines, eagles to raptors, frogs to amphibians,
      etc.) have their starting attitudes toward you improved by two steps.
      Their attitudes towards your master are likewise improved by one
      step.</p><p><strong>Special</strong>: If your master has the animal focus
      class feature, this feat also applies to any animals of roughly the same
      kind as your active animal focus.</p>
  tags:
    - General
type: feat
