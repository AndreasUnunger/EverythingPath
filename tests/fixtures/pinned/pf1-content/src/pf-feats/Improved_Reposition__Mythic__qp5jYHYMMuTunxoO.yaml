name: Improved Reposition (Mythic)
system:
  description:
    value: >-
      <p><em>You put your foes right where you want
      them.</em></p><p><strong>Prerequisites</strong>: Improved
      Reposition.</p><p><strong>Benefits</strong>: You gain a bonus equal to
      half your tier on checks to attempt a reposition combat maneuver, and to
      your CMD when an opponent attempts to perform a reposition combat maneuver
      against you. These bonuses stack with those granted by Improved
      Reposition.</p><p>Furthermore, you can make an attack of opportunity
      against any creature that attempts to reposition you, unless it also has
      this feat.</p>
  tags:
    - Combat
    - Mythic
type: feat
