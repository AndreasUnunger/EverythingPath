name: Spectacular Exit
system:
  description:
    value: >-
      <p><em>You have mastered acrobatic maneuvers that turn even your retreats
      into breathtaking feats of
      skill.</em></p><p><strong>Prerequisites</strong>: Dex 15, Dodge,
      Acrobatics 7 ranks.</p><p><strong>Benefits</strong>: When you must attempt
      a performance combat check because you used the withdraw action, you can
      attempt an Acrobatics check against your opponent's CMD before the
      performance combat check. Success allows you to withdraw without taking
      the standard -5 penalty on your check. In addition, for every 5 points by
      which your Acrobatics check result exceeds your opponent's CMD, you gain a
      +1 bonus on all Perform checks you make for the remainder of the
      round.</p><h3>Combat Trick</h3><p>When you use Spectacular Exit to
      withdraw without taking the &ndash;5 penalty on performance combat checks
      and you spend 5 stamina points, you don&rsquo;t need to succeed at an
      Acrobatics check in order to avoid the penalty.</p>
  tags:
    - Combat
    - Performance
    - Combat Trick
type: feat
