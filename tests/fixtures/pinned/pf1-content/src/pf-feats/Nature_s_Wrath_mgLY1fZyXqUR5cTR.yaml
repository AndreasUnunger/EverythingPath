name: Nature's Wrath
system:
  description:
    value: >-
      <p><em>Though a plant creature, you are infused with the Blight Caller's
      primal rage against
      civilization.</em></p><p><strong>Prerequisites</strong>: Int 1, any
      nongood alignment, plant type.</p><p><strong>Benefits</strong>: You are no
      longer immune to effects that cause morale bonuses or effects with the
      emotion descriptor, and you take a -1 penalty on saves against anger or
      rage emotion effects. You gain a +1 bonus on attack rolls against humanoid
      creatures.</p>
  tags:
    - General
type: feat
