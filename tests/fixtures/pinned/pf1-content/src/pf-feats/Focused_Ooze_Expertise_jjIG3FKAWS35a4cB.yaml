name: Focused Ooze Expertise
system:
  description:
    value: >-
      <p><em>You've learned to avoid and overcome the engulfing attacks of your
      studied prey.</em></p><p><strong>Prerequisites</strong>: Favored enemy
      (ooze) class feature.</p><p><strong>Benefits</strong>: You gain a bonus to
      your CMD equal to half your favored enemy (ooze) bonus. You also gain acid
      resistance equal to half your favored enemy (ooze) bonus. Against oozes,
      you instead apply your full favored enemy (ooze) bonus for both
      benefits.</p>
  tags:
    - Combat
type: feat
