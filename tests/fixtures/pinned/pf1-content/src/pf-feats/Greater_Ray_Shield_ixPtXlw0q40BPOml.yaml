name: Greater Ray Shield
system:
  description:
    value: >-
      <p><em>You can turn your shield to deflect rays and other ranged attacks
      without harming it.</em></p><p><strong>Prerequisites</strong>: Dex 17,
      Missile Shield, Ray Shield, Spellbreaker.</p><p><strong>Benefits</strong>:
      When you use the Ray Shield feat, your shield is not affected by the
      deflected ranged touch attack.</p><h3>Combat Trick</h3><p>When you
      successfully deflect a ranged touch attack, you can spend 10 stamina
      points as a swift or immediate action to reflect the attack toward another
      target, which must be within 60 feet of you. The total distance from the
      original attacker, to you, and then to the new target cannot exceed the
      original attack's maximum range. You take a -5 penalty on the ranged touch
      attack to hit the new target. (See page 18.)</p>
  tags:
    - Combat
    - Shield Mastery
    - Combat Trick
type: feat
