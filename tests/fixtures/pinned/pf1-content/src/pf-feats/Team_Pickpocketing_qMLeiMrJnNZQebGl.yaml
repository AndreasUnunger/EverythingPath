name: Team Pickpocketing
system:
  description:
    value: >-
      <p><em>You distract a mark with friendly conversation while your partner
      robs the victim blind.</em></p><p><strong>Prerequisites</strong>: Bluff 1
      rank, Sleight of Hand 1 rank.</p><p><strong>Benefits</strong>: Whenever an
      ally with this feat succeeds a Bluff check to feint an opponent, if you
      are adjacent to that creature, you can spend an immediate action to make a
      Sleight of Hand check to pickpocket that opponent and gain a +4 bonus on
      that attempt.</p>
  tags:
    - Teamwork
type: feat
