name: Basic Harmony
system:
  description:
    value: >-
      <p><em>Your performance interweaves with and enriches your ally's
      skills.</em></p><p><strong>Prerequisites</strong>: Bardic performance or
      raging song.</p><p><strong>Benefits</strong>: You can attempt a DC 10
      Perform check to aid the Perform check of an ally who also has this feat.
      If you succeed, your ally gains a +1 bonus for each 5 points of your check
      result; a check result of 10 grants a +2 bonus, a result of 15 grants a +3
      bonus, and so on. If you fail, the discord applies a -5 penalty on your
      ally's check.</p><p><strong>Normal</strong>: Aid another checks grant a +2
      bonus.</p>
  tags:
    - Teamwork
type: feat
