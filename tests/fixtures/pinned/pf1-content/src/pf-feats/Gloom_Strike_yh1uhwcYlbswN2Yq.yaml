name: Gloom Strike
system:
  description:
    value: >-
      <p><em>Few creatures are as accustomed to fighting in the shadows as
      you.</em></p><p><strong>Prerequisites</strong>: Blind-Fight,
      fetchling.</p><p><strong>Benefits</strong>: When you are within an area of
      dim light or darkness, you gain a +1 bonus on attack rolls against enemies
      that are also within dim light or darkness.</p><p><strong>Combat
      Trick</strong>: As long as you have at least 1 stamina point in your
      stamina pool, you gain the bonus for this feat when you are in dim light
      or darkness, even if the creature you are attacking is not.</p>
  tags:
    - Combat
type: feat
