name: Fighting Frenzy
system:
  description:
    value: >-
      <p><em>You feed off the rage of your
      allies.</em></p><p><strong>Prerequisites</strong>: Cha 13, rage class
      feature.</p><p><strong>Benefits</strong>: When you are in a rage and an
      ally with this feat within 60 feet is in a rage, you don't take the normal
      -2 penalty to AC for being in a rage. If you would take a larger penalty
      to AC for being in a rage, reduce that penalty by 2.</p>
  tags:
    - Combat
    - Teamwork
type: feat
