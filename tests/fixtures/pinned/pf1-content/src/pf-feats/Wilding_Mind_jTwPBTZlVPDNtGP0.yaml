name: Wilding Mind
system:
  description:
    value: >-
      <p><em>You can repress your conscious mind in favor of a primal state that
      helps you resist mental
      influence.</em></p><p><strong>Prerequisites</strong>: Wis 13,
      Wilding.</p><p><strong>Benefits</strong>: Whenever you fail a saving throw
      against a fear or mind-affecting effect, you can take 1d3 points of
      Intelligence damage as an immediate action and reroll the saving throw.
      This damage cannot be reduced or avoided in any way. You must take the new
      result, even if it is worse.</p>
  tags:
    - General
type: feat
