name: Indomitable Mountain Style
system:
  description:
    value: >-
      <p><em>Like a rugged mountain, you are impassable and
      unmovable.</em></p><p><strong>Prerequisites</strong>: Wis 13, Combat
      Reflexes, Improved Unarmed Strike, base attack bonus
      +4.</p><p><strong>Benefits</strong>: As long as you do not take a move
      action, you gain a +4 morale bonus to your CMD and to the DC of Bluff
      checks used for feint attempts against you. Additionally, you are
      considered to be one size category larger for the purpose of calculating
      your CMD when creatures attempt Acrobatics checks to move through spaces
      you threaten without provoking attacks of opportunity.</p>
  tags:
    - Combat
    - Style
type: feat
