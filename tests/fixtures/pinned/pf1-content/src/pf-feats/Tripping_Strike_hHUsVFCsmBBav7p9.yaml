name: Tripping Strike
system:
  description:
    value: >-
      <p><em>The force intrinsic to your critical hits can knock your foes
      down.</em></p><p><strong>Prerequisites</strong>: Int 13, Combat Expertise,
      Improved Trip, base attack bonus +9.</p><p><strong>Benefits</strong>:
      Whenever you score a critical hit with a melee attack, you can trip your
      opponent, in addition to the normal damage dealt by the attack. If your
      confirmation roll exceeds your opponent's CMD, you may knock your opponent
      prone as if from the trip combat maneuver. This does not provoke an attack
      of opportunity. If you are tripped during your own trip attempt, you can
      drop your weapon to avoid being tripped.</p><p><strong>Normal</strong>:
      You must perform a trip combat maneuver to trip an
      opponent.</p><p><strong>Special</strong>: You can only apply the effects
      of one of the following feats to a given critical hit: Bull Rush Strike,
      Disarming Strike, Repositioning Strike, Sundering Strike, or Tripping
      Strike. You may choose to use this feat after you make your confirmation
      roll.</p><h3>Combat Trick</h3><p>: When you fail to confirm a critical hit
      with a melee attack, you can spend 2 stamina points to attempt to trip the
      target anyway. When you do, reroll the confirmation roll and use it to
      determine if the trip attempt exceeds the opponent's CMD. This reroll is
      used only for the trip combat maneuver; it can't cause the critical hit to
      be conf irmed. You still can't make the attempt if the target is immune to
      critical hits.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
