name: Pack Intimidation
system:
  description:
    value: >-
      <p><em>You draw on the strength of numbers and your shared convictions to
      intimidate your foes.</em></p><p><strong>Prerequisites</strong>: Half-orc,
      intimidating racial trait.</p><p><strong>Benefits</strong>: Whenever you
      use the Intimidate skill to demoralize foes, you gain a +2 circumstance
      bonus on your check for every ally who also has this feat within 30 feet
      (maximum +6).</p>
  tags:
    - Combat
    - Teamwork
type: feat
