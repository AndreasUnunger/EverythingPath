name: Bull-Catcher Wrangler
system:
  description:
    value: >-
      <p><em>You can wrestle a charging foe to the
      ground.</em></p><p><strong>Prerequisites</strong>: Dex 13, Bull-Catcher
      Style, Bull-Catcher Toss, Improved Grapple, Improved Unarmed Strike; base
      attack bonus +12, brawler level 8th, or monk level
      8th.</p><p><strong>Benefits</strong>: When a creature is charging you, and
      you successfully grapple it with the Bull-Catcher Style feat, you can
      immediately move it as per the Bull-Catcher Toss feat. Once the creature
      is moved, you can break your grapple as an immediate action. If you do,
      select another creature in the repositioned target's threatened area. That
      creature becomes the new target of the initial charge attack.</p>
  tags:
    - Combat
type: feat
