name: Angelbane Strike
system:
  description:
    value: >-
      <p><em>You channel the power of your Abyssal patron through your weapon to
      punish the righteous.</em></p><p><strong>Prerequisites</strong>: Channel
      Smite, divine caster level 5th, channel negative energy class feature,
      demon lord patron deity.</p><p><strong>Benefits</strong>: When you use
      Channel Smite against a living creature with a good alignment, you treat
      all 1s on the channel smite damage dice as 2s.</p><p> If your target is
      either a good outsider or a divine caster who serves a good deity, you are
      considered 2 levels higher when determining how many channel energy damage
      dice you roll when using Channel Smite.</p>
  tags:
    - General
type: feat
