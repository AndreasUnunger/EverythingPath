name: Lightning Draw
system:
  description:
    value: >-
      <p><em>You can draw your weapon with startling
      speed.</em></p><p><strong>Prerequisites</strong>: Quick Draw, swashbuckler
      initiative deed, swashbuckler level 7th.</p><p><strong>Benefits</strong>:
      You can spend 1 panache point to draw one or more light or one-handed
      piercing weapons, whether hidden or not, when you roll initiative, even at
      the start of a surprise round in which you can't act. Drawing these
      weapons does not take an action.</p><p>If you have the instant unveil
      deed, it doesn't cost any panache to use the ability described in the
      previous paragraph as long as you have at least 1 point of panache, and
      you can spend 1 panache point to draw a single light or one-handed
      piercing weapon, hidden or not, as an immediate action whenever a creature
      attacks you.</p>
  tags:
    - Combat
    - Panache
type: feat
