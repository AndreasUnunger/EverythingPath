name: Abundant Revelations
system:
  description:
    value: >-
      <p><em>You can plumb the depths of your mystery to use your revelations
      more often.</em></p><p><strong>Prerequisites</strong>: Mystery class
      feature.</p><p><strong>Benefits</strong>: Choose one of your revelations
      that has a number of uses per day. You gain 1 additional use per day of
      that revelation.</p><p><strong>Special</strong>: You can gain this feat
      multiple times. Its effects do not stack. Each time you take the feat, it
      applies to a new revelation.</p>
  tags:
    - General
type: feat
