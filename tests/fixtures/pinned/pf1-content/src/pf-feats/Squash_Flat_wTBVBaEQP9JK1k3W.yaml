name: Squash Flat
system:
  description:
    value: >-
      <p><em>You can bull rush an opponent straight to the
      ground.</em></p><p><strong>Prerequisites</strong>: Improved Bull Rush,
      Merciless Rush, worshiper of Rovagug.</p><p><strong>Benefits</strong>:
      Whenever you make a bull rush attack and your combat maneuver check
      exceeds the target's CMD by 5 or more, you can attempt to trip the target
      as part of your bull rush as a free action. This does not provoke an
      attack of opportunity.</p><h3>Combat Trick</h3><p>: After succeeding at a
      bull rush combat maneuver check, you can spend 4 stamina points to attempt
      to trip the target with Squash Flat regardless of your bull rush combat
      maneuver check's result.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
