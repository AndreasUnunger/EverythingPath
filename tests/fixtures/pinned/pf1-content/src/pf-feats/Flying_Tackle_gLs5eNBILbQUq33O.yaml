name: Flying Tackle
system:
  description:
    value: >-
      <p><em>You quickly bring down an off-balanced
      opponent.</em></p><p><strong>Prerequisites</strong>: Improved
      Overrun.</p><p><strong>Benefits</strong>: When attempting an overrun
      combat maneuver check against a flat-footed opponent, if the attempt
      knocks the creature prone, you can also fall prone in order to attempt a
      grapple combat maneuver check against the creature as a free action. Doing
      so does not provoke an attack of opportunity from the target of your
      grapple.</p>
  tags:
    - General
type: feat
