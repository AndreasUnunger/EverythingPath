name: Ferocious Beast
system:
  description:
    value: >-
      <p><em>Through training or natural ability, the animal is skilled at
      unnerving its enemies.</em></p><p><strong>Prerequisites</strong>:
      Intimidate 1 rank, animal companion.</p><p><strong>Benefits</strong>: The
      animal companion uses half its master's class level (minimum 1) in place
      of its Charisma bonus on Intimidate checks to demoralize an opponent, as
      well as on Intimidate checks to use the Antagonize feat. In addition, the
      animal companion can use Intimidate to demoralize an opponent as a move
      action.</p><p><strong>Special</strong>: An animal companion can't take
      both Ferocious Beast and Intimidating Prowess.</p>
  tags:
    - Combat
type: feat
