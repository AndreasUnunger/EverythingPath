name: Knocking Blows
system:
  description:
    value: >-
      <p><em>The weight of your blows overwhelms your
      opponents.</em></p><p><strong>Prerequisites</strong>: Str 13, Intense
      Blows, Power Attack, base attack bonus +11 or fighter level 8th, armor
      training class feature, proficiency with heavy
      armor.</p><p><strong>Benefits</strong>: If you hit a creature that is no
      more than one size category larger than you with a Power Attack, the
      creature you attacked is also knocked off balance. Until the beginning of
      your next turn, it takes a -4 penalty to its CMD against combat maneuvers
      that move it or knock it prone.</p><h3>Combat Trick</h3><p>You can spend 5
      stamina points when using this feat to change the target's penalty to CMD
      to -6. (See page 17.)</p>
  tags:
    - Armor Mastery
    - Combat
    - Combat Trick
type: feat
