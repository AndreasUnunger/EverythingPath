name: Gnawer
system:
  description:
    value: >-
      <p><em>Thanks to your teeth's strength and quick growth, you are able to
      chew through nearly any obstacle given sufficient
      time.</em></p><p><strong>Prerequisites</strong>: Sharptooth,
      ratfolk.</p><p><strong>Benefits</strong>: Damage dealt by your bite attack
      ignores an amount of hardness equal to 3 plus half your character level.
      You can spend a full-round action to deal double your bite damage to an
      unattended, inanimate object.</p><p><strong>Special</strong>: If you have
      the Burrowing Teeth feat (Pathfinder RPG Advanced Race Guide 154), you can
      burrow through solid stone at a speed of 5 feet per 10 minutes.</p><p><br
      /><strong>Pathfinder Society<br /></strong>Legal only for Ratfolk PCs</p>
  tags:
    - Racial
    - Ratfolk
type: feat
