name: Gate Breaker
system:
  description:
    value: >-
      <p><em>Your strikes against objects are especially
      vicious.</em></p><p><strong>Prerequisites</strong>: Str 13, Improved
      Sunder, Power Attack, base attack bonus
      +1.</p><p><strong>Benefits</strong>: Whenever you would deal damage to an
      object, you deal normal damage plus an additional amount equal to your
      Strength modifier. This applies to both unattended objects and those you
      damage as part of a successful sunder combat maneuver check.</p>
  tags:
    - Combat
type: feat
