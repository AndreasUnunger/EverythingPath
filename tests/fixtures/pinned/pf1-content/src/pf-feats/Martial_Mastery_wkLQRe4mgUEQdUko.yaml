name: Martial Mastery
system:
  description:
    value: >-
      <p><em>You broaden your study of weapons to encompass multiple similar
      weapons.</em></p><p><strong>Prerequisites</strong>: Martial Versatility,
      fighter level 16th, human.</p><p><strong>Benefits</strong>: Each combat
      feat you have that applies to a specific weapon (e.g., Weapon Focus) can
      be used with all weapons in the same weapon group.</p><p><strong>Combat
      Trick</strong>: At the start of your turn, you can spend 5 stamina points
      to apply the feats to another weapon that is not of the same weapon group.
      You gain this benefit until the start of your next turn.</p>
  tags:
    - Combat
    - Racial
    - Human
type: feat
