name: Timely Coordination
system:
  description:
    value: >-
      <p><em>You can precisely time your
      teamwork.</em></p><p><strong>Benefits</strong>: You gain a +1 bonus on
      attack rolls and skill checks made as part of readied actions triggered by
      one of your allies who also has this feat. When you and an ally who also
      has this feat are attempting to overcome separate simultaneous obstacles
      as part of a heist or infiltration, you also gain this +1 bonus on attack
      rolls and skill checks.</p>
  tags:
    - Teamwork
type: feat
