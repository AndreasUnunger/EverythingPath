name: Collector's Boon
system:
  description:
    value: >-
      <p><em>You have a knack for unlocking the true potential of your magical
      equipment.</em></p><p><strong>Prerequisites</strong>: Character level
      5th.</p><p><strong>Benefits</strong>: You can enhance the effects of
      certain magical items when wearing or wielding two or more sympathetic
      magic items. While you are wearing or wielding at least two items from a
      set, you gain the two-item benefit listed in the set, as well as any
      specific benefits detailed in the item description entries for the pieces
      of that set. You do not gain any benefits that require three or more set
      pieces; such benefits must be unlocked by taking the Improved Collector's
      Boon feat.</p><p><strong>Special</strong>: You can't gain the set bonuses
      of more than one set at a time due to the interference of incompatible
      sympathetic magical effects. If you have multiple pieces of two or more
      sets, you must choose the set you gain the benefits of at the start of
      each day and can't change this decision for 24 hours.</p>
  tags:
    - General
type: feat
