name: Spell Mastery (Mythic)
system:
  description:
    value: >-
      <p><em>You're so familiar with certain spells you can prepare them with
      the greatest of ease.</em></p><p><strong>Prerequisites</strong>: Spell
      Mastery.</p><p><strong>Benefits</strong>: You can prepare spells you have
      selected with Spell Mastery as a full-round action. You must spend the
      appropriate amount of time preparing other spells you have not mastered.
      As a full-round action, you can expend one use of mythic power to prepare
      all your spells that you have selected with Spell Mastery.</p>
