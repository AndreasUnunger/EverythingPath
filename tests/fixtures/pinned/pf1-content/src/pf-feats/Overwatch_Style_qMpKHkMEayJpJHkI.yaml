name: Overwatch Style
system:
  description:
    value: >-
      <p><em>You have learned to wait until your ranged attacks have the
      greatest effect.</em></p><p><strong>Prerequisites</strong>: Precise Shot,
      Rapid Shot, Weapon Focus with the chosen
      weapon.</p><p><strong>Benefits</strong>: While using this style, as a
      full-round action you can ready two ranged attacks with the chosen weapon,
      each with its own triggering event. You take a -2 penalty on attack rolls
      made with these readied actions.</p><p><strong>Special</strong>: A
      character with this feat and the weapon training (bows, crossbows, or
      firearms) class feature can use Overwatch Style with any bow, crossbow, or
      firearm, respectively, in addition to the chosen weapon.</p>
  tags:
    - Combat
    - Style
type: feat
