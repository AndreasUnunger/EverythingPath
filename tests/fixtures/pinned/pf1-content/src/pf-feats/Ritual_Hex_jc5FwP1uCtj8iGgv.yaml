name: Ritual Hex
system:
  description:
    value: >-
      <p><em>You are well versed in ancient secrets and forbidden curses, and
      know how to petition powers with which you are already in contact for
      additional knowledge.</em></p><p><strong>Prerequisites</strong>: Knowledge
      (arcana) 4 ranks, Knowledge (history) 4 ranks, hex class
      feature.</p><p><strong>Benefits</strong>: You learn to perform a special
      occult ritual (Pathfinder RPG Occult Adventures 208) known as Beseeching
      the Patron, which temporarily grants you a hex you don't already know how
      to use. You always believe that your ritual is a success, so the GM should
      roll the required skill checks in secret, revealing the result only when
      you try to use your newly acquired hex.</p><p><strong>Beseeching the
      Patron</strong> </p><p><strong>School</strong> divination;
      <strong>Level</strong> 4</p><p> <strong>Casting Time</strong> 40
      minutes</p><p> <strong>Components</strong> V, F (a book of occult lore
      worth at least 150 gp)</p><p> <strong>Skill Checks</strong> Knowledge
      (arcana) DC 20, 2 successes; Knowledge (history) DC 20, 2
      successes</p><p><strong>Range</strong> personal</p><p>
      <strong>Duration</strong> 24 hours</p><p> <strong>Saving Throw</strong>
      no; <strong>SR</strong> no</p><p><strong>Backlash</strong> The caster is
      fatigued for 1 hour. </p><p><strong>Failure</strong> All of the caster's
      spells suffer a 10% spell failure chance for 24 hours. <h3>Effect</h3> The
      caster gains access to one additional hex for which she qualifies. This
      ritual can be used to acquire a major hex (increasing the DCs of the
      ritual's skill checks by 10) or grand hex (increasing the DCs by 20) if
      desired. The caster can have only one additional hex from this ritual at a
      time.</p>
  tags:
    - General
type: feat
