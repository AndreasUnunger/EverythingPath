name: Tribal Scars
system:
  description:
    value: >-
      <p><em>You endured the grueling coming-of-age rituals of your tribe or
      following, and proudly bear the scars that grant you the blessings of your
      tribe's ancestors or totem.</em></p><p><strong>Benefits</strong>: You gain
      one of the following benefits, depending on which Mammoth Lord following
      you belong to. (At the GM's discretion, other options of her own design
      could exist for different tribes.)</p><p>Bearpelt</p><p>You gain a +1
      bonus on Fortitude saves and a +2 bonus on Intimidate checks.</p><p>
      Greattusk</p><p>You gain a +2 bonus on checks to perform bull rush or
      overrun combat maneuvers and a +2 bonus on Ride checks.</p><p>Ice
      Chasm</p><p>You gain a +1 bonus on Reflex saves and a +2 bonus on Climb
      checks.</p><p>Night Hunt</p><p>You gain a +2 bonus on Perception and
      Survival checks.</p><p>Raptorscale</p><p>Your base land speed increases by
      5 feet, and you gain a +2 bonus on Acrobatics checks.</p><p>
      Slothjaw</p><p>You gain a +1 bonus on Will saves and a +2 bonus on Handle
      Animal checks.</p>
  tags:
    - General
type: feat
