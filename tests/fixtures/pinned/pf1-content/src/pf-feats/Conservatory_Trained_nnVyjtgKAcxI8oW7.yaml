name: Conservatory-Trained
system:
  description:
    value: >-
      <p><em>Your training at Jalmeray's famed Conservatory on the island of
      Grand Sarret helps you perceive others' interests and leverage them for
      your benefit.</em></p><p><strong>Prerequisites</strong>: Sense Motive 1
      rank.</p><p><strong>Benefits</strong>: You gain an insight bonus equal to
      your Wisdom modifier on discovery checks using the individual influence
      system (Pathfinder RPG Ultimate Intrigue 102). In addition, when you
      discover an NPC's strength, the next influence check an ally attempts that
      incorporates that strength receives a +2 bonus.</p>
  tags:
    - General
type: feat
