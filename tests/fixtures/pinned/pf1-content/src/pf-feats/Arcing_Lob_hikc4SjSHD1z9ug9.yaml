name: Arcing Lob
system:
  description:
    value: >-
      <p><em>You can hurl a splash weapon high into the air to break atop large
      opponents, cascading its contents down on your target or using your
      opponent's bulk to shield the surrounding area from the
      spray.</em></p><p><strong>Prerequisites</strong>: Dex 15, Point-Blank
      Shot, Precise Shot, Throw Anything.</p><p><strong>Benefits</strong>: When
      you hit a target that is Large or larger with a splash weapon, you can
      choose to deal splash damage to all creatures within 5 feet of the target,
      splash damage to no creatures, or splash damage as
      normal.</p><p><strong>Normal</strong>: If you hit a target that is Large
      or larger with a splash weapon, choose one of its squares--the splash
      damage affects creatures within 5 feet of that square.</p>
  tags:
    - General
type: feat
