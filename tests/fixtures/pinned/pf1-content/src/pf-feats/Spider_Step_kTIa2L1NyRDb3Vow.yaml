name: Spider Step
system:
  description:
    value: >-
      <p><em>Your physical mastery grants you an impossible
      stride.</em></p><p><strong>Prerequisites</strong>: Acrobatics 6 ranks,
      Climb 6 ranks, monk level 6th.</p><p><strong>Benefits</strong>: As a move
      action, you can move up to half your slow fall distance across a wall or
      ceiling or across ropes, branches, or even water or other surfaces that
      cannot support your weight. You must reach a solid, level surface by the
      end of your turn or you will fall.</p>
