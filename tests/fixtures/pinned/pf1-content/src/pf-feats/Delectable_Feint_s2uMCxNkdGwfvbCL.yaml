name: Delectable Feint
system:
  description:
    value: >-
      <p><em>You can distract opponents with your delectable
      rinds.</em></p><p><strong>Prerequisites</strong>: Con 15, delicious racial
      trait, ghoran.</p><p><strong>Benefits</strong>: Other creatures find you
      so tasty that they become distracted in combat, allowing you to exploit
      their momentary lapses in concentration. You gain a +2 bonus on Bluff
      checks to feint living herbivorous or omnivorous creatures. In addition,
      whenever you successfully feint such an opponent, in addition to the
      normal effects of being feinted in combat, that opponent takes a -2
      penalty on Perception checks and concentration checks until the start of
      your next turn.</p>
  tags:
    - Racial
    - Ghoran
type: feat
