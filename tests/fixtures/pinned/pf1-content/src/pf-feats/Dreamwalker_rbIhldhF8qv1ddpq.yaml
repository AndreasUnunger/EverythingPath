name: Dreamwalker
system:
  description:
    value: >-
      <p><em>Your dreams are as vivid as your waking hours, and you can slip
      into a dreamlike state with no
      effort.</em></p><p><strong>Prerequisites</strong>: Cha 17, Lucid Dreamer,
      Practiced Dreamer, Knowledge (planes) 10
      ranks.</p><p><strong>Benefits</strong>: Your experience in the Dimension
      of Dreams allows you to enter the demiplane with ease. You no longer have
      to attempt a Charisma check when entering the Dimension of Dreams to
      determine whether or not you are at a disadvantage, instead automatically
      arriving unhindered.</p>
  tags:
    - General
type: feat
