name: Umbral Scion
system:
  description:
    value: >-
      <p><em>New spell-like abilities are unlocked for you as you rise to
      ascendency among the drow
      people.</em></p><p><strong>Prerequisites</strong>: Cha 13, Wis 13, Drow
      Nobility, Greater Drow Nobility, Improved Drow Nobility, able to use drow
      spell-like abilities, drow.</p><p><strong>Benefits</strong>: Select one of
      the following: dispel magic, divine favor, or suggestion. You may use this
      spell once per day as a spell-like ability. Your caster level is equal to
      your character level.</p>
