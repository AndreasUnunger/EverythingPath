name: Goblin Cleaver
system:
  description:
    value: >-
      <p><em>You are ferocious at hewing smaller
      opponents.</em></p><p><strong>Prerequisites</strong>: Str 13, Cleave,
      Power Attack, dwarf.</p><p><strong>Benefits</strong>: When using Cleave or
      Great Cleave, if your initial attack hits, you may take your additional
      attacks against any creature smaller than you that you threaten; your
      targets need not be adjacent to one another. Additional attacks you make
      against humanoids (goblinoid) gain a +2 circumstance bonus on attack
      rolls.</p><h3>Combat Trick</h3><p>As long as you have at least 1 stamina
      point in your stamina pool, the bonus on Cleave attacks made against
      goblinoids increases to +4.</p>
  tags:
    - Combat
    - Racial
    - Dwarf
    - Combat Trick
type: feat
