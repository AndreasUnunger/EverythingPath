name: Devil Sense
system:
  description:
    value: >-
      <p><em>You instinctively sense the presence of
      fiends.</em></p><p><strong>Prerequisites</strong>: Wis 13, ability to cast
      detect evil as a spell or spell-like
      ability.</p><p><strong>Benefits</strong>: At the beginning of your turn
      each round, if you are within 60 feet of an outsider with the evil
      subtype, you instinctively sense that something unholy is near. You may
      experience this sense as an unpleasant smell or taste (such as sulfur), as
      gooseflesh on your arms or neck, or as an ineffable sense of dread. This
      sense does not alert you to the direction of the outsider. Anything that
      can thwart or mislead detect evil can likewise block this sense.</p>
  tags:
    - General
type: feat
