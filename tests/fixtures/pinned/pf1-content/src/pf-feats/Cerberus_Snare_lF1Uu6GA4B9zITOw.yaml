name: Cerberus Snare
system:
  description:
    value: >-
      <p><em>Your strikes latch onto your opponent like the jaws of a cerberus,
      preventing them from fleeing across
      planes.</em></p><p><strong>Prerequisites</strong>: Cerberus Style, base
      attack bonus +9 or monk level 9th.</p><p><strong>Benefits</strong>:
      Whenever you damage an opponent with Cerberus Style, that opponent cannot
      take 5-foot steps until the beginning of your next turn. Additionally, it
      is barred from dimensional travel. This effect functions as dimensional
      anchor, except that its duration is 1 round. Spell resistance applies; for
      the purpose of checks to overcome spell resistance, your caster level is
      equal to your character level.</p>
  tags:
    - Combat
type: feat
