img: systems/pf1/icons/feats/fleet.png
name: Swift Aid
system:
  description:
    value: >-
      <p><em>With a quick but harmless swipe, you can aid an ally's
      assault.</em></p><p><strong>Prerequisites</strong>: Int 13, Combat
      Expertise, base attack bonus +6.</p><p><strong>Benefits</strong>: As a
      swift action, you can attempt the aid another action, granting your ally
      either a +1 bonus on his next attack roll or a +1 bonus to his
      AC.</p><p><strong>Normal</strong>: Aid another is a standard
      action.</p><h3>Combat Trick</h3><p>: As long as you have at least 1
      stamina point in your stamina pool, you can use this feat to aid another
      as a move action.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
