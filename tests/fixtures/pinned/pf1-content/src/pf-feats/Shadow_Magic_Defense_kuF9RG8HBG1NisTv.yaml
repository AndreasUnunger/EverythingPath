name: Shadow Magic Defense
system:
  description:
    value: >-
      <p><em>Your mastery of shadow allows you to defend against shadow magic
      used against you.</em></p><p><strong>Prerequisites</strong>: Disguise self
      racial spell-like ability or shadow illusion shadowdancer prestige class
      feature.</p><p><strong>Benefits</strong>: You gain a +2 bonus on saving
      throws against spells and spell-like abilities with the shadow descriptor
      or spells and spell-like abilities of the illusion (shadow) subschool. If
      you succeed at a saving throw against an illusion (shadow) spell that
      deals a percentage of its damage or effect against creatures that
      successfully save against it, reduce the amount of damage it deals to you
      by 20% (to a minimum of 0%).</p>
  tags:
    - General
type: feat
