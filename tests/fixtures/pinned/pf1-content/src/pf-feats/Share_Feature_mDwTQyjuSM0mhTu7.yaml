name: Share Feature
system:
  description:
    value: >-
      <p><em>The animal expands its capabilities and learns one of its master's
      class features.</em></p><p><strong>Prerequisites</strong>: Animal
      companion, master must have the chosen class
      feature.</p><p><strong>Benefits</strong>: Choose one of the following
      class features: bravery, camouflage, favored terrain, hide in plain sight,
      resist nature's lure, track, trackless step, venom immunity, and woodland
      stride. The animal companion gains the benefits of the selected class
      feature, using its Hit Dice as its level in its master's class for the
      purpose of this ability; the animal companion gains the benefits of the
      base class feature, even if the master alters the class feature via an
      archetype or other means, though the animal companion doesn't count as
      having the class feature for the purpose of fulfilling prerequisites.</p>
  tags:
    - General
type: feat
