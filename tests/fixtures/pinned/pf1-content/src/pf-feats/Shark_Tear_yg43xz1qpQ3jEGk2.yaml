name: Shark Tear
system:
  description:
    value: >-
      <p><em>You tear into bleeding foes and can smell their blood in the
      water.</em></p><p><strong>Prerequisites</strong>: Improved Unarmed Strike,
      Shark Style, Swim 6 ranks, base attack bonus +6 or monk level
      6th.</p><p><strong>Benefits</strong>: While in Shark Style, you gain scent
      while in water, but only against bleeding creatures. You also gain a +1
      bonus on attack and damage rolls against bleeding creatures.</p>
  tags:
    - Combat
type: feat
