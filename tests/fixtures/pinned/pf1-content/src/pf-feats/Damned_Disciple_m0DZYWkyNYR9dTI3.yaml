name: Damned Disciple
system:
  description:
    value: >-
      <p><em>Your diverse experiences influence your choice of
      boons.</em></p><p><strong>Prerequisites</strong>: Fiendish
      Obedience.</p><p><strong>Benefits</strong>: When you gain boons through
      the Fiendish Obedience feat, you can choose an evangelist boon or an
      exalted boon, but once you select this boon, it can't be changed. In
      addition, choose two skills; you gain a +2 profane bonus on checks with
      those skills.</p>
