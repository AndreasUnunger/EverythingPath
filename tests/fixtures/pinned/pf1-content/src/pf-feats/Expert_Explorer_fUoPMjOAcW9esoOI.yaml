name: Expert Explorer
system:
  description:
    value: >-
      <p><em>You are trained to seek out the unknown places of the wild and can
      explore more efficiently than your untrained
      rivals.</em></p><p><strong>Prerequisites</strong>: Knowledge (nature) or
      Survival 5 ranks.</p><p><strong>Benefits</strong>: You gain a +2 bonus on
      skill checks when using the exploration rules presented on pages 124-125
      to detect features in a territory. If you succeed at such a skill check by
      5 or more, you gain an additional 1d4 Discovery Points.</p>
  tags:
    - General
type: feat
