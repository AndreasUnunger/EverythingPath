name: Old Cults Awakener
system:
  description:
    value: >-
      <p><em>You hear the voices of the Old Ones, and believe it is your destiny
      to awaken others to their ancient cause using bizarre and torturous
      rituals. Whether your work leaves these individuals mad or truly touched
      by alien sentience remains
      unproven.</em></p><p><strong>Prerequisites</strong>: Old Cults 20
      TPA.</p><p><strong>Benefits</strong>: You can attempt a DC 25 Heal check
      upon an unconscious but stable intelligent creature. The ritual takes 1
      hour to complete. If it's successful, the victim must make a DC 25 Will
      save or he gains a false memory of a vision that he has personally been
      chosen by the Great Old Ones to serve them (treat as an implanted memory
      from modify memory, except this is a nonmagical effect). If the ritual is
      unsuccessful, the victim takes 1d2 points of Intelligence and Wisdom
      drain; you may attempt the ritual again.</p>
  tags:
    - Faction
type: feat
