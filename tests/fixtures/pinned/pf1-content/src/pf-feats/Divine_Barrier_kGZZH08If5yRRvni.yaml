name: Divine Barrier
system:
  description:
    value: >-
      <p><em>You have trained in the art of blocking breath
      weapons.</em></p><p><strong>Prerequisites</strong>: Channel energy class
      feature, worshiper of Apsu.</p><p><strong>Benefits</strong>: When you are
      within an area effect that deals acid, cold, electricity, or fire damage,
      you can expend one use of your channel energy ability as an immediate
      action to shield yourself and all allies within 30 feet. You and allies
      within your shield only take half damage if they fail their save against
      the effect, and those who make a successful save take no damage from the
      effect.</p>
  tags:
    - General
type: feat
