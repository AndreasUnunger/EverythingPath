name: Twin Fang Lunge
system:
  description:
    value: >-
      <p><em>You strike with the force of a serpent's
      lunge.</em></p><p><strong>Prerequisites</strong>: Dex 15; Quick Draw; Twin
      Fang Strike; Twin Fang Style; Two-Weapon Fighting; Acrobatics 8 ranks;
      base attack bonus +8 or monk level 8th.</p><p><strong>Benefits</strong>:
      While using Twin Fang Style, you can spend a full-round action to move up
      to twice your speed and then use Twin Fang Strike as if you were taking
      the attack action.</p>
  tags:
    - Combat
type: feat
