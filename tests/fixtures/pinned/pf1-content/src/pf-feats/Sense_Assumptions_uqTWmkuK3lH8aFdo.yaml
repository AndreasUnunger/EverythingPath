img: systems/pf1/icons/feats/alertness.jpg
name: Sense Assumptions
system:
  description:
    value: >-
      <p><em>You can easily intuit an opponent's
      preconceptions.</em></p><p><strong>Prerequisites</strong>: Sense Motive 3
      ranks.</p><p><strong>Benefits</strong>: You can attempt a Sense Motive
      check to intuit some of another person's assumptions after 1 minute of
      conversation. The DC equals 20, or 10 + the target's Bluff modifier,
      whichever is higher. If you succeed, you learn whether or not a falsehood
      of your choice related to the topic of conversation would impose a penalty
      on Bluff checks to convince the target of that falsehood's truth. If you
      fail by 4 or less, you learn nothing. If you fail by 5 or more, the target
      realizes you are trying to glean information from it. You can retry this
      check, but the DC increases by 5 for each previous failure on this check
      against that target.</p>
  tags:
    - General
type: feat
