name: Greater Snap Shot
system:
  description:
    value: >-
      <p><em>You can prey on any gap in your foe's guard with impunity, and with
      even greater range.</em></p><p><strong>Prerequisites</strong>: Dex 17,
      Improved Snap Shot, Point-Blank Shot, Rapid Shot, Snap Shot, base attack
      bonus +12.</p><p><strong>Benefits</strong>: Whenever you make an attack of
      opportunity using a ranged weapon and hit, you gain a +2 bonus on the
      damage roll and a +2 bonus on rolls to confirm a critical hit with that
      attack. These bonuses increase to +4 when you have base attack bonus +16,
      and to +6 when you have base attack bonus +20.</p><p><strong>Combat
      Trick</strong>: When you make an attack of opportunity using a ranged
      weapon, you can spend 3 stamina points to gain your bonus from Greater
      Snap Shot on the attack roll.</p>
  tags:
    - Combat
type: feat
