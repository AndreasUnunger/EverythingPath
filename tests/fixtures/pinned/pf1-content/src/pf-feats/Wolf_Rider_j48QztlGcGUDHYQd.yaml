name: Wolf Rider
system:
  description:
    value: >-
      <p><em>Others can keep their horses. You know that wolves are better
      mounts.</em></p><p><strong>Prerequisites</strong>: Undersized Mount or
      effective level 7th in the class that grants the mount or divine bond
      (mount) class feature; Knowledge (nature) 1 rank; mount or divine bond
      (mount) class feature.</p><p><strong>Benefits</strong>: You can select a
      wolf in place of the normal mount available via your mount or divine bond
      (mount) class feature. In addition, Knowledge (nature) is always a class
      skill for you.</p>
