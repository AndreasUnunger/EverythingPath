name: Savage Critical
system:
  description:
    value: >-
      <p><em>You are able to land critical hits precisely, dealing devastating
      damage.</em></p><p><strong>Prerequisites</strong>: Str 19, ogre, sneak
      attack +2d6.</p><p><strong>Benefits</strong>: When you hit a creature
      using the Vital Strike feat or confirm a critical hit against an opponent,
      add your sneak attack damage to the damage from the attack. This feat has
      no effect on attacks that already allow you to add sneak attack
      damage.</p>
  tags:
    - General
type: feat
