name: Fey Spell Lore
system:
  description:
    value: >-
      <p><em>You have learned the treacherous spells employed by the
      fey.</em></p><p><strong>Prerequisites</strong>: Cha 13, Spellcraft 1 rank,
      ability to cast druid spells.</p><p><strong>Benefits</strong>: Add the
      following spells to your druid spell list at the indicated levels:
      0--dancing lights, 1st--lesser confusion, 2nd--charm person,
      3rd--invisibility, 4th--bestow curse, 5th--charm monster, 6th--major
      curse, 7th--cloak of dreams, 8th--insanity, 9th--irresistible dance.</p>
  tags:
    - General
type: feat
