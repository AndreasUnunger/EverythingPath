name: Noble Stipend
system:
  description:
    value: >-
      <p><em>You receive a small allowance from your noble family or
      inheritance.</em></p><p><strong>Prerequisites</strong>: Cha 13, Noble
      Scion.</p><p><strong>Benefits</strong>: You receive 100 gp at the
      beginning of every week that you can spend only on services and
      nonmaterial goods. Services and nonmaterial goods include the following.
      <ul><li>Hiring entertainers, messengers, mounts, servants, transport,
      workers, and so on.</li><li>Improving your lifestyle quality (see Cost of
      Living on page 405 of the Pathfinder RPG Core Rulebook).</li><li>Obtaining
      invitations to exclusive events or entry into privileged
      locations.</li><li>Paying for lodgings, stabling, taxes, and
      tolls.</li></ul></p>
  tags:
    - General
type: feat
