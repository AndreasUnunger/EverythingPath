name: Risky Striker
system:
  description:
    value: >-
      <p><em>You can make yourself a little more vulnerable to larger creatures
      in order to land a devastating
      blow.</em></p><p><strong>Prerequisites</strong>: Base attack bonus +1,
      halfling.</p><p><strong>Benefits</strong>: You can choose to take a -1
      penalty to AC to gain a +2 bonus on melee damage rolls against creatures
      two or more size categories larger than you. When your base attack bonus
      reaches +4 and every 4 levels thereafter, the penalty increases by -1 and
      the damage bonus increases by 2. The bonus damage is multiplied in the
      case of a critical hit. You can only choose to use this feat when you
      declare that you are making an attack action or a full-attack action with
      a melee weapon. The effects last until your next turn.</p><h3>Combat
      Trick</h3><p>: When using this feat, you can spend 5 stamina points to
      gain the bonus on damage rolls against creatures one or more size
      categories larger than you. This benefit ends when you stop using this
      feat or after 1 minute, whichever comes first.</p>
  tags:
    - Combat
    - Racial
    - Halfling
    - Combat Trick
type: feat
