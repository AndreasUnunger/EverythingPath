name: Empty Quiver Flexibility
system:
  description:
    value: >-
      <p><em>You can apply your ranged fighting feats to melee
      attacks.</em></p><p><strong>Prerequisites</strong>: Empty Quiver Style,
      Rapid Shot, Stabbing Shot, Weapon Focus with the chosen
      weapon.</p><p><strong>Benefits</strong>: While using Empty Quiver Style,
      you can apply any feats and class abilities you possess that modify your
      ranged attack rolls and damage rolls with the chosen weapon to melee
      attack rolls and damage rolls made with that weapon. Additionally, you are
      considered to be threatening the area around you as if you were wielding a
      melee weapon.</p>
  tags:
    - Combat
type: feat
