name: Cudgeler Style
system:
  description:
    value: >-
      <p><em>You have learned how to rush your foe and deliver an incapacitating
      blow.</em></p><p><strong>Prerequisites</strong>:
      Bludgeoner.</p><p><strong>Benefits</strong>: When you hit with a charge
      attack to deal nonlethal damage while using this style, your weapon deals
      damage as if it were one size category larger than it actually is. If you
      have the ability to make more than one attack on a charge, this increase
      applies only to your first attack.</p>
