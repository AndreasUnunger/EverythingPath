name: Deathless Zealot
system:
  description:
    value: >-
      <p><em>Only the most serious wounds can stop
      you.</em></p><p><strong>Prerequisites</strong>: Str 13, Con 17, orc or
      half-orc, Deathless Initiate, Deathless Master, Diehard, Endurance,
      Ironhide, base attack bonus +12.</p><p><strong>Benefits</strong>: Whenever
      a creature rolls to confirm a critical hit against you, it must roll twice
      and take the lowest result.</p><h3>Combat Trick</h3><p>Whenever a creature
      threatens a critical hit against you and neither of its confirmation rolls
      would succeed, you can spend 5 stamina points to make an attack of
      opportunity against that creature.</p>
  tags:
    - Combat
    - Racial
    - Half-Orc
    - Orc
    - Combat Trick
type: feat
