name: Masked Symbol
system:
  description:
    value: >-
      <p><em>Your alternate identity exists as a nearly inhuman avatar of a mood
      or cause.</em></p><p><strong>Prerequisites</strong>: Disguise 1 rank or
      dual identity class feature.</p><p><strong>Benefits</strong>: Your masked
      persona represents a particular concept, granting you a benefit while in
      your masked persona or vigilante identity. Each time you gain a new
      character level, you can choose to embody a different symbol, forgoing
      your previous bonus and gaining a new one. Faith<br />+2 circumstance
      bonus on Diplomacy checks against creatures of your faith; +2 circumstance
      bonus on Intimidate checks against enemies of your faith.</p><hr
      /><p><strong>Fear</strong>:+3 circumstance bonus on Intimidate
      checks.</p><p><strong>Hope</strong>:+3 circumstance bonus on Diplomacy
      checks.</p><p><strong>Leadership</strong>:+2 bonus to your Leadership
      score.</p><p><strong>Mystery</strong>:+2 circumstance bonus on Disguise
      checks to conceal your true identity; +2 circumstance bonus on Stealth
      checks to enter or escape unseen.</p><p><strong>The People</strong>:+2
      circumstance bonus on checks to influence
      crowds.</p><p><strong>Trust</strong>:+2 circumstance bonus on Bluff checks
      to lie and Diplomacy checks to make requests.</p>
  tags:
    - General
type: feat
