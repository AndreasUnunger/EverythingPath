name: Boar Shred
system:
  description:
    value: >-
      <p><em>The wounds you inflict with your unarmed strikes bleed, giving you
      renewed vigor.</em></p><p><strong>Prerequisites</strong>: Improved Unarmed
      Strike, Boar Ferocity, Boar Style, Intimidate 9
      ranks.</p><p><strong>Benefits</strong>: You can make an Intimidate check
      to demoralize an opponent as a move action. While using Boar Style,
      whenever you tear an opponent's flesh, once per round at the start of that
      opponent's turn he takes 1d6 bleed damage. The bleed damage dealt while
      using Boar Style persist even if you later switch to a different
      style.</p><h3>Combat Trick</h3><p>You can spend 2 stamina points to
      demoralize an opponent as a swift action.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
