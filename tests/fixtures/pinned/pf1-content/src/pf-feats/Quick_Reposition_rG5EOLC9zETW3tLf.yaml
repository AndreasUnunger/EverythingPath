img: systems/pf1/icons/misc/divert.png
name: Quick Reposition
system:
  description:
    value: >-
      <p><em>Your opponent becomes an unwitting dance partner, following your
      lead while you fight.</em></p><p><strong>Prerequisites</strong>: Int 13,
      Combat Expertise, Improved Reposition, base attack bonus
      +6.</p><p><strong>Benefits</strong>: On your turn, you can perform a
      single reposition combat maneuver (Advanced Players Guide 320) in place of
      one of your melee attacks. You must choose the melee attack with the
      highest base attack bonus to make the
      reposition.</p><p><strong>Normal</strong>: A reposition combat maneuver is
      a standard action.</p><h3>Combat Trick</h3><p>: You can select this feat
      even if you don't meet the ability score prerequisite (Intelligence 13).
      You gain the benefits of this feat only as long as you have at least 1
      stamina point in your stamina pool. You can spend 2 stamina points to
      change an attack that does not have your highest base attack bonus into a
      reposition combat maneuver. You can use this combat trick only once per
      round, but you can use it even if you already used your attack at the
      highest base attack bonus to reposition.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
