name: Cold Celerity
system:
  description:
    value: >-
      <p><em>You are a child of the frozen north, and you draw strength from the
      biting cold and unforgiving
      conditions.</em></p><p><strong>Prerequisites</strong>:
      Endurance.</p><p><strong>Benefits</strong>: When you are in conditions of
      severe cold (below 0 x° F), you gain a +2 bonus on initiative checks and a
      +1 bonus on attack rolls. In addition, you gain the bonus on attack rolls
      for 1 round after any round in which you take cold damage.</p>
  tags:
    - General
type: feat
