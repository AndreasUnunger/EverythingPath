name: Reject Poison
system:
  description:
    value: >-
      <p><em>You are a careful poisoner, and know how to protect yourself
      against exposure to the ill effects of most
      substances.</em></p><p><strong>Prerequisites</strong>: Con 13, poison use
      class feature, worshiper of Norgorber.</p><p><strong>Benefits</strong>:
      Whenever you fail the initial saving throw against poison, you have a 20%
      chance of naturally rejecting the toxin, negating its effects and wasting
      its use.</p>
