name: Soulless Gaze
system:
  description:
    value: >-
      <p><em>Otherworldly dread infuses your
      gaze.</em></p><p><strong>Benefits</strong>: You can use the Intimidate
      skill to manipulate and terrify others.</p><p>One Damnation Feat</p><p>You
      gain a +2 bonus on Intimidate checks.</p><p>Two Damnation Feats</p><p>When
      you demoralize a creatures more than once using Intimidate, you can create
      stronger fear conditions rather than increasing the duration of the shaken
      condition.</p><p>Three Damnation Feats</p><p>You gain a +2 bonus on
      Intimidate checks (this stacks with the earlier benefits of this
      feat).</p><p>Four Damnation Feats</p><p>You can use Intimidate to
      demoralize opponents as a swift action.</p>
  tags:
    - Damnation
type: feat
