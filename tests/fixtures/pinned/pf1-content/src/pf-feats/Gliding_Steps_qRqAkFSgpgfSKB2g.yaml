name: Gliding Steps
system:
  description:
    value: >-
      <p><em>You skate across the surface of the earth as if gliding on
      ice.</em></p><p><strong>Prerequisites</strong>: Dodge, Mobility, Nimble
      Moves, ki pool.</p><p><strong>Benefits</strong>: If you have at least one
      ki in your ki pool, when you move you do not provoke attacks of
      opportunity when leaving the first square of that movement. You can spend
      1 ki point to avoid provoking attacks of opportunity during that entire
      move.</p>
  tags:
    - General
type: feat
