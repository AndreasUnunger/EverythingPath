name: Starlight Summons
system:
  description:
    value: >-
      <p><em>Your summoned minions slink along under the shadows of the
      stars.</em></p><p><strong>Prerequisites</strong>: Spell Focus
      (conjuration), able to cast summon nature's
      ally.</p><p><strong>Benefits</strong>: Creatures you summon gain the
      Blind-Fight feat, a +5 bonus to Perception and Stealth checks in dim light
      or darkness, and their natural weapons are treated as cold iron for
      overcoming damage reduction.</p>
  tags:
    - General
type: feat
