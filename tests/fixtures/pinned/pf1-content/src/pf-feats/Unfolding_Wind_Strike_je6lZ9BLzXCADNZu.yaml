name: Unfolding Wind Strike
system:
  description:
    value: >-
      <p><em>The wind through which your thrown weapons fly directs them to
      their targets or back to your
      hand.</em></p><p><strong>Prerequisites</strong>: Dex 13; Wis 13; Perfect
      Style; Quick Draw; base attack bonus +9 or monk level
      9th.</p><p><strong>Benefits</strong>: When using Perfect Style, you double
      the range increment of any thrown weapon you wield. You can spend 1 ki
      point as a swift action to imbue a number of thrown weapons equal to your
      Wisdom bonus with the returning or seeking weapon special ability for 1
      round.</p><h3>Combat Trick</h3><p>: You can spend 2 stamina points instead
      of 1 ki point when using Unfolding Wind Strike.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
