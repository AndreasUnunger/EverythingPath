name: Old as Dust
system:
  description:
    value: >-
      <p><em>You have been dead for so long you have become quite difficult to
      kill.</em></p><p><strong>Prerequisites</strong>: Sleeper, Warren Digger,
      creature has been a ghoul for at least 500
      years.</p><p><strong>Benefits</strong>: When you are reduced to 0 hit
      points, you are not destroyed--you cannot be killed unless your body is
      completely destroyed with fire or doused in holy water, or you take damage
      from a cure spell or channeled positive energy after you've been reduced
      to 0 hit points. Anytime you are reduced to 0 hit points, you remain
      unconscious until you are healed or until the following midnight, at which
      time you regain 1 hit point per Hit Die and awaken.</p>
  tags:
    - General
type: feat
