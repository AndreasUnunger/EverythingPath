name: Survivor
system:
  contextNotes:
    - target: conChecks
      text: +[[5]] to stabilize while dying
  description:
    value: >-
      <p><em>Only the strong thrive in your homeland, and you are no weakling,
      even among your kin.</em></p><p><strong>Prerequisites</strong>: Con 13,
      Diehard, Endurance.</p><p><strong>Benefits</strong>: You gain a +5 bonus
      on all Constitution checks made to stabilize while dying. Once per day, if
      you are struck by a critical hit or sneak attack, you can spend an
      immediate action to negate the critical or the sneak attack damage, making
      the attack a normal hit.</p>
  tags:
    - General
type: feat
