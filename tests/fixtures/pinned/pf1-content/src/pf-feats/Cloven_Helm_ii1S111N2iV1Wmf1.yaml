name: Cloven Helm
system:
  description:
    value: >-
      <p><em>Your helm turns aside lethal
      blows.</em></p><p><strong>Prerequisites</strong>: Dented Helm,
      Hard-Headed, base attack bonus +11,
      dwarf.</p><p><strong>Benefits</strong>: When wearing a helmet, you add +1
      to your AC against critical hit confirmation rolls; this benefit stacks
      with Dented Helm. When you use Dented Helm to deflect a critical hit, you
      may apply all damage from the critical hit to your helmet before applying
      any damage to yourself. If you take no damage, any additional effects,
      such as critical feats or poison, are negated.</p><p><strong>Combat
      Trick</strong>: When you are threatened with a critical hit, you can spend
      up to 5 stamina points. You gain an additional bonus to AC against the
      critical confirmation roll equal to the number of stamina points you
      spent.</p>
  tags:
    - Combat
    - Racial
    - Dwarf
type: feat
