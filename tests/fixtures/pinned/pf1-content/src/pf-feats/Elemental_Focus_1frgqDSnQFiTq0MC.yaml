name: Elemental Focus
system:
  description:
    value: >-
      <p><em>Your spells of a certain element are more difficult to
      resist.</em></p><p><strong>Benefits</strong>: Choose one energy type
      (acid, cold, electricity, or fire). Add +1 to the Difficulty Class for all
      saving throws against spells that deal damage of the energy type you
      select.</p><p><strong>Special</strong>: You can gain this feat multiple
      times. Its effects do not stack. Each time you take this feat, it applies
      to a new energy type.</p>
  tags:
    - General
type: feat
