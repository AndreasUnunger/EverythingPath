name: Unaging
system:
  description:
    value: >-
      <p><em>You take after your long-lived elven parent more than other
      half-elves. While your life-span is not any longer than usual, age weighs
      less heavily on your shoulders.</em></p><p><strong>Prerequisites</strong>:
      Half-elf.</p><p><strong>Benefits</strong>: You gain a +4 racial bonus to
      resist any effect that would magically age you or otherwise displace you
      in time. In addition, you reduce all penalties gained from magical aging
      by 1.</p>
  tags:
    - Racial
    - Half-Elf
type: feat
