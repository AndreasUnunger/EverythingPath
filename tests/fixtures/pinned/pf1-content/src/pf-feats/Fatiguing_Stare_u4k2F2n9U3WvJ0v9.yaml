name: Fatiguing Stare
system:
  description:
    value: >-
      <p><em>Your painful stare fatigues your
      opponent.</em></p><p><strong>Prerequisites</strong>: Mesmerist level 7th,
      painful stare class feature.</p><p><strong>Benefits</strong>: When a
      target takes damage from your painful stare, it must succeed at a
      Fortitude saving throw (DC = 10 + 1/2 your mesmerist level + your Charisma
      modifier) or become fatigued for 1 round. This can't cause the target to
      become exhausted, even if the target is already fatigued.</p>
  tags:
    - Combat
    - Stare
type: feat
