name: Precocious Youth
system:
  description:
    value: >-
      <p><em>Even in youth, you seek to be more adult than your childish peers,
      a personal trait that will no doubt aid you in future
      years.</em></p><p><strong>Prerequisites</strong>: Young age
      category.</p><p><strong>Benefits</strong>: You lose one of the penalties
      associated with the young age category, either -2 Constitution, -2
      Strength, or -2 Wisdom. Upon reaching adulthood you may exchange this feat
      for Great Fortitude, Iron Will, or Lightning
      Reflexes.</p><p><strong>Special</strong>: You may take this feat up to
      three times. Each time you do, it affects a different penalty and must be
      exchanged for a different feat upon reaching adulthood.</p>
  tags:
    - General
type: feat
