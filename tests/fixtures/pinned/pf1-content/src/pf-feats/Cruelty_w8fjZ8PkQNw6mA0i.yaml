name: Cruelty
system:
  description:
    value: >-
      <p><em>The suffering of others compels you to greater
      cruelties.</em></p><p><strong>Prerequisites</strong>: Worshiper of
      Zon-Kuthon.</p><p><strong>Benefits</strong>: Whenever you deal bleed
      damage to an opponent, cause an opponent to suffer a fear or pain effect,
      or reduce an opponent's hit points to 0 or fewer, you gain a +2 morale
      bonus on attack rolls and weapon damage rolls for 1 round.</p>
