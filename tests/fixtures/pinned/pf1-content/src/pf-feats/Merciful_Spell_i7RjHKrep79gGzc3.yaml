name: Merciful Spell
system:
  description:
    value: >-
      <p><em>Your damaging spells subdue rather than
      kill.</em></p><p><strong>Benefits</strong>: You can alter spells that
      inflict damage to inflict nonlethal damage instead. Spells that inflict
      damage of a particular type (such as fire) inflict nonlethal damage of
      that same type. A merciful spell does not use up a higher-level spell slot
      than the spell's actual level.</p>
  tags:
    - Metamagic
type: feat
