name: Exsanguinate
system:
  description:
    value: >-
      <p><em>You drink blood from the living at a furious rate, often draining
      creatures dry in a matter of
      seconds.</em></p><p><strong>Prerequisites</strong>: Blood drain universal
      monster ability, grab universal monster
      ability.</p><p><strong>Benefits</strong>: Once per round, when you
      successfully pin an opponent, that opponent takes double the normal damage
      from your blood drain.</p>
