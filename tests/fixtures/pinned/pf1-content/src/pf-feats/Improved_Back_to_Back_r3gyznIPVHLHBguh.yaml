name: Improved Back to Back
system:
  description:
    value: >-
      <p><em>After much practice, you and an ally have become adept at fighting
      in close proximity to one
      another.</em></p><p><strong>Prerequisites</strong>: Back to Back,
      Perception 5 ranks.</p><p><strong>Benefits</strong>: While you are
      adjacent to an ally who is flanked and also has this feat, you can spend a
      swift action to gain a +2 bonus to AC against all flankers until the start
      of your next turn.</p>
  tags:
    - Teamwork
type: feat
