name: Revelation Strike
system:
  description:
    value: >-
      <p><em>Your unarmed strike brings a revelation down upon your
      foe.</em></p><p><strong>Prerequisites</strong>: Revelation class feature,
      Improved Unarmed Strike.</p><p><strong>Benefits</strong>: When you gain
      this feat, choose one revelation that you can use to affect no more than
      one opponent. If you make a successful unarmed strike against an opponent,
      in addition to dealing your unarmed strike damage, you can use a swift
      action to deliver the effects of the chosen revelation to that opponent.
      Doing so provokes no attacks of
      opportunity.</p><p><strong>Special</strong>: You can take this feat
      multiple times. Each time you take it, you apply it to a different
      qualifying revelation.</p><h3>Combat Trick</h3><p>: After hitting with an
      unarmed strike, you can spend 2 stamina points to apply the effects of
      your chosen revelation as a free action instead of a swift action. If the
      chosen revelation has unlimited daily uses, this combat trick costs 5
      stamina points instead.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
