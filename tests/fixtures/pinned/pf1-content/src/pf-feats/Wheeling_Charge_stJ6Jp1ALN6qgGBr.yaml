name: Wheeling Charge
system:
  description:
    value: >-
      <p><em>Your mount moves with ease across
      battlefields.</em></p><p><strong>Prerequisites</strong>: Mounted Combat,
      Ride-By Attack, Ride 5 ranks, Lastwall
      affinity.</p><p><strong>Benefits</strong>: When you are mounted and use
      the charge action, your mount can make one turn of up to 90 degrees as
      part of the move, as long as each part of the move is at least 10 feet.
      You may make an attack during any part of this move. Your total movement
      for the round can't exceed double your mounted speed. Allied creatures do
      not impede your charge, though you cannot attack from or end your move in
      an ally's space.</p><p><strong>Normal</strong>: You cannot turn when
      making a charge.</p>
  tags:
    - Combat
type: feat
