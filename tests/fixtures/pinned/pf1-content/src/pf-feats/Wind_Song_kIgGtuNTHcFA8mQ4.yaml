name: Wind Song
system:
  description:
    value: >-
      <p><em>You have learned to play haunting, captivating melodies similar to
      those of the eerie Painted Flutes canyon. Like an echo, the wind carries
      the sound and magic of your music much farther than it would normally
      reach.</em></p><p><strong>Prerequisites</strong>: Perform (wind
      instruments) 5 ranks; bardic performance or raging song class
      feature.</p><p><strong>Benefits</strong>: Three times per day while you
      are using a wind instrument to play a bardic performance or raging song,
      you can spend an extra round of performance at the start of your
      performance and choose a square within 120 feet. Strange echoes carry your
      music, and for the purpose of determining which creatures are affected by
      your performance, your performance counts as originating from that square
      rather than from your location. You cannot change the square from which
      the music originates until you end your performance. If you move beyond
      120 feet from the chosen square, the performance immediately ends.</p>
  tags:
    - General
type: feat
