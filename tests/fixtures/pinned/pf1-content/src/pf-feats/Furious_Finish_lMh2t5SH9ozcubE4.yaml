name: Furious Finish
system:
  description:
    value: >-
      <p><em>You channel all of your rage into one massive blow to crush your
      enemy.</em></p><p><strong>Prerequisites</strong>: Rage class feature,
      Vital Strike, base attack bonus +6.</p><p><strong>Benefits</strong>: While
      raging, when you use the Vital Strike feat, you can choose not to roll
      your damage dice and instead deal damage equal to the maximum roll
      possible on those damage dice. If you do, your rage immediately ends, and
      you are fatigued (even if you would not normally be).</p>
  tags:
    - General
type: feat
