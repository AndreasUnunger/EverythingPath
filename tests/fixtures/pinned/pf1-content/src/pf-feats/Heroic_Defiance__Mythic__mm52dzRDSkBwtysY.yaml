name: Heroic Defiance (Mythic)
system:
  description:
    value: >-
      <p><em>You ignore harmful effects that would bring others
      down.</em></p><p><strong>Prerequisites</strong>: Heroic
      Defiance.</p><p><strong>Benefits</strong>: Once per day as an immediate
      action, you can attempt to negate the onset of one harmful condition or
      affliction (such as panicked, paralyzed, stunned, and so on) that allowed
      a saving throw for its onset, not including permanent and instantaneous
      conditions. When you do so, attempt a Will saving throw with a bonus equal
      to your tier against the original DC of the effect. If you succeed, the
      condition is negated. If you fail, the onset is delayed until the end of
      your next turn, after which it takes its normal effect. This feat has no
      effect on hit point damage or ability damage.</p><p>This effect is
      separate from the use of non-mythic Heroic Defiance.</p>
  tags:
    - General
    - Mythic
type: feat
