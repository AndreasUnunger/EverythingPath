name: Ambush Awareness
system:
  description:
    value: >-
      <p><em>You are always on your toes and are rarely caught off-guard for
      long, even when an enemy gets the jump on
      you.</em></p><p><strong>Prerequisites</strong>:
      Alertness.</p><p><strong>Benefits</strong>: If you are unable to act in
      the surprise round because you failed a Perception check, you can still
      act on your initiative count in the surprise round, but only to take the
      total defense action.</p><p><strong>Normal</strong>: If you are unable to
      act in the surprise round because you failed a Perception check, you can't
      take any actions during the surprise round.</p><p><strong>Combat
      Trick</strong>: You can spend 3 stamina points to grant the benefit of
      this feat to an adjacent ally. (Dirty Tactics Toolbox 12)</p>
  tags:
    - General
type: feat
