img: systems/pf1/icons/skills/violet_12.jpg
name: Snuffing Spell
system:
  description:
    value: >-
      <p><em>Your magic disrupts sources of
      light.</em></p><p><strong>Benefits</strong>: You can modify a spell to
      extinguish magical and nonmagical light sources that the target has. The
      first time a creature takes damage from or fails a saving throw against a
      snuffing spell, any nonmagical light sources it has are immediately
      extinguished and you can attempt to dispel any active spells with the
      light descriptor that are affecting the target as if you had also cast the
      targeted version of dispel magic. Spells that do not target creatures
      can't be snuffing spells.</p><p>A snuffing spell uses up a spell slot 2
      levels higher than the spell's actual level.</p>
  tags:
    - Metamagic
type: feat
