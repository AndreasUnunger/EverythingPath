img: systems/pf1/icons/conditions/prone.png
name: Tandem Trip
system:
  description:
    value: >-
      <p><em>You know how to work together to trip your
      foes.</em></p><p><strong>Benefits</strong>: Whenever you attempt a trip
      combat maneuver against an enemy threatened by an ally with this feat, you
      roll twice and take the better result.</p><p><strong>Combat
      Trick</strong>: When attempting to trip a target that is threatened by one
      of your allies, you can spend 2 stamina points to gain this feat's benefit
      even if the threatening ally doesn't have this feat.</p>
  tags:
    - Combat
    - Teamwork
type: feat
