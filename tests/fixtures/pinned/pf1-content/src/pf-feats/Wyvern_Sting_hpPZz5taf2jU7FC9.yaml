name: Wyvern Sting
system:
  description:
    value: >-
      <p><em>You can use your whip like a wyvern's sting, forcing foes to give
      it their undivided attention.</em></p><p><strong>Prerequisites</strong>:
      Exotic Weapon Proficiency (whip), Wyvern Fury Style, Acrobatics 6 ranks,
      brawler's flurry class feature or flurry of blows class
      feature.</p><p><strong>Benefits</strong>: While using Wyvern Fury Style,
      if you successfully attack a foe with a whip or scorpion whip, as a swift
      action you can choose one ally. Until the beginning of your next turn,
      that ally can leave spaces threatened by that foe without provoking an
      attack of opportunity from the foe.</p>
  tags:
    - Combat
type: feat
