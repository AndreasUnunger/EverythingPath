name: Hook Fighter
system:
  description:
    value: >-
      <p><em>In your deft hands, a climbing tool becomes a deadly
      weapon.</em></p><p><strong>Prerequisites</strong>: Base attack bonus
      +1.</p><p><strong>Benefits</strong>: You treat a grappling hook as a
      one-handed weapon that deals piercing damage equal to a heavy pick of its
      size and that has the disarm and trip special weapon features. You do not
      incur penalties as you would for using a grappling hook as an improvised
      weapon. If you are proficient with whips and your grappling hook has at
      least 10 feet of rope or chain attached to it, you can treat it as a
      two-handed melee weapon with 15-foot reach, though you can use it against
      foes anywhere within your reach (including adjacent foes), though you
      don't threaten any squares with it. Changing between using a grappling
      hook as a normal weapon and a reach weapon is a move action. When
      performing a reposition maneuver with a grappling hook, you can only move
      the target toward you from its original position.</p>
  tags:
    - Combat
type: feat
