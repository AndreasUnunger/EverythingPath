name: Exorcising Mutilation
system:
  description:
    value: >-
      <p><em>Malevolent entities that seek to possess or dominate you are
      unaware of how far you will go to stop
      them.</em></p><p><strong>Prerequisites</strong>: Con 15, Clarity of Pain,
      Improved Iron Will, Iron Will.</p><p><strong>Benefits</strong>: When you
      fail a saving throw to resist possession or a dominate spell, you can deal
      4 points of Constitution damage to yourself and reroll your saving throw
      as an immediate action. You cannot reduce or negate this damage in any
      way, and the only way to heal the damage is through natural recovery;
      magical methods don't work. You must take the result of the second roll,
      even if it is worse. If you succeed at the second saving throw, you also
      become immune to that spell or ability from that creature for 24 hours.
      You must be wielding a lethal piercing or slashing weapon, or possess a
      claw natural attack or some way to draw such a weapon reactively without
      using your immediate action, to use this ability.</p>
  tags:
    - General
type: feat
