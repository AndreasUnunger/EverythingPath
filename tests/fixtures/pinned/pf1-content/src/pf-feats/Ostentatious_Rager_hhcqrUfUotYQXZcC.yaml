name: Ostentatious Rager
system:
  description:
    value: >-
      <p><em>You can enthrall onlookers with a show of ferocious might or compel
      enemies to regard you as a crucial
      threat.</em></p><p><strong>Prerequisites</strong>: Intimidate 5 ranks,
      rage class feature.</p><p><strong>Benefits</strong>: You can earn money
      with Intimidate by performing feats of strength and intimidation, exactly
      as if you were doing so with the Perform skill.</p><p>Additionally, while
      you're raging, if a foe would be demoralized by your Intimidate skill and
      the foe is not currently shaken by your intimidation, you can instead
      distract that foe until the beginning of your next turn. During that time,
      the foe takes a -5 penalty on Perception checks that don't involve you and
      takes a -2 penalty to its AC against any creature other than you. These
      effects end early if a creature other than you attacks the foe or if you
      demoralize the foe and apply the shaken condition.</p>
  tags:
    - Combat
type: feat
