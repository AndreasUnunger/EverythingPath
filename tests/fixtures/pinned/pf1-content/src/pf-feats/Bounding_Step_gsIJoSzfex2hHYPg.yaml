name: Bounding Step
system:
  description:
    value: >-
      <p><em>You can leap through difficult terrain like a deer or
      elk.</em></p><p><strong>Prerequisites</strong>: Dex 15, Nimble
      Moves.</p><p><strong>Benefits</strong>: You gain a +2 bonus on Acrobatics
      checks to keep your balance and Reflex saves to avoid falling.
      Additionally, select one terrain type from the ranger list of favored
      terrains. Within that terrain, the maximum number of feet of difficult
      terrain you can move through as if it were normal terrain increases by 10
      feet.</p><p><strong>Normal</strong>: Nimble Moves allows you to move
      through 5 feet of difficult terrain each round as if it were normal
      terrain.</p><p><strong>Special</strong>: If you have the favored terrain
      class feature, you do not select a terrain with this feat. Instead, this
      feat's increased movement through difficult terrain applies to all of your
      favored terrains.</p>
  tags:
    - General
type: feat
