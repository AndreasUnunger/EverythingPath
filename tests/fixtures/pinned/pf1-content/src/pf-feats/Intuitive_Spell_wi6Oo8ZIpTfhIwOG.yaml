name: Intuitive Spell
system:
  description:
    value: >-
      <p><em>You can avoid the need for thought components by trusting your
      instincts.</em></p><p><strong>Benefits</strong>: An intuitive spell can be
      cast with no thought components. Spells without thought components are not
      affected. An intuitive spell uses up a spell slot 1 level higher than the
      spell's actual level.</p>
