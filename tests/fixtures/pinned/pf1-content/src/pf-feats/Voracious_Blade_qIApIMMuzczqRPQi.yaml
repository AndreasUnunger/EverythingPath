name: Voracious Blade
system:
  description:
    value: >-
      <p><em>You can channel your daemonic energies through the vile blade you
      wield.</em></p><p><strong>Prerequisites</strong>: Weapon Focus (rhoka
      sword), base attack bonus +4, urdefhan.</p><p><strong>Benefits</strong>:
      When wielding a rhoka sword, you can channel your daemonic energies
      through the blade as a swift action, causing it to deal Strength damage as
      your bite attack. You can use this ability a number of times per day equal
      to your Constitution modifier (minimum 1).</p>
  tags:
    - Combat
type: feat
