name: Focused Magical Beast Expertise
system:
  description:
    value: >-
      <p><em>You move in ways that confound creatures that would strike you
      repeatedly.</em></p><p><strong>Prerequisites</strong>: Favored enemy
      (magical beast) class feature.</p><p><strong>Benefits</strong>: If a
      creature makes three or more attacks with natural weapons against you
      during its turn, you gain partial cover against the third and subsequent
      natural attacks from that creature. If the creature makes five or more
      attacks against you with natural weapons, you gain cover (instead of
      partial cover) against the fifth and subsequent natural attacks. If the
      attacker is a magical beast, reduce by one the number of natural attacks
      it must make in order for you to gain cover or partial cover.</p>
  tags:
    - Combat
type: feat
