name: Trade Initiative
system:
  description:
    value: >-
      <p><em>You're an expert at helping your partner respond faster, and vice
      versa.</em></p><p><strong>Benefits</strong>: After initiative is rolled
      but before enemies' initiative is revealed, you may trade the results of
      your die roll (not including modifiers) with an adjacent ally who also
      possesses this feat.</p>
  tags:
    - Teamwork
type: feat
