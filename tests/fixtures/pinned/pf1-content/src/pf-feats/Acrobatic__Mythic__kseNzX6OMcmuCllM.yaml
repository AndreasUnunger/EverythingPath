    value: >-
      <p><em>Your grace and fluidity are beyond
      compare.</em></p><p><strong>Prerequisites</strong>:
      Acrobatic.</p><p><strong>Benefits</strong>: The bonus on Acrobatics and
      Fly skill checks from Acrobatic increases by 2. In addition, you can
      expend one use of mythic power to treat an Acrobatics or Fly check as if
      you had rolled a natural 20. You must decide to use this ability before
      making the roll.</p>
