img: systems/pf1/icons/races/ratfolk.png
name: Focused Vermin Expertise
system:
  description:
    value: >-
      <p><em>Your experience with vermin resists the attacks of
      swarms.</em></p><p><strong>Prerequisites</strong>: Favored enemy (vermin)
      class feature.</p><p><strong>Benefits</strong>: You gain DR/-- equal to
      half your favored enemy (vermin) bonus against vermin and creatures with
      the swarm subtype. When attempting Fortitude saves against a swarm's
      distraction ability, you gain a bonus on the save equal to the damage
      prevented by this feat. Against vermin with the swarm subtype, the amount
      of damage reduction is equal to your full favored enemy (vermin) bonus.
      This damage reduction does not stack with that from other sources.</p>
  tags:
    - Combat
type: feat
