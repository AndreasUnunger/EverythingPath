name: Improved Drag (Mythic)
system:
  description:
    value: >-
      <p><em>You pull your enemies around the battlefield with great
      ease.</em></p><p><strong>Prerequisites</strong>: Improved
      Drag.</p><p><strong>Benefits</strong>: You gain a bonus equal to half your
      tier on checks to attempt a drag combat maneuver, and to your CMD when an
      opponent attempts a drag combat maneuver against you. These bonuses stack
      with those granted by Improved Drag.</p><p>Furthermore, you can make an
      attack of opportunity against any creature that attempts a drag maneuver
      against you, unless it also has this feat.</p>
  tags:
    - Combat
    - Mythic
type: feat
