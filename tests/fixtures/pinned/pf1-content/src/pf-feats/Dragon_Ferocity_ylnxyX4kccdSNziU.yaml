name: Dragon Ferocity
system:
  description:
    value: >-
      <p><em>You attack with the strength of a dragon, your telling blows
      striking fear into your
      enemies.</em></p><p><strong>Prerequisites</strong>: Str 15, Improved
      Unarmed Strike, Dragon Style, Stunning Fist, Acrobatics 5
      ranks.</p><p><strong>Benefits</strong>: While using Dragon Style, increase
      your Strength bonus on unarmed strike damage rolls by an additional
      one-half your Strength bonus, to a total of double your Strength bonus on
      the first attack and 1-1/2 times your Strength bonus on the other attacks.
      When you score a critical hit or a successful Stunning Fist attempt
      against an opponent while using this style, that opponent is also shaken
      for a number of rounds equal to 1d4 + your Strength
      bonus.</p><p><strong>Special</strong>: Taking this feat allows you to
      qualify for the Elemental Fist feat (Advanced Player's Guide 158) even if
      you do not meet that feat's prerequisites. If you do not meet that feat's
      prerequisites, you must choose one of the damage types that feat offers,
      and you can use only that damage type with your Elemental Fist attacks
      until you meet the feat's normal prerequisites. A monk with this feat can
      use Elemental Fist as if he were a monk of the four winds (Advanced
      Player's Guide 112).</p><h3>Combat Trick</h3><p>When you use this feat to
      make a foe shaken with a critical hit or a successful Stunning Fist
      attempt, you can spend 5 stamina points to also sicken that foe for 1d4
      rounds.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
