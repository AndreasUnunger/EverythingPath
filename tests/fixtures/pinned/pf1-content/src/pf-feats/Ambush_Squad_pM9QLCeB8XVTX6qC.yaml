name: Ambush Squad
system:
  description:
    value: >-
      <p><em>You know that the keys to victory are sudden attacks and even more
      sudden retreats.</em></p><p><strong>Prerequisites</strong>: Base attack
      bonus +1, kobold.</p><p><strong>Benefits</strong>: When you're adjacent to
      an ally who also has this feat at the beginning of a surprise round, and
      both you and that ally can act during that surprise round, you can take
      both a standard action and a move action during that surprise
      round.</p><p><strong>Normal</strong>: You can take only a standard action
      or a move action during a surprise round.</p>
  tags:
    - Combat
    - Teamwork
    - Racial
    - Kobold
type: feat
