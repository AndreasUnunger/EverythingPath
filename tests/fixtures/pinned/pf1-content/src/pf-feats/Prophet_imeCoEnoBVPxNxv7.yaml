name: Prophet
system:
  description:
    value: >-
      <p><em>The truth has been revealed, and you have been chosen to deliver
      it.</em></p><p><strong>Prerequisites</strong>: Ability to cast divine
      spells, and you must either have received a vision from your god (or
      another appropriate supernatural entity) or have the Marked by the Gods
      background (see Ultimate Campaign).</p><p><strong>Benefits</strong>: If
      you are nonevil and worship a nonevil deity, whenever you cast a
      beneficial spell on an ally you gain a +1 sacred bonus to AC for 1 round
      per spell level. If you are evil or worship an evil deity, whenever you
      cast a harmful spell on an enemy you gain a +1 profane bonus to AC for 1
      round per spell level. Casting a spell on yourself does not count unless
      it also affects an ally.</p><p><strong>Goal</strong>: Convert an
      appropriate number of creatures to the worship of your
      deity.</p><p><strong>Completion Benefit</strong>: Your bonus to AC for
      casting beneficial or harmful spells on allies increases to +2, and the
      bonus also applies on saving throws for the same duration.
      </p><p><strong>Suggested Traits<br /></strong>Called, Ease of FaithAPG,
      Mystery Initiate.</p><h2>Possible Prophet
      Quests</h2><table><tbody><tr><td>d8</td><td>Quest</td></tr><tr><td>1</td><td>You
      have been tasked with bringing Iomedae&rsquo;s faith to
      &ldquo;uncivilized&rdquo; backwoods people in a randomly determined nation
      (page 222).</td></tr><tr><td>2</td><td>The Umbral Court of Nidal expressly
      forbids the worship of gods other than Zon-Kuthon within their shadowy
      nation, but you&rsquo;re set to protect and spread Desna&rsquo;s ideals to
      the Nidalese, either at large or in a relatively confined region, such as
      around the Atteran Ranches (page 135).</td></tr><tr><td>3</td><td>You seek
      to aid the little-known breed of horse-headed centaurs in the Exalted Wood
      in Razmiran and introduce them to your faith (page
      159).</td></tr><tr><td>4</td><td>The Last Temple of Rahadoum offers the
      potential of many desperate evangelists who might aid you in spreading
      your god&rsquo;s faith in that domineering nation of atheists (page
      157).</td></tr><tr><td>5</td><td>Inspired by the Hellknights of the Order
      of the Godclaw, you preach the words of your lawful patron among the
      rebellious rabble of Cheliax, whom you will turn into models of discipline
      whether they like it or not (page
      266).</td></tr><tr><td>6</td><td>Disgusted by the disrespect of the
      Molthuni toward the once-sacred valley called Deadeye&rsquo;s Haunt, you
      intend to show them the error of their ways with the power of Erastil
      (page 139).</td></tr><tr><td>7</td><td>You spread the faith of Milani, the
      Everbloom, by expelling unjust tyrants and aiding the downtrodden (page
      229).</td></tr><tr><td>8</td><td>Your patron&mdash;a demon lord,
      archdevil, or other generally unwanted influence (determine
      randomly)&mdash;inspires you to disguise your faith and reveal it only
      slowly to potential converts in order to lure them into the fold (page
      231).</td></tr></tbody></table>
  tags:
    - Story
type: feat
