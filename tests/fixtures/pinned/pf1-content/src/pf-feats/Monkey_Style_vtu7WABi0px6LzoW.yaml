name: Monkey Style
system:
  description:
    value: >-
      <p><em>Your unarmed fighting style is nimble and unpredictable, full of
      ground rolls and short leaps.</em></p><p><strong>Prerequisites</strong>:
      Wis 13, Improved Unarmed Strike, Acrobatics 5 ranks, Climb 5
      ranks.</p><p><strong>Benefits</strong>: You add your Wisdom bonus on
      Acrobatics checks. While using this style, you take no penalty on melee
      attack rolls or to AC while prone. Further, you can crawl and stand up
      from lying prone without provoking attacks of opportunity, and you can
      stand up as a swift action if you succeed at a DC 20 Acrobatics
      check.</p><p><strong>Normal</strong>: You take a -4 penalty on attack
      rolls and AC against melee attacks while prone. Standing up is a standard
      action that provokes attacks of opportunity.</p><p><strong>Combat
      Trick</strong>: When using this style, you can spend 2 stamina points to
      stand up as a swift action without having to succeed at a DC 20 Acrobatics
      check.</p>
  tags:
    - Combat
    - Style
type: feat
