name: Underfoot (APG)
system:
  description:
    value: >-
      <p><em>You slip under and around your larger
      foes.</em></p><p><strong>Prerequisites</strong>: Dodge, Mobility, Small
      size or smaller.</p><p><strong>Benefits</strong>: You receive a +4 dodge
      bonus on Acrobatics checks to move past opponents without provoking
      attacks of opportunity, so long as they are larger than you. In addition,
      you gain a +2 dodge bonus to Armor Class against attacks of opportunity
      caused when you move out of or within a larger opponent's threatened area
      (this stacks with the +4 bonus provided by Mobility, for a total bonus of
      +6).</p><h3>Combat Trick</h3><p>: You can spend 2 stamina points to use
      the benefit of this feat against opponents of your size until the end of
      your turn.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
