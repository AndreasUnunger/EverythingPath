name: Eldritch Researcher
system:
  description:
    value: >-
      <p><em>You seek new applications for magical
      energy.</em></p><p><strong>Prerequisites</strong>: You must have created a
      new spell, or have The Way Things Work
      background.</p><p><strong>Benefits</strong>: When casting a spell you've
      created, add 1 to your caster level. In addition, you gain a +2 bonus on
      Spellcraft checks. If you have 10 or more ranks in Spellcraft, this bonus
      increases to +4.</p><p><strong>Goal</strong>: Create a new spell of at
      least 6th level.</p><p><strong>Completion Benefit</strong>: The save DCs
      for any spells you create increase by 1 when you cast them. In addition,
      when applying metamagic feats to self-created spells, reduce the total
      level adjustment by 1. You can't reduce metamagic costs to lower than the
      spell's original level in this manner.</p>
  tags:
    - Story
type: feat
