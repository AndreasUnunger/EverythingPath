  description:
    value: >-
      <p><em>Blind mesmerists have learned to navigate the world without relying
      on sight and can use their hypnotic stare regardless of their sight
      level.</em></p><p><strong>Prerequisites</strong>: Hypnotic stare class
      feature.</p><p><strong>Benefits</strong>: You can use your hypnotic stare
      ability without relying on sight and do not have to attempt concentration
      checks to use this ability while blinded.</p>
