name: Righteous Orator
system:
  description:
    value: >-
      <p><em>You know words are weapons, and you allow no evil creature to best
      you in a social setting.</em></p><p><strong>Prerequisites</strong>:
      Diplomacy 3 ranks, smite evil class
      feature.</p><p><strong>Benefits</strong>: While in a verbal debate, such
      as a court proceeding, negotiation, or verbal duel (Pathfinder RPG
      Ultimate Intrigue 176), you can target another creature participating in
      the debate as a swift action and expend one of your uses of smite evil. If
      you target a creature that is not evil, your smite is wasted with no
      effect. If the target is evil, you add your level in the class granting
      the smite evil feature as a bonus on your Diplomacy checks and on your
      Sense Motive checks against deceit attempted by the target. You also gain
      a morale bonus equal to your Charisma modifier on Will saves against
      effects originating from the target. This effect remains until you or the
      target is no longer actively participating in the verbal debate.</p>
  tags:
    - General
type: feat
