name: Focused Discipline
system:
  description:
    value: >-
      <p><em>Familiarity with the military traditions of your homeland inspires
      uncommon valor in you.</em></p><p><strong>Benefits</strong>: You gain a +2
      bonus on all saving throws against fear effects. Whenever a fear effect
      targets you and fails to affect you (either because of a successful saving
      throw or because of immunity to fear), you gain a +2 morale bonus on
      attack rolls, weapon damage rolls, and CMB checks against the creature
      that attempted to use the fear affect on you for 1 round.</p><h3>Combat
      Trick</h3><p>You can spend 2 stamina points in order to gain the benefit
      of Focused Discipline for 1 round as if you had been targeted by a fear
      effect that failed to affect you.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
