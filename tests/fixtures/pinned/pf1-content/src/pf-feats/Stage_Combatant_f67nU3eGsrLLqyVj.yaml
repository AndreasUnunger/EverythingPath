name: Stage Combatant
system:
  description:
    value: >-
      <p><em>You are a master of stage and nonlethal
      combats.</em></p><p><strong>Prerequisites</strong>: Weapon Focus, base
      attack bonus +5</p><p><strong>Benefits</strong>: When you make an attack
      with a weapon that you have Weapon Focus in, you take no penalty on the
      attack roll when you are attempting to make an attack that deals no damage
      or nonlethal damage.</p><p><strong>Normal</strong>: When making attacks
      that deal no damage or nonlethal damage, you take a -4 penalty on attack
      rolls.</p><h3>Combat Trick</h3><p>: If you have at least 1 stamina point
      in your stamina pool, you gain a +2 bonus on attack rolls with a weapon
      with which you have Weapon Focus when you attempt to make an attack that
      deals no damage.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
