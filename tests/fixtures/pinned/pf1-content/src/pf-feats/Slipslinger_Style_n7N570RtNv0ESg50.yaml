name: Slipslinger Style
system:
  description:
    value: >-
      <p><em>You can fire all manner of slings and sling-like
      weapons.</em></p><p><strong>Prerequisites</strong>: Weapon Focus (sling)
      or weapon training (thrown) class feature, warslinger racial
      trait.</p><p><strong>Benefits</strong>: You gain a +1 bonus on damage
      rolls made with all types of slings, and don't provoke attacks of
      opportunity when reloading a sling. In addition, you treat all ranged and
      thrown weapons that have 'sling' in their name as if they were slings for
      all feats and class abilities that require such weapons, as well as the
      warslinger racial trait.</p>
  tags:
    - Combat
    - Style
type: feat
