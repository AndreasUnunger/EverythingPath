name: Dryad's Apprentice
system:
  description:
    value: >-
      <p><em>You have learned secrets of woodworking from
      dryads.</em></p><p><strong>Prerequisites</strong>: Cha 13,
      gathlain.</p><p><strong>Benefits</strong>: You can cast wood shape as a
      spell-like ability at will, but only on a piece of wood no larger than 1
      pound. You gain a +4 bonus on Craft checks involving wood, and you are
      always treated as if you had masterwork artisan's woodworking tools when
      attempting such checks.</p>
  tags:
    - Racial
    - Gathlain
type: feat
