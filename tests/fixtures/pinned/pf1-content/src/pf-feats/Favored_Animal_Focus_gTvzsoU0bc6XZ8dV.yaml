name: Favored Animal Focus
system:
  description:
    value: >-
      <p><em>Your companion is unusually comfortable wearing another
      (metaphorical) skin.</em></p><p><strong>Prerequisites</strong>: Animal
      companion class feature, animal focus class
      feature.</p><p><strong>Benefits</strong>: Choose one animal focus. When
      you apply that animal focus to your animal companion, the benefits
      increase by one step. For example, if you are 6th level and choose the
      bear animal focus, then when you apply the animal focus to your animal
      companion, it gains a +4 enhancement bonus to Constitution instead of
      +2.</p><p>If you are 15th level or higher, when you apply your chosen
      animal focus to your companion, it gains the corresponding ability listed
      below.</p><hr /><p><strong>Bat</strong>: The range of the animal
      companion's blindsense increases by 20 feet.</p><p><strong>Bear</strong>:
      The animal companion's Constitution bonus increases to +8.
      </p><p><strong>Bull</strong>: The animal companion's Strength bonus
      increases to +8.</p><p><strong>Falcon</strong>: The animal companion's
      Perception bonus increases to +12.</p><p><strong>Frog</strong>: The animal
      companion's bonus to Swim and Acrobatics increases to +12.
      </p><p><strong>Monkey</strong>: The animal companion's Climb bonus
      increases to +12.</p><p><strong>Mouse</strong>: The animal companion gains
      Improved Uncanny Dodge, as a rogue of its level.
      </p><p><strong>Owl</strong>: The animal companion's Stealth bonus
      increases to +12.</p><p><strong>Snake</strong>: The animal companion's
      attack and dodge bonuses increase to +8.</p><p><strong>Stag</strong>: The
      animal companion's speed bonus increases to 30 feet.
      </p><p><strong>Tiger</strong>: The animal companion's Dexterity bonus
      increases to +8.</p><p><strong>Wolf</strong>: The range of the animal
      companion's scent ability increases to 60 feet.</p><hr
      /><p><strong>Special</strong>: You can gain this feat multiple times. Each
      time you take this feat, you must select a new animal focus.</p>
  tags:
    - General
type: feat
