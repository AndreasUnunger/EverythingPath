  description:
    value: >-
      <p><em>You can turn your natural talent as easily to weapon-work as to
      skills.</em></p><p><strong>Prerequisites</strong>: Studied combat class
      feature.</p><p><strong>Benefits</strong>: When you damage a creature by
      using the studied combat class feature, you can expend one use of
      inspiration to roll an inspiration die and increase the damage by the
      number rolled.</p>
