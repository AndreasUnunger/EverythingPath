name: Sacred Pyromania
system:
  description:
    value: >-
      <p><em>Your faith in Sarenrae and the power of flame allows you to lace
      fire with holy power and burn things that normally can't be
      burned.</em></p><p><strong>Prerequisites</strong>: Goblin, worshipper of
      Sarenrae.</p><p><strong>Benefits</strong>: Whenever you make an attack or
      cast a spell that deals fire damage, the fire damage applies to
      incorporeal creatures, regardless of whether the fire is magical. An
      incorporeal creature's 50% reduction in damage from corporeal sources does
      not apply to any fire damage that you deal.</p>
  tags:
    - Racial
    - Goblin
type: feat
