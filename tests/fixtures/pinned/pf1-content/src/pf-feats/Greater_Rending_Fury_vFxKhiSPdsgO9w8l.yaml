name: Greater Rending Fury
system:
  description:
    value: >-
      <p><em>When your claws latch on to an opponent, the effect is bloody and
      horrific.</em></p><p><strong>Prerequisites</strong>: Improved Rending
      Fury, Rending Fury, base attack bonus +12, rend special
      attack.</p><p><strong>Benefits</strong>: Whenever you rend an opponent,
      you deal 1d6 bleed damage to that opponent. This is an addition to the
      effects of the rend.</p><h3>Combat Trick</h3><p>When you rend an opponent,
      you can spend 2 stamina points to deal 1d6+2 points of bleed damage to
      your opponent instead of 1d6 points of bleed damage.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
