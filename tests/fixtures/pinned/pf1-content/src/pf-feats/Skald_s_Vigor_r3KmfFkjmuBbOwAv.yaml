name: Skald's Vigor
system:
  description:
    value: >-
      <p><em>Your song and your enthusiasm combine to invigorate you in
      battle.</em></p><p><strong>Prerequisites</strong>: Raging song class
      feature.</p><p><strong>Benefits</strong>: While maintaining a raging song,
      you gain fast healing equal to the Strength bonus your song provides,
      starting in the round after you begin the song. If you stop maintaining
      your song, the fast healing ends, even if the effects of your song
      persist.</p>
  tags:
    - General
type: feat
