name: Neckbreaker
system:
  description:
    value: >-
      <p><em>With a quick jerk, you snap an enemy's
      neck.</em></p><p><strong>Prerequisites</strong>: Bonebreaker, Greater
      Grapple, Improved Grapple, Improved Unarmed Strike, Jawbreaker, Stunning
      Fist, Heal 12 ranks.</p><p><strong>Benefits</strong>: If you have an
      opponent your size or smaller helpless or pinned, after you initiate or
      maintain a grapple, you can make a Stunning Fist attempt at a -5 penalty
      on the attack roll. If you succeed, you wrench that opponent's neck,
      dealing 2d6 Strength or Dexterity damage. If the targeted ability score is
      reduced to 0, any remaining damage is dealt to that opponent's
      Constitution score. A creature that is immune to critical hits or that has
      no discernible head and neck is immune to the effects of this
      feat.</p><h3>Combat Trick</h3><p>When using this feat, you can spend 10
      stamina points to deal 1d6 points of Constitution damage instead of 2d6
      points of Strength or Dexterity damage.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
