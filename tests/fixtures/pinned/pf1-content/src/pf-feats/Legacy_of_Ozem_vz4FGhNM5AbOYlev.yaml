name: Legacy of Ozem
system:
  description:
    value: >-
      <p><em>Your purity is so great that the blades and bows of long-forgotten
      heroes sing to you as if they had been made for your righteous
      hands.</em></p><p><strong>Prerequisites</strong>: Base attack bonus +5,
      good alignment.</p><p><strong>Benefits</strong>: When using good-aligned
      weapons, including those under the effects of a bless weapon spell, you
      gain a +1 sacred bonus on damage rolls.</p>
