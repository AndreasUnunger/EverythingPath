name: Sense Metals and Minerals
system:
  description:
    value: >-
      <p><em>You have a sixth sense for the valuable treasures of the
      earth</em></p><p><strong>Benefits</strong>: You gain a +4 bonus on
      Perception checks to notice natural deposits of precious metals or
      minerals, and a +4 bonus on Appraise checks to determine their worth. By
      spending 5 minutes scrutinizing a discovered vein of metals or minerals,
      you can determine the worth of the full vein to within 1,000 gp, to a
      maximum of 50,000 gp.</p>
  tags:
    - General
type: feat
