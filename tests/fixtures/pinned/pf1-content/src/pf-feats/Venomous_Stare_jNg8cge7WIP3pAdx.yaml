name: Venomous Stare
system:
  description:
    value: >-
      <p><em>Your stare is toxic to your
      enemies.</em></p><p><strong>Prerequisites</strong>: Mesmerist level 11th,
      painful stare class feature.</p><p><strong>Benefits</strong>: When you
      trigger your painful stare, the target immediately becomes envenomed by
      the following poison: painful stare--injury; save Fort DC = 10 + 1/2 your
      mesmerist level + your Charisma modif ier; frequency 1/round for 6 rounds;
      effect 1d3 Dex; cure 2 saves. Whether your target succeeds at or fails its
      save, you can't use Venomous Stare against that particular foe for 24
      hours.</p><p><strong>Pathfinder Society<br /></strong>Only available to
      Nagaji characters</p>
  tags:
    - Stare
type: feat
