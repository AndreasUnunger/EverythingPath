name: Horn Rider's Charge
system:
  description:
    value: >-
      <p><em>When the animal you're lashed to charges, you use its momentum in
      your own attack.</em></p><p><strong>Prerequisites</strong>: Horn Rider,
      base attack bonus +1.</p><p><strong>Benefits</strong>: Whenever you're
      lashed into a horn harness and you ready an action to make a melee attack
      against the target of a charge made by the creature you're lashed to, you
      gain the attack bonus for charging and your attack deals double damage (or
      triple damage with a lance). This benef it does not stack with the benef
      it of Spirited Charge.</p>
  tags:
    - Combat
type: feat
