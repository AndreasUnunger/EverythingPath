name: Hellknight Aegis
system:
  description:
    value: >-
      <p><em>Your Hellknight armor guards you against many
      threats.</em></p><p><strong>Prerequisites</strong>: Heavy Armor
      Proficiency, base attack bonus +5, must swear allegiance to a single
      Hellknight order.</p><p><strong>Benefits</strong>: Once per day as a
      full-round action, you can give your Hellknight armor the broken
      condition. Upon doing so, you are affected by one of the following spells
      (your choice), using your character level as your caster level: break
      enchantment, neutralize poison, remove disease, or remove paralysis. Once
      you have used this benefit, your Hellknight armor must be repaired as
      normal to restore its full bonus to your Armor Class and return its armor
      check penalty to normal.</p><p>You can use this ability even if paralyzed
      or otherwise restrained, but not if you are unconscious. For the purposes
      of this ability, 'Hellknight armor' means any armor with the word
      'Hellknight' in its name. You cannot use this ability if your armor is
      already broken.</p><p><strong>Pathfinder Society<br /></strong>In order to
      swear allegiance to a Hellknight order for the purpose of qualifying for
      character options in this book, a PC must be lawful-aligned.</p>
  tags:
    - General
type: feat
