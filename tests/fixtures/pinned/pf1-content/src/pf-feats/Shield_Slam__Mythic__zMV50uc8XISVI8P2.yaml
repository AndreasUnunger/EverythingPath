name: Shield Slam (Mythic)
system:
  description:
    value: >-
      <p><em>Your shield bash produces a powerful
      kick.</em></p><p><strong>Prerequisites</strong>: Shield
      Slam.</p><p><strong>Benefits</strong>: When using Shield Slam to bull
      rush, an opponent knocked prone because of an intervening wall or other
      surface also takes damage from the collision. The damage dealt is equal to
      1d6 points per 2 tiers you possess. As an immediate action, you can expend
      one use of mythic power to add your tier to your combat maneuver checks
      when resolving a bull rush made due to Shield Slam.</p>
  tags:
    - Combat
    - Mythic
type: feat
