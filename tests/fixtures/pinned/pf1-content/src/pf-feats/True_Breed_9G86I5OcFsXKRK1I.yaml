name: True Breed
system:
  description:
    value: >-
      <p><em>Your dual heritage makes you something more than merely a mix of
      your parent races.</em></p><p><strong>Prerequisites</strong>: Two
      subtypes, elf blood or orc blood racial
      trait.</p><p><strong>Benefits</strong>: For the purposes of any effect
      related to subtype (such as a ranger's favored enemy and bane weapons),
      you count as neither of your subtypes, and you no longer count as either
      of your parent races for the purposes of effects related to
      race.</p><p><strong>Pathfinder Society<br /></strong>This feat can only be
      taken at 1st level.</p>
  tags:
    - Racial
    - Elf
    - Orc
type: feat
