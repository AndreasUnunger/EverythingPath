name: Raging Vitality
system:
  description:
    value: >-
      <p><em>While raging, you are full of vigor and
      health.</em></p><p><strong>Prerequisites</strong>: Con 15, rage class
      feature.</p><p><strong>Benefits</strong>: Whenever you are raging, the
      morale bonus to your Constitution increases by +2. Your rage does not end
      if you become unconscious. While unconscious you must still expend rounds
      of rage per day each round.</p>
  tags:
    - General
type: feat
