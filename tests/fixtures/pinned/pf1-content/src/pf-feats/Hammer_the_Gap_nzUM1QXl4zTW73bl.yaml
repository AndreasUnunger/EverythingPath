name: Hammer the Gap
system:
  description:
    value: >-
      <p><em>You repeatedly strike the same location, causing increasing amounts
      of damage.</em></p><p><strong>Prerequisites</strong>: Base attack bonus
      +6.</p><p><strong>Benefits</strong>: When you take a full-attack action,
      each consecutive hit against the same opponent deals extra damage equal to
      the number of previous consecutive hits you have made against that
      opponent this turn. This damage is multiplied on a critical
      hit.</p><h3>Combat Trick</h3><p>When you use this feat, you can spend 5
      stamina points to increase the amount of extra damage dealt by 1 point per
      consecutive hit you make.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
