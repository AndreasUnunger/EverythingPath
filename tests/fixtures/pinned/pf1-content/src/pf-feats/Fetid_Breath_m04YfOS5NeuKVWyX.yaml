name: Fetid Breath
system:
  description:
    value: >-
      <p><em>The rotting of your flesh has spread to your lungs and fills them
      with putrid fluids.</em></p><p><strong>Prerequisites</strong>: Con 15,
      Corrupted Flesh, 6 HD, ogre.</p><p><strong>Benefits</strong>: You can
      exhale a 30-foot cone of vile-smelling, moist air mixed with phlegm and
      remnants of old meals. Creatures in the area must succeed at a Fortitude
      save (DC = 10 + 1/2 your Hit Dice + your Constitution modif ier) or they
      are nauseated for 1d6 minutes. Affected creatures that spend a full-round
      action gasping for fresh air and scraping off your oral debris may attempt
      another save to overcome the effect. You can use this breath weapon twice
      per day, plus one additional time per day for every 6 HD you possess
      beyond 6.</p>
  tags:
    - General
type: feat
