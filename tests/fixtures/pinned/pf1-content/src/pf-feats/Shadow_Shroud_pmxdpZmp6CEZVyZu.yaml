name: Shadow Shroud
system:
  description:
    value: >-
      <p><em>Using a portion of your innate magic, you cloak your body in
      darkness to evade attacks.</em></p><p><strong>Prerequisites</strong>:
      Combat Reflexes, darkness racial spell-like
      ability.</p><p><strong>Benefits</strong>: As an immediate action, you can
      create a shifting haze of darkness around yourself, granting you
      concealment against one attack. The haze dissipates after the attack is
      resolved. You can use this ability once per day, plus one additional time
      per day when your caster level for your racial darkness spell-like ability
      reaches 5th, 10th, 15th, and 20th.</p>
  tags:
    - General
type: feat
