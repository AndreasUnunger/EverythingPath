name: Forceful Charge
system:
  description:
    value: >-
      <p><em>This animal's charges move its
      enemies.</em></p><p><strong>Prerequisites</strong>: Improved Bull Rush,
      Power Attack, animal companion.</p><p><strong>Benefits</strong>: Once per
      round when this animal companion hits an opponent with a charge attack, it
      can initiate a bull rush against that target as a free action. If it moves
      its full speed as part of the charge, it gains a +4 bonus on its combat
      maneuver check to resolve this bull rush.</p>
  tags:
    - General
type: feat
