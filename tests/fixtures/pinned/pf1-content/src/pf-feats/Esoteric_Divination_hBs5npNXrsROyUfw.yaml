name: Esoteric Divination
system:
  description:
    value: >-
      <p><em>Scrying and other difficult divinations become more likely to get
      to the truth when you use verdant
      salts.</em></p><p><strong>Benefits</strong>: When you cast a divination
      spell using verdant salts as an esoteric material component, you're more
      likely to get good information. You gain one of the following benefits, as
      appropriate to the spell: you increase the likelihood of a
      percentage-based divination to work correctly by 5% (giving a -5 penalty
      on the d% roll for contact other plane, for example), you gain a +2
      competence bonus on Perception checks while perceiving through a
      divination (scrying) spell such as scrying, or you can ask one additional
      question (with contact other plane or speak with dead).</p><p>When you
      gain verdant salts' greater component effect with a divination spell,
      increase the DC by an additional 1.</p>
  tags:
    - Esoteric
type: feat
