name: Tatzlwyrm Claw Style
system:
  description:
    value: >-
      <p><em>Your curled fingers can tear into opponents' flesh and snatch free
      grappled allies.</em></p><p><strong>Prerequisites</strong>: Dex 13,
      Improved Grapple, Improved Unarmed Strike, Escape Artist 1
      rank.</p><p><strong>Benefits</strong>: You can choose for your unarmed
      attacks to deal slashing damage. If you strike a target that has another
      creature grappled or pinned, as a swift action you can immediately attempt
      a grapple combat maneuver check against the target's CMD. If you succeed
      at the check, you can force the target to release a grappled creature or
      switch a pinned creature to being merely grappled.</p>
  tags:
    - Combat
    - Style
type: feat
