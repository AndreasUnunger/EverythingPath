name: Leapfrog
system:
  description:
    value: >-
      <p><em>You can use an opponent as a
      springboard.</em></p><p><strong>Prerequisites</strong>: Acrobatics 3
      ranks.</p><p><strong>Benefits</strong>: When you spend a swift action to
      attempt a performance combat check after a successful charge attack or
      combat maneuver, you gain a +2 bonus on your performance combat check and
      gain a +4 bonus on your next Acrobatics, Climb, Fly, Ride, or Swim check
      attempted before the end of your next turn.</p>
