name: Gray Maiden Initiate
system:
  description:
    value: >-
      <p><em>You were selected for indoctrination into the Gray Maidens and
      underwent some of the preliminary scarring and conditioning, but Queen
      Ileosa was defeated before you could fully serve her. You bear the mental
      and physical scars of your sisters in the Gray Maidens, and while you
      never had to carry out any of the queen's commands, you feel a strong
      kinship with those of your sisters who
      have.</em></p><p><strong>Prerequisites</strong>: Female, must be taken at
      1st level.</p><p><strong>Benefits</strong>: You are affiliated with the
      Gray Maidens. In addition, choose two of the following benefits to
      represent the focus of your initial training and indoctrination.</p><p>
      Avenging Knight</p><p>Like the Queens of the Night, you crave vengeance
      upon those who have wronged you. You gain a +1 bonus on damage rolls
      against any creature that dealt damage to you during the previous
      round.</p><p> Deeper Indoctrination</p><p>Mental conditioning has
      bolstered your mind against most magical control. You gain a +1 bonus on
      Will saving throws, except when resisting charm or compulsion effects
      created by lawful evil creatures, in which case you instead take a -2
      penalty on Will saving throws.</p><p>Faceless Maiden</p><p>You can take
      advantage of the disquieting nature of the iconic armor of the Gray
      Maidens. While wearing Gray Maiden plate, you gain a +2 bonus on
      Intimidate checks.</p><p>Gray Maiden Adept</p><p>You had some magical
      skill before being recruited and learned to cast spells despite the
      restrictive armor you were forced to wear. The arcane spell failure chance
      of Gray Maiden plate you wear is reduced by 5%.</p><p>Gray Maiden
      Endurance</p><p>Surviving the brutal process of becoming a Gray Maiden
      taught you to endure more pain than others. You gain 2 hit points and can
      sleep while wearing Gray Maiden armor without becoming
      fatigued.</p><p>Korvosan Acceptance</p><p>With the aid of the Scarlet
      Rose, you've successfully reintegrated into Korvosan society. You gain a
      +1 bonus on Diplomacy and Knowledge (local) checks, and one of these
      skills (your choice) is a class skill for you.</p><p> Scarred</p><p>Your
      face was horribly scarred during Gray Maiden initiation, destroying your
      beauty. You take a -1 penalty on Diplomacy and Disguise checks, but gain a
      +2 bonus on Intimidate checks and on saving throws against pain effects
      (Pathfinder RPG Ultimate Magic 138).</p><p>Tamed and Broken</p><p>You
      reach your full potential only when magically compelled. Whenever you are
      under the effects of an enemy's compulsion spell, you gain a number of
      temporary hit points equal to the spell's level. These temporary hit
      points last for the duration of the spell
      effect.</p><p><strong>Special</strong>: This feat is unaffiliated; a
      creature need not be affiliated with the Gray Maidens to select this
      feat.</p>
  tags:
    - General
type: feat
