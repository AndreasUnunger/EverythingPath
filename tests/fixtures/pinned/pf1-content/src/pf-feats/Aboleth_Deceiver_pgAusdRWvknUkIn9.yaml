name: Aboleth Deceiver
system:
  description:
    value: >-
      <p><em>You have mastered mental tricks to help you combat aboleths and
      avoid mind-controlling magic.</em></p><p><strong>Prerequisites</strong>:
      Iron Will, gillman, enchantment resistance racial
      trait.</p><p><strong>Benefits</strong>: Once per day, if you fail a Will
      save against a compulsion spell or effect, you can reroll that saving
      throw but must take the second result, even if it's worse. If the
      compulsion spell or effect originates from an aboleth, you do not apply
      your racial -2 penalty on such saving throws, and the reroll does not
      count against your daily use of this feat.</p>
  tags:
    - Racial
    - Gillman
type: feat
