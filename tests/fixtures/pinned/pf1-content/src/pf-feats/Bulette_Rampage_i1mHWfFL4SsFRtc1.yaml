name: Bulette Rampage
system:
  description:
    value: >-
      <p><em>You are able to channel your enhanced momentum to deal incredible
      damage to multiple foes.</em></p><p><strong>Prerequisites</strong>: Str
      15, Bulette Charge Style, Bulette Leap, Improved Overrun, Power Attack,
      proficiency with heavy armor.</p><p><strong>Benefits</strong>: While
      you're using Bulette Charge Style, whenever you succeed at an overrun
      combat maneuver check against a foe, that foe takes an amount of damage
      equal to 1d8 (if you're Medium) or 1d6 (if you're Small) + 1/2 your armor
      bonus to AC + 1-1/2 times your Strength bonus.</p>
  tags:
    - Combat
type: feat
