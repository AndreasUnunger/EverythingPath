name: Animal Soul
system:
  description:
    value: >-
      <p><em>Your close bond with an animal allows you to ignore harmful magic
      that cannot affect your wild
      side.</em></p><p><strong>Prerequisites</strong>: Animal companion or mount
      class feature.</p><p><strong>Benefits</strong>: You can choose not to
      allow spells and effects to effect you if they would not be capable of
      affecting both your original creature type and the animal creature
      type.</p>
  tags:
    - General
type: feat
