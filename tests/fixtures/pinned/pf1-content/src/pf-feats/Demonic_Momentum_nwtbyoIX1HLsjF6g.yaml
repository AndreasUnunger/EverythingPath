name: Demonic Momentum
system:
  description:
    value: >-
      <p><em>You slam into foes with devastating force, leaving them vulnerable
      to your vicious strikes.</em></p><p><strong>Prerequisites</strong>:
      Demonic Style, Improved Bull Rush, Power Attack, base attack bonus
      +5.</p><p><strong>Benefits</strong>: While using Demonic Style, when you
      successfully bull rush an opponent as part of a charge, you gain a +2
      bonus on melee weapon damage rolls against that opponent for every 5 feet
      it was moved by your bull rush. This bonus lasts until the end of your
      next turn, and it stacks with the damage bonus granted by Demonic
      Style.</p>
  tags:
    - Combat
type: feat
