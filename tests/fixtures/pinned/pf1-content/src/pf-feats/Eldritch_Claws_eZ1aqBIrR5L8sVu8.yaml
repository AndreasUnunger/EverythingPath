name: Eldritch Claws
system:
  description:
    value: >-
      <p><em>Who needs magic weapons? Eldritch tricks are no match for your
      bestial ferocity.</em></p><p><strong>Prerequisites</strong>: Str 15,
      natural weapons, base attack bonus +6.</p><p><strong>Benefits</strong>:
      You natural weapons are considered both magic and silver for purpose of
      overcoming damage reduction.</p><h3>Combat Trick</h3><p>As long as you
      have 1 stamina point in your stamina pool, your claws are also considered
      to be cold iron weapons for the purpose of overcoming damage
      reduction.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
