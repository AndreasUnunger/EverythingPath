name: Disable Dweomer
system:
  description:
    value: >-
      <p><em>You can disable a magic item, suppressing it for a short
      time.</em></p><p><strong>Prerequisites</strong>: Disable Device 5 ranks,
      Use Magic Device 5 ranks, trapfinding.</p><p><strong>Benefits</strong>:
      You can use Disable Device to suppress the magic of a non-artifact magic
      item for 1d4 rounds, after which the item recovers its magical properties.
      A suppressed item becomes nonmagical for the duration of the suppression.
      Using Disable Device in this way takes 2d4 rounds, with a DC of 15 + the
      item's caster level.</p>
  tags:
    - General
type: feat
