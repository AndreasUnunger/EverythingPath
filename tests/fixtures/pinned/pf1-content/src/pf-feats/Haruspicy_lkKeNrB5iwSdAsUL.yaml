name: Haruspicy
system:
  description:
    value: >-
      <p><em>You observe the signs of the universe by studying how spilled blood
      and viscera fall, learning insights into how to best appease unseen
      forces.</em></p><p><strong>Prerequisites</strong>: Knowledge (religion) 3
      ranks.</p><p><strong>Benefits</strong>: If you perform a successful coup
      de grace, you gain a +2 circumstance bonus on skill checks attempted as
      part of a single occult ritual or occult skill unlock performed within the
      next minute. Alternatively, you can instead gain a +1 caster level bonus
      on a single divination or necromancy spell. The ritual or spell must begin
      within 1 minute of the coup de grace.</p>
  tags:
    - General
type: feat
