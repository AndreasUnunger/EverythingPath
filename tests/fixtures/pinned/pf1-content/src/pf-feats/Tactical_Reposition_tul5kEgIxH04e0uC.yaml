name: Tactical Reposition
system:
  description:
    value: >-
      <p><em>You excel at moving foes right where you want
      them.</em></p><p><strong>Prerequisites</strong>: Int 13, Combat Expertise,
      Improved Reposition.</p><p><strong>Benefits</strong>: When making a
      reposition combat maneuver (Pathfinder RPG Advanced Player's Guide 322),
      you can move an enemy into a trap or other hazardous area, such as a pit,
      wall scythe, or blade barrier. When you do so, the moved enemy is treated
      as though it had activated the trap or triggered the hazard, and it takes
      a -2 penalty to AC and on saving throws to mitigate the trap or hazard's
      effects.</p><p><strong>Normal</strong>: You cannot reposition a foe into
      an intrinsically dangerous space such as a pit or blade barrier.</p>
  tags:
    - Combat
type: feat
