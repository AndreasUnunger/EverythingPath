  description:
    value: >-
      <p><em>When cornered and wounded, you fight like a feral
      beast.</em></p><p><strong>Prerequisites</strong>: Base attack bonus +3,
      ferocity racial ability.</p><p><strong>Benefits</strong>: When your hit
      points are reduced below 0, you can make attacks, but you take a -5
      penalty on each attack roll.</p>
