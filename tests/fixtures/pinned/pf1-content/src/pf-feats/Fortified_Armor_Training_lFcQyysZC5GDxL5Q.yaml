name: Fortified Armor Training
system:
  description:
    value: >-
      <p><em>You have learned to let your armor bear the brunt of the worst
      attacks.</em></p><p><strong>Prerequisites</strong>: Proficient with armor
      or shield.</p><p><strong>Benefits</strong>: If an opponent scores a
      critical hit against you, you can turn the critical hit into a normal hit.
      If you do, either your armor or your shield gains the broken condition
      (your choice).</p><h3>Combat Trick</h3><p>When you use this feat to negate
      a critical hit, you can spend 5 stamina points to give your armor or
      shield a 50% chance to avoid gaining the broken condition.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
