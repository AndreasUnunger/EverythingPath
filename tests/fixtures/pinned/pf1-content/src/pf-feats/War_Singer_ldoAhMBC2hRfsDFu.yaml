name: War Singer
system:
  description:
    value: >-
      <p><em>Your songs draw upon the savage chants and brutal ways of your
      people, inspiring those around you to new heights of violence and
      savagery.</em></p><p><strong>Prerequisites</strong>: Cha 13, bardic
      performance class feature, half-orc or
      orc.</p><p><strong>Benefits</strong>: When you use bardic performance with
      audible components on a battlefield (any area where a combat involving a
      dozen or more combatants is taking place), the range or area of your
      chosen performance is doubled. In addition, the DC for saving throws
      against your bardic performance is increased by +2 for creatures of the
      orc subtype, regardless of where the performance occurs.</p>
  tags:
    - Racial
    - Half-Orc
    - Orc
type: feat
