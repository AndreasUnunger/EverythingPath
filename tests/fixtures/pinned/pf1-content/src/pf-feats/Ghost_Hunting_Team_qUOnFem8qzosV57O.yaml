  description:
    value: >-
      <p><em>Your loathing of undead is so great that even your allies can feel
      it.</em></p><p><strong>Prerequisites</strong>: Duskwalker, ghost hunter
      racial trait.</p><p><strong>Benefits</strong>: When you use your ghost
      hunter ability to grant your weapons the ghost touch special ability, you
      can also affect the weapons of allies within 30 feet of you. You can
      activate ghost hunter an additional time each day.</p>
