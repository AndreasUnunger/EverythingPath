name: Aversion Tolerance
system:
  description:
    value: >-
      <p><em>You have been hunted for so long that you have developed
      resistances to slayers' usual scare
      tactics.</em></p><p><strong>Prerequisites</strong>:
      Vampire.</p><p><strong>Benefits</strong>: You gain a +2 bonus on saves
      made to resist aversions to objects, sounds, and materials appropriate to
      your vampire type (such as garlic, holy symbols, and mirrors for a moroi).
      When confronted with such things, you can attempt a saving throw
      immediately instead of after 1 round.</p>
  tags:
    - Monster
    - Vampire
type: feat
