name: Mounted Combat (Mythic)
system:
  description:
    value: >-
      <p><em>Your ability to maneuver a mount through the rigors of combat is
      nearly unparalleled.</em></p><p><strong>Prerequisites</strong>: Mounted
      Combat.</p><p><strong>Benefits</strong>: You can negate an additional
      number of hits against your mount per round equal to your tier. Once per
      round as an immediate action, you can expend one use of mythic power to
      substitute a Ride check for a single Reflex saving throw your mount must
      make.</p>
  tags:
    - Combat
    - Mythic
type: feat
