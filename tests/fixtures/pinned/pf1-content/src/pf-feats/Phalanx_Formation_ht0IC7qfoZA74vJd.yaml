name: Phalanx Formation
system:
  description:
    value: >-
      <p><em>You are trained to use long weapons in tight
      formations.</em></p><p><strong>Prerequisites</strong>: Base attack bonus
      +1.</p><p><strong>Benefits</strong>: When you wield a reach weapon with
      which you are proficient, allies don't provide soft cover to opponents you
      attack with reach.</p><p><strong>Normal</strong>: Attacking a target that
      is beyond another creature, even an ally, can result in the target having
      soft cover from you.</p>
  tags:
    - Combat
type: feat
