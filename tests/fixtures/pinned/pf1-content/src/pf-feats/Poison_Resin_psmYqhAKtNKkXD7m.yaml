name: Poison Resin
system:
  description:
    value: >-
      <p><em>The toxic slime from your skin hardens into a thick, venomous resin
      that you can craft into various
      shapes.</em></p><p><strong>Prerequisites</strong>: Grippli, toxic skin
      alternate racial trait.</p><p><strong>Benefits</strong>: As a standard
      action, you can spend a use of your toxic skin alternate racial trait to
      create any simple light weapon out of your hardened secretions. This
      weapon remains intact and usable for 1 hour. Once per minute when making
      an attack, you can treat this weapon as if you had applied your grippli
      racial poison to it. You can use this envenoming function a number of
      times per day equal to your Constitution modifier for any individual
      weapon created. Anyone other than you who attempts to wield the weapon is
      exposed to your poison.</p>
  tags:
    - Racial
    - Grippli
type: feat
