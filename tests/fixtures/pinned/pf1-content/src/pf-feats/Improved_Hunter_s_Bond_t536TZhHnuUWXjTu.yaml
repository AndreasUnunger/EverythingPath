name: Improved Hunter's Bond
system:
  description:
    value: >-
      <p><em>You deepen your connection to your allies, granting them higher
      bonuses.</em></p><p><strong>Prerequisites</strong>: Hunter's bond (hunting
      companions) class feature, ranger level
      9th.</p><p><strong>Benefits</strong>: When you activate hunter's bond, you
      can grant your allies your full favored enemy bonus against a single
      target.</p><p><strong>Normal</strong>: Your allies receive half your
      favored enemy bonus against a single target.</p>
  tags:
    - Combat
type: feat
