img: systems/pf1/icons/feats/diehard.jpg
name: Fight On
system:
  description:
    value: >-
      <p><em>You can keep fighting even after you should be
      dead.</em></p><p><strong>Prerequisites</strong>: Con 13; dwarf, half-orc,
      or orc.</p><p><strong>Benefits</strong>: Once per day, you can gain a
      number of temporary hit points equal to your Constitution modifier. You
      can activate this feat as an immediate action when reduced to 0 or fewer
      hit points. You can use this feat to prevent yourself from dying. These
      temporary hit points last for 1 minute. If your hit points drop below 0
      due to the loss of these temporary hit points, you fall unconscious and
      are dying as normal. If you also have the ferocity racial trait, you can
      use that once you have lost the temporary hit points from this feat.</p>
  tags:
    - Racial
    - Half-Orc
    - Orc
    - Dwarf
type: feat
