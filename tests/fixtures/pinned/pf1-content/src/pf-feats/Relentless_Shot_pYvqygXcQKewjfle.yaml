name: Relentless Shot
system:
  description:
    value: >-
      <p><em>You keep your aim steady on a downed
      foe.</em></p><p><strong>Prerequisites</strong>: Point-Blank Shot, base
      attack bonus +6.</p><p><strong>Benefits</strong>: When you successfully
      trip an opponent within 30 feet with a ranged attack, you threaten that
      opponent until your next turn. You can make attacks of opportunity against
      that opponent with ranged weapons. This effect ends if you attack another
      target or the opponent moves from its current
      square.</p><p><strong>Normal</strong>: While wielding a ranged weapon, you
      threaten no squares and cannot make attacks of opportunity with that
      weapon.</p>
  tags:
    - Combat
type: feat
