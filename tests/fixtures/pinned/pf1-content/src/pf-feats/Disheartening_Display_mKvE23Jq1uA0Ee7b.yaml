name: Disheartening Display
system:
  description:
    value: >-
      <p><em>Your show of prowess further demoralizes
      others.</em></p><p><strong>Prerequisites</strong>: Dazzling Display,
      Weapon Focus, base attack bonus +6, proficiency with chosen
      weapon.</p><p><strong>Benefits</strong>: When you successfully use
      Dazzling Display against any shaken, frightened, or panicked opponents,
      their fear increases by one step. An already panicked creature demoralized
      by this feat cowers. Once affected by this feat, a creature cannot be
      affected by it again (by you or anyone else) for 24 hours.</p><h3>Combat
      Trick</h3><p>When you affect a creature with this feat, you can spend 5
      stamina points to gain the ability to affect that creature with this feat
      a second time during the same 24-hour period.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
