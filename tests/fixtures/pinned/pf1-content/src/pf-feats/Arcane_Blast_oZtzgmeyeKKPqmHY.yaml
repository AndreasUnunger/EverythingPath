name: Arcane Blast
system:
  description:
    value: >-
      <p><em>You can convert any spell into an
      attack.</em></p><p><strong>Prerequisites</strong>: Arcane spellcaster,
      caster level 10th.</p><p><strong>Benefits</strong>: As a standard action,
      you can sacrifice a prepared spell or unused spell slot of 1st level or
      higher and transform it into a ray, targeting any foe within 30 feet as a
      ranged touch attack. This attack deals 2d6 points of damage plus an
      additional 1d6 points of damage for every level of the spell or spell slot
      you sacrificed. 0-level spells may not be sacrificed in this manner.</p>
  tags:
    - General
type: feat
