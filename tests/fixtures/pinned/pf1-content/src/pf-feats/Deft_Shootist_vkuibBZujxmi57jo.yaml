name: Deft Shootist
system:
  description:
    value: >-
      <p><em>You keep an eye out while focusing on your weapon, allowing you to
      avoid attacks while shooting and reloading
      firearms.</em></p><p><strong>Prerequisites</strong>: Grit class feature or
      Amateur Gunslinger feat, Dodge, Mobility.</p><p><strong>Benefits</strong>:
      As long as you have at least 1 grit point, you do not provoke attacks of
      opportunity when shooting or reloading a firearm.</p>
  tags:
    - Grit
type: feat
