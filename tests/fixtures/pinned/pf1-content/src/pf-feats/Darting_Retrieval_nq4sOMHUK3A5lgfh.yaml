name: Darting Retrieval
system:
  description:
    value: >-
      <p><em>As your ally disarms a foe, you knock the disarmed item out of the
      way.</em></p><p><strong>Prerequisites</strong>: Int 13, Combat Expertise,
      Improved Disarm.</p><p><strong>Benefits</strong>: When an ally who also
      has this feat disarms an opponent and the disarmed item lands within your
      melee reach, as an immediate action you can move the disarmed item to
      another square within your melee reach. If you have at least one hand free
      and could carry the disarmed item, you can instead pick it up. Using this
      feat does not provoke an attack of opportunity.</p>
  tags:
    - Combat
    - Teamwork
type: feat
