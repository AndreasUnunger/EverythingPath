name: Persuasive (Mythic)
system:
  description:
    value: >-
      <p><em>You're a master of persuasion, be it with soothing words or harsh
      barking commands.</em></p><p><strong>Prerequisites</strong>:
      Persuasive.</p><p><strong>Benefits</strong>: The bonus on Diplomacy and
      Intimidate skill checks granted by Persuasive increases by 2. In addition,
      you can expend one use of mythic power to treat a Diplomacy or Intimidate
      check as if you had rolled a natural 20. You must decide to use this
      ability before making the roll.</p>
