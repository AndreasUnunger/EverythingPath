name: Ambush Sense
system:
  description:
    value: >-
      <p><em>You live in dangerous times, and are alert for betrayal or
      unexpected attack.</em></p><p><strong>Prerequisites</strong>: Int 13, trap
      sense class feature.</p><p><strong>Benefits</strong>: You gain a bonus on
      Perception checks made to determine awareness for the surprise round of
      combat, and a dodge bonus to AC in any surprise round in which you get to
      act. These bonuses are equal to the bonus you gain from trap sense.</p>
  tags:
    - Combat
type: feat
