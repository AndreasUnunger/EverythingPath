name: Willing Death
system:
  description:
    value: >-
      <p><em>You might have been a soldier in an army, a self-sacrificing lover,
      or a hero who rushed in where even angels feared to tread. You died
      because you valued someone else's life above your
      own.</em></p><p><strong>Prerequisites</strong>:
      Duskwalker.</p><p><strong>Benefits</strong>: Twice per day, when an ally
      within 30 feet would die as a result of an attack or failing a saving
      throw, as an immediate action you can redirect the damage and effects to
      yourself. This functions as paladin's sacrifice. At 11th level, you can
      use this feat two additional times per day.</p><p><strong>Pathfinder
      Society<br /></strong>A Duskwalker can only gain one origin feat.</p>
  tags:
    - Origin
    - Racial
    - Duskwalker
type: feat
