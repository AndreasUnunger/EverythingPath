name: Designated Antagonist
system:
  description:
    value: >-
      <p><em>When you antagonize your foes, you can redirect their enmity to
      your ally.</em></p><p><strong>Prerequisites</strong>:
      Antagonize.</p><p><strong>Benefits</strong>: When you succeed at a skill
      check using Antagonize, you can cause the target creature to focus its
      efforts on a willing ally who also has this feat, as if the ally had been
      the one to use the ability.</p>
  tags:
    - Teamwork
type: feat
