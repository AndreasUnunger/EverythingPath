img: systems/pf1/icons/races/orc.png
name: Surprise Follow-Through
system:
  description:
    value: >-
      <p><em>When striking one opponent, you catch its ally off
      guard.</em></p><p><strong>Prerequisites</strong>: Str 13, Cleave, Power
      Attack, base attack bonus +1.</p><p><strong>Benefits</strong>: When using
      Cleave or Great Cleave, the second foe you attack on your turn is denied
      its Dexterity bonus against you.</p><h3>Combat Trick</h3><p>: When you hit
      a foe that has been denied its Dexterity bonus by this feat, you can spend
      2 stamina points to deal an extra 1d6 points of damage. This damage is
      precision damage and is not multiplied on a critical hit.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
