name: Diversion Shot
system:
  description:
    value: >-
      <p><em>You can use your shots to distract
      opponents.</em></p><p><strong>Prerequisites</strong>: Stealthy, Target of
      Opportunity.</p><p><strong>Benefits</strong>: When you hit a target using
      Target of Opportunity, the ally who triggered your ranged attack can
      attempt a Stealth check to hide from your target as an immediate action,
      even if your target is aware of your ally's presence. Your ally must also
      have this feat to benefit from this effect. This Stealth check applies
      only to the target you hit, and the stealth ends if the ally takes any
      action other than to move into cover or concealment.</p>
  tags:
    - Combat
    - Teamwork
type: feat
