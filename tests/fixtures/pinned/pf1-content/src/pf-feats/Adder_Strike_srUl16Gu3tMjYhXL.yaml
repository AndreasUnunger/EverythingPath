name: Adder Strike
system:
  description:
    value: >-
      <p><em>You can quickly apply poison to gloved hands, protected feet, or
      other protected body parts, delivering the poison with your unarmed
      strikes.</em></p><p><strong>Prerequisites</strong>: Poison use class
      feature, Craft (alchemy) 1 rank, Improved Unarmed
      Strike.</p><p><strong>Benefits</strong>: As a swift action, you can apply
      one dose of contact or injury poison to two body parts that you use for
      unarmed strikes. You must still protect yourself against exposure to
      contact poisons you apply in this way.</p><p><strong>Normal</strong>:
      Applying poison to a weapon or single piece of ammunition is a standard
      action.</p><h3>Combat Trick</h3><p>You can spend 2 stamina points to apply
      poison to a manufactured weapon as a swift action.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
