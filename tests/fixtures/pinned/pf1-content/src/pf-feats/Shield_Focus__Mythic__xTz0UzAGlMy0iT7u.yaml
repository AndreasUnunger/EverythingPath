name: Shield Focus (Mythic)
system:
  description:
    value: >-
      <p><em>You're a master of using your shield for
      protection.</em></p><p><strong>Prerequisites</strong>: Shield
      Focus.</p><p><strong>Benefits</strong>: Add your shield bonus and your
      shield's enhancement bonus to your touch AC. As an immediate action, you
      can expend one use of mythic power to add your shield bonus and your
      shield's enhancement bonus on a Fortitude or Ref lex save just before you
      roll it.</p>
  tags:
    - Combat
    - Mythic
type: feat
