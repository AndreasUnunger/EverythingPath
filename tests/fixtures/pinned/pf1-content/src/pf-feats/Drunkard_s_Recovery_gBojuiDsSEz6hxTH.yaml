name: Drunkard's Recovery
system:
  description:
    value: >-
      <p><em>You need only a swallow of strong drink to bring you back from the
      brink of death.</em></p><p><strong>Prerequisites</strong>: Con
      13.</p><p><strong>Benefits</strong>: If you are dying and a creature gives
      you at least a sip of alcohol (a standard action for an adjacent
      creature), you immediately stabilize.</p>
