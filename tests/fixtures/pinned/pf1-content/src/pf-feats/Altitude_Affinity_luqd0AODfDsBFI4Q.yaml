name: Altitude Affinity
system:
  description:
    value: >-
      <p><em>You have hardened your body against the grueling rigors of
      surviving at high altitudes.</em></p><p><strong>Prerequisites</strong>:
      Endurance.</p><p><strong>Benefits</strong>: You are automatically
      acclimated at high altitudes (Pathfinder RPG Core Rulebook 430). In
      addition, you gain a +2 competence bonus on all Survival checks made at
      altitudes of 5,000 feet or higher.</p>
  tags:
    - General
type: feat
