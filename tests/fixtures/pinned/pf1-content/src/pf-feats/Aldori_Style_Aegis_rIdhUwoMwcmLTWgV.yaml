name: Aldori Style Aegis
system:
  description:
    value: >-
      <p><em>Baron Aldori's dueling style is at its strongest when employed in
      one-on-one duels. Adjusting to a reverse grip and keeping your blade in
      motion, you parry your rival's strikes with
      ease.</em></p><p><strong>Prerequisites</strong>: Aldori Style, Alertness,
      Combat Reflexes, Exotic Weapon Proficiency (Aldori dueling sword), Weapon
      Finesse, Weapon Focus (Aldori dueling
      sword).</p><p><strong>Benefits</strong>: While using Aldori Style, at the
      beginning of your turn, you can designate a focused target as a swift
      action. This designation lasts until the beginning of your next turn, and
      you take a -2 penalty to your AC against all other creatures' attacks for
      that duration. As an immediate action while using Combat Expertise or
      fighting defensively, you can attempt to parry the focused target's
      attack. This functions as the swashbuckler's opportune parry and riposte
      deed (Pathfinder RPG Advanced Class Guide 57), except that it does not
      cost panache and you cannot riposte.</p>
  tags:
    - Combat
type: feat
