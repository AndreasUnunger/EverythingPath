name: Small But Deadly
system:
  description:
    value: >-
      <p><em>You have learned to make the most of certain weapons, despite your
      physical weakness.</em></p><p><strong>Prerequisites</strong>: Weapon Focus
      or natural weapon, Small size or smaller.</p><p><strong>Benefits</strong>:
      You ignore your Strength penalty to damage when making attacks with your
      racial natural weapons and weapons for which you have the Weapon Focus
      feat.</p>
