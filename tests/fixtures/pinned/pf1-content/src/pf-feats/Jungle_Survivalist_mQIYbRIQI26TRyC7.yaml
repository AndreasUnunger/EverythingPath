name: Jungle Survivalist
system:
  description:
    value: >-
      <p><em>Normally pestilential rain forests are a safe haven and home to
      you.</em></p><p><strong>Prerequisites</strong>: Favored terrain ( jungle)
      class feature.</p><p><strong>Benefits</strong>: You gain a +2 bonus on
      saving throws against diseases, poisons, and the distraction ability of
      creatures with the swarm subtype. You also gain a +2 bonus on Acrobatics
      and Climb checks when climbing trees and a +2 bonus on Perception checks
      against creatures that gain a racial bonus on Stealth checks in
      vegetation.</p>
  tags:
    - General
type: feat
