name: Garen's Discipline
system:
  description:
    value: >-
      <p><em>You've learned to defend yourself against spell and storm with
      dazzling flourishes of your
      weapon.</em></p><p><strong>Prerequisites</strong>: Alertness, Exotic
      Weapon Proficiency (Aldori dueling sword), Weapon Focus (Aldori dueling
      sword), base attack bonus +4.</p><p><strong>Benefits</strong>: Whenever
      you use Combat Expertise, fight defensively, or take the total defense
      action, choose a type of saving throw. (You can choose a different type
      each time you take such an action.) Once per round before attempting a
      saving throw using the selected save, you gain a +2 bonus on that save. If
      you have a base attack bonus of +11 or higher, this bonus increases to +3.
      If you have a base attack bonus of +16 or higher, the bonus instead
      increases to +4.</p>
  tags:
    - Combat
type: feat
