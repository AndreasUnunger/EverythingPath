name: Perturbing Stare
system:
  description:
    value: >-
      <p><em>Your stare dulls your foe's
      reactions.</em></p><p><strong>Prerequisites</strong>: Mesmerist level 5th,
      painful stare class feature.</p><p><strong>Benefits</strong>: When you
      trigger your painful stare, the target must succeed at a Will save (DC =
      10 + half your mesmerist level + your Charisma modifier) or lose its
      Dexterity modifier to AC for 1 round.</p>
