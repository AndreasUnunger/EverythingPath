name: Arcane Blast (Mythic)
system:
  description:
    value: >-
      <p><em>You can manipulate raw eldritch energies to do more than just deal
      damage.</em></p><p><strong>Prerequisites</strong>: Arcane
      Blast.</p><p><strong>Benefits</strong>: When you use Arcane Blast, you may
      halve the damage dice to also perform your choice of either a trip or bull
      rush combat maneuver against the target of the blast. You can't move with
      an opponent you bull rush with this feat. You gain a bonus on your combat
      maneuver check for this attempt equal to half the spell level of the spell
      you sacrificed when using Arcane Blast, and you can substitute your
      Intelligence or Charisma modifier in place of your Strength modifier when
      determining your combat maneuver bonus.</p><p>In addition, you can expend
      one use of mythic power to change the damage dice of your Arcane Blast to
      d8s instead of d6s.</p>
  tags:
    - General
    - Mythic
type: feat
