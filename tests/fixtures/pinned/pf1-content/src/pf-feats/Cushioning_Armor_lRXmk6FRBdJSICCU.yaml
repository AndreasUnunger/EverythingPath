name: Cushioning Armor
system:
  description:
    value: >-
      <p><em>You twist in your armor, allowing it to mitigate your
      fall.</em></p><p><strong>Prerequisites</strong>: Armor training class
      feature, proficiency with medium or heavy
      armor.</p><p><strong>Benefits</strong>: When you take falling damage, you
      can direct half of the damage to your armor. This damage ignores the
      armor's hardness.</p><h3>Combat Trick</h3><p>You can spend 5 stamina
      points to utilize your armor's hardness when directing falling damage to
      it. (See page 16.)</p>
  tags:
    - Armor Mastery
    - Combat
    - Combat Trick
type: feat
