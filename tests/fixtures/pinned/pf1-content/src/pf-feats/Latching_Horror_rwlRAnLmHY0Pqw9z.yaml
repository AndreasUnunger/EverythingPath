name: Latching Horror
system:
  description:
    value: >-
      <p><em>You induce fear and loathing when you latch onto another living
      creature.</em></p><p><strong>Prerequisites</strong>: Attach universal
      monster ability.</p><p><strong>Benefits</strong>: When you use your attach
      ability, your opponent must succeed at a Will save (DC = 10 + 1/2 your Hit
      Dice + your Constitution modifier) to avoid becoming shaken while you
      remain attached. This is a mind-affecting fear effect.</p>
  tags:
    - Combat
type: feat
