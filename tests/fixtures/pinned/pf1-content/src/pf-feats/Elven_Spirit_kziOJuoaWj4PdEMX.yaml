name: Elven Spirit
system:
  description:
    value: >-
      <p><em>Although you are of mixed heritage, you are closer to your elven
      relatives and the magic in their blood flows freely in your
      veins.</em></p><p><strong>Prerequisites</strong>:
      Half-elf.</p><p><strong>Benefits</strong>: You possess the elven magic
      racial trait of the elves, granting you a +2 racial bonus on caster level
      checks made to overcome spell resistance. In addition, you receive a +2
      racial bonus on Spellcraft checks made to identify the properties of magic
      items. Alternatively, you can instead gain any one racial trait that elves
      can exchange for the elven magic racial
      trait.</p><p><strong>Special</strong>: You can only take this feat at 1st
      level. If you take this feat, you cannot take the Human Spirit feat.</p>
  tags:
    - Racial
    - Half-Elf
type: feat
