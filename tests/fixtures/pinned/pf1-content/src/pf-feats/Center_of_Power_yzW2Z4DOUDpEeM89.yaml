name: Center of Power
system:
  description:
    value: >-
      <p><em>You have posted loyal followers in the most vital
      places.</em></p><p><strong>Prerequisites</strong>: Leadership score 13,
      hold a leadership role related to running a
      kingdom.</p><p><strong>Benefit</strong>: Choose a building in your kingdom
      as your center of power, and dedicate one of the followers granted to you
      by the Leadership feat to overseeing that location. For every kingdom turn
      in which that follower does nothing but oversee that location, the
      benefits that building grants to your kingdom&rsquo;s Economy, Fame,
      Loyalty, and Stability are doubled and any penalties are negated. This
      feat does not allow a building to grant benefits it does not normally
      provide, and has no effect on a building&rsquo;s other effects.</p><p>This
      feat only applies to one building, and committing multiple followers to
      this or different buildings has no effect&mdash;the selected location is
      treated as being of particular importance to you, and its uniqueness
      combined with the follower&rsquo;s loyalty grants it special efficiencies.
      The same follower does not have to oversee your center of power every
      month, but you must keep at least one follower dedicated to this location
      for the entire month to gain this feat&rsquo;s benefits. Once per year,
      you may change which building is your center of power.</p>
  tags:
    - General
type: feat
