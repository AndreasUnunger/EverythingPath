name: Moonlight Stalker Master
system:
  description:
    value: >-
      <p><em>You leave your opponents swinging at shadows while you slide
      elusively through the darkness.</em></p><p><strong>Prerequisites</strong>:
      Int 13, Blind-Fight, Combat Expertise, Improved Feint, Moonlight Stalker,
      Moonlight Stalker Feint, Bluff 9 ranks, darkvision or low-light vision
      racial trait.</p><p><strong>Benefits</strong>: While you have concealment,
      your opponents' miss chance against you increases by 10%. If an opponent
      misses you due to your concealment, you can spend an immediate action to
      move 5 feet, this movement does not provoke attacks of opportunity and
      does not count as a 5-foot step.</p><h3>Combat Trick</h3><p>When an
      opponent makes an attack against you while you have concealment, you can
      spend 5 stamina points to increase that attack's miss chance by an
      additional 20%.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
