name: Lithe Attacker
system:
  description:
    value: >-
      <p><em>Your unmatched grace allows you to strike even from the tightest
      crevices.</em></p><p><strong>Prerequisites</strong>: Narrow Frame, Escape
      Artist 5 ranks, animal or magical beast.</p><p><strong>Benefits</strong>:
      You can attack from nooks and crannies, even while using Escape Artist to
      squeeze through or into a narrow space less than half as wide as your
      normal space, and you do not lose your Dexterity bonus to AC while using
      Escape Artist to squeeze through or into a narrow space. You still take a
      -4 penalty to AC while using Escape Artist in this way.</p>
  tags:
    - General
type: feat
