name: Elven Battle Torrent
system:
  description:
    value: >-
      <p><em>You rapidly counter enemy
      attacks.</em></p><p><strong>Prerequisites</strong>: Int 13, Elven Battle
      Focus, Elven Battle Style, Elven Battle Training, Weapon Finesse, base
      attack bonus +10, weapon familiarity racial
      trait.</p><p><strong>Benefits</strong>: While using Elven Battle Style,
      any opponent that makes an attack against you and misses while you are
      fighting defensively or using total defense or the Combat Expertise feat
      provokes an attack of opportunity from you. Even if you have Combat
      Reflexes, you can't benefit from this feat more than once per round.</p>
  tags:
    - Combat
type: feat
