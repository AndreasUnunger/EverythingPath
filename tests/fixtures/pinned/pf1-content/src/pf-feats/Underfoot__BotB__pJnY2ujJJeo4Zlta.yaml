name: Underfoot (BotB)
system:
  description:
    value: >-
      <p><em>You clamber in and around your enemies' personal space to
      devastating effect.</em></p><p><strong>Prerequisites</strong>: Dodge,
      swarming racial trait.</p><p><strong>Benefits</strong>: You are able to
      share a space with a hostile creature at least one size category larger
      than you. You gain a +2 shield bonus to your AC while occupying an
      opponent's space, as well as a +2 bonus on all attack rolls against the
      creature whose space you share. Creatures you share a square with take a
      -2 penalty on all concentration checks. Entering a space occupied by an
      opponent provokes an attack of opportunity. This ability does not stack
      with similar abilities providing a creature benefits for being in another
      creature's space, such as a mouser swashbuckler's underfoot attack
      deed.</p><p><strong>Special</strong>: This feat counts as the Disruptive
      feat for the purpose of qualifying for other feats that have Disruptive as
      a prerequisite.</p>
  tags:
    - Combat
type: feat
