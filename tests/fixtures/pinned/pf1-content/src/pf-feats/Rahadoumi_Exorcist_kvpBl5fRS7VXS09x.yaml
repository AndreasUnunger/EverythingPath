name: Rahadoumi Exorcist
system:
  description:
    value: >-
      <em>You can stagger incorporeal and possessed creatures through sheer
      force of will.</em></p><p><strong>Prerequisites</strong>: Iron Will, can't
      have a patron deity.</p><p><strong>Benefits</strong>: As a full-round
      action, you can recite the Laws of Man with such force and dedication that
      you stagger those creatures that prey upon the bodies, minds, and souls of
      mortals. When you use this ability, you must target one creature within 30
      feet to which you have line of sight. A successful Will save (DC = 10 +
      1/2 your Hit Dice + your Charisma modifier) negates the effects of this
      feat. An incorporeal undead creature that fails its save against this
      effect is staggered. If you target a possessed creature, the possessing
      entity must succeed at a Will save to resist being staggered for 1 round.
      If it is staggered, the creature it possesses can immediately attempt a
      new saving throw to end the possession effect (possession effects that
      don't allow saving throws to resist them cannot be ended by Rahadoumi
      Exorcist, but the feat can still stagger a possessed creature). You can
      use this ability a number of times per day equal to 3 + your Charisma
      modifier.
  tags:
    - General
type: feat
