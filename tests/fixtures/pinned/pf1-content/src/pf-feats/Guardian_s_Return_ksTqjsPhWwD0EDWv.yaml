name: Guardian's Return
system:
  description:
    value: >-
      <p><em>Your familiar can teleport to you when you're in
      need.</em></p><p><strong>Prerequisites</strong>: Must have a familiar with
      the protector archetype (see page 11).</p><p><strong>Benefits</strong>:
      Once per day when you take damage from a melee attack, as long as your
      familiar is within empathic link range, it can teleport back to your
      square as an immediate action. It can bring no more than 5 pounds of items
      with it when it teleports in this way. This ability otherwise functions as
      dimension door.</p>
  tags:
    - Familiar
type: feat
