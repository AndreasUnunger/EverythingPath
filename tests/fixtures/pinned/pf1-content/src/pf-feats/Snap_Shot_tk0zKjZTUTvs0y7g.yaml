name: Snap Shot
system:
  description:
    value: >-
      <p><em>With a ranged weapon, you can take advantage of any opening in your
      opponent's defenses.</em></p><p><strong>Prerequisites</strong>: Dex 13,
      Point-Blank Shot, Rapid Shot, Weapon Focus, base attack bonus
      +6.</p><p><strong>Benefits</strong>: While wielding a ranged weapon with
      which you have Weapon Focus, you threaten squares within 5 feet of you.
      You can make attacks of opportunity with that ranged weapon. You do not
      provoke attacks of opportunity when making a ranged attack as an attack of
      opportunity.</p><p><strong>Normal</strong>: While wielding a ranged
      weapon, you threaten no squares and can make no attacks of opportunity
      with that weapon.</p><h3>Combat Trick</h3><p>: At the end of your turn,
      you can spend 2 stamina points to increase the range at which you threaten
      squares with ranged weapons to 10 feet until you take an attack of
      opportunity against an opponent in the expanded threat range or the
      beginning of your next turn, whichever comes first.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
