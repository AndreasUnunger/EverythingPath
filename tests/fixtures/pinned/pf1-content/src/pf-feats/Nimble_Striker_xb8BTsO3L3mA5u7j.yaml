name: Nimble Striker
system:
  description:
    value: >-
      <p><em>You were born to charge your enemies and nobody does it
      better.</em></p><p><strong>Prerequisites</strong>: Dex 13, base attack
      bonus +1, catfolk, sprinter racial trait.</p><p><strong>Benefits</strong>:
      You do not take a -2 penalty to AC when you use the Cleave feat, Lunge
      feat, or when you charge.</p><h3>Combat Trick</h3><p>When you use the
      Cleave or Lunge feats or when you charge, you can spend 5 stamina points
      to gain a +2 dodge bonus to AC. This bonus lasts until the start of your
      next turn.</p>
  tags:
    - Combat
    - Racial
    - Catfolk
    - Combat Trick
type: feat
