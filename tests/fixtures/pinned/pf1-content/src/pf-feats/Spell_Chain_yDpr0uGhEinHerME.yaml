name: Spell Chain
system:
  description:
    value: >-
      <p><em>You help your allies bypass your foes' magical
      defenses.</em></p><p><strong>Prerequisites</strong>: Spell
      Penetration.</p><p><strong>Benefits</strong>: Whenever you make a
      successful caster level check to overcome a target's spell resistance, the
      next ally who also has this feat that attempts to overcome the same
      target's spell resistance can roll twice when attempting his own caster
      level check, taking the better result. This benefit must be used within 1
      round or else it is lost.</p>
  tags:
    - Teamwork
type: feat
