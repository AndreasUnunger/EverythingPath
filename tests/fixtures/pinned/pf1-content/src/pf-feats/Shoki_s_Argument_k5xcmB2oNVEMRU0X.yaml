name: Shoki's Argument
system:
  description:
    value: >-
      <p><em>The collectors of the lost dead prefer to use complex theology or
      blunt warnings to gather wayward spirits, but sometimes a more direct
      approach is necessary. One of them shared a trade secret with
      you.</em></p><p><strong>Prerequisites</strong>: Ability to cast disrupt
      undead, character level 3rd, duskwalker.</p><p><strong>Benefits</strong>:
      The damage dealt by your disrupt undead spell increases by 1d6. It
      increases by an additional 1d6 at 6th level and every 3 levels thereafter
      (to a maximum of 7d6 at 18th level).</p>
  tags:
    - Racial
    - Duskwalker
type: feat
