name: Natural Charmer
system:
  description:
    value: >-
      <p><em>You possess some of the dominating powers of your vampire
      progenitor.</em></p><p><strong>Prerequisites</strong>: Cha 17,
      dhampir.</p><p><strong>Benefits</strong>: You can take 20 on any
      Charisma-based skills to charm, convince, persuade, or seduce humanoids
      whose attitude is at least friendly to you. Taking 20 still requires 20
      times the normal time to perform the skill.</p><p><strong>Normal</strong>:
      You cannot take 20 on any check where you incur penalties for failure.</p>
  tags:
    - Racial
    - Dhampir
type: feat
