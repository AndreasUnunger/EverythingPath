name: Gruesome Slaughter
system:
  description:
    value: >-
      <p><em>You can inspire extreme revulsion when you slaughter your
      enemies.</em></p><p><strong>Prerequisites</strong>: Intimidating Prowess,
      Killing Flourish, Intimidate 11 ranks, slayer level
      11th.</p><p><strong>Benefits</strong>: Creatures you demoralize by using
      the Killing Flourish feat must succeed at a Fortitude save (DC = 10 + 1/2
      your character level + the higher of your Strength or Dexterity modif ier)
      or become sickened for 1 minute.</p><h3>Combat Trick</h3><p>When using
      this feat, you can spend up to 5 stamina points to increase the DC of the
      effect by an amount equal to the number of stamina points you spent.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
