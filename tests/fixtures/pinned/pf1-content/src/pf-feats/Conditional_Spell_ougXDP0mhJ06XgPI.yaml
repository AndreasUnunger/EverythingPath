name: Conditional Spell
system:
  description:
    value: >-
      <p><em>You know how to apply restrictions on how a creature can use the
      benefits of your spells.</em></p><p><strong>Benefits</strong>: A
      conditional spell is subject to the rules laid out in the spell
      conditional favor (Pathfinder RPG Ultimate Intrigue 206). A conditional
      spell takes up a spell slot 1 level higher than normal.</p>
