name: Spirit Sense
system:
  description:
    value: >-
      <p><em>You sense the presence of the
      unseen.</em></p><p><strong>Prerequisites</strong>: Psychic Sensitivity or
      ability to cast psychic spells.</p><p><strong>Benefits</strong>: You gain
      a +5 bonus on checks to notice haunts. In addition, when you target an
      incorporeal creature with a corporeal spell or effect that doesn't deal
      damage, you have a 75% chance of affecting the
      target.</p><p><strong>Normal</strong>: Corporeal spells and effects that
      don't deal damage have only a 50% chance of affecting an incorporeal
      creature.</p>
  tags:
    - General
type: feat
