name: Greater Wilding Strike
system:
  description:
    value: >-
      <p><em>You reach the pinnacle of your wilding strike
      abilities.</em></p><p><strong>Prerequisites</strong>: Str 18, Improved
      Unarmed Strike, Improved Wilding Strike, Wilding, Wilding Strike, base
      attack bonus +16.</p><p><strong>Benefits</strong>: The damage die of your
      unarmed strikes increases to 1d10 (or 1d8 if you are Small). This does not
      stack with any other effects that increase the damage die of your unarmed
      strikes, including levels in classes such as monk. Increases to your
      actual size category (such as enlarge person) still increase your damage
      die as normal.</p>
  tags:
    - Combat
type: feat
