name: Improved Position of Strength
system:
  description:
    value: >-
      <p><em>You are particularly skilled in pressing your advantage when
      negotiating with noncombatants.</em></p><p><strong>Prerequisites</strong>:
      Position of Strength; Two-Weapon Fighting or Multiattack; Intimidate 5
      ranks.</p><p><strong>Benefits</strong>: As long as you are wielding one or
      more weapons with which you are proficient, you gain the bonus on
      Intimidate checks from Position of Strength against creatures that are
      armed with fewer weapons than you are wielding.</p>
  tags:
    - Combat
type: feat
