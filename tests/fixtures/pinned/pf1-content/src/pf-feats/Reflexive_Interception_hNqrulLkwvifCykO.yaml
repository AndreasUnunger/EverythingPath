img: systems/pf1/icons/misc/divert.png
name: Reflexive Interception
system:
  description:
    value: >-
      <p><em>The animal can defend its master with lightning
      speed.</em></p><p><strong>Prerequisites</strong>: Intercept Blow, base
      attack bonus +3, animal companion,
      evasion.</p><p><strong>Benefits</strong>: Whenever the animal companion is
      adjacent to its master and its master is attempts a Reflex save, the
      animal companion can expend an attack of opportunity as a free action,
      even if it isn't its turn, to attempt a Reflex save to intervene. When
      using this ability, the animal companion loses the benefits of evasion
      (and improved evasion if it has it), but if the animal companion succeeds
      at its saving throw, its master gains the benefit of the animal
      companion's evasion (or improved evasion if it has it).</p>
  tags:
    - Combat
type: feat
