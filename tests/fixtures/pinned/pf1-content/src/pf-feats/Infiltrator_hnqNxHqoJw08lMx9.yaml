name: Infiltrator
system:
  description:
    value: >-
      <p><em>You have sacrificed your true identity in order to achieve your
      goal.</em></p><p><strong>Prerequisites</strong>: Must have adopted an
      assumed or secret identity associated with an enemy
      organization.</p><p><strong>Benefits</strong>: Once per day when you
      succeed at a saving throw to negate a divination, you learn what the
      divination would have revealed and can spend an immediate action to cause
      the divination to return appropriate false information you imagine that
      would fit with your cover identity.</p><p><strong>Goal</strong>: Thwart
      the organization you have infiltrated, defeating or turning to your cause
      an appropriate number of challenging foes in the process
      .</p><p><strong>Completion Benefit</strong>: Whenever a spell or
      spell-like ability would reveal information about you, you can attempt a
      Will saving throw. If your saving throw is successful, the spell reveals
      nothing about you. You can use this feat's benefits to instead give false
      information, as detailed above.</p>
  tags:
    - Story
type: feat
