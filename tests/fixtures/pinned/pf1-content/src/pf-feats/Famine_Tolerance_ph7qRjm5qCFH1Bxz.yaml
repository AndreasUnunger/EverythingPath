name: Famine Tolerance
system:
  description:
    value: >-
      <p><em>You can abide much longer periods without feeding, and enjoy
      increased benefits from a meal.</em></p><p><strong>Prerequisites</strong>:
      Moroi or nosferatu.</p><p><strong>Benefits</strong>: You can go without
      feeding for a number of days equal to twice your Hit Dice before having to
      make hunger saves. When you use your blood drain ability, you gain twice
      the normal amount of temporary hit points for each
      feeding.</p><p><strong>Special</strong>: This feat is only for campaigns
      using the optional undead hunger rules (see page 22).</p>
  tags:
    - Monster
    - Moroi
    - Nosferatu
    - Vampire
type: feat
