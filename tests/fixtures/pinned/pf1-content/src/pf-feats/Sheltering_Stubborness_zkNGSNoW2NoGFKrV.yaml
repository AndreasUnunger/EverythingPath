name: Sheltering Stubborness
system:
  description:
    value: >-
      <p><em>Your stubborn mind is not easy to
      sway.</em></p><p><strong>Prerequisites</strong>: Iron
      Will.</p><p><strong>Benefits</strong>: When you fail a saving throw
      against a mind-affecting effect with a duration of 1 round or longer (such
      as confusion), you can choose to be dazzled for the first round of the
      duration instead of suffering the usual effect. On subsequent rounds, the
      effect functions normally. If an effect, immunity, or other ability
      prevents you from being dazzled, this feat has no effect.</p>
  tags:
    - General
type: feat
