name: Improved Beast Hunter
system:
  description:
    value: >-
      <p><em>You are well trained in stalking and hunting the animals of the
      wild.</em></p><p><strong>Prerequisites</strong>: Beast Hunter; base attack
      bonus +3; Knowledge (nature) or Survival 3
      ranks.</p><p><strong>Benefits</strong>: When fighting animals that are at
      least one size category larger than you and that are native to the terrain
      you have chosen with Beast Hunter, you gain a +4 bonus on combat maneuver
      checks and a +4 to your CMD against such animals' attempts to use combat
      maneuvers against you. Additionally, you gain a +2 bonus on Reflex saves
      against attacks by the animal that allow a Reflex save (such as attempting
      to avoid a trample attack).</p><p><strong>Special</strong>: If you have
      selected Beast Hunter multiple times, you gain this benefit for all of the
      terrains you have chosen for those feats.</p>
  tags:
    - Combat
type: feat
