name: Urdefhan Bladebreaker
system:
  description:
    value: >-
      <p><em>You can use your rhoka sword to destroy your foes'
      blades.</em></p><p><strong>Prerequisites</strong>: Base attack bonus +1,
      proficiency with the rhoka sword,
      urdefhan.</p><p><strong>Benefits</strong>: When wielding a rhoka sword,
      you can attempt to sunder an opponent's sword or other slender-bladed
      weapon without provoking an attack of opportunity. You gain a +2
      circumstance bonus on the combat maneuver check to do so.</p>
  tags:
    - Combat
type: feat
