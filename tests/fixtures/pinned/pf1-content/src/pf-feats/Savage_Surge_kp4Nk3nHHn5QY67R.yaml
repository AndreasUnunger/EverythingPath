name: Savage Surge
system:
  description:
    value: >-
      <p><em>You can channel your rage into crowd-pleasing displays of brutality
      that aid you in the arena.</em></p><p><strong>Prerequisites</strong>:
      Intimidating Prowess, rage class feature.</p><p><strong>Benefits</strong>:
      When attempting a performance combat check while raging, you may, as a
      free action, expend a number of your daily rounds of rage up to half your
      barbarian level to create a display of savagery. You gain a bonus on the
      performance combat check equal to half the number of rounds expended,
      rounded down. If you expend all your remaining rounds of rage in this
      manner, thus ending your rage, you gain an additional +2 bonus on the
      check.</p><h3>Combat Trick</h3><p>You can spend stamina points instead of
      rounds of rage when using Savage Surge.</p>
  tags:
    - Combat
    - Performance
    - Combat Trick
type: feat
