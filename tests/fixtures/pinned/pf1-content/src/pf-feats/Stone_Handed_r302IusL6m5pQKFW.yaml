name: Stone-Handed
system:
  description:
    value: >-
      <p><em>Drawing upon techniques to combat animated creatures, you bring a
      strike like an avalanche of
      stone.</em></p><p><strong>Prerequisites</strong>: Str 13, Stunning
      Fist.</p><p><strong>Benefits</strong>: Before making a melee attack with
      an unarmed strike, you can expend one use of Stunning Fist to declare a
      stone-handed strike. Resolve the attack normally, except your attack
      ignores an amount of the target's hardness equal to your monk level or
      one-quarter your base attack bonus (minimum 1), whichever is higher. This
      effect replaces other effects or conditions that would be caused by your
      Stunning Fist.</p>
  tags:
    - Combat
type: feat
