name: Diabolical Negotiator
system:
  description:
    value: >-
      <p><em>You treat the art of negotiation as devilish
      science.</em></p><p><strong>Prerequisites</strong>: Skill Focus
      (Diplomacy), worshiper of Asmodeus.</p><p><strong>Benefits</strong>: You
      can add your Intelligence or Wisdom modifier (whichever is higher) on
      Diplomacy checks in place of your Charisma modifier. You can shift a
      creature's attitude more than two steps with Diplomacy, and a creature's
      attitude is only decreased by one step if you roll a natural 1 and fail
      the check by 5 or more.</p>
  tags:
    - General
type: feat
