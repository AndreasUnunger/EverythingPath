name: Lantern Glare
system:
  description:
    value: >-
      <p><em>Like an archon's aura, the light of your thrown weapons can shake
      even the fiercest of foes.</em></p><p><strong>Prerequisites</strong>:
      Lantern Light, Lantern Style, Point-Blank Shot, Precise Shot, good or
      lawful alignment, caster level 11th or monk level
      11th.</p><p><strong>Benefits</strong>: Creatures you hit with a thrown
      weapon as well as creatures within 20 feet of your target must succeed at
      a Will save (DC = 10 + half your character level + your Charisma modifier)
      or become shaken until they damage you or 24 hours have passed. A creature
      that succeeds at its saving throw or that damages you after becoming
      shaken becomes immune to this effect for 24 hours.</p>
  tags:
    - Combat
type: feat
