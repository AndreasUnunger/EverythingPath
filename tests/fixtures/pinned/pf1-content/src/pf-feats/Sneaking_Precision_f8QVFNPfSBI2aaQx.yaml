name: Sneaking Precision
system:
  description:
    value: >-
      <p><em>Your knowledge of your enemies' vulnerable spots is especially
      punishing.</em></p><p><strong>Prerequisites</strong>: Sneak attack +6d6,
      Critical Focus, any critical feat, base attack bonus
      +9.</p><p><strong>Benefits</strong>: Whenever you successfully sneak
      attack an opponent for a second time on your turn, you can spend a swift
      action to apply the effects of one critical feat you know to that
      opponent.</p>
