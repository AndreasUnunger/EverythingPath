name: Porcupine Defense
system:
  description:
    value: >-
      <p><em>You are a threat to opponents that try to overwhelm
      you.</em></p><p><strong>Prerequisites</strong>: Combat Expertise, Combat
      Reflexes, base attack bonus +6.</p><p><strong>Benefits</strong>: Whenever
      an opponent of at least one size category larger than yourself attempts a
      combat maneuver attack against you, you gain a +2 bonus on any allowed
      attacks of opportunity. If your opponent may make such attacks without
      provoking attacks of opportunity, you instead gain a +2 bonus to CMD
      against such maneuvers.</p><h3>Combat Trick</h3><p>: You can spend 5
      stamina points to make an attack of opportunity against an opponent at
      least one size category larger than you if that opponent attempts a combat
      maneuver check against you. You can perform this attack of opportunity
      even if your opponent can attempt such combat maneuvers without normally
      provoking attacks of opportunity. (Dragonslayer's Handbook 25)</p>
  tags:
    - Combat
    - Combat Trick
type: feat
