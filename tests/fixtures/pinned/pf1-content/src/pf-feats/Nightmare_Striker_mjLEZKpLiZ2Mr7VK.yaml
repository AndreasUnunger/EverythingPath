name: Nightmare Striker
system:
  description:
    value: >-
      <p><em>Your faerie fire not only illuminates your foes, but it also shows
      you their weaknesses.</em></p><p><strong>Prerequisites</strong>: Improved
      Unarmed Strike, Nightmare Fist, Nightmare Weaver, Stunning Fist, Heal 5
      ranks, ability to cast faerie fire.</p><p><strong>Benefits</strong>: While
      a faerie fire you have cast (not one cast from a spell completion or spell
      trigger item) outlines an opponent, the DC for that opponent to resist
      your Stunning Fist attempts increases by +2. If you hit an opponent with a
      Stunning Fist attempt, and that opponent fails her saving throw, you can
      render the target shaken for 1d2 rounds plus 1 round for every 5 by which
      the opponent failed her save.</p><h3>Combat Trick</h3><p>When you hit an
      opponent with a Stunning Fist attack and that opponent fails its saving
      throw, you can spend 5 stamina points to make the opponent frightened for
      1d4 rounds instead of shaken.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
