name: Boar Ferocity
system:
  description:
    value: >-
      <p><em>Your flesh-ripping unarmed strikes terrify your
      victims.</em></p><p><strong>Prerequisites</strong>: Improved Unarmed
      Strike, Boar Style, Intimidate 6 ranks.</p><p><strong>Benefits</strong>:
      You add piercing damage to the damage types you can deal with your unarmed
      strikes. Further, you gain a +2 bonus on Intimidate checks to demoralize
      opponents. While using Boar Style, whenever you tear an opponent's flesh,
      you can spend a free action to make an Intimidate check to demoralize that
      opponent.</p><h3>Combat Trick</h3><p>If your foe is demoralized before you
      tear its flesh with Boar Style, you can spend 5 stamina points to sicken
      it for 1 round.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
