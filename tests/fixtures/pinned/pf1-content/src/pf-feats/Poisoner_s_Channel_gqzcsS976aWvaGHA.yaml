name: Poisoner's Channel
system:
  description:
    value: >-
      <p><em>You cause anyone damaged by your negative energy to become
      susceptible to poison.</em></p><p><strong>Prerequisites</strong>: Channel
      energy 3d6, worshiper of Norgorber.</p><p><strong>Benefits</strong>: Once
      per day when you channel negative energy to damage living creatures, you
      can cause any creatures that failed their save against your channel to
      take a -4 penalty on saving throws against poison effects. This penalty
      lasts for 1 minute.</p>
  tags:
    - Channeling
type: feat
