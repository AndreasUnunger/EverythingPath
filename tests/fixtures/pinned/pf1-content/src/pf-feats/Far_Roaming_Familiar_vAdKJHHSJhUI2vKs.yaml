name: Far-Roaming Familiar
system:
  description:
    value: >-
      <p><em>Distance can't sever the bond between you and your
      familiar.</em></p><p><strong>Prerequisites</strong>: Intelligence 13, must
      have a familiar.</p><p><strong>Benefits</strong>: You retain your empathic
      link to your familiar regardless of distance, though lead blocks the link
      at distances greater than 1 mile (similar to the way lead blocks detect
      magic effects).</p>
