name: Greater Eldritch Heritage
system:
  description:
    value: >-
      <p><em>Your discovered bloodline power reaches its
      zenith.</em></p><p><strong>Prerequisites</strong>: Cha 17, Eldritch
      Heritage, Improved Eldritch Heritage, character level
      17th.</p><p><strong>Benefits</strong>: You gain an additional power from
      the bloodline you selected with the Eldritch Heritage feat. You gain a
      15th-level (or lower) sorcerer bloodline power that you do not already
      have. For purposes of using that power, treat your character level as your
      sorcerer level for all your sorcerer bloodline powers granted by this
      feat, Eldritch Heritage, and Improved Eldritch Heritage.</p>
  tags:
    - General
type: feat
