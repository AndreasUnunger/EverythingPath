name: Bolster Undead
system:
  description:
    value: >-
      <p><em>You can fortify undead against positive
      energy.</em></p><p><strong>Prerequisites</strong>: Channel energy 6d6,
      worshiper of Urgathoa.</p><p><strong>Benefits</strong>: Whenever you
      channel negative energy to heal undead creatures, you grant all undead you
      heal +1 channel resistance (or a +1 bonus to their existing channel
      resistance) for a number of rounds equal to your Charisma modifier
      (minimum 1 round).</p>
  tags:
    - General
type: feat
