name: Greater Skald's Vigor
system:
  description:
    value: >-
      <p><em>Your song and your enthusiasm invigorate your
      allies.</em></p><p><strong>Prerequisites</strong>: Skald's Vigor, Perform
      (song) 10 ranks.</p><p><strong>Benefits</strong>: Your allies share in the
      fast healing granted by your Skald's Vigor, starting in the round when you
      begin your performance. They must be able to hear the performance. If you
      stop maintaining the song, the fast healing ends immediately, even if
      other effects of your song linger.</p>
