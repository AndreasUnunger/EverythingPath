name: Sinister Reputation
system:
  description:
    value: >-
      <p><em>You need spook only a few souls to scare a whole
      city.</em></p><p><strong>Prerequisites</strong>: Cha 13; Intimidate 5
      ranks; Persuasive or renown social
      talent.</p><p><strong>Benefits</strong>: By spending 8 hours cultivating
      your local legend in a settlement and then succeeding at an Intimidate
      check, your fearsome reputation becomes common knowledge. The DC is based
      on the size of the settlement (see the Sinister Reputation table below and
      page 203 of Pathfinder RPG GameMastery Guide). If the check succeeds, you
      can attempt an Intimidate check to demoralize a creature that has fewer
      Hit Dice than you as a swift action, and using Intimidate to force a
      creature to act friendly to you takes only half as long. You gain these
      benefits only while within the settlement and while not disguised. These
      benefits last for a number of days equal to your half your level + your
      Charisma modifier.</p><p><strong>Special</strong>: This feat's benefits
      always apply to a vigilante's area of renown, and he can choose whether
      the reputation and benefits apply to his social identity, vigilante
      identity, or both. You can always apply this feat's benefits to followers
      and cohorts gained from Leadership or similar abilities. Sinister
      Reputation <table><tr><td><strong>Settlement
      Size</strong></td><td><strong>DC</strong></td></tr><tr><td>Thorp</td><td>10</td></tr>
      <tr><td>Hamlet</td><td>12</td></tr><tr><td>Village</td><td>15</td></tr>
      <tr><td>Small town</td><td>18</td></tr> <tr><td>Large
      town</td><td>20</td></tr><tr><td>Small city</td><td>25</td></tr>
      <tr><td>Large
      city</td><td>30</td></tr><tr><td>Metropolis</td><td>35</td></tr></table></p>
  tags:
    - General
type: feat
