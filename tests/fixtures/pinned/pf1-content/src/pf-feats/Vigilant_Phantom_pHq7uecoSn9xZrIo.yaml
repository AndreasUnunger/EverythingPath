name: Vigilant Phantom
system:
  description:
    value: >-
      <p><em>Your phantom is highly observant, and its link with you increases
      your own watchfulness.</em></p><p><strong>Prerequisites</strong>: Phantom
      class feature.</p><p><strong>Benefits</strong>: While your phantom is
      within your reach, you gain a +4 bonus on Perception checks. If you have
      10 or more ranks in Perception, this bonus increases to +8. This doesn't
      apply if your phantom is helpless or unconscious.</p>
  tags:
    - General
type: feat
