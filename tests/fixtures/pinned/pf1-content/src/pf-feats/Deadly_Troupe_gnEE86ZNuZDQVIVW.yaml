name: Deadly Troupe
system:
  description:
    value: >-
      <p><em>You combine elements of dance and acting with your combat style to
      distract your enemies.</em></p><p><strong>Prerequisites</strong>: Perform
      (act) or Perform (dance) 3 ranks, human
      (Varisian).</p><p><strong>Benefits</strong>: When at least one ally who
      also has this feat is threatening a foe, you gain a +4 circumstance bonus
      against that foe on Bluff checks to feint, Bluff checks to create a
      diversion to hide, and Acrobatics checks to move through that foe's
      threatened squares. You also gain a +2 circumstance bonus on steal and
      dirty trick combat maneuver checks made against that foe.</p>
  tags:
    - Teamwork
    - Racial
    - Human
type: feat
