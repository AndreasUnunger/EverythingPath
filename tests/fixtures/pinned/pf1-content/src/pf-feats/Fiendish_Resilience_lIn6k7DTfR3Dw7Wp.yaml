img: systems/pf1/icons/races/tiefling.png
name: Fiendish Resilience
system:
  description:
    value: >-
      <p><em>You dodge energy attacks with amazing
      agility.</em></p><p><strong>Prerequisites</strong>: Dex 13, evasion class
      feature, tiefling.</p><p><strong>Benefits</strong>: Choose one of the
      following energy types that you have resistance to: cold, electricity, or
      fire. Anytime you make a Reflex saving throw against an attack that deals
      the selected type of energy damage and is subject to your evasion class
      feature, you gain a +4 competence bonus on the
      save.</p><p><strong>Special</strong>: You can take this feat multiple
      times. Each time you take it, you select a different qualifying energy
      type.</p>
  tags:
    - Racial
    - Tiefling
type: feat
