name: Skeleton Summoner
system:
  description:
    value: >-
      <p><em>The walking dead respond to your
      call.</em></p><p><strong>Prerequisites</strong>: Spell Focus (necromancy),
      ability to cast summon monster.</p><p><strong>Benefits</strong>: Add
      'human skeleton' to the list of creatures you can summon with summon
      monster I and 'human skeletal champion' to the list of creatures you can
      summon with summon monster III.</p><p>Once per day, when you cast summon
      monster, you may summon a skeletal version of one of the creatures on that
      spell's summoning list (apply the skeleton template to that creature to
      create this monster).</p>
  tags:
    - General
type: feat
