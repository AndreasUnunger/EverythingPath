img: systems/pf1/icons/feats/deadly-stroke.jpg
name: Deadly Stroke (Mythic)
system:
  description:
    value: >-
      <p><em>You can kill with a single
      stroke.</em></p><p><strong>Prerequisites</strong>: Deadly
      Stroke.</p><p><strong>Benefits</strong>: When making a Deadly Stroke
      attack, you can expend one use of mythic power to instantly kill a
      nonmythic living creature. A Fortitude save (DC 10 + your base attack
      bonus + your tier) negates this effect, though the attack still deals
      double damage and Con bleed as Deadly Stroke. Constructs, oozes, and
      creatures immune to critical hits or precision-based damage can't be
      killed with this feat.</p>
  tags:
    - Combat
    - Mythic
type: feat
