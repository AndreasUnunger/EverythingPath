name: Enfilading Fire
system:
  description:
    value: >-
      <p><em>Your ranged attacks take advantage of the flanking maneuvers of
      allies.</em></p><p><strong>Prerequisites</strong>: Point-Blank Shot,
      Precise Shot, one other teamwork feat.</p><p><strong>Benefits</strong>:
      You receive a +2 bonus on ranged attacks made against a foe flanked by 1
      or more allies with this feat.</p><h3>Combat Trick</h3><p>Before making a
      ranged attack roll, you can spend 1 stamina point to gain the benefits of
      this feat against a target that is flanked by two or more allies, even if
      those allies don't have this feat.</p>
  tags:
    - Combat
    - Teamwork
    - Combat Trick
type: feat
