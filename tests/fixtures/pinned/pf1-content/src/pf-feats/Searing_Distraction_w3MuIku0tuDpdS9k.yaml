name: Searing Distraction
system:
  description:
    value: >-
      <p><em>You harry your foes with the light and heat of your
      weapon.</em></p><p><strong>Prerequisites</strong>: Catch
      Off-Guard.</p><p><strong>Benefits</strong>: When you make an attack using
      a light source such as a sunrod or torch as an improvised weapon, the
      target must succeed at a Fortitude save or be dazzled for 1 round. On a
      critical hit, the target is instead blinded for 1 round. The DC of the
      effect is 10 + half your character level + your Dexterity modifier. Blind
      targets are immune to this effect.</p>
  tags:
    - Combat
type: feat
