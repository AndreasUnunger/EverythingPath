name: Stone Strider
system:
  description:
    value: >-
      <p><em>You discern the best path through rocky
      terrain.</em></p><p><strong>Prerequisites</strong>: Stonecunning racial
      trait, worshiper of Torag.</p><p><strong>Benefits</strong>: You can move
      through any sort of nonmagical rocky terrain without taking damage,
      becoming slowed due to difficult terrain, or suffering any other
      impairments the terrain would otherwise cause.</p>
