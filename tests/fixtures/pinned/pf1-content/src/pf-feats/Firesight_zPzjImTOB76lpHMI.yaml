name: Firesight
system:
  description:
    value: >-
      <p><em>Fire no longer blinds you, and smoke conceals nothing from your
      gaze.</em></p><p><strong>Prerequisites</strong>:
      Ifrit.</p><p><strong>Benefits</strong>: You can see through fire and smoke
      without penalty, ignoring any cover or concealment bonuses from fire and
      smoke. This does not allow you to see anything you could not otherwise see
      (for example, invisible creatures are still invisible). You are immune to
      the dazzled condition.</p>
  tags:
    - Racial
    - Ifrit
type: feat
