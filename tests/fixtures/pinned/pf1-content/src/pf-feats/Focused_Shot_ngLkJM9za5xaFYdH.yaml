name: Focused Shot
system:
  description:
    value: >-
      <p><em>Your anatomical insight adds deadliness to your
      shots.</em></p><p><strong>Prerequisites</strong>: Int 13, Point-Blank
      Shot, Precise Shot.</p><p><strong>Benefits</strong>: As a standard action,
      you may make an attack with a bow or crossbow and add your Intelligence
      modifier on the damage roll. You must be within 30 feet of your target to
      deal this extra damage. Creatures immune to critical hits and sneak
      attacks are immune to this extra damage.</p><p><strong>Special</strong>:
      Starting at 2nd level, a ranger with the archery combat style may select
      Focused Shot as a combat style feat.</p><h3>Combat Trick</h3><p>You can
      spend 2 stamina points to make a Focused Shot attack against a target
      anywhere within your weapon's first range increment.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
