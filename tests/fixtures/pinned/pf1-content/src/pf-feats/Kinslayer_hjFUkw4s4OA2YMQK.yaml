name: Kinslayer
system:
  description:
    value: >-
      <p><em>Your intimate knowledge of anatomy, deep hatred of your own kind,
      and delight in spilling your people's blood make you a lethal combatant
      against your own race.</em></p><p><strong>Prerequisites</strong>:
      Knowledge 3 ranks (see special), evil
      alignment.</p><p><strong>Benefits</strong>: Your attacks deal an
      additional 1d6 points of precision damage against creatures that have the
      same creature type (and subtype, if applicable) as you. This bonus damage
      stacks with other sources of precision damage, such as sneak attack. If
      you have more than one subtype, you must choose one of them--this feat
      applies only to targets of that subtype. Once made, this choice can't be
      changed.</p><p><strong>Special</strong>: The Knowledge skill used to
      qualify for this feat must be appropriate for identifying creatures of
      your type.</p>
  tags:
    - General
type: feat
