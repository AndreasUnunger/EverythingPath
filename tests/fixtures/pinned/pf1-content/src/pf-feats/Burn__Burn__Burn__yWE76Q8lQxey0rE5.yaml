name: Burn! Burn! Burn!
system:
  description:
    value: >-
      <p><em>You take the goblin love of arson and fire play to a whole new
      level.</em></p><p><strong>Prerequisites</strong>: Disable Device 1 rank,
      goblin.</p><p><strong>Benefits</strong>: You deal an extra 1d4 points of
      fire damage when you attack with fire from an alchemical or nonmagical
      source (such as with alchemical fire or torches) and gain a +4 competence
      bonus on Reflex saving throws made to avoid catching on fire or to put
      yourself out when on fire. Additional damage caused by this feat does not
      apply to magical attacks (such as an alchemist's bomb) or to splash
      damage.</p>
  tags:
    - Racial
    - Goblin
type: feat
