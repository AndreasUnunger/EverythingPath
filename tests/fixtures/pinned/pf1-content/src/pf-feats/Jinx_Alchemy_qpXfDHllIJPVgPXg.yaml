name: Jinx Alchemy
system:
  description:
    value: >-
      <p><em>With your knowledge of alchemy, creatures you jinx cannot benefit
      from most sorts of alchemical
      compounds.</em></p><p><strong>Prerequisites</strong>: Swift alchemy class
      feature, Halfling Jinx trait.</p><p><strong>Benefits</strong>: A jinxed
      creature cannot benefit from the effects of potions, elixirs, or any other
      substance that he must ingest in order to activate. This includes
      alchemical substances such as antitoxin, but not extracts, mutagens, or
      other alchemist class abilities that only affect the alchemist. A jinxed
      creature still takes any penalties and detrimental effects from ingested
      compounds or poisons.</p>
  tags:
    - Racial
    - Halfling
type: feat
