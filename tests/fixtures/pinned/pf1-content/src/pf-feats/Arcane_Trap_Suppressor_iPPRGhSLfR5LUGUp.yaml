name: Arcane Trap Suppressor
system:
  description:
    value: >-
      <p><em>Your magic can suppress magic traps longer than
      usual.</em></p><p><strong>Prerequisites</strong>: Ability to cast dispel
      magic or greater dispel magic as a spell or spell-like
      ability.</p><p><strong>Benefits</strong>: When you target a magic trap
      with dispel magic or greater dispel magic, if your caster level check
      exceeds the Disable Device DC of the trap, the trap is disabled for 1d4
      minutes.</p><p><strong>Normal</strong>: Dispel magic suppresses an item's
      magical properties for 1d4 rounds.</p>
  tags:
    - General
type: feat
