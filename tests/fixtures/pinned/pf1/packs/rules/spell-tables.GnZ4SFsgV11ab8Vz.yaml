    name: Ability Modifiers and Bonus Spells
    sort: 200000
    text:
      content: >-
        <p>Each ability, after changes made because of race, has a modifier
        ranging from –5 to +5. Table 1–3 shows the modifier for each score. The
        modifier is the number you apply to the die roll when your character
        tries to do something related to that ability. You also use the modifier
        with some numbers that aren’t die rolls. A positive modifier is called a
        bonus, and a negative modifier is called a penalty. The table also shows
        bonus spells, which you’ll need to know about if your character is a
        spellcaster.</p><h2>Table 1-3: Ability Modifiers and Bonus
        Spells</h2><table><thead><tr><th>Ability Scores</th><th>Modifier</th><th
        colspan="10">Bonus Spells per Day (by Spell
