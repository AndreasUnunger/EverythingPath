  description:
    value: >-
      <p>A creature with blindsense notices things it cannot see. The creature
      usually does not need to succeed at Perception checks to pinpoint the
      location of a creature within range of its blindsense ability, provided
      that it has line of effect to that creature. Any opponent the creature
      with blindsense cannot see still has total concealment from the creature,
      and the creature still has the normal miss chance when attacking foes that
      have concealment. Visibility still affects the movement of a creature with
      blindsense. A creature with blindsense is still denied its Dexterity bonus
      to Armor Class against attacks from creatures it cannot
      see.</p><p><em>Format</em>: blindsense 60 ft.</p><p><em>Location</em>:
      Senses.</p>
