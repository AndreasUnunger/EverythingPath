  description:
    value: >-
      <p>The creature can engulf creatures in its path as part of a standard
      action. It cannot make other attacks during a round in which it engulfs.
      The creature merely has to move over its opponents, affecting as many as
      it can cover. Targeted creatures can make attacks of opportunity against
      the creature, but if they do so, they are not entitled to a saving throw
      against the engulf attack. Those who do not attempt attacks of opportunity
      can attempt a Reflex save to avoid being engulfed—on a success, they are
      pushed back or aside (target's choice) as the creature moves forward.
      Engulfed opponents gain the pinned condition, are in danger of
      suffocating, are trapped within the creature's body until they are no
      longer @Condition[pinned], and may be subject to other special attacks
      from the creature. The save DC is Strength-based.</p><p><em>Format</em>:
      engulf (DC 12, 1d6 acid and paralysis)</p><p><em>Location</em>: Special
      Attacks.</p>
