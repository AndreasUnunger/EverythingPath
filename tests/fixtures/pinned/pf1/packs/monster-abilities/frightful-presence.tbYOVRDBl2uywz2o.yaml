  description:
    instructions: >-
      <p>Change <strong>Action</strong> <strong>range</strong> and <strong>Size
      formula</strong> (Miscellaneous).</p>
    value: >-
      <p>This special quality makes a creature's very presence unsettling to
      foes. Activating this ability is a free action that is usually part of an
      attack or charge. Opponents within range who witness the action may become
      frightened or shaken. The range is usually 30 feet, and the duration is
      usually 5d6 rounds. This ability affects only opponents with fewer Hit
      Dice or levels than the creature has. An affected opponent can resist the
      effects with a successful Will save (DC = 10 + 1/2 frightful creature's
      racial HD + that frightful creature's Charisma modifier; the exact DC is
      given in the creature's descriptive text). On a failed save, the opponent
      is shaken, or panicked if it has 4 Hit Dice or fewer. An opponent that
      succeeds at the saving throw is immune to that same creature's frightful
      presence for 24 hours. Frightful presence is a mind-affecting fear
      effect.</p><p><em>Format</em>: frightful presence (60 ft., DC
      21)</p><p><em>Location</em>: Aura.</p>
