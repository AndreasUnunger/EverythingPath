    value: >-
      <p>A creature with this special quality (usually an undead) is less easily
      affected by channel energy. A creature with channel resistance adds its
      listed bonus on saves to resist the effects of channel energy, including
      effects that rely on the use of channel energy (such as the
      @UUID[Compendium.pf1.feats.Item.CjLNTqNGz4zU4zpp]
      feat).</p><p><em>Format:</em> channel resistance
      +4</p><p><em>Location:</em> Defensive Abilities.</p>
