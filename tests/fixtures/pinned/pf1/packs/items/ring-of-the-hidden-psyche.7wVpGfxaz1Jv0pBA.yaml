name: Ring of the Hidden Psyche
system:
  cl: 18
  description:
    instructions: >-
      <p>In your psychic spellbook's settings, add 1 extra spell per day for
      each level up to 4th that you are able to access.</p>
    value: >-
      <p>This ring resembles a ring of psychic mastery, but its flawless
      sapphire serves as a vessel for the wearer's soul. It possesses all the
      abilities of a @UUID[Compendium.pf1.items.Item.9koipsUQY72cbjU9] in
      addition to the following effects. The wearer's soul instantly enters the
      ring upon the wearer's death, even if her body is utterly destroyed. This
      counts as an @UUID[Compendium.pf1.spells.Item.9pn76tz05b9g0peq] spell,
      except that the possessing soul cannot animate the ring and must instead
      wait for someone to wear it.</p><p>From inside the ring, she can attempt a
      @UUID[Compendium.pf1.spells.Item.0j2cb0iv0695a45i] on anyone who
      voluntarily wears the ring (@Save[will;dc=23] negates). A successful save
      against the greater possession effect renders the new wearer immune to
      further such attempts for 24 hours. Dispelling the object possession
      effect on the ring banishes the soul from the ring to its appropriate
      afterlife. Otherwise, a soul can remain in the ring
      indefinitely.</p><p>While in the ring, the soul knows when a creature has
      put on the ring. The soul can't otherwise sense the area around it or take
      actions other than attempting the greater possession effect. A ring of the
      hidden psyche resists attempts to discern its true nature. <em>Detect
      magic</em> reveals only the properties of a ring of psychic mastery,
      though <em>identify</em> or stronger magic can reveal the ring's full
      powers if the caster succeeds at a DC 23 Will
      save.</p><h3>Construction</h3><p><strong>Requirements</strong> Forge Ring,
      greater possession*, magic aura, object possession*, wish;
      <strong>Cost</strong> 80,000 GP</p>
  hp:
