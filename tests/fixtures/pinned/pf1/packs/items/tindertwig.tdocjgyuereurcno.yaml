      category: use
      hidden: false
      img: icons/svg/dice-target.svg
      name: Turn on light
      type: script
      value: |-
        if (!token) return;
        if (action.tag !== "ignite") return;

        fromUuid("Compendium.pf1.macros.Macro.Pa1s9GAbnGhj4z2A")
          .then(lm => lm.execute({ token, range: 5 }));
