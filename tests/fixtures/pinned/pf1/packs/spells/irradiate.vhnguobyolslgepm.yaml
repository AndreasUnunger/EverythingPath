  description:
    value: >-
      <p>The spell's area of effect floods with dangerous radiation. The
      strength of the radiation you create depends on your caster level, as
      detailed below. The central irradiated area is always a 10-foot-radius
      spread that expands normally per the rules for
      @UUID[Compendium.pf1.rules.JournalEntry.rZv6gghP92T1cEDy.JournalEntryPage.mTkj156p3HIRVBEd#radiation]{radiation}
      areas of effect. Creatures within the area are exposed to the radiation
      only once; the radiation does not linger in the area. The save to resist
      the radiation effects is set by the spell, not the standard save DC for
      radiation.</p><table><thead><tr><th>Caster Level</th><th>Radiation
      Level</th></tr></thead><tbody><tr><td>6th or
      lower</td><td>Low</td></tr><tr><td>7th–9th</td><td>Medium</td></tr><tr><td>10th–16th</td><td>High</td></tr><tr><td>17th
      or higher</td><td>Severe</td></tr></tbody></table>
