  description:
    instructions: >-
      <p>Change the alignment in the <strong>Summary tab</strong> to any
      evil.</p><p>Change all <strong>racial HD</strong> to
      <strong>D8s</strong>.</p><p>In <strong>Settings tab</strong> change
      <strong>Ability Score Links</strong> on <strong>Hit Points</strong> to
      <strong>Charisma</strong>.</p><p>Add <strong>energy resistances</strong>
      and <strong>damage resistance</strong> in the sheet <strong>Details
      tab</strong>.</p><p>Remove the gained <strong>Slam</strong> attack if the
      creature already had one. Edit the <strong>Slam</strong> attack in the
      <strong>Details tab</strong> to be <strong>Magic</strong>.</p>
    value: >-
      <p><strong>Acquired/Inherited Template</strong> Acquired<br
      /><strong>Simple Template</strong> No<br /><strong>Usable with
      Summons</strong> No</p><p>"Vampire" is an acquired template that can be
      added to any living creature with 5 or more Hit Dice (referred to
      hereafter as the base creature). Most vampires were once humanoids, fey,
      or monstrous humanoids. A vampire uses the base creature’s stats and
      abilities except as noted here.</p><p><strong>CR:</strong> Same as the
      base creature + 2.</p><p><strong>AL:</strong> Any
      evil.</p><p><strong>Type:</strong> The creature’s type changes to undead
      (augmented). Do not recalculate class Hit Dice, BAB, or
      saves.</p><p><strong>Senses:</strong> A vampire gains darkvision 60
      ft.</p><p><strong>Armor Class:</strong> Natural armor improves by
      +6.</p><p><strong>Hit Dice:</strong> Change all racial Hit Dice to d8s.
      Class Hit Dice are unaffected. As undead, vampires use their Charisma
      modifier to determine bonus hit points (instead of
      Constitution).</p><p><strong>Defensive Abilities:</strong> A vampire gains
      channel resistance +4, DR 10/magic and silver, and resistance to cold 10
      and electricity 10, in addition to all of the defensive abilities granted
      by the undead type. A vampire also gains fast healing 5. If reduced to 0
      hit points in combat, a vampire assumes gaseous form (see below) and
      attempts to escape. It must reach its coffin home within 2 hours or be
      utterly destroyed. (It can normally travel up to 9 miles in 2 hours.)
      Additional damage dealt to a vampire forced into gaseous form has no
      effect. Once at rest, the vampire is @Condition[helpless;info]. It regains
      1 hit point after 1 hour, then is no longer helpless and resumes healing
      at the rate of 5 hit points per round.</p><p><strong>Weaknesses:</strong>
      Vampires cannot tolerate the strong odor of garlic and will not enter an
      area laced with it. Similarly, they recoil from mirrors or strongly
      presented holy symbols. These things don’t harm the vampire—they merely
      keep it at bay. A recoiling vampire must stay at least 5 feet away from
      the mirror or holy symbol and cannot touch or make melee attacks against
      that creature. Holding a vampire at bay takes a standard action. After 1
      round, a vampire can overcome its revulsion of the object and function
      normally each round it makes a DC 25 Will save.</p><p>Vampires cannot
      enter a private home or dwelling unless invited in by someone with the
      authority to do so.</p><p>Reducing a vampire’s hit points to 0 or lower
      incapacitates it but doesn’t always destroy it (see fast healing).
      However, certain attacks can slay vampires. Exposing any vampire to direct
      sunlight staggers it on the first round of exposure and destroys it
      utterly on the second consecutive round of exposure if it does not escape.
      Each round of immersion in running water inflicts damage on a vampire
      equal to one-third of its maximum hit points—a vampire reduced to 0 hit
      points in this manner is destroyed. Driving a wooden stake through a
      helpless vampire’s heart instantly slays it (this is a full-round action).
      However, it returns to life if the stake is removed, unless the head is
      also severed and anointed with holy water.</p><p><strong>Speed:</strong>
      Same as the base creature. If the base creature has a swim speed, the
      vampire is not unduly harmed by running
      water.</p><p><strong>Melee:</strong> A vampire gains a slam attack if the
      base creature didn’t have one. Damage for the slam depends on the
      vampire’s size (see Natural Attacks). Its slam also causes energy drain
      (see below). Its natural weapons are treated as magic weapons for the
      purpose of overcoming damage reduction.</p><p><strong>Special
      Attacks:</strong> A vampire gains several special attacks. Save DCs are
      equal to 10 + 1/2 vampire’s HD + vampire’s Cha modifier unless otherwise
      noted.</p><ul><li><p>@UUID[Compendium.pf1.template-abilities.Item.JRzJ1KADTQyp5Pwt]</p></li><li><p>@UUID[Compendium.pf1.template-abilities.Item.zrZtiRzEMZjGFAOf]</p></li><li><p>@UUID[Compendium.pf1.template-abilities.Item.qSN6gwPwk1bzZ5kU]</p></li><li><p>@UUID[Compendium.pf1.template-abilities.Item.hhVHkuMmR9qs2sHe]</p></li><li><p>@UUID[Compendium.pf1.template-abilities.Item.L68llMM0tJPeSNlS]</p></li></ul><p><strong>Special
      Qualities:</strong> A vampire gains the
      following.</p><ul><li><p>@UUID[Compendium.pf1.template-abilities.Item.pVrzlP0nPShbuPmR]</p></li><li><p>@UUID[Compendium.pf1.template-abilities.Item.8ORQD37xwCGLwxe0]</p></li><li><p>@UUID[Compendium.pf1.template-abilities.Item.ug9244fDjTiA30ot]</p></li><li><p>@UUID[Compendium.pf1.template-abilities.Item.WrNTjJtIVSNRgnTC]</p></li></ul><p><strong>Ability
      Scores</strong> Str +6, Dex +4, Int +2, Wis +2, Cha +4. As an undead
      creature, a vampire has no Constitution
      score.</p><p><strong>Skills</strong> Vampires gain a +8 racial bonus on
      Bluff, Perception, Sense Motive, and Stealth
      checks.</p><p><strong>Feats</strong> Vampires gain
      @UUID[Compendium.pf1.feats.Item.Q1cY8r0Pvb66pMG0],
      @UUID[Compendium.pf1.feats.Item.h9nHYLxXvIXBTmup],
      @UUID[Compendium.pf1.feats.Item.JreaiTHdyWFNj3Tb],
      @UUID[Compendium.pf1.feats.Item.Uuiu3p982omhMEPj],
      @UUID[Compendium.pf1.feats.Item.0bZf3SDkvVOe2ujH], and
      @UUID[Compendium.pf1.feats.Item.8snLqsJN4LLL00Nq] as bonus feats.</p>
