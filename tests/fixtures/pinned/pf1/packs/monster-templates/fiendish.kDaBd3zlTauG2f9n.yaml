    value: >-
      <p><strong>Acquired/Inherited Template</strong> Acquired<br
      /><strong>Simple Template</strong> Yes<br /><strong>Usable with
      Summons</strong> Yes</p><p>Creatures with the fiendish template live in
      the Lower Planes, such as the Abyss and Hell, but can be summoned using
      spells such as summon monster and planar ally. A fiendish creature’s CR
      increases by +1 only if the base creature has 5 or more HD. A fiendish
      creature’s quick and rebuild rules are the same.</p><p><strong>Rebuild
      Rules:</strong> <strong>Senses</strong> gains darkvision 60 ft.;
      <strong>Defensive Abilities</strong> gains DR and energy resistance as
      noted on the table; <strong>SR</strong> gains SR equal to new CR +5;
      <strong>Special Attacks</strong>
      @UUID[Compendium.pf1.template-abilities.Item.3XEQ0B8GADTxGKKD] 1/day as a
      swift action (adds Cha bonus to attack rolls and damage bonus equal to HD
      against good foes; smite persists until target is dead or the fiendish
      creature rests).</p><p><strong>Fiendish Creature Defenses</strong></p><hr
