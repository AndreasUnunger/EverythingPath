name: Boar Style
system:
  description:
    value: >-
      <p><em>Your sharp teeth and nails rip your foes
      open.</em></p><p><strong>Prerequisites</strong>: Improved Unarmed Strike,
      Intimidate 3 ranks.</p><p><strong>Benefits</strong>: You can deal
      bludgeoning damage or slashing damage with your unarmed strikes--changing
      damage type is a free action. While using this style, once per round when
      you hit a single foe with two or more unarmed strikes, you can tear flesh.
      When you do, you deal 2d6 extra points of damage with the
      attack.</p><h3>Combat Trick</h3><p>While using this style, you can spend 3
      stamina points when you hit a target with only one unarmed strike during a
      round to tear flesh and deal 2d6 points of damage with the attack. You can
      still only tear flesh once per round.</p>
  tags:
    - Combat
    - Style
    - Combat Trick
type: feat
