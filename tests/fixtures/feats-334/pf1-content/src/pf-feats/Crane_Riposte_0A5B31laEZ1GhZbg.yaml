name: Crane Riposte
system:
  description:
    value: >-
      <p><em>You use your defensive abilities to make overpowering
      counterattacks.</em></p><p><strong>Prerequisites</strong>: Crane Style,
      Crane Wing, Dodge, Improved Unarmed Strike, base attack bonus +8 or monk
      level 7th.</p><p><strong>Benefits</strong>: You take only a -1 penalty on
      attack rolls for fighting defensively. Whenever you deflect an opponent's
      attack using Crane Wing or lose the dodge bonus from Crane Wing because an
      attack missed you by 4 or less, you can make an attack of opportunity
      against the attacker after the attack misses.</p><p><strong>Combat
      Trick</strong>: At the start of a turn when you are fighting defensively,
      you can spend 2 stamina points to take no penalty on your attack rolls
      from fighting defensively. This lasts until the start of your turn.</p>
  tags:
    - Combat
type: feat
