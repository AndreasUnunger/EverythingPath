name: Pungent Stench
system:
  description:
    value: >-
      <p><em>Your stench is overwhelmingly
      nauseating.</em></p><p><strong>Prerequisites</strong>: Stench universal
      monster ability, Improved Stench, Great
      Fortitude</p><p><strong>Benefits</strong>: The first round a creature is
      affected by your stench, it is nauseated in addition to being sickened. At
      the end of an affected creature's turn after the first round, it can make
      a new save against the stench's DC to remove the nauseated condition, but
      the sickened condition lasts as long as normal.</p>
  tags:
    - General
type: feat
