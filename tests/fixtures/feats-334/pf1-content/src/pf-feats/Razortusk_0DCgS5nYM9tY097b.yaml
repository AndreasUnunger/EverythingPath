name: Razortusk
system:
  description:
    value: >-
      <p><em>Your powerful jaws and steely teeth are deadly enough to give you a
      bite attack.</em></p><p><strong>Prerequisites</strong>:
      Half-orc.</p><p><strong>Benefits</strong>: You can make a bite attack for
      1d4 points of damage, plus your Strength modifier. You're considered
      proficient in this attack and can apply feats or effects appropriate to
      natural attacks to it. If used as part of a full attack action, the bite
      is considered a secondary attack and is made at your full base attack
      bonus -5, and adds half your Strength modifier to damage.</p>
  tags:
    - Racial
    - Half-Orc
type: feat
