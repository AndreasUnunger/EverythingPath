name: Missile Shield (Mythic)
system:
  description:
    value: >-
      <p><em>Your remarkable awareness allows you to deflect multiple ranged
      attacks and even ray spells.</em></p><p><strong>Prerequisites</strong>:
      Missile Shield.</p><p><strong>Benefits</strong>: When using Missile
      Shield, you can deflect an additional number of ranged attacks per round
      equal to half your tier. You can expend one use of mythic power as an
      immediate action to deflect a single ray from a ray spell or effect
      targeting you.</p>
