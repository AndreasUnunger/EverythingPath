name: Improved Toxicological Timing
system:
  description:
    value: >-
      <p><em>You know how to adjust the amount of time required for a poison to
      take effect.</em></p><p><strong>Prerequisites</strong>: Craft (alchemy) 11
      ranks, Toxicological Timing.</p><p><strong>Benefits</strong>: Whenever you
      craft a poison with the Craft (alchemy) skill, you can add or subtract up
      to 1 day from its onset time (to a minimum onset period of 1 round).</p>
  tags:
    - General
type: feat
