    value: >-
      <p><em>You know the secrets of creating especially vicious
      poisons.</em></p><p><strong>Prerequisites</strong>: Craft (alchemy) 1
      rank.</p><p><strong>Benefits</strong>: The save DC of any poison you craft
      with Craft (alchemy) and any spells you cast with the poison descriptor
      (Pathfinder RPG Ultimate Magic 138) increases by 1. This bonus doesn't
      stack with the bonus granted by Spell Focus.</p>
