name: Dreadful Carnage (Mythic)
system:
  description:
    value: >-
      <p><em>Your kills are truly frightening to
      behold.</em></p><p><strong>Prerequisites</strong>: Dreadful
      Carnage.</p><p><strong>Benefits</strong>: When you use Dreadful Carnage,
      you affect non-mythic enemies within 60 feet in addition to all enemies
      within 30 feet. You can expend one use of mythic power before making the
      Intimidate check to cause enemies demoralized by Dreadful Carnage to
      become frightened instead of shaken, for the same duration as the normal
      shaken effect. While frightened by this ability, an enemy takes a penalty
      equal to your tier on attack rolls, saving throws, skill checks, and
      ability checks.</p>
  tags:
    - Combat
    - Mythic
type: feat
