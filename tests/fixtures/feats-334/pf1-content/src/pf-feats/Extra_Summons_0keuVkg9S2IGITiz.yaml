name: Extra Summons
system:
  description:
    value: >-
      <p><em>You can summon monsters more often each
      day.</em></p><p><strong>Prerequisites</strong>: Ability to cast summon
      monster as a spell-like ability, summoner
      1st.</p><p><strong>Benefits</strong>: You gain 1 additional use of your
      summon monster spell-like ability per day.</p><p><strong>Special</strong>:
      You can take this feat multiple times, but it can only be taken once for
      every five summoner levels you possess.</p>
