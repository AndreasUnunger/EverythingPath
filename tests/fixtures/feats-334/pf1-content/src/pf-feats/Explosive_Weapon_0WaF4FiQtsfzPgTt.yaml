name: Explosive Weapon
system:
  description:
    value: >-
      <p><em>You can channel magical power through your weapon to devastating
      effect.</em></p><p><strong>Prerequisites</strong>: Arcing Weapon, diverse
      training class feature.</p><p><strong>Benefits</strong>: As a standard
      action, you can cast a spell with an area of effect and a duration of
      instantaneous, such as fireball, and release it through your melee weapon
      as part of a melee attack. This functions as the magus spellstrike
      ability, except the spell damage does not multiply on a critical hit, the
      spell effect is centered on you, and you are excluded from its
      effects.</p>
  tags:
    - Combat
type: feat
