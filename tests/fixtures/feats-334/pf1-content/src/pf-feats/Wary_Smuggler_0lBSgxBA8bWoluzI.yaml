name: Wary Smuggler
system:
  description:
    value: >-
      <p><em>You are skilled at trading without the government's
      approval.</em></p><p><strong>Prerequisites</strong>: Perception 5 ranks,
      Sleight of Hand 5 ranks, Stealth 5 ranks.</p><p><strong>Benefits</strong>:
      You gain a +5 bonus on Sleight of Hand checks to conceal small, non-weapon
      objects on your body, or on a single animal or vehicle with which you are
      traveling. While in urban areas, you can always take 10 on Perception
      checks, Sleight of Hand checks, and Stealth checks.</p>
  tags:
    - General
type: feat
