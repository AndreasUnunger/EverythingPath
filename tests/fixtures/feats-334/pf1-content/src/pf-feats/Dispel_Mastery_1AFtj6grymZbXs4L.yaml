name: Dispel Mastery
system:
  description:
    value: >-
      <p><em>You can dispel magic with abjuration magic
      items.</em></p><p><strong>Prerequisites</strong>: Use Magic Device 3
      ranks, base Fortitude save bonus +6.</p><p><strong>Benefits</strong>: You
      can cause an item that has an abjuration spell of 2nd level or higher in
      its construction requirements to cast dispel magic, but only to perform a
      targeted dispel. You can use this feat once per day, plus an additional
      time per day at base Fortitude save bonus +9 and +12.</p><p><br
      /><strong>Pathfinder Society<br /></strong>When qualifying for and
      calculating the benefits of an item mastery feat, a PC uses the base
      Fortitude save bonus from only one of his classes.</p>
  tags:
    - Item Mastery
type: feat
