name: Finishing Cascade
system:
  description:
    value: >-
      <p><em>Your blows set up your opponents for a devastating
      finish.</em></p><p><strong>Prerequisites</strong>: Base attack bonus +11
      or monk level 11th; at least one combination
      feat.</p><p><strong>Benefits</strong>: The first time in a round you use a
      combination feat to apply a reduction or penalty to yourself or an enemy,
      you can double the feat's numerical modifier. For example, you can double
      the reduction granted by Combat Rhythm to -2. This does not double any
      other effects of combination feats, such as damage.</p>
  tags:
    - Combat
    - Combination
type: feat
