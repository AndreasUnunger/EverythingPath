name: Dragonflight Flight
system:
  description:
    value: >-
      <p><em>You can fly short distances through the
      air.</em></p><p><strong>Prerequisites</strong>: Dex 15, Wis 15, Dragonfly
      Style, Dragonfly Wings, Improved Unarmed Strike, Acrobatics 10 ranks,
      Climb 10 ranks.</p><p><strong>Benefits</strong>: While using Dragonfly
      Style, you can attempt an Acrobatics check to high jump as a move action,
      and then immediately glide as the spell for 1 round. If you have not used
      your standard action after using Dragonfly Flight to make a high jump and
      start gliding, you can charge while gliding. This charge follows the rules
      for charging when you are only able to take a standard action.</p>
  tags:
    - Combat
type: feat
