name: Fearsome Barricade
system:
  description:
    value: >-
      <p><em>Your wrath is as potent a barrier as your
      blades.</em></p><p><strong>Prerequisites</strong>: Intimidate 5 ranks,
      Ulfen Guard TPA 20.</p><p><strong>Benefits</strong>: Choose an adjacent
      ally as a free action on your turn. Once per round, when an opponent
      attacks that ally, you may make an Intimidate check to demoralize the
      opponent as an immediate action. This action counts as an attack of
      opportunity.</p>
  tags:
    - Combat
    - Faction
type: feat
