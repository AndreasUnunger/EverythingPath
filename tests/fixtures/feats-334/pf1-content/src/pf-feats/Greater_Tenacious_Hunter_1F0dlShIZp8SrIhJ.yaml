name: Greater Tenacious Hunter
system:
  description:
    value: >-
      <p><em>The animal is capable of savaging hidden foes when they least
      expect it.</em></p><p><strong>Prerequisites</strong>: Combat Reflexes,
      Tenacious Hunter, Perception 3 ranks, Stealth 3 ranks, animal
      companion.</p><p><strong>Benefits</strong>: The animal companion can
      attempt a Perception check as a swift action to intentionally search for a
      stimulus. When using Perception to attempt to pinpoint an invisible foe,
      the animal companion's bonus from the Tenacious Hunter feat increases to
      +20. In addition, whenever the animal companion successfully uses
      Perception to oppose a Stealth check or to pinpoint an invisible
      creature's location, that foe is denied its Dexterity bonus to AC against
      all attacks that the animal companion makes before the start of the animal
      companion's next turn.</p><p><strong>Normal</strong>: Using Perception to
      intentionally search for a stimulus is a move action.</p>
  tags:
    - General
type: feat
