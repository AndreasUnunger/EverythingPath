name: Witch Knife
system:
  description:
    value: >-
      <p><em>You empower your witch spells by incorporating the use of a special
      ceremonial knife during your
      castings.</em></p><p><strong>Prerequisites</strong>: Witch
      class.</p><p><strong>Benefits</strong>: Each day, when you prepare your
      spells, you can select a masterwork or magical dagger, transforming it
      into a witch knife, which serves as an additional focus component for
      witch patron spells. Add +1 to the DC of all your patron spells.</p>
  tags:
    - General
type: feat
