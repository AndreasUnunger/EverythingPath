name: Taldan Duelist
system:
  description:
    value: >-
      <p><em>You trained at one of Taldors elite fighting schools and are
      skilled at rondelero, the art of fighting with the falcata and
      buckler.</em></p><p><strong>Prerequisites</strong>: Dex 13, Exotic Weapon
      Proficiency (falcata), Shield Proficiency (buckler), Weapon Focus
      (falcata).</p><p><strong>Benefits</strong>: When fighting with the falcata
      and buckler, your shield bonus to AC increases by +1 and you gain a +2
      bonus on Acrobatics checks.</p><h3>Combat Trick</h3><p>: When you make an
      attack with a falcata using two hands while wearing a buckler, you can
      spend 3 stamina points to ignore the -1 penalty on attack rolls for using
      your shield arm to wield a weapon while wearing a buckler and to retain
      the buckler's shield bonus for 1 round.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
