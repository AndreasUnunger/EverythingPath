name: Greater Hunter's Bond
system:
  description:
    value: >-
      <p><em>Your allies can target additional
      foes.</em></p><p><strong>Prerequisites</strong>: Improved Hunter's Bond,
      hunter's bond (hunting companions) class feature, ranger level
      12th.</p><p><strong>Benefits</strong>: When you activate hunter's bond,
      you can select a number of targets equal to your Wisdom modifier as long
      as they all count as your favored enemy.</p><p><strong>Normal</strong>:
      You select one target against which your allies receive your favored enemy
      bonus.</p>
  tags:
    - Combat
type: feat
