name: Life's Blood
system:
  description:
    value: >-
      <p><em>Your blood flows with eternal life, and its healing powers allow
      you use your blood to heal
      others.</em></p><p><strong>Prerequisites</strong>:
      Samsaran.</p><p><strong>Benefits</strong>: At will as a full-round action,
      you may perform a special bloodletting ritual through which you sacrifice
      some of your own vitality to heal another creature. When using this feat,
      you take 1d4 points of damage and apply your blood to the wounds of a
      living creature, healing it for a number of hit points equal to the amount
      of damage you took from the ritual. This is a supernatural ability. Only
      you can perform this bloodletting. A creature cannot be healed by this
      ability more than once per day.</p>
  tags:
    - General
type: feat
