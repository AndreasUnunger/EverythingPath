name: Shared Soul
system:
  description:
    value: >-
      <p><em>You and your phantom are deeply connected in heart, mind, and
      soul.</em></p><p><strong>Prerequisites</strong>: Shared consciousness
      class feature.</p><p><strong>Benefits</strong>: While your phantom is
      confined within your consciousness, you gain a +2 bonus on saving throws
      against death effects, energy drain, and possession. In addition, once per
      day when you fail a saving throw against a death effect or possession
      effect or gain a negative level, as an immediate action you can shunt that
      effect into the phantom's section of your soul instead. When you do so,
      you are not affected by that effect, but you also don't gain any of the
      normal benefits of your shared consciousness ability and can't manifest
      your phantom in any way for the normal duration of the spell or effect
      shunted into the phantom's consciousness. The phantom suffers the full
      effect you transferred, and as long as your phantom continues to suffer
      from the effect, you cannot shunt a death or possession effect or negative
      level onto your phantom.</p>
  tags:
    - General
type: feat
