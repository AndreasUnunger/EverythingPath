name: Glorious Heat
system:
  description:
    value: >-
      <p><em>When you cast divine fire spells, their heat empowers nearby
      allies.</em></p><p><strong>Prerequisites</strong>: Ability to cast divine
      spells, caster level 5th, worshiper of
      Sarenrae.</p><p><strong>Benefits</strong>: Whenever you cast a divine
      spell with the fire descriptor, choose a single ally within 30 feet that
      you can see. That ally heals a number of hit points equal to half your
      level and gains a +1 morale bonus on attack rolls until the end of its
      next turn.</p><p><strong>Pathfinder Society<br /></strong>Glorious Heat
      grants a number of points of healing equal to the spell level, not the
      caster level (ie. flame strike grants 5 points, while spark grants 0)</p>
  tags:
    - General
type: feat
