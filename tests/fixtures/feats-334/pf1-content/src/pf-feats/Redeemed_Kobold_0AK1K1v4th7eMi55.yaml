name: Redeemed Kobold
system:
  description:
    value: >-
      <p><em>The purity you have found in the teachings of good dragonkind
      colors your scales and grants you
      confidence.</em></p><p><strong>Prerequisites</strong>: Good alignment,
      kobold.</p><p><strong>Benefits</strong>: Your scales take on a metallic
      sheen appropriate for that of a good-aligned metallic dragon who shares
      any existing energy affinity you possess, or whom you have chosen to
      emulate. You gain a +2 circumstance bonus on Diplomacy checks when
      interacting with good creatures. In addition, your Charisma is considered
      2 points higher for the purposes of channeling positive energy.</p>
  tags:
    - Racial
    - Kobold
type: feat
