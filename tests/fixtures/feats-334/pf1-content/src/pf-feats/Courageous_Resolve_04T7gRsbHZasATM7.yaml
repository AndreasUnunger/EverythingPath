name: Courageous Resolve
system:
  description:
    value: >-
      <p><em>Even when others run, you tend to stand your
      ground.</em></p><p><strong>Prerequisites</strong>: Craven racial trait or
      fearless racial trait, halfling.</p><p><strong>Benefits</strong>: If you
      have the fearless racial trait, your racial bonus on saving throws against
      fear effects increases to +4. If you have the craven racial trait, you
      still take the -2 penalty on fear saves, but you can gain the benefit of
      morale bonuses on saving throws against fear effects.</p>
  tags:
    - Racial
    - Halfling
type: feat
