name: Overhead Flip
system:
  description:
    value: >-
      <p><em>You hoist your opponent above your head before slamming him to the
      ground, temporarily staggering the
      foe.</em></p><p><strong>Prerequisites</strong>: Str 13, Improved Grapple,
      Improved Unarmed Strike, Savage Slam, base attack bonus +9 or monk level
      6th.</p><p><strong>Benefits</strong>: While you are using Savage Slam, if
      you succeed at your grapple combat maneuver check to knock your opponent
      prone, the opponent must succeed at a Fortitude save (DC = 10 + your base
      attack bonus) or be staggered for 1 round. Oozes, incorporeal creatures,
      and creatures that are immune to critical hits are immune to this
      effect.</p>
  tags:
    - Combat
type: feat
