name: Spawnlink
system:
  description:
    value: >-
      <p><em>You can see through the eyes of your spawned
      minions.</em></p><p><strong>Prerequisites</strong>: Int 13, create spawn
      monster ability.</p><p><strong>Benefits</strong>: As a full-round action,
      you can create a link with one of your spawn that you control on the same
      plane. When you do so, your spawn's eyes glow bright red. When linked in
      this way, you can see through your spawn's eyes with either the spawn's
      vision or yours, whichever is more beneficial. While looking through your
      spawn's eyes, your body is blinded. You can also speak though your spawn
      (if it can speak), using your own voice. You can maintain this link each
      round as a standard action as if concentrating to maintain a 3rd-level
      spell. If your spawn is reduced to 0 or fewer hit points while you use
      this ability, you become blinded and dazed for 1d6 rounds with no saving
      throw.</p>
  tags:
    - Monster
type: feat
