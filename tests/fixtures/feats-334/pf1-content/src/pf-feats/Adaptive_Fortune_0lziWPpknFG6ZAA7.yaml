name: Adaptive Fortune
system:
  description:
    value: >-
      <p><em>Your luck takes on almost legendary
      proportions.</em></p><p><strong>Prerequisites</strong>: Fortunate One,
      adaptable luck racial trait, character level 10th,
      halfling.</p><p><strong>Benefits</strong>: Increase the number of times
      per day you can use the adaptable luck racial trait by 1. Furthermore,
      when you use adaptable luck, increase the luck bonus for each type of use
      by 2.</p>
