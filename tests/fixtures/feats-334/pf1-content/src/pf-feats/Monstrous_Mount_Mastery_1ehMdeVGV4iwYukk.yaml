name: Monstrous Mount Mastery
system:
  description:
    value: >-
      <p><em>Your monstrous mount has developed an ability that only its wild
      kin would normally possess.</em></p><p><strong>Prerequisites</strong>:
      Monstrous Mount, character level equal to or higher than that listed in
      your mount's Mastery entry.</p><p><strong>Benefits</strong>: Your
      monstrous mount gains the abilities and bonuses listed under Mastery in
      its stat block. You must be of at least the indicated level for the mount
      to use these abilities, so if you dismiss a mount and gain a new mount of
      a different type, you retain the feat but might not yet be of sufficient
      level for the new mount to gain its Mastery
      benefits.</p><p><strong>Normal</strong>: A monstrous mount is unable to
      use its Mastery abilities regardless of its advancement.</p>
  tags:
    - General
type: feat
