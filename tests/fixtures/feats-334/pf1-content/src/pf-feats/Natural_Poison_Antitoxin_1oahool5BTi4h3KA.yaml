name: Natural Poison Antitoxin
system:
  description:
    value: >-
      <p><em>You have learned how to create antitoxin that can resist natural
      poisons.</em></p><p><strong>Prerequisites</strong>: Natural Poison
      Harvester, Craft (alchemy) 8 ranks, Survival 8
      ranks.</p><p><strong>Benefits</strong>: When you succeed at a Craft
      (alchemy) check to create an antitoxin using a dose of a natural poison
      you harvested, you increase the duration of the antitoxin to an amount
      equal to 4 hours plus an additional hour for every 5 by which your result
      exceeds the DC.</p>
  tags:
    - General
type: feat
