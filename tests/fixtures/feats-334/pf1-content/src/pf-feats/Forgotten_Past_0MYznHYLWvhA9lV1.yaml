name: Forgotten Past
system:
  description:
    value: >-
      <p><em>A pivotal event from your past eludes your
      memory.</em></p><p><strong>Prerequisites</strong>: You must have suffered
      permanent memory loss or have the Reincarnated
      background.</p><p><strong>Benefits</strong>: The duration of
      mind-affecting spells (even beneficial ones) is halved for you, to a
      minimum of 1 round. Your inquisitive nature gives you a +2 bonus on
      Perception checks. If you have 10 or more ranks in Perception, this bonus
      increases to +4.</p><p><strong>Goal</strong>: Regain a major portion of
      your lost memories. The exact means varies, possibly requiring a wish,
      assistance from a divine being, reliving a past life, or confronting the
      situation that led to your memory loss. This process must involve
      encountering a challenging foe, though possibly in ways other than direct
      confrontation.</p><p><strong>Completion Benefit</strong>: You roll twice
      whenever you attempt a saving throw against a mind-affecting effect,
      keeping the better result.</p>
  tags:
    - Story
type: feat
