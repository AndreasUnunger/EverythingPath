name: Draconic Magic
system:
  description:
    value: >-
      <p><em>Your draconic aspect manifests as magical
      might.</em></p><p><strong>Prerequisites</strong>: Draconic Aspect,
      kobold.</p><p><strong>Benefits</strong>: You gain a group of spell-like
      abilities based on the color of your dragon aspect. Each spell-like
      ability can be used once per day, and the DC of any of these spelllike
      abilities is 10 + 1/2 your Hit Dice + Charisma modifier.</p><hr
      /><p><strong>Black</strong>: Corrosive touch*,
      darkness.</p><p><strong>Blue</strong>: Minor image, shocking
      grasp*.</p><p><strong>Green</strong>: Entangle*, gust of
      wind.</p><p><strong>Red</strong>: Burning hands*,
      pyrotechnics.</p><p><strong>White</strong>: Burning hands* (deals cold
      damage instead of fire), fog cloud.</p><hr /><p><strong>Special</strong>:
      You can use this feat instead of Draconic Breath or Draconic Glide to
      qualify for the Draconic Paragon feat. If you have this feat and Draconic
      Paragon, you can use the spell-like ability marked with a * twice per
      day.</p>
  tags:
    - Racial
    - Kobold
type: feat
