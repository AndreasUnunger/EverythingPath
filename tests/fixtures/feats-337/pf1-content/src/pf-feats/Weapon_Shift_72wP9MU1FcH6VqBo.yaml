name: Weapon Shift
system:
  description:
    value: >-
      <p><em>Your melee weapons meld into your animal
      form.</em></p><p><strong>Prerequisites</strong>: Wild shape class
      feature.</p><p><strong>Benefits</strong>: When you use your wild shape
      ability, any melee weapons you are wielding and proficient with meld into
      your new form. Select one of these weapons; while in your new form, your
      natural attacks deal the same damage type as that weapon. Your natural
      attacks also gain all of the weapon's properties (such as disarm), other
      than the double weapon property and the fragile weapon property; moreover,
      when using this feat to grant the trip property to your natural attacks,
      you gain a +2 bonus on combat maneuver checks to trip an enemy, but you
      cannot drop your weapon to avoid being tripped due to a failed trip
      attempt. Weapon Shift does not apply a magic weapon's enhancement bonus to
      your natural attacks, nor does it grant your natural attacks any of a
      weapon's magical special abilities.</p>
  tags:
    - General
type: feat
