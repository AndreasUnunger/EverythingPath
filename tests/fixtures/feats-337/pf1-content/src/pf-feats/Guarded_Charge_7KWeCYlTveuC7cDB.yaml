name: Guarded Charge
system:
  description:
    value: >-
      <p><em>Your raised shield protects you as you charge
      forward.</em></p><p><strong>Prerequisites</strong>: Shield Focus, base
      attack bonus +6 or fighter level 4th.</p><p><strong>Benefits</strong>:
      When performing a bull rush or overrun combat maneuver as part of a
      charge, you don't provoke an attack of opportunity for that maneuver. If
      you already have the improved Bull Rush or Improved Overrun feats, you
      gain an additional +2 bonus on your combat maneuver check when attempting
      the respective maneuver.</p><p><strong>Special</strong>: This feat counts
      as having a Strength score of 13 and Power Attack for the purposes of
      meeting the prerequisites of Improved Bull Rush and Improved Overrun, and
      for feats that require either of those two feats as prerequisites.</p>
  tags:
    - Combat
    - Shield Mastery
type: feat
