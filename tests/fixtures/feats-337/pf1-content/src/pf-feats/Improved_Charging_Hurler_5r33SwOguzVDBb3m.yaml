name: Improved Charging Hurler
system:
  description:
    value: >-
      <p><em>Every muscle in your body adds its force to your thrown
      weapons.</em></p><p><strong>Prerequisites</strong>: Charging Hurler,
      Point-Blank Shot.</p><p><strong>Benefits</strong>: When you use Charging
      Hurler, your target can be at any range up to your weapon's maximum range.
      If your target is within 30 feet, you gain a +2 bonus on damage
      rolls.</p><p><strong>Normal</strong>: Using Charging Hurler requires you
      to end your movement within 30 feet of your opponent.</p><p><strong>Combat
      Trick</strong>: When using Charging Hurler against a target within 30
      feet, you can spend up to 2 stamina points. When you do, the bonus on your
      damage roll for that attack increases by double the number of stamina
      points you spent.</p>
  tags:
    - Combat
type: feat
