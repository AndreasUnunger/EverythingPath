name: Share Spells
system:
  description:
    value: >-
      <p><em>You can share individual magic with your
      partner.</em></p><p><strong>Prerequisites</strong>: Bonded Mind, ability
      to share spells with an animal companion, eidolon, familiar, or phantom,
      caster level 1st.</p><p><strong>Benefits</strong>: You can cast a spell
      with a target of 'you' on an ally as a touch spell, as per the share
      spells familiar ability, so long as the ally possesses the Bonded Mind
      feat.</p><p><strong>Pathfinder Society<br /></strong>A PC cannot benefit
      from the feat Bonded Mind or any teamwork feats that use it as a
      prerequisite unless he permanently possesses the feat; this is an
      exception to how an inquisitor's solo tactics ability, a cavalier's
      tactician ability, and similar abilities function.</p>
  tags:
    - Teamwork
type: feat
