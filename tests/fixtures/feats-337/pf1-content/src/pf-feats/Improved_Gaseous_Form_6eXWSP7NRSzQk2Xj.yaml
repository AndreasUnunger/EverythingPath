name: Improved Gaseous Form
system:
  description:
    value: >-
      <p><em>Your gaseous state is more potent than that of your
      peers.</em></p><p><strong>Prerequisites</strong>:
      Vampire.</p><p><strong>Benefits</strong>: As a standard action, you can
      assume gaseous form at will (caster level 5th), but can remain gaseous
      indefinitely and have a fly speed of 20 feet with perfect maneuverability.
      This is a supernatural ability.</p><p><strong>Special</strong>: You can
      gain this feat multiple times. Each time you take this feat, choose
      another swarm type.</p>
  tags:
    - Monster
    - Vampire
type: feat
