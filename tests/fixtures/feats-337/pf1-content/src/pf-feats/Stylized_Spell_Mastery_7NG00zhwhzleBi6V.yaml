name: Stylized Spell Mastery
system:
  description:
    value: >-
      <p><em>You have altered your understanding of a select number of
      spells</em></p><p><strong>Prerequisites</strong>: Spell Mastery, Stylized
      Spell, Bluff 5 ranks, Spellcraft 5 ranks.</p><p><strong>Benefits</strong>:
      You do not modify the spell slot used when applying the Stylized Spell
      metamagic feat to any spell you have mastered with Spell
      Mastery.</p><p><strong>Normal</strong>: A stylized spell uses up a spell
      slot 1 higher than the spell's actual level.</p>
