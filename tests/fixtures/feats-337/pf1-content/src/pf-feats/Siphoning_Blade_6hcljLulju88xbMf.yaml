name: Siphoning Blade
system:
  description:
    value: >-
      <p><em>You can empower yourself by drawing blood through your rhoka
      sword.</em></p><p><strong>Prerequisites</strong>: Voracious Blade, Weapon
      Focus (rhoka sword), base attack bonus +8,
      urdefhan.</p><p><strong>Benefits</strong>: When you use the Voracious
      Blade feat to deal Strength damage with your rhoka sword, you also drain
      the victim's blood. The attack deals 1 point of bleed damage in addition
      to its normal damage, and you gain fast healing 2 for 3 rounds. You can
      use this ability only once against an individual creature in a 24-hour
      period.</p>
  tags:
    - Combat
type: feat
