name: Nameless Servitor
system:
  description:
    value: >-
      <p><em>The fact that you have given up your real name makes you resistant
      to certain types of magic.</em></p><p><strong>Prerequisites</strong>:
      Risen Guard rank, Risen Guard 10 TPA.</p><p><strong>Benefits</strong>:
      Anyone who attempts to use magic in order to learn personal information
      about you, such as through divination, scrying, or similar magic, must
      make a caster level check with a DC equal to 10 plus your level to
      succeed. You are immune to spells that require the use of your name in
      order to function (such as trap the soul).</p><p>Most members of the Risen
      Guard with this feat are addressed by their rank.</p>
  tags:
    - Faction
type: feat
