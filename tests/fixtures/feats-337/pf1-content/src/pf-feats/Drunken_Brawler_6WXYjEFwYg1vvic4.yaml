name: Drunken Brawler
system:
  description:
    value: >-
      <p><em>You have learned how to fight effectively while
      drunk.</em></p><p><strong>Prerequisites</strong>: Endurance, worshiper of
      Cayden Cailean.</p><p><strong>Benefits</strong>: When you drink a tankard
      of ale or strong alcohol, you take a -2 penalty on Reflex saving throws,
      but gain a number of temporary hit points equal to your character level,
      and gain a +2 alchemical bonus on Fortitude and Will saving throws. These
      bonuses last 1 hour or until the temporary hit points gained by this
      effect are lost, whichever occurs first. Regardless, the penalty lasts for
      a full hour.</p>
  tags:
    - Combat
type: feat
