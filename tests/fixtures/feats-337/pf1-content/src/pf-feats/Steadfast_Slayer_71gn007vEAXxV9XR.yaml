name: Steadfast Slayer
system:
  description:
    value: >-
      <p><em>Like the dragonslayers and giantslayers of legend, you stand alone
      against creatures far larger than
      you.</em></p><p><strong>Benefits</strong>: If you are the only character
      threatening an opponent and you successfully attack the opponent with a
      two-handed melee weapon, for each size category larger than you that
      opponent is, you gain a +2 bonus on your melee damage roll.</p>
  tags:
    - Combat
type: feat
