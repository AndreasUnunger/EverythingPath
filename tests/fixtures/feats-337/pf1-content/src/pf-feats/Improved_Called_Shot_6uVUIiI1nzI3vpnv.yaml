name: Improved Called Shot
system:
  description:
    value: >-
      <p><em>You are skilled at landing blows right where you want
      to.</em></p><p><strong>Prerequisites</strong>: Int 13, Combat
      Expertise.</p><p><strong>Benefits</strong>: You receive a +2 bonus on
      attack rolls when making a called shot. When taking a full-round or
      standard action that gives you multiple attacks, you can replace a single
      attack with a called shot. You may only attempt one called shot per
      round.</p>
  tags:
    - Called Shot
type: feat
