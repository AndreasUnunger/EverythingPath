name: Claw Pounce
system:
  description:
    value: >-
      <p><em>You can charge and make an attack with your
      paws.</em></p><p><strong>Prerequisites</strong>: Str 13, Dex 15, Nimble
      Striker, base attack bonus +10, catfolk, cat's claws racial trait or
      Aspect of the Beast (claws of the beast
      manifestation).</p><p><strong>Benefits</strong>: When you make a charge,
      you can make a full attack with your claws.</p><p><strong>Normal</strong>:
      Charging is a special full-round action that limits you to a single
      attack.</p><h3>Combat Trick</h3><p>When you charge, you can spend 5
      stamina points to make a second attack with one of your claws.</p>
  tags:
    - Combat
    - Racial
    - Catfolk
    - Combat Trick
type: feat
