name: Coordinated Blast
system:
  description:
    value: >-
      <p><em>With trained precision, you create safe pockets within the areas of
      your spells, inside which your allies remain
      safe.</em></p><p><strong>Prerequisites</strong>: Spellcraft 5 ranks, any
      racial spell-like ability.</p><p><strong>Benefits</strong>: Whenever you
      use a spell or ability with an area (such as fireball or channel energy),
      you can exclude any number of allies who also have this feat from that
      area of effect.</p>
  tags:
    - Teamwork
type: feat
