name: Cooperative Rend
system:
  description:
    value: >-
      <p><em>You and an ally each sink a claw into your foe--then all you have
      to do is pull.</em></p><p><strong>Prerequisites</strong>: Rend,
      troll.</p><p><strong>Benefits</strong>: Whenever you and an ally who has
      this feat are both threatening the same creature, you must hit the target
      with at least one of your claw attacks to use your rend
      ability.</p><p><strong>Normal</strong>: You must hit with two of your claw
      attacks to use your rend ability.</p>
  tags:
    - Combat
    - Teamwork
    - Monster
    - Troll
type: feat
