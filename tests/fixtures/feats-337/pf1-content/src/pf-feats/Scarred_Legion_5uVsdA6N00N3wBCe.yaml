name: Scarred Legion
system:
  description:
    value: >-
      <p><em>Your ritual scars make you more fearsome, and allies with similar
      scars grow bolder when they're near
      you.</em></p><p><strong>Benefits</strong>: You gain a +2 bonus on
      Intimidate checks. You also gain a +2 morale bonus on Will saving throws
      while adjacent to an ally with this feat. When you charge, if you started
      the charge adjacent to an ally with this feat, you retain the bonus on
      Will saves until the start of your next turn.</p>
  tags:
    - Teamwork
type: feat
