name: Clustered Shots
system:
  contextNotes:
    - target: attack
      text: >-
        Total the damage from all ranged hits to the same enemy before applying
        that opponent's damage reduction.
  description:
    value: >-
      <p><em>You take a moment to carefully aim your shots, causing them all to
      strike nearly the same spot.</em></p><p><strong>Prerequisites</strong>:
      Point-Blank Shot, Precise Shot, base attack bonus
      +6.</p><p><strong>Benefits</strong>: When you use a full-attack action to
      make multiple ranged weapon attacks against the same opponent, total the
      damage from all hits before applying that opponent's damage
      reduction.</p><p><strong>Special</strong>: If the massive damage optional
      rule is being used (Core Rulebook 189), that rule applies if the total
      damage you deal with this feat is equal to or exceeds half the opponent's
      full normal hit points (minimum 50 points of damage).</p><p><strong>Combat
      Trick</strong>: When using this feat, you can spend up to 2 stamina points
      for each attack that hit the same target. Increase the damage pooled by
      this feat by an amount equal to the number of stamina points you
      spent.</p>
  tags:
    - Combat
type: feat
