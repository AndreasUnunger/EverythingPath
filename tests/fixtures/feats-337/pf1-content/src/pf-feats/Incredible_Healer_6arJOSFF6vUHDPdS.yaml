name: Incredible Healer
system:
  description:
    value: >-
      <p><em>You are able to treat deadly wounds with an almost supernatural
      skill.</em></p><p><strong>Prerequisites</strong>: Heal 5
      ranks.</p><p><strong>Benefits</strong>: When you use the Heal skill to
      treat deadly wounds, the target heals a number of hit points equal to
      either the result of your Heal check or the normal amount, whichever is
      higher. A creature can still benefit from having deadly wounds treated no
      more than once per day.</p>
  tags:
    - General
type: feat
