name: Greater Cloud Invocation
system:
  description:
    value: >-
      <p><em>Your devotion to the cloud dragons of your kingdom causes your
      connection with them to
      strengthen.</em></p><p><strong>Prerequisites</strong>: Cloud Invocation,
      Mbe'ke dwarf.</p><p><strong>Benefits</strong>: The duration of your Cloud
      Invocation increases to 1 minute per level, and you can dismiss it as an
      immediate action. You can create mist with your Cloud Invocation ability
      multiple times per day, so long as you do not exceed a total duration of 1
      minute per level, and you expend the duration of your Cloud Invocation in
      1-minute increments. If you create a mist cloud while any previous mist is
      still present, the previous mist ends. Additionally, you can have the mist
      remain centered on you, rather than stationary.</p>
  tags:
    - Racial
    - Dwarf
type: feat
