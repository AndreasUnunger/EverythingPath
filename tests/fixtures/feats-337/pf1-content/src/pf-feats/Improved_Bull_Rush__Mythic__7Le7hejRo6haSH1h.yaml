name: Improved Bull Rush (Mythic)
system:
  description:
    value: >-
      <p><em>You push foes around with amazing
      ease.</em></p><p><strong>Prerequisites</strong>: Improved Bull
      Rush.</p><p><strong>Benefits</strong>: You gain a bonus equal to half your
      tier on checks to bull rush, and to your CMD when an opponent bull rushes
      you. These bonuses stack with those granted by non-mythic Improved Bull
      Rush.</p><p>Furthermore, you can make an attack of opportunity against any
      creature that attempts to bull rush you, unless it also has this feat.</p>
  tags:
    - Combat
    - Mythic
type: feat
