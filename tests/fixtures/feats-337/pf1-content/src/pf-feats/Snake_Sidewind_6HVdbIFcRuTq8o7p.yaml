name: Snake Sidewind
system:
  description:
    value: >-
      <p><em>Your sensitive twisting movements make you difficult to anticipate
      combat.</em></p><p><strong>Prerequisites</strong>: Improved Unarmed
      Strike, Snake Style, Acrobatics 3 ranks, Sense Motive 6
      ranks.</p><p><strong>Benefits</strong>: You gain a +4 bonus to CMD against
      trip combat maneuvers and on Acrobatics checks and saving throws to avoid
      being knocked prone. While using the Snake Style feat, whenever you score
      a critical threat with your unarmed strike, you can make a Sense Motive
      check in place of the attack roll to confirm the critical hit. Whenever
      you score a critical hit with your unarmed strike, you can spend an
      immediate action to take a 5-foot step even if you have otherwise moved
      this round.</p><p><strong>Normal</strong>: You can take a 5-foot step only
      if you have not otherwise moved this round.</p><p><strong>Combat
      Trick</strong>: When you threaten a critical hit with your unarmed strike
      while using Snake Style and choose to attempt a Sense Motive check in
      place of the confirmation roll, you can spend up to 5 stamina points to
      gain a bonus on the Sense Motive check equal to the number of stamina
      points you spent.</p>
  tags:
    - Combat
type: feat
