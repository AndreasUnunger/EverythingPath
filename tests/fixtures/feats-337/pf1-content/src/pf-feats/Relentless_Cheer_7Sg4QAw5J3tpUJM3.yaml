name: Relentless Cheer
system:
  description:
    value: >-
      <p><em>Your undying optimism keeps you and your companions going even when
      things get rough.</em></p><p><strong>Prerequisites</strong>: Halfling,
      fearless and halfling luck racial traits.</p><p><strong>Benefits</strong>:
      Adjacent allies who also have this feat gain a +1 morale bonus on all
      saving throws. This bonus increases to +3 on saving throws against
      fear.</p>
  tags:
    - Teamwork
    - Racial
    - Halfling
