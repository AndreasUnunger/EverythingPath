name: Awe-Inspiring Smash
system:
  description:
    value: >-
      <p><em>Your fury in combat translates into crowd-pleasing
      displays.</em></p><p><strong>Prerequisites</strong>: Str 15, Power Attack,
      base attack bonus +3.</p><p><strong>Benefits</strong>: You can apply your
      Strength modifier instead of your Charisma modifier to performance combat
      checks.</p><p>In addition, when you spend a swift action to attempt a
      performance combat check that was triggered by a successful bull rush or
      sunder combat maneuver check, you gain a +2 bonus on the performance
      combat check. For every 5 points by which your attack exceeded your
      opponent's CMD, this bonus increases by 2.</p><p><strong>Combat Trick<br
      /></strong>After successfully performing a bull rush or sunder combat
      maneuver, you can spend up to 5 stamina points to increase the bonus on
      performance combat checks that you gain from Awe-Inspiring Smash by 1 per
      stamina point spent.</p>
  tags:
    - Combat
    - Performance
type: feat
