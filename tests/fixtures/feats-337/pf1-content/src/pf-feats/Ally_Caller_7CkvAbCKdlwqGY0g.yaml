name: Ally Caller
system:
  description:
    value: >-
      <p><em>You can draw upon aid from the ocean more
      frequently.</em></p><p><strong>Prerequisites</strong>: Triton, summon
      nature's ally II spell-like ability, character level
      3rd.</p><p><strong>Benefits</strong>: You gain two additional uses of
      summon nature's ally II per day.</p><p><strong>Special</strong>: You may
      take this feat multiple times. Each time you select it, you gain two
      additional uses of summon nature's ally II.</p>
