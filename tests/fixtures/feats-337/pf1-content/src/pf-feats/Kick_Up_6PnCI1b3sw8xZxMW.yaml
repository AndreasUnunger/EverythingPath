name: Kick Up
system:
  description:
    value: >-
      <p><em>You have learned how to kick items on the ground to a ready
      hand.</em></p><p><strong>Prerequisites</strong>: Dex 12, Acrobatic,
      Acrobatics 1 rank; slayer level 1st or swashbuckler level
      1st.</p><p><strong>Benefits</strong>: As long as you have at least one
      hand free, you can use a swift action to retrieve a single unattended item
      or weapon that weighs 10 pounds or less from the ground, either in your
      square or in any adjacent square not occupied or threatened by an enemy.
      Additionally, when you kick up a weapon and attempt a feint before the end
      of your turn, you receive a +2 circumstance bonus on the feint
      attempt.</p><h3>Combat Trick</h3><p>You can spend 2 stamina points to kick
      up an unattended object in an adjacent space occupied by an enemy.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
