name: Improved Sidestep
system:
  description:
    value: >-
      <p><em>You are adept at sidestepping your opponent's melee attacks without
      compromising your mobility.</em></p><p><strong>Prerequisites</strong>: Dex
      15, Dodge, Mobility, Sidestep.</p><p><strong>Benefits</strong>: After
      sidestepping an opponent's missed attack using the Sidestep feat, you may
      still take a 5-foot step during your next turn, or you may move up to your
      full speed if you take an action to move during your next
      turn.</p><p><strong>Normal</strong>: If you use the Sidestep feat, you
      cannot take a 5-foot step during your next turn.</p><p><strong>Combat
      Trick</strong>: As long as you have at least 1 stamina point in your
      stamina pool, you can use the Improved Sidestep feat as a free action that
      you can take during your opponent's turn.</p>
  tags:
    - Combat
type: feat
