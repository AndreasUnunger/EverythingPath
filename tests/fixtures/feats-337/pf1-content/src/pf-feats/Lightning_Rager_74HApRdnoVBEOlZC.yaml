name: Lightning Rager
system:
  description:
    value: >-
      <p><em>Your primal instincts prevent you from being
      surprised.</em></p><p><strong>Prerequisites</strong>: Rage class
      feature.</p><p><strong>Benefits</strong>: If caught unawares during a
      surprise round, you can enter a rage as an immediate action. If you do,
      you gain a +2 insight bonus to your Armor Class for the remainder of the
      surprise round.</p>
