name: Improved Surprise Follow-Through
system:
  description:
    value: >-
      <p><em>You follow up an attack with a surprising series of sweeping
      blows.</em></p><p><strong>Prerequisites</strong>: Str 13, Cleave, Great
      Cleave, Power Attack, Surprise Follow Through, base attack bonus
      +8.</p><p><strong>Benefits</strong>: When using Great Cleave, each
      opponent you attack on your turn (other than the first) is denied his
      Dexterity bonus against you.</p><h3>Combat Trick</h3><p>When you hit a foe
      that's denied its Dexterity bonus via this feat and you use the Surprise
      Follow-Through combat trick to deal extra damage, the amount of extra
      damage dealt increases to 1d6 points.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
