name: Teleport Tactician
system:
  description:
    value: >-
      <p><em>You are highly alert for enemies using teleportation to approach
      you or flee from you.</em></p><p><strong>Prerequisites</strong>: Combat
      Reflexes, Disruptive, Spellbreaker.</p><p><strong>Benefits</strong>: Any
      creature using a teleportation effect to enter or leave a square
      threatened by you provokes an attack of opportunity, even if casting
      defensively or using a supernatural ability.</p><p><strong>Combat
      Trick</strong>: When you hit a target with an attack of opportunity
      granted by this feat, you can spend 2 stamina points to daze the target
      for 1 round. The target can attempt a Fortitude save with a DC equal to 10
      + your base attack bonus to negate this effect.</p>
  tags:
    - Combat
type: feat
