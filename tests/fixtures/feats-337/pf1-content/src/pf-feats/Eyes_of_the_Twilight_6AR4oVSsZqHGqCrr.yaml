name: Eyes of the Twilight
system:
  description:
    value: >-
      <p><em>Your eyes have grown accustomed to the half-light of dusk and
      dawn.</em></p><p><strong>Prerequisites</strong>: Sharp Senses, Perception
      7 ranks, keen senses racial trait, low-light
      vision.</p><p><strong>Benefits</strong>: Creatures within an area of dim
      light don't gain concealment from you. You're still effectively blinded in
      an area of darkness.</p><p><strong>Normal</strong>: Creatures within an
      area of dim light gain concealment (20% miss chance in combat) from those
      without darkvision or the ability to see in darkness.</p>
  tags:
    - General
type: feat
