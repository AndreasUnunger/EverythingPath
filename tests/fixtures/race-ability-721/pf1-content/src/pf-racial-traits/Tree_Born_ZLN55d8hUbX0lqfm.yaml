      slowly. They have no Constitution penalty but have a base speed of
      @Distance[20 ft;dual] and a fly speed of @Distance[30 ft;dual] (clumsy
      maneuverability).</p><p>This replaces the penalty to Constitution and
      alters speed.</p>
