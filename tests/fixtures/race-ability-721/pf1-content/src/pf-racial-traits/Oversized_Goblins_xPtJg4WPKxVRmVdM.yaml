  description:
    value: >-
      <p><strong>Race</strong>: Goblin<br /><strong>Replaced Trait(s)</strong>:
      Base Statistics</p><hr /><p>A few goblins attain a much larger size than
      their kin. No one is exactly sure why they grow to be giants among their
      kind, but it's probably due to a combination of luck, diet, and constant
      access to food. These goblins are monsters among their own kind, not just
      in height, but also in girth and in strength. If not cast out for eating
      all of the tribe's food, oversized goblins often become the bosses of
      their tribes, and the most powerful of them become chiefs.</p><p>Oversized
      goblins are Medium size, and grow to @Distance[4 ft;dual] to @Distance[5
      ft;dual] tall. They tend to be particularly obese, weighing between
      @Weight[225;dual] and @Weight[275;dual]. Instead of the normal racial
      ability score modifiers for goblins, oversized goblins gain a +2 bonus to
      Strength, a +2 bonus to Dexterity, and a -2 penalty to Charisma.</p>
