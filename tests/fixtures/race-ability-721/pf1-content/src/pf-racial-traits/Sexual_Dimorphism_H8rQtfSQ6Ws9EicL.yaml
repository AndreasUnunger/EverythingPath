    value: >-
      <p><strong>Race</strong>: Lashunta</p><hr /><p>Male and female lashunta
      have very different body and personality types, more so than most humanoid
      species. Male lashunta are muscular (+2 Strength) and often brash and
      unobservant (-2 Wisdom). Female lashunta, though beautiful and commanding
      (+2 Charisma), lack the males' rugged builds (-2 Constitution).</p>
