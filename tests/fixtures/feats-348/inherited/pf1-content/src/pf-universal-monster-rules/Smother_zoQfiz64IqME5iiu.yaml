  description:
    value: >-
      <p><div><p>If the creature&rsquo;s <a>grappled</a> opponent is holding its
      breath, the monster can force that opponent to expel or consume some of
      its breath, or can otherwise reduce the time remaining until the target
      has to attempt checks to avoid suffocation.</p><p>If the monster succeeds
      at a grapple check against the opponent, the remaining duration for which
      the opponent can hold its breath decreases by 1d6 rounds. If this reduces
      the remaining time that the creature can hold its breath to 0 rounds or
      fewer, the DCs of its suffocation checks increase by 5. For example, if
      the monster is grappling a creature that has 10 rounds remaining before it
      has to attempt suffocation checks, a successful grapple check reduces that
      duration by 1d6 rounds.</p><p>If the monster has another ability (such as
      <a>constrict</a>) that harms the opponent when it succeeds at a grapple
      check, it can automatically use the smother ability when it succeeds at
      the grapple check to use the other ability.</p><br /><p><em>Format</em>:
      smother</p><p><em>Location</em>: Special Attacks.</p></div></p>
  subType: misc
  tags:
    - Universal Monster Rules
type: feat
