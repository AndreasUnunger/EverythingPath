  description:
    value: >-
      <p><strong>Granted Powers</strong>: You sense nature’s creeping
      reclamation of what once belonged to the civilized world and understand
      how to ensure ruins that hold power or significance will
      persist.</p><h3>Domain Powers</h3><p>Ruin Touch (Su): You can strengthen
      or weaken objects with your touch. With a melee touch attack, you can
      increase or decrease the hardness of an object (up to a 10-foot cube) or
      construct by an amount equal to half your druid level (minimum 1) for 1
      minute. You cannot reduce an object’s hardness below 0, and the same
      target cannot be affected by this ability more than once. You can use this
      ability a number of times per day equal to 3 + your Wisdom
      modifier.</p><p>Remembrance (Sp): At 4th level, when within a ruin or
      other structure that is no longer claimed by civilization, you can call
      upon the wisdom of the land and its long-dead residents. Once per day for
      every 4 druid levels you possess, you can cast divination as a spell-like
      ability. Additionally, if you are within ruins when you cast commune with
      nature, you gain information about the crumbling structures around you as
      though they were part of nature.</p><p>Surefooted (Ex): At 8th level, your
      speed is not reduced by difficult terrain unless the terrain has been
      magically manipulated to impede motion.</p><h3>Domain
      Spells</h3><ul><li><p>1st—@UUID[Compendium.pf1.spells.Item.fv9mgob508qv99zz]</p></li><li><p>2nd—@UUID[Compendium.pf1.spells.Item.gqtg9ruv8kkd0knf]</p></li><li><p>3rd—@UUID[Compendium.pf1.spells.Item.dkv9v4verb82fmpx]</p></li><li><p>4th—@UUID[Compendium.pf1.spells.Item.fhary5oz1t4uhc2l]</p></li><li><p>5th—@UUID[Compendium.pf1.spells.Item.icjrw9y6pa1uatlz]</p></li><li><p>6th—@UUID[Compendium.pf1.spells.Item.wgm8mm1za909pwch]</p></li><li><p>7th—@UUID[Compendium.pf1.spells.Item.g52zx1t1giteg5h1]</p></li><li><p>8th—@UUID[Compendium.pf1.spells.Item.a5gcbpwfhu4hh5ic]</p></li><li><p>9th—@UUID[Compendium.pf1.spells.Item.o8jhvddxgunzx94i]</p></li></ul>
