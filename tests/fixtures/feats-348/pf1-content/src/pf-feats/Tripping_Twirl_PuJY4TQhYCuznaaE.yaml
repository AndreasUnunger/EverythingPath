name: Tripping Twirl
system:
  description:
    value: >-
      <p><em>You can make a trip attack with a quarterstaff on all adjacent
      enemies.</em></p><p><strong>Prerequisites</strong>: Int 13, Combat
      Expertise, Improved Trip, Tripping Staff, Weapon Focus (quarterstaff),
      Weapon Specialization (quarterstaff), base attack bonus
      +12.</p><p><strong>Benefits</strong>: As a full-round action, while
      wielding a quarterstaff two-handed, you can attempt a trip combat maneuver
      against each enemy adjacent to you.</p><p><strong>Special</strong>: If you
      are a magus with the staff magus archetype, you can use spellstrike on any
      one trip combat maneuver you make with the staff.</p><p><strong>Combat
      Trick</strong>: You can select this feat even if you don't meet the
      ability score prerequisite (Intelligence 13). You gain the benef its of
      this feat only as long as you have at least 1 stamina point in your
      stamina pool.</p>
  tags:
    - Combat
type: feat
