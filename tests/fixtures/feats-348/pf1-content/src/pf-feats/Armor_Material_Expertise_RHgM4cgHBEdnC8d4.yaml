name: Armor Material Expertise
system:
  description:
    value: >-
      <p><em>You tap into the potential of your armor's special
      material.</em></p><p><strong>Prerequisites</strong>: Base attack bonus +6
      or fighter level 4th, armor training class
      feature.</p><p><strong>Benefits</strong>: When wearing armor made of one
      of the materials listed below, you can use the listed ability twice per
      day (unless otherwise stated).<br />Adamantine: As an immediate action
      after being struck by an attack, you convert half the lethal damage of the
      attack into nonlethal damage.</p><hr /><p><strong>Angelskin</strong>: As a
      swift action, you shine with bright light as daylight for 1
      round.</p><p><strong>Darkleaf Cloth</strong>: As a swift action, you gain
      the woodland stride druid class feature for 1
      minute.</p><p><strong>Dragonhide</strong>: As an immediate action when you
      take energy damage of the same type to which the dragonhide armor is
      immune, you reduce the damage taken by 10 hit
      points.</p><p><strong>Elysian Bronze</strong>: As an immediate action
      after being struck by an attack from a magical beast or monstrous
      humanoid, you convert half the lethal damage of the attack into nonlethal
      damage.</p><p><strong>Fire-Forged Steel or Frost-Forged Steel</strong>: As
      a swift action, any unarmed strikes, shield bashes, or attacks with a
      spiked gauntlet or armor spikes you make are treated as having the flaming
      special ability (for fire-forged steel) or the frost special ability (for
      frost-forged steel) for 1 minute.</p><p><strong>Horacalcum (Pathfinder
      Adventure Path #61: Shards of Sin)</strong>: Once per day as a swift
      action, you can grant yourself the benefits of haste for 1
      round.</p><p><strong>Living Steel</strong>: As an immediate action after
      being struck by an attack with a metal weapon, you can use the living
      steel's ability to damage metal weapons, as if the attacker had rolled a
      natural 1 on the attack.</p><p><strong>Mithral</strong>: As an immediate
      action, you gain spell resistance against transmutation spells equal to 5
      + the armor's enhancement bonus + your character level for 1
      round.</p><p><strong>Noqual (Pathfinder Adventure Path #61: Shards of
      Sin)</strong>: The armor's resistance bonus on saves increases to +4 for 1
      round.</p><hr /><h3>Combat Trick</h3><p>You can spend 5 stamina points to
      use an ability for a material, even though your armor isn't made of it.
      This still counts against your daily limit of armor material abilities.
      (See page 16.)</p>
  tags:
    - Armor Mastery
    - Combat
    - Combat Trick
type: feat
