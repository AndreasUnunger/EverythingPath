name: Spear Dancer
system:
  description:
    value: >-
      <p><em>You incorporate your two-handed reach weapon into a dizzying
      martial dance.</em></p><p><strong>Prerequisites</strong>: Weapon Focus
      (any two-handed reach weapon), Perform (dance) 4
      ranks.</p><p><strong>Benefits</strong>: Each time you hit a creature with
      a twohanded reach weapon that you have Weapon Focus in, the creature is
      dazzled for 1 round.</p><h3>Combat Trick</h3><p>: When you inflict the
      dazzled condition on an opponent using the Spear Dancer feat, you can
      spend up to 5 stamina points to increase the duration of the effect by 1
      round per stamina point spent.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
