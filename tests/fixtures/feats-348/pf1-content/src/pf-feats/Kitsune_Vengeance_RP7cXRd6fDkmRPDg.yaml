name: Kitsune Vengeance
system:
  description:
    value: >-
      <p><em>You cleverly hide your attacks within your devious
      antics.</em></p><p><strong>Prerequisites</strong>: Int 13; Combat
      Expertise; Improved Dirty Trick; Kitsune Style; Kitsune Tricks; base
      attack bonus +6 or monk level 6th.</p><p><strong>Benefits</strong>: While
      using the Kitsune Style feat, when a foe provokes an attack of opportunity
      from you, you can attempt to perform a dirty trick combat maneuver in
      place of making a melee attack.</p>
