name: Our Bounty, Our Glory
system:
  description:
    value: >-
      <p><em>You can ignore privation and channel your emotions to prepare for a
      later bounty.</em></p><p><strong>Prerequisites</strong>: Be a member of
      House Denzarni, or have the Bloodthirsty, Omen, Tree Tender, or
      Unsuspecting Master background.</p><p><strong>Benefits</strong>: You add 1
      day to the time you can go without food or water before making
      Constitution checks and you add +4 to Constitution checks to stave off the
      effects of starvation and thirst.</p><p><strong>Goal</strong>: You must
      succumb to your emotions and be victorious. Thwart an appropriate number
      of foes while you are subject to an effect with the emotion descriptor,
      such as rage.</p><p><strong>Completion Benefit</strong>: Once per day, you
      can use heroes' feast as a spell-like ability with a caster level equal to
      your character level, although your feast does not grant the effects of
      neutralize poison or remove disease.</p>
  tags:
    - Story
type: feat
