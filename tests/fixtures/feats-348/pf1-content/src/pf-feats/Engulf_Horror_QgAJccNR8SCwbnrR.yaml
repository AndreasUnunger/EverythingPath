name: Engulf Horror
system:
  description:
    value: >-
      <p><em>The repulsive horror of your smothering attack nearly incapacitates
      most foes.</em></p><p><strong>Prerequisites</strong>: Engulf Revulsion;
      engulf or smother universal monster
      ability.</p><p><strong>Benefits</strong>: When you successfully engulf or
      smother an opponent, successfully maintain a grapple combat maneuver on a
      smothered opponent, the opponent must succeed at a Will save (DC = 10 +
      1/2 your Hit Dice + your Strength modifier) or become staggered for 1
      round. This is a mindaffecting fear effect.</p>
  tags:
    - Combat
type: feat
