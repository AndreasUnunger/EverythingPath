img: systems/pf1/icons/skills/weapon_36.jpg
name: Artillery Team
system:
  description:
    value: >-
      <p><em>Together, you and an ally can operate an oversized and unwieldy
      weapon.</em></p><p><strong>Prerequisites</strong>: Proficiency with light
      crossbow, heavy crossbow, or musket; size Small or
      Medium.</p><p><strong>Benefits</strong>: When you're adjacent to an ally
      who also has this feat, together you count as being Large for the purpose
      of using Large light crossbows, Large heavy crossbows, and Large muskets.
      Firing such a weapon this way requires your ally to support the barrel or
      bow of the weapon. You must be able to trace a line from your space to the
      target's space in such a way that the line passes through the ally's
      space. The ally doesn't provide soft cover to your target. Your ally uses
      her actions to load the weapon, and you use your actions to make attacks.
      Similarly, your ally's feats and abilities apply to reloading, while your
      feats and abilities apply to making attacks. This feat does not allow you
      and your ally to act simultaneously on the same initiative.</p>
  tags:
    - Combat
    - Teamwork
type: feat
