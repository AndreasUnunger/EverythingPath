name: Witch Knife (Mythic)
system:
  description:
    value: >-
      <p><em>Your witch knife is as much an extension of your body as it is an
      extension of your power.</em></p><p><strong>Prerequisites</strong>: Witch
      Knife.</p><p><strong>Benefits</strong>: You can use your witch knife as an
      additional focus component for all your witch spells, not just your patron
      spells, adding 1 to their DC. This bonus stacks with the bonus to patron
      spells granted by Witch Knife, granting your patron spells a total +2
      bonus to their DC. Additionally, the hand holding the witch knife is still
      considered free for the purpose of casting spells and delivering touch
      attacks.</p>
  tags:
    - General
    - Mythic
type: feat
