name: Prophetic Visionary (Mythic)
system:
  description:
    value: >-
      <p><em>Your precognitive powers aid you
      further.</em></p><p><strong>Prerequisites</strong>: Prophetic
      Visionary.</p><p><strong>Benefits</strong>: You can use Prophetic
      Visionary's augury ability at will, spending 10 minutes in a deep trance
      each time. Your chance of a successful augury increases by 1% per tier. A
      successful augury made by using this feat also grants you the benefits of
      guidance, but the bonus is equal to your tier and is an insight bonus
      instead of a competence bonus.</p>
