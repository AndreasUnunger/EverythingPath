name: Regenerate Muscles
system:
  description:
    value: >-
      <p><em>You use your powerful metabolism to temporarily increase the
      strength of your muscles, but doing so costs you your regeneration
      powers.</em></p><p><strong>Prerequisites</strong>: Power Attack,
      regeneration, troll.</p><p><strong>Benefits</strong>: As a free action,
      you can make your regeneration stop working for 1 minute and gain a +2
      enhancement bonus to your Strength. You lose your regeneration ability
      while you benef it from this bonus to Strength and for 1 minute afterward.
      You can end this ability early as a free action. You can activate this
      ability only if your regeneration is functioning.</p>
  tags:
    - General
type: feat
