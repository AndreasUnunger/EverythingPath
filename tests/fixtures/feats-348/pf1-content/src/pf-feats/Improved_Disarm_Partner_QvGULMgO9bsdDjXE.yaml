name: Improved Disarm Partner
system:
  description:
    value: >-
      <p><em>You are ever the
      opportunist.</em></p><p><strong>Prerequisites</strong>: Disarm Partner,
      base attack bonus +5.</p><p><strong>Benefits</strong>: When an ally with
      this feat fails a disarm combat maneuver check made on his turn against a
      foe that's within your melee reach, you can make an attack of opportunity
      against that foe. If that attack of opportunity hits the foe, you can also
      attempt a disarm combat maneuver check against that opponent as part of
      that attack of opportunity.</p>
  tags:
    - Combat
    - Teamwork
type: feat
