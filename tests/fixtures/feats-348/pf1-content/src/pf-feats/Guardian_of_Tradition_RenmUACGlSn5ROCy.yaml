  description:
    value: >-
      <p><em>Your deity rewards your devotion to the duty of your
      race.</em></p><p><strong>Prerequisites</strong>: Domain class feature,
      girtablilu.</p><p><strong>Benefits</strong>: You can replace one of the
      domains offered by your deity with one of the following druid domains:
      Desert (Ultimate Magic 34), Ruins, or Vermin. You gain a +1 bonus to your
      caster level when casting domain spells from the selected domain.</p>
