name: Psychic Adept
system:
  description:
    value: >-
      <p><em>You have honed your mind to harness psychic
      power.</em></p><p><strong>Prerequisites</strong>: Int 11, Psychic
      Sensitivity.</p><p><strong>Benefits</strong>: You gain the ability to cast
      a 0-level knack from the psychic class's spell list. You can cast this
      spell three times per day as a spell-like ability. The caster level for
      this ability is equal to your character level, and the save DC is equal to
      10 + your Intelligence modifier.</p><p><strong>Special</strong>: You can
      choose this feat multiple times, choosing a different knack each time.</p>
  tags:
    - General
type: feat
