name: Delayed Potion
system:
  description:
    value: >-
      <p><em>You can brew potions whose effects are delayed
      slightly.</em></p><p><strong>Prerequisites</strong>: Brew Potion, caster
      level 5th.</p><p><strong>Benefits</strong>: When you brew a potion, you
      can have the potion's effects be delayed by up to 10 rounds after a
      creature consumes it. Once you decide how many rounds the potion's effects
      will be delayed by, that decision cannot later be changed. When a delayed
      potion is imbibed, it has no effect for the chosen number of rounds, and
      then it affects the imbiber as normal. The rounds in which the potion's
      effects are delayed do not count against the duration of the potion's
      effect. A spell brewed into a potion this way does not use up a
      higher-level spell slot than the spell's actual
      level.</p><p><strong>Versatile Brewing</strong>: The above feat allows
      potion brewers to concoct unusual variations in their potions, altering
      the potions' effects in strange and useful ways. This feat functions
      similarly to metamagic feats, though it affects the creation of potions
      instead of the normal casting of spells. Level limits for potions apply to
      their level after the application of any relevant metamagic feats (if the
      feat affects the component spell's level).</p>
  tags:
    - General
type: feat
