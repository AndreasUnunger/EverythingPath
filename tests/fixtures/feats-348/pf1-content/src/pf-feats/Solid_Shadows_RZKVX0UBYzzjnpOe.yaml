name: Solid Shadows
system:
  description:
    value: >-
      <p><em>Your shadowy illusions are more
      potent.</em></p><p><strong>Prerequisites</strong>: Spell Focus
      (illusion).</p><p><strong>Benefits</strong>: When casting greater shadow
      conjuration, greater shadow evocation, shadow conjuration, or shadow
      evocation (and, at the GM's discretion, any similar spell with the shadow
      descriptor that mimics a spell of another school), that spell is 20% more
      real then normal. A solid shadows spell takes up a spell slot 1 level
      higher than the spell's actual level.</p>
  tags:
    - Metamagic
type: feat
