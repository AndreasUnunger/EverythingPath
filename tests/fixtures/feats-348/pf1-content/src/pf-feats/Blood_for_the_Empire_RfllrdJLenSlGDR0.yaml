name: Blood for the Empire
system:
  description:
    value: >-
      <p><em>When fighting alongside your allies, the sight of a bloodied foe
      inspires you to greatness, while a martyred comrade compels you to
      vengeance.</em></p><p><strong>Prerequisites</strong>: Base attack bonus
      +4.</p><p><strong>Benefits</strong>: You gain a +2 morale bonus on attack
      and damage rolls against a target that was damaged by an ally with this
      feat within the last round. When an ally with this feat dies within 30
      feet of you, you gain the effects of haste for 1 round.</p>
  tags:
    - Teamwork
type: feat
