  description:
    value: >-
      <p><em>You are masterful in your
      improvisation.</em></p><p><strong>Prerequisites</strong>: Int 13, Fast
      Learner, Improvisation, human.</p><p><strong>Benefits</strong>: Your
      nonproficiency penalty with weapons, armor, and shields is halved. In
      addition, the bonus on all skill checks for skills you have no ranks in
      increases to +4 instead of +2.</p>
