name: Tundra Stride
system:
  description:
    value: >-
      <p><em>Whether as predator or prey, you have learned to move like the
      arctic wind when survival is at
      stake.</em></p><p><strong>Prerequisites</strong>: Acrobatics 5
      ranks.</p><p><strong>Benefits</strong>: While charging, running, or
      withdrawing, you gain a +10-foot enhancement bonus to your base speed.
      This bonus also applies to your speed when calculating overland movement
      in any plains terrain. You lose the benefits of this feat while you are
      wearing heavy armor or carrying a heavy load.</p>
  tags:
    - General
type: feat
