name: Improved Grapple (Mythic)
system:
  description:
    value: >-
      <p><em>Your wrestling moves are difficult to
      counter.</em></p><p><strong>Prerequisites</strong>: Improved
      Grapple.</p><p><strong>Benefits</strong>: You gain a bonus equal to half
      your tier on checks to grapple, and to your CMD when an opponent tries to
      grapple you. These bonuses stack with those granted by Improved
      Grapple.</p><p>Furthermore, you can make an attack of opportunity against
      any creature that attempts to grapple you, unless it also has this
      feat.</p>
  tags:
    - Combat
    - Mythic
type: feat
