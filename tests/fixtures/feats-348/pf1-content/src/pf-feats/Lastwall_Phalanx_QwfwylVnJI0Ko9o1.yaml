name: Lastwall Phalanx
system:
  description:
    value: >-
      <p><em>When battling the terrifying hordes of Belkzen, you find strength
      in your shield brothers and
      sisters.</em></p><p><strong>Prerequisites</strong>: Base attack bonus +3,
      good alignment.</p><p><strong>Benefits</strong>: You gain a sacred bonus
      to your AC against the attacks of evil creatures and a sacred bonus to
      saves against the spells and abilities of evil creatures equal to the
      number of adjacent allies who also have this feat.</p>
