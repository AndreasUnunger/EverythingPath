name: Ambuscading Spell
system:
  description:
    value: >-
      <p><em>Your spells are particularly effective against those caught
      unawares.</em></p><p><strong>Benefits</strong>: During a surprise round,
      your opponents that have not yet acted take a -2 penalty on saving throws
      against spells you cast. Creatures that have already acted take a -1
      penalty during the surprise round.</p>
