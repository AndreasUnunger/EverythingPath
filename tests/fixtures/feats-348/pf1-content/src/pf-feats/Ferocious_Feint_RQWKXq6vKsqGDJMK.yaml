name: Ferocious Feint
system:
  description:
    value: >-
      <p><em>Through training or inborn ability, the animal is naturally skilled
      at feinting against its foes.</em></p><p><strong>Prerequisites</strong>:
      Bluff 1 rank, animal companion.</p><p><strong>Benefits</strong>: The
      animal companion uses half its master's class level (minimum 1) in place
      of its Charisma bonus on Bluff checks to feint an opponent. In addition,
      the animal companion can use Bluff to feint an opponent as a move
      action.</p>
  tags:
    - Combat
type: feat
