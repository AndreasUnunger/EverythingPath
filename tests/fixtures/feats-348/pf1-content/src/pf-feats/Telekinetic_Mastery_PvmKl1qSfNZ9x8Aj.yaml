name: Telekinetic Mastery
system:
  description:
    value: >-
      <p><em>You can coax telekinesis from transmutation magic
      items.</em></p><p><strong>Prerequisites</strong>: Use Magic Device 5
      ranks, base Fortitude save bonus +7.</p><p><strong>Benefits</strong>: You
      can cause an item that has a transmutation spell of 4th level or higher in
      its construction requirements to cast telekinesis. You can use this feat
      once per day, plus an additional time per day at base Fortitude save bonus
      +9 and +11.</p><p><strong>Pathfinder Society<br /></strong>When qualifying
      for and calculating the benefits of an item mastery feat, a PC uses the
      base Fortitude save bonus from only one of his classes.</p>
  tags:
    - Combat
    - Item Mastery
type: feat
