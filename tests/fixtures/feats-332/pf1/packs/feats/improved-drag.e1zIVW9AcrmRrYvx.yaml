    - target: cmb
      text: +[[2]] and no AoO to drag someone
    - target: cmd
      text: +[[2]] vs. drag
  description:
    value: >-
      <p><em>You are skilled at dragging foes around the
      battlefield.</em></p><p><strong>Prerequisites:</strong> Str 13,
      @UUID[Compendium.pf1.feats.Item.FUW5mIXHNBBIQ1Sq]{Power Attack}, base
      attack bonus +1.</p><p><strong>Benefit:</strong>  You do not provoke an
      attack of opportunity when performing a drag combat maneuver. In addition,
      you receive a +2 bonus on checks made to drag a foe. You also receive a +2
      bonus to your Combat Maneuver Defense when an opponent tries to drag
      you.</p><p><strong>Normal:</strong> You provoke an attack of opportunity
      when performing a drag combat maneuver.</p><h3>Combat Trick</h3><p>When
      you are the target of a drag combat maneuver, you can spend a number of
      stamina points up to your Strength or Dexterity bonus, whichever is
      greater. Your CMD against that drag attempt increases by that number.</p>
