  description:
    value: >-
      <p><strong>Race</strong>: Kitsune</p><hr /><p>A kitsune can assume the
      appearance of a specific single human form of the same sex. The kitsune
      always takes this specific form when she uses this ability. A kitsune in
      human form cannot use her bite attack, but gains a +10 racial bonus on
      Disguise checks made to appear human. Changing shape is a standard action.
      This ability otherwise functions as
      @UUID[Compendium.pf1.spells.Item.kouqz0pm1xl8xilm]{Alter Self}, except
      that the kitsune does not adjust her ability scores and can remain in this
      form indefinitely.</p>
