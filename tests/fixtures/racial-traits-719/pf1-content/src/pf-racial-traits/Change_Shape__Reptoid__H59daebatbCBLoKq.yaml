  description:
    value: >-
      <p><strong>Race</strong>: Reptoid</p><hr /><p>A reptoid can assume the
      appearance of a specific single Medium humanoid. The reptoid always takes
      this specific form when it uses this ability. The reptoid gains a +10
      racial bonus on Disguise checks to appear as that type of humanoid. This
      ability otherwise functions as
      @UUID[Compendium.pf1.spells.Item.kouqz0pm1xl8xilm]{Alter Self}, except the
      reptoid does not adjust its ability scores. A reptoid can select a new
      humanoid form by spending 1 week preparing itself for the change, but can
      then no longer assume its previous humanoid form.</p>
  effectNotes:
