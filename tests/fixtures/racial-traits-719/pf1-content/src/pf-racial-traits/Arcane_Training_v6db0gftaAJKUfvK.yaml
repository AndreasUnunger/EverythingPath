name: Arcane Training
system:
  description:
    instructions: >-
      <p>Choose a single arcane spellcasting class as your sole favored class. 
      You must manually adjust your level in conjunction with the noted item
      types.</p>
    value: >-
      <p><strong>Race</strong>: Half-Elf<br /><strong>Replaced
      Trait(s)</strong>: Multitalented</p><hr /><p>Half-elves occasionally seek
      tutoring to help them master the magic in their blood. Half-elves with
      this racial trait have only one favored class and it must be an arcane
      spellcasting class. They can use spell trigger and spell completion items
      for their favored class as if 1 level higher (or as a 1st-level character
      if they have no levels in that class). This racial trait replaces the
      multitalented racial trait.</p>
