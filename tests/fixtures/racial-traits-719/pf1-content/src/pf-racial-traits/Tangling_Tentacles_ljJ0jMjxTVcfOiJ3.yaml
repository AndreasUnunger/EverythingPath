  description:
    value: >-
      <p><strong>Race</strong>: Grindylow</p><hr /><p>Grindylows have constantly
      writhing tentacles that reach out to tug at and trip adjacent foes. During
      the grindylow's turn, it can make a single trip attack against any
      adjacent foe as a swift action. The grindylow gains a +4 racial bonus on
      trip attacks with its tangling tentacles, and if it fails to trip a foe,
      that creature can't attempt to trip the grindylow in retaliation.</p>
