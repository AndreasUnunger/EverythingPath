  actions:
    - _id: HUOkLFKmpwRvCpIx
      activation:
        type: standard
        unchained:
          cost: 2
          type: action
      description: >-
        <div
        class="description-body"><p>@UUID[Compendium.pf1.spells.Item.zymaptg3vmnvfvxl]{Dancing
        Lights}</p><p>Depending on the version selected, you create up to four
        lights that resemble lanterns or torches (and cast that amount of
        light), or up to four glowing spheres of light (which look like
        will-o'-wisps), or one faintly glowing, vaguely humanoid shape. The
        <em>dancing lights</em> must stay within a @Distance[10 ft;dual]-radius
        area in relation to each other but otherwise move as you desire (no
        concentration required): forward or back, up or down, straight or
        turning corners, or the like. The lights can move up to @Distance[100
        ft;dual] per round. A light winks out if the distance between you and it
        exceeds the spell's range.</p><p>You can only have one <em>dancing
        lights</em> spell active at any one time. If you cast this spell while
        another casting is still in effect, the previous casting is dispelled.
        If you make this spell permanent, it does not count against this
        limit.</p><p><em>Dancing lights</em> can be made permanent with a
        <em>permanency</em> spell.</p></div>
      duration:
        units: minute
        value: '1'
      effect: Up to four lights, all within a 10-ft.-radius area
      name: Dancing Lights
      range:
        units: ft
        value: '@attributes.hd.total * 10 + 100'
      target:
        value: up to 4 lights, all within a 10 ft radius
      uses:
        self:
          maxFormula: '1'
          per: day
          value: 1
    - _id: d7Yj9wlLEYzzO1qE
      activation:
        type: standard
        unchained:
          cost: 2
          type: action
      description: >-
        <div
        class="description-body"><p>@UUID[Compendium.pf1.spells.Item.tsndfcfijmgxs37p]{Darkness}</p><p>This
        spell causes an object to radiate <em>darkness</em> out to a
        @Distance[20 ft;dual] radius. This <em>darkness</em> causes the
        illumination level in the area to drop one step, from bright light to
        normal light, from normal light to dim light, or from dim light to
        <em>darkness</em>. This spell has no effect in an area that is already
        dark. Creatures with light vulnerability or sensitivity take no
        penalties in normal light. All creatures gain concealment (20% miss
        chance) in dim light. All creatures gain total concealment (50% miss
        chance) in <em>darkness</em>.</p><p>Creatures with darkvision can see in
        an area of dim light or <em>darkness</em> without penalty. Nonmagical
        sources of light, such as torches and lanterns, do not increase the
        light level in an area of <em>darkness</em>. Magical light sources only
        increase the light level in an area if they are of a higher spell level
        than <em>darkness</em>.</p><p>If <em>darkness</em> is cast on a small
        object that is then placed inside or under a lightproof covering, the
        spell's effect is blocked until the covering is removed.</p><p>This
        spell does not stack with itself. <em>Darkness</em> can be used to
        counter or dispel any light spell of equal or lower spell
        level.</p></div>
      duration:
        dismiss: true
        units: minute
        value: '@attributes.hd.total'
      measureTemplate:
        size: '20'
        type: circle
      name: Darkness
      range:
        units: touch
      target:
        value: object touched
      uses:
        self:
          maxFormula: '1'
          per: day
          value: 1
    - _id: jD8lECfGifjgUACJ
      activation:
        type: standard
        unchained:
          cost: 2
          type: action
      area: creatures and objects within a 5-ft.-radius burst
      description: >-
        <p>@UUID[Compendium.pf1.spells.Item.bl71og1gklwncmt7]{Faerie
        Fire}</p><p>A pale glow surrounds and outlines the subjects. Outlined
        subjects shed light as candles. Creatures outlined by <em>faerie
        fire</em> take a -20 penalty on all Stealth checks. Outlined creatures
        do not benefit from the concealment normally provided by
        <em>darkness</em> (though a 2nd-level or higher magical
        <em>darkness</em> effect functions normally), <em>blur</em>,
        <em>displacement</em>, <em>invisibility</em>, or similar effects. The
        light is too dim to have any special effect on undead or dark-dwelling
        creatures vulnerable to light. The <em>faerie fire</em> can be blue,
        green, or violet, according to your choice at the time of casting. The
        <em>faerie fire</em> does not cause any harm to the objects or creatures
        thus outlined.</p>
      duration:
        dismiss: true
        units: minute
        value: '@attributes.hd.total'
      measureTemplate:
        size: '5'
        type: circle
      name: Faerie Fire
      range:
        units: ft
        value: '@attributes.hd.total * 40 + 400'
      uses:
        self:
          maxFormula: '1'
          per: day
          value: 1
  description:
    value: >-
      <p><strong>Race</strong>: Drow</p><hr /><p>A drow can cast <em>dancing
      lights</em>, <em>darkness</em>, and <em>faerie fire</em>, each once per
      day, using her total character level as her caster level.</p>
