  description:
    value: >-
      <p><em>This creature can make turns with ease while
      flying.</em></p><p><strong>Prerequisites</strong>: Fly
      speed.</p><p><strong>Benefits</strong>: Once each round, a creature with
      this feat can turn up to 180 degrees as a free action without making a Fly
      skill check. This free turn does not consume any additional movement from
      the creature.</p><p><strong>Normal</strong>: A flying creature can turn up
      to 90 degrees by making a DC 15 Fly skill check and expending 5 feet of
      movement. A flying creature can turn up to 180 degrees by making a DC 20
      Fly skill check and expending 10 feet of movement.</p>
