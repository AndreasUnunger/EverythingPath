      name: Use
  description:
    instructions: >-
      <p>Duplicate the normal action in the spell-like ability and adjust
      activation cost accordingly.</p>
    value: >-
      <p><em>This creature can use one of its spell-like abilities with next to
      no effort.</em></p><p><strong>Prerequisites</strong>: Spell-like ability
      at CL 10th or higher.</p><p><strong>Benefits</strong>: Choose one of the
      creature's spell-like abilities, subject to the restrictions described in
      this feat. The creature can use the chosen spell-like ability as a
      quickened spell-like ability three times per day (or less, if the ability
      is normally usable only once or twice per day).</p><p>Using a quickened
      spell-like ability is a swift action that does not provoke an attack of
      opportunity. The creature can perform another action--including the use of
      another spell-like ability (but not another swift action)--in the same
      round that it uses a quickened spell-like ability. The creature may use
      only one quickened spell-like ability per round.</p><p>The creature can
      only select a spell-like ability duplicating a spell with a level less
      than or equal to 1/2 its caster level (round down) - 4. For a summary, see
      the table below.</p><p>A spell-like ability that duplicates a spell with a
      casting time greater than 1 full round cannot be quickened.<br
      /></p><table><tbody><tr><td><p><strong>Spell
      Level</strong></p></td><td><p><strong>Caster Level to
      Quicken</strong></p></td></tr><tr><td><p>0</p></td><td><p>8th</p></td></tr><tr><td><p>1st</p></td><td><p>10th</p></td></tr><tr><td><p>2nd</p></td><td><p>12th</p></td></tr><tr><td><p>3rd</p></td><td><p>14th</p></td></tr><tr><td><p>4th</p></td><td><p>16th</p></td></tr><tr><td><p>5th</p></td><td><p>18th</p></td></tr><tr><td><p>6th</p></td><td><p>20th</p></td></tr><tr><td><p>7th</p></td><td><p>--</p></td></tr><tr><td><p>8th</p></td><td><p>--</p></td></tr><tr><td><p>9th</p></td><td><p>--</p></td></tr></tbody></table><p><strong>Normal</strong>:
      The use of a spell-like ability normally requires a standard action (at
      the very least) and provokes an attack of
      opportunity.</p><p><strong>Special</strong>: This feat can be taken
      multiple times. Each time it is taken, the creature can apply it to a
      different one of its spell-like abilities.</p>
