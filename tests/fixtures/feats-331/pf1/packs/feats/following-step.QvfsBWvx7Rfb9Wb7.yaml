  description:
    value: >-
      <p><em>You can repeatedly close the distance when foes try to move away,
      without impeding your normal
      movement.</em></p><p><strong>Prerequisites</strong>: Dex 13,
      @UUID[Compendium.pf1.feats.Item.Mz8ZG6nqW3NKFZhK]{Step
      Up}.</p><p><strong>Benefit</strong>: When using the Step Up feat to follow
      an adjacent foe, you may move up to 10 feet. You may still take a 5-foot
      step during your next turn, and any movement you make using this feat does
      not subtract any distance from your movement during your next
      turn.</p><p><strong>Normal</strong>: You can only take a 5-foot step to
      follow an opponent using Step Up.</p><h3>Combat Trick</h3><p>When you use
      this feat to move, you can spend 2 stamina points to increase your
      movement to 15 feet.</p>
