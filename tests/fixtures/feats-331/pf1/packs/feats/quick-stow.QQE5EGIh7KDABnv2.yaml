name: Quick Stow
system:
  description:
    value: >-
      <p><em>You effortlessly stow items and sheathe
      weapons.</em></p><p><strong>Prerequisites</strong>: Quick Draw, base
      attack bonus +1.</p><p><strong>Benefits</strong>: You do not provoke an
      attack of opportunity when sheathing a weapon, and you can combine a move
      action to sheathe a weapon with a regular move action. (You can both stow
      and draw a weapon as part of the same move action in this way.) If you
      have the Two-Weapon Fighting feat, you can sheathe two light or one-handed
      weapons in the time it would normally take to sheathe one.</p><p>You can
      also quickly stow items in a backpack or other container that you are
      wearing or carrying. When you successfully use an action to pick up an
      item (including when you steal an item with a successful Sleight of Hand
      check or steal combat maneuver check), you can stow the item as part of
      the same action used to acquire it. You can try to hide this object by
      attempting a Sleight of Hand check with a -20 penalty, opposed by the
      Perception check results of all opponents.</p>
  tags:
    - Combat
type: feat
