name: Amateur Swashbuckler
system:
  description:
    value: >-
      <p><em>Though not a swashbuckler, you have and can use
      panache.</em></p><p><strong>Prerequisites</strong>: No levels in a class
      that has the
      @UUID[Compendium.pf1.class-abilities.Item.LPAbzynGlOwYcGx7]{panache} class
      feature.</p><p><strong>Benefit</strong>: You gain a small amount of
      panache and the ability to perform a single 1st-level swashbuckler deed.
      Choose a 1st-level deed from the swashbuckler’s deeds class feature (see
      page 56; you can't select opportune parry and riposte). Once chosen, this
      deed cannot be changed.</p><p>At the start of each day, you gain 1 panache
      point. Throughout the day, you can gain a number of panache points up to a
      maximum of your Charisma modifier (minimum 1). You can regain panache
      points as the swashbuckler’s panache class feature. You can spend these
      panache points to perform the 1st-level deed you chose upon taking this
      feat as well as any other deeds you have gained through feats or magic
      items.</p><p><strong>Special</strong>: If you gain levels in a class that
      has the panache class feature, you can immediately trade this feat for the
      @UUID[Compendium.pf1.feats.Item.vxDz1Rt1XKfFvWBV]{Extra Panache} feat.</p>
      <h3>Combat Trick</h3><p>Choose a second 1st-level swashbuckler deed. You
      can spend panacheACG to use this deed, or you can spend 5 stamina points
      to use either of your deeds in place of panache. If you gain levels in a
      class that grants the panache class feature, you retain the ability to
      spend 5 stamina points in place of panache when using any of your
      1st-level deeds, and this becomes a combat trick of the Extra Panache feat
      (even though that feat is not a combat feat).</p>
