name: Ability Focus
system:
  description:
    instructions: <p>Adjust the DC formula of the special attack by +2.</p>
    value: >-
      <p><em>One of this creature's special attacks is particularly difficult to
      resist.</em></p><p><strong>Prerequisites</strong>: Special
      attack.</p><p><strong>Benefits</strong>: Choose one of the creature's
      special attacks. Add +2 to the DC for all saving throws against the
      special attack on which the creature
      focuses.</p><p><strong>Special</strong>: A creature can gain this feat
      multiple times. Its effects do not stack. Each time the creature takes the
      feat, it applies to a different special attack.</p>
