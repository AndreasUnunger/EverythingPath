name: Bloodstone Manhunter
system:
  description:
    value: >-
      <p><em>You are skilled at fighting criminal humans such as
      bandits.</em></p><p><strong>Prerequisites</strong>: Bloodstone Swords 10
      TPA.</p><p><strong>Benefits</strong>: You gain a +1 bonus on Bluff,
      Knowledge, Perception, Sense Motive, and Survival checks against humans,
      and a +1 bonus on weapon attack and damage rolls against humans. If you
      have a favored enemy bonus against humans, this feat does not stack with
      that bonus.</p>
  tags:
    - Faction
type: feat
