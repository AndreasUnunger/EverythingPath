name: Trapper's Setup
system:
  description:
    value: >-
      <p><em>You have an instinct for waiting until just the right moment to
      spring a hazard or trap.</em></p><p><strong>Prerequisites</strong>: Craft
      (traps) 5 ranks.</p><p><strong>Benefits</strong>: When you manually
      trigger a trap against opponents, that trap receives either a +2
      circumstance bonus on melee attack rolls or a +2 circumstance bonus to its
      saving throw DC.</p>
