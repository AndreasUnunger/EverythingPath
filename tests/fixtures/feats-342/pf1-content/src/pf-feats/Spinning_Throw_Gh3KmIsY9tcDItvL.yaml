name: Spinning Throw
system:
  description:
    value: >-
      <p><em>You whirl your foe around and then let
      go.</em></p><p><strong>Prerequisites</strong>: Combat Expertise, Improved
      Bull Rush, Improved Trip, Improved Unarmed Strike, Ki
      Throw.</p><p><strong>Benefits</strong>: On a successful unarmed trip
      combat maneuver against an opponent your size or smaller, you can spend a
      swift action to attempt a bull rush combat maneuver against that opponent.
      If your bull rush succeeds, you can move that opponent to any unoccupied
      square you threaten, then push that opponent the number of 5-foot
      increments your successful bull rush allows. The target is then knocked
      prone. If the bull rush fails, you can use the Ki Throw feat as normal.
      </p><p>If you also have the Improved Ki Throw feat, a successful bull rush
      allows you to push the opponent into a space secondary targets occupy. You
      resolve this effect as if you used the Improved Ki Throw feat to throw the
      opponent into that space.</p><p><strong>Special</strong>: Per the Ki Throw
      feat, a monk can use ki to affect creatures larger than himself with this
      feat.</p><h3>Combat Trick</h3><p>: If you succeed at the bull rush check,
      you can spend 2 stamina points to push the opponent 5 additional feet, or
      4 stamina points to push the target 10 additional feet.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
