name: Terrifying Assault
system:
  description:
    value: >-
      <p><em>Your foes flee when you appear
      suddenly.</em></p><p><strong>Prerequisites</strong>: Frightening Ambush,
      Intimidate 5 ranks.</p><p><strong>Benefits</strong>: When using Intimidate
      to demoralize an opponent during a surprise round, if you exceed the DC by
      10 or more, you can make the target frightened for 1 round instead of
      shaken.</p>
