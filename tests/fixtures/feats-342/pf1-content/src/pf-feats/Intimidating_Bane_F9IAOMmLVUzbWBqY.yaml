name: Intimidating Bane
system:
  description:
    value: >-
      <p><em>Your bane weapon strikes fear into your
      enemies.</em></p><p><strong>Prerequisites</strong>: Bane class feature,
      Dazzling Display, Weapon Focus, character level
      8th.</p><p><strong>Benefits</strong>: Whenever you use Dazzling Display
      while your bane feature is active, you gain a +2 bonus on the Intimidate
      check that Dazzling Display allows against creatures of the type your bane
      weapon currently affects. Such creatures remain shaken while your bane
      feature is still active and effective against their creature type.</p>
  tags:
    - General
type: feat
