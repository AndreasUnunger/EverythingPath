name: Murderous Sniper
system:
  description:
    value: >-
      <p><em>Your study of death allows you to pinpoint weaknesses from
      afar.</em></p><p><strong>Prerequisites</strong>: Death attack class
      feature.</p><p><strong>Benefits</strong>: You can make a death attack
      using a ranged weapon. Your target must be within 30 feet when attempting
      the death attack. For every additional round you spend studying the
      target, you can extend the range from which you can make a ranged death
      attack by 10 feet.</p>
  tags:
    - Combat
type: feat
