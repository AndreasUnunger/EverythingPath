name: Desperate Swing
system:
  description:
    value: >-
      <p><em>You land your most telling blows in desperate
      situations.</em></p><p><strong>Prerequisites</strong>: Cautious Fighter,
      base attack bonus +1, halfling.</p><p><strong>Benefits</strong>: Once per
      day, you can make a single melee attack while taking the total defense
      action. You take a -4 penalty on attack rolls when making this attack. You
      also gain a +4 bonus on critical confirmation rolls made while fighting
      defensively or making an attack of opportunity using this
      feat.</p><h3>Combat Trick</h3><p>You can spend 5 stamina points to use
      this feat an additional time per day. Each time you use this combat trick,
      you must spend 5 stamina points.</p>
  tags:
    - Combat
    - Racial
    - Halfling
    - Combat Trick
type: feat
