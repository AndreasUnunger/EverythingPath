    value: >-
      <p><em>Whenever you summon your phantom, it is more powerful for a brief
      period of time.</em></p><p><strong>Prerequisites</strong>: Phantom class
      feature.</p><p><strong>Benefits</strong>: Whenever you summon your
      phantom, you can give it a +2 enhancement bonus to its Strength,
      Dexterity, or Charisma. This bonus lasts for 10 minutes after the
      summoning ritual is complete.</p>
