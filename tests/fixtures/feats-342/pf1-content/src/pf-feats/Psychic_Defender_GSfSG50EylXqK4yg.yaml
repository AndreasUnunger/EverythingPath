name: Psychic Defender
system:
  description:
    value: >-
      <p><em>You are adept at defending yourself during psychic
      duels.</em></p><p><strong>Prerequisites</strong>: Int 13, Psychic
      Sensitivity or the ability to cast psychic spells or use psychic
      spell-like abilities, character level
      3rd.</p><p><strong>Benefits</strong>: Each time you enter a psychic duel,
      you gain a number of temporary hit points equal to your manifesting level
      (see Psychic Duels on page 202). These temporary hit points last until the
      end of the psychic duel.</p>
  tags:
    - General
type: feat
