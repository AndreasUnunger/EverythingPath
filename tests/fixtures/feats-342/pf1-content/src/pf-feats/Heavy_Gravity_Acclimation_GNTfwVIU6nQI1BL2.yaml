name: Heavy Gravity Acclimation
system:
  description:
    value: >-
      <p><em>Your muscles work overtime in areas with heavy
      gravity.</em></p><p><strong>Prerequisites</strong>: Str 17 or
      Endurance.</p><p><strong>Benefits</strong>: You do not take the normal
      penalties for being on heavy gravity planes. At the GM's discretion, this
      effect may apply to certain environments on the Material Plane, such as
      high-gravity planets. In addition, your Strength is considered to be 4
      higher for the purpose of determining your carrying capacity.</p>
  tags:
    - General
type: feat
