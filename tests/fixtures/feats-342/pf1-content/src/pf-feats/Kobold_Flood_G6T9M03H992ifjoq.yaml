name: Kobold Flood
system:
  description:
    value: >-
      <p><em>You are an expert at keeping creatures on the
      ground.</em></p><p><strong>Prerequisites</strong>: Combat Expertise,
      Kobold Groundling, Kobold Style, Small size or
      smaller.</p><p><strong>Benefits</strong>: You can make a grapple combat
      maneuver check to mount a prone Medium or Large foe. If you're successful,
      you move into the target's square and are considered to be on top of the
      target. For the target to stand, it must succeed at a combat maneuver
      check to break your grapple.</p>
  tags:
    - Combat
    - Racial
    - Kobold
type: feat
