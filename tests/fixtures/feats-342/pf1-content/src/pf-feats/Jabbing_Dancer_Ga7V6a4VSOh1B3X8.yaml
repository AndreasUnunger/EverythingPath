name: Jabbing Dancer
system:
  description:
    value: >-
      <p><em>You've learned to bend and shift your body to avoid attacks and
      reposition yourself
      advantageously.</em></p><p><strong>Prerequisites</strong>: Dodge, Improved
      Unarmed Strike, Jabbing Style, Mobility; base attack bonus +9, brawler
      level 5th, or monk level 5th.</p><p><strong>Benefits</strong>: Each time
      you hit with an unarmed strike while using Jabbing Style, you can move 5
      feet without provoking an attack of opportunity as long as you move to a
      space adjacent to the opponent you hit with the unarmed strike. If you use
      this feat, you cannot take a 5-foot step during your next
      turn.</p><h3>Combat Trick</h3><p>After you use Jabbing Style to move 5
      feet without provoking attacks of opportunity, if you have at least 1
      stamina point in your stamina pool, you can still take a 5-foot step on
      your next turn.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
