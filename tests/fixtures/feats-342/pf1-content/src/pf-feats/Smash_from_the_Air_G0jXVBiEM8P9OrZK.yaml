name: Smash from the Air
system:
  description:
    value: >-
      <p><em>Your powerful and swift attacks can slice ranged attacks out of the
      air.</em></p><p><strong>Prerequisites</strong>: Str 13, Cut from the Air,
      Power Attack, base attack bonus +9, weapon training class feature with a
      melee weapon.</p><p><strong>Benefits</strong>: You can use Cut from the
      Air against unusually massive ranged weapons (such as boulders or ballista
      bolts) and ranged attacks generated by spell effects. Spell effects that
      do not require attack rolls cannot be deflected.</p>
  tags:
    - Weapon Mastery
type: feat
