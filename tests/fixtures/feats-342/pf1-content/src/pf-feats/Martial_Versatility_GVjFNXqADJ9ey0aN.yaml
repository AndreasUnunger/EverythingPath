name: Martial Versatility
system:
  description:
    value: >-
      <p><em>You further broaden your study of weapons to encompass multiple
      similar weapons.</em></p><p><strong>Prerequisites</strong>: Fighter level
      4th, human.</p><p><strong>Benefits</strong>: Choose one combat feat you
      know that applies to a specific weapon (e.g., Weapon Focus). You can use
      that feat with any weapon within the same weapon
      group.</p><p><strong>Special</strong>: You may take this feat more than
      once. Each time it applies to a different feat.</p><p><strong>Combat
      Trick</strong>: At the start of your turn, you can spend 2 stamina points
      to apply the selected feat to another weapon that is not of the same
      weapon group. You gain this benefit until the start of your next turn.</p>
  tags:
    - Combat
    - Racial
    - Human
type: feat
