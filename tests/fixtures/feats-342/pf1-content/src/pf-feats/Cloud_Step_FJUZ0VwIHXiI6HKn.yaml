name: Cloud Step
system:
  description:
    value: >-
      <p><em>Your tread is of unearthly
      lightness.</em></p><p><strong>Prerequisites</strong>: Spider Step, monk
      level 12th.</p><p><strong>Benefits</strong>: As a move action, you can air
      walk (as the spell) up to half your slow fall distance, maximum 50 feet.
      You must reach a solid, level surface by the end of your turn or you will
      fall.</p>
