name: Shared Insight
system:
  description:
    value: >-
      <p><em>You deftly direct others' attentions where you
      wish.</em></p><p><strong>Prerequisites</strong>: Wis 13,
      half-elf.</p><p><strong>Benefits</strong>: As a move action, you can grant
      all friendly creatures within 30 feet who can see or hear you a +2 bonus
      on Perception checks for a number of rounds equal to your Wisdom modifier
      (minimum 1 round).</p>
