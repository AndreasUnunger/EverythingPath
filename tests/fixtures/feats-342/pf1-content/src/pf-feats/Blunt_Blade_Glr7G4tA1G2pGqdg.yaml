name: Blunt Blade
system:
  description:
    value: >-
      <p><em>With a single curse, you make your rival less fearsome in
      combat.</em></p><p><strong>Prerequisites</strong>: Int 13, base attack
      bonus +6, Use Magic Device 1 rank.</p><p><strong>Benefits</strong>: As a
      standard action, you can curse the accuracy of an enemy you have dealt
      damage to in the last minute. The target must succeed at a Fortitude save
      or it automatically fails to confirm all critical threats. This effect
      lasts for 1 round.</p><p><strong>Special</strong>: If a shaman or witch
      uses this blood hex, the target is unable to deal precision damage or
      sneak attack damage for the hex's duration.</p>
  tags:
    - Blood Hex
type: feat
