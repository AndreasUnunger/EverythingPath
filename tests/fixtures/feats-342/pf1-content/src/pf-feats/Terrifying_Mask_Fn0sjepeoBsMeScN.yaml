name: Terrifying Mask
system:
  description:
    value: >-
      <p><em>Your fiendish visage has made you a truly terrifying spectacle to
      behold, and you can force others to betray their feelings with a single
      look.</em></p><p><strong>Prerequisites</strong>: Cha 13, Monstrous Mask,
      tiefling.</p><p><strong>Benefits</strong>: Anytime you can make a Sense
      Motive check to get a hunch or detect whether someone is trustworthy or
      not, you can choose to instead make an Intimidate check at a -2 penalty.
      This ability only works on creatures of the humanoid type.</p>
  tags:
    - Racial
    - Tiefling
type: feat
