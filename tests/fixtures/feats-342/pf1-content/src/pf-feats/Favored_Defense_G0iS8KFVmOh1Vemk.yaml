name: Favored Defense
system:
  description:
    value: >-
      <p><em>Your cunning is your shield against your quarry's
      attacks.</em></p><p><strong>Prerequisites</strong>: Favored enemy class
      feature.</p><p><strong>Benefits</strong>: Choose one of your favored enemy
      types. You add half your favored enemy bonus to your CMD and as a dodge
      bonus to AC when attacked by a favored
      enemy.</p><p><strong>Special</strong>: You can gain this feat multiple
      times. Its effects do not stack. Each time you take this feat, it applies
      to a new favored enemy type.</p>
  tags:
    - General
type: feat
