name: Lunge (Mythic)
system:
  description:
    value: >-
      <p><em>Your reaching strikes aid your defenses against those you
      hit.</em></p><p><strong>Prerequisites</strong>:
      Lunge.</p><p><strong>Benefits</strong>: Whenever you use Lunge and hit a
      creature with the melee attack, you no longer take a -2 penalty to AC
      against that creature. You can expend one use of mythic power when you use
      Lunge to negate the -2 penalty to AC whether you hit or miss, and gain a
      +2 bonus on attacks of opportunity you make while Lunge is in effect.</p>
  tags:
    - Combat
    - Mythic
type: feat
