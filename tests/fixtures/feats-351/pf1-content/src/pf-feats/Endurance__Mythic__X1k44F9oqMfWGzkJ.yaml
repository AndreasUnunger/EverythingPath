name: Endurance (Mythic)
system:
  description:
    value: >-
      <p><em>Your endurance is truly beyond the
      pale.</em></p><p><strong>Prerequisites</strong>:
      Endurance.</p><p><strong>Benefits</strong>: The bonus on checks and saves
      from Endurance increases by half your tier. You take half the damage when
      you fail a check to avoid nonlethal damage from a forced march, starvation
      and thirst, hot or cold environments, or slow suffocation.</p><p>You can
      sleep in heavy armor without becoming fatigued.</p>
