name: Greater Subjective Slam
system:
  description:
    value: >-
      <p><em>Your gravitational impact is meteoric, and your ability to use the
      act of falling devastating.</em></p><p><strong>Prerequisites</strong>: Con
      15; Wis 15; Subjective Mobility; Subjective Slam; base attack bonus +8 or
      monk level 7th.</p><p><strong>Benefits</strong>: When using Subjective
      Slam, you take only a -1 penalty on the combat maneuver check for every
      100 feet of falling speed, and the maximum damage for such a slam
      increases to 12d6.</p>
  tags:
    - Combat
type: feat
