name: Andoren Falconry
system:
  description:
    value: >-
      <p><em>You know the secret Andoren arts of falconry developed by the
      Novotnian family of Darkmoon
      Vale.</em></p><p><strong>Prerequisites</strong>: Cha 13, Animal Affinity,
      animal companion class feature.</p><p><strong>Benefits</strong>: You
      improve your affinity with birds of prey, such as eagles, falcons, hawks,
      and owls. You gain a +2 bonus on Animal Handling checks made to train or
      control birds of prey. In addition, if you have a bird of prey as an
      animal companion, your animal companion gains one of the following bonuses
      chosen at the time this animal companion is gained: a +1 dodge bonus to
      AC, a +1 morale bonus on all attack rolls, or a +2 morale bonus on all
      Will saves.</p>
  tags:
    - General
type: feat
