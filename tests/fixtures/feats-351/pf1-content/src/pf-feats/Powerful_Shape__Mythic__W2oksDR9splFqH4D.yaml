name: Powerful Shape (Mythic)
system:
  description:
    value: >-
      <p><em>The forms you take in wild shape tower over their natural
      counterparts.</em></p><p><strong>Prerequisites</strong>: Powerful
      Shape.</p><p><strong>Benefits</strong>: You can apply the giant simple
      template (quick rules version, from Pathfinder RPG Bestiary 295) to any
      form you take with wild shape. This replaces the benefit from Powerful
      Shape.</p><p>As a free action, you can expend one use of mythic power to
      combine the benefit from this feat with the benefit from non-mythic
      Powerful Shape for a number of rounds equal to your tier.</p>
  tags:
    - General
    - Mythic
type: feat
