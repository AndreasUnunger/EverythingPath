name: Hemorhaging Venom
system:
  description:
    value: >-
      <p><em>Your venom destroys blood vessels and melts
      bone.</em></p><p><strong>Prerequisites</strong>: Spit Venom, Virulent
      Venom, base attack bonus +7, nagaji.</p><p><strong>Benefits</strong>: Your
      ability to spit poison granted by the Spit Venom feat deals 2d6 points of
      bleed damage on a failed saving throw in addition to all other effects.
      The bleeding can be stopped as normal with a successful DC 15 Heal check
      or the application of any effect that heals hit point damage. In addition,
      you gain one additional use per day of the ability to spit poison granted
      by the Spit Venom feat.</p>
  tags:
    - Combat
    - Racial
    - Nagaji
type: feat
