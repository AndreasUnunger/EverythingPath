name: Janni Rush
system:
  description:
    value: >-
      <p><em>When you leap to the attack, your blows are like bolts from on
      high.</em></p><p><strong>Prerequisites</strong>: Improved Unarmed Strike,
      Janni Style, Janni Tempest, Acrobatics 8 ranks, Perform (dance) 8
      ranks.</p><p><strong>Benefits</strong>: While using Janni Style, you are
      always considered to have a running start when jumping. Further, if you
      jump as part of a charge and make an unarmed strike against the designated
      opponent, a hit allows you to roll the unarmed strike's damage dice twice
      and add the results together before adding modifiers (such as from
      Strength) or extra dice (such as precision-based damage or dice from
      weapon abilities). The extra damage dice are not multiplied on a
      successful critical hit.</p><h3>Combat Trick</h3><p>You can spend 5
      stamina points to multiply the extra damage dice from this feat on a
      critical hit.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
