name: Cry Challenge
system:
  description:
    value: >-
      <p><em>With a ferocious shout or vigorous gestures, you provoke an
      opponent's ire. By tricking the opponent into making a clumsy swing at
      you, you provide an opening for your
      allies.</em></p><p><strong>Prerequisites</strong>:
      Antagonize.</p><p><strong>Benefits</strong>: When you take a 5-foot step,
      you can choose for that step to provoke attacks of opportunity from all
      opponents that threaten you after the step. You gain a +4 dodge bonus to
      AC against attacks of opportunity provoked in this
      manner.</p><p><strong>Normal</strong>: A 5-foot step doesn't provoke an
      attack of opportunity.</p>
  tags:
    - General
type: feat
