name: Diverse Palate
system:
  description:
    value: >-
      <p><em>Your taste for blood is broader than that of other
      dhampirs.</em></p><p><strong>Prerequisites</strong>: Blood Drinker,
      dhampir.</p><p><strong>Benefits</strong>: Choose a humanoid subtype or the
      monstrous humanoid type. You may use your Blood Drinker feat on creatures
      of this subtype or type.</p><p><strong>Special</strong>: You can take this
      feat multiple times. Each time you select it, choose a new humanoid
      subtype or the monstrous humanoid.</p>
