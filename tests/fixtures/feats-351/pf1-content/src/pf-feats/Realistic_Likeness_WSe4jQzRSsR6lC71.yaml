name: Realistic Likeness
system:
  description:
    value: >-
      <p><em>When you are in human form, you can take the shape of a specific
      individual.</em></p><p><strong>Prerequisites</strong>:
      Kitsune.</p><p><strong>Benefits</strong>: You can precisely mimic the
      physical features of any individual you have encountered. When you use
      your racial change shape ability, you can attempt to take the form of an
      individual, granting you a +10 circumstance bonus on Disguise checks made
      to fool others with your impersonation.</p>
  tags:
    - Racial
    - Kitsune
type: feat
