name: Bullseye Shot
system:
  description:
    value: >-
      <p><em>You slow your breath, calm yourself, and hit the bullseye, just as
      you were trained to do.</em></p><p><strong>Prerequisites</strong>:
      Point-Blank Shot, Precise Shot, base attack bonus
      +5.</p><p><strong>Benefits</strong>: You can spend a move action to steady
      your shot. When you do, you gain a +4 bonus on your next ranged attack
      roll before the end of your turn.</p><h3>Combat Trick</h3><p>You can spend
      5 stamina points to use Bullseye Shot as a swift action.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
