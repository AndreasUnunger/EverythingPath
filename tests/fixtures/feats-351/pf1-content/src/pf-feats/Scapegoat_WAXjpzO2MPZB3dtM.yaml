name: Scapegoat
system:
  description:
    value: >-
      <p><em>Your calloused soul attracts curses, even those afflicting others,
      and you have grown resistant to their
      effects.</em></p><p><strong>Prerequisites</strong>: Great Fortitude or
      Iron Will.</p><p><strong>Benefits</strong>: You gain a +2 bonus on saving
      throws against curses. Once per day as a standard action, you can touch a
      creature suffering from a curse effect in an attempt to remove that curse
      from its target. You must attempt a character level check against the DC
      of the curse effect you wish to absorb. If you succeed, the curse is
      removed from the target but immediately affects you instead as if you were
      the original target and had failed your initial saving throw against the
      curse; you are subject to the curse's effects, removal conditions, and
      remaining duration.</p>
  tags:
    - General
type: feat
