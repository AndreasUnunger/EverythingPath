name: Gray Dwarf Magic
system:
  description:
    value: >-
      <p><em>You gain a new spell-like ability from the list of duergar racial
      traits.</em></p><p><strong>Prerequisites</strong>:
      Duergar.</p><p><strong>Benefits</strong>: Choose one spell-like ability
      that is usable once per day and is granted by a duergar racial trait you
      don't have. You can use that spell-like ability once per day, with a
      caster level equal to your character
      level.</p><p><strong>Special</strong>: You can take this feat multiple
      times. Each time you do, you must select a spell-like ability that's
      usable once per day from a different duergar racial trait.</p>
  tags:
    - Racial
    - Duergar
type: feat
