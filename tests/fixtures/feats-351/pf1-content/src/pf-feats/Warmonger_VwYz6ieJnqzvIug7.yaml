  description:
    value: >-
      <p><em>You are adept at instigating wars among those you advise or
      antagonize.</em></p><p><strong>Prerequisites</strong>: Cha 13,
      hobgoblin.</p><p><strong>Benefits</strong>: You gain Bluff and Diplomacy
      as class skills. In addition, you receive a +4 competence bonus on Bluff
      and Diplomacy skill checks when using either skill to convince another
      character to go to war against or attack another creature or group.</p>
