name: Pesh Euphoria
system:
  description:
    value: >-
      <p><em>The calming effects of pesh make you difficult to
      disturb.</em></p><p><strong>Prerequisites</strong>: Sahir-Afiyun or pesh
      addict.</p><p><strong>Benefits</strong>: When you take a dose of pesh, in
      addition to its normal initial effect, you gain a +2 bonus on saves
      against emotion and fear effects. Once per day, if you fail a saving throw
      against an emotion or fear effect while you are under the initial effect
      of pesh, you can attempt another saving throw 1 round later at the same
      DC.</p>
  tags:
    - General
type: feat
