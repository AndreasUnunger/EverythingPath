name: Mutilating Ritualist
system:
  description:
    value: >-
      <p><em>You add a personal sacrifice to heighten the power of your ritual
      magic.</em></p><p><strong>Prerequisites</strong>: Knowledge (arcana) 4
      ranks, Knowledge (religion) 4 ranks, Spellcraft 4
      ranks.</p><p><strong>Benefits</strong>: Once during the casting of an
      occult ritual (Pathfinder RPG Occult Adventures 208), you can inflict 1d6
      hit points of damage per 2 Hit Dice and 1d4 Constitution damage (or
      Charisma damage if you're undead) to yourself as an immediate action with
      a piercing or slashing weapon. You can't reduce or ignore this damage in
      any way. This damage doesn't disrupt the ritual, and you can roll twice
      for the next skill check made as part of a ritual casting and take the
      better result. If the resulting ritual effect has the fear descriptor or
      is in the phantasm subschool, increase its saving throw DC by 1. Multiple
      characters with this feat can each use it once per ritual on their skill
      checks, but the DC increases don't stack.</p>
  tags:
    - General
type: feat
