name: Shadows of Fear
system:
  description:
    value: >-
      <p><em>Your enemies' fear causes them to jump at shadows, diverting their
      attention.</em></p><p><strong>Prerequisites</strong>: Hidden strike +2d8
      or sneak attack +2d6.</p><p><strong>Benefits</strong>: The first time each
      round that you hit a creature suffering from a fear effect, you can deal
      hidden strike or sneak attack damage as if you were flanking that creature
      (improved uncanny dodge and other effects that prevent flanking also
      prevent a hidden strike or sneak attack from this feat).</p>
  tags:
    - Combat
type: feat
