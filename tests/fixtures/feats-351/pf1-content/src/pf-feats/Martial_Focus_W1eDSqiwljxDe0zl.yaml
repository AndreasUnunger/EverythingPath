name: Martial Focus
system:
  description:
    value: >-
      <p><em>You have honed your skills with a group of related
      weapons.</em></p><p><strong>Prerequisites</strong>: Base attack bonus
      +5.</p><p><strong>Benefits</strong>: Choose one fighter weapon group.
      While wielding a weapon from this group with which you are proficient, you
      gain a +1 bonus on damage rolls.</p><p><strong>Special</strong>: The
      Martial Focus feat counts as the weapon training class feature with the
      chosen fighter weapon group for the purpose of weapon mastery feat
      prerequisites and what weapons you can use with weapon mastery feats.</p>
  tags:
    - Combat
type: feat
