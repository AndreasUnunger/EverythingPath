name: Saoc Brethren Scholar
system:
  description:
    value: >-
      <p><em>You have learned to draw additional power from celestial phenomena,
      harnessing their influence for longer than their natural
      duration.</em></p><p><strong>Prerequisites</strong>: Saoc Brethren
      Initiate, Knowledge (arcana) 5 ranks, Knowledge (nature) 5 ranks,
      Knowledge (planes) 5 ranks.</p><p><strong>Benefits</strong>: You increase
      the duration of effects caused by astrological events. The duration of
      effects that last less than a day is increased by 50%, while those that
      last 24 hours or longer last 1 additional day.</p>
  tags:
    - General
type: feat
