name: Touched by Sacred Fire
system:
  description:
    value: >-
      <p><em>Regular contact with an elemental guardian of the Ruby Prince (such
      as Khemet's invisible fire elemental cohort Janhelia) has left you able to
      shrug off many sources of unnatural heat, even if the effort required
      sometimes makes it difficult to defend yourself from
      attacks.</em></p><p><strong>Prerequisites</strong>: Endurance, Risen Guard
      rank, Risen Guard 15 TPA.</p><p><strong>Benefits</strong>: You gain fire
      resistance 5 and a +2 bonus on all saving throws to resist the effects of
      fire or heat. As a swift action, you can increase your fire resistance to
      10 and your save bonus to +4 until your next turn; this causes you to lose
      your Dexterity bonus to Armor Class until your next turn (which leaves you
      vulnerable to sneak attacks).</p>
  tags:
    - Faction
type: feat
