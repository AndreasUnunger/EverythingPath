name: Misdirection Attack
system:
  description:
    value: >-
      <p><em>After misdirecting your opponent's weapon attack, you leave your
      opponent open to further
      violence.</em></p><p><strong>Prerequisites</strong>: Int 13, Combat
      Expertise, Deceitful, Misdirection Redirection, Misdirection Tactics,
      Bluff 10 ranks.</p><p><strong>Benefits</strong>: When you successfully use
      the Misdirection Tactics feat to negate a melee weapon attack, the
      opponent whose attack you negated provokes an attack of opportunity from
      you, even though you normally can't take attacks of opportunity while
      using the total defense action. This effect is in addition to the effect
      gained from Misdirection Redirection.</p>
  tags:
    - Combat
type: feat
