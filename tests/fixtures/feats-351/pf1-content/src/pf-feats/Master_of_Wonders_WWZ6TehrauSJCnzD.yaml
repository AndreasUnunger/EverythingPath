name: Master of Wonders
system:
  description:
    value: >-
      <p><em>Having seen the wonders of the world, you know how to tweak more
      chaos out of a rod of wonder.</em></p><p><strong>Prerequisites</strong>:
      Iron Will, Wonderseeker faction, gnome.</p><p><strong>Benefits</strong>:
      When you activate a rod of wonder, roll d% to determine what effect the
      rod would create. If you desire to do so, you can roll d% again and use
      this second result. You can only use this ability once per round.</p>
  tags:
    - Racial
    - Gnome
type: feat
