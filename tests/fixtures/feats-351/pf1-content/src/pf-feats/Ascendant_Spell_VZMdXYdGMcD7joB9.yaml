img: systems/pf1/icons/skills/yellow_13.jpg
name: Ascendant Spell
system:
  description:
    value: >-
      <p><em>You have learned how to emulate mythic spells using nonmythic
      forces.</em></p><p><strong>Benefits</strong>: You can modify a spell to
      imitate the mythic version of that spell. An ascendant spell uses the
      mythic version of the spell, but doesn't count as a mythic spell for the
      purposes of effects that interact with the spell, unless you are a mythic
      creature. You can't use the augmented version of the mythic spell, or use
      spells effects that require you to expend uses of mythic power (even if
      you have uses of mythic power available).</p><p> An ascendant spell uses
      up a spell slot 5 levels higher than the spell's actual level.</p>
  tags:
    - Metamagic
type: feat
