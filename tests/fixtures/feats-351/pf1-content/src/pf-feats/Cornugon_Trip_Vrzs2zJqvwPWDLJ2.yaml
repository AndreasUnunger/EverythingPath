name: Cornugon Trip
system:
  description:
    value: >-
      <p><em>You can throw your spiked chain to make trip
      attacks.</em></p><p><strong>Prerequisites</strong>: Dex 15, Improved Trip,
      Weapon Focus (spiked chain).</p><p><strong>Benefits</strong>: You may
      throw your spiked chain (as if it were a thrown weapon with a range
      increment of 10 feet) and can make trip attacks when throwing it. Failing
      at this attack does not knock you prone.</p>
  tags:
    - Combat
type: feat
