name: Catfolk Exemplar
system:
  description:
    value: >-
      <p><em>Your feline traits are more defined and prominent than those of
      other members of your race.</em></p><p><strong>Prerequisites</strong>:
      Catfolk.</p><p><strong>Benefits</strong>: You can take the Aspect of the
      Beast feat even if you do not meet the normal prerequisites. Furthermore,
      your catlike nature manifests in one of the following ways. You choose the
      manifestation when you take this feat, and cannot change it later.</p><hr
      /><p><strong>Enhanced Senses (Ex)</strong>: If you have low-light vision,
      you gain the scent catfolk racial trait. If you have the scent racial
      trait, you gain low-light vision.</p><p><strong>Fast Sprinter
      (Ex)</strong>: You gain a 10-foot racial bonus to your speed when using
      the charge, run, or withdraw actions. If you have the sprinter racial
      trait, your racial bonus to speed when using the charge, run, or withdraw
      action increases to a 20-foot bonus.</p><p><strong>Sharp Claws
      (Ex)</strong>: If you do not have the cat's claws racial trait or the
      claws of the beast manifestation from the Aspect of the Beast feat, you
      gain the cat's claws racial trait. If you have either the cat's claws
      racial trait or the claws of the beast manifestation, your claw damage
      increases to 1d6.</p><hr /><p><strong>Special</strong>: You can take this
      feat multiple times. Its effects do not stack. Each time you select it,
      you must choose a different manifestation.</p>
  tags:
    - Racial
    - Catfolk
type: feat
