name: Dog Killer, Horse Hunter
system:
  description:
    value: >-
      <p><em>Embracing fear and hatred of your ancestral foes allows you to make
      particularly telling blows.</em></p><p><strong>Prerequisites</strong>:
      Goblin, Handle Animal 1 rank.</p><p><strong>Benefits</strong>: You gain a
      +2 morale bonus on all attack and damage rolls made against dogs and
      horses (including doglike and horse-like targets such a nightmares or
      worgs). Additionally, you gain a +2 bonus on rolls to confirm critical
      hits against these foes.</p>
  tags:
    - Racial
    - Goblin
type: feat
