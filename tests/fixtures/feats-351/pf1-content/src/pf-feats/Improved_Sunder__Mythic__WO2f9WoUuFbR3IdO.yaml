name: Improved Sunder (Mythic)
system:
  description:
    value: >-
      <p><em>Your mighty smashing blows demolish
      objects.</em></p><p><strong>Prerequisites</strong>: Improved
      Sunder.</p><p><strong>Benefits</strong>: You gain a bonus equal to half
      your tier on checks to sunder, and to your CMD when an opponent tries to
      sunder an object used by you. These bonuses stack with those granted by
      Improved Sunder.</p><p>Furthermore, you can make an attack of opportunity
      against any creature that attempts to sunder an object used by you, unless
      it also has this feat.</p>
  tags:
    - Combat
    - Mythic
type: feat
