name: Oread Burrower
system:
  description:
    value: >-
      <p><em>The ground parts for you at the slightest touch, allowing you to
      dig with great speed.</em></p><p><strong>Prerequisites</strong>: Stony
      Step, character level 9th, oread.</p><p><strong>Benefits</strong>: You
      gain a burrow speed equal to 1/2 your base speed. You can burrow through
      sand, dirt, clay, gravel, or similar materials, but not solid stone. You
      do not leave a hole behind, nor is your passage marked on the surface.</p>
  tags:
    - Racial
    - Oread
type: feat
