name: Pure Legion Assault
system:
  description:
    value: >-
      <p><em>The Pure Legion trained you to apply your knowledge of religions to
      predicting and defeating divine
      servitors.</em></p><p><strong>Prerequisites</strong>: Bluff 1 rank,
      Knowledge (religion) 1 rank, Pure Legion Recruit trait (Pathfinder Player
      Companion: People of the Sands 21).</p><p><strong>Benefits</strong>: You
      gain a +2 bonus on saving throws against divine spells and effects and
      abilities from outsiders. If you must attempt a saving throw against a
      divine spell, you gain a +1 bonus on attack rolls against the creature
      that cast the spell.</p>
  tags:
    - Combat
type: feat
