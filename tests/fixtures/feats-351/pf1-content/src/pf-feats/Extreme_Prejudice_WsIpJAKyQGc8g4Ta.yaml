name: Extreme Prejudice
system:
  description:
    value: >-
      <p><em>Your hatred of a particular type of creature has honed your killer
      instinct.</em></p><p><strong>Prerequisites</strong>: Seething Hatred,
      sneak attack +3d6, studied target class
      feature.</p><p><strong>Benefits</strong>: When you succeed at a sneak
      attack against a creature you selected as the target of your Seething
      Hatred feat, you use d8s to roll sneak attack damage instead of
      d6s.</p><h3>Combat Trick</h3><p>When you succeed at a sneak attack against
      a creature that is not the target of your Seething Hatred feat, you can
      spend 5 stamina points to treat the creature as if it were the target of
      your Seething Hatred for that attack.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
