name: Curse Mastery
system:
  description:
    value: >-
      <p><em>You can coax curses from necromantic magic
      items.</em></p><p><strong>Prerequisites</strong>: Use Magic Device 3
      ranks, base Fortitude save bonus +6.</p><p><strong>Benefits</strong>: You
      can cause an item that has a necromancy spell of 3rd level or higher in
      its construction requirements to cast bestow curse. You can use this feat
      once per day, plus an additional time per day at base Fortitude save bonus
      +9 and +12.</p><p><strong>Pathfinder Society<br /></strong>When qualifying
      for and calculating the benefits of an item mastery feat, a PC uses the
      base Fortitude save bonus from only one of his classes.</p>
  tags:
    - Item Mastery
type: feat
