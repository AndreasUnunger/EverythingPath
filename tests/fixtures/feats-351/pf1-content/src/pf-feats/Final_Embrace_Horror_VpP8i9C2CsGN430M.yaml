name: Final Embrace Horror
system:
  description:
    value: >-
      <p><em>Your constricting attack has become stronger and more
      lethal.</em></p><p><strong>Prerequisites</strong>: Str 15, Int 3; naga,
      serpentfolk, or creature that has the constrict special attack; Final
      Embrace; base attack bonus +6.</p><p><strong>Benefits</strong>: A creature
      that takes damage from your constrict attack is also shaken until the
      start of your next turn.</p><h3>Combat Trick</h3><p>When a creature is
      damaged by your constrict ability, you can spend 5 stamina points to
      sicken that creature until the start of your next turn.</p>
  tags:
    - Combat
    - Racial
    - Serpentfolk
    - Combat Trick
type: feat
