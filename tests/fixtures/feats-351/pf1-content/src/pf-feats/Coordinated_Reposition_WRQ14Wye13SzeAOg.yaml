name: Coordinated Reposition
system:
  description:
    value: >-
      <p><em>You are skilled in coordinating combat positioning with your
      allies.</em></p><p><strong>Prerequisites</strong>:
      Step-Up.</p><p><strong>Benefits</strong>: Whenever an ally with this feat
      who is threatening a creature you are threatening takes a 5-foot step, you
      can move 5 feet as an immediate action. This movement does not provoke
      attacks of opportunity.</p>
  tags:
    - Teamwork
type: feat
