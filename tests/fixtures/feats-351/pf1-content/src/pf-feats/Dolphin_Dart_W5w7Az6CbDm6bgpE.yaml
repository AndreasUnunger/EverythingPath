name: Dolphin Dart
system:
  description:
    value: >-
      <p><em>Like a dolphin, you can quickly dart at a foe and
      retreat.</em></p><p><strong>Prerequisites</strong>: Dolphin Style,
      Improved Unarmed Strike, Swim 6 ranks, base attack bonus +6 or monk level
      6th.</p><p><strong>Benefits</strong>: While in Dolphin Style, as a
      standard action underwater you can move up to half your swim speed, make a
      single melee attack against a creature within your reach, and then retreat
      back to your previous position. Your movement and attack don't provoke
      attacks of opportunity, even if your foe has an ability that allows
      attacks of opportunity with triggers other than moving out of a threatened
      area.</p>
  tags:
    - Combat
type: feat
