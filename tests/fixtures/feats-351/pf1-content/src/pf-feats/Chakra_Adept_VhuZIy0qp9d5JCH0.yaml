name: Chakra Adept
system:
  description:
    value: >-
      <p><em>Your body and soul have grown more accustomed to kundalini
      energy.</em></p><p><strong>Prerequisites</strong>: Chakra Initiate,
      ability to awaken the heart chakra.</p><p><strong>Benefits</strong>: Your
      pool of serpent-fire ki increases to 4 points. When you maintain your
      chakras as a swift action without opening a new chakra, you can choose to
      attempt either the Fortitude save or the Will save instead of
      both.</p><p>In addition, after you stop spending ki to maintain your
      chakras, the kundalini energy lingers in your body. On the first round
      during which you spend no ki to maintain your chakras, your highest chakra
      closes and you can spend a swift action to use any one of the abilities of
      your remaining open chakras. On the next round after that, all of your
      chakras close, and you must spend 1 point of ki and a swift action to
      start again from your root chakra.</p>
  tags:
    - General
type: feat
