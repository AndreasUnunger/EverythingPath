name: Virulent Venom
system:
  description:
    value: >-
      <p><em>The poison that drips from your fangs is potent enough to burn
      through flesh and wood.</em></p><p><strong>Prerequisites</strong>: Spit
      Venom, nagaji.</p><p><strong>Benefits</strong>: Your ability to spit
      poison granted by the Spit Venom feat deals 1d6 points of acid damage plus
      an additional 1d6 points of acid damage for every 3 Hit Dice you have, in
      addition to all other effects. This additional damage affects creatures
      even if they are immune to poison or succeed at their Fortitude saving
      throws. In addition, you gain one additional use per day of the ability to
      spit poison granted by the Spit Venom feat.</p>
  tags:
    - Combat
    - Racial
    - Nagaji
type: feat
