name: Dolphin Style
system:
  description:
    value: >-
      <p><em>You fight like a dolphin, bunching your enemies up together to make
      it easier to pick them off.</em></p><p><strong>Prerequisites</strong>:
      Improved Unarmed Strike, Swim 3 ranks, base attack bonus +3 or monk level
      3rd.</p><p><strong>Benefits</strong>: You gain a +1 bonus on melee attack
      rolls against any creature adjacent to at least two of its other allies as
      long as you aren't flanking that creature, and your melee attacks ignore
      any bonus to AC gained by use of the aid another action.</p>
  tags:
    - Combat
    - Style
type: feat
