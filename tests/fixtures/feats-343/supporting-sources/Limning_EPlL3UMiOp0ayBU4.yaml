name: Limning
system:
  description:
    value: >-
      <p><strong>Aura</strong> faint evocation <strong>CL</strong>
      5th</p><p><strong>Slot</strong> weapon quality; <strong>Price</strong> +1
      bonus;</p><p>When a <em>liming </em>weapon is wielded, a pale glow
      outlines it. On a successful strike against a creature affected by a means
      of magical concealment, the weapon outlines the creature in <em>faerie
      fire </em>(as the spell) for 1 round. Magical means of concealment include
      <em>blur</em>, <em>displacement</em>, <em>invisibility</em>, and similar
      effects, whether from a spell, spell-like ability, or supernatural means,
      but not those provided by extraordinary abilities. A <em>liming
      </em>weapon has no special effect against creatures merely hiding or
      concealed by nonmagical means, or those hidden by environmental conditions
      (even magical) such as darkness or
      fog.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft Magic
      Arms and Armor, <em>faerie fire</em>; <strong>Price</strong> -</p>
