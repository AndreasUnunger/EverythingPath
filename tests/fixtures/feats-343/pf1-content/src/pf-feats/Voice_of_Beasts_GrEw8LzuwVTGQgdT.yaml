name: Voice of Beasts
system:
  description:
    value: >-
      <p><em>Your deep connection with nature allows you to speak with all
      manner of living creatures.</em></p><p><strong>Prerequisites</strong>:
      Wild shape class feature.</p><p><strong>Benefits</strong>: While you are
      using wild shape, you gain the ability to communicate with all animals.
      This acts as speak with animals, though the effect is supernatural in
      nature and can't be dispelled.</p>
