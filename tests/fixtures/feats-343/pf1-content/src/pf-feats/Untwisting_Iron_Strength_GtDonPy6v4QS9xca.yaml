name: Untwisting Iron Strength
system:
  description:
    value: >-
      <p><em>You are a master at breaking even the toughest of
      objects.</em></p><p><strong>Prerequisites</strong>: Str 15; Wis 13;
      Perfect Style; base attack bonus +9 or monk level
      9th.</p><p><strong>Benefits</strong>: When using Perfect Style, your
      attacks ignore an amount of hardness equal to your character level.
      Additionally, you gain a +4 bonus on Strength checks to break objects. If
      you spend 1 ki point as a swift action, you also gain the benefits of
      Improved Sunder for 1 round.</p><h3>Combat Trick</h3><p>: You can spend 2
      stamina points instead of 1 ki point when using Untwisting Iron
      Strength.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
