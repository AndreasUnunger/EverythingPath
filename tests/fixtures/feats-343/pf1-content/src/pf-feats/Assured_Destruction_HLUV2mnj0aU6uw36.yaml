name: Assured Destruction
system:
  description:
    value: >-
      <p><em>Your zeal for death--including your own--brings even greater harm
      to those around you.</em></p><p><strong>Prerequisites</strong>: Empowered
      Daemonic Pact, urdefhan.</p><p><strong>Benefits</strong>: When you use
      your daemonic pact ability and allow your soul to be consumed, you
      automatically succeed. The amount of negative energy damage dealt by your
      daemonic pact ability increases to 3d6 points, and the profane bonus to
      the save DC increases to +4.</p><p><strong>Normal</strong>: The daemonic
      pact ability has a 50% chance of success per attempt, and it deals 2d6
      points of negative energy damage.</p>
  tags:
    - General
type: feat
