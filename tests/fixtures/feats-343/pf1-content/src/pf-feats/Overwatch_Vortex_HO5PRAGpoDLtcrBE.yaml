name: Overwatch Vortex
system:
  description:
    value: >-
      <p><em>You are ready to respond to many more of your foes'
      actions.</em></p><p><strong>Prerequisites</strong>: Overwatch Style,
      Overwatch Tactician, Precise Shot, Rapid Shot, Weapon Focus with the
      chosen weapon, base attack bonus +11.</p><p><strong>Benefits</strong>:
      While using the Overwatch Style, as a full-round action you can ready up
      to four ranged attacks, each with its own triggering event. You take a -2
      penalty on attack rolls made with these readied actions.</p>
  tags:
    - Combat
type: feat
