name: Giant Vendetta
system:
  description:
    value: >-
      <p><em>Your life has been shaped by an encounter with
      giants.</em></p><p><strong>Prerequisites</strong>: You must have been
      knocked unconscious in an encounter with a challenging giant foe or have a
      regional background trait tied to giants (such as those presented in this
      section).</p><p><strong>Benefits</strong>: Choose one kind of giant (such
      as hill or stone); you must choose a kind of giant that allows you to
      qualify for this feat. You gain a +1 bonus on attack rolls against giants
      of that kind. You also gain a +1 bonus on Knowledge (local) checks
      regarding giants of that kind and can attempt those Knowledge checks
      untrained. In addition, you gain a +1 dodge bonus to AC against all
      giants.</p><p><strong>Goal</strong>: Defeat a giant of the chosen kind
      that is a challenging foe.</p><p><strong>Completion Benefit</strong>: You
      gain a +1 bonus on initiative checks when facing a giant of any kind,
      which increases to +2 against giants of the selected kind. Whenever you
      defeat a giant of any kind that is a challenging foe, the benefits of this
      feat that apply only to a specific kind of giant now also apply to giants
      of the kind you defeated.</p>
  tags:
    - Story
type: feat
