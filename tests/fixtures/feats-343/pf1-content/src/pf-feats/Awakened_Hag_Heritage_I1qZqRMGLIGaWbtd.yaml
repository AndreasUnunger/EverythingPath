name: Awakened Hag Heritage
system:
  description:
    value: >-
      <p><em>Through ritual or force of will, you have awakened the latent power
      inherited from your hag mother.</em></p><p><strong>Prerequisites</strong>:
      Iron Will or Mother's Gift, changeling.</p><p><strong>Benefits</strong>:
      Your hag heritage racial abilities grow more powerful, granting you a +2
      racial bonus on saving throws to resist arcane spells. You also gain a
      secondary ability that varies by your hag heritage; see the individual
      changeling heritage entries on pages 5-9.</p><p><strong>Special</strong>:
      As you grow closer to your hag nature, you occasionally manifest signs of
      supernatural evil. Each day at midnight, there is a 50% chance you radiate
      an evil aura for the purposes of divination spells and spell-like
      abilities for the following 24 hours. On these days, you also cause minor
      displays of corruption nearby--such as curling pages or spoiling milk--at
      the GM's discretion</p>
  tags:
    - General
type: feat
