name: Blundering Defense
system:
  description:
    value: >-
      <p><em>Your feverish and sometimes comical defensive techniques offer
      enough distraction to aid
      allies.</em></p><p><strong>Prerequisites</strong>: Cautious Fighter,
      halfling.</p><p><strong>Benefits</strong>: Whenever you fight defensively
      or use the total defense action, allies gain a luck bonus to AC and CMD
      equal to 1/2 the dodge bonus you gain from the action you are taking.
      Allies only gain this bonus while they are adjacent to you.</p><h3>Combat
      Trick</h3><p>You can spend 5 stamina points to cause allies within 10 feet
      who are also in your melee reach to gain the benefits of this feat.</p>
  tags:
    - Combat
    - Racial
    - Halfling
    - Combat Trick
type: feat
