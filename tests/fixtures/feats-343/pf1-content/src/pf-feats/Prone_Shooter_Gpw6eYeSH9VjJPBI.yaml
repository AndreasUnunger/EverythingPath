name: Prone Shooter
system:
  description:
    value: >-
      <p><em>Take a reduced penalty to your AC against melee attacks while
      prone</em></p><p><strong>Prerequisites</strong>: Base attack bonus
      +1.</p><p><strong>Benefits</strong>: If you have been prone since the end
      of your last turn, the penalty to your Armor Class against melee attacks
      made against you is reduced to -2. In addition, the bonus to your Armor
      Class against ranged attacks made against you is increased to
      +6.</p><h3>Combat Trick</h3><p>: As long as you have at least 1 stamina
      point in your stamina pool, you gain the bonuses from this feat even if
      you haven't been prone since the end of your last turn.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
