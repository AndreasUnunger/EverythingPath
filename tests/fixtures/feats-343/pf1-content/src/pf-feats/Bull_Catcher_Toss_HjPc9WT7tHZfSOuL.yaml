name: Bull-Catcher Toss
system:
  description:
    value: >-
      <p><em>You can use a charging foe's momentum to throw them
      aside.</em></p><p><strong>Prerequisites</strong>: Dex 13, Bull-Catcher
      Style, Improved Grapple, Improved Unarmed Strike; base attack bonus +8,
      brawler level 4th, or monk level 4th.</p><p><strong>Benefits</strong>:
      When you successfully grapple a creature with the Bull-Catcher Style feat,
      you can immediately move that creature into any square you threaten. After
      it is placed, you can break your grapple as an immediate action to move
      the creature an additional 5 feet in any direction. You can't use this
      maneuver to move a foe into a space that is intrinsically dangerous or
      unstable, such as a pit, wall of fire, or midair.</p>
  tags:
    - Combat
type: feat
