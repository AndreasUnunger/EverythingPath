name: Neither Elf nor Human
system:
  description:
    value: >-
      <p><em>You have removed yourself from your heritage so thoroughly that
      even magic does not recognize
      you.</em></p><p><strong>Prerequisites</strong>: Exile's Path, Seen and
      Unseen, character level 11th, half-elf.</p><p><strong>Benefits</strong>:
      You are not considered elven or human for the purpose of harmful spells or
      effects based on your type, like a bane weapon or a ranger's favored enemy
      class feature.</p>
  tags:
    - Racial
    - Half-Elf
type: feat
