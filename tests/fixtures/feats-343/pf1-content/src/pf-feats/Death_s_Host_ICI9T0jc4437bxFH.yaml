name: Death's Host
system:
  description:
    value: >-
      <p><em>You become harder to kill when possessed by the
      undead.</em></p><p><strong>Prerequisites</strong>: Spell Focus
      (necromancy).</p><p><strong>Benefits</strong>: Whenever you are possessed
      by an undead creature that you do not directly control, you gain a +4
      bonus on saving throws against death effects. You don't fall unconscious
      at negative hit points, and if you or the undead possessing you is forced
      to attempt a saving throw to resist ending the possession effect, you or
      your possessor gains a +4 bonus on the saving throw.</p>
  tags:
    - General
type: feat
