name: Agent of Purity
system:
  description:
    value: >-
      <p><em>You have devoted your life to purging blight from the
      world.</em></p><p><strong>Prerequisites</strong>: A friend or ally must
      have been significantly corrupted by a specific natural or supernatural
      blight, or you must have a regional background trait tied to a specific
      blight.</p><p><strong>Benefits</strong>: Choose one type of terrain
      affiliated with the relevant blight. You gain a +1 bonus on Knowledge
      (geography) and Knowledge (nature) checks regarding the blighted terrain
      and can attempt those Knowledge checks untrained. You also gain a +1 bonus
      on attack rolls against creatures corrupted by the relevant blight, and
      you gain a +1 bonus on saving throws against the abilities of such
      creatures.Goal: Slay or cure at least 50 creatures corrupted by the
      relevant blight, and then slay a challenging foe closely connected to
      spreading the blight.</p><p><strong>Goal</strong>: Slay or cure at least
      50 creatures corrupted by the relevant blight, and then slay a challenging
      foe closely connected to spreading the
      blight.</p><p><strong>Special</strong>: Once per day, you can cast any one
      of the following spells as a spell-like ability, using your character
      level as your caster level: consecrate, neutralize poison, remove curse,
      or remove disease.</p>
  tags:
    - Story
type: feat
