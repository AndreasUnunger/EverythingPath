name: Blood Salvage
system:
  description:
    value: >-
      <p><em>You do not need to drink blood from a living creature to gain
      healing benefits.</em></p><p><strong>Prerequisites</strong>: Blood
      Drinker, dhampir.</p><p><strong>Benefits</strong>: You can use your Blood
      Drinker feat on a dead creature of the appropriate humanoid subtype. The
      creature must have died less than 6 hours
      beforehand.</p><p><strong>Normal</strong>: You only benefit from the Blood
      Drinker feat if you consume fresh blood from a living creature.</p>
  tags:
    - Racial
    - Dhampir
type: feat
