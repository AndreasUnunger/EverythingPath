name: Overachiever
system:
  description:
    value: >-
      <p><em>Others made you feel small for too long, and now you drive yourself
      hard and never settle for second
      place.</em></p><p><strong>Prerequisites</strong>: You must have been
      defeated by the same individual, organization, or creature type at least
      four times, or have the Boarding School or Humiliated
      background.</p><p><strong>Benefits</strong>: You take only half the normal
      penalties from exhaustion. Choose one skill upon selecting this feat. Once
      per day, you can forgo rest to study or practice, gaining a +3 bonus on
      all checks attempted with your selected skill for 24 hours but becoming
      fatigued in the process. If you rest to recover from this fatigue, this
      bonus ends (but not if you recover from your fatigue in other ways, such
      as via lesser restoration). Forgoing rest for this purpose does not
      interfere with a spellcaster's ability to prepare
      spells.</p><p><strong>Goal</strong>: You must utterly humiliate a member
      of your hated group by besting that creature at an activity for which it
      is known or in which it takes pride. This opponent's Hit Dice must exceed
      your current character level by at least 1.</p><p><strong>Completion
      Benefit</strong>: Each time you forgo rest to study or practice, you can
      apply this feat's +3 bonus to a different skill. If you have 10 or more
      ranks in the skill selected, this bonus increases to +6.</p>
  tags:
    - Story
type: feat
