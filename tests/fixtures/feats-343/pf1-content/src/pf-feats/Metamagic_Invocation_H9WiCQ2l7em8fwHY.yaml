name: Metamagic Invocation
system:
  description:
    value: >-
      <p><em>You have further refined your combination of elemental power and
      spellcasting with metamagic
      techniques.</em></p><p><strong>Prerequisites</strong>: Metakinesis class
      feature.</p><p><strong>Benefits</strong>: Choose a metamagic feat from the
      following list: Enlarge Spell, Extend Spell, Intuitive Spell, Logical
      Spell, Quicken Spell, Reach Spell, or Tenacious SpellUI. When casting a
      spell via Kinetic Invocation, you can increase its burn cost to augment
      the spell with that metamagic feat.</p><p>The burn cost increase is equal
      to the spell level increase applied by the feat. Augmenting a spell
      increases its casting time as if it were cast
      spontaneously.</p><p><strong>Special</strong>: You can take this feat more
      than once. Each time you take this feat, select another metamagic feat;
      you can augment a spell with multiple feats by accepting additional points
      of burn equal to the total increased spell level.</p>
  tags:
    - General
type: feat
