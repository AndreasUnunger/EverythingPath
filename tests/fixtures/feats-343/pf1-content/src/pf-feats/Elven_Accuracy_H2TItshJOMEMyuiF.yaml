name: Elven Accuracy
system:
  description:
    value: >-
      <p><em>Your sharp eyesight makes difficult shots
      easier.</em></p><p><strong>Prerequisites</strong>:
      Elf.</p><p><strong>Benefits</strong>: If you miss due to concealment when
      making a ranged attack with a longbow or shortbow (including composite
      bows), you can reroll your miss chance roll one time to see if you
      actually hit.</p><h3>Combat Trick</h3><p>If you miss an attack with a
      longbow or shortbow due to concealment, you can spend 5 stamina points to
      automatically succeed at the miss chance reroll from this feat.</p>
  tags:
    - Combat
    - Racial
    - Elf
    - Combat Trick
type: feat
