name: Crusader's Fist
system:
  description:
    value: >-
      <p><em>You pour divine energy into the enemy you
      strike.</em></p><p><strong>Prerequisites</strong>: Lay on hands class
      feature or touch of corruption class feature, Improved Unarmed Strike,
      base attack bonus +6.</p><p><strong>Benefits</strong>: When you attack
      with an unarmed strike and hit a creature that you can harm with your lay
      on hands or touch of corruption feature, you can use a swift action to
      expend a daily use of that feature to deal its normal damage as if you had
      hit with the feature's normal touch attack. This extra damage is not
      multiplied if you scored a critical hit.</p><p><strong>Combat
      Trick</strong>: When you use Crusader's Fist and confirm a critical hit,
      you can spend 5 stamina points to multiply the extra damage for that
      critical hit.</p>
  tags:
    - Combat
type: feat
