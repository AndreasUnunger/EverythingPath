name: Cleaving Finish
system:
  description:
    value: >-
      <p><em>When you strike down an opponent, you can continue your swing into
      another target.</em></p><p><strong>Prerequisites</strong>: Str 13, Cleave,
      Power Attack.</p><p><strong>Benefits</strong>: If you make a melee attack,
      and your target drops to 0 or fewer hit points as a result of your attack,
      you can make another melee attack using your highest base attack bonus
      against another opponent within reach. You can make only one extra attack
      per round with this feat.</p><h3>Combat Trick</h3><p>After making a
      Cleaving Finish attack, if you bring another target below 0 hit points in
      the same round, you can spend 5 stamina points to make another Cleaving
      Finish attack.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
