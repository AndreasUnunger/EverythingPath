  description:
    value: >-
      <p><em>You are especially resistant to
      magic.</em></p><p><strong>Prerequisites</strong>: Dwarf, hardy racial
      trait.</p><p><strong>Benefits</strong>: You receive a +4 racial bonus on
      saving throws against spells and spell-like abilities. This replaces the
      normal bonus from the dwarf's hardy racial
      trait.</p><p><strong>Normal</strong>: Dwarves normally receive a +2 racial
      bonus on saving throws against spells and spell-like abilities.</p>
