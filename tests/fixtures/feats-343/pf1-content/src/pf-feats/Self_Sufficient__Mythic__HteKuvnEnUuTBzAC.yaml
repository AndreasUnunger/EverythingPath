name: Self-Sufficient (Mythic)
system:
  description:
    value: >-
      <p><em>Independence comes naturally to you, and you have mastered taking
      care of yourself.</em></p><p><strong>Prerequisites</strong>:
      Self-Sufficient.</p><p><strong>Benefits</strong>: The bonus on Heal and
      Survival skill checks from Self-Sufficient increases by 2. In addition,
      you can expend one use of mythic power to treat a Heal or Survival check
      as if you had rolled a natural 20. You must decide to use this ability
      before making the roll.</p>
