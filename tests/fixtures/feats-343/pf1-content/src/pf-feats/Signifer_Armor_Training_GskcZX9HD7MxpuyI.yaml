name: Signifer Armor Training
system:
  description:
    value: >-
      <p><em>You have learned the art of spellcasting while wearing signifer
      armor.</em></p><p><strong>Prerequisites</strong>: Arcane Armor Mastery,
      Arcane Armor Training, Heavy Armor Proficiency, caster level 7th, must
      swear allegiance to a single Hellknight
      order.</p><p><strong>Benefits</strong>: As a swift action, you can reduce
      the arcane spell failure chance due to the armor you are wearing by 30%
      for any spells you cast this round. This benefit applies only if you are
      wearing armor with 'Hellknight' in its name. This bonus replaces, and does
      not stack with, the bonuses granted by Arcane Armor Mastery, Arcane Armor
      Training, and similar feats and effects.</p><p><strong>Pathfinder
      Society<br /></strong>In order to swear allegiance to a Hellknight order
      for the purpose of qualifying for character options in this book, a PC
      must be lawful-aligned.</p>
  tags:
    - General
type: feat
