name: Greater Blind-Fight
system:
  description:
    value: >-
      <p><em>Your enemies cannot hide from
      you.</em></p><p><strong>Prerequisites</strong>: Perception 15 ranks,
      Improved Blind-Fight.</p><p><strong>Benefits</strong>: Your melee attacks
      ignore the miss chance for less than total concealment, and you treat
      opponents with total concealment as if they had normal concealment (20%
      miss chance instead of 50%). You may still reroll a miss chance percentile
      roll as normal.</p><p>If you successfully pinpoint an invisible or hidden
      attacker, that attacker gets no advantages related to hitting you with
      ranged attacks, regardless of the range. That is, you don't lose your
      Dexterity bonus to Armor Class, and the attacker doesn't get the usual +2
      bonus for being invisible.</p><p><strong>Special</strong>: The Greater
      Blind-Fight feat is of no use against a character who is the subject of a
      blink spell.</p><h3>Combat Trick</h3><p>When you attack a creature subject
      to the blink spell, you can spend 5 stamina points. If you do, your
      Greater Blind-Fight feat works against that creature until the beginning
      of your next turn, either treating the blink miss chance as 20% and
      allowing a reroll or ignoring the blink miss chance if you have a way to
      see or strike ethereal creatures.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
