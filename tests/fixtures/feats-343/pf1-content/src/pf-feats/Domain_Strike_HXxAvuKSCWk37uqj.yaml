name: Domain Strike
system:
  description:
    value: >-
      <p><em>You unleash a domain power upon your enemy as part of your unarmed
      strike.</em></p><p><strong>Prerequisites</strong>: Domain class feature,
      Improved Unarmed Strike.</p><p><strong>Benefits</strong>: When you gain
      this feat, choose one domain-granted power that you can use to affect no
      more than one opponent. If you make a successful unarmed strike against an
      opponent, in addition to dealing your unarmed strike damage, you can use a
      swift action to deliver the effects of the chosen granted power to that
      opponent. Doing so provokes no attacks of
      opportunity.</p><p><strong>Special</strong>: You can take this feat
      multiple times. Each time you take it, you apply it to a different
      qualifying domain power.</p><h3>Combat Trick</h3><p>You can spend 2
      stamina points to apply the effects of your chosen domain power as a free
      action instead of a swift action.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
