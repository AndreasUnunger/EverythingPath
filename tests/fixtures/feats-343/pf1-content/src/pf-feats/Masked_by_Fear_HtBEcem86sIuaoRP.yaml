name: Masked by Fear
system:
  description:
    value: >-
      <p><em>You embody all that you fear while wearing your
      mask.</em></p><p><strong>Prerequisites</strong>: Nameless One; base Will
      save bonus +6 or bravery class feature.</p><p><strong>Benefits</strong>:
      By donning a mask etched with your greatest terrors, you are able to
      eschew fear completely. While benefiting from the Nameless One feat, when
      you suffer the cowering, frightened, or panicked condition, that condition
      causes you to act as if shaken instead of imposing its normal effects. In
      addition, whenever you attempt a skill check (normally Intimidate) to
      demoralize an opponent, you gain a +3 bonus on the check.</p>
  tags:
    - General
type: feat
