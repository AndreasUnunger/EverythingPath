name: Circling Mongoose
system:
  description:
    value: >-
      <p><em>You keep your opponent on the defensive as you circle around
      threateningly.</em></p><p><strong>Prerequisites</strong>: Dex 13, Dodge,
      Mobility, Spring Attack, base attack bonus
      +6.</p><p><strong>Benefits</strong>: When you are adjacent to a foe, as a
      full-round action, you can take a full-attack action to make melee attacks
      against the foe, moving 5 feet before each attack. You must move 5 feet
      before each melee attack you make, and can't exceed your maximum speed,
      exceed your maximum number of attacks in a round, or attack any other
      target until the beginning of your next turn. You must remain adjacent to
      the foe, and your movement provokes attacks of opportunity as normal
      unless you succeed at the appropriate Acrobatics checks. If your first
      attack against the foe hits, you are considered to be flanking the foe on
      your second attack. Subsequent attacks made as part of the full-attack
      action continue to be treated as if you were flanking the foe until one of
      your attacks misses, at which point your attacks are treated
      normally.</p><p><strong>Normal</strong>: A character without this feat is
      limited to only one 5-foot step during a full attack, taken before, after,
      or between attacks.</p>
  tags:
    - Combat
type: feat
