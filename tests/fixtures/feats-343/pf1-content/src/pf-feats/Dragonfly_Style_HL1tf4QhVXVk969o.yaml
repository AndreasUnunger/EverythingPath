name: Dragonfly Style
system:
  description:
    value: >-
      <p><em>You can leap off walls and objects to strike from
      above.</em></p><p><strong>Prerequisites</strong>: Wis 13, Improved Unarmed
      Strike, Acrobatics 2 ranks, Climb 2
      ranks.</p><p><strong>Benefits</strong>: You add your Wisdom modifier to
      Acrobatics checks in addition to your Dexterity modifier. While using this
      style, when you are adjacent to a vertical surface or object capable of
      supporting your weight, such as a wall or a tree, you gain a +1 bonus on
      melee attack rolls against opponents your size or smaller, as if you were
      on higher ground.</p>
  tags:
    - Combat
    - Style
type: feat
