name: Expanded Enhance Arrows
system:
  description:
    value: >-
      <p><em>Your magical arrows produce a wider range of
      powers.</em></p><p><strong>Prerequisites</strong>: Enhance arrows class
      feature.</p><p><strong>Benefits</strong>: You add corrosive to the list of
      special properties you can grant your nonmagical arrows with your enhance
      arrows ability at 3rd level. At 5th level, you can add the ghost touch,
      limning, or planar special ability instead of distance. At 7th level, you
      can add the corrosive burst special ability.</p>
  tags:
    - General
type: feat
