name: Raging Regeneration
system:
  description:
    value: >-
      <p><em>Your rage pushes your ability to regenerate beyond its normal
      limits.</em></p><p><strong>Prerequisites</strong>: Rage class ability,
      regeneration, troll.</p><p><strong>Benefits</strong>: While you are
      raging, fire and acid damage don't make your regeneration stop functioning
      on the round following the attack, and instead reduce the number of hit
      points regained by regeneration each round by 2 until the end of your next
      turn.</p>
  tags:
    - Combat
    - Monster
    - Troll
type: feat
