name: Crowd of Bullies
system:
  description:
    value: >-
      <p><em>Your failed attempt to humiliate a foe reveals its weaknesses to
      your allies.</em></p><p><strong>Prerequisites</strong>:
      Half-orc.</p><p><strong>Benefits</strong>: Whenever you fail a combat
      maneuver check, your allies within 30 feet who also have this feat gain a
      +2 circumstance bonus on combat maneuver checks of the same type against
      the same foe for 1 round.</p>
  tags:
    - Combat
    - Teamwork
type: feat
