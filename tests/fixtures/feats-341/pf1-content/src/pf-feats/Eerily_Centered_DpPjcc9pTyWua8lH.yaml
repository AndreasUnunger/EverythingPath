name: Eerily Centered
system:
  description:
    value: >-
      <p><em>Little can shake your peaceful
      temperament.</em></p><p><strong>Prerequisites</strong>: Bleachling racial
      trait, gnome.</p><p><strong>Benefits</strong>: You gain a +4 racial bonus
      on saving throws against spells and effects with the emotion descriptor.
      Effects with the fear descriptor or that grant you a morale bonus affect
      you for only half the normal duration (minimum 1 round), and such effects
      that you can activate on yourself (such as a barbarian's rage) require you
      to expend daily uses or rounds of those abilities at twice the normal
      rate.</p>
  tags:
    - Racial
    - Gnome
type: feat
