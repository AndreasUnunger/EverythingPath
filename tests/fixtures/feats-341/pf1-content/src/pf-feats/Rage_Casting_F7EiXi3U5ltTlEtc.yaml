name: Rage Casting
system:
  description:
    value: >-
      <p><em>Your blood is raw and potent power, and you can burn it to empower
      your spells.</em></p><p><strong>Prerequisites</strong>: Blood casting
      class feature.</p><p><strong>Benefits</strong>: When you cast a bloodrager
      spell, as a swift action you can sacrifice some of your life force to
      augment the spell's potency. You can opt to take up to 1d6 points of
      damage per spell level of the spell you are casting, choosing the amount
      of dice before rolling. You cannot overcome this damage in any way, and it
      cannot be taken from temporary hit points. For each of these damage dice
      you roll, the DC of the spell you are casting increases by 1.</p>
  tags:
    - General
type: feat
