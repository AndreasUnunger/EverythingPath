name: Improved Plane Shift
system:
  description:
    value: >-
      <p><em>You're an expert at traveling the various realms of the Great
      Beyond via plane shift.</em></p><p><strong>Prerequisites</strong>: Wizard
      level 9th.</p><p><strong>Benefits</strong>: Add plane shift to your spell
      list and to your spellbook as a 5th-level wizard spell. The time required
      for you to identify a portal's destination is reduced to 1 round. In
      addition, you automatically identify any plane on which you
      arrive.</p><p><strong>Normal</strong>: Plane shift is a 7th-level wizard
      spell.</p><p><strong>Special</strong>: A wizard can select this as a
      wizard bonus feat.</p>
  tags:
    - General
type: feat
