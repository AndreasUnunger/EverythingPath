name: Sword and Pistol
system:
  description:
    value: >-
      <p><em>You effortlessly pair melee and ranged
      weaponry.</em></p><p><strong>Prerequisites</strong>: Dex 13, Point-Blank
      Shot, Rapid Shot, Snap Shot, Two-Weapon Fighting, base attack bonus
      +6.</p><p><strong>Benefits</strong>: When you use the Two-Weapon Fighting
      feat while wielding a melee weapon and a crossbow or firearm, your attacks
      with the crossbow or firearm provoke no attacks of opportunity from foes
      that you threaten with your melee weapon.</p><p><strong>Normal</strong>:
      Making a ranged attack provokes attacks of opportunity.</p><h3>Combat
      Trick</h3><p>: When you use the Two-Weapon Fighting feat while wielding a
      melee weapon and a crossbow or firearm, as long as you have 1 stamina
      point in your stamina pool, you gain a +1 bonus on all attack rolls made
      with the crossbow or firearm.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
