name: Expert Cartographer
system:
  description:
    value: >-
      <p><em>You are skilled at drawing quality maps, making your cartographic
      works both more useful and more valuable when
      sold.</em></p><p><strong>Prerequisites</strong>: Craft (maps) 3
      ranks.</p><p><strong>Benefits</strong>: You gain a +4 bonus on Craft
      (maps) checks when creating a map, as well as 1 additional Discovery Point
      (see page 124 for more information about Discovery Points). If you succeed
      at the check by 5 or more, the list price of the map increases by 20%.</p>
