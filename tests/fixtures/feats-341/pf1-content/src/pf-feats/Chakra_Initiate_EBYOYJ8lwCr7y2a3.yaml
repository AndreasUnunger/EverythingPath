  description:
    value: >-
      <p><em>You have an extra wellspring of kundalini energy that you can use
      to open your chakras.</em></p><p><strong>Prerequisites</strong>: Ability
      to awaken the root chakra.</p><p><strong>Benefits</strong>: You gain a
      pool that holds 3 points of serpentfire ki, which you can use only to open
