img: systems/pf1/icons/races/aasimar.png
name: Heavenly Radiance
system:
  description:
    value: >-
      <p><em>Your heavenly light can be used in a variety of
      ways.</em></p><p><strong>Prerequisites</strong>: Aasimar, daylight
      spell-like ability, sufficiently high level (see
      below).</p><p><strong>Benefits</strong>: You gain one additional use per
      day of daylight. Choose one spell from the table below; by expending a use
      of daylight, you may use this spell as a spell-like ability. To select a
      spell, you must meet the minimum character level for its listing in the
      table. The save DC for this spell is
      Charisma-based.</p><p><table><tr><td>Spell-Like Ability</td><td> Minimum
      Character Level</td></tr> <tr><td>Flare burst</td><td>1st</td></tr>
      <tr><td>Wake of light</td><td>3rd</td></tr> <tr><td>Searing
      light</td><td>5th</td></tr><tr><td>Wandering star
      motes</td><td>7th</td></tr> <tr><td>Sunbeam (one beam
      only)</td><td>9th</td></tr></table></p><p><strong>Special</strong>: You
      may take this feat multiple times. Each time you select it, you gain an
      additional use of daylight and may select another spell from the
      table.</p>
  tags:
    - Racial
    - Aasimar
type: feat
