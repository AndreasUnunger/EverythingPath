name: Sleep Venom
system:
  description:
    value: >-
      <p><em>You can change the nature of your toxic spittle to put your enemies
      to sleep.</em></p><p><strong>Prerequisites</strong>:
      Vishkanya.</p><p><strong>Benefits</strong>: As a swift action, you may
      alter the effects of your venom so the target falls unconscious. This
      changes the initial and secondary effect of your venom to the following:
      initial effect staggered for 1d4 rounds; secondary effect unconsciousness
      for 1 minute. You must make the decision to alter your venom before you
      apply it to a weapon.</p><p><strong>Normal</strong>: Vishkanya venom deals
      Dexterity damage.</p>
  tags:
    - Racial
    - Vishkanya
type: feat
