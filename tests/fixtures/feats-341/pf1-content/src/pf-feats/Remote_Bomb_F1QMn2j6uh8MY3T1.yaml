name: Remote Bomb
system:
  description:
    value: >-
      <p><em>You can set off your delayed bombs at great
      distances.</em></p><p><strong>Prerequisites</strong>: Delayed bomb
      discovery.</p><p><strong>Benefits</strong>: The maximum delay for your
      delayed bombs increases to a number of minutes equal to your level.</p><p>
      If you have line of effect to your delayed bomb, you may detonate it
      earlier than its preset time by making a DC 20 Intelligence check; the DC
      increases by +1 for every 10 feet of distance between you and the
      bomb.</p>
