name: Cooperative Crafting
system:
  description:
    value: >-
      <p><em>Your assistance makes item crafting far more
      efficient.</em></p><p><strong>Prerequisites</strong>: 1 rank in any Craft
      skill, any item creation feat.</p><p><strong>Benefits</strong>: You can
      assist another character in crafting mundane and magical items. You must
      both possess the relevant Craft skill or item creation feat, but either
      one of you can fulfill any other prerequisites for crafting the item. You
      provide a +2 circumstance bonus on any Craft or Spellcraft checks related
      to making an item, and your assistance doubles the gp value of items that
      can be crafted each day.</p>
  tags:
    - General
type: feat
