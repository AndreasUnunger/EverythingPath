name: Dispelling Critical
system:
  description:
    value: >-
      <p><em>Your blows attack the physical and arcane forms of your enemies at
      the same time.</em></p><p><strong>Prerequisites</strong>: Arcane Strike,
      base attack bonus +11, ability to cast dispel
      magic.</p><p><strong>Benefits</strong>: If you have dispel magic prepared
      or can cast it spontaneously, when you score a critical hit against an
      opponent, you may use a swift action to cast dispel magic to make a
      targeted dispel against that opponent.</p>
  tags:
    - Critical
type: feat
