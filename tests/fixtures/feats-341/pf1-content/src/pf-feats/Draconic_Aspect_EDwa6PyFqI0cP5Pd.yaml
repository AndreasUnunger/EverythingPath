name: Draconic Aspect
system:
  description:
    value: >-
      <p><em>You possess some of the qualities of your dragon
      ancestors.</em></p><p><strong>Prerequisites</strong>:
      Kobold.</p><p><strong>Benefits</strong>: Your scales take on the color and
      some of the resistances of one of the chromatic dragons. Choose one of the
      following chromatic dragon types: black (acid), blue (electricity), green
      (acid), red (fire), or white (cold). Your scales take on the color of that
      dragon, and you gain resistance 5 to the dragon color's corresponding
      energy type.</p><p><strong>Special</strong>: If you have the dragon-scaled
      racial trait, your scale color does not change and you gain a +1 natural
      armor bonus instead.</p>
  tags:
    - Racial
    - Kobold
type: feat
