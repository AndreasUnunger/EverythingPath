name: Crane Style
system:
  description:
    value: >-
      <p><em>Your unarmed fighting techniques blend poise with graceful
      defense.</em></p><p><strong>Prerequisites</strong>: Dodge, Improved
      Unarmed Strike, base attack bonus +2 or monk level
      1st.</p><p><strong>Benefits</strong>: You take only a -2 penalty on attack
      rolls for fighting defensively. While using this style and fighting
      defensively or using the total defense action, you gain an additional +1
      dodge bonus to your Armor Class.</p><h3>Combat Trick</h3><p>While using
      this style and fighting defensively or using the total defense action,
      when you are targeted with a melee attack, you can spend up to 3 stamina
      points and take an immediate action to increase your dodge bonus to AC
      against that attack by an amount equal to the number of stamina points you
      spent.</p>
  tags:
    - Combat
    - Style
    - Combat Trick
type: feat
