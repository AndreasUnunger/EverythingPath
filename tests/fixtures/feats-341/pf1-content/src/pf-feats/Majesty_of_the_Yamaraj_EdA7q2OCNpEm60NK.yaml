name: Majesty of the Yamaraj
system:
  description:
    value: >-
      <p><em>The magistrates of death can breathe death and decay. You were in
      the presence of a final judge once and your soul remembers that moment
      still.</em></p><p><strong>Prerequisites</strong>: Channel energy 5d6,
      duskwalker, ghost hunter racial trait.</p><p><strong>Benefits</strong>:
      When you channel positive energy to harm undead, you can expend your ghost
      hunter racial ability as a free action. Your channeled energy takes the
      form of spectral beetles and other insectile scavengers, dealing 50% more
      damage to the undead. You also gain an additional daily use of ghost
      hunter.</p>
  tags:
    - Racial
    - Duskwalker
type: feat
