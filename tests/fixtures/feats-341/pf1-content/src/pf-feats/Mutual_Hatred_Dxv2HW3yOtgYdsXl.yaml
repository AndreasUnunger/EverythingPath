name: Mutual Hatred
system:
  description:
    value: >-
      <p><em>Others hate you, and their hatred feeds your
      own.</em></p><p><strong>Benefits</strong>: You gain a +1 bonus on attack
      rolls and damage rolls against creatures whose hatred racial trait or
      favored enemy class feature applies to you. For instance, an orc would
      gain this bonus against all dwarves and against rangers who chose humanoid
      (orc) as a favored enemy.</p>
  tags:
    - Combat
type: feat
