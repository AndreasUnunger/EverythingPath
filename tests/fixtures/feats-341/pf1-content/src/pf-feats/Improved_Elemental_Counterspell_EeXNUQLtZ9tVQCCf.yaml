name: Improved Elemental Counterspell
system:
  description:
    value: >-
      <p><em>You can charge your kinetic blast with disruptive elemental energy
      that tears apart elemental
      spells.</em></p><p><strong>Prerequisites</strong>: Two basic blast wild
      talents from two different elements, expanded element class feature,
      kinetic blast class feature.</p><p><strong>Benefits</strong>: You can use
      a readied kinetic blast to counterspell any spell of equal or lower level,
      provided that the target spell has any of the following descriptors: air,
      cold, darkness, earth, electricity, fire, force, light, or
      water.</p><p><strong>Normal</strong>: A readied kinetic blast can be used
      to counterspell spells that share its descriptor.</p>
  tags:
    - General
type: feat
