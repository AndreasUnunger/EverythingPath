name: Savage Display
system:
  description:
    value: >-
      <p><em>With your victory and a roar, you push yourself on with increased
      savagery.</em></p><p><strong>Prerequisites</strong>: Dazzling
      Display.</p><p><strong>Benefits</strong>: When you spend a swift action to
      make a performance combat check, you gain a +2 bonus on your performance
      combat check and gain a +1d6 bonus on damage rolls until the end of your
      next turn. This extra damage is not precision damage.</p><p><strong>Combat
      Trick</strong></p><p>When using this feat, you can spend 2 stamina points
      to gain a +2d6 bonus on damage rolls (instead of +1d6).</p>
  tags:
    - Combat
    - Performance
type: feat
