name: Improved Snap Shot
system:
  description:
    value: >-
      <p><em>You can take advantage of your opponent's vulnerabilities from a
      greater distance, and without exposing
      yourself.</em></p><p><strong>Prerequisites</strong>: Dex 15, Point-Blank
      Shot, Rapid Shot, Snap Shot, Weapon Focus, base attack bonus
      +9.</p><p><strong>Benefits</strong>: You threaten an additional 5 feet
      with Snap Shot.</p><p><strong>Normal</strong>: Making a ranged attack
      provokes attacks of opportunity.</p><h3>Combat Trick</h3><p>At the end of
      your turn, you can spend 5 stamina points to threaten an additional 15
      feet with Snap ShotAPG (instead of an additional 10 feet) until you take
      an attack of opportunity against an opponent in the expanded threat range
      or the beginning of your next turn, whichever comes first.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
