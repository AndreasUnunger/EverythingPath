name: Frozen Skin
system:
  description:
    value: >-
      <p><em>Rumors abound that winter half-orcs spend so much time in the snow
      that a thin layer of ice covers their
      skin.</em></p><p><strong>Prerequisites</strong>: Con 15, frostkin
      half-orc.</p><p><strong>Benefits</strong>: You gain cold resistance 3. If
      you already have cold resistance, it is increased by 3 instead.</p>
