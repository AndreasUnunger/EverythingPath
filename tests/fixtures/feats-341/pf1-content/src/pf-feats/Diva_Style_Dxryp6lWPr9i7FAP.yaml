name: Diva Style
system:
  description:
    value: >-
      <p><em>You employ song, dance, or some other method of performance to
      distract your enemies from the battle at
      hand.</em></p><p><strong>Prerequisites</strong>: Cha 13; base attack bonus
      +1 or bard level 1st.</p><p><strong>Benefits</strong>: While using this
      style, you can use any Perform skill in place of Bluff to feint in combat.
      You can attempt a Perform check to feint as a move action when you begin a
      bardic performance.</p>
  tags:
    - Combat
    - Style
type: feat
