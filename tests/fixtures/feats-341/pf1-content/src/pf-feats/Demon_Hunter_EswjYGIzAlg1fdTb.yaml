name: Demon Hunter
system:
  description:
    value: >-
      <p><em>You are well-versed in demonic
      lore.</em></p><p><strong>Prerequisites</strong>: Knowledge (planes) 6
      ranks.</p><p><strong>Benefits</strong>: You gain a +2 bonus on Knowledge
      (planes) checks to know the powers and abilities of demons. You gain a +2
      morale bonus on all attack rolls and a +2 morale bonus on caster level
      checks to penetrate spell resistance made against creatures with the demon
      subtype you recognize as demons.</p><h3>Combat Trick</h3><p>When you
      successfully identify a demon using Knowledge (planes), you can spend up
      to 9 stamina points to increase the morale bonus on attack rolls and
      caster level checks from Demon Hunter by 1 per 3 stamina points spent.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
