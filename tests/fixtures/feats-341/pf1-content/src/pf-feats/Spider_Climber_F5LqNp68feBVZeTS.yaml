name: Spider Climber
system:
  description:
    value: >-
      <p><em>You tread where only arachnids
      dare.</em></p><p><strong>Prerequisites</strong>: Character level 3rd,
      drow.</p><p><strong>Benefits</strong>: You can cast spider climb once per
      day as a spell-like ability, using your character level as the caster
      level. Furthermore, you gain a +4 bonus on saving throws against the web
      special attacks of spiders and the effects of web and other similar spells
      (such as the web cloud spell).</p>
  tags:
    - Racial
    - Drow
type: feat
