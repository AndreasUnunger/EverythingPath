name: Spirit Vision
system:
  description:
    value: >-
      <p><em>You retain your senses when seeking a possession
      target.</em></p><p><strong>Prerequisites</strong>: Magic jar as a known
      spell or spell-like ability, Wis 15</p><p><strong>Benefits</strong>: When
      you sense life forces while seeking a host, you can observe them as you
      could when you were in your own body. Attempting to possess a body is a
      standard action.</p>
