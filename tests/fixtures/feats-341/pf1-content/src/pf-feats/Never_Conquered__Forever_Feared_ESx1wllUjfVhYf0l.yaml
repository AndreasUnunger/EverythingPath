name: Never Conquered, Forever Feared
system:
  description:
    value: >-
      <p><em>You are dauntless in battle, and your lineage echoes with
      awe-inspiring power.</em></p><p><strong>Prerequisites</strong>: Be a
      member of House Heskillar, or have the Adopted by Dragons, Path of
      Righteous Rage, or Proud Heritage
      background.</p><p><strong>Benefits</strong>: Your stern demeanor gives you
      a +2 bonus on Intimidate checks. If you have 10 or more ranks in
      Intimidate, this bonus increases to +4. You also gain a +2 bonus on saves
      against paralysis and sleep effects.</p><p><strong>Goal</strong>: You must
      individually slay an appropriate number of significant foes in succession,
      without retreating or withdrawing from a fight.</p><p><strong>Completion
      Benefit</strong>: You can display your imposing presence as a free action
      when you take an offensive action, such as an attack or a charge.
      Opponents within 30 feet of you must succeed at a Will save or become
      shaken for 3d6 rounds. The DC of this save is equal to 10 + 1/2 your
      character level + your Charisma modifier. This ability does not cause
      opponents that are already shaken to become frightened, and opponents with
      more Hit Dice than your character level are immune to the effect. This is
      a mind-affecting fear effect.</p>
  tags:
    - Story
type: feat
