name: Dazzling Display (Mythic)
system:
  description:
    value: >-
      <p><em>You can quickly deter others with your martial
      mastery.</em></p><p><strong>Prerequisites</strong>: Dazzling
      Display.</p><p><strong>Benefits</strong>: While wielding the weapon with
      which you have Weapon Focus, you can use Dazzling Display as a standard
      action with a -5 penalty on your Intimidate check, as a move action with a
      -10 penalty, or as a swift action with a -20 penalty. You can expend one
      use of mythic power when you make a Dazzling Display to make those
      affected by the display frightened rather than shaken.</p>
  tags:
    - Combat
    - Mythic
type: feat
