name: Critical Conduit
system:
  description:
    value: >-
      <p><em>You are deadly when delivering your master's
      magic.</em></p><p><strong>Prerequisites</strong>: Deliver touch spells
      ability, familiar.</p><p><strong>Benefits</strong>: When delivering a
      touch spell for your master, the critical threat range of your touch
      attack is doubled. This feat does not stack with Improved Critical or
      other effects that increase critical threat range.</p>
