name: Illusive Gnome Surprise
system:
  description:
    value: >-
      <p><em>You can use gnome weapons in unusual
      ways.</em></p><p><strong>Prerequisites</strong>: Int 13, Combat Expertise,
      Gnome Weapon Focus, Illusive Gnome Style, Improved
      Feint.</p><p><strong>Benefits</strong>: While using Illusive Gnome Style,
      you gain a +2 bonus on combat maneuver checks to perform dirty tricks and
      on Bluff checks to feint. In addition, when you successfully use Bluff to
      feint against a foe, instead of denying that foe its Dexterity bonus to
      AC, you can treat one 'gnome' weapon that you are wielding as if it had
      one of the following weapon special features: blocking, brace, disarm,
      distracting, performance, sunder, or trip. This benefit applies only
      against that foe and lasts for a number of rounds equal to your Charisma
      modifier (minimum 1).</p>
  tags:
    - Combat
    - Racial
    - Gnome
type: feat
