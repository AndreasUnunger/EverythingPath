name: Expanded Hunter Tactics
system:
  description:
    value: >-
      <p><em>You're able to train your allies as you do your animal
      companion.</em></p><p><strong>Prerequisites</strong>: Hunter tactics class
      feature.</p><p><strong>Benefits</strong>: As a move action, you can grant
      a teamwork feat you know to a single ally within 30 feet who can see and
      hear you. The selected ally gains the benefits of this bonus feat for 1
      round plus 1 additional round for every 2 character levels you have, but
      only while the ally is adjacent to you or your animal companion. A given
      ally can benefit from this feat only once per day.</p>
  tags:
    - Combat
type: feat
