name: Experimental Spellcaster
system:
  description:
    value: >-
      <p><em>Despite casting spells, you dabble in the art of
      wordcasting.</em></p><p><strong>Prerequisites</strong>: Ability to cast
      spells.</p><p><strong>Benefits</strong>: Select one class that grants you
      the ability to cast spells. You can now use the slots from that class to
      cast a limited number of words of power spells. Add all of the target
      words to your spell list and your spellbook, familiar, or list of spells
      known. In addition, add the boost meta word and one effect word of any
      level you can cast in the chosen class.</p>
  tags:
    - Words of Power
type: feat
