name: Magnum Opus
system:
  description:
    value: >-
      <p><em>You seek to create a true
      masterpiece.</em></p><p><strong>Prerequisites</strong>: You must either
      have sold five or more self-created works of art worth a total of at least
      5, 000 gp, have performed at least five performances for audiences of 50
      or more while achieving a great performance result or better on your
      Perform check, or have the Virtuoso
      background.</p><p><strong>Benefits</strong>: Choose a single Craft or
      Perform skill. Whenever you take 10 with this skill, treat your die result
      as a 15 instead.</p><p><strong>Goal</strong>: Either sell a single
      self-created work of art for at least 25,000 gp, perform at least 10
      performances for audiences of 100 or more while achieving an extraordinary
      result or better, or win the artistic patronage of the ruler of a country
      or city of at least 100,000 people. In each case, you must achieve this
      using the skill chosen above.</p><p><strong>Completion Benefit</strong>:
      You gain a +5 bonus on skill checks made with your chosen skill, and a +2
      bonus on all other Craft and Perform checks for which you have at least 1
      rank.</p>
  tags:
    - Story
type: feat
