name: Kudzu Takeover
system:
  description:
    value: >-
      <p><em>Your magical nature infuses your vines, further obscuring grappled
      foes' vision--even for opponents with enhanced
      senses.</em></p><p><strong>Prerequisites</strong>: Dex 13, base attack
      bonus +6 or monk level 6th, Greater Grapple, Improved Grapple, Improved
      Unarmed Strike, Kudzu Grappler, Kudzu Invasion, vine
      leshy.</p><p><strong>Benefits</strong>: Opponents blinded by your Kudzu
      Grappler feat increase their miss chance against creatures they attack by
      20%. If the opponent has means of ignoring blindness, such as blindsight,
      they instead treat other creatures as if these creatures had normal
      concealment (20% miss chance).</p><p><strong>Normal</strong>: All
      opponents are considered to have total concealment (50% miss chance)
      against blinded creatures.</p>
  tags:
    - Combat
type: feat
