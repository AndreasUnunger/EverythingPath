name: Rapid Recovery
system:
  description:
    value: >-
      <p><em>When you heal damage with your nanite surge, you also remove
      harmful effects.</em></p><p><strong>Prerequisites</strong>: Rapid Repair,
      Con 13, nanite surge ability.</p><p><strong>Benefits</strong>: When you
      heal damage using Rapid Repair, you remove any and all of the following
      conditions: blinded, confused, dazzled, deafened, shaken, sickened, and
      staggered. You cannot cure blindness or deafness caused by loss of sensory
      organs.</p>
  tags:
    - General
type: feat
