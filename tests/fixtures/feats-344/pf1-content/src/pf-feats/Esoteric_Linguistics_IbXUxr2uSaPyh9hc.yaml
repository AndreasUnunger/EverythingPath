name: Esoteric Linguistics
system:
  description:
    value: >-
      <p><em>You can decipher even the most exotic of writings, including those
      that contain magic.</em></p><p><strong>Prerequisites</strong>: Skill Focus
      (Linguistics).</p><p><strong>Benefits</strong>: You can attempt a
      Linguistics check in place of a Use Magic Device check to activate a
      scroll, or in place of a Spellcraft check to identify a scroll. You must
      still have (or emulate) the ability score required to cast a spell of the
      desired level, and you cannot use Linguistics on the check to emulate the
      required ability score.</p>
  tags:
    - General
type: feat
