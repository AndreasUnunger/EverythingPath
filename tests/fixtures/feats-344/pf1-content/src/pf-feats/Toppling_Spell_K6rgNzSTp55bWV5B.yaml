img: systems/pf1/icons/conditions/prone.png
name: Toppling Spell
system:
  description:
    value: >-
      <p><em>Your spells with the force descriptor knock the affected creatures
      prone.</em></p><p><strong>Benefits</strong>: The impact of your force
      spell is strong enough to knock the target prone. If the target takes
      damage, fails its saving throw, or is moved by your force spell, make a
      trip check against the target, using your caster level plus your casting
      ability score bonus (Wisdom for clerics, Intelligence for wizards, and so
      on). This does not provoke an attack of opportunity. If the check fails,
      the target cannot attempt to trip you or the force effect in
      response.</p><p>A toppling spell only affects spells with the force
      descriptor. A toppling spell uses up a spell slot one level higher than
      the spell's actual level.</p>
  tags:
    - Metamagic
type: feat
