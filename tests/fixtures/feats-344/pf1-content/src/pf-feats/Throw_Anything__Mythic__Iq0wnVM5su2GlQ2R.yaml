name: Throw Anything (Mythic)
system:
  description:
    value: >-
      <p><em>You're so skilled at throwing weapons that it hardly matters what
      you throw.</em></p><p><strong>Prerequisites</strong>: Throw
      Anything.</p><p><strong>Benefits</strong>: You gain a +2 bonus on attack
      rolls and damage rolls made using an improvised thrown weapon or splash
      weapon. This bonus stacks with the bonus from the non-mythic Throw
      Anything feat. If you miss with a thrown splash weapon, it always lands
      adjacent to its target regardless of how many range increments it was
      thrown.</p>
  tags:
    - Combat
    - Mythic
type: feat
