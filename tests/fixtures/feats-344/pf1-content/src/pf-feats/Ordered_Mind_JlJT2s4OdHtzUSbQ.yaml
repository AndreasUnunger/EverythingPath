name: Ordered Mind
system:
  description:
    value: >-
      <p><em>You can modify a variety of your spells to use as
      counterspells.</em></p><p><strong>Prerequisites</strong>: Caster level
      7th, any lawful alignment.</p><p><strong>Benefits</strong>: The DC of your
      Spellcraft check to identify an opponent's spell is equal to 20 + the
      spell level of the opponent's spell, but for your counterspell you can
      cast any spell from the same school of your foe's spell. The level of the
      spell used to counterspell must be equal to or higher than the level of
      your foe's spell.</p><p><strong>Normal</strong>: The Spellcraft DC to
      identify an opponent's spell is equal to 15 + the spell's level.
      Generally, a spell can only counter itself.</p>
  tags:
    - General
type: feat
