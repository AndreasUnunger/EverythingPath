name: Focused Fey Expertise
system:
  description:
    value: >-
      <p><em>Your attacks strike true against capricious targets like
      fey.</em></p><p><strong>Prerequisites</strong>: Favored enemy (fey) class
      feature.</p><p><strong>Benefits</strong>: You gain a bonus on attack rolls
      to confirm critical hits equal to half your favored enemy (fey) bonus. You
      treat your weapon attacks against fey as cold iron for the purpose of
      overcoming damage reduction and regeneration.</p>
