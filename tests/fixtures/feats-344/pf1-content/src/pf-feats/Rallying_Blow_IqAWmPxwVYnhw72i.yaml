name: Rallying Blow
system:
  description:
    value: >-
      <p><em>When you strike true in battle, you wash away allies'
      fear.</em></p><p><strong>Prerequisites</strong>: Aura of
      courage.</p><p><strong>Benefits</strong>: When you confirm a critical hit
      against an enemy, any fear effect affecting allies within 30 feet is
      reduced by one step. Panicked becomes frightened, frightened becomes
      shaken, and shaken is removed. In addition, any ally suffering other
      effects from a failed save against a fear effect, such as the paralysis
      from a mummy's despair aura, receives a new save against the effect at the
      original DC.</p>
  tags:
    - General
type: feat
