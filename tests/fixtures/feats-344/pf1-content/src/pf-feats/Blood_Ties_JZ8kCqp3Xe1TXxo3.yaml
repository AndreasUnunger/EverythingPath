name: Blood Ties
system:
  description:
    value: >-
      <p><em>Pointing out your shared kinship with someone gives you the chance
      to win over creatures associated with your
      bloodline.</em></p><p><strong>Prerequisites</strong>: Bluff 1 rank,
      bloodline class feature, gnome.</p><p><strong>Benefits</strong>: When
      attempting a Diplomacy check to influence a creature with a plausible
      connection to your sorcerous bloodline, you may instead make a Bluff
      check. For example, a gnome sorcerer with the draconic bloodline may use
      this feat against dragons and their kin, but no other creatures.</p>
  tags:
    - Racial
    - Gnome
type: feat
