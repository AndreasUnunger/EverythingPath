name: Hide Worker
system:
  description:
    value: >-
      <p><em>You excel at crafting armor made from the hides of animals or
      monsters.</em></p><p><strong>Prerequisites</strong>: Craft (armor) 3
      ranks, Knowledge (nature) 3 ranks.</p><p><strong>Benefits</strong>: You
      gain a +4 bonus on Craft (armor) checks to create armor or shields from
      the hides of living creatures (such as dragonhide). If you succeed at a
      Craft (armor) check to create armor or shields from the hides of living
      creatures by 5 or more, you also decrease the cost to make the item by
      10%.</p>
  tags:
    - General
type: feat
