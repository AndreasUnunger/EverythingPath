name: Sprightly Armor
system:
  description:
    value: >-
      <p><em>You make the most of your armor's magical
      capabilities.</em></p><p><strong>Prerequisites</strong>: Dex 13, base
      attack bonus +11 or fighter level 8th, armor training class feature,
      proficiency with light armor.</p><p><strong>Benefits</strong>: You add
      your armor's enhancement bonus as a bonus on your initiative
      checks.</p><h3>Combat Trick</h3><p>: You can spend 5 stamina points as an
      immediate action to gain a circumstance bonus on your Reflex saves equal
      to your armor's enhancement bonus for 1 turn. (See page 17.)</p>
  tags:
    - Armor Mastery
    - Combat
    - Combat Trick
type: feat
