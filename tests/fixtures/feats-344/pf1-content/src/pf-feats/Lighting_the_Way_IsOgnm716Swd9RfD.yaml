name: Lighting the Way
system:
  description:
    value: >-
      <p><em>You seek to lead others through your pious
      example.</em></p><p><strong>Prerequisites</strong>: Be a member of House
      Zespire, or have the Devoted, Exemplar, Marked by the Gods, or Righteous
      Mentor background.</p><p><strong>Benefits</strong>: Once per day as a
      standard action, you can give all allies within 30 feet who can hear you a
      +1 bonus on attack rolls and on saving throws against mind-affecting
      effects for 1 minute.</p><p><strong>Goal</strong>: Establish your religion
      in an existing settlement where it isn't present. You can do this by
      having a settlement gain the Holy Site or Pious quality for devotion to
      your deity, or change its government to a theocracy based on your
      religion.</p><p><strong>Completion Benefit</strong>: You can spontaneously
      convert any 2nd-level or higher divine spell into enthrall and can
      spontaneously convert any 3rd-level or higher divine spell into
      suggestion.</p>
  tags:
    - Story
type: feat
