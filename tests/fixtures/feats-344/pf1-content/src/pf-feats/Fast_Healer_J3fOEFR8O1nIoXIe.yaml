name: Fast Healer
system:
  description:
    value: >-
      <p><em>You benefit greatly from your healing, be it from spells or natural
      healing.</em></p><p><strong>Prerequisites</strong>: Con 13, Diehard,
      Endurance.</p><p><strong>Benefits</strong>: When you regain hit points by
      resting or through magical healing, you recover additional hit points
      equal to half your Constitution modifier (minimum +1).</p>
