    value: >-
      <p><em>Your painful stare causes two additional
      effects.</em></p><p><strong>Prerequisites</strong>: Mesmerist level 13th,
      painful stare class feature.</p><p><strong>Benefits</strong>: You can
      apply the effects of two stare feats to your painful
      stares.</p><p><strong>Normal</strong>: You can apply the effects of only
      one stare feat to a given painful stare.</p>
