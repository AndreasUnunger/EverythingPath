name: Siphon Channel
system:
  description:
    value: >-
      <p><em>You can channel negative energy to feed off the suffering of
      others.</em></p><p><strong>Prerequisites</strong>: Channel energy 3d6,
      worshiper of Ghlaunder.</p><p><strong>Benefits</strong>: Once per day when
      you channel negative energy to damage living creatures, you gain a number
      of temporary hit points equal to half the die result of your channeled
      energy + 1 per creature affected by the channeled energy. For each
      affected creature that did not succeed at its saving throw against the
      channeled energy, you gain an additional temporary hit point. These
      temporary hit points disappear after 1 hour.</p>
  tags:
    - Channeling
type: feat
