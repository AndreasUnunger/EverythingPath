name: Ioun Resonance
system:
  description:
    value: >-
      <p><em>You can create a magic link between your ioun heart and an ioun
      stone in your possession.</em></p><p><strong>Prerequisites</strong>:
      Wyrwood.</p><p><strong>Benefits</strong>: As a standard action, you can
      create a link between your ioun core and an active ioun stone you hold or
      carry. For as long as you gain the benefits of the linked stone, any
      numerical bonuses and penalties granted by the stone are increased by 1.
      You can maintain a link with only one ioun stone at a time. Creating a
      link to a new stone ends any previous links.</p>
  tags:
    - Racial
    - Wyrwood
type: feat
