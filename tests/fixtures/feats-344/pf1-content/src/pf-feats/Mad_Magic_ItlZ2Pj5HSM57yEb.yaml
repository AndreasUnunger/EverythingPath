name: Mad Magic
system:
  description:
    value: >-
      <p><em>Magic is in your blood, allowing you to cast spells no matter how
      furious you become.</em></p><p><strong>Prerequisites</strong>: Bloodrage
      class feature or perfect clarity rage
      power.</p><p><strong>Benefits</strong>: You can cast spells from any class
      that grants you spells while in a bloodrage, and you keep your rage benef
      its when using moment of clarity during a rage. If you have the greater
      bloodrage class feature, you also gain a +1 bonus to the save DCs of
      spells you cast while in a bloodrage.</p>
  tags:
    - Combat
type: feat
