name: Close Call
system:
  description:
    value: >-
      <p><em>Your nimble fingers are able to catch small slips before they
      become big disasters.</em></p><p><strong>Prerequisites</strong>: Deft
      Hands.</p><p><strong>Benefits</strong>: Once per day, you may reroll
      either a Disable Device or Sleight of Hand check. You must decide to use
      this ability after the first attempt but before the results are revealed
      by the GM. You must take the second roll, even if it's worse.</p>
  tags:
    - General
type: feat
