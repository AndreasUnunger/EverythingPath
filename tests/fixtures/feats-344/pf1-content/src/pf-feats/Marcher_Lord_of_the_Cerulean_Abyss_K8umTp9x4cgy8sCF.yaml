name: Marcher-Lord of the Cerulean Abyss
system:
  description:
    value: >-
      <p><em>You've made your case to become one of Ragadahn's nobles in the
      traditional way--by carving your sigil and the Water Lord's ouroboros in
      the flesh of a living dragon or of another massive monstrosity--and earned
      some of his might as a reward.</em></p><p><strong>Prerequisites</strong>:
      Fey creature type or Fey Obedience (Ragadahn), you must have carved your
      name and Ragadahn's holy symbol on the hide of a living dragon or outsider
      with either the aquatic or water subtype and a CR at least 2 higher than
      your level when you took the feat.</p><p><strong>Benefits</strong>: You
      claim ownership of that which you strike. If you have dealt hit point
      damage to a creature this round, that creature takes a -2 penalty on
      combat maneuver checks and to its CMD until the beginning of your next
      round.</p>
  tags:
    - Gathlain
type: feat
