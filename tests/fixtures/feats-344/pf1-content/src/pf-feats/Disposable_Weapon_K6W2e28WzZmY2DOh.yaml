name: Disposable Weapon
system:
  description:
    value: >-
      <p><em>You ignore the limitations of your equipment, striking harder
      despite the damage it does to your
      weapon.</em></p><p><strong>Prerequisites</strong>: Base attack bonus +1,
      proficient with weapon.</p><p><strong>Benefits</strong>: Whenever you use
      a melee or thrown weapon with the fragile weapon special quality to score
      a critical threat against an opponent, you can give your weapon the broken
      condition to automatically confirm the critical hit.</p>
  tags:
    - General
type: feat
