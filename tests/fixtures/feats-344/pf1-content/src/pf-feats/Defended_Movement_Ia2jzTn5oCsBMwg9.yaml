name: Defended Movement
system:
  description:
    value: >-
      <p><em>You deftly block attacks with your shield while moving through
      battle.</em></p><p><strong>Prerequisites</strong>: Shield Focus, base
      attack bonus +6 or fighter level 4th.</p><p><strong>Benefits</strong>: You
      gain a +2 bonus to your AC against attacks of
      opportunity.</p><p><strong>Special</strong>: Defended Movement counts as
      both Dodge and Mobility for the purposes of feats that have Dodge and
      Mobility as prerequisites.</p><h3>Combat Trick</h3><p>You can spend 3
      stamina points as an immediate action to increase the bonus to your AC to
      +4 against a single attack. (See page 18.)</p>
  tags:
    - Combat
    - Shield Mastery
    - Combat Trick
type: feat
