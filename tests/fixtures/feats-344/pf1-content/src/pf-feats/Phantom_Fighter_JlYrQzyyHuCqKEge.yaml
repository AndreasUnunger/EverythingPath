name: Phantom Fighter
system:
  description:
    value: >-
      <p><em>Your phantom is a deadly foe of incorporeal
      adversaries.</em></p><p><strong>Prerequisites</strong>: Phantom class
      feature, phantom with the magic attacks
      ability.</p><p><strong>Benefits</strong>: Your phantom's natural weapons
      are treated as having the ghost touch property. In addition, when you cast
      a touch spell to be delivered by your phantom, you can modify the spell as
      if you possessed the Ectoplasmic Spell metamagic feat.</p>
  tags:
    - General
type: feat
