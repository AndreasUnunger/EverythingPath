name: Special Delivery
system:
  description:
    value: >-
      <p><em>Your partner can carry your spells to their
      targets.</em></p><p><strong>Prerequisites</strong>: Bonded Mind, Share
      Spells, ability to deliver spells through an animal companion, eidolon,
      familiar, or phantom, caster level 3rd.</p><p><strong>Benefits</strong>:
      Whenever you are in contact with an ally who has the Bonded Mind feat and
      you cast a touch spell, you can designate the ally as the 'toucher,' as
      per the deliver touch spells familiar ability.</p><p><br
      /><strong>Pathfinder Society<br /></strong>A PC cannot benefit from the
      feat Bonded Mind or any teamwork feats that use it as a prerequisite
      unless he permanently possesses the feat; this is an exception to how an
      inquisitor's solo tactics ability, a cavalier's tactician ability, and
      similar abilities function.</p>
  tags:
    - Teamwork
type: feat
