name: Brute Style
system:
  description:
    value: >-
      <p><em>Through strength, study, and intense inner reflection, you have
      become an expert at battering fallen
      opponents.</em></p><p><strong>Prerequisites</strong>: Str 15, Int 13,
      Combat Reflexes, Improved Overrun, Improved Trip, Improved Unarmed Strike,
      Vicious Stomp, base attack bonus +6.</p><p><strong>Benefits</strong>:
      While using this style, you can use your Vicious Stomp feat against any
      opponent within 10 feet of you, as long as it is within your natural
      reach. If you don't have the Vicious Stomp feat, you gain no benefit from
      this feat.</p><p><strong>Normal</strong>: The Vicious Stomp feat only
      works against an opponent that falls prone adjacent to you.</p>
  tags:
    - Combat
    - Style
type: feat
