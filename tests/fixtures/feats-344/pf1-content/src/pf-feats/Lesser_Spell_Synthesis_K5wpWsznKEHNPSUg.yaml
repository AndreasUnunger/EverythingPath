name: Lesser Spell Synthesis
system:
  description:
    value: >-
      <p><em>Your skill in two different branches of magic allows you to combine
      your powers in unorthodox ways.</em></p><p><strong>Prerequisites</strong>:
      Combined spells class feature.</p><p><strong>Benefits</strong>: Once per
      day as a full-round action, you can cast two spells, each from a different
      spellcasting class. Both spells must have a casting time of 1 standard
      action and must be a spell level equal to or lower than the level of
      spells you can prepare with the combined spells ability. You can make any
      decisions concerning the spells, such as the spells' targets,
      independently.</p><p><strong>Special</strong>: You can gain this feat
      multiple times. Each time you take the feat, you can use this ability one
      additional time per day.</p>
  tags:
    - General
type: feat
