name: Opening Volley
system:
  description:
    value: >-
      <p><em>Your ranged assault leaves your foe disoriented and vulnerable to
      your melee attack.</em></p><p><strong>Benefits</strong>: Whenever you deal
      damage with a ranged attack, you gain a +4 circumstance bonus on the next
      melee attack roll you make against the opponent. This attack must occur
      before the end of your next turn.</p><h3>Combat Trick</h3><p>When you deal
      damage with a ranged attack, you can spend 2 stamina points to gain a +4
      circumstance bonus on the next two melee attack rolls you make against
      that opponent until the end of your next turn, instead of on only the next
      melee attack.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
