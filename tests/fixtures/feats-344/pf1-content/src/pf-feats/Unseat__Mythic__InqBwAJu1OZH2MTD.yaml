name: Unseat (Mythic)
system:
  description:
    value: >-
      <p><em>You knock your opponents down from their mounts with frightening
      concussive force.</em></p><p><strong>Prerequisites</strong>:
      Unseat.</p><p><strong>Benefits</strong>: When you successfully bull rush
      an opponent off his mount with Unseat, your opponent takes 1d6 points of
      falling damage per 2 tiers you possess. Items or abilities that reduce
      falling damage, such as a successful Acrobatics check, can reduce the
      damage dealt by the impact.</p>
