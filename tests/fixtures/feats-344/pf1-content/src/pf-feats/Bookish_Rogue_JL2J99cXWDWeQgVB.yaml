name: Bookish Rogue
system:
  description:
    value: >-
      <p><em>Thanks to your preparation, your arcane ability is more varied than
      most.</em></p><p><strong>Prerequisites</strong>: Minor magic rogue
      talent.</p><p><strong>Benefits</strong>: By studying a spellbook for 10
      minutes, you can change one spell you are able to cast using your minor
      magic or major magic rogue talent to one sorcerer/wizard spell of the same
      level contained in the spellbook. This change is permanent until you take
      the time to change it via this feat again.</p>
  tags:
    - General
type: feat
