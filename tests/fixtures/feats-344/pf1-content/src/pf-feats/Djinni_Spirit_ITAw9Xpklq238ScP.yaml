name: Djinni Spirit
system:
  description:
    value: >-
      <p><em>By calling upon the spirits of storms, you can manipulate lightning
      to protect yourself and buffet your enemies with peals of
      thunder.</em></p><p><strong>Prerequisites</strong>: Con 15, Wis 15, Djinni
      Style, Elemental Fist, Improved Unarmed Strike, base attack bonus +11 or
      monk level 9th.</p><p><strong>Benefits</strong>: You gain one additional
      Elemental Fist (Advanced Player's Guide 158) attempt per day. While using
      Djinni Style, you gain electricity resistance equal to your base attack
      bonus or monk level, whichever is higher. While denied your Dexterity
      bonus to AC you are also denied this resistance. Creatures that take
      electricity damage from your Elemental Fist attack must succeed at a
      Fortitude save (DC 10 + 1/2 your character level + your Wis modifier) or
      be deafened for 1d4 rounds. Those who take damage from your Djinni Spin
      are deafened, even on a successful saving throw.</p><p><strong>Combat
      Trick</strong>: When you make an Elemental Fist attack, you can spend up
      to 5 stamina points to increase the DC of the saving throw of the
      deafening effect by an amount equal to the number of stamina points you
      spent.</p>
  tags:
    - Combat
type: feat
