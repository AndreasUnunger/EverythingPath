name: Bolster Jinx
system:
  description:
    value: >-
      <p><em>Your ability to resist certain effects somehow makes it even harder
      for creatures you jinx to do the
      same.</em></p><p><strong>Prerequisites</strong>: Great Fortitude, Iron
      Will, or Lightning Reflexes; Halfling Jinx
      trait.</p><p><strong>Benefits</strong>: A jinxed target's penalty on
      Fortitude, Reflex, or Will saves increases by 2 if you have the Great
      Fortitude, Lightning Reflexes, or Iron Will feat, respectively. If you
      have more than one of these feats, the additional penalties apply to all
      of the corresponding saves.</p>
  tags:
    - Racial
    - Halfling
type: feat
