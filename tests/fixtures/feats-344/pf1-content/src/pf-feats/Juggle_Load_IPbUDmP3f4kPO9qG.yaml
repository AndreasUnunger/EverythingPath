name: Juggle Load
system:
  description:
    value: >-
      <p><em>Your fingers are so nimble that reloading your sling is almost
      effortless for you.</em></p><p><strong>Prerequisites</strong>: Ammo Drop,
      Sleight of Hand 1 rank, proficient with
      sling.</p><p><strong>Benefits</strong>: You can load a sling or double
      sling as a free action. This does not provoke attacks of opportunity. This
      feat allows you to fire your sling as many times in a full-attack action
      as you could attack if you were using a bow.</p>
  tags:
    - Combat
type: feat
