name: Pin Down
system:
  description:
    value: >-
      <p><em>You easily block enemy
      escapes.</em></p><p><strong>Prerequisites</strong>: Combat Reflexes,
      fighter level 11th.</p><p><strong>Benefits</strong>: Whenever an opponent
      you threaten takes a 5-foot step or uses the withdraw action, that
      opponent provokes an attack of opportunity from you. If the attack hits,
      you deal no damage, but the targeted creature is prevented from making the
      move action that granted a 5-foot step or the withdraw action and does not
      move.</p><h3>Combat Trick</h3><p>: When using this feat, you can spend 5
      stamina points to gain its benefits and still deal damage with the attack
      of opportunity.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
