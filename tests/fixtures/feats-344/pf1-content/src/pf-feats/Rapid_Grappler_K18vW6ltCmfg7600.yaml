name: Rapid Grappler
system:
  description:
    value: >-
      <p><em>You are a quick hand at
      grappling.</em></p><p><strong>Prerequisites</strong>: Dex 13, Greater
      Grapple, Improved Grapple, Improved Unarmed Strike, base attack bonus +9
      or monk level 9th.</p><p><strong>Benefits</strong>: Whenever you use
      Greater Grapple to successfully maintain a grapple as a move action, you
      can then spend a swift action to make a grapple combat maneuver check at a
      -5 penalty.</p><h3>Combat Trick</h3><p>: You can spend 2 stamina points to
      gain a +2 bonus on a grapple check made as a swift action with this
      feat.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
