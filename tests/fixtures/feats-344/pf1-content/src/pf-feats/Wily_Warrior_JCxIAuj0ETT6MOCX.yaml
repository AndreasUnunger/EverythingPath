name: Wily Warrior
system:
  description:
    value: >-
      <em>Those who observe your imposing demeanor assume muscle is your sole
      advantage, but you prove them wrong every
      time.</em></p><p><strong>Prerequisites</strong>: Bluff 1 rank, Sense
      Motive 1 rank, base attack bonus +1, or you must have the Military
      Strategist background (page 5).</p><p><strong>Benefits</strong>: Once per
      day, you can use your ranks in Sense Motive in place of your total Will
      saving throw modifier when attempting a Will save. You must decide to use
      this ability prior to attempting the saving x
      throw.</p><p><strong>Goal</strong>: Thwart an appropriate number of
      challenging foes after getting a negative hunch about them when they
      attempted to deceive you or after ambushing them.</p><p><strong>Completion
      Benefit</strong>: The DC of Bluff and Intimidate checks attempted against
      you increase by 5.
  tags:
    - Story
type: feat
