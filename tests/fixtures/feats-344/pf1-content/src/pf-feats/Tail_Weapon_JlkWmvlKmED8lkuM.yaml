name: Tail Weapon
system:
  description:
    value: >-
      <p><em>You have strengthened your tail enough that you can use it to make
      slap attacks and augment your
      balance.</em></p><p><strong>Prerequisites</strong>: Base attack bonus +1,
      serpentfolk.</p><p><strong>Benefits</strong>: You can make a tail slap
      attack with your tail. This is a secondary natural attack that deals 1d6
      points of bludgeoning damage. You also gain a +2 racial bonus on
      Acrobatics checks to balance and to your CMD against maneuvers that
      attempt to move you from your square.</p>
  tags:
    - Combat
    - Racial
    - Serpentfolk
type: feat
