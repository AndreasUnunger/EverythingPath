name: Hamatula Grasp
system:
  description:
    value: >-
      <p><em>You deal terrible damage to impaled
      foes.</em></p><p><strong>Prerequisites</strong>: Hamatula Strike, Improved
      Grapple, Strength 13, base attack bonus
      +9.</p><p><strong>Benefits</strong>: When attacking an impaled opponent
      (see Hamatula Strike) with the weapon that impales them, you only suffer a
      -2 penalty to your grapple check. If the check succeeds, you deal an extra
      1d6 damage.</p>
  tags:
    - Combat
type: feat
