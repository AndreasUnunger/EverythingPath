name: Personal Chronicler
system:
  description:
    value: >-
      <p><em>Psychopomps have sent a nosoi scribe to record your
      actions.</em></p><p><strong>Prerequisites</strong>:
      Duskwalker.</p><p><strong>Benefits</strong>: You gain a fledgling nosoi
      familiar as per the arcane bond class feature, using your character level
      as your wizard level. Treat this as either a raven or a whippoorwill
      familiar (a whippoorwill uses the statistics for a thrush, but grants a +3
      bonus to Intimidate instead of Diplomacy). If you have the ability to gain
      a familiar through other means and you are at least 5th level, the bird is
      instead treated as a Improved Familiar feat. You can have only one
      familiar.</p><p>This feat can be taken a second time by a character of 7th
      level or higher if that character doesn't otherwise have access to a
      familiar. Such characters treat their familiars as nosoi, as described
      above.</p><p><strong>Special</strong>: If you ever willingly consort with
      sahkils or undead, your familiar abandons you and reports your actions to
      the nearest psychopomps. To regain your familiar, you must atone for your
      deeds via the atonement spell.</p>
  tags:
    - Racial
    - Duskwalker
type: feat
