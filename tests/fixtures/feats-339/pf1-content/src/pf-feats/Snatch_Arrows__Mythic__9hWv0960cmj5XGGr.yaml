name: Snatch Arrows (Mythic)
system:
  description:
    value: >-
      <p><em>You can use the weapons you pluck from the air to immediately make
      melee attacks.</em></p><p><strong>Prerequisites</strong>: Snatch
      Arrows.</p><p><strong>Benefits</strong>: When you use Snatch Arrows to
      catch a thrown weapon that can also be used as a melee weapon, you can
      make a melee attack with it as an immediate action against a foe within
      the weapon's melee reach. You can expend one use of mythic power to make
      this attack without spending an immediate action.</p>
  tags:
    - Combat
    - Mythic
type: feat
