name: Enhanced Coven
system:
  description:
    value: >-
      <p><em>By deepening your connection with your coven members, you have made
      your coven capable of casting more spells each
      day.</em></p><p><strong>Prerequisites</strong>: Changeling, coven hex or
      Coven-Touched.</p><p><strong>Benefits</strong>: Your changeling coven can
      cast three more spells each day from its list of spell-like abilities. If
      multiple members of your coven take this feat, the benefits stack.</p>
  tags:
    - Racial
    - Changeling
type: feat
