name: Thousand Cuts
system:
  description:
    value: >-
      <p><em>Your attacks are calculated to draw the most blood possible. With
      every swing, you open persistent, vicious wounds that drain the life from
      your enemies.</em></p><p><strong>Prerequisites</strong>: Weapon Focus with
      slashing weapon.</p><p><strong>Benefits</strong>: When you deal damage
      with a melee attack with a slashing weapon to an opponent you have already
      damaged this round, you can also deal 1 point of bleed damage that lasts
      for 2 rounds. This bleed damage stacks with itself, but only if dealt in
      the same round.</p>
  tags:
    - Combat
    - Combination
type: feat
