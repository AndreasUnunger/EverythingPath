name: Terrain Celerity
system:
  description:
    value: >-
      <p><em>You can use your surroundings to accelerate your movement, and your
      enemy's presence pushes you
      further.</em></p><p><strong>Prerequisites</strong>: Favored enemy class
      feature, favored terrain class feature.</p><p><strong>Benefits</strong>:
      While you're in any of your favored terrain types, you gain a 5-foot bonus
      to your movement speed. This bonus increases to 10 feet if a creature of
      the same type as one of your favored enemies is visible and within the
      same terrain type.</p>
  tags:
    - General
type: feat
