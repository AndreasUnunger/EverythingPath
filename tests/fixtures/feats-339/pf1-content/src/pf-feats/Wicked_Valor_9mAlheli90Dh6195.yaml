name: Wicked Valor
system:
  description:
    value: >-
      <p><em>The fiendish blood that courses through your body causes your
      wounds to heal faster than
      usual.</em></p><p><strong>Prerequisites</strong>: Con 15, Diehard,
      Endurance, tiefling.</p><p><strong>Benefits</strong>: When you regain hit
      points by resting, you heal double the normal amount of damage. This feat
      does not stack with items or effects that also affect the amount of damage
      you recover from while resting. This feat only functions with a full
      night's rest; complete bed rest is not affected by this feat.</p>
  tags:
    - Racial
    - Tiefling
type: feat
