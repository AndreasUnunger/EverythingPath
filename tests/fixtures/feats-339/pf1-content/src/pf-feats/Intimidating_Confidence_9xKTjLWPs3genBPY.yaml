name: Intimidating Confidence
system:
  description:
    value: >-
      <p><em>You have boundless faith in your
      success.</em></p><p><strong>Prerequisites</strong>: Cha 13, Fearless
      Curiosity, Intimidate 5 ranks, human.</p><p><strong>Benefits</strong>: You
      gain a +1 bonus on saving throws against effects with the emotion
      descriptor; this bonus stacks with the bonus granted by Fearless
      Curiosity. When you confirm a critical hit, as a free action you can make
      an Intimidate check to demoralize one creature you threaten. If you have
      the Dazzling Display feat, you can make Intimidate checks to demoralize
      all creatures you threaten instead. You gain a +2 bonus on this check if
      your weapon has a x3 critical modifier, or +4 if it has a x4 critical
      modifier.</p>
  tags:
    - Racial
    - Human
type: feat
