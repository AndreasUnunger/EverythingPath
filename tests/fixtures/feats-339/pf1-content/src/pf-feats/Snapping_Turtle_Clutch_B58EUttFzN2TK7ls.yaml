name: Snapping Turtle Clutch
system:
  description:
    value: >-
      <p><em>Your unarmed style allows you to turn your opponent's attack into
      an opportunity.</em></p><p><strong>Prerequisites</strong>: Snapping Turtle
      Style, Improved Grapple, Improved Unarmed Strike, base attack bonus +3 or
      monk level 3rd.</p><p><strong>Benefits</strong>: While you are using the
      Snapping Turtle Style feat, the shield bonus the style grants to your AC
      applies to your CMD and touch AC. Whenever an opponent misses you with a
      melee attack while you are using the Snapping Turtle Style feat, you can
      use an immediate action to attempt a grapple combat maneuver against that
      opponent, but with a -2 penalty.</p><h3>Combat Trick</h3><p>: When you
      attempt a grapple combat maneuver as an immediate action as a result of
      this feat, you can spend 2 stamina points to negate the -2 penalty on that
      combat maneuver check.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
