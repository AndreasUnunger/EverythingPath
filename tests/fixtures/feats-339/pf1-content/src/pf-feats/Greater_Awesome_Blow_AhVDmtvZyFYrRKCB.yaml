name: Greater Awesome Blow
system:
  description:
    value: >-
      <p><em>When you perform an awesome blow, you fling opponents back
      farther.</em></p><p><strong>Prerequisites</strong>: Str 25, Awesome Blow,
      Improved Bull Rush, Power Attack, size Large or
      larger.</p><p><strong>Benefits</strong>: When you make an awesome blow
      combat maneuver, for every 5 by which your combat maneuver check exceeds
      the target's CMD, you send the target flying 5 additional feet.
      Furthermore, this movement provokes attacks of opportunity from your
      allies.</p>
  tags:
    - Combat
type: feat
