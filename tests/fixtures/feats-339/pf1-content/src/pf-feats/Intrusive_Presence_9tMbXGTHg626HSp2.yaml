name: Intrusive Presence
system:
  description:
    value: >-
      <p><em>You can rifle through the thoughts and memories of your
      host.</em></p><p><strong>Prerequisites</strong>: Int or Cha 21, Hidden
      Presence, Manipulative Presence, ability to cast possession or greater
      possession.</p><p><strong>Benefits</strong>: You can use detect thoughts
      at will as a spell-like ability against a host creature you possess. The
      host receives no saving throw, and the effect functions as if you had
      concentrated for 3 rounds. You can also use seek thoughts on your host as
      a spell-like ability once during the possession. The host can attempt a
      Will save with a DC equal to the DC of the original possession effect. If
      the host succeeds, the effect fails and the host become aware of the
      possession if it wasn't already.</p>
  tags:
    - General
type: feat
