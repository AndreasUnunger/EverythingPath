name: Crushing Blow
system:
  description:
    value: >-
      <p><em>Your focus allows you to smash your enemy's
      defenses.</em></p><p><strong>Prerequisites</strong>: Improved Unarmed
      Strike, Stunning Fist.</p><p><strong>Benefits</strong>: You can make a
      Stunning Fist attempt as a full-round action. If successful, instead of
      stunning your target, you reduce the target's AC by an amount equal to
      your Wisdom modifier for 1 minute. This penalty does not stack with other
      penalties applied due to Crushing Blow.</p><p><strong>Combat
      Trick</strong>: When using this feat, you can spend either 2 or 4 stamina
      points. If you do, the Crushing Blow attack reduces the target's AC by an
      additional 1 for every 2 stamina points you spent.</p>
  tags:
    - Combat
type: feat
