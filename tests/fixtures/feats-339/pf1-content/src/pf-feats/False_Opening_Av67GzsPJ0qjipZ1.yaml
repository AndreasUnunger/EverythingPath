name: False Opening
system:
  description:
    value: >-
      <p><em>When you make a ranged attack while threatened, you can fool your
      opponent into thinking he has an
      opening.</em></p><p><strong>Prerequisites</strong>: Dex 13, Dodge, Close
      Quarters Thrower or Point-Blank Master, Weapon Focus with selected ranged
      weapon.</p><p><strong>Benefits</strong>: Choose a ranged weapon or a
      thrown weapon. When you make a ranged attack using that weapon, you can
      choose to provoke an attack of opportunity from one or more opponents who
      threaten you. You gain a +4 dodge bonus against such attacks. An opponent
      that makes such an attack and misses you loses his Dexterity bonus to AC
      against you until the end of your turn.</p><p><strong>Combat
      Trick</strong>: When you use this feat, you can spend 5 stamina points to
      make an attack of opportunity against an opponent who misses you with the
      provoked attack (after it loses its Dexterity bonus to AC against
      you).</p>
  tags:
    - Combat
type: feat
