name: Vengeance
system:
  description:
    value: >-
      <p><em>The need to avenge those you loved drives you to great
      deeds.</em></p><p><strong>Prerequisites</strong>: You must have a close
      family member or other loved one slain by a specific challenging foe or
      that foe's minions, or have the Raiders or Vengeance
      background.</p><p><strong>Benefits</strong>: You gain a +1 bonus on saving
      throws, attack rolls, and weapon damage rolls against your chosen foe and
      known minions of that foe.</p><p><strong>Goal</strong>: Thwart your chosen
      foe.</p><p><strong>Completion Benefit</strong>: You gain a +1 bonus on all
      saving throws. This bonus stacks with this feats's bonus against your foe
      and its minions, should they survive.</p>
