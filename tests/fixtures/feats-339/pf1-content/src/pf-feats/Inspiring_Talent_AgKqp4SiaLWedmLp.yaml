img: systems/pf1/icons/races/half-elf.png
name: Inspiring Talent
system:
  description:
    value: >-
      <p><em>Your innate adaptability allows you to imitate others of your kind
      nearly flawlessly, to the extent that you can utilize their mastery over
      skills almost as if you had personally trained in their
      use.</em></p><p><strong>Prerequisites</strong>: Half-elf, adaptability or
      ancestral arms racial trait.</p><p><strong>Benefits</strong>: Whenever you
      are within 30 feet of an ally who also has this feat, you gain the
      following benefits. If the ally has a Skill Focus feat, you also count as
      having that feat for the purpose of the following skill uses: Acrobatics
      checks to move through threatened squares, Bluff checks to feint, Escape
      Artist checks to escape a grapple, Intimidate checks to demoralize,
      Knowledge checks to identify a monster, and Perception checks to notice a
      creature using Stealth. Furthermore, if the ally has a weapon proficiency
      gained through the ancestral arms racial trait, you also count as having
      that weapon proficiency.</p>
  tags:
    - Teamwork
    - Racial
    - Half-Elf
type: feat
