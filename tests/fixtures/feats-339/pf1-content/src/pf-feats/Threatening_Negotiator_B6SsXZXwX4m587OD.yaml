name: Threatening Negotiator
system:
  description:
    value: >-
      <p><em>Those who you intimidate know that you'll go through with your
      threats.</em></p><p><strong>Prerequisites</strong>: Nerve-Racking
      Negotiator, Persuasive, Skill Focus
      (Intimidate).</p><p><strong>Benefits</strong>: When you successfully use
      the Intimidate skill to force an opponent to act friendly toward you, the
      duration of the attitude change lasts 2d6
      hours.</p><p><strong>Normal</strong>: Changing an opponent's attitude with
      Intimidate normally changes the foe's attitude to friendly for 1d6 x10
      minutes.</p>
  tags:
    - General
type: feat
