name: Dragoncrafting
system:
  description:
    value: >-
      <p><em>You have the ability to create rare and valuable items from the
      bodies of fallen true dragons.</em></p><p><strong>Prerequisites</strong>:
      Craft (any) 5 ranks, Knowledge (arcana) 3
      ranks.</p><p><strong>Benefits</strong>: You gain the ability to create a
      variety of dragoncraft items from materials gathered from the bodies of
      true dragons (not lesser dragons, such as linnorms or wyverns). Crafting
      dragoncraft items takes 1 hour per 100 gp of items being produced. In
      order to gather specimens from a dragon's corpse, you must succeed at a
      Heal check equal to 10 + the dragon's CR within 48 hours of the dragon's
      death (unless the body is preserved in some way). Refer to the table below
      to determine how much of a given material can be harvested from a dragon
      based on its size.</p><p><table><tr><td><strong>Dragon
      Size</strong></td><td><strong>Blood</strong></td><td><strong>Stomach
      Acid</strong></td><td><strong>Gall</strong></td><td><strong>Musk</strong></td><td><strong>Skin</strong></td></tr><tr><td>Tiny</td><td>2
      vials</td><td>1 vial</td><td>1 vial</td><td>--</td><td>1 grip</td></tr>
      <tr><td>Small</td><td>3 vials</td><td>1 vial</td><td>1 vial</td><td>1
      vial</td><td>2 grips</td></tr> <tr><td>Medium</td><td>4 vials</td><td>2
      vials</td><td>2 vials</td><td>1 vial</td><td>2 grips</td></tr>
      <tr><td>Large</td><td>5 vials</td><td>2 vials</td><td>2 vials</td><td>2
      vials</td><td>2 grips</td></tr> <tr><td>Huge</td><td>6 vials</td><td>3
      vials</td><td>2 vials</td><td>2 vials</td><td>3
      grips</td></tr><tr><td>Gargantuan</td><td>7 vials</td><td>3
      vials</td><td>3 vials</td><td>3 vials</td><td>3 grips</td></tr>
      <tr><td>Colossal</td><td>8 vials</td><td>4 vials</td><td>3 vials</td><td>3
      vials</td><td>3 grips</td></tr></table></p><p><strong>Special</strong>:
      Normally, if a suit of dragonhide armor has energy immunity, one may
      enhance such a suit with additional energy protection for the wearer at a
      25% reduced cost. However, only effects with the same elemental type as
      the armor's immunity are eligible for this discount. An artisan with the
      Dragoncrafting feat may add 1 additional elemental protection to a suit of
      dragonhide armor at the same 25% discount, even if this energy resistance
      is not normally associated with the type of dragonhide being used.</p>
  tags:
    - General
type: feat
