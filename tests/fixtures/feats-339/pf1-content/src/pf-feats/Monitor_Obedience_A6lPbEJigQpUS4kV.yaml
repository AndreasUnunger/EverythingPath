name: Monitor Obedience
system:
  description:
    value: >-
      <p><em>Your daily prayer and minor sacrifices to a particular monitor
      demigod grant you special
      boons.</em></p><p><strong>Prerequisites</strong>: Knowledge (planes) 3
      ranks, must worship a monitor demigod.</p><p><strong>Benefits</strong>:
      Each monitor demigod requires a different obedience, but all obediences
      take only 1 hour to perform. Once you've performed the obedience, you gain
      the benefit of a special ability or resistance as indicated in the
      Obedience entry for the demigod.</p><p> If you have at least 12 Hit Dice,
      you also gain the first boon granted by your monitor demigod upon
      undertaking your obedience. If you have at least 16 Hit Dice, you also
      gain the monitor demigod's second boon. If you have 20 Hit Dice or more,
      you also gain the monitor demigod's third boon. Unless a boon lists a
      specific duration or number of uses per day, its effects are
      constant.</p><p>If you ever fail to perform a daily obedience, you lose
      access to the benefits and boons granted by this feat until you next
      perform the obedience.</p>
  tags:
    - General
type: feat
