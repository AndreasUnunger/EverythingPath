name: Unraveler of Secrets
system:
  description:
    value: >-
      <p><em>You have a knack for learning what others would like to remain
      hidden.</em></p><p><strong>Prerequisites</strong>: Int 15, Knowledge
      (history) 1 rank, gloomkin half-orc.</p><p><strong>Benefits</strong>: You
      gain a +2 circumstance bonus on Knowledge (history) checks. In addition,
      you can cast object reading once per day as a spell-like ability,
      attempting a Knowledge (history) check in place of an Appraise check.</p>
  tags:
    - Racial
    - Half-Orc
type: feat
