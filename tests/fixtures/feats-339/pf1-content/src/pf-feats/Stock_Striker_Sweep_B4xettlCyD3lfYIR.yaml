name: Stock-Striker Sweep
system:
  description:
    value: >-
      <p><em>The force of your firearm strikes can drive back your foe or damage
      a second target.</em></p><p><strong>Prerequisites</strong>: Stock-Striker
      Style, base attack bonus +7, pistol-whip gunslinger
      deed.</p><p><strong>Benefits</strong>: When you are using Stock-Striker
      Style and successfully knock a target prone with the pistol-whip deed, as
      a swift action you can either push the target 5 feet away from you or
      perform the pistol-whip deed a second time against a foe that is adjacent
      to the first and within your reach. This second use of pistol-whip costs 0
      grit points.</p>
  tags:
    - Combat
type: feat
