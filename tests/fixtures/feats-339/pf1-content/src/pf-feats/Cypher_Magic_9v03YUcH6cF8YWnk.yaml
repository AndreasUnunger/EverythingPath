name: Cypher Magic
system:
  description:
    value: >-
      <p><em>Your intimacy with runes and the mysteries of ancient arcana has
      taught you secret ways to draw greater power from magical writings. The
      Cyphermages of Riddleport initially devised these unusual methods, but
      they have since spread far and wide through the Inner Sea
      region.</em></p><p><strong>Prerequisites</strong>: Int 15, Scribe
      Scroll.</p><p><strong>Benefits</strong>: You cast spells from scrolls at 1
      caster level higher than the scroll's caster level. In addition, you gain
      a +2 bonus on caster level checks to activate a scroll with a higher
      caster level than your own.</p>
  tags:
    - General
type: feat
