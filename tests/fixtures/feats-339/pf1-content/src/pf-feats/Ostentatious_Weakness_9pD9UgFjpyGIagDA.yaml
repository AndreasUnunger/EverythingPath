name: Ostentatious Weakness
system:
  description:
    value: >-
      <p><em>You use knowledge of your hated foes to please
      onlookers.</em></p><p><strong>Prerequisites</strong>: Base attack bonus
      +5, favored enemy class feature.</p><p><strong>Benefits</strong>: When you
      spend a swift action to attempt a performance combat check, you may add
      your favored enemy bonus to the check if you're fighting a favored
      enemy.</p><h3>Combat Trick</h3><p>You can spend 2 stamina points to select
      another type of favored enemy (and subtype if humanoid or outsider is
      chosen). For the purposes of Ostentatious Weakness, that type counts as
      having been chosen with the favored enemy class feature, with a bonus
      equal to your highest favored enemy bonus.</p>
  tags:
    - Combat
    - Performance
    - Combat Trick
type: feat
