name: Wolf Trip
system:
  description:
    value: >-
      <p><em>You have studied the manner in which wolves bring down their
      prey.</em></p><p><strong>Prerequisites</strong>: Wis 15, Improved Unarmed
      Strike, Wolf Style, Knowledge (nature) 6
      ranks.</p><p><strong>Benefits</strong>: While using Wolf Style, you gain a
      +2 bonus when you attempt a trip combat maneuver as part of an attack of
      opportunity. Whenever you successfully trip a creature, as a free action
      you can choose an available space that is both adjacent to you and the
      creature's original space for the tripped creature to land prone in.</p>
  tags:
    - Combat
type: feat
