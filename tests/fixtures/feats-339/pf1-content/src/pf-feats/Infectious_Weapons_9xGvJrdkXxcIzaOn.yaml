name: Infectious Weapons
system:
  description:
    value: >-
      <p><em>Your weapons spread your
      sickness.</em></p><p><strong>Prerequisites</strong>: Ability to cause
      disease with a natural weapon via an extraordinary or supernatural
      ability.</p><p><strong>Benefits</strong>: Creatures damaged by your ranged
      and melee weapon attacks have a chance to contract disease, as though they
      were damaged with your disease-spreading natural weapon.</p>
