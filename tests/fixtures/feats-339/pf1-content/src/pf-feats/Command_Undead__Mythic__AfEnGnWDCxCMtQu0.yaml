name: Command Undead (Mythic)
system:
  description:
    value: >-
      <p><em>Your control of the undead is nearly
      absolute.</em></p><p><strong>Prerequisites</strong>: Command
      Undead.</p><p><strong>Benefits</strong>: When you command undead, the DC
      of the Will save increases by half your tier, and intelligent undead get
      no additional saves beyond their first to resist your commands. Any
      attempts by non-mythic creatures to control undead you command
      automatically fail, and you gain a +4 bonus on Charisma checks to prevent
      mythic creatures from stealing control of your undead.</p>
  tags:
    - General
    - Mythic
type: feat
