name: Kirin Path
system:
  description:
    value: >-
      <p><em>You turn knowledge of your enemy into a flawless
      defense.</em></p><p><strong>Prerequisites</strong>: Int 13, Kirin Strike,
      Kirin Style, Improved Unarmed Strike, Knowledge (arcana) 12 ranks,
      Knowledge (dungeoneering, local, nature, planes, or religion) 5
      ranks.</p><p><strong>Benefits</strong>: Whenever you make a Knowledge
      check to identify a creature, even when using Kirin Style, you can take 10
      even if stress and distractions would normally prevent you from doing so.
      While using Kirin Style against a creature you have identified using that
      feat, if the creature ends its turn within your threatened area, you can
      spend a use of your attacks of opportunity that round to move up to 5 feet
      times your Intelligence modifier (minimum 1). You must end your move in a
      square threatened by the creature. This move does not provoke attacks of
      opportunity.</p><h3>Combat Trick</h3><p>When using Kirin Style, you can
      spend 5 stamina points instead of using an attack of opportunity to move a
      distance equal to 5 feet x-- your Intelligence modifier.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
