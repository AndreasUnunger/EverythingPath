name: Viscous Venom
system:
  description:
    value: >-
      <p><em>Your venom is abnormally thick and
      adhesive.</em></p><p><strong>Prerequisites</strong>: Spit Venom,
      nagaji.</p><p><strong>Benefits</strong>: When you spit poison using the
      ability granted by the Spit Venom feat, you can spit a glob of venomous
      goo at an enemy within 30 feet. Once struck, the target is both exposed to
      your nagaji poison as normal and entangled. An entangled target can break
      free from the sticky goo with a successful DC 15 Strength or Escape Artist
      check as a fullround action or by dealing 15 points of damage to the gooey
      substance with a slashing weapon. In addition, you gain one additional use
      per day of the ability to spit poison granted by the Spit Venom feat.</p>
  tags:
    - Combat
    - Racial
    - Nagaji
type: feat
