name: Standing Tall
system:
  description:
    value: >-
      <p><em>You can tap into your family's old ways to take on some of the
      traits of plants.</em></p><p><strong>Prerequisites</strong>: Be a member
      of House Fahlspar, or have the Hunter, Nature, or Tree Tender
      background.</p><p><strong>Benefits</strong>: Once per day as a move
      action, you gain a +2 bonus on saving throws against mind-affecting
      effects for 1 minute.</p><p><strong>Goal</strong>: Swear to protect a
      natural site and defend it for at least a year, including decisively
      defeating an appropriate number of invaders or
      despoilers.</p><p><strong>Completion Benefit</strong>: You may now use the
      above benefit three times per day, and the benefit also applies on saving
      throws against paralysis, poison, polymorph, sleep, and stunning
      effects.</p>
  tags:
    - Story
type: feat
