name: Veiled Contempt
system:
  description:
    value: >-
      <p><em>You are skilled in disguising your dissatisfaction with the current
      regime or authority.</em></p><p><strong>Prerequisites</strong>: Bluff 3
      ranks.</p><p><strong>Benefits</strong>: The DC for Sense Motive checks to
      get a hunch about you is equal to 20 + your ranks in Bluff, instead of the
      normal 20. If the Sense Motive check is specifically to assess your
      allegiance or trustworthiness, the DC is equal to 20 + two times your
      ranks in Bluff.</p>
  tags:
    - General
type: feat
