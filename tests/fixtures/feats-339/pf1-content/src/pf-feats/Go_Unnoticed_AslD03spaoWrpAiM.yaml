name: Go Unnoticed
system:
  description:
    value: >-
      <p><em>Your small size lets you quickly duck out of
      sight.</em></p><p><strong>Prerequisites</strong>: Dex 13, Small size or
      smaller.</p><p><strong>Benefits</strong>: During the first round of
      combat, flat-footed opponents are considered not to have noticed you yet
      for the purposes of Stealth skill checks, allowing you to make a Stealth
      check that round to hide from them.</p>
  tags:
    - General
type: feat
