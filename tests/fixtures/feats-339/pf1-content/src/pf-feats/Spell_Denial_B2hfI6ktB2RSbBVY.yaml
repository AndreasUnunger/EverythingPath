name: Spell Denial
system:
  description:
    value: >-
      <p><em>You have trained to better resist a specific form of
      magic.</em></p><p><strong>Prerequisites</strong>: Con, Dex, or Wis
      13.</p><p><strong>Benefits</strong>: Select one school of magic. You gain
      a +2 bonus on all saving throws against spells of that
      school.</p><p><strong>Special</strong>: You can take this feat multiple
      times. Each time, you must select a different school of magic.</p>
  tags:
    - General
type: feat
