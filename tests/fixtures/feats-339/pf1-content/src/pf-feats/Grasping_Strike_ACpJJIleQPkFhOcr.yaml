name: Grasping Strike
system:
  description:
    value: >-
      <p><em>The surrounding foliage lurches forth at your enemies in concert
      with your strikes.</em></p><p><strong>Prerequisites</strong>: Nature Magic
      or the ability to cast druid or ranger spells; Vital Strike, Knowledge
      (nature) 5 ranks.</p><p><strong>Benefits</strong>: When you use Vital
      Strike (or Improved Vital Strike or Greater Vital Strike), you cause the
      foliage in the area to reach out and entangle your foe (as the condition)
      if it fails a Reflex save (DC = 10 + 1/2 your character level + your
      Wisdom modifier). The effect lasts for 1 minute or until the enemy breaks
      free with a successful Strength check or an Escape Artist check (DC = the
      effect's saving throw DC), whichever comes first.</p><p>You can use this
      benefit a number of times per day equal to your Wisdom modifier (minimum
      1). You can choose to use this ability as a free action after you hit the
      enemy with the attack. This is a supernatural ability.</p><h3>Combat
      Trick</h3><p>When using this feat, you can spend up to 5 stamina points to
      increase the DC of the effect by an amount equal to the number of stamina
      points you spent.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
