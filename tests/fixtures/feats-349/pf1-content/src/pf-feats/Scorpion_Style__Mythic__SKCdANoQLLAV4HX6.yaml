name: Scorpion Style (Mythic)
system:
  description:
    value: >-
      <p><em>Your unarmed strikes can induce a near-crippling lethargy in your
      enemies.</em></p><p><strong>Prerequisites</strong>: Scorpion
      Style.</p><p><strong>Benefits</strong>: Whenever you are using Scorpion
      Style, you add your tier to the number of rounds the target's base land
      speed is reduced. You can expend one use of mythic power when making your
      attack to slow your target, as the spell slow, unless it succeeds at a
      Fortitude save (DC 10 + 1/2 your character level + your Wisdom modif ier).
      The slowing effect supersedes the normal speed penalty of your Scorpion
      Strike, but lasts for an equal number of rounds.</p>
  tags:
    - Combat
    - Mythic
type: feat
