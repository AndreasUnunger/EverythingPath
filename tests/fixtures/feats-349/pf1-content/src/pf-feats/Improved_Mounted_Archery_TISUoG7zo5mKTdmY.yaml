name: Improved Mounted Archery
system:
  description:
    value: >-
      <p><em>You are an expert at making ranged attacks while
      mounted.</em></p><p><strong>Prerequisites</strong>: Mounted Archery,
      Mounted Combat, Ride 1 rank.</p><p><strong>Benefits</strong>: You take no
      penalty when using a ranged weapon while mounted and taking a double move
      action. The penalty while your mount is running is reduced to -2.</p>
