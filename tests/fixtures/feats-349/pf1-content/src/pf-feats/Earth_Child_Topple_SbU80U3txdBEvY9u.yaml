name: Earth Child Topple
system:
  description:
    value: >-
      <p><em>Your mastery of balance and momentum allows you to bring down
      giants with your bare hands.</em></p><p><strong>Prerequisites</strong>:
      Wis 13, dwarf or gnome, defensive training racial trait, Earth Child
      Style, Improved Trip, Improved Unarmed Strike, Acrobatics 6
      ranks.</p><p><strong>Benefits</strong>: You can trip a creature of the
      giant subtype of up to Huge size. While using Earth Child Style, you add
      your Wisdom bonus on combat maneuver checks made to trip a creature of the
      giant subtype, as well as on attack rolls to confirm a critical hit
      against such a creature.</p><p><strong>Normal</strong>: You can trip only
      those opponents that are one size category larger than you.</p><h3>Combat
      Trick</h3><p>When you trip a creature with the giant subtype, you can
      spend 3 stamina points to cause the creature to also take 2d6 points of
      falling damage.</p>
  tags:
    - Combat
    - Racial
    - Gnome
    - Dwarf
    - Combat Trick
type: feat
