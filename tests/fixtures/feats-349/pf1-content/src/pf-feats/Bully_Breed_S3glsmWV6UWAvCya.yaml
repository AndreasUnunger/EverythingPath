name: Bully Breed
system:
  description:
    value: >-
      <p><em>Your animal companion can terrify as well as
      fight.</em></p><p><strong>Prerequisites</strong>: Handle Animal 4 ranks,
      Intimidate 4 ranks, animal companion or mount class
      feature.</p><p><strong>Benefits</strong>: Your animal companion or mount
      gains Intimidate as a class skill. It can attempt to demoralize an
      opponent using the Intimidate skill as a move action on the same round
      that it damages an opponent with a natural
      attack.</p><p><strong>Normal</strong>: Animal companions and mounts with
      an Intelligence score of 2 or less must select feats from a limited
      list.</p><p><strong>Special</strong>: Your animal companion can select the
      Dazzling Display and Shatter Defenses feats if it meets the prerequisites.
      This feat does not allow your animal companion to use Intimidate to make a
      target friendly or gain their assistance.</p>
  tags:
    - General
type: feat
