name: Weapon Focus (Mythic)
system:
  description:
    value: >-
      <p><em>You're a master of one type of
      weapon.</em></p><p><strong>Prerequisites</strong>: Weapon
      Focus.</p><p><strong>Benefits</strong>: Double the bonuses on your attack
      rolls from Weapon Focus and Greater Weapon Focus. As a swift action, you
      can expend one use of mythic power to gain a bonus on attack rolls with
      your selected weapon equal to half your tier until the end of your
      turn.Special: If you have taken non-mythic Weapon Focus multiple times,
      you must choose which of those feats this enhances. You can take this feat
      multiple times. The effects do not stack. Each time you take this feat, it
      applies to a different non-mythic Weapon Focus feat you have.</p>
  tags:
    - Combat
    - Mythic
type: feat
