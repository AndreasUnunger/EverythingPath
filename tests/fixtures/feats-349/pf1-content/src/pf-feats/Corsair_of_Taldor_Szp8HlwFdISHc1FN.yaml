name: Corsair of Taldor
system:
  description:
    value: >-
      <p><em>Many Taldans seeking a life of adventure and service to the empire
      come to Cassomir hoping to join the ranks of Jean Coremont's corsairs.
      Those who do soon find themselves on the high seas, battling enemies of
      the empire and gaining fame for themselves and their
      shipmates.</em></p><p><strong>Prerequisites</strong>: Spent at least 1
      month working on a ship for Jean
      Coremont.</p><p><strong>Benefits</strong>: You get a +2 bonus on
      initiative checks made while on a ship and deal an additional +1 damage
      when using light or one-handed weapons on a ship.</p>
  tags:
    - General
type: feat
