name: Wave Strike
system:
  description:
    value: >-
      <p><em>You present a serene facade until you unsheathe your weapon and
      strike in one fluid motion.</em></p><p><strong>Prerequisites</strong>:
      Weapon expertise class feature or Quick Draw, Bluff 1
      rank.</p><p><strong>Benefits</strong>: If on your first turn of combat you
      draw a melee weapon to attack an opponent within your reach, you can spend
      a swift action to make a Bluff check to feint against that
      opponent.</p><h3>Combat Trick</h3><p>: You can spend 2 stamina points to
      use this feat on your second or subsequent turns in a combat. You can use
      this combat trick only once per combat, though you can use it in addition
      to using the feat on your first turn.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
