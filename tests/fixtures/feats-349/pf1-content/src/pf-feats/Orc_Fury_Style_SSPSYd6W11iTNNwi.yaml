name: Orc Fury Style
system:
  description:
    value: >-
      <p><em>You inspire great fear in your
      enemies.</em></p><p><strong>Prerequisites</strong>: Bullying Blow,
      Intimidating Prowess, Intimidate 3 ranks, weapon familiarity racial
      trait.</p><p><strong>Benefits</strong>: While wielding a greataxe, a
      falchion, or any melee weapon that has 'orc' in its name, you can use the
      Bullying Blow feat with the first attack of a full-attack action or as
      part of a standard action to make one or more attacks (such as with the
      Cleave feat).</p>
