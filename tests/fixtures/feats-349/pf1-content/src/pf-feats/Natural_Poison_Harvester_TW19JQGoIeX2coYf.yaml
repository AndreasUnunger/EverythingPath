name: Natural Poison Harvester
system:
  description:
    value: >-
      <p><em>You are exceedingly proficient at harvesting and distilling poison
      from venomous monsters.</em></p><p><strong>Prerequisites</strong>: Craft
      (alchemy) 6 ranks, Survival 6 ranks.</p><p><strong>Benefits</strong>: You
      gain a +2 bonus on Craft (alchemy) checks when creating poison harvested
      from poisonous monsters. When you successfully craft such poisons, the DC
      of the poison increases by 2.</p>
  tags:
    - General
type: feat
