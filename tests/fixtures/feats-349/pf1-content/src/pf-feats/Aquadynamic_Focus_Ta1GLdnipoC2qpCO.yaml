name: Aquadynamic Focus
system:
  description:
    value: >-
      <p><em>Your skill with your chosen weapons is so great that you can use
      them underwater without
      impediment.</em></p><p><strong>Prerequisites</strong>: Weapon Focus, base
      attack bonus +1.</p><p><strong>Benefits</strong>: You don't take
      additional penalties on attack and damage rolls for fighting underwater
      with bludgeoning and slashing melee weapons for which you have taken the
      Weapon Focus feat.</p><p><strong>Normal</strong>: When using bludgeoning
      and slashing melee weapons underwater, you take a -2 penalty on attack
      rolls and deal half damage.</p>
  tags:
    - Combat
type: feat
