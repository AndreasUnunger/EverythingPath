name: Spell Focus (Mythic)
system:
  description:
    value: >-
      <p><em>Your magical specialties are particularly
      effective.</em></p><p><strong>Prerequisites</strong>: Spell
      Focus.</p><p><strong>Benefits</strong>: Choose a school of magic you
      already have Spell Focus in. The bonus to save DCs provided by Spell Focus
      and Greater Spell Focus for that school increases by 1. You can expend one
      use of mythic power as part of casting a spell from your chosen school to
      force any of the spell's targets to roll their saving throws twice, taking
      the lower result.Special: You can gain this feat multiple times. The
      effects do not stack. Each time you take this feat, it applies to a
      different non-mythic Spell Focus feat.</p><p><strong>Special</strong>: You
      can gain this feat multiple times. The effects do not stack. Each time you
      take this feat, it applies to a different non-mythic Spell Focus feat.</p>
