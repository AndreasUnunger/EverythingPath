name: Shade of the Uskwood
system:
  description:
    value: >-
      <p><em>Ordained as one of the sinister albino druids who dwell within the
      heart of the Uskwood, you carry with you into the wider world a powerful
      effigy of hair, twigs, and blood that crawls with the deepening cold of
      the Midnight Lord's hallowed hunting
      grounds.</em></p><p><strong>Prerequisites</strong>: Neutral evil, patron
      deity Zon-Kuthon.</p><p><strong>Benefits</strong>: Add the following
      spells to your druid spell list. 0--disrupt undead, ray of frost;
      1st--ghost sound, touch of fatigue; 2nd--chill touch, spectral hand;
      3rd--ghoul touch, invisibility; 4th--displacement, ray of exhaustion;
      5th--animate dead, phantasmal killer; 6th--nightmare, waves of fatigue;
      7th--circle of death, shadow walk; 8th--mass invisibility, waves of
      exhaustion; 9th--horrid wilting, weird.</p><p>Remove all spells with the
      fire descriptor from all your spell lists (not just your druid spell
      list). You cannot cast any spells with the fire descriptor, nor activate
      them off scrolls, wands, or any other magic devices. In addition, you may
      not use wild shape to take the form of any creature with the fire
      subtype.</p><p><strong>Special</strong>: As part of this feat, you create
      a personal Umbrae-Token that ties your soul and your doings to the fell
      power of the Uskwood. This potent object is treated as a wooden unholy
      symbol that radiates faint necromancy magic. If your Umbrae-Token is ever
      destroyed, your connection to the shadowy heart of the Uskwood is severed
      and all benefits of this feat are lost until another is created. This
      process requires a journey to the Uskwood and an atonement spell cast by a
      fellow worshiper of Zon-Kuthon.</p>
  tags:
    - General
type: feat
