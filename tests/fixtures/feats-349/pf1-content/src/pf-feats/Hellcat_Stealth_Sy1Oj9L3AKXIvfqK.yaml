name: Hellcat Stealth
system:
  description:
    value: >-
      <p><em>You are difficult to see in the
      light.</em></p><p><strong>Prerequisites</strong>: Skill Focus (Stealth),
      Stealth 6 ranks.</p><p><strong>Benefits</strong>: You may make Stealth
      checks in normal or bright light even when observed, but at a -10
      penalty.</p><p><strong>Normal</strong>: You cannot make Stealth checks
      while observed.</p>
