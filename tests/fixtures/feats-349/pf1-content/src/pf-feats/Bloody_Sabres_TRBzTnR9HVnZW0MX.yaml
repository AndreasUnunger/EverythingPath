name: Bloody Sabres
system:
  description:
    value: >-
      <p><em>Imitating the forms of your god, you strike deep and inflict a
      bloody wound.</em></p><p><strong>Prerequisites</strong>: Dex 15, Exotic
      Weapon Proficiency (sawtooth sabre), Two-Weapon Fighting, worshiper of
      Achaekek.</p><p><strong>Benefits</strong>: If you hit an opponent with
      both your primary weapon and your off-hand weapon as part of the same
      attack action, and both of those weapons are sawtooth sabres, you deal 1
      point of bleed damage in addition to the normal damage dealt by these
      attacks.</p><h3>Combat Trick</h3><p>You can spend 2 stamina points when
      dealing bleed damage with the Bloody Sabres feat to increase the amount of
      bleed damage your opponent takes by 1.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
