name: Destroy Identity
system:
  description:
    value: >-
      <p><em>You can use your weapons to mar your opponents' most distinctive
      characteristics.</em></p><p><strong>Prerequisites</strong>: Critical
      Focus, base attack bonus +11, worshiper of
      Lamashtu.</p><p><strong>Benefits</strong>: Whenever you confirm a critical
      hit against an opponent, in addition to dealing critical damage as normal,
      you maim your target so much that it takes 2 points of Charisma damage and
      becomes staggered for 1 round.</p><h3>Combat Trick</h3><p>When you confirm
      a critical hit against an opponent, you can spend 4 stamina points to
      increase the Charisma damage that opponent takes from Destroy Identity to
      1d3+1 points.</p>
  tags:
    - Combat
    - Critical
    - Combat Trick
type: feat
