name: Duelist of the Shrouded Lake
system:
  description:
    value: >-
      <p><em>You have embraced the Shrouded Lake style of Aldori swordplay,
      known for its circuitous
      footwork.</em></p><p><strong>Prerequisites</strong>: Aldori Dueling
      Disciple, Exotic Weapon Proficiency (Aldori dueling sword), Weapon
      Finesse, Weapon Focus (Aldori dueling sword), base attack bonus
      +5.</p><p><strong>Benefits</strong>: When attempting to bull rush or
      reposition a foe, you gain a +1 insight bonus on the combat maneuver check
      and a +4 dodge bonus to your AC against attacks of opportunity you
      provoke. You also gain a +1 insight bonus to your CMD against bull rush
      and reposition attempts. When you attempt a dueling dodge during a duel,
      your bonus to AC increases to +6. To gain these benefits, you must be
      wielding only an Aldori dueling sword (not using a shield, an off-hand
      weapon, armor spikes, unarmed strikes, or natural weapons).</p><h3>Combat
      Trick</h3><p>By spending 5 stamina points when you attempt a combat
      maneuver check with an Aldori dueling sword, you gain a +4 bonus to your
      AC against attacks made by that target until the beginning of your next
      turn.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
