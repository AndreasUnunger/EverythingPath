name: Tenacious Hunter
system:
  description:
    value: >-
      <p><em>The animal is capable of quickly pinpointing hidden
      prey.</em></p><p><strong>Prerequisites</strong>: Perception 3 ranks,
      Stealth 3 ranks, animal companion.</p><p><strong>Benefits</strong>: The
      animal companion gains a +2 bonus on Perception checks to oppose Stealth
      checks. When using Perception to pinpoint an invisible creature's
      location, this bonus increases to +10. In addition, whenever the animal
      companion successfully uses Perception to notice a creature using Stealth
      or to pinpoint an invisible creature's location, that foe is denied its
      Dexterity bonus to AC against the next attack the animal companion makes
      on or before the animal companion's next turn.</p>
  tags:
    - General
type: feat
