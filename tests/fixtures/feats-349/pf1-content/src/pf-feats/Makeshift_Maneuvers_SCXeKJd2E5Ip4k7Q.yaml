name: Makeshift Maneuvers
system:
  description:
    value: >-
      <p><em>Your skill with improvised weapons allows you to use them to hamper
      your opponents.</em></p><p><strong>Prerequisites</strong>: Catch Off-Guard
      or Throw Anything, base attack bonus +1.</p><p><strong>Benefits</strong>:
      When you wield an improvised weapon, it gains the disarm and trip weapon
      properties.</p>
