name: Spirit Oni Master
system:
  description:
    value: >-
      <p><em>Through forbidden blood pacts, you have bound a spirit
      oni(Pathfinder RPG Bestiary 3 209) to your
      service.</em></p><p><strong>Prerequisites</strong>: Knowledge (planes) 3
      ranks; Lawful neutral, lawful evil, or neutral
      evil.</p><p><strong>Benefits</strong>: Whenever you wear a specially
      crafted oni mask (which costs 50 gp), you gain a primary gore attack
      dealing 1d4 points of damage. If you have poison use, you can apply poison
      to this gore attack as a move action.</p><p><strong>Normal</strong>:
      Applying poison to a weapon is a standard action.</p>
  tags:
    - General
type: feat
