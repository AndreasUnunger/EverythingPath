name: Focused Plant Expertise
system:
  description:
    value: >-
      <p><em>You are quick to dodge and slash anything that would ensnare
      you.</em></p><p><strong>Prerequisites</strong>: Favored enemy (plant)
      class feature.</p><p><strong>Benefits</strong>: You gain a bonus equal to
      half your favored enemy (plant) bonus on Reflex saves to avoid being
      entangled and to your CMD whenever an opponent attempts to grapple you.
      Your weapons' critical hit multipliers increase by one against creatures
      with the plant type.</p>
  tags:
    - Combat
type: feat
