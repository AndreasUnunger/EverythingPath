name: Extra Contingency
system:
  description:
    value: >-
      <p><em>You can manage multiple contingency
      effects.</em></p><p><strong>Prerequisites</strong>: Character level
      19th.</p><p><strong>Benefits</strong>: You can have two contingency
      effects active at one time. If they would both trigger on the same round,
      one (chosen randomly) does not trigger until 1 round
      later.</p><p><strong>Normal</strong>: You can benefit from only a single
      contingency active at a time.</p>
  tags:
    - General
type: feat
