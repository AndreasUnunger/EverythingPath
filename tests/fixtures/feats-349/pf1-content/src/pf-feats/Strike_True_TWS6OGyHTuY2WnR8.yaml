  description:
    value: >-
      <p><em>Rather than attempting a series of wild blows, you line up a
      perfect attack.</em></p><p><strong>Prerequisites</strong>: Combat
      Expertise, base attack bonus +6.</p><p><strong>Benefits</strong>: You can
      focus yourself as a move action. When focused, you gain a +4 bonus on your
      next melee attack roll before the end of your turn.</p>
