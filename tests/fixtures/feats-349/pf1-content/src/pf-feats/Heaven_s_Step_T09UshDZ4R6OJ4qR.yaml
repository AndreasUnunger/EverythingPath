name: Heaven's Step
system:
  description:
    value: >-
      <p><em>Like the daring Heaven's Step Offensive championed by Grand Prince
      Gennaris III of Taldor, you confidently take the fight to your enemy and
      strike an unexpected blow.</em></p><p><strong>Prerequisites</strong>: Dex
      15, Following Step, Step Up, Step Up and Strike, Two-Weapon Fighting, base
      attack bonus +10.</p><p><strong>Benefits</strong>: When you make an attack
      using Step Up and Strike, you can also make an extra attack with your
      offhand weapon using your highest base attack bonus. Both attacks take the
      normal penalties for two-weapon fighting.</p>
  tags:
    - Combat
type: feat
