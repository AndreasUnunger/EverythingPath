name: Grabbing Style
system:
  description:
    value: >-
      <p><em>You are adept at the one-handed
      grab.</em></p><p><strong>Prerequisites</strong>: Improved Grapple; base
      attack bonus +6, brawler's flurry class feature, or flurry of blows class
      feature.</p><p><strong>Benefits</strong>: When you use this style, you do
      not take a -4 penalty on combat maneuver checks to grapple a foe with only
      one hand. Additionally, you do not lose your Dexterity bonus to AC while
      pinning an opponent.</p><p><strong>Normal</strong>: Without two hands
      free, you take a -4 penalty on the combat maneuver roll to grapple a foe.
      While pinning a foe, you lose your Dexterity bonus to AC.</p><h3>Combat
      Trick</h3><p>When you make a grapple attempt with two hands while using
      this style, you can spend 1 stamina point to gain a +2 bonus on the
      grapple combat maneuver check.</p>
  tags:
    - Combat
    - Style
    - Combat Trick
type: feat
