name: Greater Drow Nobility
system:
  description:
    value: >-
      <p><em>You have mastered the lesser spell-like abilities of the drow,
      demonstrating true nobility.</em></p><p><strong>Prerequisites</strong>:
      Cha 13, Drow Nobility, Improved Drow Nobility, able to use drow spell-like
      abilities, drow.</p><p><strong>Benefits</strong>: Your detect magic
      spell-like ability is now constant. You may use your dancing lights,
      deeper darkness, faerie fire, feather fall, and levitate spell-like
      abilities at will.</p>
