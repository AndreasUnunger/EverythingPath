  description:
    value: >-
      <p><em>Your familiarity with dragonkind makes you less susceptible to
      their abilities.</em></p><p><strong>Prerequisites</strong>: Knowledge
      (arcana) 1 rank.</p><p><strong>Benefits</strong>: You gain a +1 bonus on
      all saving throws against auras, breath weapons, spell-like abilities,
      spells, supernatural abilities, and other special attacks of creatures
      with the dragon type.</p>
