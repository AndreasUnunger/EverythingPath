name: Split Trick
system:
  description:
    value: >-
      <p><em>You can split a mesmerist trick between two
      targets.</em></p><p><strong>Prerequisites</strong>: Mesmerist trick class
      feature.</p><p><strong>Benefits</strong>: Whenever you implant a mesmerist
      trick in a target, you can designate that trick as a split trick. When
      doing so, you touch two targets and split the trick between them. This
      counts as implanting a mesmerist trick in both targets. The mesmerist
      trick functions as normal, except that when the trick's triggering
      condition occurs, you must choose one of the split trick's targets to
      receive the effects of the split trick. The other target receives no
      benefit from the trick.</p>
  tags:
    - Trick
type: feat
