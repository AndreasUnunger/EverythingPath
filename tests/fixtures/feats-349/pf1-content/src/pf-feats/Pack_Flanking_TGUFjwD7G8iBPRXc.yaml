name: Pack Flanking
system:
  description:
    value: >-
      <p><em>You and your companion creature are adept at fighting together
      against foes.</em></p><p><strong>Prerequisites</strong>: Int 13, Combat
      Expertise, ability to acquire an animal
      companion.</p><p><strong>Benefits</strong>: When you and your companion
      creature have this feat, your companion creature is adjacent to you or
      sharing your square, and you both threaten the same opponent, you are both
      considered to be flanking that opponent, regardless of your actual
      positioning.</p><p><strong>Normal</strong>: You must be positioned
      opposite an ally to flank an opponent.</p>
  tags:
    - Teamwork
type: feat
