name: Arcane Shield
system:
  description:
    value: >-
      <p><em>You can convert any spell into a
      defense.</em></p><p><strong>Prerequisites</strong>: Arcane spellcaster,
      caster level 10th.</p><p><strong>Benefits</strong>: As a immediate action,
      you can sacrifice a prepared spell or unused spell slot of 1st level or
      higher and gain a deflection bonus to AC equal to the level of the spell
      or spell slot you sacrificed for 1 round. 0-level spells may not be
      sacrificed in this manner.</p>
  tags:
    - General
type: feat
