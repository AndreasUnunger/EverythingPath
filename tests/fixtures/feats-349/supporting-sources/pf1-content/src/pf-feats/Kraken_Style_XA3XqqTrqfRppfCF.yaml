name: Kraken Style
system:
  description:
    value: >-
      <p><em>You savagely squeeze and twist when
      grappling.</em></p><p><strong>Prerequisites</strong>: Wis 13, Improved
      Grapple, Improved Unarmed Strike, base attack bonus +3 or monk level
      3rd.</p><p><strong>Benefits</strong>: When you succeed at a grapple check
      while using this style, your opponent takes an amount of bludgeoning
      damage equal to your Wisdom modifier in addition to any damage your
      grapple deals, such as when you choose to harm your opponent as part of a
      successful check to maintain a grapple. In addition, you gain a +2 bonus
      on combat maneuver checks to maintain a grapple.</p>
  tags:
    - Combat
    - Style
type: feat
