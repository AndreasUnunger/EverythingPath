name: Shatter Resolve
system:
  description:
    value: >-
      <p><em>Your negative energy causes despair in those you
      harm.</em></p><p><strong>Prerequisites</strong>: Channel energy class
      feature, worshiper of Urgathoa.</p><p><strong>Benefits</strong>: When you
      damage a creature by channeling negative energy, you fill your foe with
      fear. A creature that fails its Will save against your channeled energy
      also becomes shaken for a number of rounds equal to the number of dice you
      roll for your channel energy ability.</p>
  tags:
    - General
