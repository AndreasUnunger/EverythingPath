name: Improved Conceal Spell
system:
  description:
    value: >-
      <p><em>You can conceal the mightiest spells in the subtlest
      fashions.</em></p><p><strong>Prerequisites</strong>: Conceal Spell,
      Deceitful, Bluff 5 ranks, Disguise 5 ranks, Sleight of Hand 10 ranks,
      ability to cast 3rd-level spells or use a 3rd-level spell-like
      ability.</p><p><strong>Benefits</strong>: When you use Conceal Spell,
      creatures no longer gain a bonus equal to the level of the spell or
      spell-like ability on their checks to notice the hidden
      spell.</p><p><strong>Normal</strong>: Creatures attempting to notice a
      spell hidden with Conceal Spell gain a bonus equal to the level of the
      spell or spell-like ability on their Perception, Sense Motive, and
      Spellcraft checks.</p>
  tags:
    - General
type: feat
