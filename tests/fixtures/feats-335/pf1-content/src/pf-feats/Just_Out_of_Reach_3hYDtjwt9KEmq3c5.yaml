name: Just Out of Reach
system:
  description:
    value: >-
      <p><em>The farther an attacker is from you, the more easily you avoid its
      melee attacks.</em></p><p><strong>Prerequisites</strong>: Dex 13, Dodge,
      Mobility.</p><p><strong>Benefits</strong>: When a foe more than 5 feet
      away from you makes a melee attack against you using reach, you gain a +4
      dodge bonus to your AC against the attack.</p>
  tags:
    - Combat
type: feat
