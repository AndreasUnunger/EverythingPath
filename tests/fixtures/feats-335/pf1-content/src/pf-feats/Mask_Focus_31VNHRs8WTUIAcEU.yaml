name: Mask Focus
system:
  description:
    value: >-
      <p><em>You can use your mask as an additional focus for your arcane
      spells, enhancing their power.</em></p><p><strong>Prerequisites</strong>:
      Extend Spell, Nameless One, ability to cast 3rd-level arcane
      spells.</p><p><strong>Benefits</strong>: While you're benefiting from the
      Nameless One feat (see below), the mask you wear to gain the benefits of
      that feat satisfies the focus component of any spell you cast that
      requires a mask (such as mask from divination). In addition, once per day
      you can apply the Extend Spell metamagic feat to an arcane spell without
      increasing the spell's level by adding your mask as a focus component.
      When Extend Spell is applied in this manner, its increase to duration
      applies only to effects that target you; other creatures use the spell's
      normal duration. For example, if you use this ability with the haste
      spell, the spell's effects last twice as long for you, but not for any
      other creature that you target with the spell.</p>
  tags:
    - General
type: feat
