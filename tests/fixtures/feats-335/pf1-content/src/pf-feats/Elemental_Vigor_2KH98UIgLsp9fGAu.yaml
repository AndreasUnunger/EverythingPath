name: Elemental Vigor
system:
  description:
    value: >-
      <p><em>You have learned transformative secrets from communing with
      elemental beings.</em></p><p><strong>Prerequisites</strong>: Worshiper of
      an elemental lord.</p><p><strong>Benefits</strong>: Whenever you use a
      polymorph effect to assume the form of an elemental you gain a rush of
      vital energy. You gain a number of temporary hit points equal to the
      caster level of the polymorph effect and you gain a +10 foot bonus to your
      base speed.</p>
  tags:
    - General
type: feat
