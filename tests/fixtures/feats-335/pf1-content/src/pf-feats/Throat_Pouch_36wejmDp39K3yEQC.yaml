name: Throat Pouch
system:
  description:
    value: >-
      <p><em>You can swell your throat to amplify and broadcast your
      vocalizations over vast
      distances.</em></p><p><strong>Prerequisites</strong>: Boggard, terrifying
      croak.</p><p><strong>Benefits</strong>: The range of your terrifying croak
      ability increases by 5 feet for every 2 Hit Dice you have (maximum 30-foot
      increase). While speaking Boggard or wordlessly vocalizing, you can swell
      your throat pouch as a free action to reduce the Perception DC needed to
      hear your voice by an amount equal to your Hit
      Dice.</p><p><strong>Special</strong>: The benef its of Throat Pouch and
      any feats that use it as a prerequisite are available only while you're
      wearing light, medium, or no armor.</p>
  tags:
    - General
type: feat
