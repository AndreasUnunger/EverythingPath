name: Destructive Dispel
system:
  description:
    value: >-
      <p><em>When you dispel an enemy's magical defenses, those defenses crash
      down with debilitating effects.</em></p><p><strong>Prerequisites</strong>:
      Ability to cast dispel magic or greater dispel magic, caster level
      11th.</p><p><strong>Benefits</strong>: When you successfully make a
      targeted dispel check against an opponent, that opponent must succeed at a
      Fortitude save (DC equals the DC of the spell used to dispel) or be
      stunned until the start of your next turn. If the save succeeds, the
      opponent is instead sickened until the start of your next turn.</p>
  tags:
    - General
type: feat
