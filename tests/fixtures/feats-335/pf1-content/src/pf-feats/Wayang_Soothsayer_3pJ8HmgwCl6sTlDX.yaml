name: Wayang Soothsayer
system:
  description:
    value: >-
      <p><em>You embody the ideals of wayang society and
      culture.</em></p><p><strong>Prerequisites</strong>:
      Wayang.</p><p><strong>Benefits</strong>: You gain the shadow speaker
      racial trait (see page 10). If you already have the shadow speaker racial
      trait, you can increase the number of times per day that you can use
      shadow speaker by 1, and increase the insight bonus granted from each type
      of use by 1.</p><p><strong>Special</strong>: This feat can be taken once
      at 1st level, and again at 11th level.</p>
