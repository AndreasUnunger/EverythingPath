name: Point-Blank Master
system:
  description:
    value: >-
      <p><em>You are adept at firing ranged weapons in close
      quarters.</em></p><p><strong>Prerequisites</strong>: Weapon Specialization
      with selected ranged weapon.</p><p><strong>Benefits</strong>: Choose one
      type of ranged weapon. You do not provoke attacks of opportunity when
      firing the selected weapon while
      threatened.</p><p><strong>Normal</strong>: Using a ranged weapon while you
      are threatened provokes attacks of
      opportunity.</p><p><strong>Special</strong>: Starting at 6th level, a
      ranger with the archery combat style may select Point Blank Master as a
      combat style feat, but he must have Weapon Focus instead of Weapon
      Specialization in the selected weapon.</p><p><strong>Combat
      Trick</strong>: When firing any type of ranged weapon, throwing a weapon,
      or making a ranged touch attack, you can spend 2 stamina points to avoid
      provoking an attack of opportunity.</p>
  tags:
    - Combat
type: feat
