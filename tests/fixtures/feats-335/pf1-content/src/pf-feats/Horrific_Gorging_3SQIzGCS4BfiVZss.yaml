name: Horrific Gorging
system:
  description:
    value: >-
      <p><em>In the space of a few horrific seconds, you can chew up and gulp
      down an entire humanoid body.</em></p><p><strong>Prerequisites</strong>:
      Bite attack, Large or larger, swallow whole universal monster
      ability.</p><p><strong>Benefits</strong>: As a full-round action, you can
      completely consume a dead, unconscious, paralyzed, or otherwise helpless
      humanoid creature that you could normally swallow with your swallow whole
      ability. When you do, you deal bite damage as a critical hit and swallow
      the humanoid as your swallow whole special ability.</p><p>Allies of the
      swallowed creature within 30 feet that can see you indulge in this
      horrific feast must succeed at a Will save (DC = 10 + 1/2 your Hit Dice +
      your Charisma modifier) to avoid being shaken for 1d4 rounds. This part of
      the ability is a mind-affecting fear effect.</p>
  tags:
    - Combat
type: feat
