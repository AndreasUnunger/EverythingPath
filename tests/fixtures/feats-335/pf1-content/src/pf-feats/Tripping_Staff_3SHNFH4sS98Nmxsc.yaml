name: Tripping Staff
system:
  description:
    value: >-
      <p><em>You can make a trip attack with your
      quarterstaff.</em></p><p><strong>Prerequisites</strong>: Int 13, Combat
      Expertise, Improved Trip, Weapon Focus (quarterstaff), base attack bonus
      +6.</p><p><strong>Benefits</strong>: You treat quarterstaves as if they
      had the trip special feature.</p><p><strong>Special</strong>: If you are a
      magus with the staff magus archetype, you can use spellstrike on any trip
      combat maneuver you make with the staff.</p><p><strong>Combat
      Trick</strong>: You can select this feat even if you don't meet the
      ability score prerequisite (Intelligence 13). You gain the benefits of
      this feat only as long as you have at least 1 stamina point in your
      stamina pool.</p>
  tags:
    - Combat
type: feat
