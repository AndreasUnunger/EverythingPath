name: Field Repair
system:
  description:
    value: >-
      <p><em>You can repair your broken weapon or armor to serviceability even
      without the benefits of artisan
      tools.</em></p><p><strong>Prerequisites</strong>: Craft 4
      ranks.</p><p><strong>Benefits</strong>: If you are trained in a Craft
      skill appropriate to a broken item, you can repair that item with no raw
      material cost and no penalty on your Craft skill check for using
      improvised tools. If you spend a day, the item regains 1 hit point plus
      one-quarter of its original hit points. Alternatively, if the item gained
      the broken condition because it is a firearm that has misfired or a siege
      engine that suffered a mishap, or has the broken condition because it has
      the fragile weapon quality (or some similar quality), you can make a Craft
      check with the DC it takes to craft that item (see Table 2-2, below). If
      the check succeeds, the item loses the broken
      condition.</p><p><strong>Normal</strong>: Improvised tools impose a -2
      penalty on Craft checks. Items require raw materials to
      repair.</p><p><table> <tr><td><strong>Item</strong></td><td> <strong>Craft
      Skill</strong></td><td> <strong>Craft DC</strong></td></tr> <tr><td>A
      weapon with the fragile special quality</td><td> Weapon or Bow</td><td>
      Normal DC -5</td></tr> <tr><td>One-handed firearm</td><td>
      Firearm</td><td> 20</td></tr> <tr><td>Two-handed firearm</td><td>
      Firearm</td><td> 20</td></tr> <tr><td>Siege firearm, heavy</td><td>
      Firearm</td><td> 25</td></tr> <tr><td>Siege firearm, medium</td><td>
      Firearm</td><td> 30</td></tr> <tr><td>Siege firearm, light</td><td>
      Firearm</td><td> 35</td></tr> <tr><td>Ranged siege engine, heavy</td><td>
      Siege Engine</td><td> 20</td></tr> <tr><td>Ranged siege engine,
      medium</td><td> Siege Engine</td><td> 25</td></tr> </table></p>
  tags:
    - General
type: feat
