name: Inexplicable Luck
system:
  description:
    value: >-
      <p><em>Others are often dumfounded by your
      luck.</em></p><p><strong>Prerequisites</strong>: Defiant Luck,
      human.</p><p><strong>Benefits</strong>: Once per day, as a free action
      before a roll is made, you gain a +8 bonus on any single d20 roll. You can
      also use this ability after the roll is made, but if you do, this bonus is
      reduced to +4.</p>
  tags:
    - Racial
    - Human
type: feat
