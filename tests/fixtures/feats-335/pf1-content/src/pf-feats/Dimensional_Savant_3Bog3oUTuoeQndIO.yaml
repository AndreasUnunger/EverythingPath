name: Dimensional Savant
system:
  description:
    value: >-
      <p><em>You flash into and out of reality so quickly it is impossible to
      tell exactly where you are at any given
      time.</em></p><p><strong>Prerequisites</strong>: Dimensional Agility,
      Dimensional Assault, Dimensional Dervish, ability to use the abundant step
      class feature or cast dimension door, base attack bonus
      +9.</p><p><strong>Benefits</strong>: While using the Dimensional Dervish
      feat, you provide flanking from all squares you attack from. Flanking
      starts from the moment you make an attack until the start of your next
      turn. You can effectively flank with yourself and with multiple allies
      when using this feat.</p>
  tags:
    - General
type: feat
