name: Waking Dream
system:
  description:
    value: >-
      <p><em>You can manipulate the world of dreams, even in your physical
      form.</em></p><p><strong>Prerequisites</strong>: Cha 17, Ephemeral Tread,
      Lucid Dreamer, Knowledge (planes) 10
      ranks.</p><p><strong>Benefits</strong>: When in the Dimension of Dreams in
      your physical body, you gain an additional attempt at an impossible action
      per day, for a total of two attempts. However, as a result of your
      meddling with the fabric of the realm, when you travel to the Dimension of
      Dreams in your physical body, you must succeed at a DC 15 Charisma check
      or arrive at a disadvantage.</p>
  tags:
    - General
type: feat
