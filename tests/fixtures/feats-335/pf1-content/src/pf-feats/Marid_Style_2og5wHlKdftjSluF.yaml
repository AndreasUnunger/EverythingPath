name: Marid Style
system:
  description:
    value: >-
      <p><em>You conjure tendrils of icy water to strike your enemies from a
      distance.</em></p><p><strong>Prerequisites</strong>: Con 13, Wis 15,
      Elemental Fist, Improved Unarmed Strike, base attack bonus +9 or monk
      level 5th.</p><p><strong>Benefits</strong>: You gain one additional
      Elemental Fist (Advanced Player's Guide 158) attempt per day. While using
      this style and Elemental Fist to deal cold damage, you gain a bonus on
      cold damage rolls equal to your Wisdom modifier, and your reach with your
      unarmed strike increases by 5 feet.</p><h3>Combat Trick</h3><p>When you
      make an Elemental Fist attack to deal cold damage, you can spend up to 5
      stamina points to deal an amount of additional cold damage equal to double
      the number of stamina points you spent.</p>
  tags:
    - Combat
    - Style
    - Combat Trick
type: feat
