name: Tatzlwyrm Grappler
system:
  description:
    value: >-
      <p><em>You can twist and bend in a way that makes you extremely difficult
      to grab.</em></p><p><strong>Prerequisites</strong>: Dex 13, Improved
      Grapple, Improved Unarmed Strike, Tatzlwyrm Claw Style, Escape Artist 3
      ranks.</p><p><strong>Benefits</strong>: While you're using the Tatzlwyrm
      Style feat, whenever an opponent attempts to initiate a grapple against
      you, you can attempt an Escape Artist check. If the result is higher than
      your CMD, you can use the result as your CMD against that combat maneuver.
      You must be aware of the attack and not flat-footed.</p>
  tags:
    - Combat
type: feat
