name: Fearsome Spell-Like Ability
system:
  description:
    value: >-
      <p><em>Your spell-like ability induces fear in affected
      targets.</em></p><p><strong>Prerequisites</strong>: Spell-like ability at
      caster level 6th or higher.</p><p><strong>Benefits</strong>: Choose one of
      your spell-like abilities, subject to the restrictions described in this
      feat. You can use the chosen spell-like ability as a fearsome spell-like
      ability three times per day (or less, if the ability is normally usable
      only once or twice per day).</p><p>When a target takes damage from a
      fearsome spelllike ability and fails its saving throw against the
      spell-like ability, it becomes shaken for a number of rounds equal to the
      spell-like ability's equivalent spell level. If the spell-like ability
      doesn't allow a saving throw, creatures harmed by it can attempt a Will
      save (against the DC that the spell-like ability would have if it allowed
      a saving throw) to negate the shaken effect. If the effect of the
      spell-like ability also causes targets to become shaken and a target fails
      its saving throw, the duration of the shaken condition caused by this
      effect stacks with the spell-like ability's. A fearsome spelllike ability
      can't cause a creature to become frightened, even if that creature is
      already shaken.</p><p>You can only select a spell-like ability duplicating
      a spell with a level less than or equal to 1/2 your caster level (round
      down) - 2. For a summary, see Table 3-1.</p><p>Special: This feat can be
      taken multiple times. Each time it is taken, you can apply it to a
      different spell-like ability.</p><table><tbody><tr><td>Spell
      Level</td><td>Caster Level1</td><td>Caster
      Level2</td></tr><tr><td>0</td><td>2nd</td><td>4th</td></tr><tr><td>1st</td><td>4th</td><td>6th</td></tr><tr><td>2nd</td><td>6th</td><td>8th</td></tr><tr><td>3rd</td><td>8th</td><td>10th</td></tr><tr><td>4th</td><td>10th</td><td>12th</td></tr><tr><td>5th</td><td>12th</td><td>14th</td></tr><tr><td>6th</td><td>14th</td><td>16th</td></tr><tr><td>7th</td><td>16th</td><td>18th</td></tr><tr><td>8th</td><td>18th</td><td>20th</td></tr><tr><td>9th</td><td>20th</td><td>-</td></tr></tbody></table><p>1&nbsp;Bouncing,
      disruptive, intensified, lingering, or scarring ability.<br />2Fearsome,
      sickening, or traumatic ability.</p>
