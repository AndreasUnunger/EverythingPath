name: Spell Cartridges
system:
  description:
    value: >-
      <p><em>You can fire bullets of arcane energy when your ammunition runs
      low.</em></p><p><strong>Prerequisites</strong>: Arcane Strike, ability to
      cast arcane spells, proficient with
      firearms.</p><p><strong>Benefits</strong>: While your gun is imbued with
      power from the Arcane Strike feat, you can fire force bullets instead of
      regular ammunition. A force bullet deals 1d4 points of force damage for
      every five caster levels you have. Force bullets do not use black powder
      or ammunition and count as magic for the purpose of bypassing damage
      reduction.</p>
  tags:
    - Combat
type: feat
