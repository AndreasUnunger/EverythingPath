name: Fiend Sight
system:
  description:
    value: >-
      <p><em>Your eyes develop keener sight in dim light and
      darkness.</em></p><p><strong>Prerequisites</strong>: Darkvision 60 ft.,
      tiefling.</p><p><strong>Benefits</strong>: You gain low-light vision and
      your darkvision improves to 120 ft.</p><p><strong>Special</strong>: You
      can take this feat twice. When you take it a second time, you gain the see
      in darkness universal monster ability.</p>
  tags:
    - Racial
    - Tiefling
