name: Kyton Style
system:
  description:
    value: >-
      <p><em>Your fighting style emulates the disciplined nature of the kytons,
      with passion and pain held tightly in
      chains.</em></p><p><strong>Prerequisites</strong>: Wis 13, Exotic Weapon
      Proficiency (spiked chain), Knowledge (planes) 3 ranks, ki pool class
      feature.</p><p><strong>Benefits</strong>: When using this style, you treat
      spiked chains as if they had the monk special weapon feature.
      Additionally, if you have Stunning Fist, you can spend 1 point from your
      ki pool to make a Stunning Fist attack with your spiked chain instead of
      an unarmed strike. This still costs a use of Stunning Fist as normal.</p>
  tags:
    - Combat
    - Style
type: feat
