name: Fearless Curiosity
system:
  description:
    value: >-
      <p><em>Your desire to see and experience the world overrides healthy
      caution.</em></p><p><strong>Prerequisites</strong>: Cha 13,
      human.</p><p><strong>Benefits</strong>: You gain a +1 bonus on saving
      throws against effects with the emotion descriptor. In addition, for any
      round in which you begin your turn affected by a fear effect, you gain a
      new save at the beginning of your turn to reduce the severity of the fear
      effect, from panicked to frightened, frightened to shaken, and shaken to
      unaffected.</p>
  tags:
    - Racial
    - Human
type: feat
