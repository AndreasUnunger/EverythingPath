name: Mythic Companion
system:
  description:
    value: >-
      <p><em>Despite your non-mythic nature, you're a vital part of the greater
      mythic world.</em></p><p><strong>Prerequisites</strong>: You must be
      non-mythic.</p><p><strong>Benefits</strong>: You're considered a mythic
      creature for the purposes of determining how mythic spells and effects
      affect you. If you ever become mythic, you gain a +1 bonus on all saves
      against mythic spells and effects.</p>
  tags:
    - General
    - Mythic
type: feat
