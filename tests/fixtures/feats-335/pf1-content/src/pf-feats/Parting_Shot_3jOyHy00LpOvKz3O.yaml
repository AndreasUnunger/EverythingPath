name: Parting Shot
system:
  description:
    value: >-
      <p><em>You are an expert skirmisher, able to rain missiles upon your
      enemies whether advancing or
      retreating.</em></p><p><strong>Prerequisites</strong>: Dex 13, Dodge,
      Mobility, Point-Blank Shot, Shot on the Run, base attack bonus
      +6.</p><p><strong>Benefits</strong>: Once per encounter, when using the
      withdraw action, you can make a single ranged attack at any point during
      your movement.</p><p><strong>Normal</strong>: You cannot attack when using
      the withdraw action.</p><p><strong>Special</strong>: Starting at 6th
      level, a ranger with the archery combat style may select Parting Shot as a
      combat style feat.</p><h3>Combat Trick</h3><p>You can spend 2 stamina
      points to use this feat's benef it a second time during a single
      encounter. You can use this combat trick only once per encounter, so you
      still can't make more than two Parting Shot attacks total in one
      encounter.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
