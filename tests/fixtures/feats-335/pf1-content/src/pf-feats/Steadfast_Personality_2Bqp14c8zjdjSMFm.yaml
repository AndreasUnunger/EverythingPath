name: Steadfast Personality
system:
  description:
    value: >-
      <p><em>You rely on your assuredness and sense of self to help keep your
      mind clear.</em></p><p><strong>Benefits</strong>: Add your Charisma
      modifier instead of your Wisdom bonus on Will saves against mind-affecting
      effects. If you have a Wisdom penalty, you must apply both your Wisdom
      penalty and your Charisma modifier.</p>
  tags:
    - General
type: feat
