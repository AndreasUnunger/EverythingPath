name: Ostentatious Display
system:
  description:
    value: >-
      <p><em>Your extravagant jewelry and accessories give you an air of
      importance you can use to your advantage in many social
      situations.</em></p><p><strong>Benefits</strong>: As long as you are
      wearing a valuable nonmagical item in a magic item slot, you gain a +1
      bonus on skill checks with a corresponding skill. Bonuses from wearing
      items in multiple slots that affect the same skill do not stack.</p><p>
      Each item must be worth at least 5% of your character wealth by level (see
      Table 12-4 on page 399 of the Pathfinder RPG Core Rulebook). For example,
      a 6th-level PC gains a +1 bonus on Bluff checks while wearing a
      gem-studded tiara (which fills the headband slot) worth at least 800 gp.
      When she reaches 7th level, she must wear an accessory in the appropriate
      slot worth at least 1,175 gp in order to continue gaining this
      bonus.</p><p><table><tr><td><strong>Item
      Slot</strong></td><td><strong>Skill Bonus</strong></td></tr> <tr><td>Belt,
      chest, shoulders</td><td>+1 Intimidate</td></tr> <tr><td>Body, feet,
      neck</td><td>+1 Diplomacy</td></tr> <tr><td>Eyes, hands,
      headband</td><td>+1 Bluff</td></tr> <tr><td>Head, ring, wrists</td><td>+1
      Perform (any)</td></tr></table></p>
  tags:
    - General
type: feat
