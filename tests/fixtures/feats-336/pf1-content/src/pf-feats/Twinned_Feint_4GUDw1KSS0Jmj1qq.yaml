img: systems/pf1/icons/feats/greater-feint.png
name: Twinned Feint
system:
  description:
    value: >-
      <p><em>You can fool two opponents with a single
      feint.</em></p><p><strong>Prerequisites</strong>: Cha
      13.</p><p><strong>Benefits</strong>: As a standard action, you can attempt
      to feint against a foe within your reach. If you succeed at the feint, you
      can make an additional feint attempt against a foe that is adjacent to the
      first one and also within reach. You can attempt only one additional feint
      per action with this feat. When you use this feat, you take a -2 penalty
      to your AC until your next turn.</p><p><strong>Special</strong>: If you
      have the Improved Feint feat, you can use this feat as a move action
      instead.</p><h3>Combat Trick</h3><p>: After succeeding at the first feint
      while using this feat, you can spend 2 stamina points to attempt a second
      feint against any foe within your reach, even if it's not adjacent to the
      first foe.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
