name: Ruthless Opportunist
system:
  description:
    value: >-
      <p><em>Your timing and fierceness take the enemy by
      surprise.</em></p><p><strong>Prerequisites</strong>: Human
      (Chelaxian).</p><p><strong>Benefits</strong>: When a Chelish ally with
      this feat hits with an attack of opportunity against an enemy both you and
      that ally are threatening, you gain a +2 circumstance bonus on your melee
      attack rolls against that enemy for 1 round.</p>
  tags:
    - Combat
    - Teamwork
type: feat
