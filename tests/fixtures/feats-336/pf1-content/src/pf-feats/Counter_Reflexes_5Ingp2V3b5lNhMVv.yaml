name: Counter Reflexes
system:
  description:
    value: >-
      <p><em>Your opponent's advanced training in moving around you is surpassed
      only by your readiness for it.</em></p><p><strong>Prerequisites</strong>:
      Anticipate Dodge, Dodge, Mobility; base attack bonus +9, brawler level
      6th, or monk level 6th.</p><p><strong>Benefits</strong>: Opponents with
      the Mobility feat do not gain the dodge bonus granted by that feat when
      they provoke attacks of opportunity by moving out of or within your
      threatened area.</p><h3>Combat Trick</h3><p>When an opponent with the
      Mobility feat moves out of or within your threatened area, you can spend 2
      stamina points to gain a +4 bonus on your attack of opportunity.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
