name: Friend to Animals
system:
  description:
    value: >-
      <p><em>You show great respect for all living things, and they sense and
      return the gesture.</em></p><p><strong>Prerequisites</strong>: Nature
      Soul, Handle Animal 3 ranks.</p><p><strong>Benefits</strong>: As a
      standard action you can require all animals within 30 feet to make a Will
      saving throw. Animals who fail the save cannot attack you unless you
      attack them or one of their allies first. The DC of the Will save is equal
      to 10 + half your character level + your Charisma modifier.</p>
  tags:
    - General
type: feat
