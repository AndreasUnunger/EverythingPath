name: Extra Shadow Jump
system:
  description:
    value: >-
      <p><em>You have an improved ability to leap through
      shadow.</em></p><p><strong>Prerequisites</strong>: Shadow jump
      shadowdancer class feature.</p><p><strong>Benefits</strong>: Add 10 feet
      to the total distance you can jump each day using the shadow jump ability.
      The extra distance provided by this feat doubles whenever the distance
      that you can jump doubles (20 feet at 6th, 40 feet at 8th, and 80 feet at
      10th level).</p><p><strong>Special</strong>: This feat can be selected up
      to four times. Its effects stack.</p>
  tags:
    - General
type: feat
