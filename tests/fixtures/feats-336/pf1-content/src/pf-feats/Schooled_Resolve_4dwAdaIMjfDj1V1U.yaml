name: Schooled Resolve
system:
  description:
    value: >-
      <p><em>Your intensive combat training to fight vampiric forces allows you
      to fight off their mental spells and effects using your resistance to
      fear.</em></p><p><strong>Prerequisites</strong>: Bravery class
      feature.</p><p><strong>Benefits</strong>: You add your bravery bonus on
      Will saves against mind-affecting spells and effects from vampires. This
      does not stack with the normal bravery bonus on saves against fear
      effects.</p>
  tags:
    - General
type: feat
