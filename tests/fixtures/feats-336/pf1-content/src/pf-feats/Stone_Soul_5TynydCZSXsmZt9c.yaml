name: Stone Soul
system:
  description:
    value: >-
      <p><em>You're so attuned to the earth that your skin can harden to the
      thickness of stone.</em></p><p><strong>Prerequisites</strong>: Stone
      giant.</p><p><strong>Benefits</strong>: Your natural armor bonus increases
      by 1. Once per day, you can use stoneskin (on yourself only) as a
      spell-like ability. Your caster level is equal to 1/2 your Hit
      Dice.</p><p><strong>Special</strong>: You can take this feat up to three
      times. Each additional time you take this feat, the number of times you
      can use stoneskin per day increases by one.</p>
  tags:
    - Monster
    - Giant
type: feat
