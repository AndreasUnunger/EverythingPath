name: Elemental Channel (Mythic)
system:
  description:
    value: >-
      <p><em>Your power over elemental beings is nearly
      absolute.</em></p><p><strong>Prerequisites</strong>: Elemental
      Channel.</p><p><strong>Benefits</strong>: Your Elemental Channel can
      affect any elemental subtype, not just the one you chose when you took
      Elemental Channel. Each time you use Elemental Channel, you must pick one
      elemental subtype before using the feat. You can expend one use of mythic
      power when you use Elemental Channel to choose a second elemental subtype
      to affect.</p>
  tags:
    - Channeling
    - Mythic
type: feat
