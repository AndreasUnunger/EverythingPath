name: Reckless Aim
system:
  description:
    value: >-
      <p><em>Your lack of regard for others proves a boon when you fire
      projectiles into melee.</em></p><p><strong>Prerequisites</strong>:
      Point-Blank Shot, Precise Shot.</p><p><strong>Benefits</strong>: When you
      shoot or throw ranged weapons at an opponent engaged in melee, you can
      choose to take a -1 penalty to your AC and gain a +2 competence bonus on
      your attack roll. However, when you roll a natural 1 on a ranged attack
      roll made with this bonus, you automatically hit a random adjacent
      creature that threatens your intended target.</p>
  tags:
    - Combat
type: feat
