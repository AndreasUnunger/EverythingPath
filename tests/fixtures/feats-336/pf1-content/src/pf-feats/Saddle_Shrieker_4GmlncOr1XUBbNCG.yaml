name: Saddle Shrieker
system:
  description:
    value: >-
      <p><em>You sometimes get carried away when encouraging your mount to
      fight.</em></p><p><strong>Prerequisites</strong>: Goblin, Ride 1
      rank.</p><p><strong>Benefits</strong>: You can choose to take a -1 penalty
      on all attack rolls and combat maneuver checks to grant your mount a +1
      bonus on all attack rolls and damage rolls made with natural weapons.
      These effects affect you and your mount for 1 round. When your base attack
      bonus reaches +4, and every 4 points thereafter, this penalty increases by
      -1 and the bonus to your mount's attack and damage increases by +1 to a
      maximum of +5. You must choose to use this feat before making an attack
      roll.</p><p><strong>Pathfinder Society<br /></strong>Only legal goblin PCs
      are allowed to choose anything from this book</p>
  tags:
    - Combat
    - Racial
    - Goblin
type: feat
