name: Surprising Strategy
system:
  description:
    value: >-
      <p><em>Your quick swordsmanship leaves your opponents struggling to
      predict your moves.</em></p><p><strong>Prerequisites</strong>: Riposte
      class feature.</p><p><strong>Benefits</strong>: In addition to the attack
      of opportunity you can make when you successfully parry an attack, you can
      attempt a dirty trick, disarm, or sunder combat maneuver with a +2 morale
      bonus without provoking an attack of opportunity against the creature
      whose attack you parry, so long as the creature is within reach.</p>
  tags:
