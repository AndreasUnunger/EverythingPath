name: Greater Weapon of the Chosen
system:
  description:
    value: >-
      <p><em>Your deity guides your hand when you fight with her favored
      weapon.</em></p><p><strong>Prerequisites</strong>: Improved Weapon of the
      Chosen, Weapon Focus with deity's favored weapon, Weapon of the Chosen,
      worship and receive spells from a deity.</p><p><strong>Benefits</strong>:
      When you use your deity's favored weapon to attempt a single attack with
      the attack action, you roll two dice for your attack roll and take the
      higher result. You do not need to use your Weapon of the Chosen feat to
      gain this feat's benefit. As usual, the reroll does not apply to any
      confirmation rolls.</p><h3>Combat Trick</h3><p>When making an attack as
      part of a full attack with the weapon designated by your Weapon of the
      Chosen feat, you can spend 5 stamina points to gain the benefits of this
      feat on that attack.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
