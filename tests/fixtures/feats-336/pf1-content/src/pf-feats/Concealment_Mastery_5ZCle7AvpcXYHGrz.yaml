name: Concealment Mastery
system:
  description:
    value: >-
      <p><em>You can use illusion magic items to conceal your presence, or
      possibly even your true nature.</em></p><p><strong>Prerequisites</strong>:
      Stealth 3 ranks, Use Magic Device 3 ranks, base Fortitude saving throw
      bonus +3.</p><p><strong>Benefits</strong>: You can cause an item that has
      an illusion spell of 1st level or higher listed in its construction
      requirements to cast vanish. If you have 7 ranks in both Stealth and Use
      Magic Device, you can instead cause an item that has an illusion spell of
      2nd level or higher listed in its construction requirements to cast either
      invisibility or undetectable alignment. You can use this feat once per
      day, plus an additional time per day when your base Fortitude save bonus
      reaches +9 and +12.</p>
  tags:
    - Item Mastery
type: feat
