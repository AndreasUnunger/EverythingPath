img: systems/pf1/icons/skills/green_27.jpg
name: Wilding Strike
system:
  description:
    value: >-
      <p><em>Filled with the might of nature, you need no weapons of steel or
      wood. Your fists and feet are as potent as any creation of the
      forge.</em></p><p><strong>Prerequisites</strong>: Str 13, Improved Unarmed
      Strike, Wilding.</p><p><strong>Benefits</strong>: The damage die of your
      unarmed strikes increases to 1d6 (or 1d4 if you are Small). This does not
      stack with any other effects that increase the damage die of your unarmed
      strikes, including levels in classes such as monk. Increases to your
      actual size category (such as enlarge person) still increase your damage
      die as normal.</p>
  tags:
    - Combat
type: feat
