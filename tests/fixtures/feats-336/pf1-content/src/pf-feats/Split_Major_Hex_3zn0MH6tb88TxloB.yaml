name: Split Major Hex
system:
  description:
    value: >-
      <p><em>You can split the effect of one of your targeted hexes, affecting
      another creature you can see.</em></p><p><strong>Prerequisites</strong>:
      Split hex, caster level 18th.</p><p><strong>Benefits</strong>: When you
      use one of your major hexes (not a grand hex) that targets a creature, you
      can choose another creature within 30 feet of the first target to also be
      targeted by the major hex.</p>
  tags:
    - General
type: feat
