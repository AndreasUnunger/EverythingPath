name: Bloodletting
system:
  description:
    value: >-
      <p><em>When you attack with a piercing or slashing weapon, the wounds you
      cause bleed profusely.</em></p><p><strong>Prerequisites</strong>:
      Worshiper of Zon-Kuthon.</p><p><strong>Benefits</strong>: Whenever you
      threaten a critical hit with a piercing or slashing weapon (regardless of
      whether you confirm the critical hit or not), you deal 1 point of bleed
      damage to the targeted creature.</p><h3>Combat Trick</h3><p>When you
      confirm a critical hit with a piercing or slashing weapon, you can spend
      up to 2 stamina points to increase the bleed damage dealt by Bloodletting
      by 1 per stamina point spent.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
