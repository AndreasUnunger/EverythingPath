name: Follow-Up Strike
system:
  description:
    value: >-
      <p><em>You bat away an opponent's weapon, creating an opening for a punch
      or kick.</em></p><p><strong>Prerequisites</strong>: Int 13, Combat
      Expertise, Improved Disarm, Improved Unarmed Strike, base attack bonus +6
      or monk level 6th.</p><p><strong>Benefits</strong>: Whenever you succeed
      at a combat maneuver check to disarm an opponent, you can spend a swift
      action to make an unarmed strike attack at your highest base attack bonus
      against the target you disarmed.</p>
  tags:
    - Combat
type: feat
