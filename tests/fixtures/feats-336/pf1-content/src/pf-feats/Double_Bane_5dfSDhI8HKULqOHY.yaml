name: Double Bane
system:
  description:
    value: >-
      <p><em>You extend your bane effect to two
      weapons.</em></p><p><strong>Prerequisites</strong>: Bane class feature,
      Two-Weapon Fighting.</p><p><strong>Benefits</strong>: You can apply your
      bane to a second weapon you are wielding. While your bane class feature is
      active, at the start of each of your turns as a free action, you choose
      whether to apply the ability to one weapon or the other, or both. For each
      round you apply your bane class feature to two weapons, you expend 2
      rounds of that feature.</p>
  tags:
    - General
type: feat
