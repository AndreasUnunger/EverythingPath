name: Inspiring Bravery
system:
  description:
    value: >-
      <p><em>Your bravery inspires bravery in
      others.</em></p><p><strong>Prerequisites</strong>: Cha 13, bravery class
      feature.</p><p><strong>Benefits</strong>: As long as you are conscious and
      not stunned, dazed, or confused, allies within 30 feet who can see and
      hear you gain your bravery bonus on saving throws against fear. If you
      have Improved Bravery, they gain your bravery bonus on saving throws
      against all mind-affecting effects. If you have Social Bravery, your
      bravery bonus is added to the DC of checks to demoralize them, feint
      against them, change their attitude, or convince them to perform a
      request.</p>
  tags:
    - Combat
type: feat
