name: Nanite Disruption
system:
  description:
    value: >-
      <p><em>You can use your nanite surge to inflict wounds upon other
      mechanical beings.</em></p><p><strong>Prerequisites</strong>: Nanite surge
      racial trait.</p><p><strong>Benefits</strong>: As long as you are adjacent
      to an android, a robot, or a creature primarily made of electronic
      components (GM's discretion), you can use your nanite surge ability as an
      immediate action to short-circuit that creature's hardware. If you succeed
      at a melee touch attack and the target fails a Will save (DC = 10 + 1/2
      your character level + 1/2 your Constitution modifier), it takes a penalty
      equal to 1 + 1/2 your level (minimum 0) on its next d20 roll. This penalty
      lasts until the beginning of your next turn.</p>
  tags:
    - General
type: feat
