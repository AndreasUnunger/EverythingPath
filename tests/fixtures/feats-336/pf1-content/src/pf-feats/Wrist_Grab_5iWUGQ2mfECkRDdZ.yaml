name: Wrist Grab
system:
  description:
    value: >-
      <p><em>When an enemy overextends to attack you, you quickly catch its arm
      and knock its weapon loose.</em></p><p><strong>Prerequisites</strong>: Dex
      13, Int 13, Combat Expertise, Combat Reflexes, Improved Disarm, Improved
      Unarmed Strike, base attack bonus +6.</p><p><strong>Benefits</strong>:
      When an opponent's attack misses you by 5 or more, you can attempt a
      disarm combat maneuver check against that foe as an immediate action.</p>
  tags:
    - Combat
type: feat
