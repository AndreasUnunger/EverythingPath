name: Firebrand
system:
  description:
    value: >-
      <p><em>You can make use of a torch as a deadly, macelike
      weapon.</em></p><p><strong>Prerequisites</strong>: Worshiper of
      Asmodeus</p><p><strong>Benefits</strong>: You treat a torch as a light
      weapon that deals bludgeoning damage equal to that of a light mace of its
      size, plus 1 point of fire damage, and you do not incur penalties as you
      would for using it as an improvised weapon.</p><p><strong>Normal</strong>:
      A torch used in combat is treated as a one-handed improvised weapon that
      deals bludgeoning damage equal to that of a gauntlet of its size, plus 1
      point of fire damage.</p>
  tags:
    - Combat
type: feat
