name: Armored Rider
system:
  description:
    value: >-
      <p><em>You are accustomed to riding while wearing armor, and your armor
      doesn't hinder your riding
      skills.</em></p><p><strong>Prerequisites</strong>: Mounted Combat, Ride 3
      ranks.</p><p><strong>Benefits</strong>: You don't take the usual armor
      check penalty on Ride checks. If you are knocked unconscious while in a
      saddle, you always remain in the saddle.</p><p><strong>Normal</strong>: If
      you are knocked unconscious while riding, you have a 50% chance to stay in
      the saddle (75% if you're in a military saddle).</p>
  tags:
    - General
type: feat
