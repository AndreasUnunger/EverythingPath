name: Sword's Shadow
system:
  description:
    value: >-
      <p><em>You attack with a second strike before your opponent can recover
      from the first.</em></p><p><strong>Prerequisites</strong>: Deft Hands,
      base attack bonus +7, wyrwood.</p><p><strong>Benefits</strong>: When you
      successfully damage an enemy with the first attack of a full attack, you
      can attempt a Sleight of Hand check against that enemy's CMD as an
      immediate action. If you succeed, you can treat that enemy as flat-footed
      for the next attack you make as part of the full attack action.</p>
  tags:
    - Combat
    - Racial
    - Wyrwood
type: feat
