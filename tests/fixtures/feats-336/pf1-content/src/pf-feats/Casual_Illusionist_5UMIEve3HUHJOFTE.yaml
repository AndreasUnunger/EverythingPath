name: Casual Illusionist
system:
  description:
    value: >-
      <p><em>You can use your innate magic to create minor illusions that
      augment your efforts at trickery and
      deceit.</em></p><p><strong>Prerequisites</strong>: Gnome, gnome magic
      racial trait.</p><p><strong>Benefits</strong>: As long as you have at
      least one spell-like ability unused from your gnome magic racial trait,
      you gain a +2 racial bonus on all Bluff, Disguise, and Sleight of Hand
      checks you make. At 10th level, these bonuses increase to
      +4.</p><p><strong>Special</strong>: This feat counts as the Deceitful feat
      for the purposes of all prerequisites.</p>
  tags:
    - Racial
    - Gnome
type: feat
