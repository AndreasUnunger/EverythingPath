name: Empowered Daemonic Pact
system:
  description:
    value: >-
      <p><em>Your violent death brings woe to the enemies of your daemon
      masters.</em></p><p><strong>Prerequisites</strong>:
      Urdefhan.</p><p><strong>Benefits</strong>: When you succeed at using your
      daemonic pact ability and allow your soul to be consumed, the resulting
      blast's radius increases to 10 feet, and you gain a +2 profane bonus to
      the DC of the Reflex save victims must attempt to halve this
      damage.</p><p><strong>Normal</strong>: A successful use of the daemonic
      pact ability deals negative energy damage to creatures in a 5-foot
      radius.</p>
  tags:
    - Monster
    - Urdefhan
type: feat
