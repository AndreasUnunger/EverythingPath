name: Critical Versatility
system:
  description:
    value: >-
      <p><em>An open mind and combat training grant versatility to your critical
      hits.</em></p><p><strong>Prerequisites</strong>: Fighter level 11th,
      human.</p><p><strong>Benefits</strong>: Once per day, you can spend 1 hour
      practicing maneuvers to gain one single critical feat that you meet the
      prerequisites for. You gain the benefits of the chosen critical feat until
      you choose to practice a different critical feat.</p><p><strong>Combat
      Trick</strong>: You can spend 5 stamina points to use this feat a second
      time per day.</p>
  tags:
    - Combat
    - Racial
    - Human
type: feat
