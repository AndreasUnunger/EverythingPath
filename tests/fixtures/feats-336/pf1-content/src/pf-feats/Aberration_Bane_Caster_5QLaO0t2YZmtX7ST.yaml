name: Aberration-Bane Caster
system:
  contextNotes:
    - target: spellEffect
      text: >-
        <strong>Aberration-Bane Caster</strong>: Add half of your favored enemy
        bonus against aberrations to the saving throw DC of spells that you cast
        against aberrations
    - target: cl
      text: >-
        <strong>Aberration-Bane Caster</strong>: Add half of your favored enemy
        bonus to overcome the spell resistance of aberrations
  description:
    value: >-
      <p><em>You can apply your specialized knowledge of hunting aberrations to
      make your spells harder for these monsters to
      resist.</em></p><p><strong>Prerequisites</strong>: Caster level 4th,
      gillman, favored enemy (aberrations) class
      feature.</p><p><strong>Benefits</strong>: Add half of your favored enemy
      bonus against aberrations to the saving throw DC of spells that you cast
      against aberrations and on caster level checks to overcome the spell
      resistance of aberrations.</p>
