name: Ferocious Action
system:
  description:
    value: >-
      <p><em>You ferocity is quick but shorter
      lived.</em></p><p><strong>Prerequisites</strong>: Ferocity racial trait,
      orc.</p><p><strong>Benefits</strong>: When you fall to 0 hit points or
      fewer, you lose 2 hit points each round, but you are not staggered. If you
      are in a rage (such as that caused by the barbarian rage class feature),
      you instead only lose 1 hit point per round.</p>
  tags:
    - Racial
    - Orc
type: feat
