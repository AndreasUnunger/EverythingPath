name: Panther Parry
system:
  description:
    value: >-
      <p><em>Your vicious strikes impair your foe's ability to attack you when
      you move.</em></p><p><strong>Prerequisites</strong>: Wis 15, Combat
      Reflexes, Improved Unarmed Strike, Panther Claw, Panther
      Style.</p><p><strong>Benefits</strong>: While using Panther Style, your
      retaliatory unarmed strikes are resolved before the triggering attacks. If
      your retaliatory unarmed strike deals damage to an opponent, that opponent
      takes a -2 penalty on attack and damage rolls with the triggering attack
      of opportunity.</p><h3>Combat Trick</h3><p>When your retaliatory strike
      damages an opponent, you can spend 5 stamina points to increase the
      penalty the target takes on attack and damage rolls to -4.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
