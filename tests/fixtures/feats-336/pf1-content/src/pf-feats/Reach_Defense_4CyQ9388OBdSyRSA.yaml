name: Reach Defense
system:
  description:
    value: >-
      <p><em>You are proficient at avoiding polearms and long-limbed
      creatures.</em></p><p><strong>Prerequisites</strong>: Dex
      15</p><p><strong>Benefits</strong>: You gain a +2 dodge bonus to Armor
      Class against attacks of opportunity from opponents that are not adjacent
      to you.</p><p><strong>Special</strong>: This feat counts as Dodge for the
      purposes of qualifying for the Mobility and Spring Attack
      feats.</p><h3>Combat Trick</h3><p>: You can spend 5 stamina points to
      grant the benefit of this feat to any adjacent allies for 1 round.
      (Dragonslayer's Handbook 25)</p>
  tags:
    - Combat
    - Combat Trick
type: feat
