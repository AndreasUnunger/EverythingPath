name: Channel Endurance
system:
  description:
    value: >-
      <p><em>Calling upon the winds and the waves, you prepare your allies for
      the dangers of the natural
      world.</em></p><p><strong>Prerequisites</strong>: Channel positive energy
      3d6, worshiper of Gozreh.</p><p><strong>Benefits</strong>: Once per day
      when you channel positive energy to heal living creatures, you can choose
      to grant each healed creature the benefit of endure elements (caster level
      equal to your effective cleric level). This effect lasts 24 hours.</p>
  tags:
    - Channeling
type: feat
