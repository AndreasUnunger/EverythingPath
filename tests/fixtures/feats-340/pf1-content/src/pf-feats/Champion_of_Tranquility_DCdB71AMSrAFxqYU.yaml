name: Champion of Tranquility
system:
  description:
    value: >-
      <p><em>The harmony of law is your highest
      ideal.</em></p><p><strong>Prerequisites</strong>:10 Hit Dice, lawful
      neutral alignment.</p><p><strong>Benefits</strong>: You can store a number
      of affirmations up to your Charisma bonus (minimum 1) to use at any time,
      not just within the next 24 hours. You can use an affirmation to cast calm
      emotions as a spell-like ability as a standard action, with a caster level
      equal to your Hit Dice. Lastly, you gain a +2 bonus on weapon and spell
      damage rolls against chaotic creatures. This is an alignment-based
      effect.</p><p><strong>Residual</strong>: If you have this feat but you are
      no longer lawful neutral, you continue to gain the +2 bonus on weapon and
      spell damage rolls against chaotic creatures.</p>
  tags:
    - Alignment
type: feat
