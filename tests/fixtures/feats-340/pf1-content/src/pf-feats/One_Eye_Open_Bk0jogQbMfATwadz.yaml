img: systems/pf1/icons/feats/alertness.jpg
name: One Eye Open
system:
  description:
    value: >-
      <p><em>Your senses seek out threats even while you
      sleep.</em></p><p><strong>Prerequisites</strong>: Wis 13,
      Alertness.</p><p><strong>Benefits</strong>: The DCs of your Perception
      checks don't increase when you are asleep. If you succeed at a Perception
      check to notice something dangerous while asleep, you can wake up to
      confront the danger.</p><p><strong>Normal</strong>: The DC for a
      Perception check attempted by a sleeping creature increases by 10.</p>
  tags:
    - General
type: feat
