    value: >-
      <p><em>You move your enemies within a beam of righteous
      energy.</em></p><p><strong>Prerequisites</strong>: Channel Force, aasimar,
      channel energy 4d6.</p><p><strong>Benefits</strong>: When using Channel
      Force, you can affect all creatures in a 60-foot line or a 30-foot
      cone-shaped burst. You must choose to either push or pull all creatures
      within the affected area that fail their saves.</p>
