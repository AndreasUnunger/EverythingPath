name: Snapping Turtle Style
system:
  description:
    value: >-
      <p><em>Your deft unarmed style allows you to shield your body from
      harm.</em></p><p><strong>Prerequisites</strong>: Improved Unarmed Strike,
      base attack bonus +1 or monk level 1st.</p><p><strong>Benefits</strong>:
      While using the Snapping Turtle Style feat with at least one hand free,
      you gain a +1 shield bonus to AC.</p><h3>Combat Trick</h3><p>: When using
      this style, as long as you have at least 1 stamina point in your stamina
      pool, your shield bonus to AC increases by 1.</p>
  tags:
    - Combat
    - Style
    - Combat Trick
type: feat
