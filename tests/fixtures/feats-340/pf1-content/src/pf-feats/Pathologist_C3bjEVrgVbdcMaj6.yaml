name: Pathologist
system:
  description:
    value: >-
      <p><em>You can offer greater care for diseases and poisons than other
      healers can.</em></p><p><strong>Prerequisites</strong>: Incredible
      Healer.</p><p><strong>Benefits</strong>: When you use the Heal skill to
      treat disease or poison, instead of granting a +4 competence bonus on the
      target's saving throws to resist the affliction, you may instead choose to
      allow the target to use the result of your Heal check in place of his next
      saving throw to resist the disease or poison.</p>
  tags:
    - General
type: feat
