name: Ascetic Form
system:
  description:
    value: >-
      <p><em>You have mastered the ability to blend the use of arms with martial
      arts.</em></p><p><strong>Prerequisites</strong>: Ascetic Style; Weapon
      Focus with the chosen melee weapon; base attack bonus +5 or monk level
      5th.</p><p><strong>Benefits</strong>: You can use the chosen melee weapon
      with any class ability that can be used with an unarmed strike, such as an
      unchained monk's style strike ability. In addition, you are treated as a
      monk with a level equal to your character level for the purpose of
      determining the number of times per day that you can use feats with uses
      per day that depend upon your monk level, such as the Stunning Fist or
      Perfect Strike feats.</p>
  tags:
    - Combat
type: feat
