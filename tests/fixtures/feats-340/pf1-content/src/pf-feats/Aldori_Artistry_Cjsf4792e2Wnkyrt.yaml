name: Aldori Artistry
system:
  description:
    value: >-
      <p><em>You can do more with your blade than slash and
      stab.</em></p><p><strong>Prerequisites</strong>: Exotic Weapon Proficiency
      (Aldori dueling sword), Weapon Finesse, base attack bonus
      +2.</p><p><strong>Benefits</strong>: Choose one of the following combat
      maneuvers: disarm, reposition, steal, sunder, or trip. You gain a +2 bonus
      when performing the selected maneuver while wielding an Aldori dueling
      sword. This bonus does not stack with the bonus provided by a combat
      maneuver feat with 'improved' in its name (such as Improved
      Trip).</p><p><strong>Special</strong>: You can select this feat multiple
      times, choosing a different combat maneuver each time.</p>
  tags:
    - Combat
type: feat
