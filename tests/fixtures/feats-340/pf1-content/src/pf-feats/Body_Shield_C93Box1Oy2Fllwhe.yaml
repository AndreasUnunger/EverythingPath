name: Body Shield
system:
  description:
    value: >-
      <p><em>With a sly maneuver, you force a grappled opponent into the path of
      an incoming attack.</em></p><p><strong>Prerequisites</strong>: Dex 13,
      Improved Grapple, Improved Unarmed Strike, base attack bonus
      +6.</p><p><strong>Benefit</strong>: As an immediate action while you are
      grappling an adjacent creature, you can make a grapple combat maneuver
      check against that creature to gain cover against a single attack. If you
      are successful and the attack misses you, that attack targets the creature
      you used as cover, using the same attack roll. You cannot use this feat
      against a creature grappling you, and the cover you gain ends after the
      attack you gained cover against is resolved.</p><p><strong>Combat Trick<br
      /></strong>You can spend 5 stamina points to use this feat against a
      creature grappling you.</p>
  tags:
    - Combat
type: feat
