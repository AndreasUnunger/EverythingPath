name: Tribal Hunter
system:
  description:
    value: >-
      <p><em>From watching pack animals hunt, you learned to take down large
      prey as part of a group.</em></p><p><strong>Prerequisites</strong>: Animal
      Affinity.</p><p><strong>Benefits</strong>: When either you or an ally with
      this feat is adjacent to and flanking an opponent that is larger than
      either of you, you both are considered to be flanking the opponent as long
      as you remain adjacent to it.</p><p><strong>Normal</strong>: You must be
      positioned opposite an ally to flank an opponent.</p>
  tags:
    - Combat
    - Teamwork
type: feat
