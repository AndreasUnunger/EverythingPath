name: Arming Grab
system:
  description:
    value: >-
      <p><em>Opponents would be foolish to underestimate you, even if you appear
      unarmed and helpless. You are practiced at turning the tables on armed
      foes and using their own weapons against
      them.</em></p><p><strong>Prerequisites</strong>: Int 13, Catch Off-Guard,
      Combat Expertise, Improved Disarm.</p><p><strong>Benefits</strong>: You
      take no penalty on your attack roll when attempting to disarm an opponent
      while you are unarmed. If you succeed at a disarm attempt without using a
      weapon and choose to pick up the disarmed weapon, you can attack with that
      weapon as though you were proficient with it until the end of your next
      turn. If you are already proficient with that type of weapon, you gain a
      +2 morale bonus to your attack rolls with that weapon until the end of
      your next turn.</p><p><strong>Normal</strong>: Attempting to disarm a foe
      while unarmed imposes a -4 penalty on the attack.</p>
  tags:
    - Combat
type: feat
