name: Augment Calling
system:
  description:
    value: >-
      <p><em>Your attempts to bind or call outsiders are highly
      potent.</em></p><p><strong>Prerequisites</strong>: Spell Focus
      (conjuration); ability to cast lesser planar ally, lesser planar binding,
      or a higher-level version of these
      spells.</p><p><strong>Benefits</strong>: Choose a subtype of outsider,
      such as angel or elemental. When using the planar ally or planar binding
      spells, you can call 2 additional Hit Dice of outsiders with the chosen
      subtype. You also gain an additional benefit depending on what spell you
      are casting.<br />When you call an outsider of the chosen subtype with
      planar ally spells, you reduce the price it demands for service by 25%, to
      a minimum of 1,000 gp.</p><p>When you bind an outsider of the chosen
      subtype with planar binding spells and request a service of the outsider,
      you gain a +2 bonus on Charisma checks to do
      so.</p><p><strong>Special</strong>: You can gain this feat multiple times.
      Its effects do not stack. Each time you take the feat, it applies to a
      different subtype of outsider.</p>
  tags:
    - General
type: feat
