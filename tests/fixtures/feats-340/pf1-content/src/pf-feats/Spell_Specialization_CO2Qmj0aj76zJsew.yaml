name: Spell Specialization
system:
  description:
    value: >-
      <p><em>Select one spell. You cast that spell with greater than normal
      power.</em></p><p><strong>Prerequisites</strong>: Int 13, Spell
      Focus.</p><p><strong>Benefits</strong>: Select one spell of a school for
      which you have taken the Spell Focus feat. Treat your caster level as
      being two higher for all level-variable effects of the spell.</p><p>Every
      time you gain an even level in the spellcasting class you chose your spell
      from, you can choose a new spell to replace the spell selected with this
      feat, and that spell becomes your specialized
      spell.</p><p><strong>Special</strong>: You can gain this feat multiple
      times. Its effects do not stack. Each time you take the feat, it applies
      to a different spell.</p>
  tags:
    - General
type: feat
