name: Brisk Spell
system:
  description:
    value: >-
      <p><em>Your movement spells make allies swifter than
      normal.</em></p><p><strong>Prerequisites</strong>: Dex
      13+.</p><p><strong>Benefits</strong>: You can alter spells that grant a
      creature a movement type it doesn't normally have to increase the speed
      for that movement type by 10 feet. A brisk spell uses a spell slot equal
      to the spell's normal spell level.</p>
  tags:
    - Metamagic
type: feat
