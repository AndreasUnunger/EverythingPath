name: Greater Balor Whip
system:
  description:
    value: >-
      <p><em>You can pull in foes with your whip and then attack them with your
      sword.</p><p>Note: This description is identical to the one from Improved
      Balor Whip and likely a mistake; the Archives will be updated if and when
      a correction is released.</em></p><p><strong>Prerequisites</strong>: Balor
      Whip, Improved Balor Whip, Weapon Focus (whip), Whip Mastery, base attack
      bonus +16.</p><p><strong>Benefits</strong>: When you use Improved Balor
      Whip to make a single attack at your highest attack bonus, your critical
      threat range increases to 19-20 and you gain a +4 bonus on critical
      confirmation rolls if you threaten a critical hit with that attack.</p>
  tags:
    - Combat
type: feat
