name: Disciplinary Devotee
system:
  description:
    value: >-
      <p><em>Your careful study of mental magic grants you mastery in your
      discipline.</em></p><p><strong>Prerequisites</strong>: Psychic discipline
      class feature.</p><p><strong>Benefits</strong>: You gain a +1 bonus on
      caster level checks and concentration checks when casting spells from your
      psychic discipline, and you gain a +1 insight bonus on saving throws
      against spells from your discipline.</p>
