name: Dragonbane Aura
system:
  description:
    value: >-
      <p><em>Those within your dragonbane aura gain the same protection that you
      do.</em></p><p><strong>Prerequisites</strong>: Aura of courage class
      feature, caster level 8th.</p><p><strong>Benefits</strong>: When fighting
      dragons, your aura of courage expands to a 20-foot-radius emanation, and
      allies in the aura gain a morale bonus on saving throws against dragon
      breath equal to your aura of courage's bonus against fear
      effects.</p><p><strong>Normal</strong>: The aura of courage is a
      10-foot-radius emanation, and grants a +4 morale bonus on fear
      effects.</p>
  tags:
    - General
type: feat
