name: Bestow Hope
system:
  description:
    value: >-
      <p><em>You instill hope in the creatures you
      heal.</em></p><p><strong>Prerequisites</strong>: Improved Channel, channel
      energy class feature, worshiper of
      Sarenrae.</p><p><strong>Benefits</strong>: When you heal a creature by
      channeling positive energy, you also relieve its fear. If a creature you
      heal is shaken, that condition ends. If the creature is frightened, it
      becomes shaken instead. If the creature is panicked, it becomes frightened
      instead.</p>
  tags:
    - General
type: feat
