name: Spirit of the Wild
system:
  description:
    value: >-
      <p><em>Your mystic connection with one type of wilderness has grown even
      stronger.</em></p><p><strong>Prerequisites</strong>: Attuned to the Wild,
      Guardian of the Wild, elf.</p><p><strong>Benefits</strong>: When you are
      in a terrain type you have selected the Attuned to the Wild feat for, you
      gain a +4 bonus on Perception checks made to act in the surprise round of
      combat. If you act in the surprise round, you gain blindsense out to a
      range of 30 feet during the surprise round. If you are in an area that
      qualifies as more than one kind of terrain, these bonuses do not stack;
      you receive the bonus for only one terrain type.</p>
  tags:
    - Racial
    - Elf
type: feat
