name: Beast Speaker Mastery
system:
  description:
    value: >-
      <p><em>Your magical beast has developed abilities that only its wild kin
      would normally have.</em></p><p><strong>Prerequisites</strong>: Beast
      Speaker, character level equal to or higher than that listed in your
      companion's mastery entry.</p><p><strong>Benefits</strong>: Your beast
      companion gains the abilities and bonuses listed in the mastery entry in
      its stat block. You must be of at least the indicated level for the
      companion to use these abilities, so if you dismiss a companion and gain a
      new beast companion of a different type, you retain the feat but might not
      yet be of sufficient level for the new companion to gain its mastery
      benefits.</p><p><strong>Normal</strong>: A beast companion is unable to
      use its mastery abilities regardless of its advancement.</p>
  tags:
    - General
type: feat
