name: Stone Cover
system:
  description:
    value: >-
      <p><em>You can use stone around you to help you avoid
      attacks.</em></p><p><strong>Prerequisites</strong>: Wis 15, Stone Shroud,
      Stealth 6 ranks, dwarf, stonecunning racial
      trait.</p><p><strong>Benefits</strong>: While in areas of rocky terrain or
      while underground, you can gain 10% miss chance as a swift action.
      Alternatively, you can take a moment to better position yourself and gain
      concealment as a move action. The miss chance or concealment you gain from
      this feat does not stack with similar effects and remains until the start
      of your next turn.</p>
  tags:
    - Racial
    - Dwarf
type: feat
