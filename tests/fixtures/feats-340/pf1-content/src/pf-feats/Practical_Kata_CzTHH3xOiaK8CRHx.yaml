name: Practical Kata
system:
  description:
    value: >-
      <p><em>Your martial meditation extends onto the
      battlefield.</em></p><p><strong>Prerequisites</strong>: Improved Unarmed
      Strike, ki pool class feature.</p><p><strong>Benefits</strong>: When you
      hit with a melee attack against an opponent you have already damaged this
      round, you can forgo dealing damage to instead regain 1 ki point. This
      feat can restore only 1 ki point every minute, to a maximum per day of 1
      point for every 4 class levels you have.</p>
  tags:
    - Combat
    - Combination
type: feat
