name: Dirty Critical Hit
system:
  description:
    value: >-
      <p><em>Your blows are not only deadly, but debilitating as
      well.</em></p><p><strong>Prerequisites</strong>: Int 13, Combat Expertise,
      Critical Focus, Improved Dirty Trick, base attack bonus
      +11.</p><p><strong>Benefits</strong>: Whenever you confirm a critical hit,
      you can also affect the target as if you had succeeded at a dirty trick
      combat maneuver check. Doing so normally causes the target to suffer for 1
      round one of the conditions applied by a dirty trick, unless you have
      feats or abilities that give you more dirty trick
      options.</p><p><strong>Special</strong>: You can apply the effects of only
      one critical feat to a given critical hit unless you possess Critical
      Mastery.</p>
  tags:
    - Combat
    - Critical
type: feat
