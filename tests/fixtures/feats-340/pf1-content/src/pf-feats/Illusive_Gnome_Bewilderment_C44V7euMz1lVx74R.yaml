name: Illusive Gnome Bewilderment
system:
  description:
    value: >-
      <p><em>You can use your gnome weapons in unusual
      ways.</em></p><p><strong>Prerequisites</strong>: Int 13, Combat Expertise,
      Gnome Weapon Focus, Illusive Gnome Style, Illusive Gnome Surprise,
      Improved Feint, gnome magic and weapon familiarity racial
      traits.</p><p><strong>Benefits</strong>: While using Illusive Gnome Style,
      when you successfully use Bluff to feint against an opponent, you can pick
      one special weapon feature from among those listed by Illusive Gnome
      Surprise and deny the opponent its Dexterity modifier to AC, as normal for
      feinting; alternatively, you can pick two special weapon features instead
      of one.</p>
  tags:
    - Combat
    - Racial
    - Gnome
type: feat
