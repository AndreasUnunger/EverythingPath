name: Stoic Pose
system:
  description:
    value: >-
      <p><em>You can hold yourself as still as a statue, evading
      detection.</em></p><p><strong>Prerequisites</strong>:
      Svirfneblin.</p><p><strong>Benefits</strong>: By spending 5 rounds finding
      a suitable location, you can hold yourself so still that you appear to be
      a Small object such as a pile of rocks. This allows you to make a Stealth
      check without cover or concealment, as long as you do not move or take any
      other actions.</p>
  tags:
    - Racial
    - Svirfneblin
type: feat
