name: Alertness (Mythic)
system:
  description:
    value: >-
      <p><em>Your powers of perception surpass everyone's, whether used to
      observe your surroundings or the intentions of
      others.</em></p><p><strong>Prerequisites</strong>:
      Alertness.</p><p><strong>Benefits</strong>: The bonus on Perception and
      Sense Motive skill checks from Alertness increases by 2. In addition, you
      can expend one use of mythic power to treat a Perception or Sense Motive
      check as if you had rolled a natural 20. You must decide to use this
      ability before making the roll.</p>
