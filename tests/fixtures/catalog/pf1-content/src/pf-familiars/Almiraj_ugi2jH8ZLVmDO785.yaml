        <div class="statblockContainer" style="margin-top:15px"><div style="width:100%;background-color:#ffe9c7;box-shadow:0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19);columns:2 150px"><hr style="margin-left:0;margin-top:-2px;width:100%;height:4px;background-color:#e0a100;border:1px solid #000;column-span:all" /><div style="padding:5px"><h1>Almiraj CR 1</h1><div style="break-inside:avoid"><p><strong>Source</strong>: Bestiary 4 pg. 8<br /><strong>XP 400</strong><br />N Small Magical Beast <br /><strong>Init</strong> 2; <strong>Senses</strong> darkvision 60 ft., low-light vision, scent; Perception +4;</p></div><div style="break-inside:avoid"><h3>Defense</h3><p><strong>AC</strong> 13, <strong>Touch</strong> 13, <strong>Flat-Footed</strong> 11 (+2 Dex, +1 size)<br /><strong>Hit Points</strong> 13 (2 HD; 2d10+2)<br /><strong>Fort</strong> 4, <strong>Ref</strong> 5, <strong>Will</strong> 0; -2 vs. witch hexes</p></div><div><div style="break-inside:avoid"><h3>Offense</h3><p><strong>Speed</strong> 10 ft.<br /><strong>Melee</strong> +1 gore +6 (2d4-1)</p></div></div><div style="break-inside:avoid"><h3>Statistics</h3><p><strong>Str</strong> 6, <strong>Dex</strong> 15, <strong>Con</strong> 12, <strong>Int</strong> 5, <strong>Wis</strong> 11, <strong>Cha</strong> 6<br /><strong>Base Atk</strong> +2; <strong>CMB</strong> +-1; <strong>CMD</strong> 11<br /><strong>Feats</strong> Weapon Finesse<br /><strong>Skills</strong> Acrobatics +6 (+14 when jumping), Perception +4, Stealth +14, Racial Modifiers +8 Acrobatics when jumping, +4 Perception, +4 Stealth<br /><strong>Languages</strong> Sylvan (can't speak)</p></div><div style="break-inside:avoid"><h3>Ecology</h3><p><strong>Environment</strong>: temperate hills, plains, or forests<br /><strong>Organization</strong>: solitary<br /><strong>Treasure</strong>: incidental (magic horn)</p></div><div style="break-inside:avoid"><h3>Special Abilities</h3><div style="white-space:pre-wrap"><p>Hex-Prone (su): An almiraj takes a -2 penalty on all saving throws against harmful witch hexes. The duration of any beneficial hexes longer than 1 round that affect an almiraj is increased by 50%. Magic Horn (su): While on the creature's head, an almiraj's horn is treated as a +1 weapon. Any living creature slain by an almiraj's gore attack immediately turns to stone (as if by the flesh to stone spell, with no saving throw, and the creature is still dead). A severed almiraj horn retains a wisp of its former magic, and counts as a masterwork weapon if used to create a magical dagger or similar small piercing weapon.</p></div></div><div style="break-inside:avoid"><h3>Description</h3><div style="white-space:pre-wrap"><p>The almiraj is a surprisingly dangerous predator. Almirajes' strong affinity with witches, magical gore attacks, and susceptibility to hexes suggest they have Arcana origins, perhaps the result of experiments by witches seeking to deliberately create a new kind of familiar. Reminiscent of a unicorn horn, an almiraj's most prominent feature serves as both a deterrent and deadly weapon. The almiraj uses its horn to hunt, stalking and spearing prey on the brutal appendage. The horn's unique magical properties have the gruesome side effect of forcing the almiraj to consume its prey while it still lives, before it turns to stone- when hunting smaller creatures, the almiraj strikes to slow its prey through blood loss and to disable it by maiming its limbs. Occasionally, an enterprising individual will hunt an almiraj for its horn, but success is limited since almirajes are exceptionally vicious, stealthy, and athletic targets- their acrobatic leaps bring their horns within reach of the vital organs of much larger creatures. Almirajes are fiercely territorial, although they flee if unable to fight on their terms, only to return later to defend their territory. They demonstrate their territorial claims to others of their kind with acrobatic displays and mock horn battles rather than fighting in earnest. Other intruders are met with aggressive posturing and warning calls, though almirajes prefer not to fight. If an interloper refuses to withdraw, however, the almiraj will fight to the death to defend its claim. It's unclear how almirajes reproduce, since females are rare and the creatures are always encountered alone. Records indicate that they live for 40 to 60 years and some communities are able to build respectful, if wary, relationships with them. Almirajes are particularly popular with witches as familiars. Spellcasters of any alignment with the Improved Familiar feat can gain an almiraj as a familiar at 5th level.</p></div></div><hr style="margin-left:0;margin-bottom:-3px;width:100%;height:4px;background-color:#e0a100;border:1px solid #000;column-span:all" /></div></div><hr /><div class="rawInputContainer" style="margin-top:15px"><h2>RAW INPUT</h2><hr /><pre style="white-space:pre-wrap;font-size:10px"><code>Almiraj CR 1
        Source Bestiary 4 pg. 8
        XP 400
        N Small magical beast
        Init +2; Senses darkvision 60 ft., low-light vision, scent; Perception +4
        Defense
        AC 13, touch 13, flat-footed 11 (+2 Dex, +1 size)
        hp 13 (2d10+2)
        Fort +4, Ref +5, Will +0; -2 vs. witch hexes
        Offense
        Speed 30 ft., burrow 10 ft.
        Melee +1 gore +6 (2d4-1)
        Special Attacks magic horn
        Statistics
        Str 6, Dex 15, Con 12, Int 5, Wis 11, Cha 6
        Base Atk +2; CMB -1; CMD 11 (15 vs. trip)
        Feats Weapon Finesse
        Skills Acrobatics +6 (+14 when jumping), Perception +4, Stealth +14; Racial Modifiers +8 Acrobatics when jumping, +4 Perception, +4 Stealth
        Languages Sylvan (can't speak)
        SQ hex-prone
        Ecology
        Environment temperate hills, plains, or forests
        Organization solitary
        Treasure incidental (magic horn)
        Special Abilities
        Hex-Prone (Su) An almiraj takes a -2 penalty on all saving throws against harmful witch hexes. The duration of any beneficial hexes longer than 1 round that affect an almiraj is increased by 50%.

        Magic Horn (Su) While on the creature's head, an almiraj's horn is treated as a +1 weapon. Any living creature slain by an almiraj's gore attack immediately turns to stone (as if by the flesh to stone spell, with no saving throw, and the creature is still dead). A severed almiraj horn retains a wisp of its former magic, and counts as a masterwork weapon if used to create a magical dagger or similar small piercing weapon.
        Description
        The almiraj is a surprisingly dangerous predator. Almirajes' strong affinity with witches, magical gore attacks, and susceptibility to hexes suggest they have arcane origins, perhaps the result of experiments by witches seeking to deliberately create a new kind of familiar.

        Reminiscent of a unicorn horn, an almiraj's most prominent feature serves as both a deterrent and deadly weapon. The almiraj uses its horn to hunt, stalking and spearing prey on the brutal appendage. The horn's unique magical properties have the gruesome side effect of forcing the almiraj to consume its prey while it still lives, before it turns to stone- when hunting smaller creatures, the almiraj strikes to slow its prey through blood loss and to disable it by maiming its limbs. Occasionally, an enterprising individual will hunt an almiraj for its horn, but success is limited since almirajes are exceptionally vicious, stealthy, and athletic targets- their acrobatic leaps bring their horns within reach of the vital organs of much larger creatures.

        Almirajes are fiercely territorial, although they flee if unable to fight on their terms, only to return later to defend their territory. They demonstrate their territorial claims to others of their kind with acrobatic displays and mock horn battles rather than fighting in earnest. Other intruders are met with aggressive posturing and warning calls, though almirajes prefer not to fight. If an interloper refuses to withdraw, however, the almiraj will fight to the death to defend its claim.

        It's unclear how almirajes reproduce, since females are rare and the creatures are always encountered alone. Records indicate that they live for 40 to 60 years and some communities are able to build respectful, if wary, relationships with them.

        Almirajes are particularly popular with witches as familiars. Spellcasters of any alignment with the Improved Familiar feat can gain an almiraj as a familiar at 5th level.</code></pre></div></div>
