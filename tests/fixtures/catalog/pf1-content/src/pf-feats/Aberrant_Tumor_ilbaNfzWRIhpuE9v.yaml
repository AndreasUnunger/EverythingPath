name: Aberrant Tumor
system:
  description:
    value: >-
      <p><em>To the surprise of others, that strange growth on you is actually
      your spellcasting companion.</em></p><p><strong>Prerequisites</strong>:
      Aberrant bloodline.</p><p><strong>Benefits</strong>: You gain a tumor
      familiar, as the
      @Compendium[pf1e-archetypes.pf-class-abilities.PetD6zWBj0yF7uX1]{Tumor
      Familiar (Ex)} alchemist discovery (Pathfinder RPG Ultimate Magic 17),
      with an effective alchemist level equal to the level of the class that
      grants your aberrant bloodline for determining the tumor familiar's
      abilities.</p><p>If multiple classes grant you the aberrant bloodline,
      those class levels stack for determining your effective alchemist
      level.</p>
  tags:
    - General
type: feat
