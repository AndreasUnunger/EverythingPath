name: Knockout Artist
system:
  description:
    value: >-
      <p><em>You can throw devastating knockout
      punches.</em></p><p><strong>Prerequisites</strong>: Sneak attack class
      feature, Improved Unarmed Strike.</p><p><strong>Benefits</strong>: When
      you use your unarmed strike to deal nonlethal damage and sneak attack
      damage to an opponent denied his Dexterity bonus to AC, you gain a +1
      bonus on the damage roll per each sneak attack damage die you roll.</p>
