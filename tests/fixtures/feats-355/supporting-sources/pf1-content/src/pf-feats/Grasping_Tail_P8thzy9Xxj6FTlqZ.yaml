name: Grasping Tail
system:
  description:
    value: >-
      <p><em>Your tail becomes more useful, and can be used to grab or hold
      small items.</em></p><p><strong>Prerequisites</strong>: You must have a
      tail.</p><p><strong>Benefits</strong>: You can use your tail to grab
      stowed items. While you cannot wield weapons with your tail, you can use
      it to retrieve small, stowed objects carried on your person as a swift
      action.</p><p><strong>Special</strong>: If you have the prehensile tail
      tiefling racial trait, you can use your tail to grab unattended items
      within 5 feet or stowed objects carried on your person as a swift action;
      you can hold such objects with your tail, though you cannot manipulate
      them with it (other than to put them in your hand).</p>
  tags:
    - General
type: feat
