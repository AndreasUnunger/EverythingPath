name: Underhanded Teamwork
system:
  description:
    value: >-
      <p><em>You and your allies know how to use coordinated maneuvers to set up
      an enemy with an unfair
      disadvantage.</em></p><p><strong>Prerequisites</strong>: Combat Expertise,
      Improved Dirty Trick.</p><p><strong>Benefits</strong>: Whenever an ally
      who also has this feat performs a dirty trick combat maneuver against a
      foe you both threaten, you can use an immediate action to increase the
      inflicted condition's duration by 1 round.</p>
  tags:
    - Combat
    - Teamwork
type: feat
