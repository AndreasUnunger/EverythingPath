name: Aldori Dueling Disciple
system:
  description:
    value: >-
      <p><em>Your prowess in Aldori swordplay grants you
      bravado.</em></p><p><strong>Benefits</strong>: You gain a +2 morale bonus
      on Intimidate checks to demoralize opponents, and the DC of any attempt to
      demoralize you increases by 2. When you're participating in a duel, these
      bonuses increase to +4.</p><h3>Combat Trick</h3><p>During any combat that
      is not a duel, you can spend 1 stamina point at the start of your turn to
      treat the combat as a duel until the start of your next turn for the
      purpose of gaining the benefits of the Aldori Dueling Discipline feat.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
