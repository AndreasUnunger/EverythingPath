    value: >-
      <p><strong>Race</strong>: Android</p><hr /><p>For the purposes of effects
      targeting creatures by type (such as a ranger's favored enemy and bane
      weapons), androids count both as humanoids and as constructs. Androids
      gain a +4 racial bonus on all saving throws against mind-affecting
      effects, paralysis, poison, and stun effects. They are not subject to
      fatigue or exhaustion, and are immune to disease and sleep effects.</p>
