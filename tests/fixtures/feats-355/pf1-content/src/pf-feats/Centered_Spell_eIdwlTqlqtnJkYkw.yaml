name: Centered Spell
system:
  description:
    value: >-
      <p><em>You can make a spell explode around you, leaving a safe zone for
      yourself at the center of the
      blast.</em></p><p><strong>Prerequisites</strong>: Spellcraft 3
      ranks.</p><p><strong>Benefits</strong>: You can center the area of a spell
      with an area effect and duration of instantaneous on you, and exclude
      yourself from the effects of the spell. Your familiar (if any) is also
      excluded from the effect, provided that it is in your square and at least
      one size category smaller than you.</p><p>A centered spell does not use up
      a higher-level spell slot than the spell's actual level.</p>
  tags:
    - Metamagic
type: feat
