name: Animal Call
system:
  description:
    value: >-
      <p><em>You've learn how to replicate a number of animal calls native to
      wilderness environments.</em></p><p><strong>Prerequisites</strong>: Bluff
      1 rank, Knowledge (nature) 1 rank.</p><p><strong>Benefits</strong>: Pick
      one of the ranger's favored terrains. You can use your Bluff skill to
      mimic the calls of animals native to that terrain. Creatures with ranks in
      Knowledge (nature) can use that skill in place of Sense Motive to detect
      your mimicry and realize that the sound is
      false.</p><p><strong>Special</strong>: You can take this feat multiple
      times. Each time you do, select an additional favored terrain to which
      this feat applies.</p>
  tags:
    - General
type: feat
