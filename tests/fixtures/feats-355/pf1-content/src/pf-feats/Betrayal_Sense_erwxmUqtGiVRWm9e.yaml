name: Betrayal Sense
system:
  description:
    value: >-
      <p><em>You can sense betrayal and intrigue as well as physical
      traps.</em></p><p><strong>Prerequisites</strong>: Wis 13, rogue level 3rd,
      trap sense class feature.</p><p><strong>Benefits</strong>: You gain a
      bonus on Perception checks to pierce another creature's disguise and Sense
      Motive checks to avoid being surprised by an attack. These bonuses are
      equal to the bonus you gain from trap sense.</p>
  tags:
    - Combat
type: feat
