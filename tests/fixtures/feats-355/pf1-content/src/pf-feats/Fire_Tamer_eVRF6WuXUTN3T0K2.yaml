name: Fire Tamer
system:
  description:
    value: >-
      <p><em>You know your way around even magical
      fire.</em></p><p><strong>Prerequisites</strong>:
      Goblin.</p><p><strong>Benefits</strong>: You gain a +2 bonus on saves
      against spells with the fire descriptor. Additionally, your scars mark you
      as a talented fire tamer, granting you a +2 circumstance bonus on
      Diplomacy and Intimidate checks when dealing with other goblins.</p>
