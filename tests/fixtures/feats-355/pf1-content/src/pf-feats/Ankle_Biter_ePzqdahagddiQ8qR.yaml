name: Ankle Biter
system:
  description:
    value: >-
      <p><em>You know how take a mouthful out of anyone who tries to overpower
      you.</em></p><p><strong>Prerequisites</strong>: Goblin, Escape Artist 1
      rank.</p><p><strong>Benefits</strong>: If you are the target of a combat
      maneuver you can, as an immediate action, attempt to bite your opponent in
      addition to any attacks of opportunity or other consequences your opponent
      might incur from attacking you. This bonus natural attack does not provoke
      an attack of opportunity itself and deals base damage appropriate for a
      creature of your current size (usually 1d4 for Small creatures). If
      grappled or pinned, you can continue to make this additional bite attack
      each round as swift action on your turn. You gain a bonus on any attempt
      to break the grapple equal to the damage you dealt with your bite that
      round.</p><p><strong>Special</strong>: You cannot make this bite attack
      when you are the aggressor, including if you manage to reverse a grapple
      or make any other attack of opportunity.</p><p><strong>Pathfinder
      Society<br /></strong>Only legal goblin PCs are allowed to choose anything
      from this book</p>
  tags:
    - Combat
    - Racial
    - Goblin
type: feat
