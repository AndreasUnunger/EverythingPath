name: Chainbreaker
system:
  description:
    value: >-
      <p><em>Nothing rouses your fury and makes you more deadly in battle than
      the sight of slaves cowering before their
      masters.</em></p><p><strong>Prerequisites</strong>: Over the course of at
      least five different occasions, free a cumulative total of 50+ sentient
      beings held in unjust captivity.</p><p><strong>Benefits</strong>: When in
      combat with an opponent that you know owns or trades in slaves, once per
      round you may add a bonus to damage rolls for a melee attack, ranged
      attack, or targeted spell against that opponent. This bonus damage is +1
      for every four Hit Dice you have.</p>
  tags:
    - Achievement
type: feat
