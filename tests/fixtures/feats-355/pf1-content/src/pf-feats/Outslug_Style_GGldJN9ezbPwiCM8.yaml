name: Outslug Style
system:
  description:
    value: >-
      <p><em>You dart in and out of
      combat.</em></p><p><strong>Prerequisites</strong>: Int 13; Combat
      Expertise or brawler's cunning class feature; Weapon Focus with the chosen
      weapon.</p><p><strong>Benefits</strong>: Choose one weapon from the close
      fighter weapon group. While using this style, when you take a 5-foot step,
      you gain a +1 dodge bonus to AC and a +1 bonus on weapon damage rolls with
      the chosen weapon until the beginning of your next
      turn.</p><p><strong>Special</strong>: In addition to the chosen weapon, a
      character with the weapon training (close) or the brawler's close weapon
      mastery class feature can use Outslug Style with any close weapon.</p>
  tags:
    - Combat
    - Style
type: feat
