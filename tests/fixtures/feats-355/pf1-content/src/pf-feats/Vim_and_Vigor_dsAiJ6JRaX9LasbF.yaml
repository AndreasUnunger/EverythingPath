name: Vim and Vigor
system:
  description:
    value: >-
      <p><em>You rebound more quickly than normal when you draw upon your inner
      reserve to repair your wounds.</em></p><p><strong>Prerequisites</strong>:
      Con 13, Combat Vigor, Endurance, character level
      3rd.</p><p><strong>Benefits</strong>: Your vigor pool gains 1 vigor point.
      The fatigued condition that you gain from spending vigor points (as
      described by the Combat Vigor feat on page 14) lasts for 3 rounds instead
      of 1 minute. In addition, when you take this feat, you gain a +2 bonus on
      saving throws against effects that cause fatigue or exhaustion.</p>
  tags:
    - Combat
type: feat
