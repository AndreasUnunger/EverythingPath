name: Punch Through
system:
  description:
    value: >-
      <p><em>You and your allies are adept at bypassing enemy
      defenses.</em></p><p><strong>Prerequisites</strong>: Base attack bonus
      +6.</p><p><strong>Benefits</strong>: As a full-round action, you may make
      a single attack against a target. If the attack hits and deals damage to
      the target, all of your allies with this feat ignore up to 5 points of
      damage reduction against the same target for 1 round. This feat does not
      apply to damage reduction without a type (such as DR 10/--).</p>
  tags:
    - Combat
    - Teamwork
type: feat
