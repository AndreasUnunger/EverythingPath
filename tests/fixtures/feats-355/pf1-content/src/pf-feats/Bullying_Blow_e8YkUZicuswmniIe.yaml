name: Bullying Blow
system:
  description:
    value: >-
      <p><em>With a simple hit, you more easily intimidate an
      opponent.</em></p><p><strong>Prerequisites</strong>: Intimidate 1 rank,
      orc.</p><p><strong>Benefits</strong>: As a standard action, you may make a
      melee attack with a -2 penalty on the attack roll. If the attack damages
      your opponent, you may make an Intimidate check to demoralize that
      opponent as a free action.</p>
  tags:
