name: Detect Expertise (Mythic)
system:
  description:
    value: >-
      <p><em>You can sense a creature's magical abilities with just a mere
      glance.</em></p><p><strong>Prerequisites</strong>: Detect
      Expertise.</p><p><strong>Benefits</strong>: You gain the benefit of Detect
      Expertise immediately (without needing to observe a creature for 3 rounds)
      when using the divinations listed in Detect Expertise. Non-mythic
      creatures cannot attempt a Will save to resist this effect.</p>
