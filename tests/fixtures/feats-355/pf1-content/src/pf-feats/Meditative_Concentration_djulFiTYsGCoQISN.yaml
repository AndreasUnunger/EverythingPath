name: Meditative Concentration
system:
  description:
    value: >-
      <p><em>Meditation clears your mind, allowing you to concentrate on your
      spells as if not distracted.</em></p><p><strong>Prerequisites</strong>:
      Wis 13, Combat Meditation, Meditation Master, character level
      5th.</p><p><strong>Benefits</strong>: For 1 round per character level
      after you perform combat meditation, whenever you attempt a concentration
      check to avoid losing a spell or a Fortitude save to resist a distraction
      effect (such as the distraction ability of a swarm), you gain a +4 bonus
      on the check. If you choose to use the benefits of Combat Meditation on
      the check, the bonus applies to both die rolls.</p>
  tags:
    - Meditation
type: feat
