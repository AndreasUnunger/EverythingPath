name: Outslug Weave
system:
  description:
    value: >-
      <p><em>You land precise attacks from
      afar.</em></p><p><strong>Prerequisites</strong>: Int 13; Combat Expertise
      or brawler's cunning class feature; Lunge; Outslug Style; Weapon Focus
      with the chosen weapon.</p><p><strong>Benefits</strong>: While using
      Outslug Style, you don't take a -2 penalty to your AC when using the Lunge
      feat. The bonuses to AC and on weapon damage rolls that you gain from
      Outslug Style increase to +2.</p>
  tags:
    - Combat
type: feat
