name: Wood Crafter
system:
  description:
    value: >-
      <p><em>Eschewing the use of metals in your craft, you excel at crafting
      armor from wood.</em></p><p><strong>Prerequisites</strong>: Craft (armor)
      3 ranks, Knowledge (nature) 3 ranks.</p><p><strong>Benefits</strong>: You
      gain a +4 bonus on Craft (armor) checks to create armor and shields from
      wood or special materials containing wood (such as darkwood). If you
      succeed at the check by 5 or more, you decrease the cost to make the item
      by 10%.</p>
  tags:
    - General
type: feat
