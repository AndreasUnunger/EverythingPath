name: Eroding Strikes
system:
  description:
    value: >-
      <p><em>With careful, repeated blows, you weaken your foe's
      defenses.</em></p><p><strong>Prerequisites</strong>: Weapon Focus with
      bludgeoning weapon.</p><p><strong>Benefits</strong>: When you deal damage
      with a melee attack with a bludgeoning weapon to an opponent you have
      already damaged this round, you can also reduce the value of that target's
      damage reduction by 1 until the beginning of your next turn. This
      reduction stacks with itself.</p>
  tags:
    - Combat
    - Combination
type: feat
