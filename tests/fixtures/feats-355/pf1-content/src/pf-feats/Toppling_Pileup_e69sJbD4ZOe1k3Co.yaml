name: Toppling Pileup
system:
  description:
    value: >-
      <p><em>When you trip one opponent, its fall might take the legs out from
      under another creature.</em></p><p><strong>Prerequisites</strong>: Int 13,
      Combat Expertise, Improved Trip.</p><p><strong>Benefits</strong>: As a
      standard action, you can attempt a single trip combat maneuver check at
      your full base attack bonus against a foe within reach. If you succeed,
      the target is knocked prone as normal and you can attempt an additional
      trip combat maneuver check (using your full base attack bonus) against a
      foe that is adjacent to the first target and also within reach. You can
      attempt only one additional combat maneuver per round with this feat.</p>
  tags:
    - Combat
type: feat
