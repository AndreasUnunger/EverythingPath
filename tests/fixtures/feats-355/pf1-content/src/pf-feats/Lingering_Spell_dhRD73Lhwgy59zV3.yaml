name: Lingering Spell
system:
  description:
    value: >-
      <p><em>You spell clings to existence, slowly fading from the
      world.</em></p><p><strong>Benefits</strong>: You may cause an
      instantaneous spell that affects an area to persist until the beginning of
      your next turn. Those already in the area suffer no additional harm, but
      other creatures or objects entering the area are subject to its effects. A
      lingering spell with a visual manifestation obscures vision, providing
      concealment (20% miss chance) beyond 5 feet and total concealment (50%
      miss chance) beyond 20 feet.</p><p>A lingering spell uses up a spell slot
      one level higher than the spell's actual level.</p>
  tags:
    - Metamagic
type: feat
