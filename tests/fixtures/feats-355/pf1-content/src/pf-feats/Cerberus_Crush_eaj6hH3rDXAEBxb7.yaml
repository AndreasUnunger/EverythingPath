name: Cerberus Crush
system:
  description:
    value: >-
      <p><em>When you strike from three directions, you channel deadly force
      into each blow.</em></p><p><strong>Prerequisites</strong>: Cerberus Snare,
      Cerberus Style, Vital Strike, base attack bonus +13 or monk level
      13th.</p><p><strong>Benefits</strong>: You can apply the benefits of Vital
      Strike, Improved Vital Strike, and Greater Vital Strike to all attacks
      made using Cerberus Style.</p>
