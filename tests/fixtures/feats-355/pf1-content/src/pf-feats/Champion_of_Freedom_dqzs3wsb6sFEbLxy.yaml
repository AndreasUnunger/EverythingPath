name: Champion of Freedom
system:
  description:
    value: >-
      <p><em>You believe that beings can thrive only when
      free.</em></p><p><strong>Prerequisites</strong>:10 Hit Dice, chaotic good
      alignment.</p><p><strong>Benefits</strong>: You can store a number of
      affirmations up to your Charisma bonus (minimum 1) to use at any time, not
      just within the next 24 hours. You can also use an affirmation to gain the
      effects of freedom of movement for 1 round. Lastly, you gain a +2 bonus on
      weapon and spell damage rolls against evil and lawful creatures (or +4 if
      the creature is both evil and lawful). This is an alignment-based
      effect.</p><p><strong>Residual</strong>: If you have this feat but you are
      no longer chaotic good, you continue to gain the +2 bonus on weapon and
      spell damage rolls against evil and lawful creatures (or +4 if the
      creature is both lawful and evil).</p>
  tags:
    - Alignment
type: feat
