name: Accursed Critical
system:
  description:
    value: >-
      <p><em>Your spells carry an embedded curse that manifests when they strike
      true.</em></p><p><strong>Prerequisites</strong>: Critical Focus, ability
      to cast bestow curse or major curse, caster level
      9th.</p><p><strong>Benefits</strong>: When you confirm a critical hit with
      a spell or spell-like ability, you may cast bestow curse or major curse on
      that target as an immediate action. This works even with ranged spells.
      You must have bestow curse or major curse prepared or otherwise available
      to cast, and using this ability casts the corresponding spell.</p>
  tags:
    - Critical
type: feat
