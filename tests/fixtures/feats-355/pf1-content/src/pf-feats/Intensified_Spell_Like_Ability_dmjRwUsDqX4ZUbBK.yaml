name: Intensified Spell-Like Ability
system:
  description:
    value: >-
      <p><em>Your spell-like ability deals more
      damage.</em></p><p><strong>Prerequisites</strong>: Spell-like ability at
      caster level 4th or higher.</p><p><strong>Benefits</strong>: Choose one of
      your spell-like abilities, subject to the restrictions described in this
      feat. You can use the chosen spell-like ability as an intensified
      spell-like ability three times per day (or less, if the ability is
      normally usable only once or twice per day).</p><p>When you use an
      intensified spell-like ability, the maximum number of the ability's damage
      dice increases by 5 levels. You must have sufficient caster levels to
      surpass the normal maximum in order to benefit from this feat. No other
      variables of the spell-like ability are affected, and spell-like abilities
      that inflict damage that is not modified by caster level are not affected
      by this feat.</p><p>You can only select a spell-like ability duplicating a
      spell with a level less than or equal to 1/2 your caster level (round
      down) - 1. For a summary, see Table
      3-1.</p><p><strong>Special</strong></p><p>This feat can be taken multiple
      times. Each time it is taken, you can apply it to a different spell-like
      ability.</p><table><tbody><tr><td>Spell Level</td><td>Caster
      Level1</td><td>Caster
      Level2</td></tr><tr><td>0</td><td>2nd</td><td>4th</td></tr><tr><td>1st</td><td>4th</td><td>6th</td></tr><tr><td>2nd</td><td>6th</td><td>8th</td></tr><tr><td>3rd</td><td>8th</td><td>10th</td></tr><tr><td>4th</td><td>10th</td><td>12th</td></tr><tr><td>5th</td><td>12th</td><td>14th</td></tr><tr><td>6th</td><td>14th</td><td>16th</td></tr><tr><td>7th</td><td>16th</td><td>18th</td></tr><tr><td>8th</td><td>18th</td><td>20th</td></tr><tr><td>9th</td><td>20th</td><td>-</td></tr></tbody></table><p>1&nbsp;Bouncing,
      disruptive, intensified, lingering, or scarring ability.<br />2Fearsome,
      sickening, or traumatic ability.</p>
  tags:
    - Monster
type: feat
