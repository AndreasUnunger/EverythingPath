name: Groundling
system:
  description:
    value: >-
      <p><em>You can speak with burrowing
      animals.</em></p><p><strong>Prerequisites</strong>: Cha 13, gnome, gnome
      magic racial trait.</p><p><strong>Benefits</strong>: You can use speak
      with animals as a spell-like ability at will, but only to communicate with
      burrowing animals like gophers, moles, and the like. You can still use
      your gnome speak with animals ability once per day to speak with any
      animal, as usual.</p>
  tags:
    - Racial
    - Gnome
