name: Cleaving Sweep
system:
  description:
    value: >-
      <p><em>You can sweep multiple foes to the ground with a single blow of
      your axe.</em></p><p><strong>Prerequisites</strong>: Str 15, Cleave,
      Improved Trip, Weapon Focus (greataxe), base attack bonus
      +11.</p><p><strong>Benefits</strong>: When using a full-attack action with
      a two-handed weapon, you can give up your regular attacks and instead
      attempt a trip combat maneuver at your highest base attack bonus against
      each opponent within reach. You must attempt a separate combat maneuver
      check against each opponent.</p>
  tags:
    - Combat
type: feat
