name: Eldritch Assault
system:
  description:
    value: >-
      <p><em>You make deadly strikes when magic cloaks your
      location.</em></p><p><strong>Prerequisites</strong>: Blind-Fight, Improved
      Initiative.</p><p><strong>Benefits</strong>: Whenever you attack from
      total concealment provided by a magical source (such as the displacement
      or invisibility spells), the first attack roll you make each round that is
      a critical threat is automatically confirmed as a critical hit.</p>
  tags:
    - General
type: feat
