name: Osirionology
system:
  description:
    value: >-
      <p><em>You have a broad interest in Osirion and are something of an
      authority in one specialized
      field.</em></p><p><strong>Prerequisites</strong>: Knowledge (history) 1
      rank, Knowledge (local) 1 rank, must be able to speak Osiriani and Ancient
      Osiriani.</p><p><strong>Benefits</strong>: Pick one Intelligence-based
      skill. You gain a +3 bonus on all checks made using that skill in relation
      to Osirion or its people. In addition, you gain a +1 bonus on all other
      Intelligence-based skill checks made in relation to Osirion or its
      people.</p>
  tags:
    - General
type: feat
