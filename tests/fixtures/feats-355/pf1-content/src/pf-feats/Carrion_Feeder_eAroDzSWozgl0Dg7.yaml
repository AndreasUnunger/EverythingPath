name: Carrion Feeder
system:
  description:
    value: >-
      <p><em>Like many scavengers, you can stomach foods that would make weaker
      creatures ill.</em></p><p><strong>Prerequisites</strong>:
      Tengu.</p><p><strong>Benefits</strong>: You gain a +2 racial bonus on
      saving throws against diseases and ingested poisons (but not other
      poisons). You receive a +2 bonus on Survival skill checks to find food for
      yourself (and only yourself).</p>
