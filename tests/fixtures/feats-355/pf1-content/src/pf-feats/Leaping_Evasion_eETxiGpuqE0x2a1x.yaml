img: systems/pf1/icons/feats/dodge.jpg
name: Leaping Evasion
system:
  description:
    value: >-
      <p><em>You jump out of the way of dangerous
      effects.</em></p><p><strong>Prerequisites</strong>: Lightning Reflexes,
      evasion class feature.</p><p><strong>Benefits</strong>: When you succeed
      at a Reflex save against a spell or effect that affects an area, as an
      immediate action you can attempt an Acrobatics check to jump out of the
      effect's area. You must move to the nearest space you can see outside of
      the affected area. The DC for this Acrobatics check is equal to the number
      of feet you must move to escape the area, and you can't travel farther
      than your normal movement. If you use this feat, you are staggered on your
      next turn. This movement doesn't provoke attacks of opportunity from
      creatures in the area of the effect you are escaping.</p><p><strong>Combat
      Trick</strong>: You can spend 5 stamina points to ignore the staggered
      condition normally imparted by this feat. (Melee Tactics Toolbox 9)</p>
  tags:
    - Combat
type: feat
