name: Unforgotten
system:
  description:
    value: >-
      <p><em>You search for a person dear to you--lost, but you pray not
      dead.</em></p><p><strong>Prerequisites</strong>: You must have a close
      relative, spouse, or other person dear to your heart who never returned
      from a journey, was captured, or otherwise vanished with little trace, or
      you have the Major Disaster background.</p><p><strong>Benefits</strong>:
      Your dogged determination reduces any nonlethal damage you take by 1
      point, to a minimum of 1 point of nonlethal damage. You also gain a +1
      bonus on Will saves.</p><p><strong>Goal</strong>: Find your lost loved one
      alive, and in the process, decisively defeat a challenging foe who kept
      you apart.</p><p><strong>Completion Benefit</strong>: You gain a +1 bonus
      on all saving throws, replacing the +1 bonus on Will saves. If you find
      your loved one dead, you lose all benefits from this feat until you put
      the body and possibly soul to proper rest. Putting the body to rest
      restores the completion benefit, but you don't regain the ability to
      reduce nonlethal damage.</p>
  tags:
    - Story
type: feat
