name: Otherworldly Influence
system:
  description:
    value: >-
      <p><em>Extradimensional forces vie for your soul, and have offered you
      riches and power to claim it.</em></p><p><strong>Prerequisites</strong>:
      You must have refused an evil creature with at least 15 Hit Dice who
      offered gifts or assistance, have refused an evil creature offering to
      cast a spell of 7th-level or higher on your behalf, or have the Planar
      Offering background.</p><p><strong>Benefits</strong>: When negotiating
      with evil outsiders, you gain a +2 bonus on Bluff and Diplomacy checks.
      You gain an amount of spell resistance equal to 5 + your character level
      against spells and spell-like abilities originating from outsiders with
      the evil subtype.</p><p><strong>Goal</strong>: Receive a boon from an evil
      creature that is equivalent in value to a month's service or an 8th-level
      spell without becoming indebted to the creature or giving up anything in
      return. This cannot be the result of magical
      compulsion.</p><p><strong>Completion Benefit</strong>: You gain an amount
      of spell resistance equal to 5 + your character level against spells or
      spell-like abilities originating from outsiders.</p>
  tags:
    - Story
type: feat
