name: Chilled Rock
system:
  description:
    value: >-
      <p><em>You can transfer the cold of your body to the rocks you
      throw.</em></p><p><strong>Prerequisites</strong>: Born of Frost, frost
      giant.</p><p><strong>Benefits</strong>: Any items you throw with your rock
      throwing ability are chilled by your touch, dealing an additional 1d6
      points of cold damage.</p>
