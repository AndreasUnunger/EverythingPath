name: Divine Dignity
system:
  description:
    value: >-
      <p><em>Secrets of the First Vault help you perfect your
      spellcasting.</em></p><p><strong>Prerequisites</strong>: Combat Casting,
      ability to cast divine spells, worshiper of
      Abadar.</p><p><strong>Benefits</strong>: Three times per day, as a free
      action when you cast a harmless divine spell or a domain spell, you can
      choose for the casting to not provoke attacks of
      opportunity.</p><p><strong>Special</strong>: You can take this feat
      multiple times. When you do, you can use this feat three more times per
      day.</p>
  tags:
    - General
type: feat
