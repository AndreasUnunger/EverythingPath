name: Mask of Virtue
system:
  description:
    value: >-
      <p><em>Your alignment is known to you and you
      alone.</em></p><p><strong>Benefits</strong>: Those who try to learn your
      true alignment find it hidden or receive a false result. Depending on the
      number of damnation feats you possess, spells or special abilities that
      would normally reveal your alignment return a vague or incorrect result.
      If this feat disguises your alignment, you can use either your true
      alignment or the false one when using magic items with alignment
      prerequisites.</p><p>One Damnation Feat</p><p>The spell or special ability
      returns an inconclusive result.</p><p>Two Damnation Feats</p><p>Upon
      gaining this power, choose an alignment within one step of your actual
      alignment. Your alignment is always revealed as being that false
      alignment.</p><p>Three Damnation Feats</p><p>Upon gaining this power,
      choose an alignment within two steps of your actual alignment. Your
      alignment is always revealed as being this false alignment.</p><p>Four
      Damnation Feats</p><p>You immediately know when someone is attempting to
      use a spell or special ability to learn your alignment. You learn the name
      and alignment of the creature using the effect. Additionally, you can
      choose any alignment as the result returned by the spell or ability.</p>
  tags:
    - Damnation
type: feat
