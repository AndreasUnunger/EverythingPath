name: Improved Cleaving Finish
system:
  description:
    value: >-
      <p><em>You can cut down many opponents in a single
      strike.</em></p><p><strong>Prerequisites</strong>: Str 13, Cleave,
      Cleaving Finish, Great Cleave, Power Attack, base attack bonus
      +6.</p><p><strong>Benefits</strong>: You can use Cleaving Finish any
      number of times per round.</p><h3>Combat Trick</h3><p>Once per round when
      you confirm a critical hit, you can spend 5 stamina points to treat that
      attack as if you reduced the target to 0 or fewer hit points for the
      purpose of using the Cleaving Finish feat.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
