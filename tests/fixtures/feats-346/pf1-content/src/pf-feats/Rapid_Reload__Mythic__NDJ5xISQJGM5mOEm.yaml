name: Rapid Reload (Mythic)
system:
  description:
    value: >-
      <p><em>You can reload any type of weapon with astounding
      speed.</em></p><p><strong>Prerequisites</strong>: Rapid
      Reload.</p><p><strong>Benefits</strong>: You gain the benefits of Rapid
      Reload with all crossbows and firearms, not just the one you originally
      chose when you gained that feat. As a swift action, you can expend one use
      of mythic power to gain the ability to reload crossbows and firearms
      without provoking attacks of opportunity for 1 minute.</p>
  tags:
    - Combat
    - Mythic
type: feat
