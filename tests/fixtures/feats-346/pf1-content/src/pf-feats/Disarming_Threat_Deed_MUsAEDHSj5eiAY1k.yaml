name: Disarming Threat Deed
system:
  description:
    value: >-
      <p><em>Even your threats are curiously
      charming.</em></p><p><strong>Prerequisites</strong>: Amateur Swashbuckler
      or panache class feature; Diplomacy 2 ranks, Intimidate 2
      ranks.</p><p><strong>Benefits</strong>: When you succeed at an Intimidate
      check to force an opponent to act friendly toward you, you can spend 1
      panache point to cause the target to regard you with indifference when the
      duration of the effect expires. A target influenced in this manner is
      unlikely to report you to authorities.</p><p><strong>Normal</strong>: An
      opponent forced to act friendly toward you by Intimidate becomes
      unfriendly when the duration expires, and is likely to report you to the
      authorities.</p>
  tags:
    - Panache
type: feat
