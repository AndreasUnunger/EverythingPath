name: Whispered Knowledge
system:
  description:
    value: >-
      <p><em>You possess secret knowledge that enhances and helps perfect your
      undead form.</em></p><p><strong>Prerequisites</strong>: Corporeal undead,
      Whispering Way 15 TPA.</p><p><strong>Benefits</strong>: Choose one of the
      following secrets:</p><p>Secret of Blood</p><p> After successfully dealing
      damage to a living creature with a melee attack, you can consume that
      creature's blood from your weapon as a swift action, gaining 1d8 temporary
      hit points, a +2 enhancement bonus to Strength, and a +1 bonus to your
      caster level. This lasts 10 minutes per Hit Die of your target, and
      otherwise acts as a death knell spell.</p><p>Secret of Bone</p><p> Your
      bones harden and calcify. You gain DR 5/bludgeoning.</p><p>Secret of
      Brains</p><p> As secret of blood, but you gain a +2 enhancement bonus to
      your Intelligence instead of Strength. This ability has no effect on
      mindless targets.</p><p>Secret of the Grave</p><p> You can designate an
      unholy container for your remains, such as a coffin, canopic jar, or
      burial urn. When in this container and not taking any actions, you gain
      fast healing 5.</p>
  tags:
    - Faction
type: feat
