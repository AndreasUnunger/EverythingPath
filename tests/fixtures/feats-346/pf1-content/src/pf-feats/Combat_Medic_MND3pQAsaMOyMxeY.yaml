name: Combat Medic
system:
  description:
    value: >-
      <p><em>You know the urgency of treating wounds in the heat of battle,
      applying first aid to your allies with such speed that you assure no one
      gets left behind.</em></p><p><strong>Prerequisites</strong>: Heal 5
      ranks.</p><p><strong>Benefits</strong>: Whenever you use Heal to provide
      first aid, treat caltrop wounds, or treat poison on an ally who also has
      this feat, you provoke no attacks of opportunity, and can take 10 on the
      check. Unlike with other teamwork feats, allies that are paralyzed,
      stunned, unconscious, or cannot otherwise act still count for the purposes
      of this feat.</p>
  tags:
    - Teamwork
type: feat
