name: Hex Strike
system:
  description:
    value: >-
      <p><em>Chanting and cursing, you put a hex on your enemy as part of your
      unarmed strike.</em></p><p><strong>Prerequisites</strong>: Hex class
      feature, Improved Unarmed Strike.</p><p><strong>Benefits</strong>: When
      you gain this feat, choose one hex that you can use to affect no more than
      one opponent. If you make a successful unarmed strike against an opponent,
      in addition to dealing your unarmed strike damage, you can use a swift
      action to deliver the effects of the chosen hex to that opponent. Doing so
      does not provoke attacks of opportunity.</p><p><strong>Special</strong>:
      You can take this feat multiple times. Each time you take it, you apply it
      to a different qualifying hex.</p><h3>Combat Trick</h3><p>You can spend 5
      stamina points to apply the effects of your chosen hex as a free action
      instead of a swift action.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
