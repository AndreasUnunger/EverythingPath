    value: >-
      <p><em>You are adept at moving fast and staying
      hidden.</em></p><p><strong>Prerequisites</strong>: Stealth 4 ranks,
      kobold.</p><p><strong>Benefits</strong>: You take no penalty on Stealth
      checks when you move up to your full speed. You can use the run or charge
      action and remain hidden, taking a -10 penalty on the check to do so.</p>
