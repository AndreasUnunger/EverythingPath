name: Ki Diversity
system:
  description:
    value: >-
      <p><em>You have trained at the feet of the masters of the Kusari-Gama, a
      secret society of monk warriors. With their secrets you have mastered new
      ways to apply your ki.</em></p><p><strong>Prerequisites</strong>: Ki pool
      class feature, Wis 13, Kusari-Gama 25
      TPA.</p><p><strong>Benefits</strong>: You learn how to channel your ki in
      a new ability. Choose one of the following ki powers:</p><hr
      /><p><strong>Bone Crusher</strong>: When you succeed at a trip or disarm
      combat maneuver, you may spend 1 point from your ki pool as a swift action
      to deal damage to your opponent as if you had hit them with an unarmed
      strike.</p><p><strong>Dim Mak</strong>: You may spend 1 point from your ki
      pool as a swift action to execute your next Stunning Fist attack as a
      melee touch attack rather than a normal melee attack.</p><p><strong>Mind
      of the Kensai</strong>: You may spend 1 point from your ki pool as a swift
      action to imbue a single melee weapon in your hands with the ki focus
      weapon special ability until your next turn.</p><p><strong>Wings of the
      Crane</strong>: If you have the Deflect Arrows feat, you may spend 1 point
      from your ki pool as an immediate action to use that feat to def lect a
      second missile weapon that round. If you have the Snatch Arrows feat, you
      may use this ability to catch a second weapon, but not throw it
      back.</p><p><strong>Zen Combatant</strong>: You may spend 1 point from
      your ki pool as a swift action to substitute your Wisdom score for your
      Strength or Dexterity for all melee or ranged attacks you make that
      round.</p>
  tags:
    - Combat
    - Faction
type: feat
