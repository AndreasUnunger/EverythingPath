name: Spell Praxis
system:
  description:
    value: >-
      <p><em>You can solve your spell equations in the instant your blade
      strikes a foe.</em></p><p><strong>Prerequisites</strong>: Scribe Scroll,
      Scribe Spell Equation, aphorite, caster level 5th, crystalline dust racial
      trait.</p><p><strong>Benefits</strong>: When you hit a creature with a
      melee weapon, you can immediately solve one of your spell equations to
      cast the spell and target that creature as an immediate action. The spell
      stored in the spell equation must be a spell of up to 3rd level that
      targets one or more creatures and has a casting time of 1 standard action.
      The spell can target only the creature you hit, even if the spell would
      normally allow multiple targets.</p>
  tags:
    - Racial
    - Aphorite
type: feat
