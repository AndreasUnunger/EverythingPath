name: Quick Dirty Trick
system:
  description:
    value: >-
      <p><em>You can perpetrate a dirty trick and deliver an attack before your
      opponent is the wiser.</em></p><p><strong>Prerequisites</strong>: Int 13,
      Combat Expertise, Improved Dirty Trick, base attack bonus
      +6.</p><p><strong>Benefits</strong>: On your turn, you can perform a
      single dirty trick combat maneuver (Advanced Players Guide 320) in place
      of one of your melee attacks. You must choose the melee attack with the
      highest base attack bonus to make the dirty trick combat
      maneuver.</p><p><strong>Normal</strong>: A dirty trick combat maneuver is
      a standard action.</p><h3>Combat Trick</h3><p>: You can select this feat
      even if you don't meet the ability score prerequisite (Intelligence 13).
      You gain the benefits of this feat only as long as you have at least 1
      stamina point in your stamina pool. You can spend 2 stamina points to
      change an attack that does not have your highest base attack bonus into a
      dirty trick combat maneuver. You can use this combat trick only once per
      round, but you can use it even if you already used your attack at the
      highest base attack bonus for a dirty trick.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
