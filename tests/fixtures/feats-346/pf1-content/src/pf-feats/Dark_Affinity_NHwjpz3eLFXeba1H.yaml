name: Dark Affinity
system:
  description:
    value: >-
      <p><em>You have observed the dark stalkers who roam the Hao Jin Tapestry
      and adopted some of their
      tricks.</em></p><p><strong>Prerequisites</strong>: Character level 3rd,
      must have visited the Hao Jin Tapestry.</p><p><strong>Benefits</strong>:
      You can cast darkness once per day as a spell-like ability using your
      character level as your caster level. At 7th level, you can also cast
      deeper darkness once per day as a spell-like ability using your character
      level as your caster level.</p>
