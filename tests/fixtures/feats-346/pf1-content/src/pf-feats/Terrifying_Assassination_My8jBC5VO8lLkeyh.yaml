name: Terrifying Assassination
system:
  description:
    value: >-
      <p><em>Though no assassin intends to fail at an assassination attempt, you
      find ways to reduce the severity of failure so you have other chances to
      kill your targets through protracted combat. Your assassination attempts
      rattle enemies you fail to
      kill.</em></p><p><strong>Prerequisites</strong>: Assassinate ninja master
      trick, assassinate slayer advanced talent, or death
      attack.</p><p><strong>Benefits</strong>: If you attempt to instantly kill
      a foe with a death attack, or with the assassinate master trick or
      advanced talent, and the target doesn't die, the target is shaken for 2d4
      rounds.</p>
  tags:
    - General
type: feat
