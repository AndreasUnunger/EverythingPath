    value: >-
      <p><em>Your critical strikes with your chosen weapon are deadlier than
      most.</em></p><p><strong>Prerequisites</strong>: Improved Critical, base
      attack bonus +8.</p><p><strong>Benefits</strong>: Your critical multiplier
      with your chosen weapon is increased by 1 (to a maximum of x--6).Special:
