name: Blood Feast
system:
  description:
    value: >-
      <p><em>You become more aggressive and vicious when you taste living flesh
      and blood.</em></p><p><strong>Prerequisites</strong>: Bite
      attack.</p><p><strong>Benefits</strong>: When you damage a living creature
      with your bite attack, you gain a +1 morale bonus on attack and damage
      rolls with your bite attack until the end of your next turn.</p>
