name: Drag Down
system:
  description:
    value: >-
      <p><em>When you are knocked prone, you are skilled at bringing your
      opponent down with you.</em></p><p><strong>Prerequisites</strong>: Int 13,
      Combat Expertise, Improved Trip.</p><p><strong>Benefits</strong>: Whenever
      an opponent successfully trips you, you can attempt to trip that opponent
      as an immediate action.</p><h3>Combat Trick</h3><p>You can select this
      feat even if you don't meet the ability score prerequisite (Intelligence
      13). You gain the benefit of this feat only as long as you have at least 1
      stamina point in your stamina pool. If your retributive trip combat
      maneuver from Drag Down succeeds by 10 or more, you can spend 5 stamina
      points to stand up from prone without provoking an attack of opportunity
      as part of the same immediate action as the trip attempt.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
