name: Intensified Spell
system:
  description:
    value: >-
      <p><em>Your spells can go beyond several normal
      limitations.</em></p><p><strong>Benefits</strong>: An intensified spell
      increases the maximum number of damage dice by 5 levels. You must actually
      have sufficient caster levels to surpass the maximum in order to benefit
      from this feat. No other variables of the spell are affected, and spells
      that inflict damage that is not modified by caster level are not affected
      by this feat. An intensified spell uses up a spell slot one level higher
      than the spell's actual level.</p>
  tags:
    - Metamagic
type: feat
