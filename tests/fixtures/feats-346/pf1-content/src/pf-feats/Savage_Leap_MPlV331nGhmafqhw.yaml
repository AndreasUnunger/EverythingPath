name: Savage Leap
system:
  description:
    value: >-
      <p><em>You leap into the air while holding your opponent and slam him to
      the ground.</em></p><p><strong>Prerequisites</strong>: Improved Grapple,
      Improved Unarmed Strike, Savage Slam, base attack bonus +12 or monk level
      10th.</p><p><strong>Benefits</strong>: When you use Savage Slam, you can
      move yourself and your target up to half your speed before releasing the
      grapple. You provoke attacks of opportunity from this movement, but your
      target does not. If your target takes damage from Savage Slam, the target
      is shaken for 1 round. You become flat-footed until the start of your next
      turn if you move before using Savage Slam in this way.</p>
  tags:
    - Combat
type: feat
