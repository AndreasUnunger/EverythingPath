name: Fey Spell Versatility
system:
  description:
    value: >-
      <p><em>You have learned magical secrets from the
      fey.</em></p><p><strong>Prerequisites</strong>: Cha 13, Spellcraft 1 rank,
      ability to cast ranger spells.</p><p><strong>Benefits</strong>: Choose a
      1st-level spell, a 2nd-level spell, a 3rd-level spell, and a 4th-level
      spell from the bard, sorcerer/wizard, or witch spell list that is either
      from the enchantment or illusion school or a spell with the curse
      descriptor. Add those spells to your ranger spell list. Once chosen, these
      spells cannot be changed.</p>
  tags:
    - General
type: feat
