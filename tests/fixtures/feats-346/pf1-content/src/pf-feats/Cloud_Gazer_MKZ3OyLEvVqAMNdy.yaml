name: Cloud Gazer
system:
  description:
    value: >-
      <p><em>Your insight into your elemental heritage gives you a clarity of
      sight few humans possess.</em></p><p><strong>Prerequisites</strong>:
      Sylph.</p><p><strong>Benefits</strong>: You can see through fog, mist, and
      clouds, without penalty, ignoring any cover or concealment bonuses from
      such effects. If the effect is created by magic, this feat instead triples
      the distance you can see without penalty.</p>
