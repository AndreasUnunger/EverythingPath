name: Knight of the Twisted Word
system:
  description:
    value: >-
      <p><em>You've so impressed the Traitor that he's given you a title in his
      court-in-exile--possibly to keep an eye on
      you.</em></p><p><strong>Prerequisites</strong>: Fey creature type or Fey
      Obedience (Count Ranalc), character level 7th, you must have betrayed or
      deceived in a major fashion a demon with a CR at least 2 higher than your
      level when you took the feat.</p><p><strong>Benefits</strong>: Once per
      day, you can cast glibness as a spell-like ability with a caster level
      equal to your Hit Dice.</p>
