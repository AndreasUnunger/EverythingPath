name: Angelic Blood
system:
  description:
    value: >-
      <p><em>Your blood is infused with holy
      power.</em></p><p><strong>Prerequisites</strong>: Con 13,
      aasimar.</p><p><strong>Benefits</strong>: You gain a +2 bonus on saving
      throws against effects with the evil descriptor and on Constitution checks
      to stabilize when you are reduced to negative hit points (but not dead).
      Furthermore, each time you take bleed or blood drain damage, each undead
      creature or creature with the evil subtype that is currently adjacent to
      you also takes 1 point of damage.</p>
  tags:
    - Racial
    - Aasimar
type: feat
