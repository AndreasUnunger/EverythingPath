name: Traditional Weapons
system:
  description:
    value: >-
      <p><em>You're a master of utilizing simple, time-trusted arms against
      strange or technological
      weapons.</em></p><p><strong>Prerequisites</strong>: Int
      13.</p><p><strong>Benefits</strong>: You receive a +2 bonus on combat
      maneuver checks against creatures wielding exotic weapons, firearms, or
      technological weapons (see Pathfinder Campaign Setting: Technology Guide).
      You also receive a +2 bonus to your CMD whenever an opponent attempts any
      combat maneuver against you while wielding such a weapon. You gain these
      bonuses only if you are not wielding an exotic weapon, firearm, or
      technological weapon.</p>
  tags:
    - Combat
type: feat
