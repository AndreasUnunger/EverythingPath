name: Blood Beak
system:
  description:
    value: >-
      <p><em>Your bleed attack is bloody and
      dangerous.</em></p><p><strong>Prerequisites</strong>: Base attack bonus
      +5, natural weapon racial trait, tengu.</p><p><strong>Benefits</strong>:
      Increase the damage of your beak attack to 1d6. Furthermore, when you
      confirm a critical hit with your beak attack, you also deal 1 point of
      bleed damage.</p><p><strong>Special</strong>: The bleed effect from this
      feat stacks with that of the Bleeding Critical feat and similar effects,
      adding 1 point to your bleed damage.</p><h3>Combat Trick</h3><p>You can
      spend 1 stamina point when you confirm a critical hit with your beak to
      increase the bleed damage to 1d4 points of bleed damage.</p>
  tags:
    - Combat
    - Racial
    - Tengu
    - Combat Trick
type: feat
