name: Toxic Recovery
system:
  description:
    value: >-
      <p><em>Your system recuperates from the effects of poisons with
      astonishing speed.</em></p><p><strong>Prerequisites</strong>: Dwarf, hardy
      racial trait.</p><p><strong>Benefits</strong>: Whenever you succeed at a
      saving throw against poison, you heal 1 point of ability damage of the
      type dealt by the poison. Whenever you heal ability damage naturally or
      magically, you heal 1 additional point of ability damage. This feat has no
      effect on penalties to ability scores or ability drain.</p>
  tags:
    - Racial
    - Dwarf
type: feat
