name: Fearsome Finish
system:
  description:
    value: >-
      <p><em>When you slay enemies, you frighten other
      opponents.</em></p><p><strong>Prerequisites</strong>: Intimidating
      Prowess, worshiper of Lamashtu.</p><p><strong>Benefits</strong>: Upon
      reducing an enemy to 0 or fewer hit points, for the remaining duration of
      the combat encounter, you gain a +4 bonus on any Intimidate checks made to
      demoralize opponents who can see both you and the opponent you
      dropped.</p>
  tags:
    - Combat
type: feat
