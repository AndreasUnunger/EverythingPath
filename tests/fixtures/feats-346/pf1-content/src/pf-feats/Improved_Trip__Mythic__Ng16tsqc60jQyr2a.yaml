name: Improved Trip (Mythic)
system:
  description:
    value: >-
      <p><em>You're expert at knocking your foes
      down.</em></p><p><strong>Prerequisites</strong>: Improved
      Trip.</p><p><strong>Benefits</strong>: You gain a bonus equal to half your
      tier on checks to trip, and to your CMD when an opponent tries to trip
      you. These bonuses stack with those granted by Improved Trip.</p><p>
      Furthermore, you can make an attack of opportunity against any creature
      that attempts to trip you, unless it also has this feat.</p>
  tags:
    - Combat
    - Mythic
type: feat
