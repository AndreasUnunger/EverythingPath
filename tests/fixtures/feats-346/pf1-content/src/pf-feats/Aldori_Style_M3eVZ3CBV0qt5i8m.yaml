name: Aldori Style
system:
  description:
    value: >-
      <p><em>You have learned the classic Aldori dueling
      stance.</em></p><p><strong>Prerequisites</strong>: Alertness, Exotic
      Weapon Proficiency (Aldori dueling sword), Weapon Finesse, Weapon Focus
      (Aldori dueling sword).</p><p><strong>Benefits</strong>: While using
      Aldori Style and wielding only a single Aldori dueling sword in one hand
      (not using a shield, an off-hand weapon, armor spikes, unarmed strikes, or
      natural weapons), when you fight defensively or use Combat Expertise, you
      gain a +2 bonus on weapon damage rolls.</p>
  tags:
    - Combat
    - Style
type: feat
