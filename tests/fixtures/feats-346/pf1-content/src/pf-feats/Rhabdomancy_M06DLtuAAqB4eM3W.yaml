name: Rhabdomancy
system:
  description:
    value: >-
      <p><em>You have mastered the art of casting sticks, rods, or arrows to
      uncover secrets and find lost things, gaining insight from the way these
      objects fall.</em></p><p><strong>Prerequisites</strong>: Knowledge
      (nature) 3 ranks, Survival 3 ranks.</p><p><strong>Benefits</strong>: You
      can perform the dowsing occult skill unlock even if you can't use psychic
      magic. If you can cast psychic spells or have the Psychic Sensitivity
      feat, you can use dowsing one additional time per day.</p><p>Spending 1
      minute casting sticks prior to attempting a Survival check grants you a +2
      insight bonus on the check. In addition, you can cast sticks or rods while
      casting a spell that locates a creature or object (including scrying
      effects) to increase the caster level of that spell by 1.</p>
  tags:
    - General
type: feat
