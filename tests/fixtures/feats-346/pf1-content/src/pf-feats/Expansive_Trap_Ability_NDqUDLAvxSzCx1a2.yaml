name: Expansive Trap Ability
system:
  description:
    value: >-
      <p><em>Your ranger traps and land mines occupy a larger
      area.</em></p><p><strong>Prerequisites</strong>: Ability to use ranger
      traps (Pathfinder RPG Ultimate Magic 64) or land mines (Pathfinder Player
      Companion: Dungeoneer's Handbook 23).</p><p><strong>Benefits</strong>: You
      can designate any ranger trap or land mine you lay to occupy up to 4
      contiguous squares of your choice. When the trap is activated, the effect
      is centered on whichever square the triggering creature first entered. If
      more than one square is entered simultaneously, choose at random.</p>
  tags:
    - General
type: feat
