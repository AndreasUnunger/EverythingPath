name: Mounted Skirmisher
system:
  description:
    value: >-
      <p><em>You are adept at attacking from upon a swift moving
      steed.</em></p><p><strong>Prerequisites</strong>: Ride rank 14, Mounted
      Combat, Trick Riding.</p><p><strong>Benefits</strong>: If your mount moves
      its speed or less, you can still take a full-attack
      action.</p><p><strong>Normal</strong>: If your mount moves more than 5
      feet, you can only take an attack action.</p><p><strong>Combat
      Trick</strong>: When your mount moves its speed or less, you can spend 5
      stamina points to spur it on 10 additional feet. This is bonus movement,
      and you can still make a full attack when your mount takes this bonus
      movement.</p>
  tags:
    - Combat
type: feat
