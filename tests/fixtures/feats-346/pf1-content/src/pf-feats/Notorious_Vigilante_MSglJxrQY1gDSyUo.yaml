name: Notorious Vigilante
system:
  description:
    value: >-
      <p><em>You are widely known as dangerous and
      fearsome.</em></p><p><strong>Prerequisites</strong>: Dazzling Display,
      Weapon Focus, any nongood alignment, great renown social talent,
      proficiency with chosen weapon.</p><p><strong>Benefits</strong>: Your
      presence can act as a fast and effective Dazzling Display. As a standard
      action, you use the benefit of Dazzling Display even when you are not
      wielding a weapon in which you have Weapon Focus. If you are wielding such
      a weapon, you gain a +2 bonus on the Intimidate check.</p>
  tags:
    - Combat
type: feat
