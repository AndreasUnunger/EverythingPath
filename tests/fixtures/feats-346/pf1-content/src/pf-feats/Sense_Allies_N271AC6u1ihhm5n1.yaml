name: Sense Allies
system:
  description:
    value: >-
      <p><em>Wildborn who grow up together are closely attuned to the presence
      of others and carry this skill throughout their
      lives.</em></p><p><strong>Prerequisites</strong>: Perception 3 ranks,
      wildborn half-elf.</p><p><strong>Benefits</strong>: You are aware of the
      location of all allies within 60 feet, even if they are hiding, invisible,
      or otherwise could not normally be detected.</p>
  tags:
    - Racial
    - Half-Elf
type: feat
