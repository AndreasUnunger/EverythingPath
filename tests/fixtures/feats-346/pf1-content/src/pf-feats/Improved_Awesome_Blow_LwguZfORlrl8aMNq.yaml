name: Improved Awesome Blow
system:
  description:
    value: >-
      <p><em>You are skilled at sending your opponents
      flying.</em></p><p><strong>Prerequisites</strong>: Str 13; Awesome Blow or
      awesome blow class feature; Power Attack</p><p><strong>Benefits</strong>:
      You receive a +2 bonus on checks to perform an awesome blow combat
      maneuver. You also gain a +2 bonus to your combat maneuver defense
      whenever an opponent tries to perform an awesome blow combat maneuver
      against you. Whenever you successfully perform an awesome blow combat
      maneuver, your opponent's movement provokes attacks of opportunity from
      all your allies (but not you).</p><p><strong>Normal</strong>: Creatures
      moved by awesome blow do not provoke attacks of opportunity.</p><h3>Combat
      Trick</h3><p>When a creature attempts an awesome blow combat maneuver
      against you, you can spend up to 3 stamina points to increase your Combat
      Maneuver Defense against that combat maneuver by an amount equal to the
      number of stamina points you spent. This bonus stacks with the bonus
      granted by Improved Awesome Blow.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
