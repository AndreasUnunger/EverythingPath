name: Athletic (Mythic)
system:
  description:
    value: >-
      <p><em>You excel far beyond others at acts of physical
      prowess.</em></p><p><strong>Prerequisites</strong>:
      Athletic.</p><p><strong>Benefits</strong>: The bonus on Climb and Swim
      skill checks from Athletic increases by 2. In addition, you can expend one
      use of mythic power to treat a Climb or Swim check as if you had rolled a
      natural 20. You must decide to use this ability before making the
      roll.</p>
