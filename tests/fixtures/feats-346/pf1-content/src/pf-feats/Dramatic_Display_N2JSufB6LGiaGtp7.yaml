name: Dramatic Display
system:
  description:
    value: >-
      <p><em>Your skill with your weapon is obvious to enemies and onlookers
      alike.</em></p><p><strong>Prerequisites</strong>: Dazzling
      Display.</p><p><strong>Benefits</strong>: When you spend a swift action to
      make a performance check, you exude an aura of awe-inspiring skill. You
      gain a +2 bonus on your performance check, and gain a +2 bonus on all
      attack rolls and combat maneuver checks until the end of your next
      turn.</p><h3>Combat Trick</h3><p>When using this feat, you can spend 5
      stamina points to also gain a +2 dodge bonus to AC until the end of your
      next turn.</p>
  tags:
    - Combat
    - Performance
    - Combat Trick
type: feat
