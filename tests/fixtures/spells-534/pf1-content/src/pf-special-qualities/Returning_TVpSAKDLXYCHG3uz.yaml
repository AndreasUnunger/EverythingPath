name: Returning
system:
  description:
    value: >-
      <p><strong>Aura</strong> moderate transmutation <strong>CL</strong>
      7th</p><p><strong>Slot</strong> weapon quality; <strong>Price</strong> +1
      bonus;</p><p>This special ability can only be placed on a weapon that can
      be thrown. A <em>returning </em>weapon flies through the air back to the
      creature that threw it. It returns to the thrower just before the
      creature's next turn (and is therefore ready to use again in that turn).
      Catching a <em>returning </em>weapon when it comes back is a free action.
      If the character can't catch it, or if the character has moved since
      throwing it, the weapon drops to the ground in the square from which it
      was thrown.</p><h3>Construction</h3><p><strong>Requirements</strong> Craft
      Magic Arms and Armor, <em>telekinesis</em>; <strong>Price</strong> -</p>
