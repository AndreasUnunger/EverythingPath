  description:
    value: >-
      <p><strong>Race</strong>: Ghoran<br /><strong>Replaced Trait(s)</strong>:
      Past-Life Knowledge; Nature Magic</p><hr /><p>Ghorans were originally
      created to survive and thrive in a magic-blasted wasteland, and over the
      centuries some ghorans have adapted greater abilities to overcome magic in
      general. Once per day, the ghoran can cast
      @UUID[Compendium.pf1.spells.Item.gmgwyjfpeuuc4t4o]{dispel magic} as a
      spell-like ability, with a caster level equal to the ghoran's character
      level. If the ghoran's favored class is a spellcasting class, the ghoran
      gains a +2 racial bonus on dispel checks (<em>Pathfinder RPG Core
      Rulebook</em> 272).</p><p>This replaces past-life knowledge and nature
      magic.</p>
