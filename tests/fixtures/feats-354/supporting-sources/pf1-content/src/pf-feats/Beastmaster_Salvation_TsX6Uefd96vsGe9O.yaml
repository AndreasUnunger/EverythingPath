name: Beastmaster Salvation
system:
  description:
    value: >-
      <p><em>Your presence grants your companion the toughness and will to
      resist all manner of threats.</em></p><p><strong>Prerequisites</strong>:
      Cha 13, Alertness, Beastmaster Style, Handle Animal 5 ranks, Sense Motive
      5 ranks.</p><p><strong>Benefits</strong>: If you are adjacent to your
      animal companion when it attempts a saving throw, you can attempt a Handle
      Animal check as an immediate action. Your animal companion does not
      attempt the saving throw, but instead uses your Handle Animal result as
      its result for the save.</p>
  tags:
    - Combat
type: feat
