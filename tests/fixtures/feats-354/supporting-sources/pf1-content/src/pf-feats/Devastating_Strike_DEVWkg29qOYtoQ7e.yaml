name: Devastating Strike
system:
  description:
    value: >-
      <p><em>Pitting all of your strength and resolve against your enemy, you
      deliver a strike that is impossible to
      ignore.</em></p><p><strong>Prerequisites</strong>: Vital Strike, base
      attack bonus +9.</p><p><strong>Benefits</strong>: Whenever you use Vital
      Strike, Improved Vital Strike, or Greater Vital Strike, you gain a +2
      bonus on each extra weapon damage dice roll those feats grant (+6
      maximum). This bonus damage is multiplied on a critical hit.</p><h3>Combat
      Trick</h3><p>Whenever you use Vital Strike, Improved Vital Strike, or
      Greater Vital Strike, you can spend 5 stamina points to increase the bonus
      damage to +4 on each extra weapon damage die. For weapons with more than
      one damage die, count all of the weapon's base damage dice together as one
      set.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
