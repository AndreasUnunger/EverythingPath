name: Second Chance
system:
  description:
    value: >-
      <p><em>Quick reflexes turn missed strikes into second
      chances.</em></p><p><strong>Prerequisites</strong>: Int 13, Combat
      Expertise, base attack bonus +6.</p><p><strong>Benefits</strong>: When
      making a full attack, if you miss on your first attack, you can forgo
      making any other attacks for the rest of your turn to reroll that attack
      at your highest base attack bonus.</p><h3>Combat Trick</h3><p>: You can
      select this feat even if you don't meet the ability score prerequisite
      (Intelligence 13). You gain the benefits of this feat only as long as you
      have at least 1 stamina point in your stamina pool. After you use Second
      Chance, you can spend 5 stamina points to still make an attack at your
      second-highest attack bonus after rerolling your first attack.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
