img: systems/pf1/icons/races/changeling.png
name: Starry Grace
system:
  description:
    value: >-
      <p><em>Your quick and free starknife motions allow you to make deadly
      dexterous attacks.</em></p><p><strong>Prerequisites</strong>: Dex 13,
      Weapon Finesse, Weapon Focus (starknife).</p><p><strong>Benefits</strong>:
      When wielding a starknife, you can add your Dexterity modifier instead of
      your Strength modifier to that weapon's damage. The starknife must be one
      appropriate for your size. You do not gain this benefit while fighting
      with two weapons or using flurry of blows, or any time another hand is
      otherwise occupied.</p><p>In addition, if you have the panache class
      feature, as long as you have at least 1 panache point, you gain a +5 bonus
      to your movement speed on your move action after taking an attack action
      with a starknife or on your Spring Attack or charge with a starknife.</p>
  tags:
    - Combat
type: feat
