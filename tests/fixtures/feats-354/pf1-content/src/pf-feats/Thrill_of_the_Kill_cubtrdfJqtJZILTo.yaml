name: Thrill of the Kill
system:
  description:
    value: >-
      <p><em>Killing fuels your rage.</em></p><p><strong>Prerequisites</strong>:
      Half-orc or orc, rage class feature.</p><p><strong>Benefits</strong>: When
      you are raging and your attack reduces an enemy to negative hit points or
      kills it, you regain 1 round of rage. You may only use this feat if the
      fallen enemy had at least as many Hit Dice as you. You can only gain this
      benefit once per round.</p>
  tags:
    - Racial
    - Half-Orc
    - Orc
type: feat
