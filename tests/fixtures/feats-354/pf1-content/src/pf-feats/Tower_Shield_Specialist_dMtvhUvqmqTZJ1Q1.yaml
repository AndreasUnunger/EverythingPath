name: Tower Shield Specialist
system:
  description:
    value: >-
      <p><em>You wield tower shields with
      ease.</em></p><p><strong>Prerequisites</strong>: Shield Focus, Tower
      Shield Proficiency, base attack bonus +11 or fighter level
      8th.</p><p><strong>Benefits</strong>: You reduce the armor check penalty
      for tower shields by 3, and if you have the armor training class feature,
      you modify the armor check penalty and maximum Dexterity bonus of tower
      shields as if they were armor.</p>
  tags:
    - Combat
    - Shield Mastery
type: feat
