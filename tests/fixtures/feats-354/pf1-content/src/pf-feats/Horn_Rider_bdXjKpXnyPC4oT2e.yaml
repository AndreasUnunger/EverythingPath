name: Horn Rider
system:
  description:
    value: >-
      <p><em>You can defend yourself using the horn or tusk of a creature you're
      lashed to.</em></p><p><strong>Prerequisites</strong>: Base attack bonus
      +1.</p><p><strong>Benefits</strong>: You gain a +1 shield bonus to AC when
      lashed into a horn harness.</p><p><strong>Special</strong>: A creature
      with this feat can take the Mounted Archery feat without possessing 1 rank
      in the Ride skill or the Mounted Combat feat.</p>
  tags:
    - Combat
type: feat
