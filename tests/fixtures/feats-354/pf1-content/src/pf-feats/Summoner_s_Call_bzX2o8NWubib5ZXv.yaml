name: Summoner's Call
system:
  description:
    value: >-
      <p><em>Whenever you summon your eidolon, it is more powerful for a brief
      period of time.</em></p><p><strong>Prerequisites</strong>: Eidolon class
      feature.</p><p><strong>Benefits</strong>: Whenever you summon your
      eidolon, you may give it a +2 enhancement bonus to its Strength,
      Dexterity, or Constitution. This bonus lasts 10 minutes after the
      summoning ritual is complete.</p>
