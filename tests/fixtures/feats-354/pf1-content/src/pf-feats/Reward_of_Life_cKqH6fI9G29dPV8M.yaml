name: Reward of Life
system:
  description:
    value: >-
      <p><em>When you lay on hands, you are also
      healed.</em></p><p><strong>Prerequisites</strong>: Lay on hands class
      feature.</p><p><strong>Benefits</strong>: Each time you use your lay on
      hands ability to heal a creature other than yourself, you heal a number of
      hit points equal to your Charisma bonus. This ability has no effect if you
      use lay on hands to harm undead.</p>
  tags:
    - General
type: feat
