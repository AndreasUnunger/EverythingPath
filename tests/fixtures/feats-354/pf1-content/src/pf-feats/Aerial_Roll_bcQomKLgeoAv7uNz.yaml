name: Aerial Roll
system:
  description:
    value: >-
      <p><em>By spinning through the air, you are able to avoid your opponents'
      attacks.</em></p><p><strong>Prerequisites</strong>: Fly 10
      ranks.</p><p><strong>Benefits</strong>: You can perform a defensive roll
      while in the air. As an immediate action, you can attempt a Fly check when
      you are attacked while flying. If the result of the check is greater than
      the result of the attack roll, you dodge the attack, causing it to miss
      automatically. Whether you succeed or fail at the Fly check, the barrel
      roll leaves you off-balance and vulnerable, causing you to take a -10
      penalty on Fly checks until the end of your next turn.</p>
  tags:
    - Combat
type: feat
