name: Intrepid Rescuer
system:
  description:
    value: >-
      <p><em>You instinctively react to interfere with foes that attack your
      allies or innocents.</em></p><p><strong>Prerequisites</strong>: Combat
      Reflexes, worshiper of Kurgess.</p><p><strong>Benefits</strong>: Whenever
      an opponent you threaten makes an attack against a helpless, prone, or
      stunned ally or any attack against a noncombatant, that opponent provokes
      an attack of opportunity from you. If your attack of opportunity hits your
      foe, she takes a -4 penalty on the attack roll that provoked this attack
      of opportunity.</p><h3>Combat Trick</h3><p>When an opponent provokes an
      attack of opportunity from you as a result of the Intrepid Rescuer feat,
      if your attack of opportunity hits, you can spend 5 stamina points to
      cause the opponent's attack to automatically miss your ally.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
