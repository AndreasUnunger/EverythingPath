name: Coven Caster
system:
  description:
    value: >-
      <p><em>You share your mother's gift for working in
      groups.</em></p><p><strong>Prerequisites</strong>:
      Changeling.</p><p><strong>Benefits</strong>: As a standard action, you can
      attempt a special aid another action (1d20 + your choice of your
      Intelligence or Charisma modifier; DC 10). If you succeed, you can
      increase an adjacent spellcaster's caster level by 1 until the beginning
      of your next turn. If you also have the coven witch hex, you can apply
      this bonus to all members of your coven within 30 feet.</p>
  tags:
    - Racial
    - Changeling
type: feat
