name: Sure on Ice
system:
  description:
    value: >-
      <p><em>You move on ice and snow as if it were dry
      ground.</em></p><p><strong>Prerequisites</strong>: Frost
      giant.</p><p><strong>Benefits</strong>: You can move across icy and snowy
      surfaces without penalty, and don't need to attempt Acrobatics checks to
      run or charge on ice. You gain a +4 bonus on Climb checks to climb
      ice.</p>
