name: Reflexive Caster
system:
  description:
    value: >-
      <p><em>You are ready to defend yourself with a spell at a moment's
      notice.</em></p><p><strong>Prerequisites</strong>: Combat Reflexes, caster
      level 5th.</p><p><strong>Benefits</strong>: If you fail a Perception check
      that results in you being unable to act in a surprise round, you still
      roll initiative normally. You can act on your initiative count in the
      surprise round, but can only take a standard action to cast an abjuration
      spell that targets only yourself.</p>
  tags:
    - General
type: feat
