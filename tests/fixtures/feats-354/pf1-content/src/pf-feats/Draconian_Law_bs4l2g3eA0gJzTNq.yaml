name: Draconian Law
system:
  description:
    value: >-
      <p><em>Your code of honor extends to all aspects of life, including the
      judgment of your foes.</em></p><p><strong>Prerequisites</strong>: Lawful
      alignment, wyvaran .</p><p><strong>Benefits</strong>: When fighting an
      enemy you've witnessed breaking the law, you gain a +1 circumstance bonus
      on your first attack roll and on all damage rolls against that target
      until it has been tried for its crime.</p>
  tags:
    - Racial
    - Wyvaran
type: feat
