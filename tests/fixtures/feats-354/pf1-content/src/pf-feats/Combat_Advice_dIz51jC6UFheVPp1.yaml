name: Combat Advice
system:
  description:
    value: >-
      <p><em>Your succinct words can aid an ally even in the heat of
      battle.</em></p><p><strong>Benefits</strong>: As a move action, you can
      offer useful advice to an ally engaged in combat at just the right moment.
      Designate an enemy; your ally gains a +2 competence bonus on her next
      attack roll against that enemy. For your ally to benefit from this feat,
      you must be able to clearly see your ally and the designated enemy, and
      your ally must be able to hear you.</p>
  tags:
    - General
type: feat
