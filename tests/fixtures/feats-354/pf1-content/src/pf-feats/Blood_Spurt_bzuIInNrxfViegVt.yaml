img: systems/pf1/icons/skills/blood_05.jpg
name: Blood Spurt
system:
  description:
    value: >-
      <p><em>When cut in combat, you spray your blood into the faces of your
      foes.</em></p><p><strong>Prerequisites</strong>: Base attack bonus +2,
      susceptibility to bleed damage.</p><p><strong>Benefits</strong>: Whenever
      a creature adjacent to you hits you with a melee attack that deals bleed
      damage, that creature must succeed at a Fortitude save (DC = 10 + 1/2 your
      character level + your Constitution modifier) or become blinded for 1d4
      rounds as your blood sprays it in the face. Additionally, if you have a
      special ability that deals bleed damage (such as a rogue's bleeding strike
      rogue talent), as a standard action, you can deal 1 point of bleed damage
      to yourself to spray blood in the face of an adjacent creature of your
      choice, causing the same effect. The creature only needs to attempt the
      saving throw for the first of its attacks that deals bleed damage.</p>
  tags:
    - Combat
type: feat
