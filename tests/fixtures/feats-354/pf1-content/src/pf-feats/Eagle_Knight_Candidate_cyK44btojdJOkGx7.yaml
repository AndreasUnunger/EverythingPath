name: Eagle Knight Candidate
system:
  description:
    value: >-
      <p><em>You have proven your courage and skill to both the Eagle Knights
      and the leaders of Andoran.</em></p><p><strong>Prerequisites</strong>:
      Character level 5th, convince four different Eagle Knights and either a
      member of the People's Council or an Andoran town mayor to write letters
      of commendation on your behalf.</p><p><strong>Benefits</strong>: Choose
      one branch of the Eagle Knights you hope to join. You gain a specific
      benefit based on this choice.</p><hr /><p><strong>Golden Legion</strong>:
      Each round as a move action, you may issue commands to all allies within
      30 feet who can see and hear you. Each affected ally that obeys your
      orders gains a +1 bonus on attack rolls, Armor Class, and saving throws
      during that round.</p><p><strong>Steel Falcons</strong>: You deal +1
      damage with weapon attacks directed at any creature against which you have
      concealment. If you have total concealment against the creature, this
      bonus increases to +2.</p><p><strong>Twilight Talons</strong>: During the
      surprise round, the threat range of your weapons doubles for any attack
      made against unaware targets. This does not stack with any other effect
      that expands the threat range of a weapon.</p>
  tags:
    - Achievement
type: feat
