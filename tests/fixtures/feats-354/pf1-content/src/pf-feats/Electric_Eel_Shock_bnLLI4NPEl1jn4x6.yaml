name: Electric Eel Shock
system:
  description:
    value: >-
      <p><em>You can stagger your opponents with jolts of
      electricity.</em></p><p><strong>Prerequisites</strong>: Wis 15, Electric
      Eel Style, Elemental Fist, Improved Unarmed Strike, base attack bonus +11
      or monk level 7th.</p><p><strong>Benefits</strong>: You gain one
      additional Elemental Fist (Advanced Player's Guide 158) attempt per day.
      Creatures that take electricity damage from your Elemental Fist attack
      must succeed at a Fortitude save (DC 10 + half your character level + your
      Wisdom modifier) or be staggered for 1 round. This also applies to
      creatures that take electricity damage from your Electric Eel Conduit feat
      while grappled.</p>
  tags:
    - Combat
type: feat
