name: Improved Devastating Strike
system:
  description:
    value: >-
      <p><em>The fury and power channeled through your attack is enough to kill
      a lesser being outright.</em></p><p><strong>Prerequisites</strong>:
      Devastating Strike, Vital Strike, base attack bonus
      +13.</p><p><strong>Benefits</strong>: Whenever you use Vital Strike,
      Improved Vital Strike, or Greater Vital Strike, you gain a bonus on attack
      rolls to confirm a critical hit equal to the bonus on damage rolls you
      gain from Devastating Strike.</p><h3>Combat Trick</h3><p>Whenever you use
      the Devastating Strike combat trick, increase the bonus damage to +6 on
      each of the extra sets of weapon damage dice. For weapons with more than
      one damage die, count all the weapon's base damage dice together as one
      set.</p>
  tags:
    - Combat
    - Combat Trick
type: feat
