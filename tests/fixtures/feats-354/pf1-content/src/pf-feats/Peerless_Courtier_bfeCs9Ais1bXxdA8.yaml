name: Peerless Courtier
system:
  description:
    value: >-
      <p><em>As a favored hero of the satrap, you've learned to translate skill
      at arms into social influence.</em></p><p><strong>Prerequisites</strong>:
      Cha 13, base attack bonus +3.</p><p><strong>Benefits</strong>: Choose one
      of the following skills: Bluff, Diplomacy, or Sense Motive. You can
      substitute your base attack bonus for your ranks in the chosen skill. That
      skill also becomes a class skill for you.</p><p><strong>Special</strong>:
      You can select this feat up to three times. Its effects do not stack. Each
      time you select this feat, choose an additional skill to benefit from this
      feat.</p>
  tags:
    - General
type: feat
