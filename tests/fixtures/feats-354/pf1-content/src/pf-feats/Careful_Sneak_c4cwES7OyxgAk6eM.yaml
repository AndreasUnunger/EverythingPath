name: Careful Sneak
system:
  description:
    value: >-
      <p><em>By taking your time, you negate penalties while sneaking in most
      armor.</em></p><p><strong>Prerequisites</strong>: Dex 13, Stealth 3
      ranks.</p><p><strong>Benefits</strong>: You do not apply the armor check
      penalty for light and medium armor on Stealth skill checks as long as you
      move half your speed or less. You still cannot run or charge while using
      Stealth in this way.</p>
  tags:
    - General
type: feat
