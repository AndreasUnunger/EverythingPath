name: Ephemeral Tread
system:
  description:
    value: >-
      <p><em>You are able to gain some abilities of a lucid dreamer while in
      your corporeal form.</em></p><p><strong>Prerequisites</strong>: Cha 15,
      Lucid Dreamer, Knowledge (planes) 5
      ranks.</p><p><strong>Benefits</strong>: Once per day, when you are in the
      Dimension of Dreams in your physical body, you can attempt an impossible
      action as a standard action as though you were in a lucid body. No
      positive modifiers can be applied to this roll other than your Charisma
      modifier.</p>
  tags:
    - General
type: feat
