name: Thrilling Vengeance
system:
  description:
    value: >-
      <p><em>Your savage rage thrills the crowd as you turn it upon a foe that
      has harmed you.</em></p><p><strong>Prerequisites</strong>: Base attack
      bonus +3, rage class feature.</p><p><strong>Benefits</strong>: When you
      spend a swift action to attempt a performance combat check while you're
      raging, you gain a +2 bonus on the check if the trigger involved you
      dealing damage to a creature that had hit you within the last
      round.</p><h3>Combat Trick</h3><p>You can spend 3 stamina points to
      increase the bonus on performance combat checks that you gain from
      Thrilling Vengeance by 2.</p>
  tags:
    - Combat
    - Performance
    - Combat Trick
type: feat
