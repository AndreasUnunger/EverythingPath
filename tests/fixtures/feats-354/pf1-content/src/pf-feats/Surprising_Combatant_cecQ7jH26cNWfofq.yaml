name: Surprising Combatant
system:
  description:
    value: >-
      <p><em>You can briefly trick your foes into discounting you as a
      combatant.</em></p><p><strong>Prerequisites</strong>: Improved Initiative,
      Bluff 3 ranks.</p><p><strong>Benefits</strong>: At the beginning of
      combat, after initiative is rolled but before the first round of combat
      begins, you can attempt a Bluff check as a free action. Each opponent who
      is aware of you must succeed at a Sense Motive check (DC equal to the
      result of your Bluff check). Failure means that an opponent is treated as
      if it were not aware of you when determining whether it is aware combat
      has begun. If none of your opponents are aware of you, you may act during
      the surprise round. If an opponent is effectively unaware of any foes, it
      cannot act during the surprise round.</p>
  tags:
    - Combat
type: feat
