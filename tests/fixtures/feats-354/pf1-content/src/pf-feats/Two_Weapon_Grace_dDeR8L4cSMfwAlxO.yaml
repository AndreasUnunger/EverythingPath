name: Two-Weapon Grace
system:
  description:
    value: >-
      <p><em>You can fight using agility instead of brute strength, even while
      fighting with two weapons.</em></p><p><strong>Prerequisites</strong>: Dex
      15; Fencing Grace, Slashing Grace, or Starry Grace; Two-Weapon Fighting;
      Weapon Finesse.</p><p><strong>Benefits</strong>: You can gain the benefit
      of the Fencing Grace, Slashing Grace, or Starry Grace feats while fighting
      with two weapons. Your penalties from two-weapon fighting increase by 2 on
      all attack rolls you make when doing so, and you can't decrease the
      penalties to less than -2 even if other abilities would reduce the
      penalties further. Add 1/2 your Dexterity bonus to damage with your
      off-hand weapon instead of 1/2 your Strength modifier. If you attack
      without using your off-hand weapon, you can use the aforementioned feats
      despite your other hand being occupied.</p><p>In addition, Two-Weapon
      Grace counts as Double Slice for the purposes of qualifying for the
      Two-Weapon Rend feat.</p><p><strong>Normal</strong>: You gain no benefit
      from the listed feats if you don&rsquo;t have a free hand.</p>
  tags:
    - Combat
type: feat
