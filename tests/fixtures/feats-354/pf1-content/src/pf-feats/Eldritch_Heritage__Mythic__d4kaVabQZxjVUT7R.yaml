name: Eldritch Heritage (Mythic)
system:
  description:
    value: >-
      <p><em>The blood of your sorcerous ancestor mingles with your mythic power
      to great effect.</em></p><p><strong>Prerequisites</strong>: Eldritch
      Heritage.</p><p><strong>Benefits</strong>: You gain sorcerer bloodline
      powers of the bloodline tied to Eldritch Heritage as if your sorcerer
      level were your character level - 2. For that bloodline's 1st-level
      bloodline power, use your full character level to determine its effect;
      for all other bloodline powers, treat your sorcerer level as your
      character level - 2.</p>
  tags:
    - General
    - Mythic
type: feat
