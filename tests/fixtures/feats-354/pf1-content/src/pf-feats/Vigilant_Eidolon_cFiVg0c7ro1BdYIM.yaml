name: Vigilant Eidolon
system:
  description:
    value: >-
      <p><em>Your eidolon is highly observant, and its link with you increases
      your own watchfulness.</em></p><p><strong>Prerequisites</strong>: Eidolon
      class feature.</p><p><strong>Benefits</strong>: While your eidolon is
      within your reach, you gain a +4 bonus on Perception checks. If you have
      10 or more ranks in Perception, this bonus increases to +8. This does not
      apply if your eidolon is helpless or unconscious.</p>
  tags:
    - General
type: feat
