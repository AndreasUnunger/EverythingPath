name: Pantheistic Blessing
system:
  description:
    value: >-
      <p><em>You are grated a small bit of divine power as a result of your
      veneration of a pantheon of
      deities.</em></p><p><strong>Prerequisites</strong>: Wis 13, must worship a
      pantheon of deities.</p><p><strong>Benefits</strong>: When taking this
      feat, select a pantheon from the list below. You gain the listed
      spell-like ability for your selected pantheon, usable once per day. If the
      granted spell allows a saving throw, the DC is equal to 10 + 1/2 your
      character level + your Charisma modifier.</p><p><strong>Special</strong>:
      If you act out of line with the tenets of your pantheons beliefs, you lose
      the ability to cast the granted spell-like ability until you have received
      an atonement for your transgression (as a cleric restoring lost class
      abilities).</p><hr /><h1>Pantheons of Golarion</h1><p>Each pantheon below
      notes the type of pantheon, as well as the member deities and the most
      common sorts of worshipers found within the faith. Additionally, each
      pantheon grants a spell-like ability to followers who take the Pantheistic
      Blessing feat. An asterisk after a deity&rsquo;s name indicates that he or
      she is the head of the pantheon.</p><h2>Archdevils (aligned, racial, and
      cultural)</h2><p><strong>Deities</strong> Asmodeus* (LE), Baalzebul (LE),
      Barbatos (LE), Belial (LE), Dispater (LE), Geryon (LE), Mammon (LE),
      Mephistopheles (LE), Moloch (LE)</p><p><strong>Common Believers
      </strong>Chelaxians, devils, diabolists, tieflings</p><p><strong>Granted
      Spell-Like Ability </strong>infernal healingISWG</p><h2>Ascended Pantheon
      (cultural)</h2><p><strong>Deities </strong>Cayden Cailean (CG), Iomedae
      (LG), Norgorber (NE), Aroden (prior to his death), sometimes Irori (LN)
      and Nethys (N)</p><p><strong>Common Believers</strong> Absalomians,
      adventurers, individualists</p><p><strong>Granted Spell-Like Ability
      </strong>divine favor</p><h2>Demon Lords (aligned, cultural, and
      racial)</h2><p><strong>Deities </strong>Abraxas (CE), Baphomet (CE),
      Cyth-V&rsquo;sug (CE), Deskari (CE), Flauros (CE), Lamashtu* (CE),
      Nocticula (CE), Pazuzu (CE), Shax (CE), Sifkesh (CE), Zura (CE), many
      others</p><p><strong>Common Believers</strong> drow, murderers,
      psychopaths</p><p><strong>Granted Spell-Like Ability</strong> lesser
      confusion</p><h2>Dwarven Pantheon (racial)</h2><p><strong>Deities
      </strong>Angradd (LG), Bolka (NG), Dranngvit (LN), Folgrit (LG),
      Grundinnar (LG), Kols (LN), Magrim (LN), Torag* (LG), Trudd
      (NG)</p><p><strong>Common Believers</strong> dwarves</p><p><strong>Granted
      Spell-Like Ability </strong>crafter&rsquo;s fortuneAPG</p><h2>Eldest
      (cultural and racial)</h2><p><strong>Deities </strong>Count Ranalc (CN),
      Green Mother (NE), Imbrex (LN), Lantern King (CN), Lost Prince (N), Magdh
      (LN), Ng (N), Ragadahn (CE), Shyka (N)</p><p><strong>Common
      Believers</strong> druids, gnomes, fey</p><p><strong>Granted Spell-Like
      Ability</strong> silent image</p><h2>Elven Pantheon
      (racial)</h2><p><strong>Deities</strong> Calistria* (CN), Desna (CG),
      Findeladlara (CG), Ketephys (CG), Nethys (N), Yuelral
      (NG)</p><p><strong>Common Believers</strong> elves,
      half-elves</p><p><strong>Granted Spell-Like Ability</strong>
      identify</p><h2>Empyreal Lords (aligned and
      cultural)</h2><p><strong>Deities </strong>Andoletta (LG), Arshea (NG),
      Korada (NG), Ragathiel (LG), Sinashakti (CG), Valani (CG), many
      others</p><p><strong>Common Believers</strong> aasimars, angels, Kellids,
      Varisians.</p><p><strong>Granted Spell-Like Ability</strong> protection
      from evil</p><h2>Order of the God Claw Pantheon
      (aligned)</h2><p><strong>Deities </strong>Abadar (LN), Asmodeus (LE),
      Iomedae (LG), Irori (LN), Torag (LG)</p><p><strong>Common
      Believers</strong> Hellknights</p><p><strong>Granted Spell-Like
      Ability</strong> protection from chaos</p><h2>Sandpoint Pantheon
      (cultural)</h2><p><strong>Deities</strong> Abadar (LN), Desna (CG),
      Erastil (LG), Gozreh (N), Sarenrae (NG), Shelyn (NG)</p><p><strong>Common
      Believers</strong> natives of the Lost Coast</p><p><strong>Granted
      Spell-Like Ability </strong>sanctuary</p><h2>Taldan Pantheon
      (cultural)</h2><p><strong>Deities </strong>Abadar (LN), Cayden Cailean
      (CG), Norgorber (NE), Shelyn (NG)</p><p><strong>Common Believers
      </strong>Taldan nationalists</p><p><strong>Granted Spell-Like
      Ability</strong> shield of faith</p><h2>Vudrani Pantheon
      (cultural)</h2><p><strong>Deities</strong> Chamidu (N), Dhalavei (LE),
      Gruhastha (LG), Irori* (LN), Lahkgya (CE), Likha (N), Ragdya (N), Raumya
      (NE), Suyuddha (LN), Vineshvakhi (LN), Vritra (LE), thousands of other
      deities</p><p><strong>Common Believers</strong>
      Vudrani</p><p><strong>Granted Spell-Like Ability</strong> true strike</p>
  tags:
