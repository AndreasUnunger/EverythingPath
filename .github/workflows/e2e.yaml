name: Trusted E2E smoke

on:
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: Full commit SHA reviewed for secret-backed execution
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: e2e-ci-slot-0
  cancel-in-progress: false

jobs:
  smoke:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      inputs.reviewed_sha == github.sha
    environment: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify provisioned resources and run smoke
        run: pnpm test:e2e --resources e2e/resources.ci.json
        env:
          E2E_TRUSTED_EXECUTION: 'true'
          E2E_REVIEWED_SHA: ${{ inputs.reviewed_sha }}
          CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
      - name: Retain sanitized evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-safe-${{ github.run_id }}-${{ github.run_attempt }}
          path: e2e-artifacts/e2e-local-ci-slot-0/
          retention-days: 30
          if-no-files-found: ignore
