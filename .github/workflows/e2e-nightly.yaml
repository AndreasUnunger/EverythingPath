name: E2E nightly

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: Full commit SHA reviewed for secret-backed execution
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: e2e-ci-slot-0
  cancel-in-progress: false

jobs:
  compatibility:
    # Scheduled default-branch code or an owner-reviewed manual SHA only.
    # Never use pull_request_target or give fork/bot jobs service credentials.
    if: >-
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.reviewed_sha == github.sha))
    environment: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Start twelve-minute setup and execution budget
        run: echo "E2E_DEADLINE=$(( $(date +%s) + 720 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        timeout-minutes: 1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        timeout-minutes: 1
      - uses: actions/setup-node@v4
        timeout-minutes: 1
        with:
          node-version: 22
          cache: pnpm
      - name: Disable unrelated Google Chrome apt source
        timeout-minutes: 1
        run: |
          # Playwright downloads its own Chromium. An inconsistent Chrome apt
          # index must not prevent installation of Ubuntu browser dependencies.
          for source in /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            [ -f "$source" ] || continue
            if grep -Eq 'https?://dl\.google\.com/linux/(chrome|chrome-stable)/deb' "$source"; then
              sudo mv -- "$source" "${source}.disabled"
            fi
          done
      - name: Install dependencies and browsers within the remaining budget
        run: |
          remaining=$(( E2E_DEADLINE - $(date +%s) ))
          [ "$remaining" -gt 0 ] || exit 1
          timeout --signal=INT --kill-after=5s "${remaining}s" bash -c 'pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium webkit firefox'
      - name: Run nightly compatibility journeys
        id: journey
        run: |
          remaining=$(( E2E_DEADLINE - $(date +%s) ))
          [ "$remaining" -gt 0 ] || exit 1
          timeout --signal=INT --kill-after=5s "${remaining}s" pnpm test:e2e --resources e2e/resources.ci.json --nightly
        env:
          E2E_TRUSTED_EXECUTION: 'true'
          E2E_REVIEWED_SHA: ${{ github.sha }}
          CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
      - name: Retain sanitized evidence
        timeout-minutes: 1
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-safe-${{ github.run_id }}-${{ github.run_attempt }}
          path: e2e-artifacts/e2e-local-ci-slot-0/
          retention-days: 30
          if-no-files-found: error

      - name: Record nightly outcome
        if: ${{ always() }}
        run: |
          if ! pnpm exec tsx e2e/nightly-triage.ts summarize; then
            echo '{"failures":["infrastructure"]}' > nightly-summary.json
          fi
      - name: Retain recurrence summary
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: nightly-summary
          path: nightly-summary.json
          retention-days: 30
          if-no-files-found: error

  triage:
    if: ${{ always() && needs.compatibility.result != 'skipped' && needs.compatibility.result != 'cancelled' }}
    needs: [compatibility]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: nightly-summary
      - name: Create or update recurring failure issues
        run: pnpm exec tsx e2e/nightly-triage.ts publish
        env:
          GH_TOKEN: ${{ github.token }}
