name: E2E nightly

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: Full commit SHA reviewed for secret-backed execution
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: e2e-ci-slot-0
  cancel-in-progress: false

jobs:
  compatibility:
    # Scheduled default-branch code or an owner-reviewed manual SHA only.
    # Never use pull_request_target or give fork/bot jobs service credentials.
    if: >-
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.reviewed_sha == github.sha))
    uses: ./.github/workflows/e2e-runner.yaml
    with:
      suite: nightly

  triage:
    if: ${{ always() && needs.compatibility.result != 'skipped' && needs.compatibility.result != 'cancelled' }}
    needs: [compatibility]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: nightly-summary
      - name: Create or update recurring failure issues
        run: pnpm exec tsx e2e/nightly-triage.ts publish
        env:
          GH_TOKEN: ${{ github.token }}
