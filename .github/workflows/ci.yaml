name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify committed Convex generated files
        run: pnpm check:convex-generated

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test && pnpm test:build

      - name: Build web application without backend credentials
        run: pnpm build && pnpm build:web
        env:
          NEXT_PUBLIC_CONVEX_URL: https://e2e-build-placeholder.convex.cloud
